# The range's audit: the findings known and owned (package 103a, `tools/audit_range.py`).
# It lives beside the tool and not under data/: the build's fingerprint hashes every file
# under data/, and an entry taken out of this list is no change of the game's rules.
#
# Every finding of the audit's full sweep (the trunk at 504a250, 1792 to 1825), each by
# its key with what it is, the years it bites (of the days the sweep samples), its basis,
# whose it is, its reason in a line, and the full sweep's count as its ceiling (`most`).
# No finding stands on which vessels a world's seed happened to draw: the list is the same
# at any seed, and the sampled sweep makes every entry the full sweep makes.
# `tests/test_range_audit.py` passes on these and fails on any finding not listed, on a
# listed one the sweep no longer makes, on a count above its ceiling and, in the slow tier,
# on years that are not the list's: a mend takes its entry out; new data comes in clean or
# adds its findings here with their reasons. This list is findings owned, never a way round
# a failure.
#
# FOR A BUILDER. The ratchet reads the whole tree and makes whole worlds, so it is the slow
# tier's. The checks a push runs are the fast tier (Linux and Windows) and do not include
# it; the whole suite is the lead's run on each trial merge, on Linux, and on Windows only
# when asked. So a port file added with its holder, its state or its market as one value
# passes the fast tier and fails at the merge: every `p-undated:` count goes over its
# ceiling. Before you push data, run `python tools/audit_range.py --known --no-worlds` (a
# few seconds): it marks what the list lacks and says which counts are over.
#
# The owners are three, and the rule between the first two is what would clear the finding,
# not what it is about. "a data fault for milestone 7c": a change to data alone, read by
# today's readers, clears it (the test plants that change for every finding so owned). "an
# engine fault": a reader or a key must come first, and no change of data clears it; its
# reason says what the check must become when that form exists. Listed and reported, not
# mended by the audit. "a judgement
# to be read against a source": the finding rests on `tools/range/reference.yaml`, a table
# written FROM MEMORY and read by nothing in the game (`basis: reference`); these are a kind
# of their own, counted apart, and the mechanical findings stand whole without them.
#
# Generated once from the run; the reasons written by kind. A reason is the audit's
# JUDGEMENT of the cause, not a source's.

