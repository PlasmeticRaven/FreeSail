# FreeSail: the nations table (spec M5 §24; package 35). Read by freesail/world/nations.py.
#
# Seven nations, who is at war with whom in June 1805, who issues letters of marque, the
# words of their flags for the lookout's "a stranger, her colours not made out" (package
# 36), and each port's nation (the port files say theirs; `ports` here is the index).
# The stance of a port toward a ship (spec M5 §23: open, neutral, closed, hostile) is
# read from this table and the port's own closures (`freesail/world/nations.py`,
# `Nations.stance`): a port is open to its own nation, hostile to a nation its own is at
# war with, closed to a nation it names under `closed_to` without war (a decree, a
# quarantine, a prefect's order), and neutral to the rest. A port's blockade is its port
# file's `state: blockaded` (package 39d: closed to the blockaders' enemies, the table's to
# the rest; Cadiz). Prizes, convoys and the blockading squadrons are M7's; the table is
# theirs to read.
#
# The wars are given with the date each began and the source the builder has for it. The
# sources are standard histories read from memory (no page is in docs/references/), and
# the file says so: every date here is FROM MEMORY and is to be checked against a printed
# history before milestone 7 builds prizes on it. What is certain is the state in June
# 1805: Britain at war with France, Spain and the Batavian Republic; the United States,
# Portugal and Denmark at peace with all of them.

as_of: 1805-06-01

nations:
  britain:
    name: Britain
    adjective: British
    people: the English          # the pilots' word for the ship's people
    names: english               # the names list in data/crew/names.yaml for her people
    colours: "the red, white or blue ensign by her admiral's squadron, the union jack at the bowsprit; a merchantman the red ensign"
    flag: "the red ensign"    # the flag's short word, for the lookout's "shows British colours, the red ensign" (package 36)
    letters_of_marque: true      # issued by the Admiralty against France, Spain and the Batavian Republic (from memory)
    closed_to: []
    # package 71 (the owner, 2026-10-24): the nation's habit in action over the role's figures
    # (spec M7 §9, §10; freesail/world/captains.py `Captain._habit`): the engaging range
    # multiplied, the aim and the roll taken where the role's file names none
    habits:
      range_factor: 1.0
      aim: hull
      roll: down
      source: "the British habit of closing and firing low into the hull on the down-roll (Douglas 1820, part I; the single-ship actions of 1793 to 1815 in James); 70's judgement, moved here by the owner's word of 2026-10-24"
    # package 71 (spec M7 §3): her signal books' root under data/signals/ and whether it is a
    # well-built book or the basic system every nation stands on (docs/design/Design-Signals.md)
    signals: {root: britain, system: well-built}
    # package 73 (spec M7 §11; the owner's note 3): the marines' kit by nation, a key of
    # data/marines.yaml (the musket, the sergeant's and the officer's arms, the volley,
    # the share aloft); the detachment itself is the ship file's
    marines: {kit: british}
    # package 72 (spec M7 §22; docs/design/Design-Squadrons.md): the nation's naval knobs,
    # read by the world's business and the regimes (data/regimes.yaml): the British keep
    # the sea, engage, blockade Brest, and convoy their trade under a brig-sloop
    naval:
      keeps_the_sea: true
      keeps_port: false
      engages: true
      # package 79a (the brief's item 3): the blockades the sources give, each a port of
      # the chart with the dates of the blockade (`since`, `until`) and its own offshore
      # station and lee rendezvous where the blockade book's (Brest's) do not serve; drawn
      # by the business only between the dates. Brest's entry is 72's, the book's stations
      # (the Channel's two regions are the business-on free games': nothing new drawn there)
      blockades:
        - brest
        - {port: rochefort, since: 1803-06-01, until: 1805-07-12, offshore: {place: the point of Chassiron, within_nm: 15}, rendezvous: the Bay of Quiberon, source: "James vol. 4 p. 78: Collingwood and before him Calder blockading Missiessy's squadron in Rochefort in 1804, Calder close off the port on 2 August; p. 79: the blockaders under Graves put into Quiberon Bay in a south-westerly gale, January 1805; p. 47: Stirling raised the blockade of the road of Aix by Gardner's order on 12 July 1805, and Allemand sailed on the 16th. The beginning judgement (the war's first summer); the offshore station off Chassiron judgement (looked for: the blockaders' station off the Pertuis in James vols. 3 and 4)"}
        - {port: ferrol, since: 1804-12-12, offshore: {place: Cape Prior, within_nm: 15}, source: "James vol. 3 p. 333: off Ferrol, with five French and seven Spanish of the line ready for sea, cruised Cochrane's squadron of seven of the line at the war's beginning with Spain; p. 307: Calder sent to the station off Ferrol and Corunna in February 1805; p. 356: Calder off Cape Prior from March 1805, never more than nine of the line. The beginning Spain's declaration (the wars below); the end none in the pages read"}
        - {port: cadiz, since: 1804-12-12, until: 1805-04-09, offshore: {place: Cadiz, within_nm: 15}, source: "James vol. 3 p. 333: off Cadiz a squadron of five and occasionally six of the line under Orde at the beginning of 1805; p. 341: driven away by Villeneuve standing into the bay on 9 April 1805. The beginning Spain's declaration, Orde's first day not found in the pages read"}
        - {port: cadiz, since: 1805-05-31, offshore: {place: Cadiz, within_nm: 15}, source: "James vol. 3 p. 375: on 31 May 1805 a frigate and two brigs the only British force off Cadiz (the Lively; the Glorioso slipped out past them), the force the business draws for a blockade; Collingwood, chased off by the combined fleet on 20 August, resumed his station before daylight on the 21st with four of the line; p. 379: of Nelson's 27 sail, 22 cruised about fifteen miles off Cadiz and five under Louis close off the harbour: the offshore fifteen miles as the source gives them"}
        - {port: lorient, since: 1808-03-01, offshore: {place: the Isle of Groix, within_nm: 12}, source: "James vol. 4 pp. 312 to 313: in March 1808 Lorient, with three or four of the line ready or fitting, watched by the Impetueux and Saturn, 74s, the frigates Aigle and Narcissus and two or three smaller vessels; no blockade of Lorient in 1803 to 1805 in the pages read (the Didon sailed from it on 2 May 1805, vol. 3 p. 350). The offshore station off Groix and its miles judgement"}
      convoys: true
      convoy_escort: brig-sloop
      privateers: "chase what pays"
      source: "the British practice of 1803 to 1805: the close blockade of Brest under Cornwallis, the convoys under the Regulations, the single-ship actions sought; every key's source below"
      # package 79a (the brief's item 1): each knob's source by work, volume and page, or
      # judgement with what was looked for; no figure moved
      sources:
        keeps_the_sea: "James vol. 3 p. 307: Cornwallis kept the blockade of Brest for 22 months, two boisterous winters among them, with a force not exceeding eleven of the line against 21; vol. 4 p. 286: the Brest ships of 1808 kept in port by the vigilance of Gambier's Channel fleet"
        keeps_port: "the converse of keeps_the_sea (James vol. 3 p. 307)"
        engages: "judgement: the single-ship actions are the far fight's and the action's (package 74; the brief's item 5)"
        blockades: "the entries' own sources above; the Texel's Dutch squadron of seven (James vol. 3 p. 309) lies off the chart and is not drawn (three British ships were all the North Sea required in 1803, vol. 3 pp. 169 to 170)"
        convoys: "the Regulations 1806 pp. 398 to 403, Convoys; Niles vol. VII p. 175: masters prosecuted for sailing without convoy"
        convoy_escort: "James vol. 3 p. 259, vol. 4 p. 91, vol. 5 p. 389, vol. 6 p. 70: a ship-sloop or brig-sloop over the smaller convoys (data/regimes.yaml `escorting`)"
        privateers: "judgement: the British privateer's prey not looked for in this package (her letters of marque the nation's entry above)"
  france:
    name: France
    adjective: French
    people: the French
    names: french                # a short list in the port files (Brest's pilots); none in names.yaml
    colours: "the tricolour, blue at the hoist, white, red in the fly (the ensign of 1794)"
    flag: "the tricolour"    # the flag's short word, for the lookout's "shows British colours, the red ensign" (package 36)
    letters_of_marque: true      # the corsairs of St Malo, Dunkirk and Bordeaux (from memory)
    closed_to: []
    # package 71 (the owner, 2026-10-24): the nation's habit in action over the role's figures
    # (spec M7 §9, §10; freesail/world/captains.py `Captain._habit`): the engaging range
    # multiplied, the aim and the roll taken where the role's file names none
    habits:
      range_factor: 2.0
      aim: rigging
      roll: up
      source: "the French habit of engaging at long range and firing high at the rigging on the up-roll, to cripple and escape (Douglas 1820, part I; the commonplaces of the period); 70's judgement, moved here"
    # package 71 (spec M7 §3): her signal books' root under data/signals/ and whether it is a
    # well-built book or the basic system every nation stands on (docs/design/Design-Signals.md)
    signals: {root: france, system: well-built}
    # package 73 (spec M7 §11; the owner's note 3): the marines' kit by nation, a key of
    # data/marines.yaml (the musket, the sergeant's and the officer's arms, the volley,
    # the share aloft); the detachment itself is the ship file's
    marines: {kit: french}
    # package 72 (spec M7 §22): the French keep port under the blockade and slip out when
    # it is blown off; a frigate in ordinary at Brest with her sortie; the corsairs chase
    # what pays
    naval:
      keeps_the_sea: false
      keeps_port: true
      engages: false
      blockades: []
      convoys: false
      slips_out_when_blown_off: true
      # package 79a (the brief's item 3): the ships in ordinary of the ports the sources
      # name beside Brest's (72's, kept: the Channel's regions draw nothing new); a ship
      # with a `sortie` slips out when the offing is clear, one with none is commissioned
      # by the business after the regime's delay for an intent of France's
      in_ordinary:
        - {port: brest, description: frigate, sortie: "cruise off the Lizard within 20 miles"}
        - {port: rochefort, description: frigate, sortie: "cruise off the Baleines within 20 miles", source: "James vol. 4 p. 79: Missiessy out of Rochefort on 11 January 1805 in the blockaders' absence; vol. 4 p. 47: Allemand out four days after the blockade was raised; a frigate for the squadrons (the ship files have no ship of the line for the far body); judgement on the station"}
        - {port: lorient, description: frigate, source: "James vol. 3 p. 350: the Didon sailed from Lorient on 2 May 1805 with Napoleon's duplicates, Lorient unblockaded in the pages read: a frigate commissioned for a cruise or a passage, not a sortie"}
      privateers: "chase what pays"
      source: "the Brest fleet and frigates keeping port under the blockade and sailing when the blockaders were off their station; every key's source below"
      sources:
        keeps_the_sea: "James vol. 3 p. 170: the French ready for sea at Brest made no attempt to sail when the blockaders retired in the gales of Christmas 1803; p. 307: 21 of the line kept in Brest by eleven"
        keeps_port: "as keeps_the_sea; James vol. 3 pp. 307 to 308: the van of nine came out off the Black Rocks on 15 April 1805 and returned into port after manoeuvring between Bertheaume and Camaret; pp. 308 to 309: the fleet's anchorage outside the Goulet under 150 guns"
        engages: "judgement: the fighting habits are the far fight's and the action's (package 74; the brief's item 5)"
        blockades: "none: no French blockade of a port of the chart in James vols. 3 and 4 (looked for); judgement"
        convoys: "James vol. 4 p. 383 (a convoy of ten sail of coasters under a gun-boat on the coast of Italy, 1808) and vol. 5 p. 36 (another convoy of about 30 sail in the Maumusson passage, 1810) number French coasting convoys under gun-vessels, which the business does not draw: the source gives France convoying her coasters; kept at false until re-measured"
        slips_out_when_blown_off: "James vol. 3 p. 314: eleven of the line out of Brest on 13 December 1805 in the absence of the blockading fleet; vol. 4 p. 79: Missiessy out of Rochefort in Graves's absence, January 1805; vol. 4 p. 390: Willaumez out of Brest in February 1809 after westerly gales had driven Gambier off"
        in_ordinary: "the entries' own sources above; Brest's frigate 72's (James vol. 4 p. 286: large frigates occasionally slipping out of the ports of the French Channel and Atlantic frontier, 1808)"
        privateers: "Nicolas vol. 1 p. 306 (18 May 1793): Nantes, Bordeaux and Lorient filled with English prizes to the French privateers and frigates; the corsairs of St Malo and Dunkirk looked for in James and Nicolas and not found"
  spain:
    name: Spain
    adjective: Spanish
    people: the Spaniards
    names: english
    colours: "red and yellow in three bands, the yellow twice the depth of the red (the naval ensign of 1785)"
    flag: "the red and yellow"    # the flag's short word, for the lookout's "shows British colours, the red ensign" (package 36)
    letters_of_marque: true
    closed_to: []
    # package 71 (the owner, 2026-10-24): the nation's habit in action over the role's figures
    # (spec M7 §9, §10; freesail/world/captains.py `Captain._habit`): the engaging range
    # multiplied, the aim and the roll taken where the role's file names none
    habits:
      range_factor: 1.5
      aim: rigging
      roll: up
      source: "between the French and the British: the Spanish fleet drilled with the French and fired high (Trafalgar's accounts, from memory); 70's judgement, moved here"
    # package 71 (spec M7 §3): her signal books' root under data/signals/ and whether it is a
    # well-built book or the basic system every nation stands on (docs/design/Design-Signals.md)
    signals: {root: basic, system: basic}
    # package 73 (spec M7 §11; the owner's note 3): the marines' kit by nation, a key of
    # data/marines.yaml (the musket, the sergeant's and the officer's arms, the volley,
    # the share aloft); the detachment itself is the ship file's
    marines: {kit: basic}
    # package 72 (spec M7 §22): the Spanish keep port with the French
    naval:
      keeps_the_sea: false
      keeps_port: true
      engages: false
      blockades: []
      convoys: false
      slips_out_when_blown_off: true
      # package 79a (the brief's item 3): the ships in ordinary at the two ports under
      # blockade the sources give
      in_ordinary:
        - {port: ferrol, description: frigate, sortie: "cruise off Cape Ortegal within 20 miles", source: "James vol. 3 p. 333: seven Spanish of the line ready for sea at Ferrol and three more fitting, January 1805; a frigate for them; the station judgement"}
        - {port: cadiz, description: frigate, sortie: "cruise off Cape Santa Maria within 20 miles", source: "James vol. 3 p. 333: seven Spanish of the line ready at Cadiz and four equipping; vol. 3 p. 375: the Glorioso put to sea from Cadiz on 31 May 1805 finding a frigate and two brigs the only British force off it; the station judgement"}
      privateers: "chase what pays"
      source: "Ferrol and Cadiz under blockade in 1805; every key's source below"
      sources:
        keeps_the_sea: "James vol. 3 p. 333: the Spanish ships ready for sea lay in Ferrol, Cadiz and Carthagena under the British squadrons off them"
        keeps_port: "as keeps_the_sea (James vol. 3 p. 333)"
        engages: "judgement (package 74's)"
        blockades: "none: no Spanish blockade in James vols. 3 and 4 (looked for); judgement"
        convoys: "judgement (looked for: a Spanish convoy in James vols. 3 and 4; the treasure ships of 1804, vol. 3 pp. 286 to 289, sailed as a squadron of frigates)"
        slips_out_when_blown_off: "James vol. 4 pp. 119 to 120: French frigates out of Cadiz in February 1806 when a strong easterly had driven the squadron west to Cape Santa Maria; vol. 3 p. 375: the Glorioso out when the watch was light"
        in_ordinary: "the entries' own sources above (James vol. 3 pp. 333 and 375)"
        privateers: "judgement (looked for in James vol. 3: a Spanish privateer waiting for the dispersed Newfoundland convoy, 1800, p. 36)"
  batavian-republic:
    name: the Batavian Republic
    adjective: Dutch
    people: the Dutch
    names: american              # the Dutch and German names of the american list serve for want of a Dutch one
    colours: "red, white and blue in horizontal bands, the Batavian jack with the maid of liberty at the hoist"
    flag: "the Batavian tricolour"    # the flag's short word, for the lookout's "shows British colours, the red ensign" (package 36)
    letters_of_marque: true
    closed_to: []
    # package 71 (the owner, 2026-10-24): the nation's habit in action over the role's figures
    # (spec M7 §9, §10; freesail/world/captains.py `Captain._habit`): the engaging range
    # multiplied, the aim and the roll taken where the role's file names none
    habits:
      range_factor: 1.0
      aim: hull
      roll: down
      source: "the Dutch fought close and hulled, Camperdown's (1797) butcher's bill the evidence (James, from memory); 70's judgement (its table named 'netherlands', which the table never matched: found on the way, package 71), moved here"
    # package 71 (spec M7 §3): her signal books' root under data/signals/ and whether it is a
    # well-built book or the basic system every nation stands on (docs/design/Design-Signals.md)
    signals: {root: basic, system: basic}
    # package 73 (spec M7 §11; the owner's note 3): the marines' kit by nation, a key of
    # data/marines.yaml (the musket, the sergeant's and the officer's arms, the volley,
    # the share aloft); the detachment itself is the ship file's
    marines: {kit: basic}
    # package 72 (spec M7 §22): the Dutch keep port in the Texel
    naval:
      keeps_the_sea: false
      keeps_port: true
      engages: true
      blockades: []
      convoys: false
      privateers: "chase what pays"
      source: "the Texel squadron; every key's source below"
      sources:
        keeps_port: "James vol. 3 p. 309: the Texel squadron of seven, in Napoleon's design of 1805"
        keeps_the_sea: "as keeps_port (James vol. 3 p. 309)"
        engages: "judgement (package 74's)"
        blockades: "none: the Texel lies off the chart, and no Dutch port is in its index (data/nations.yaml `ports:`); no blockade of the Texel named in James vols. 3 and 4 (three British ships all the North Sea required in 1803, James vol. 3 pp. 169 to 170); judgement"
        convoys: "judgement (not looked for: the Dutch trade lies off the chart)"
        privateers: "judgement (not looked for)"
  united-states:
    name: the United States
    adjective: American
    people: the Americans
    names: american
    colours: "fifteen stripes and fifteen stars (the flag of 1795 to 1818)"
    flag: "the stars and stripes"    # the flag's short word, for the lookout's "shows British colours, the red ensign" (package 36)
    letters_of_marque: false     # none issued in 1805; the Barbary war was the Navy's (from memory)
    closed_to: []
    # package 71 (the owner, 2026-10-24): the nation's habit in action over the role's figures
    # (spec M7 §9, §10; freesail/world/captains.py `Captain._habit`): the engaging range
    # multiplied, the aim and the roll taken where the role's file names none
    habits:
      range_factor: 1.0
      aim: hull
      roll: down
      source: "the American frigates of 1812 fired low and fast into the hull (the Constitution's and the United States's actions, from memory); 70's judgement, moved here"
    # package 71 (spec M7 §3): her signal books' root under data/signals/ and whether it is a
    # well-built book or the basic system every nation stands on (docs/design/Design-Signals.md)
    signals: {root: basic, system: basic}
    # package 73 (spec M7 §11; the owner's note 3): the marines' kit by nation, a key of
    # data/marines.yaml (the musket, the sergeant's and the officer's arms, the volley,
    # the share aloft); the detachment itself is the ship file's
    marines: {kit: basic}
    # package 72 (spec M7 §22): the Americans of 1812 keep the sea in single ships and
    # fight single actions; at peace in 1805, so nothing of it is drawn
    naval:
      keeps_the_sea: true
      keeps_port: false
      engages: true
      single_actions: true
      blockades: []
      convoys: false
      privateers: "chase what pays"
      source: "the frigate actions of 1812; at peace in 1805; every key's source below"
      sources:
        keeps_the_sea: "judgement: the frigate actions of 1812 are James vols. 5 and 6 and the action's (package 74); at peace in 1805, nothing of it drawn"
        keeps_port: "judgement: the converse of keeps_the_sea (package 74's)"
        engages: "judgement (package 74's, the brief's item 5)"
        single_actions: "judgement (package 74's, the brief's item 5)"
        blockades: "none: at peace in 1805; judgement"
        convoys: "judgement (looked for in Niles vols. VI to VIII: the American trade of 1814 under blockade, no American convoy found)"
        privateers: "Niles vol. VII p. 120: the Prince de Neufchatel's prizes in the Channel, 1814, a sloop of 70 tons with lumber, a brig of 137 tons with coffee, a transport, a cutter of 37 tons; p. 122: privateers taking fifteen or twenty prizes in twice as many days without firing a gun, and the ship James taken out of a convoy; p. 189: above 800 vessels captured in less than 24 months (the Glasgow resolution of 7 September 1814)"
  portugal:
    name: Portugal
    adjective: Portuguese
    people: the Portuguese
    names: english
    colours: "white, with the royal arms in the middle"
    flag: "the white ensign with the arms"    # the flag's short word, for the lookout's "shows British colours, the red ensign" (package 36)
    letters_of_marque: false
    closed_to: []
    # package 71 (the owner, 2026-10-24): the nation's habit in action over the role's figures
    # (spec M7 §9, §10; freesail/world/captains.py `Captain._habit`): the engaging range
    # multiplied, the aim and the roll taken where the role's file names none
    habits:
      range_factor: 1.0
      aim: hull
      roll: down
      source: "no habit of her own in the period's record read; the British, with whom her navy served (judgement, package 71)"
    # package 71 (spec M7 §3): her signal books' root under data/signals/ and whether it is a
    # well-built book or the basic system every nation stands on (docs/design/Design-Signals.md)
    signals: {root: basic, system: basic}
    # package 73 (spec M7 §11; the owner's note 3): the marines' kit by nation, a key of
    # data/marines.yaml (the musket, the sergeant's and the officer's arms, the volley,
    # the share aloft); the detachment itself is the ship file's
    marines: {kit: basic}
    # package 72 (spec M7 §22): no navy of her own at sea in 1805 to speak of
    naval:
      keeps_the_sea: false
      keeps_port: true
      engages: false
      blockades: []
      convoys: false
      privateers: none
      source: "judgement: no Portuguese naval doctrine looked for in the works held beyond James's pages on Lisbon (none read in this package)"
  denmark:
    name: Denmark
    adjective: Danish
    people: the Danes
    names: english
    colours: "the Dannebrog, a white cross on red, swallow-tailed in a King's ship"
    flag: "the Dannebrog"    # the flag's short word, for the lookout's "shows British colours, the red ensign" (package 36)
    letters_of_marque: false
    closed_to: []
    # package 71 (the owner, 2026-10-24): the nation's habit in action over the role's figures
    # (spec M7 §9, §10; freesail/world/captains.py `Captain._habit`): the engaging range
    # multiplied, the aim and the roll taken where the role's file names none
    habits:
      range_factor: 1.0
      aim: hull
      roll: down
      source: "Copenhagen 1801: the Danish blockships hulled the British at close range (from memory); judgement, package 71"
    # package 71 (spec M7 §3): her signal books' root under data/signals/ and whether it is a
    # well-built book or the basic system every nation stands on (docs/design/Design-Signals.md)
    signals: {root: basic, system: basic}
    # package 73 (spec M7 §11; the owner's note 3): the marines' kit by nation, a key of
    # data/marines.yaml (the musket, the sergeant's and the officer's arms, the volley,
    # the share aloft); the detachment itself is the ship file's
    marines: {kit: basic}
    # package 72 (spec M7 §22): at peace, her navy in Copenhagen
    naval:
      keeps_the_sea: false
      keeps_port: true
      engages: true
      blockades: []
      convoys: false
      privateers: none
      source: "judgement: Denmark at peace in 1805; Copenhagen of 1801 and 1807 not looked for in this package"
  # package 39f, the Strait: Morocco, for Tangier and the African shore. The Emperor
  # Muley Soliman (Mawlay Sulayman, from 1792) at peace with every nation in June 1805:
  # no war in the table below, so a Moorish port is neutral to all and open to its own.
  # Each relation with its source or its judgement under `relations:` (a word for the
  # reader and for M7's world's business; the stance reads the wars and `closed_to`).
  morocco:
    name: Morocco
    adjective: Moorish
    people: the Moors
    names: english               # no Moorish names list; the pilots' names are the port file's
    colours: "plain red, the flag of the Alaouite sultans (the green star is of 1915)"
    flag: "the plain red"    # the flag's short word, for the lookout (package 36)
    letters_of_marque: false     # the Emperor's few cruisers at peace with all; judgement (his father had declared peace with all Europe, Lempriere 1800, p. 39, of Sidi Mahomet)
    closed_to: []
    # package 71 (the owner, 2026-10-24): the nation's habit in action over the role's figures
    # (spec M7 §9, §10; freesail/world/captains.py `Captain._habit`): the engaging range
    # multiplied, the aim and the roll taken where the role's file names none
    habits:
      range_factor: 1.0
      aim: hull
      roll: down
      source: "no record read; the common habit (judgement, package 71)"
    # package 71 (spec M7 §3): her signal books' root under data/signals/ and whether it is a
    # well-built book or the basic system every nation stands on (docs/design/Design-Signals.md)
    signals: {root: basic, system: basic}
    # package 73 (spec M7 §11; the owner's note 3): the marines' kit by nation, a key of
    # data/marines.yaml (the musket, the sergeant's and the officer's arms, the volley,
    # the share aloft); the detachment itself is the ship file's
    marines: {kit: basic}
    # package 72 (spec M7 §22): the Emperor's few cruisers, at peace with all
    naval:
      keeps_the_sea: false
      keeps_port: true
      engages: false
      blockades: []
      convoys: false
      privateers: none
      source: "judgement: the Emperor at peace with all (the relations below); his cruisers not looked for in the works held"
    relations:
      britain: "peace; the Emperor apparently prefers the English to any other European power and allows Gibraltar its cattle from Tangier, a grant of Muley Ismael (Purdy 1826, p. 5, quoting Jackson); the fleets water at Tetuan (p. 8)"
      spain: "peace since Muley Yazid's war of 1790 and 1791 on Ceuta (Lempriere 1800, pp. 318 and 326, the war's beginning); the peace of 1799 FROM MEMORY"
      france: "peace; JUDGEMENT (the Emperor cut his trade with Europe after the French invasion of Egypt in 1798, the encyclopaedia's 'Slimane of Morocco', read 2026-10-10, but made no war)"
      united-states: "peace since September 1803, when Preble met the Emperor at Tangier and the treaty of 1786 was confirmed; Morocco had declared war in June 1802 (the encyclopaedia's 'Slimane of Morocco' and 'Moroccan–American Treaty of Friendship', read 2026-10-10)"
      portugal: "peace; JUDGEMENT"
      denmark: "peace; JUDGEMENT"
      batavian-republic: "peace; JUDGEMENT"
      algiers: "peace; JUDGEMENT (package 79c: neighbours on the Barbary shore, no war between them read)"
      # package 79d: the Italian states and the King of Sardinia, all at peace with the
      # Emperor in June 1805 (nothing read of their dealings with Morocco)
      sardinia: "peace; JUDGEMENT"
      naples: "peace; JUDGEMENT"
      etruria: "peace; JUDGEMENT"
      liguria: "peace; JUDGEMENT"
      papal-state: "peace; JUDGEMENT"

  # package 79c: the regency of Algiers, for Algiers and Oran (the Mediterranean's west
  # block), data alone in Morocco's form. The Dey's corsairs (the reis's cruisers, the
  # regency's whole navy and its revenue with the tributes) are noted here and not
  # modelled: the brief, and the naval entry below. Oran and Mers-el-Kebir the regency's
  # since Spain gave them up in 1792 (Tofiño 1787, pp. 147 to 149, describes them Spanish;
  # the cession FROM MEMORY). The relations from the works on file where they speak
  # (James), else from memory, said so.
  algiers:
    name: Algiers
    adjective: Algerine
    people: the Algerines
    names: english               # no Algerine names list; the pilots' names are the port files'
    colours: "the regency's flag of horizontal stripes, red, yellow and green (FROM MEMORY; the flags flown at Algiers varied, the corsairs' red with the sword of Ali among them)"
    flag: "the striped flag of Algiers"    # the flag's short word, for the lookout (package 36)
    letters_of_marque: false     # the corsairs are the Dey's own cruisers, at peace with Britain, noted and not modelled (the brief)
    closed_to: []
    habits:
      range_factor: 1.0
      aim: hull
      roll: down
      source: "no record read; the common habit (judgement, as Morocco's, package 71)"
    signals: {root: basic, system: basic}
    marines: {kit: basic}
    # the Dey's cruisers keep the sea against the nations at war with him or behind in their
    # tribute, and are not modelled (the brief): the knobs say none goes to sea in the world
    naval:
      keeps_the_sea: false
      keeps_port: true
      engages: false
      blockades: []
      convoys: false
      privateers: none
      source: "judgement: the regency's corsairs not modelled (the brief); James vol. 3 pp. 168 to 169 (1800 to 1802): the regencies of Algiers, Tripoli and Tunis paid tribute by the Christian powers to abstain from their commerce, the United States among them"
    relations:
      britain: "peace, with differences settled by the fleet's visits: James vol. 3 p. 235 (January 1804, Captain Keats in the Superb detached 'to settle some dispute with the Dey of Algiers', Nelson himself off the Barbary coast on the 17th) and pp. 333 to 334 (January 1805, the Superb rejoined 'from Algiers; whither she had been sent to arrange some difference with the Dey'); the fleet's bullocks and water from the Barbary shore"
      spain: "peace since the treaty of 1786 (FROM MEMORY); Oran and Mers-el-Kebir given up to the Dey in 1792 (FROM MEMORY), Spanish when Tofiño surveyed them (Tofiño 1787, pp. 147 to 149)"
      france: "peace since the treaty of December 1801, after the rupture over Egypt in 1798 (FROM MEMORY)"
      united-states: "peace by the treaty of 1795 and its tribute: James vol. 3 pp. 168 to 169 (the George Washington sent to Constantinople with the Dey's presents in October 1800, Algiers 'partially appeased' by the arrears of the subsidy); the Tripolitan war of 1801 to 1805 not Algiers' (James vol. 3 p. 169)"
      portugal: "war, the regency's corsairs taking Portuguese ships, a truce of 1793 broken and no peace until 1813 (FROM MEMORY; NOT entered in the wars below until a work on file gives it, so that the table's stance between them is neutral: for the lead)"
      denmark: "peace by treaty and tribute (FROM MEMORY)"
      batavian-republic: "UNVERIFIED (the Dutch paid tribute; the state of 1805 not found in the works on file); taken as peace"
      morocco: "peace; JUDGEMENT"

  # package 79d, the Gulf of Lion and the Tyrrhenian: the Italian states and the King of
  # Sardinia, data alone in Morocco's form (no code of their own). Each relation with its
  # source (James's Naval History vol. 3 on file) or FROM MEMORY or JUDGEMENT said so; the
  # stance reads the wars below and `closed_to`, and none of the five is at war with
  # anyone in June 1805, so their ports are neutral to every other nation and open to
  # their own.
  #
  # The King of Sardinia (Victor Emmanuel I from 1802), his mainland French and his court
  # at Cagliari since 1799 (FROM MEMORY). The Maddalena and Cagliari are his.
  sardinia:
    name: Sardinia
    adjective: Sardinian
    people: the Sardinians
    names: english               # no names list of its own; the pilots' names are the port files'
    colours: "white, the red cross of St George with a Moor's head in each quarter, for the island, the arms of Savoy over (FROM MEMORY)"
    flag: "the Sardinian colours"    # the flag's short word, for the lookout (package 36)
    letters_of_marque: false     # judgement: his galleys and half-galleys kept against the Barbary corsairs
    closed_to: []
    habits:
      range_factor: 1.0
      aim: hull
      roll: down
      source: "no record read; the common habit (judgement, package 71's form)"
    signals: {root: basic, system: basic}
    marines: {kit: basic}
    naval:
      keeps_the_sea: false
      keeps_port: true
      engages: false
      blockades: []
      convoys: false
      privateers: none
      source: "judgement: the King's few galleys against the Barbary corsairs; no Sardinian doctrine looked for in James vols. 3 and 4"
    relations:
      britain: "peace; Nelson's fleet watered in the Maddalena, anchoring in Agincourt Sound on 31 October 1803 (James vol. 3 p. 177), and in the gulf of Palmas and the bay of Cagliari in 1805; Sardinia 'gradually becoming French ... although under the mask of a rigid neutrality' (James vol. 3 p. 176)"
      france: "peace and a rigid neutrality (James vol. 3 p. 176); the King's mainland French since 1798 to 1799 (FROM MEMORY)"
      spain: "peace; JUDGEMENT"
      naples: "peace; JUDGEMENT"
      morocco: "peace; JUDGEMENT"
  # The Two Sicilies (Ferdinand IV at Naples), neutral by the treaty of Florence of 28 March
  # 1801, by which Naples ceded Porto-Longone and its part of Elba to France (James vol. 3
  # p. 77); a treaty of neutrality with France of 21 September 1805, the coalition's troops
  # landed in November, the French occupation of February 1806 and Joseph king from March
  # (FROM MEMORY): after this table's date, said and not modelled.
  naples:
    name: Naples
    adjective: Neapolitan
    people: the Neapolitans
    names: english
    colours: "white, with the arms of the Two Sicilies (FROM MEMORY)"
    flag: "the white with the arms"
    letters_of_marque: false     # judgement: the King's frigates and gunboats against the Barbary corsairs
    closed_to: []
    habits:
      range_factor: 1.0
      aim: hull
      roll: down
      source: "no record read; the common habit (judgement, package 71's form)"
    signals: {root: basic, system: basic}
    marines: {kit: basic}
    naval:
      keeps_the_sea: false
      keeps_port: true
      engages: false
      blockades: []
      convoys: false
      privateers: none
      source: "judgement: neutral and in port in 1805; three Neapolitan frigates were to have joined Ganteaume in 1801 (James vol. 3 p. 75)"
    relations:
      britain: "peace: 'except Naples, every state in the two Sicilies was obedient to the nod of Buonaparte' (James vol. 3 p. 176); Nelson's despatches carried to Naples by his frigates (James vol. 3, 1805)"
      france: "peace by the treaty of 28 March 1801 (James vol. 3 p. 77) and the neutrality of 21 September 1805; war and the French occupation from February 1806 (FROM MEMORY), beyond this table's date"
      spain: "peace; JUDGEMENT (the two Bourbon crowns)"
      sardinia: "peace; JUDGEMENT"
      morocco: "peace; JUDGEMENT"
  # The Kingdom of Etruria (Tuscany as Bonaparte gave it to the Bourbons of Parma by the
  # treaty of Aranjuez of 21 March 1801; Charles Louis under the queen regent Maria Luisa,
  # a Spanish infanta, from 1803; FROM MEMORY), neutral and French-leaning in June 1805;
  # Leghorn its port; annexed to France in December 1807 (FROM MEMORY).
  etruria:
    name: Etruria
    adjective: Etrurian
    people: the Tuscans
    names: english
    colours: "white, with the arms of the Bourbon-Parma kings of Etruria (FROM MEMORY)"
    flag: "the Tuscan white"
    letters_of_marque: false     # judgement: no Etrurian cruisers looked for
    closed_to: []
    habits:
      range_factor: 1.0
      aim: hull
      roll: down
      source: "no record read; the common habit (judgement, package 71's form)"
    signals: {root: basic, system: basic}
    marines: {kit: basic}
    naval:
      keeps_the_sea: false
      keeps_port: true
      engages: false
      blockades: []
      convoys: false
      privateers: none
      source: "judgement: no Etrurian navy to speak of, the kingdom at peace and Leghorn a neutral port; no Etrurian vessel looked for beyond James vols. 3 and 4"
    relations:
      britain: "peace; 'Tuscany was gradually becoming French' (James vol. 3 p. 176); Leghorn neutral and French-leaning, open by the table (JUDGEMENT: no closure of Leghorn to the British read)"
      france: "peace, a kingdom of Bonaparte's making (the treaty of Aranjuez, FROM MEMORY); the French took Porto Ferrajo's Tuscan part of Elba in 1801 to 1802 (James vol. 3 pp. 77 to 78)"
      spain: "peace; the queen regent a Spanish infanta (FROM MEMORY)"
      naples: "peace; JUDGEMENT"
      sardinia: "peace; JUDGEMENT"
  # The Ligurian Republic (Genoa), France's ally since 1797 and in all but name France's:
  # 'Genoa was as much France as Toulon, and in her dockyard was constructing a French 74,
  # to be named after her, the Genois' (James vol. 3 p. 176). Annexed to the Empire in June
  # 1805 (the decree of 4 June 1805, the Senate's petition of 25 May; FROM MEMORY): after it
  # Genoa is France's by the port file's dated nation. No war of its own with Britain is in
  # this table (none read), so before the annexation Genoa is neutral to a King's ship and
  # after it hostile.
  liguria:
    name: Liguria
    adjective: Ligurian
    people: the Genoese
    names: english
    colours: "the Ligurian colours, the red cross of St George on white with the republic's emblem (FROM MEMORY)"
    flag: "the Ligurian colours"
    letters_of_marque: false     # judgement: the Genoese privateers sailed under French commissions (not read)
    closed_to: []
    habits:
      range_factor: 1.0
      aim: hull
      roll: down
      source: "no record read; the common habit (judgement, package 71's form)"
    signals: {root: basic, system: basic}
    marines: {kit: basic}
    naval:
      keeps_the_sea: false
      keeps_port: true
      engages: false
      blockades: []
      convoys: false
      privateers: none
      source: "judgement: the republic's few vessels under French orders; the Genois, 74, building at Genoa for France (James vol. 3 p. 176)"
    relations:
      britain: "no war declared in the pages read; the port as much France's as Toulon (James vol. 3 p. 176); neutral by the table until the annexation, France's and hostile after (FROM MEMORY: the decree of 4 June 1805)"
      france: "allied since 1797 (FROM MEMORY); annexed to the Empire in June 1805"
      spain: "peace; JUDGEMENT"
      sardinia: "peace; JUDGEMENT"
      naples: "peace; JUDGEMENT"
  # The Papal state (Pius VII), neutral in June 1805; Civita Vecchia its port on the
  # Tyrrhenian; Ancona occupied by the French in November 1805 and Rome in February 1808
  # (FROM MEMORY), beyond this table's date.
  papal-state:
    name: the Papal state
    adjective: Papal
    people: the Pope's subjects
    names: english
    colours: "white and yellow, with the keys and the tiara (FROM MEMORY)"
    flag: "the Pope's white and yellow"
    letters_of_marque: false     # judgement: the Pope's few galleys against the Barbary corsairs
    closed_to: []
    habits:
      range_factor: 1.0
      aim: hull
      roll: down
      source: "no record read; the common habit (judgement, package 71's form)"
    signals: {root: basic, system: basic}
    marines: {kit: basic}
    naval:
      keeps_the_sea: false
      keeps_port: true
      engages: false
      blockades: []
      convoys: false
      privateers: none
      source: "judgement: no Papal navy to speak of in 1805, the Pope at peace with all; nothing looked for beyond James vols. 3 and 4"
    relations:
      britain: "peace; JUDGEMENT (no British dealing with the Papal ports read)"
      france: "peace by the Concordat of 1801 (FROM MEMORY)"
      spain: "peace; JUDGEMENT"
      naples: "peace; JUDGEMENT"
      sardinia: "peace; JUDGEMENT"

# Who is at war with whom in June 1805, each war once, with its beginning and its source.
wars:
  - between: [britain, france]
    since: 1803-05-18
    source: "the end of the Peace of Amiens: Britain's declaration of 18 May 1803 (from memory)"
  - between: [britain, batavian-republic]
    since: 1803-06-17
    source: "the Batavian Republic's declaration as France's ally, June 1803 (from memory; the day uncertain)"
  - between: [britain, spain]
    since: 1804-12-12
    source: "Spain's declaration of 12 December 1804, after the action off Cape Santa Maria of 5 October (from memory)"

# Alliances the stance does not read but the sightings and M7 may: Spain bound to France by
# the Treaty of San Ildefonso (1796) and the subsidy convention of 1803; the Batavian
# Republic a French client since 1795; Portugal neutral by the Treaty of Badajoz (1801)
# and England's old ally; Denmark in armed neutrality, Copenhagen bombarded only in 1807
# (all from memory).
allies:
  - [france, spain]
  - [france, batavian-republic]

# The ports and their nations (the port files repeat it; this is the index).
ports:
  falmouth: britain
  plymouth: britain
  brest: france
  st-marys: britain
  roscoff: france
  # package 39a, the Channel east: the islands the King's (Guernsey, Jersey and Alderney
  # held of the Crown, not of the realm: a British port in the table), St Malo and Morlaix
  # France's, hostile to a King's ship and open to a neutral by the wars below
  dartmouth: britain
  torbay: britain
  weymouth: britain
  st-peter-port: britain
  st-helier: britain
  alderney: britain
  st-malo: france
  morlaix: france
  # Biscay north (package 39b)
  lorient: france
  le-palais: france
  paimboeuf: france
  la-rochelle: france
  rochefort: france
  # Biscay south and Galicia (package 39c): the Gironde's road French as Biscay north's
  # ports; the Spanish ports at war with Britain since December 1804 (the wars above),
  # hostile to a King's ship and open to a neutral
  royan: france
  santander: spain
  ferrol: spain
  corunna: spain
  vigo: spain
  # Portugal and Cadiz (package 39d): Portugal neutral, open to all; Cadiz Spain's, and
  # blockaded (its port file's `state:`), closed to the blockaders' enemies
  oporto: portugal
  lisbon: portugal
  setubal: portugal
  lagos: portugal
  cadiz: spain
  # Madeira and the Western Islands (package 39e): Portuguese, neutral in 1805 by the
  # Treaty of Badajoz and open to every nation by the wars below
  funchal: portugal
  porto-santo: portugal
  angra: portugal
  ponta-delgada: portugal
  horta: portugal
  # the Strait (package 39f): Gibraltar the King's, the Spanish shore and Ceuta Spain's,
  # Tangier the Emperor of Morocco's
  gibraltar: britain
  algeciras: spain
  tarifa: spain
  ceuta: spain
  tangier: morocco
  # the Channel's east block (package 79b): the English ports the King's, the French ports
  # France's, hostile to a King's ship and open to a neutral by the wars above (Le Havre,
  # Boulogne, Calais and Dunkirk the invasion flotilla's ports of 1803 to 1805)
  portsmouth: britain
  poole: britain
  downs: britain
  dover: britain
  le-havre: france
  boulogne: france
  calais: france
  dunkirk: france
  # the Mediterranean west (package 79c, the regions mediterranean-west and balearics):
  # the Spanish ports at war with Britain since December 1804, hostile to a King's ship and
  # open to a neutral; Oran and Algiers the regency of Algiers', at peace with Britain
  malaga: spain
  almeria: spain
  cartagena: spain
  palma: spain
  port-mahon: spain
  ivica: spain
  oran: algiers
  algiers: algiers
  # the Gulf of Lion's block (package 79d): the French coast France's, hostile to a King's
  # ship and neutral to an American
  toulon: france
  marseille: france
  hyeres: france
  villefranche: france
  # the Ligurian sea's block (package 79d): Corsica and Elba France's, hostile to a King's
  # ship and neutral to an American; Genoa the Ligurian Republic's in the table (its file's
  # dated nation France's from the annexation of June 1805); Leghorn Etruria's and the
  # Maddalena the King of Sardinia's, neutral to a King's ship
  genoa: liguria
  leghorn: etruria
  porto-ferrajo: france
  bastia: france
  ajaccio: france
  san-fiorenzo: france
  maddalena: sardinia
  # the Tyrrhenian's block (package 79d): Cagliari and Alghero the King of Sardinia's, Civita
  # Vecchia the Pope's, Gaeta and Naples the King of Naples', all neutral to a King's ship
  cagliari: sardinia
  alghero: sardinia
  civita-vecchia: papal-state
  gaeta: naples
  naples: naples
