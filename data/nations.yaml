# FreeSail: the nations table (spec M5 §24; package 35). Read by freesail/world/nations.py.
#
# Seven nations, who is at war with whom in June 1805, who issues letters of marque, the
# words of their flags for the lookout's "a stranger, her colours not made out" (package
# 36), and each port's nation (the port files say theirs; `ports` here is the index).
# The stance of a port toward a ship (spec M5 §23: open, neutral, closed, hostile) is
# read from this table and the port's own closures (`freesail/world/nations.py`,
# `Nations.stance`): a port is open to its own nation, hostile to a nation its own is at
# war with, closed to a nation it names under `closed_to` without war (a decree, a
# quarantine, a prefect's order), and neutral to the rest. A port's blockade is its port
# file's `state: blockaded` (package 39d: closed to the blockaders' enemies, the table's to
# the rest; Cadiz). Prizes, convoys and the blockading squadrons are M7's; the table is
# theirs to read.
#
# The wars are given with the date each began and the source the builder has for it. The
# sources are standard histories read from memory (no page is in docs/references/), and
# the file says so: every date here is FROM MEMORY and is to be checked against a printed
# history before milestone 7 builds prizes on it. What is certain is the state in June
# 1805: Britain at war with France, Spain and the Batavian Republic; the United States,
# Portugal and Denmark at peace with all of them.

as_of: 1805-06-01

nations:
  britain:
    name: Britain
    adjective: British
    people: the English          # the pilots' word for the ship's people
    names: english               # the names list in data/crew/names.yaml for her people
    colours: "the red, white or blue ensign by her admiral's squadron, the union jack at the bowsprit; a merchantman the red ensign"
    flag: "the red ensign"    # the flag's short word, for the lookout's "shows British colours, the red ensign" (package 36)
    letters_of_marque: true      # issued by the Admiralty against France, Spain and the Batavian Republic (from memory)
    closed_to: []
    # package 71 (the owner, 2026-10-24): the nation's habit in action over the role's figures
    # (spec M7 §9, §10; freesail/world/captains.py `Captain._habit`): the engaging range
    # multiplied, the aim and the roll taken where the role's file names none
    habits:
      range_factor: 1.0
      aim: hull
      roll: down
      source: "the British habit of closing and firing low into the hull on the down-roll (Douglas 1820, part I; the single-ship actions of 1793 to 1815 in James); 70's judgement, moved here by the owner's word of 2026-10-24"
    # package 71 (spec M7 §3): her signal books' root under data/signals/ and whether it is a
    # well-built book or the basic system every nation stands on (docs/design/Design-Signals.md)
    signals: {root: britain, system: well-built}
    # package 72 (spec M7 §22; docs/design/Design-Squadrons.md): the nation's naval knobs,
    # read by the world's business and the regimes (data/regimes.yaml): the British keep
    # the sea, engage, blockade Brest, and convoy their trade under a brig-sloop
    naval:
      keeps_the_sea: true
      keeps_port: false
      engages: true
      blockades: [brest]
      convoys: true
      convoy_escort: brig-sloop
      privateers: "chase what pays"
      source: "the British practice of 1803 to 1805: the close blockade of Brest under Cornwallis, the convoy acts, the single-ship actions sought (Mahan, James, from memory); judgement"
  france:
    name: France
    adjective: French
    people: the French
    names: french                # a short list in the port files (Brest's pilots); none in names.yaml
    colours: "the tricolour, blue at the hoist, white, red in the fly (the ensign of 1794)"
    flag: "the tricolour"    # the flag's short word, for the lookout's "shows British colours, the red ensign" (package 36)
    letters_of_marque: true      # the corsairs of St Malo, Dunkirk and Bordeaux (from memory)
    closed_to: []
    # package 71 (the owner, 2026-10-24): the nation's habit in action over the role's figures
    # (spec M7 §9, §10; freesail/world/captains.py `Captain._habit`): the engaging range
    # multiplied, the aim and the roll taken where the role's file names none
    habits:
      range_factor: 2.0
      aim: rigging
      roll: up
      source: "the French habit of engaging at long range and firing high at the rigging on the up-roll, to cripple and escape (Douglas 1820, part I; the commonplaces of the period); 70's judgement, moved here"
    # package 71 (spec M7 §3): her signal books' root under data/signals/ and whether it is a
    # well-built book or the basic system every nation stands on (docs/design/Design-Signals.md)
    signals: {root: france, system: well-built}
    # package 72 (spec M7 §22): the French keep port under the blockade and slip out when
    # it is blown off; a frigate in ordinary at Brest with her sortie; the corsairs chase
    # what pays
    naval:
      keeps_the_sea: false
      keeps_port: true
      engages: false
      blockades: []
      convoys: false
      slips_out_when_blown_off: true
      in_ordinary:
        - {port: brest, description: frigate, sortie: "cruise off the Lizard within 20 miles"}
      privateers: "chase what pays"
      source: "the Brest fleet and frigates keeping port under the blockade and sailing when the blockaders were blown off (Mahan, from memory); the corsairs of St Malo and Dunkirk; judgement"
  spain:
    name: Spain
    adjective: Spanish
    people: the Spaniards
    names: english
    colours: "red and yellow in three bands, the yellow twice the depth of the red (the naval ensign of 1785)"
    flag: "the red and yellow"    # the flag's short word, for the lookout's "shows British colours, the red ensign" (package 36)
    letters_of_marque: true
    closed_to: []
    # package 71 (the owner, 2026-10-24): the nation's habit in action over the role's figures
    # (spec M7 §9, §10; freesail/world/captains.py `Captain._habit`): the engaging range
    # multiplied, the aim and the roll taken where the role's file names none
    habits:
      range_factor: 1.5
      aim: rigging
      roll: up
      source: "between the French and the British: the Spanish fleet drilled with the French and fired high (Trafalgar's accounts, from memory); 70's judgement, moved here"
    # package 71 (spec M7 §3): her signal books' root under data/signals/ and whether it is a
    # well-built book or the basic system every nation stands on (docs/design/Design-Signals.md)
    signals: {root: basic, system: basic}
    # package 72 (spec M7 §22): the Spanish keep port with the French
    naval:
      keeps_the_sea: false
      keeps_port: true
      engages: false
      blockades: []
      convoys: false
      slips_out_when_blown_off: true
      privateers: "chase what pays"
      source: "Ferrol and Cadiz under blockade in 1805 (from memory); judgement"
  batavian-republic:
    name: the Batavian Republic
    adjective: Dutch
    people: the Dutch
    names: american              # the Dutch and German names of the american list serve for want of a Dutch one
    colours: "red, white and blue in horizontal bands, the Batavian jack with the maid of liberty at the hoist"
    flag: "the Batavian tricolour"    # the flag's short word, for the lookout's "shows British colours, the red ensign" (package 36)
    letters_of_marque: true
    closed_to: []
    # package 71 (the owner, 2026-10-24): the nation's habit in action over the role's figures
    # (spec M7 §9, §10; freesail/world/captains.py `Captain._habit`): the engaging range
    # multiplied, the aim and the roll taken where the role's file names none
    habits:
      range_factor: 1.0
      aim: hull
      roll: down
      source: "the Dutch fought close and hulled, Camperdown's (1797) butcher's bill the evidence (James, from memory); 70's judgement (its table named 'netherlands', which the table never matched: found on the way, package 71), moved here"
    # package 71 (spec M7 §3): her signal books' root under data/signals/ and whether it is a
    # well-built book or the basic system every nation stands on (docs/design/Design-Signals.md)
    signals: {root: basic, system: basic}
    # package 72 (spec M7 §22): the Dutch keep port in the Texel
    naval:
      keeps_the_sea: false
      keeps_port: true
      engages: true
      blockades: []
      convoys: false
      privateers: "chase what pays"
      source: "the Texel squadron under blockade (from memory); judgement"
  united-states:
    name: the United States
    adjective: American
    people: the Americans
    names: american
    colours: "fifteen stripes and fifteen stars (the flag of 1795 to 1818)"
    flag: "the stars and stripes"    # the flag's short word, for the lookout's "shows British colours, the red ensign" (package 36)
    letters_of_marque: false     # none issued in 1805; the Barbary war was the Navy's (from memory)
    closed_to: []
    # package 71 (the owner, 2026-10-24): the nation's habit in action over the role's figures
    # (spec M7 §9, §10; freesail/world/captains.py `Captain._habit`): the engaging range
    # multiplied, the aim and the roll taken where the role's file names none
    habits:
      range_factor: 1.0
      aim: hull
      roll: down
      source: "the American frigates of 1812 fired low and fast into the hull (the Constitution's and the United States's actions, from memory); 70's judgement, moved here"
    # package 71 (spec M7 §3): her signal books' root under data/signals/ and whether it is a
    # well-built book or the basic system every nation stands on (docs/design/Design-Signals.md)
    signals: {root: basic, system: basic}
    # package 72 (spec M7 §22): the Americans of 1812 keep the sea in single ships and
    # fight single actions; at peace in 1805, so nothing of it is drawn
    naval:
      keeps_the_sea: true
      keeps_port: false
      engages: true
      single_actions: true
      blockades: []
      convoys: false
      privateers: "chase what pays"
      source: "the frigate actions of 1812 (James, from memory); judgement"
  portugal:
    name: Portugal
    adjective: Portuguese
    people: the Portuguese
    names: english
    colours: "white, with the royal arms in the middle"
    flag: "the white ensign with the arms"    # the flag's short word, for the lookout's "shows British colours, the red ensign" (package 36)
    letters_of_marque: false
    closed_to: []
    # package 71 (the owner, 2026-10-24): the nation's habit in action over the role's figures
    # (spec M7 §9, §10; freesail/world/captains.py `Captain._habit`): the engaging range
    # multiplied, the aim and the roll taken where the role's file names none
    habits:
      range_factor: 1.0
      aim: hull
      roll: down
      source: "no habit of her own in the period's record read; the British, with whom her navy served (judgement, package 71)"
    # package 71 (spec M7 §3): her signal books' root under data/signals/ and whether it is a
    # well-built book or the basic system every nation stands on (docs/design/Design-Signals.md)
    signals: {root: basic, system: basic}
    # package 72 (spec M7 §22): no navy of her own at sea in 1805 to speak of
    naval:
      keeps_the_sea: false
      keeps_port: true
      engages: false
      blockades: []
      convoys: false
      privateers: none
      source: "judgement"
  denmark:
    name: Denmark
    adjective: Danish
    people: the Danes
    names: english
    colours: "the Dannebrog, a white cross on red, swallow-tailed in a King's ship"
    flag: "the Dannebrog"    # the flag's short word, for the lookout's "shows British colours, the red ensign" (package 36)
    letters_of_marque: false
    closed_to: []
    # package 71 (the owner, 2026-10-24): the nation's habit in action over the role's figures
    # (spec M7 §9, §10; freesail/world/captains.py `Captain._habit`): the engaging range
    # multiplied, the aim and the roll taken where the role's file names none
    habits:
      range_factor: 1.0
      aim: hull
      roll: down
      source: "Copenhagen 1801: the Danish blockships hulled the British at close range (from memory); judgement, package 71"
    # package 71 (spec M7 §3): her signal books' root under data/signals/ and whether it is a
    # well-built book or the basic system every nation stands on (docs/design/Design-Signals.md)
    signals: {root: basic, system: basic}
    # package 72 (spec M7 §22): at peace, her navy in Copenhagen
    naval:
      keeps_the_sea: false
      keeps_port: true
      engages: true
      blockades: []
      convoys: false
      privateers: none
      source: "judgement"
  # package 39f, the Strait: Morocco, for Tangier and the African shore. The Emperor
  # Muley Soliman (Mawlay Sulayman, from 1792) at peace with every nation in June 1805:
  # no war in the table below, so a Moorish port is neutral to all and open to its own.
  # Each relation with its source or its judgement under `relations:` (a word for the
  # reader and for M7's world's business; the stance reads the wars and `closed_to`).
  morocco:
    name: Morocco
    adjective: Moorish
    people: the Moors
    names: english               # no Moorish names list; the pilots' names are the port file's
    colours: "plain red, the flag of the Alaouite sultans (the green star is of 1915)"
    flag: "the plain red"    # the flag's short word, for the lookout (package 36)
    letters_of_marque: false     # the Emperor's few cruisers at peace with all; judgement (his father had declared peace with all Europe, Lempriere 1800, p. 39, of Sidi Mahomet)
    closed_to: []
    # package 71 (the owner, 2026-10-24): the nation's habit in action over the role's figures
    # (spec M7 §9, §10; freesail/world/captains.py `Captain._habit`): the engaging range
    # multiplied, the aim and the roll taken where the role's file names none
    habits:
      range_factor: 1.0
      aim: hull
      roll: down
      source: "no record read; the common habit (judgement, package 71)"
    # package 71 (spec M7 §3): her signal books' root under data/signals/ and whether it is a
    # well-built book or the basic system every nation stands on (docs/design/Design-Signals.md)
    signals: {root: basic, system: basic}
    # package 72 (spec M7 §22): the Emperor's few cruisers, at peace with all
    naval:
      keeps_the_sea: false
      keeps_port: true
      engages: false
      blockades: []
      convoys: false
      privateers: none
      source: "judgement"
    relations:
      britain: "peace; the Emperor apparently prefers the English to any other European power and allows Gibraltar its cattle from Tangier, a grant of Muley Ismael (Purdy 1826, p. 5, quoting Jackson); the fleets water at Tetuan (p. 8)"
      spain: "peace since Muley Yazid's war of 1790 and 1791 on Ceuta (Lempriere 1800, pp. 318 and 326, the war's beginning); the peace of 1799 FROM MEMORY"
      france: "peace; JUDGEMENT (the Emperor cut his trade with Europe after the French invasion of Egypt in 1798, the encyclopaedia's 'Slimane of Morocco', read 2026-10-10, but made no war)"
      united-states: "peace since September 1803, when Preble met the Emperor at Tangier and the treaty of 1786 was confirmed; Morocco had declared war in June 1802 (the encyclopaedia's 'Slimane of Morocco' and 'Moroccan–American Treaty of Friendship', read 2026-10-10)"
      portugal: "peace; JUDGEMENT"
      denmark: "peace; JUDGEMENT"
      batavian-republic: "peace; JUDGEMENT"

# Who is at war with whom in June 1805, each war once, with its beginning and its source.
wars:
  - between: [britain, france]
    since: 1803-05-18
    source: "the end of the Peace of Amiens: Britain's declaration of 18 May 1803 (from memory)"
  - between: [britain, batavian-republic]
    since: 1803-06-17
    source: "the Batavian Republic's declaration as France's ally, June 1803 (from memory; the day uncertain)"
  - between: [britain, spain]
    since: 1804-12-12
    source: "Spain's declaration of 12 December 1804, after the action off Cape Santa Maria of 5 October (from memory)"

# Alliances the stance does not read but the sightings and M7 may: Spain bound to France by
# the Treaty of San Ildefonso (1796) and the subsidy convention of 1803; the Batavian
# Republic a French client since 1795; Portugal neutral by the Treaty of Badajoz (1801)
# and England's old ally; Denmark in armed neutrality, Copenhagen bombarded only in 1807
# (all from memory).
allies:
  - [france, spain]
  - [france, batavian-republic]

# The ports and their nations (the port files repeat it; this is the index).
ports:
  falmouth: britain
  plymouth: britain
  brest: france
  st-marys: britain
  roscoff: france
  # package 39a, the Channel east: the islands the King's (Guernsey, Jersey and Alderney
  # held of the Crown, not of the realm: a British port in the table), St Malo and Morlaix
  # France's, hostile to a King's ship and open to a neutral by the wars below
  dartmouth: britain
  torbay: britain
  weymouth: britain
  st-peter-port: britain
  st-helier: britain
  alderney: britain
  st-malo: france
  morlaix: france
  # Biscay north (package 39b)
  lorient: france
  le-palais: france
  paimboeuf: france
  la-rochelle: france
  rochefort: france
  # Biscay south and Galicia (package 39c): the Gironde's road French as Biscay north's
  # ports; the Spanish ports at war with Britain since December 1804 (the wars above),
  # hostile to a King's ship and open to a neutral
  royan: france
  santander: spain
  ferrol: spain
  corunna: spain
  vigo: spain
  # Portugal and Cadiz (package 39d): Portugal neutral, open to all; Cadiz Spain's, and
  # blockaded (its port file's `state:`), closed to the blockaders' enemies
  oporto: portugal
  lisbon: portugal
  setubal: portugal
  lagos: portugal
  cadiz: spain
  # Madeira and the Western Islands (package 39e): Portuguese, neutral in 1805 by the
  # Treaty of Badajoz and open to every nation by the wars below
  funchal: portugal
  porto-santo: portugal
  angra: portugal
  ponta-delgada: portugal
  horta: portugal
  # the Strait (package 39f): Gibraltar the King's, the Spanish shore and Ceuta Spain's,
  # Tangier the Emperor of Morocco's
  gibraltar: britain
  algeciras: spain
  tarifa: spain
  ceuta: spain
  tangier: morocco
