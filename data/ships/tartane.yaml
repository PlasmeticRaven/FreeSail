# the main mast à calcet, 59 pieds heel to head, 22 pouces at the deck, its head (the ton) 26 pieds, stepped 10 pieds 5 pouces before the middle (Forfait 1788 Table II, the Humble); short and stout, its head a square block pierced with sheaves for the halyards, no stays (Lescallier 1791 pp. 376-377): a pole, with no topmast, the topsail's yard hoisted on its head. Its heel on a keelson over the keel's upper edge (JUDGEMENT: none drawn), 2.72 m below the deck at side (Pages §6.4). Its rake: upright, by the owner's rule of 2026-11-20 (the better sailing of upright and slightly forward, measured: docs/dev/TuningNotes.md, the tartane's section); Chapman's Pl. LXII No. 16 draws a tartane's main upright (0.6 to 1.1 degrees aft, Pages §7). Provisional (truth 9), see gen_ships.py. Rating: main.lateen, main.topsail, main.treou, jib in 55 kn.
- id: main.mast
  class: mast
  x_m: 3.87
  height_m: 16.75
  rating_kn: 132.7
# the great lateen yard, the antenne, 75 pieds, 9¼ pouces in the slings, its ends 1½ pieds at the penne and ¾ at the car (Forfait 1788 Table II, 1.195 of her length: longer than the vessel); of two pieces of fir fished together, slung by its parrel a third of its length from the car (Lescallier 1791 pp. 378-379) at the main's hounds, where its jeers' block hangs at the foot of the ton (Tar §2.1, JUDGEMENT on the reading; Forfait p. 121); height_m the sling. Peaked so that the car is tacked at the stem (Forfait p. 121), an angle her report gives; Chapman's Pl. LXII peaks his tartane's main yard about 55 degrees on another rig (Pages §7, recorded). Not braced: its trim is its sheet's, its ourses' and its vangs'. Rating: main.lateen in 45 kn.
- id: main.lateen_yard
  class: lateen_yard
  'on': main.mast
  length_m: 24.36
  height_m: 8.31
  rating_kn: 25.9
# the topsail yard, 32 pieds, 6¼ pouces (Forfait 1788 Table II, the Humble), hoisted on the main's own head, its tye through the calcet's sheave, 3 pieds under the masthead (JUDGEMENT): on the pole main, no topmast. The Humble's topgallant yard, 24½ pieds, is not crossed: no topgallant (Tar-D §4.1; the owner's picture, Monleón's print and Röding show none). Braced 64 degrees from square, the cutter's topsail yard's (JUDGEMENT). Provisional (truth 9), see gen_ships.py. Rating: main.topsail in 40 kn.
- id: main.topsail.yard
  class: yard
  'on': main.mast
  length_m: 10.39
  height_m: 15.78
  brace_limit_deg: 64
  rating_kn: 22.0
# the tréou's yard, 41 pieds, 8½ pouces (Forfait 1788 Table II: the Espiègle's square yard and the square-sail column's), hoisted to the main's hounds, where it spreads the topsail's foot when it is up (the cutter's square-sail yard's place). Not crossed in plain sail: sent up with the tréou and struck with it, the period's way of setting it flying (Tar-D decision 9; the owner's reading of the prints, 2026-11-19: no yard under the topsail), so its sail is set flying. Braced 58 degrees from square, the cutter's square-sail yard's (JUDGEMENT). Provisional (truth 9), see gen_ships.py. Rating: main.treou in 22 kn.
