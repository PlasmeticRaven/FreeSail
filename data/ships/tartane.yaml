# The ground tackle (package 34, spec M5 §18): the anchors by the ship's size and the hemp cables by the fathom, every figure's rule in tools/gen_ships.py; chain cable is later than 1805 and the file says so.
ground_tackle:
  chain: false
  anchors:
  # The bowers: 5 cwt by the rule of five cwt to the hundred tons (100 tons burthen; the beam rule, two thirds the draught and the beam in cwt, gives 26.9), Luce 1866 ch. XIV. The cable 11 inches, half an inch to the foot of beam (judgement, unverified), rated as every rope by Luce ch. IV; two cables of 120 fathoms spliced on the best bower (Falconer 1780, CABLE; Lever 1808 p. 67). Her burthen Forfait's 100 tonneaux taken as tons (JUDGEMENT); her anchor let go by a watch too small for it calls all hands (package 116, let_go_anchor's too_few).
  - id: best_bower
    kind: bower
    name: the best bower
    weight_kg: 250.0
    cable_fathoms: 240.0
    cable_in: 11.0
    cable_kn: 187.5
  - id: small_bower
    kind: bower
    name: the small bower
    weight_kg: 250.0
    cable_fathoms: 120.0
    cable_in: 11.0
    cable_kn: 187.5
  # The kedge, an eighth of the bower (Luce 1866 ch. XIV), on a hawser of half the cable's size (judgement).
  - id: kedge
    kind: kedge
    name: the kedge
    weight_kg: 30.0
    cable_fathoms: 120.0
    cable_in: 5.5
    cable_kn: 46.9
crew:
  # Ten (Tar-D decision 15, §6.1): the master (patron) and the mate (second), six able seamen in two watches of three, a boy and a cook. JUDGEMENT within eight to twelve: Winfield's tartanas give no men (Winfield et al. 2023 pp. 1252-1253; VR-Sp §9), the prize papers the route; ten by the owner's word on what is not found.
  complement: 10
  # Her people's names from the french list in data/crew/names.yaml (Tar-D §6.4, the lead's nudge 38), which reads her as France's where a scenario gives no nation (world/nations.py); a scenario names her nation and her people as it will.
  names: french
  stations:
    # Hands per station, both watches together (Tar-D §6; JUDGEMENT): she has no tops, and her hands work aloft from the deck stations, as the cutter's. Forecastlemen, for the jib, the anchors and the great lateen's car and ourses: 3.
    forecastle: 3
    # Afterguard, at the lateens' sheets, the mizen and the helm: 4.
    afterguard: 4
    # Idlers: the trades below: 1.
    idlers: 1
  ratings:
    # Share of the seamen by rating (JUDGEMENT): a coaster's able seamen and her boy ordinary (Tar-D §6.1). Able: 0.86.
    able: 0.86
    ordinary: 0.14
    landsman: 0.0
  posts:
  # Station holders by post (spec M3 2.3): master and mate, as data/people/tartane.yaml gives them; names are drawn at muster.
  - post: master
  - post: mate
  idlers_by_trade:
    # How the idlers are made up (JUDGEMENT).
    cook: 1
  stores:
    # Water for a month: 10 men at a gallon a day, and some over (JUDGEMENT; Tar-D §11).
    water_tons: 3
    # Provisions: a month, a coaster's passage and its delays (JUDGEMENT).
    provisions_days: 30
    # The booms: a spare yard (Tar-D §11; JUDGEMENT after Luce 1866 ch. XVII, scaled down); see tools/ships/tartane.py.
    spare_spars:
      # A spare topsail yard (JUDGEMENT, after Luce 1866).
      yard: 1
    # Spare rope (JUDGEMENT).
    cordage_fathoms: 60
    # The carpenter's shot plugs (package 73, spec M7 §14): tapered plugs of soft wood with oakum and tallow, kept ready in action (the Regulations and Instructions 1806, the Carpenter; Falconer 1780, PLUG: 'shot-plugs ... to stop holes made by cannon shot'); the count by her class, judgement. A small trader's 2, the smack's.
    shot_plugs: 2
    # The sail room (spec 3b §6.3): her spare sails (Tar-D §11); see tools/ships/tartane.py.
    sails:
    # A second great lateen and jib, the sails she wears out ('shift the mainsail for a new one', Tar-D §5.4 item 5; JUDGEMENT).
    - kind: main.lateen
      canvas_no: 2
      condition: 100
    - kind: jib
      canvas_no: 2
      condition: 100
    # The bouffette and the storm jib, her storm canvas (Tar-D §11; spec 3b §6.4).
    - kind: main.bouffette
      canvas_no: 1
      condition: 100
    - kind: storm_jib
      canvas_no: 1
      condition: 100
  ration:
    # The ration (package 54, spec M7b 19): the Navy's table, the Regulations of 1806 (Sect. IX, Chap. I, Art. I), as data/crew/ration.yaml gives it; a coaster's articles promised the like, as the merchant brig's (judgement: no scale of the period's Mediterranean service is in the references).
    table: navy
    # Water drawn a man a day for his drink, his grog and the coppers: a gallon, the figure her water above is reckoned at (judgement).
    water_gallons: 1
  # The named people beyond the posts (package 35, spec M5 §22): the boy as the messenger; see data/people/tartane.yaml.
  people:
  # The mousse as the messenger (judgement, Tar-D §6.1), rated ordinary as the design rates him.
  - role: boy
    station: afterguard
    rating: ordinary
    messenger: true
# The hold (package 35, spec M5 §23): room for 50 tons of cargo beyond her own stores, 0.5 of the 100 tons burthen (a coaster's hold, her trade: judgement, the merchant brig's share; Falconer 1780, HOLD); see tools/gen_ships.py.
hold:
  capacity_tons: 50
# The pumps (package 73, spec M7 §13): the chain pump of Cole and Bentinck, a ton in 43 seconds and a half with four men (Falconer 1780, PUMP), and the common brake pump with two; the counts by the ship's class (Lavery, Arming and Fitting; Steel 1794); see tools/gen_ships.py. Two hand pumps, as the bilander's (JUDGEMENT).
pumps:
# A brake pump (the common or elm-tree pump): two men, 15 tons an hour fresh (judgement).
- id: pump.hand.1
  kind: hand
  name: the starboard pump
  tons_per_hour: 15.0
  hands: 2
- id: pump.hand.2
  kind: hand
  name: the larboard pump
  tons_per_hour: 15.0
  hands: 2
# The boats (package 35, spec M5 §23): their lengths by Luce 1866's rule ('Boats', 'Rules for Size of Boats for Ships-of-War': the launch 2.6 times the square root of the ship's length, the cutters 0.9 of it), the allowance after Steel 1794 vol. II and Falconer 1780 (BOAT, PINNACE, YAWL), the oars a thwart to three feet, the tons by Luce's weight rule for the boat herself; see tools/gen_ships.py.
boats:
# Her one boat, about 4.5 m (Tar-D §11, decision 19; JUDGEMENT on its size), a yawl by the house's kinds; towed astern on passage by her design, which the boat's towed key says once the engine's step A4 is merged.
- id: boat
  kind: yawl
  name: the boat
  length_ft: 15.0
  oars: 4
  crew: 5
  tons: 0.1
