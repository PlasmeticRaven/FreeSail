# The tartane Saint-Pierre: a Provençal coaster under a great lateen and a square topsail;
# Forfait 1788's Humble (Table II) drawn on Chapman 1768's French tartane (Pl. LVII
# No. 16, measured at her scale on the museum's photograph and never copied).
# Generated by tools/gen_ships.py (tools/ships/tartane.py, her lateens by
# tools/ships/lateen.py); edit those and rerun, do not edit this file. Her design:
# docs/design/Design-Ship-Tartane.md. Rope: the lugger's and the cutter's for like gear
# (judgement). Spar ratings are provisional, set for truth 9 with the M1 sail curves;
# see the script. Canvas: Steel 1794 vol. I; cloth ratings from the number by Luce
# App. E. Units: metres, m2, kg, kN. Comments mark judgements.
ship:
  name: Saint-Pierre
  rig: tartane
  era_notes: 'A Provençal tartane under a great lateen and a square topsail: one main mast à calcet, upright,
    with a whole lateen on a 75-pied yard slung at a third and a loose-footed square topsail on its head,
    a diminutive mizen raked aft with its lateen sheeted to an outrigger over the stern, one great jib
    on the berthelot over the éperon, and a square tréou set flying before the wind. Forfait 1788''s Humble
    of 100 tonneaux with topsail and mizen, 62¾ by 20⅓ pieds (20.38 by 6.60 m; Traité de la mâture, Table
    II), drawn on Chapman 1768''s French tartane (Pl. LVII No. 16) scaled to her; her draught 2.38 m on
    her load line, her waterline 18.47 m. Unarmed, a trader of ten: her master and mate, six seamen, a
    boy and a cook. Undated. See tools/ships/tartane.py for every figure''s source.'
  descriptions:
    tartane:
      rig: a tartane
      what: a tartane, a coaster under her great lateen, deep laden
      note: 'The tops make her out a tartane: one great lateen yard longer than her hull peaked high over
        a short mast, a small square topsail at its head and a diminutive mizen; the period named the
        type on sight (Falconer 1780, TARTANE: the sail ''extremely large''); judgement on the words (Tar-D
        §9). ''Deep laden'' the merchantman''s look, as the merchant brig''s and the bilander''s. Unarmed,
        her file''s default; a merchant''s role (Build-Ships.md §8.2). Her fisherman''s description waits
        on a fishing-grounds file of the Gulf of Lion (the card).'
      fit: unarmed
      roles:
      - merchant
