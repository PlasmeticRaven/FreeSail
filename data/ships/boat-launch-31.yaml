# The frigate's launch, a ten-oared boat with a lug, fit to weigh an anchor (package 82, item 4): the pattern of the frigate's launch (31 ft).
# Generated by tools/gen_ships.py; edit that script and rerun, do not edit this file.
# Breadth by Luce 1866's rule, a quarter of the length; the rest judgement that names
# what it differs from, each line marked in its note; to read, Steel 1805 Folio LVII.
# Units: metres, m2, kg, kN. Comments mark judgements. The oars' three figures and
# the oar force: docs/design/Design-BoatAndPersonAboard.md §5.2.
ship:
  name: the boat
  rig: boat
  era_notes: 'The frigate''s launch, a ten-oared boat with a lug, fit to weigh an anchor: the pattern
    of the frigate''s launch (31 ft). A boat of the ships'' files (package 82; docs/design/Design-BoatAndPersonAboard.md
    §5), manned as a hull of the world when she is commanded and the script''s boat on her errands otherwise;
    her name is her ship''s (''the Raven''s boat'') when she is manned. Sources: Steel 1805 p. 181 (''the
    launch ... longer, more flat in its bottom, and lower ... better calculated for rowing and approaching
    a flat shore''; ''fit to weigh an anchor''); Steel 1794 vol. I (''sent in the long-boat'', the stream
    anchor, OCR l. 5739); Luce 1866 ''Boats'' (2.6 root(L)); the water she brings off in gang casks is
    her load (Luce''s weight rule for the launch herself, 2.5 lb x B^2 x L, gives about 2.1 tons). To
    read: Steel 1805, Folio LVII, ''Dimensions and scantlings of boats'' (IA leaves 599 to 602), which
    gives the pattern''s dimensions by length; read, its figures replace the judgement here, and never
    the game''s behaviour. Built by tools/gen_ships.py; edit the script and rerun.'
hull:
  # 31 ft, the boat's length (the pattern's; judgement from the ships' boats lists, which Luce's rule sizes).
  length_waterline_m: 9.4
  # 7.75 ft, a quarter of the length (Luce 1866, 'Boats': a named period rule).
  beam_m: 2.4
  # 1.83 ft laden (judgement: to read, Steel 1805 Folio LVII).
  draught_m: 0.6
  # 4,500 kg laden: the boat herself by Luce's weight rule and her men and their gear the rest (judgement).
  displacement_kg: 4500.0
  # 0.5 m, a boat's (judgement: an open boat is tender under sail and stiff with her men sat low).
  gm_m: 0.5
  # Amidships (judgement).
  clr_x_m: 0.0
  # LWL x draught x 0.85, the small vessels' rule.
  lateral_area_m2: 4.79
  # 1.34 sqrt(31 ft).
  hull_speed_kn: 7.5
  # The gunwale 1.42 ft above the water laden (a depth of 3.25 ft less the draught; judgement); a man standing in her looks from 1.7 m over it (freesail/world/lookout.py).
  deck_height_m: 0.43
  # A yoke's rudder hung on the transom, 0.50 m2 (a boat's rudder is large for her size, about a sixtieth of a square metre to the foot of her length: judgement after the yawl's and the launch's blades), as deep as her depth, put over quickly by the coxswain's yoke lines (judgement).
  rudder:
    area_m2: 0.5
    max_angle_deg: 35
    rate_deg_s: 20.0
    span_m: 0.99
spars:
# one mast of 19 ft above the gunwale, stepped at will in a thwart's clamp and unstepped to pull (Steel 1794 vol. II, the boats' stores table: masts, sails and halyards allowed to the yawl and the cutter), unstayed; judgement on the length (about 0.6 of the boat's). To read: Steel 1805, Folio LVII, 'Dimensions and scantlings of boats' (IA leaves 599 to 602), which gives the pattern's dimensions by length; read, its figures replace the judgement here, and never the game's behaviour. Rating: lug in 25 kn -> 2.1 kN.
- id: mast
  class: mast
  x_m: 2.4
  height_m: 5.8
  rating_kn: 2.1
# the lug's yard 17 ft, 0.9 of the mast, slung at a third and peaked (judgement after the luggers' practice, Forfait 1788 p. 53). Rating: lug in 25 kn -> 2.1 kN.
- id: lug_yard
  class: lug_yard
  'on': mast
  length_m: 5.2
  height_m: 5.5
  rating_kn: 2.1
sails:
# a standing lug of 250 sq ft (23.2 m2), tacked at the mast and not dipped, one reef-band (judgement after the yawl's and cutter's columns of Steel 1794's boats' stores); No. 8 canvas, the lightest Steel's sail-maker uses for small boats' sails (judgement after Steel 1794 vol. I, the canvas numbers).
- id: lug
  class: lug
  yard: lug_yard
  mast: mast
  area_m2: 23.2
  reef_bands: 1
  x_m: 0.8
  centre_height_m: 3.9
  canvas_no: 8
  cloth_rating_kn: 4.2
  corners_m: [[2.6, 0.5], [3.3, 4.1], [0.7, 8.5], [-2.3, 0.6]]
lines:
# the halyard, 1.5 in (judgement).
- id: lug_yard.halyard
  class: halyard
  of: lug_yard
  rating_kn: 3.5
- id: lug.tack
  class: tack
  of: lug
  rating_kn: 2.4
# the sheet, 1.25 in, in hand (judgement).
- id: lug.sheet
  class: sheet
  of: lug
  rating_kn: 2.4
groups: {}
aliases: {}
# The oars (package 82; the design's §5.2): the thrust of one oar is min(thrust_n, power_w / way) x the stroke x the men's tiring, 1 / (1 + hours / tiring_h); thrust_n a man's pull on the blade at no way, power_w his power at the oar over hours, tiring_h the hours that halve his strength. Judgement, fitted to the brief's words (three to four knots light under four oars, a knot and a half towing, the men tiring by the hour); the oar a lever of the second class striking the water (Falconer 1780, OAR), which gives no figure. Read by freesail/physics/oars.py and by nothing else.
oars:
  number: 10
  thrust_n: 50.0
  power_w: 60.0
  tiring_h: 4.0
crew:
  # A coxswain and 10 oarsmen, one to an oar (the ships' boats lists: a crew of the oars and one).
  complement: 11
  # Her men are her ship's: the english list.
  names: english
  stations:
    # The oarsmen, filed at the waist's station, the nearest word the schema has for men on the thwarts (judgement).
    waisters: 10
  ratings:
    # A boat's crew are picked men: all able (judgement).
    able: 1.0
  posts:
  # The coxswain who steers her and commands her crew.
  - post: coxswain
  stores:
    # A breaker of water (judgement).
    water_tons: 0.05
    # A day's bread (judgement).
    provisions_days: 1
# A grapnel on a line (judgement): the one anchor a boat carries, filed as a kedge, the smallest anchor the schema knows.
ground_tackle:
  chain: false
  anchors:
  # A grapnel of about 31 lb on 20 fathoms of 1.5-in line (judgement).
  - id: grapnel
    kind: kedge
    name: the grapnel
    weight_kg: 31.0
    cable_fathoms: 20.0
    cable_in: 1.5
    cable_kn: 3.5
