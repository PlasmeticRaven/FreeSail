  foresail: fore.course
  mainsail: main.course
  fore yard: fore.yard
  main yard: main.yard
  spanker boom: main.boom
  driver boom: main.boom
  spanker gaff: main.gaff
  fore topmast staysail: fore.topmast_staysail
  main staysail: main.staysail
  main topmast staysail: main.topmast_staysail
  middle staysail: main.topmast_staysail
  main topgallant staysail: main.topgallant_staysail
  stuns'ls: studdingsails
  studding sails: studdingsails
  kites: studdingsails
  head sails: headsails
  topgallant sails: topgallants
  upper yards: topgallant yards
  fore sheet: fore sheets
  fore tack: fore tacks
  fore bowline: fore bowlines
  fore top bowline: fore topsail bowlines
  main sheet: main sheets
