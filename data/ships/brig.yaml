# The ground tackle (package 34, spec M5 §18): the anchors by the ship's size and the hemp cables by the fathom, every figure's rule in tools/gen_ships.py; chain cable is later than 1805 and the file says so.
ground_tackle:
  chain: false
  anchors:
  # The bowers: 15.8 cwt by the rule of five cwt to the hundred tons (316.133 tons burthen; the beam rule, two thirds the draught and the beam in cwt, gives 35.8), Luce 1866 ch. XIV. The cable 14 inches, half an inch to the foot of beam (judgement, unverified), rated as every rope by Luce ch. IV; two cables of 120 fathoms spliced on the best bower (Falconer 1780, CABLE; Lever 1808 p. 67).
  - id: best_bower
    kind: bower
    name: the best bower
    weight_kg: 800.0
    cable_fathoms: 240.0
    cable_in: 14.0
    cable_kn: 303.7
  - id: small_bower
    kind: bower
    name: the small bower
    weight_kg: 800.0
    cable_fathoms: 120.0
    cable_in: 14.0
    cable_kn: 303.7
  # The sheet anchor, the bowers' size and cable (Lever 1808 p. 67).
  - id: sheet
    kind: sheet
    name: the sheet anchor
    weight_kg: 800.0
    cable_fathoms: 120.0
    cable_in: 14.0
    cable_kn: 303.7
  # The stream anchor, a quarter of the bower (Luce 1866 ch. XIV, the Book of Allowances), its cable two thirds of the bower's (judgement).
  - id: stream
    kind: stream
    name: the stream anchor
    weight_kg: 200.0
    cable_fathoms: 120.0
    cable_in: 9.5
    cable_kn: 139.8
  # The kedge, an eighth of the bower (Luce 1866 ch. XIV), on a hawser of half the cable's size (judgement).
  - id: kedge
    kind: kedge
    name: the kedge
    weight_kg: 100.0
    cable_fathoms: 120.0
    cable_in: 7.0
    cable_kn: 75.9
crew:
  # The kit's manual: the Diligence class establishment, 121 (Winfield not reached).
  complement: 121
  # A King's ship: the english list in data/crew/names.yaml.
  names: english
  stations:
    # Hands per station, both watches together, the frigate's stations in small (spec M3 2.3; Luce 1884 ch. XX). Forecastlemen: 14, judgement.
    forecastle: 14
    # Fore topmen: 12, judgement.
    fore_top: 12
    # Main topmen: 14, judgement, the larger top.
    main_top: 14
    # Afterguard, the boys included: 22, judgement.
    afterguard: 22
    # Waisters: 14, judgement; the station whose numbers make up the establishment.
    waisters: 14
    # Marines: 20, judgement, a sergeant's party for a sloop (a brig-sloop of the class carried about twenty); they work as afterguard, never aloft.
    marines: 20
    # Idlers: the trades below.
    idlers: 17
  ratings:
    # Share of the seamen by rating: judgement, a King's ship's books as the frigate's. Able: 0.30.
    able: 0.3
    # Ordinary: 0.40, judgement.
    ordinary: 0.4
    # Landsmen: 0.30, judgement.
    landsman: 0.3
  posts:
  # Station holders by post (spec M3 2.3): a brig-sloop's, the commander and his lieutenant, then the master and the standing and warrant officers (Falconer, ORDINARY and CARPENTER). Names are drawn at muster unless a post gives one.
  - post: commander
  - post: lieutenant
  - post: master
  - post: boatswain
  - post: gunner
  - post: carpenter
  - post: purser
  - post: surgeon
  idlers_by_trade:
    # How the idlers are made up; they must sum to the idlers. Judgement for a brig-sloop of 121. The carpenter's mate and crew: 3.
    carpenter's crew: 3
    # A sailmaker: 1.
    sailmaker's crew: 1
    # The cooper: 1.
    cooper: 1
    # The cook and his mate: 2.
    cook: 2
    # The purser's and the commander's stewards: 2.
    steward: 2
    # Officers' servants: 5.
    servant: 5
    # The surgeon's mate: 1.
    surgeon's mate: 1
    # The commander's clerk: 1.
    clerk: 1
    # A ship's corporal: 1.
    master-at-arms's party: 1
  stores:
    # Water: 45 tons, the frigate's four months' allowance scaled to 121 men (judgement).
    water_tons: 45
    # Provisions: four months at full allowance (judgement, as the frigate's).
    provisions_days: 120
    # The booms: the spare spars by class (Luce 1866 ch. XVII, 'Stowing Booms', scaled to a brig-sloop; Chapelle 1930 on the brig's upper spars made alike); see tools/gen_ships.py.
    spare_spars:
      # One topmast, to answer either mast (Chapelle, after Fincham).
      topmast: 1
      # A stump topgallant mast (judgement, after Luce 1866).
      topgallant_mast: 1
      # A spare topsail yard (judgement, after Luce 1866).
      yard: 1
      # A pair of topmast studding-sail booms (judgement, after Luce).
      studdingsail_boom: 2
      # The spare jib-boom (Luce 1866).
      jib_boom: 1
    # Spare rope in the boatswain's store (judgement).
    cordage_fathoms: 300
    # The carpenter's shot plugs (package 73, spec M7 §14): tapered plugs of soft wood with oakum and tallow, kept ready in action (the Regulations and Instructions 1806, the Carpenter; Falconer 1780, PLUG: 'shot-plugs ... to stop holes made by cannon shot'); the count by her class, judgement. A brig-sloop's 20.
    shot_plugs: 20
    # The sail room (spec 3b §6.3), every sail new; see tools/gen_ships.py.
    sails:
    # A second fore and main topsail, fore course, jib and fore topmast staysail (spec 3b §6.3, judgement).
    - kind: fore.topsail
      canvas_no: 2
      condition: 100
    - kind: main.topsail
      canvas_no: 2
      condition: 100
    - kind: fore.course
      canvas_no: 2
      condition: 100
    - kind: jib
      canvas_no: 6
      condition: 100
    - kind: fore.topmast_staysail
      canvas_no: 6
      condition: 100
    # Storm canvas, one of each (spec 3b §6.4).
    - kind: fore.storm_staysail
      canvas_no: 1
      condition: 100
    - kind: main.storm_staysail
      canvas_no: 1
      condition: 100
    - kind: storm_trysail
      canvas_no: 1
      condition: 100
  ration:
    # The ration (package 54, spec M7b 19): the Navy's table, the Regulations of 1806 (Sect. IX, Chap. I, Art. I), as data/crew/ration.yaml gives it; a King's ship.
    table: navy
    # Water drawn a man a day for his drink, his grog and the coppers: a gallon, the figure her water above is reckoned at (judgement).
    water_gallons: 1
  # The named people beyond the posts (package 35, spec M5 §22): each drawn from his station at muster, the counts above unchanged; see tools/gen_ships.py.
  people:
  # A master's mate, an able seaman of the forecastle (the Regulations of 1806, the Master, art. XXVIII).
  - role: master's mate
    station: forecastle
    rating: able
  # A midshipman as the messenger, one of the boys of the afterguard.
  - role: midshipman
    station: afterguard
    rating: landsman
    messenger: true
  # The sergeant of marines, commanding a brig-sloop's party, drawn from the twenty.
  - role: sergeant of marines
    station: marines
    rating: marine
  # The quarter bill beyond the gun crews (spec M7 8a; package 70; docs/design/Design-WorkInAction.md): at quarters every man has a station by it, the gun crews the fit's (each gun's crew above), the sail trimmers here by station (the men who leave the guns for a brace or a sail: Luce 1884 ch. XX, 'Watch, Quarter and Station Bills'), the hands at the helm, the powder beyond the idlers, and the fighting book's priority when sail work wants more hands than the trimmers give; the marines, the carpenter's crew and the surgeon's mates have their stations by their trades. The counts are judgement against the stations above.
  quarter_bill:
    trimmers:
      # The trimmers: six of the forecastlemen for the head sails.
      forecastle: 6
      # Six of the fore topmen for the fore braces.
      fore_top: 6
      # Seven of the main topmen for the main braces.
      main_top: 7
      # Eight of the afterguard at the main sheet and the after braces.
      afterguard: 8
    # Two quartermasters at the wheel (Luce 1884 ch. XX).
    helm: 2
    # The powder beyond the idlers: none; the cooks, stewards and servants pass the cartridges (judgement).
    powder: 0
    # The quarter gunners and the gunner's crew in the filling room, one to every four cannon (Falconer 1780, QUARTER-GUNNER, l.14283-14289); the swivels are not cannon (practice and resupply, between packages 72 and 73).
    filling: 4
    # The fighting book's priority when sail work wants more hands than the trimmers give (spec M7 8a): 'sail before guns' robs the guns (the disengaged battery first) and the log says from where; 'guns before sail' makes the sail work wait short-handed. The player's book and the doctrine may say otherwise.
    priority: sail before guns
    # Eight of the brig's seamen with the stand of arms' muskets (judgement).
    small_arms: 8
    # Thirty boarders from the guns' crews with the twenty marines (judgement).
    boarders: 30
