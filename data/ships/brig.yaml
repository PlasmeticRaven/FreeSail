# The brig: Harpy, H.M. brig-sloop of the Diligence class (launched 1796, sold 1817),
# 316 tons, 95 ft on the gun deck by 28 ft 1 1/2 in (the kit's manual as the owner
# noted it; docs/design/VesselCandidates.md). Generated by tools/gen_ships.py
# (docs/design/ships-design/pages-zaz4491.md; tools/ships/hull_brig.py, her lines from
# RMG ZAZ4491 and ZAZ4492); edit those
# and rerun, do not edit this file. Spars: Fincham 1843, 'On Masting
# Brigs' (pp. 82 to 83) and the table of proportions for brigs of war (p. 88), checked
# against Luce 1866 ch. VII and Steel 1794; sails: Steel 1794 vol. I ('A brig's
# mainsail', p. 119; a brig's sails as a ship's fore and main); rope: Luce 1866 ch. IV.
# Spar ratings are provisional, set for truth 9 with the M1 sail curves; see the
# script. Canvas: Steel 1794 with Kipping and Luce 1884 p. 171; cloth ratings from the
# number by Luce App. E. Units: metres, m2, kg, kN. Comments mark judgements. Package
# 32b (spec M5 §25): no engine change.
ship:
  name: Harpy
  rig: brig
  era_notes: 'H.M. brig-sloop Harpy of the Diligence class (launched 1796, sold 1817): 316 tons burthen,
    95 ft on the gun deck, 75 ft 1 5/8 in on the keel, 28 ft 1 1/2 in beam, 12 ft 0 1/2 in in the hold;
    sixteen 32-pounder carronades and two 6-pounder chase guns (the armament below, package 70). The Navy''s
    brig; the merchant brig is her second description at far detail (package 36). Hull''s figures from
    the kit''s manual and Winfield p. 256, her lines as drawn from the class''s draughts, ZAZ4491 and
    ZAZ4492 (tools/ships/hull_brig.py); spars by Fincham 1843''s table of proportions for brigs of war
    (p. 88) checked against Luce 1866 ch. VII; sails by Steel 1794; see tools/gen_ships.py for every rule.'
  descriptions:
    brig-sloop:
      rig: a brig
      what: a brig-sloop of war, sixteen ports a side
      note: 'Harpy herself: sixteen 32-pounder carronades (the kit''s manual; docs/design/VesselCandidates.md);
        the ports are what the glass counts.'
    merchant brig:
      rig: a brig
      what: a merchant brig, deep laden
      note: The trade's brig of the same rig and size, her ports painted and no guns run out (Falconer
        1780, BRIG); 'deep laden' is the merchantman's look, judgement.
hull:
  # 88 ft: judgement, 0.93 of the 95 ft gun deck (keel 75 ft 1 5/8 in), a brig-sloop's ends raking more than a frigate's. Recorded, not moved: her class's WL1 (ZAZ4491; the note's §7).
  length_waterline_m: 26.8
  # 28 ft 1 1/2 in extreme breadth, Harpy as built (Winfield 1793-1817 p. 256). Recorded, not moved: her class's draught gives 28 ft 0 in extreme, 27 ft 6 in moulded (ZAZ4491).
  beam_m: 8.6
  # 11.5 ft mean, judgement: 10.5 ft forward, 12.5 ft aft stored for sea, from the 12 ft depth in hold as the frigate's is derived. Recorded, not moved: her class's drag and depth to K (ZAZ4491; the note's §4.3, §7; 3 ft 2 in of drag on the sisters' ZAZ4320 and ZAZ4262). Harpy's as-built 7 ft 3 in forward and 10 ft 10 in aft, 3 ft 7 in of drag (Winfield p. 256), fall near WL2, 2 ft 2 in lighter, in a state not said.
  draught_m: 3.5
  # LWL x beam x draught x Cb 0.50 x 1025: about 410 t, 1.3 x the 316 tons burthen (Cb judgement: a sloop's block).
  displacement_kg: 413000.0
  # 3 ft 1 in: judgement, the frigate's 4 ft 3 in scaled by the breadth (28.1 to 38.3 ft); a brig-sloop was tenderer than a frigate.
  gm_m: 0.95
  # Judgement, set as the schooner's and the frigate's were: the centre of pressure before the middle so that she carries a little weather helm close-hauled and a few degrees on a beam reach in 15 kn (measured; docs/dev/TuningNotes.md, package 32b). Fincham p. 83 puts a brig of war's centre of effort 0.026 of the water-line before the middle, with the masts further aft than a ship's.
  clr_x_m: 0.5
  # LWL x draught x 0.85 for the fullness of the profile.
  lateral_area_m2: 80.0
  # The brig-sloops' recorded best is 10 to 11 knots (judgement, between the schooner's 11.5 and the frigate's 13); 1.34 sqrt(88 ft) = 12.6 is a modern yacht's figure.
  hull_speed_kn: 11.5
  # A flush deck about 5 ft above the load line (judgement). Recorded, not moved: her class's deck (ZAZ4491; the note's §5.3, §7).
  deck_height_m: 1.5
  # Blade about 12 ft by 3 ft (span_m its depth, 12 ft; package 32e); 35 degrees is the period stop (judgement).
  rudder:
    area_m2: 3.0
    max_angle_deg: 35
    rate_deg_s: 3.5
    span_m: 3.7
