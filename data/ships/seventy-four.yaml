  # The quarter bill beyond the gun crews (spec M7 8a; package 70; docs/design/Design-WorkInAction.md): at quarters every man has a station by it, the gun crews the fit's (each gun's crew above), the sail trimmers here by station (the men who leave the guns for a brace or a sail: Luce 1884 ch. XX, 'Watch, Quarter and Station Bills'), the hands at the helm, the powder beyond the idlers, and the fighting book's priority when sail work wants more hands than the trimmers give; the marines, the carpenter's crew and the surgeon's mates have their stations by their trades. The counts are judgement against the stations above.
  quarter_bill:
    trimmers:
      # The trimmers: what her seamen leave when one side's guns of 'arrogant class 1795' and the wheel are manned, the marines taking the carronades, split by the frigate-36's trimmer shares, 8, 10, 12, 6 and 8 of 44 (Bel-D §6.3; judgement, as Indf §6.4). Of the forecastlemen, for the head sails and the fore braces (Luce 1884 ch. XX: the forecastlemen 'the best older seamen').
      forecastle: 10
      # Of the fore topmen, for the fore braces aloft.
      fore_top: 13
      # Of the main topmen, the largest top.
      main_top: 15
      # Of the mizzen topmen, for the crossjack braces and the mizen course.
      mizzen_top: 7
      # Of the afterguard, at the main sheet and the after braces.
      afterguard: 10
    # Two quartermasters at the wheel (Luce 1884 ch. XX, the quartermasters), as the frigate-36's (judgement).
    helm: 2
    # The powder beyond the idlers: none; her fourteen boys among the idlers, her cooks, stewards, clerks, the cooper, the armourers and the sailmaker's crew pass the cartridges (Falconer 1780, QUARTERS: 'often a boy to bring powder'; judgement, as the frigate-36's).
    powder: 0
    # The quarter gunners and the gunner's crew in the filling room, one to every four cannon (Falconer 1780, QUARTER-GUNNER, l.14283-14289); the swivels are not cannon (practice and resupply, between packages 72 and 73). Hers are the Regulations' eighteen quarter gunners of the 590 column (the 1808 printing p. 165: Bel §4.3), which Falconer's one to every four cannon gives on the 1793 establishment's 74 pieces, the carronades never rated cannon (Bel-D §5.4); Lavery's 1766 allowance, one to every four guns (1985 p. 17, Table 6), the same.
    filling: 18
    # The fighting book's priority when sail work wants more hands than the trimmers give (spec M7 8a): 'sail before guns' robs the guns (the disengaged battery first) and the log says from where; 'guns before sail' makes the sail work wait short-handed. The player's book and the doctrine may say otherwise.
    priority: sail before guns
    # Seamen with the muskets of the stand of arms, the frigate-36's share of her seamen (20 of 182; judgement, as Indf §6.4). Falconer's men to the small arms by the Admiralty's order, 80 for a third rate of 70 guns and 100 for one of 80 (1780, QUARTERS, OCR l. 14335-14372), and the Regulations' hundred seamen of a 74 trained to the muskets for service ashore (p. 142, page image), stand for the whole party, marines and seamen.
    small_arms: 46
    # The boarders by the bill, a quarter of her seamen told off from the guns' crews (Luce 1884 ch. XX; judgement, the shared rule), with the marines, who board with the bayonet.
    boarders: 105
    # The marines the bill keeps in their division at the beat (her stage 0c's key, Bel-D §12.1): her marines but those at the default fit's carronades, quartered on the poop and the forecastle or gangway, at the great guns only in distant cannonading (Falconer 1780, QUARTERS), as her marines stood on her poop on 1 June 1794 (the Molloy minutes, read (OCR): Bel §4.4). Read by her bill by deck (Bel-D §6.4, B7.b); until it, the beat takes her marines to the guns as every ship's.
    marines: 95
  # The flag party she bears beyond her company when a scenario hoists a rear-admiral's flag in her (Bel-D §17.0, the owner's answer: the rear-admiral and their people in the ship file, so that models may be stationed as them): the rear-admiral, their flag lieutenant and secretary, and their servants, the 'customary supernumeraries' James adds for a rear-admiral (vol. 1 p. 156, OCR l. 12961-12963; Bel §4.3: 609 under Pasley's flag on 1 June 1794), the party's make-up and its servants judgement, no establishment of a rear-admiral's retinue having been read; counted in no station and not in her 590. Inert: the world code that brings them aboard is a package of its own (the lead's answer (15)). Their stations, places and outlines are in data/people/seventy-four.yaml.
