# The ground tackle (package 34, spec M5 §18): four bowers, a stream and a kedge by Steel 1794 and Lavery 1985 (answer 13; Bel-D §7), every figure's source in tools/ships/bellerophon.py; chain cable is later than 1805.
ground_tackle:
  chain: false
  anchors:
  # The bowers: four of 67 cwt, Steel's 'Smaller 74 Guns' (Steel 1794 vol. I, the anchor table, page image: Bel §5.7) and Lavery's four of about 1800 (1985 p. 15, Table 4, read (owner's book)); seven cables of 22 in and 100 fathoms (Table 4, after NMM SPB 15; Steel's 74 '23 or 22' in), rated as every rope by Luce 1866 ch. IV, laid three on the best bower and two on the small, 'three Cables on the best Bower, two on the small Bower' (Lever 1808 p. 67). The 64 took Falconer's 120 fathoms a cable; her class's own list gives 100, and it is taken. Steel 1805's 71 cwt for every 74 (Folio LVII, page image), and Table 4's viols and messenger, which the file has no key for, are in her notes.
  - id: best_bower
    kind: bower
    name: the best bower
    weight_kg: 3404.0
    cable_fathoms: 300.0
    cable_in: 22.0
    cable_kn: 749.9
  - id: small_bower
    kind: bower
    name: the small bower
    weight_kg: 3404.0
    cable_fathoms: 200.0
    cable_in: 22.0
    cable_kn: 749.9
  # The sheet anchor, a bower's size, on one cable.
  - id: sheet
    kind: sheet
    name: the sheet anchor
    weight_kg: 3404.0
    cable_fathoms: 100.0
    cable_in: 22.0
    cable_kn: 749.9
  # The spare anchor, the fourth bower, on the seventh cable (Steel's 74 has shank painters for four: vol. II p. 39, page image); of the kind 'sheet', the schema's kinds being four, as the 64's.
  - id: spare_anchor
    kind: sheet
    name: the spare anchor
    weight_kg: 3404.0
    cable_fathoms: 100.0
    cable_in: 22.0
    cable_kn: 749.9
  # The stream anchor of 16 cwt (Steel's 'Smaller 74 Guns'; Lavery Table 4), on Table 4's stream cable of 13.5 in and 100 fathoms (Steel's 12.5 in, 'A Cordage Table').
  - id: stream
    kind: stream
    name: the stream anchor
    weight_kg: 813.0
    cable_fathoms: 100.0
    cable_in: 13.5
    cable_kn: 282.4
  # The kedge of 8 cwt (the same tables), on a hawser of half the bower cable's size, the house rule (gen_ships.KEDGE_HAWSER_OF_BOWER; judgement), of her cables' length (judgement).
  - id: kedge
    kind: kedge
    name: the kedge
    weight_kg: 406.0
    cable_fathoms: 100.0
    cable_in: 11.0
    cable_kn: 187.5
crew:
  # The 74's establishment of 590 men and boys, the Regulations' table of 31 December 1806 (1808 printing p. 165, the 590 column, read row by row on the page images: Bel §4.3; answer 10). The widows' men are counted as men, so the file is 4 over James's net 586; more hands may be signed on in the game. The brief's 'three times the frigate's' is a figure of speech the sources do not bear: 590 against her 264 (Bel §9).
  complement: 590
  # A King's ship: the english list in data/crew/names.yaml.
  names: english
  stations:
    # Hands per station, both watches together: her seamen, the complement less the posts, the marines and the idlers, shared among the six stations as the frigate-36's 182 are (28, 24, 30, 14, 50 and 36: judgement, Bel-D §6.1), the column's petty officers, mates, midshipmen and first- and second-class boys among them, the boys in the afterguard as landsmen (spec M3 9 item 6). Forecastlemen: the head, anchors and headsails; the best older seamen (Luce 1884 ch. XX).
    forecastle: 65
    # Fore topmen.
    fore_top: 55
    # Main topmen, the largest top.
    main_top: 69
    # Mizzen topmen.
    mizzen_top: 32
    # Afterguard, the boys included (spec M3 9 item 6: boys count as landsmen).
    afterguard: 115
    # Waisters.
    waisters: 83
    # Marines: the 590 column's captain, three lieutenants, three serjeants, two corporals and two drummers, 11, and 100 privates: in March 1803 the Mars embarked '100 rank and file' and the Spartiate 'a captain and 100 marines' (Naval Chronicle vol. IX p. 245, page image; Bel §4.4), within her dates and at the foot of answer 11's 100-110; the Bellona carried 90 privates in 1761 (Lavery 1985 p. 17, Table 7). Soldiers served in their place in 1794-95 (James vol. 1 p. 155 n. 1); a file carries one company. Their kit is the nation's (data/nations.yaml). They stand watch and work as afterguard, never aloft (Luce 1884 ch. XX; the Regulations p. 422).
    marines: 111
    # Idlers: the trades below (Luce 1884 ch. XX: they stand no night watches).
    idlers: 44
  ratings:
    # Share of the seamen (not marines, idlers or officers) by rating: the frigate-36's (judgement, Bel-D §6.1); the Bellona's company of 1761 is in her notes (Lavery 1985 p. 17, Table 7). Able: 0.30.
    able: 0.3
    # Ordinary: 0.40, judgement.
    ordinary: 0.4
    # Landsmen: 0.30, judgement.
    landsman: 0.3
  posts:
  # Station holders by post (spec M3 2.3): the commissioned officers, the column's 5 lieutenants, its master, second master, surgeon, carpenter, boatswain, gunner, purser and chaplain (the Regulations 1806 p. 165, the 590 column, its first row), and the sailmaker and the master-at-arms, posts in the frigate's and the 64's files; the posts are free words, so the second master and the chaplain stand as written (Bel-D §6.1). Her people file (data/people/seventy-four.yaml) gives them. Names are drawn at muster unless a post gives one.
  - post: captain
  - post: first lieutenant
  - post: second lieutenant
  - post: third lieutenant
  - post: fourth lieutenant
  - post: fifth lieutenant
  - post: master
  - post: second master
  - post: boatswain
  - post: gunner
  - post: carpenter
  - post: purser
  - post: surgeon
  - post: chaplain
  - post: sailmaker
  - post: master-at-arms
  idlers_by_trade:
    # How the idlers are made up, the 590 column's rows by trade (the Regulations 1806; Bel §4.3) and judgement where it says so; they must sum to the idlers. The carpenter's mate and crew of eight, the caulker and the caulker's mate: 11.
    carpenter's crew: 11
    # The sailmaker's mate and crew of two, and the ropemaker: 4.
    sailmaker's crew: 4
    # A cooper, for the casks (judgement: the column pays one and numbers none): 1.
    cooper: 1
    # The armourer and two armourer's mates: 3.
    armourer: 3
    # The ship's cook and the cook's mate: 2.
    cook: 2
    # The purser's steward and the steward's mate, and a gunroom steward (judgement): 3.
    steward: 3
    # The boys of the third class, who replaced the officers' servants in 1794 (James vol. 1 pp. 256-257, page image; judgement, as the 64's servants): 14.
    servant: 14
    # The two assistant surgeons: 2.
    surgeon's mate: 2
    # The captain's clerk and the schoolmaster: 2.
    clerk: 2
    # The two ship's corporals: 2.
    master-at-arms's party: 2
  stores:
    # Water: the frigate-36's 100 tons for her 264 carried by the complement, in iron-hooped casks (Bel-D §7; judgement, the 64's method), as many weeks at a gallon a man a day as hers. Steel's 80 'as fitted for sea with six months' provision' carried 620 tons of provisions and water for 700 men (1805 pp. 197-198, read (OCR)), the period's check.
    water_tons: 223
    # Provisions: four months at full allowance for the complement, as the frigate-36's (judgement).
    provisions_days: 120
    # The booms: the spare spars by class, as the frigate-36's (Luce 1866 ch. XVII, 'Stowing Booms'; Luce 1884 ch. XI; Steel 1794 vol. I, 'Lashing of Booms'), of her own spars (Bel-D §7); see tools/ships/bellerophon.py.
    spare_spars:
      # The fore and main topmasts, one in each pile (Luce 1866).
      topmast: 2
      # A stump fore and a stump main topgallant mast, one in each pile (Luce 1866).
      topgallant_mast: 2
      # The spare fore and main topsail yards, on the quarters (Luce 1866).
      yard: 2
      # The fore and main topmast studding-sail booms, a pair in each pile (Luce 1866; the pair judgement).
      studdingsail_boom: 4
      # The spare jib-boom, amidships (Luce 1866); Dragon's list gives her one jib-boom (Lavery 1985 Table 10, its 'flying jib boom' row).
      jib_boom: 1
    # Spare rope in the boatswain's store: the frigate-36's 600 fathoms carried by the complement, to fifty fathoms (Bel-D §7; judgement).
    cordage_fathoms: 1350
    # The carpenter's shot plugs (package 73, spec M7 §14): tapered plugs of soft wood with oakum and tallow, kept ready in action (the Regulations and Instructions 1806, the Carpenter; Falconer 1780, PLUG: 'shot-plugs ... to stop holes made by cannon shot'); the count by her class, judgement. One a gun of her default fit (Bel-D §7).
