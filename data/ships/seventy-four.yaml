ship:
  name: Bellerophon
  rig: ship
  era_notes: 'HMS Bellerophon, a 74-gun ship of the Arrogant class (Slade''s design of 1758 on the Bellona''s
    lines): ordered 1782, launched by Graves at Frindsbury in 1786, at the Glorious First of June, the
    Nile and Trafalgar, and Napoleon''s at Basque Roads in 1815. 168 ft on the gun deck, 46 ft 9 in extreme
    by the design and the contract, 1604 tons. Hull measured on her class''s draughts (ZAZ1357, ZAZ1359;
    Research-74-2026-10.md); masts and yards Dragon''s (Lavery 1985 Table 10), sails by Steel 1794 table
    IV, the 74 column; see tools/ships/bellerophon.py for every figure and judgement.'
  descriptions:
    seventy-four:
      rig: a ship
      what: a seventy-four, a ship of the line, fourteen ports a tier
      note: 'A third rate (Falconer 1780, RATES), of James''s small class of 74s, under 1,700 tons (vol.
        1 p. 451 note M*, read (OCR)): what the glass makes out, her two tiers of fourteen ports a side
        (Bel §3.3); her rig''s word the frigate''s, three masts square-rigged. Her default fit serves
        a far ship of her, filed here as every row since SW-4 files its fit (Bel-D §8.1 had none, the
        default serving either way); her roles a King''s ship''s and, where she leads a squadron, a commodore''s,
        as the frigate''s (Build-Ships.md §8.2); she sails by the first, a row filed since package 75
        (brains.INTENT_RULED_ROWS, the lead''s ruling).'
      fit: arrogant class 1795
      roles:
      - kings-ship
      - commodore
