# mainsail 132 m2: foot 44 ft from clew to mast (0.92 of the boom), head 28 ft (0.92 of the gaff, 0.64 of the foot: Fincham art. 86 gives 0.6 to 0.66, 0.74 in some revenue cruisers), hoist 34 ft to the nock 39 ft above the deck (2.21 breadths above the water: Fincham art. 86, 2.1 to 2.2 in revenue cruisers), gaff peaked 27 degrees; four reef-bands (Steel 1794 p. 120, 'Cutter's mainsail'); centre 0.4 of the foot abaft the raked mast. Fincham's 85-ton cutter's mainsail (p. 67) was 1566 sq ft on a yacht's taller mast. Canvas No. 2 (Steel 1794 vol. I, Sail-making p. 120, 'Cutter's mainsail': No. 1 or 2); cloth 0.320 kN/m2, 1.00 of No. 2 by Luce App. E.
