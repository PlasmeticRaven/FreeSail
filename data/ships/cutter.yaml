# the mast (Steel calls a cutter's her main mast): 61 ft heel to head, hounded 49 ft (Fincham 1843 p. 67, the second revenue cruiser: 2.6 x the breadth) with a head 0.23 of that, 53 ft above the deck; stepped 0.269 x the breadth below the water-line (Fincham); raking 5.2 deg, 13 in in 12 ft (Fincham; Steel: 1.5 in to the yard); stationed 0.101 of the water-line before the middle (Fincham). Provisional (truth 9), see gen_ships.py. ZAZ6381 and ZAZ6382: 8 ft 8 in before the middle of the load line, raking 6.9 deg to it: recorded, not moved (Build-Ships.md §5.0 principle 8). Rating: square_sail, topsail, topgallant, main.sail, main.gaff_topsail, fore.staysail in 55 kn -> 202.4 kN.
