# The ground tackle (package 34, spec M5 §18): the anchors by the ship's size and the hemp cables by the fathom, every figure's rule in tools/gen_ships.py; chain cable is later than 1805 and the file says so.
ground_tackle:
  chain: false
  anchors:
  # The bowers: 4.2 cwt by the rule of five cwt to the hundred tons (85 tons burthen; the beam rule, two thirds the draught and the beam in cwt, gives 24.7), Luce 1866 ch. XIV. The cable 9.5 inches, half an inch to the foot of beam (judgement, unverified), rated as every rope by Luce ch. IV; two cables of 120 fathoms spliced on the best bower (Falconer 1780, CABLE; Lever 1808 p. 67).
  - id: best_bower
    kind: bower
    name: the best bower
    weight_kg: 210.0
    cable_fathoms: 240.0
    cable_in: 9.5
    cable_kn: 139.8
  - id: small_bower
    kind: bower
    name: the small bower
    weight_kg: 210.0
    cable_fathoms: 120.0
    cable_in: 9.5
    cable_kn: 139.8
  # The kedge, an eighth of the bower (Luce 1866 ch. XIV), on a hawser of half the cable's size (judgement).
  - id: kedge
    kind: kedge
    name: the kedge
    weight_kg: 30.0
    cable_fathoms: 120.0
    cable_in: 5.0
    cable_kn: 38.7
crew:
  # Thirty: the kit's manual's complement for Sherbourne (Winfield not reached).
  complement: 30
  # A revenue crew: the english list in data/crew/names.yaml.
  names: english
  stations:
    # Hands per station, both watches together; a cutter has no tops and no marines, and her hands work aloft from the deck stations (spec M3 2.3). Forecastlemen, for the head sails and the bowsprit: 8, judgement.
    forecastle: 8
    # Afterguard, at the main sheet and the boom: 10, judgement.
    afterguard: 10
    # Waisters: 6, judgement.
    waisters: 6
    # Idlers: the trades below (spec M3 2.3).
    idlers: 3
  ratings:
    # Share of the seamen by rating: judgement. A revenue cutter's crew were Channel seamen, mostly able. Able: 0.60.
    able: 0.6
    # Ordinary: 0.30, judgement.
    ordinary: 0.3
    # Landsmen: 0.10, judgement.
    landsman: 0.1
  posts:
  # Station holders by post (spec M3 2.3): a revenue cutter's master (her commander), his mate and the boatswain; names are drawn at muster.
  - post: master
  - post: mate
  - post: boatswain
  idlers_by_trade:
    # How the idlers are made up (spec M3 2.3). The cook: 1, judgement.
    cook: 1
    # A steward: 1, judgement.
    steward: 1
    # A carpenter: 1, judgement.
    carpenter's crew: 1
  stores:
    # Stores for a cruise of the Channel (spec M3 2.3). Water for a month: 30 men at a gallon a day is about 4 tons (judgement).
    water_tons: 4
    # Provisions: a month (judgement).
    provisions_days: 30
    # The booms: the spare spars by class (judgement after Luce 1866 ch. XVII, 'Stowing Booms'); see tools/gen_ships.py.
    spare_spars:
      # A spare topmast (judgement, after Luce 1866).
      topmast: 1
      # A spare topsail yard (judgement, after Luce 1866).
      yard: 1
    # Spare rope (judgement).
    cordage_fathoms: 80
    # The carpenter's shot plugs (package 73, spec M7 §14): tapered plugs of soft wood with oakum and tallow, kept ready in action (the Regulations and Instructions 1806, the Carpenter; Falconer 1780, PLUG: 'shot-plugs ... to stop holes made by cannon shot'); the count by her class, judgement. A cutter's 8.
    shot_plugs: 8
    # The sail room (spec 3b §6.3), every sail new; see tools/gen_ships.py.
    sails:
    # A spare jib and mainsail (spec M5 §23, judgement).
    - kind: jib
      canvas_no: 2
      condition: 100
    - kind: main.sail
      canvas_no: 2
      condition: 100
    # Storm canvas, one of each (spec 3b §6.4, judgement).
    - kind: storm_trysail
      canvas_no: 1
      condition: 100
    - kind: storm_jib
      canvas_no: 1
      condition: 100
  ration:
    # The ration (package 54, spec M7b 19): the Navy's table, the Regulations of 1806 (Sect. IX, Chap. I, Art. I), as data/crew/ration.yaml gives it; a revenue cruiser victualled as the King's ships (judgement).
    table: navy
    # Water drawn a man a day for his drink, his grog and the coppers: a gallon, the figure her water above is reckoned at (judgement).
    water_gallons: 1
  # The named people beyond the posts (package 35, spec M5 §22); see tools/gen_ships.py.
  people:
  # A boy as the messenger (judgement).
  - role: boy
    station: afterguard
    rating: landsman
    messenger: true
  # The quarter bill beyond the gun crews (spec M7 8a; package 70; docs/design/Design-WorkInAction.md): at quarters every man has a station by it, the gun crews the fit's (each gun's crew above), the sail trimmers here by station (the men who leave the guns for a brace or a sail: Luce 1884 ch. XX, 'Watch, Quarter and Station Bills'), the hands at the helm, the powder beyond the idlers, and the fighting book's priority when sail work wants more hands than the trimmers give; the marines, the carpenter's crew and the surgeon's mates have their stations by their trades. The counts are judgement against the stations above.
  quarter_bill:
    trimmers:
      # The trimmers: four of the forecastlemen for the head sails and the running bowsprit (judgement).
      forecastle: 4
      # Four of the afterguard at the main sheet and the boom.
      afterguard: 4
    # One man at the tiller (a cutter steers with a tiller; judgement).
    helm: 1
    # Two of the waisters to pass the cartridges (judgement).
    powder: 2
    # The quarter gunners and the gunner's crew in the filling room, one to every four cannon (Falconer 1780, QUARTER-GUNNER, l.14283-14289); the swivels are not cannon (practice and resupply, between packages 72 and 73).
    filling: 1
    # The fighting book's priority when sail work wants more hands than the trimmers give (spec M7 8a): 'sail before guns' robs the guns (the disengaged battery first) and the log says from where; 'guns before sail' makes the sail work wait short-handed. The player's book and the doctrine may say otherwise.
    priority: sail before guns
    # Six of the cutter's best shots with the stand of arms' muskets (judgement); she bears no marines.
    small_arms: 6
    # Twenty of the cutter's seamen with cutlass and pistol (judgement: a cutter's company boards almost whole).
    boarders: 20
# The armament (spec M7 7; package 70): two fits the scenario chooses between (ship: {fit: ...}; the owner, 2026-10-23): the 12-pounder carronades the Admiralty gave its cutters from the 1790s, the default of 1805, and the long 3-pounders with eight swivels of the revenue and hired cutters. Every figure's source is in tools/gen_ships.py; the weights are from memory and UNVERIFIED against a page.
