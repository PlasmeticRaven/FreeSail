# the jib, 54 m2 (Fincham art. 87): tack 9 in short of the bowsprit end, 31 ft before the stem (0.64 of the water-line; Fincham 0.55 to 0.6), foot the 31 ft to the stem, luff 61 ft (0.8 of the 76 ft from the lower mast head to the tack), clew at the stem head; centre the corners' centroid, 6 ft before the middle and 19 ft above the water (Fincham's 85-ton cutter's second jib: 541 sq ft, 32.8 ft before and 19.5 ft up). `halyard_spar` names the bowsprit its tack runs out on: it cannot be set with the bowsprit reefed (set_jibheaded.yaml), and reefing or rigging out the bowsprit wants it down (package 32b). No reef bands: the type shifted jibs rather than reefed them, which the storm jib does here. Canvas No. 2 (Steel 1794 vol. I, Sail-making, 'Smack's jib' (OCR line 15709): No. 1 or 2); cloth 0.320 kN/m2, 1.00 of No. 2 by Luce App. E.
