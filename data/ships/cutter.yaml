# The cutter: Sherbourne, H.M. armed cutter of 1763 (Slade; Woolwich), the Channel's
# revenue cutter, 85 tons, 54 ft 6 in on deck by 19 ft (the kit's manual as the owner
# noted it; docs/design/VesselCandidates.md). Generated by tools/gen_ships.py; edit
# that script and rerun, do not edit this file. Spars: Fincham 1843, 'Proportions for
# the Masts, Booms, &c. of Cutters' (p. 67, the second revenue cruiser) and his rules
# for cutters' sails (arts. 86, 87, pp. 35 to 36); sails: Steel 1794 vol. I, the sloop's
# and cutter's sails of his sail-making chapter; rope: Luce 1866 ch. IV; the running
# bowsprit: Steel 1794 (HEEL-ROPE) and Lever 1808 (the traveller). Spar ratings are
# provisional, set for truth 9 with the M1 sail curves; see the script. Cloth ratings
# from the canvas number by Luce App. E. Units: metres, m2, kg, kN. Comments mark
# judgements. Package 32b (spec M5 §23): no engine change but the running bowsprit.
ship:
  name: Sherbourne
  rig: cutter
  era_notes: 'H.M. armed cutter Sherbourne (Slade''s design, built at Woolwich, launched 1763): 85 tons
    burthen, 54 ft 6 in on deck, 19 ft beam; the Channel''s revenue cutter, of the type the pilot cutters
    and the hired armed cutters of the war shared; six 3-pounders and eight swivels (guns are not parts
    until milestone 7). Hull from the kit''s manual (Winfield and the Greenwich draught not reached);
    spars by Fincham 1843''s table of proportions for revenue cruisers (p. 67) and his rules for cutters''
    sails (arts. 86, 87); sails by Steel 1794; see tools/gen_ships.py for every rule.'
hull:
  # 50 ft: judgement between the 44 ft keel for tonnage (85 tons on 19 ft by the Navy's rule) and the 54.5 ft on deck (the kit's manual), a plumb stem and a raking post.
  length_waterline_m: 15.2
  # 19 ft 0 in (the kit's manual; Winfield not reached).
  beam_m: 5.8
  # 8.5 ft mean: 9.5 ft aft, half her breadth (the type's rule, judgement), 7.5 ft forward (Fincham 1843 p. 67: a revenue cruiser's excess of draught aft, 24 in).
  draught_m: 2.6
  # LWL x beam x draught x Cb 0.45 x 1025, about 105 t, 1.24 x the 85 tons burthen (Cb judgement: fuller than the schooner's 0.33, slacker than the frigate's 0.55, for a deep full-bodied revenue cutter).
  displacement_kg: 106000.0
  # 3 ft 7 in: judgement; a cutter was stiff and carried a great press of sail (the type's reputation), heavily ballasted; more than the schooner's 3 ft 3 in on a narrower beam.
  gm_m: 1.1
  # Judgement, set as the schooner's was: the centre of pressure a little before the middle so that she is balanced close-hauled in 15 kn and carries a few degrees of weather helm on a beam reach (measured; see docs/dev/TuningNotes.md, package 32b). Fincham p. 67 puts a revenue cruiser's centre of effort 0.017 of the water-line abaft the middle.
  clr_x_m: -0.4
  # LWL x draught x 0.85 for a deep full profile.
  lateral_area_m2: 34
  # 1.34 sqrt(50 ft) = 9.5 knots, kept: the type's records of 10 to 11 knots are the big cutters' of 150 to 200 tons (judgement).
  hull_speed_kn: 9.5
  # The deck about 3 ft above the water (judgement: a low-sided vessel, as the schooner).
  deck_height_m: 0.9
  # A deep narrow blade, about 9 ft by 1 ft 6 in (judgement).
  rudder:
    area_m2: 1.2
    max_angle_deg: 35
    rate_deg_s: 5.0
spars:
# the mast (Steel calls a cutter's her main mast): 61 ft heel to head, hounded 49 ft (Fincham 1843 p. 67, the second revenue cruiser: 2.6 x the breadth) with a head 0.23 of that, 53 ft above the deck; stepped 0.269 x the breadth below the water-line (Fincham); raking 5.2 deg, 13 in in 12 ft (Fincham; Steel: 1.5 in to the yard); stationed 0.101 of the water-line before the middle (Fincham). Provisional (truth 9), see gen_ships.py. Rating: square_sail, topsail, topgallant, main.sail, main.gaff_topsail, fore.staysail in 55 kn -> 202.4 kN.
- id: main.mast
  class: mast
  x_m: 1.5
  rake_deg: 5.2
  height_m: 16.1
  rating_kn: 202.4
# topmast 38 ft with its pole: hounded 0.60 of the lower mast's hounded length, the pole 0.28 of that (Fincham p. 67); fidded above the lower mast head with cross-trees and a cap (Steel 1794: 'sometimes they have a common head, like other lower-masts, with cross-trees, cap, and top-mast'), hounds 18 ft above the cap, so that it strikes as a ship's topmast does. Provisional (truth 9), see gen_ships.py. Rating: topsail, topgallant, main.gaff_topsail in 40 kn -> 35.4 kN.
- id: main.topmast
  class: topmast
  steps_on: main.mast
  height_m: 5.6
  rating_kn: 35.4
# topgallant 'mast': the 8 ft pole of the topmast, on which the topgallant sets (Fincham; as the schooner's), sent down with the topgallant yard in a blow. Provisional (truth 9), see gen_ships.py. Rating: topgallant in 22 kn -> 1.9 kN.
- id: main.topgallant_mast
  class: topgallant_mast
  steps_on: main.topmast
  height_m: 2.5
  rating_kn: 1.9
# gaff 30 ft, 0.64 of the boom (Fincham p. 67); its jaws at the nock, 39 ft above the deck, 0.045 of the hounded mast below the hounds (as the schooner's, after Fincham art. 89). Rating: main.sail in 45 kn -> 44.1 kN.
- id: main.gaff
  class: gaff
  'on': main.mast
  length_m: 9.2
  height_m: 11.9
  rating_kn: 44.1
# boom 47 ft, 0.87 of the length on deck (Fincham p. 67), far over the counter: the clew of a cutter's mainsail lies 0.2 to 0.3 of the water-line abaft the post (Fincham art. 86); 5 ft above the deck (judgement). Rating: the sails named in the script in 45 kn -> 44.1 kN (the engine's graph loads nothing on it).
- id: main.boom
  class: boom
  'on': main.mast
  length_m: 14.5
  height_m: 1.5
  rating_kn: 44.1
# square-sail yard 46 ft, 0.84 of the length on deck (Fincham p. 67; Steel's 'cross-jack' yard of a one-masted vessel), hoisted from the deck by its halyard to the doubling under the cap, above the gaff's peak (Fincham art. 89). The type set this sail flying, the yard sent up with it and struck when it came in; the file crosses it, as a yard the engine can hoist and brace, since a yard sent up and down with its sail is not a thing the runner has (the schooner's own bare fore yard, spec M0 to M2 §12 item 7, is the same question left open). Braces 58 deg from square, as the schooner's topsail yard: a long yard, 2.4 breadths, against a cutter's few shrouds (judgement, spec 3b §2.1). Provisional (truth 9), see gen_ships.py. Rating: square_sail in 22 kn -> 9.1 kN.
- id: square_sail.yard
  class: yard
  'on': main.mast
  length_m: 14.0
  height_m: 15.9
  brace_limit_deg: 58
  rating_kn: 9.1
# topsail yard 32 ft, 0.70 of the square-sail yard (Fincham p. 67), hoisted to the topmast hounds; braces 64 deg from square, as a frigate's topsail yards (a yard of 1.7 breadths on a narrow topmast rigging; Fincham 1843 art. 102's two degrees a level aloft would give 60 over the lower yard: judgement, spec 3b §2.1). Provisional (truth 9), see gen_ships.py. Rating: topsail in 40 kn -> 17.6 kN.
- id: topsail.yard
  class: yard
  'on': main.topmast
  length_m: 9.8
  height_m: 21.3
  brace_limit_deg: 64
  rating_kn: 17.6
# topgallant yard 20 ft, 0.44 of the square-sail yard (Fincham p. 67), on the pole; braces 66 deg from square, two more than the topsail yard (judgement). Provisional (truth 9), see gen_ships.py. Rating: topgallant in 22 kn -> 1.9 kN.
- id: topgallant.yard
  class: yard
  'on': main.topgallant_mast
  length_m: 6.1
  height_m: 24.0
  brace_limit_deg: 66
  rating_kn: 1.9
# the running bowsprit: 43 ft in all, 0.79 of the length on deck (Fincham p. 67), 11 ft of it housed (0.60 x the breadth, Fincham) and 32 ft outboard rigged out, nearly horizontal (Steel 1794: cutters' bowsprits 'lie nearly in an horizontal direction'). It runs in and out on the deck through the gammoning iron by its heel-rope (Steel 1794, HEEL-ROPE: 'to haul out the bowsprits of cutters') and is fidded at its reefs: `running`, and `housed_length_m` is its outboard length reefed, 21 ft, a third in (judgement; the type had two or three reefs); `rigged_out` true is the full length, the jib's tack at its end. reef_bowsprit.yaml and rig_out_bowsprit.yaml move it; the jib, whose tack rides the traveller at the end, must be down first (spec M5 §23; package 32b). Provisional (truth 9), see gen_ships.py. Rating: jib in 55 kn -> 26.4 kN.
- id: bowsprit
  class: bowsprit
  x_m: 7.9
  length_m: 9.6
  height_m: 1.2
  running: true
  housed_length_m: 6.4
  rigged_out: true
  rating_kn: 26.4
sails:
# square sail 104 m2 (Steel 1794 p. 124, 'Sloop's square-sail, or cross-jack': square in the head and leeches, 27 ft deep, four-fifths of the mainsail's fore-leech; two reef-bands). A fair-wind sail, in the light sails, not the plain sail. Canvas No. 6 (Steel 1794 vol. I, Sail-making p. 124, 'Sloop's square-sail, or cross-jack': No. 6 or 7; the heavier taken); cloth 0.229 kN/m2, 0.71 of No. 2 by Luce App. E.
- id: square_sail
