# storm trysail 33 m2 by the cutter's rules (Steel 1794, 'Cutter's trysail'), bent in place of the mainsail; in the sail room. Canvas No. 1 (Steel 1794 vol. I, Sail-making, 'Cutter's trysail' (OCR line 14359): No. 1 or 2); rated for the wind it is cut for (package 45): 0.90 kN/m2, the model's force on a jib-headed sail at 70 knots apparent over a strain of 1.35, where the cloth's own rating of 0.358 kN/m2 (1.12 of No. 2 by Luce App. E) blew it out at sixty.
