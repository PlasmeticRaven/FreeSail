# The ground tackle (package 34, spec M5 §18): the anchors by the ship's size and the hemp cables by the fathom, every figure's rule in tools/gen_ships.py; chain cable is later than 1805 and the file says so.
ground_tackle:
  chain: false
  anchors:
  # The bowers: 1.8 cwt by the rule of five cwt to the hundred tons (35 tons burthen; the beam rule, two thirds the draught and the beam in cwt, gives 18.2), Luce 1866 ch. XIV. The cable 7 inches, half an inch to the foot of beam (judgement, unverified), rated as every rope by Luce ch. IV; two cables of 120 fathoms spliced on the best bower (Falconer 1780, CABLE; Lever 1808 p. 67).
  - id: best_bower
    kind: bower
    name: the best bower
    weight_kg: 90.0
    cable_fathoms: 240.0
    cable_in: 7.0
    cable_kn: 75.9
  - id: small_bower
    kind: bower
    name: the small bower
    weight_kg: 90.0
    cable_fathoms: 120.0
    cable_in: 7.0
    cable_kn: 75.9
  # The kedge, an eighth of the bower (Luce 1866 ch. XIV), on a hawser of half the cable's size (judgement).
  - id: kedge
    kind: kedge
    name: the kedge
    weight_kg: 10.0
    cable_fathoms: 120.0
    cable_in: 3.5
    cable_kn: 19.0
crew:
  # Eight: the Culloden's men (Charnock vol. III p. 274); Holdsworth's cod smacks of twice her tonnage carried nine to eleven (p. 141).
  complement: 8
  # A smack's crew: the english list in data/crew/names.yaml.
  names: english
  stations:
    # Hands per station, both watches together; a smack has no tops: three for the head sails, the bowsprit and the lines, judgement.
    forecastle: 3
    # Afterguard, at the main sheet: 2, judgement.
    afterguard: 2
    # The cook (spec M3 2.3).
    idlers: 1
  ratings:
    # Share of the seamen by rating: fishermen bred to it (judgement). Able: 0.80.
    able: 0.8
    # Ordinary: 0.20, the apprentices (Holdsworth p. 141).
    ordinary: 0.2
    # No landsmen.
    landsman: 0.0
  posts:
  # Station holders by post (spec M3 2.3): the master who commands her and his mate; names are drawn at muster.
  - post: master
  - post: mate
  idlers_by_trade:
    # The cook: 1, judgement.
    cook: 1
  stores:
    # Stores for a fortnight on the grounds (judgement): water for eight men, a ton.
    water_tons: 1
    # Provisions: a fortnight (judgement).
    provisions_days: 14
    # The booms: a spare topsail yard (judgement).
    spare_spars:
      # A spare topsail yard (judgement).
      yard: 1
    # Spare rope (judgement).
    cordage_fathoms: 40
