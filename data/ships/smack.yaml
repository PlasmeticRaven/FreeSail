  x_m: 1.5
  centre_height_m: 7.8
  canvas_no: 6
  cloth_rating_kn: 13.3
# topsail 26 m2, 12 ft deep between its yard and the square sail's (Steel 1794 p. 125; Willaumez 1831, SMACK: her topsail, when she carries one, hollow in the foot and sheeted to the deck); light canvas. Canvas No. 6 (Steel 1794 vol. I, Sail-making p. 125, 'Sloop's topsail': No. 6 or 7); cloth 0.229 kN/m2, 0.71 of No. 2 by Luce App. E.
- id: topsail
  class: square
  yard: topsail.yard
  area_m2: 26
  x_m: 1.3
  centre_height_m: 12.6
  canvas_no: 6
  cloth_rating_kn: 5.9
# mainsail 74 m2: foot 32 ft (0.92 of the boom), head 19 ft (0.92 of the gaff), hoist 27 ft to the nock, the gaff peaked 27 degrees (the cutter's rules, Fincham arts. 86 and 87); three reef-bands (judgement; the cutter's four on a larger sail). Canvas No. 2 (Steel 1794 vol. I, Sail-making p. 120, 'Cutter's mainsail' (a smack is rigged as a sloop): No. 1 or 2); cloth 0.320 kN/m2, 1.00 of No. 2 by Luce App. E.
- id: main.sail
  class: gaff
  mast: main.mast
  gaff: main.gaff
  boom: main.boom
  area_m2: 74
  reef_bands: 3
  x_m: -2.3
  centre_height_m: 5.7
  canvas_no: 2
  cloth_rating_kn: 23.7
# the foresail on the forestay, 15 m2 (Fincham art. 87's rules, the cutter's: foot 14 ft, luff 31 ft, leech 25 ft). Steel's smack's foresail has two reef bands 'sometimes, but a bonnet is more frequently used'; the catalogue reefs no jib-headed sail and has no bonnet yet. Canvas No. 2 (Steel 1794 vol. I, Sail-making, 'Smack's foresail' (OCR line 15622): No. 1 or 2); cloth 0.320 kN/m2, 1.00 of No. 2 by Luce App. E.
