# The ground tackle (package 34, spec M5 §18): the anchors by the ship's size and the hemp cables by the fathom, every figure's rule in tools/gen_ships.py; chain cable is later than 1805 and the file says so.
ground_tackle:
  chain: false
  anchors:
  # The bowers: 1.8 cwt by the rule of five cwt to the hundred tons (35 tons burthen; the beam rule, two thirds the draught and the beam in cwt, gives 18.2), Luce 1866 ch. XIV. The cable 7 inches, half an inch to the foot of beam (judgement, unverified), rated as every rope by Luce ch. IV; two cables of 120 fathoms spliced on the best bower (Falconer 1780, CABLE; Lever 1808 p. 67).
  - id: best_bower
    kind: bower
    name: the best bower
    weight_kg: 90.0
    cable_fathoms: 240.0
    cable_in: 7.0
    cable_kn: 75.9
  - id: small_bower
    kind: bower
    name: the small bower
    weight_kg: 90.0
    cable_fathoms: 120.0
    cable_in: 7.0
    cable_kn: 75.9
  # The kedge, an eighth of the bower (Luce 1866 ch. XIV), on a hawser of half the cable's size (judgement).
  - id: kedge
    kind: kedge
    name: the kedge
    weight_kg: 10.0
    cable_fathoms: 120.0
    cable_in: 3.5
    cable_kn: 19.0
crew:
  # Eight: the Culloden's men (Charnock vol. III p. 274); Holdsworth's cod smacks of twice her tonnage carried nine to eleven (p. 141).
  complement: 8
  # A smack's crew: the english list in data/crew/names.yaml.
  names: english
  stations:
    # Hands per station, both watches together; a smack has no tops: three for the head sails, the bowsprit and the lines, judgement.
    forecastle: 3
    # Afterguard, at the main sheet: 2, judgement.
    afterguard: 2
    # The cook (spec M3 2.3).
    idlers: 1
  ratings:
    # Share of the seamen by rating: fishermen bred to it (judgement). Able: 0.80.
    able: 0.8
    # Ordinary: 0.20, the apprentices (Holdsworth p. 141).
    ordinary: 0.2
    # No landsmen.
    landsman: 0.0
  posts:
  # Station holders by post (spec M3 2.3): the master who commands her and his mate; names are drawn at muster.
  - post: master
  - post: mate
  idlers_by_trade:
    # The cook: 1, judgement.
    cook: 1
  stores:
    # Stores for a fortnight on the grounds (judgement): water for eight men, a ton.
    water_tons: 1
    # Provisions: a fortnight (judgement).
    provisions_days: 14
    # The booms: a spare topsail yard (judgement).
    spare_spars:
      # A spare topsail yard (judgement).
      yard: 1
    # Spare rope (judgement).
    cordage_fathoms: 40
    # The carpenter's shot plugs (package 73, spec M7 §14): tapered plugs of soft wood with oakum and tallow, kept ready in action (the Regulations and Instructions 1806, the Carpenter; Falconer 1780, PLUG: 'shot-plugs ... to stop holes made by cannon shot'); the count by her class, judgement. A smack's 2.
    shot_plugs: 2
    # The sail room (spec 3b §6.3), every sail new; see tools/gen_ships.py.
    sails:
    # A spare jib (judgement).
    - kind: jib
      canvas_no: 2
      condition: 100
    # Storm canvas, one of each (spec 3b §6.4, judgement).
    - kind: storm_trysail
      canvas_no: 1
      condition: 100
    - kind: storm_jib
      canvas_no: 1
      condition: 100
  ration:
    # The ration (package 54, spec M7b 19): the Navy's table, the Regulations of 1806 (Sect. IX, Chap. I, Art. I), as data/crew/ration.yaml gives it; the measure for a smack's men, found by her owner (judgement).
    table: navy
    # Water drawn a man a day for his drink, his grog and the coppers: a gallon, the figure her water above is reckoned at (judgement).
    water_gallons: 1
  # The named people beyond the posts (package 43b): the boy as the messenger; see tools/gen_ships.py.
  people:
  # An apprentice boy as the messenger (judgement; Holdsworth p. 141, the smacks' apprentices).
  - role: boy
    station: afterguard
    rating: ordinary
    messenger: true
# The hold (package 35, spec M5 §23): room for 18 tons of cargo beyond her own stores, 0.5 of the 35 tons burthen (a fishing smack's hold forward and aft of her well: judgement; Falconer 1780, HOLD); see tools/gen_ships.py. The well, 9.1 m3 (10 ft by 8 by 4 ft below the water-line, judgement), the water-tight compartment amidships open to the sea through holes in her bottom (Holdsworth 1874 pp. 139 to 140; Steel 1805, WELL), where the live cod are kept.
hold:
  capacity_tons: 18
  well_m3: 9.1
# The pumps (package 73, spec M7 §13): the chain pump of Cole and Bentinck, a ton in 43 seconds and a half with four men (Falconer 1780, PUMP), and the common brake pump with two; the counts by the ship's class (Lavery, Arming and Fitting; Steel 1794); see tools/gen_ships.py.
pumps:
# A brake pump (the common or elm-tree pump): two men, 15 tons an hour fresh (judgement).
- id: pump.hand.1
  kind: hand
  name: the pump
  tons_per_hour: 15.0
  hands: 2
# The boats (package 35, spec M5 §23): their lengths by Luce 1866's rule ('Boats', 'Rules for Size of Boats for Ships-of-War': the launch 2.6 times the square root of the ship's length, the cutters 0.9 of it), the allowance after Steel 1794 vol. II and Falconer 1780 (BOAT, PINNACE, YAWL), the oars a thwart to three feet, the tons by Luce's weight rule for the boat herself; see tools/gen_ships.py.
boats:
# The smack's boat, for the lines and the shore (Holdsworth pp. 137 to 139; judgement on the size).
- id: boat
  kind: yawl
  name: the boat
  length_ft: 11.0
  oars: 2
  crew: 3
  tons: 0.1
# The fishing gear (package 56, spec M7b §21a): what she carries and no other, each with its source; the evolutions that work it are data/evolutions/shoot_*.yaml and haul_*.yaml, its fishing the grounds' of data/fishing/; see tools/gen_ships.py.
gear:
# A beam trawl of 36 ft, the smallest of the deep-sea trawls and the Yarmouth men's (Holdsworth 1874 pp. 47, 59), towed with the tide under easy sail at half a knot to a knot and a half faster than the stream, five or six hours a haul, and hove up by the winch in three quarters of an hour (pp. 70 to 71, 77 to 79); the warp 120 fathoms, judgement.
- id: trawl
  kind: trawl
  name: the trawl
  beam_ft: 36.0
  length_fathoms: 120
# Longlines, 90 lines of 40 fathoms and 2,340 hooks baited with whelks: half of the 68-ton cod smack's string (Holdsworth 1874 pp. 137 to 139), judgement on her size; the cod put alive into the well.
- id: lines
  kind: lines
  name: the lines
  length_fathoms: 3600
  hooks: 2340
# A tuck-sean of 80 fathoms, eight deep at the sleeves and ten at the bunt, shot round a shoal from the boat in a bay by day and tucked into the boat at once (Holdsworth 1874 p. 158: 'where only one net is used for the whole process ... the net is called ... either a stop-sean or a tuck-sean'). The pilchard seans of St Ives and the south coast were the seine companies' with their own boats (pp. 188 to 195); a smack's own small sean worked by her boat is judgement, for the spec's truth 105.
- id: seine
  kind: seine
  name: the seine
  length_fathoms: 80
