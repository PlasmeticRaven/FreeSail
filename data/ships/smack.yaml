  centre_height_m: 4.0
  canvas_no: 2
  cloth_rating_kn: 4.8
# the jib, 26 m2 (Fincham art. 87's rules, the cutter's): tack 9 in short of the bowsprit end, 20 ft before the stem, luff 42 ft, clew at the stem head; it wants the bowsprit rigged out (halyard_spar), as the cutter's. Canvas No. 2 (Steel 1794 vol. I, Sail-making, 'Smack's jib' (OCR line 15709): No. 1 or 2); cloth 0.320 kN/m2, 1.00 of No. 2 by Luce App. E.
