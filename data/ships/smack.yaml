  length_fathoms: 3600
  hooks: 2340
# A tuck-sean of 80 fathoms, eight deep at the sleeves and ten at the bunt, shot round a shoal from the boat in a bay by day and tucked into the boat at once (Holdsworth 1874 p. 158: 'where only one net is used for the whole process ... the net is called ... either a stop-sean or a tuck-sean'). The pilchard seans of St Ives and the south coast were the seine companies' with their own boats (pp. 188 to 195); a smack's own small sean worked by her boat is judgement, for the spec's truth 105.
