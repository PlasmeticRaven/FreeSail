# The smack: Culloden, the Navy's smack of 1746 (B. Slade, Plymouth), 35 tons, 43 ft on
# the gun deck by 14 ft (Charnock 1802 vol. III p. 274; docs/design/VesselReferences-
# 2026-10.md § 2, decision 42). Generated by tools/gen_ships.py; edit that script and
# rerun, do not edit this file. Spars: Steel 1794 vol. I p. 41, 'Proportions of masts,
# yards, &c. for sloops, smacks, and hoys'; the sails' shapes the cutter's (Fincham 1843
# arts. 86, 87); canvas: Steel's smack's and sloop's sails; the running bowsprit:
# Lescallier 1791 p. 420; the well: Holdsworth 1874 pp. 139 to 140. Units: metres, m2,
# kg, kN. Comments mark judgements. Package 43b (spec M6 §19): no engine change but the
# hold's well.
ship:
  name: Culloden
  rig: smack
  era_notes: 'The Navy''s smack Culloden (built at Plymouth by B. Slade, 1746, stationed in Scotland):
    35 tons burthen, 43 ft on the gun deck, 34 ft keel, 14 ft breadth, 5 ft 6 in depth, 8 men and 2 guns
    (Charnock 1802 vol. III p. 274); cutter-rigged with a running bowsprit (Lescallier 1791 p. 420) by
    Steel''s proportions for sloops, smacks and hoys (1794 vol. I p. 41), with a well amidships (Holdsworth
    1874 pp. 139 to 140; Steel 1805, WELL). The fisherman of the Channel''s grounds and the small handy
    vessel of the regatta (spec M6 §19); see tools/gen_ships.py for every rule.'
  descriptions:
    smack:
      rig: a smack
      what: a fishing smack, her well amidships
      note: The Culloden smack's hull (Charnock vol. III p. 274) as the fisherman of the Channel's grounds
        (spec M6 §19; judgement on the words).
hull:
  # 40 ft: judgement between the 34 ft keel and the 43 ft gun deck (Charnock vol. III p. 274), a plumb stem and a raking post.
  length_waterline_m: 12.2
  # 14 ft 0 in (Charnock vol. III p. 274).
  beam_m: 4.3
  # 6.25 ft mean: 7.0 ft aft, half her breadth (the cutter's rule for the type, judgement), 5.5 ft forward; Chapman's English smack (1768, plate LIX No. 3) draws 6.3 ft. Her depth in hold, 5 ft 6 in (Charnock), is the check that she is not deeper.
  draught_m: 1.9
  # LWL x beam x draught x Cb 0.45 x 1025, about 1.3 x the 35 tons burthen: the cutter's block (judgement; Holdsworth p. 66, the old smacks 'built with the principal object of living through anything'). The well's water counts in it: it moves with her though it buoys her not (hold.well_m3; judgement on Holdsworth).
  displacement_kg: 46000.0
  # 3 ft: judgement; a smack was stiff and heavily ballasted, a little less than the cutter's 3 ft 7 in on her narrower beam.
  gm_m: 0.9
  # Judgement, as the cutter's: the centre of pressure a little before the middle so that she is nearly balanced close-hauled and carries a little weather helm on a beam reach (measured; docs/dev/TuningNotes.md, package 43b).
  clr_x_m: -0.3
  # LWL x draught x 0.85 for a deep full profile (the cutter's rule).
  lateral_area_m2: 20
  # 1.34 sqrt(40 ft).
  hull_speed_kn: 8.5
  # The deck about 2 ft 6 in above the water (judgement).
  deck_height_m: 0.75
  # A blade about 6 ft 6 in deep by 1 ft 2 in (judgement, the cutter's in small).
  rudder:
    area_m2: 0.7
    max_angle_deg: 35
    rate_deg_s: 6.0
    span_m: 2.0
spars:
# the mast and topmast in one stick, 52.5 ft heel to head, 3 3/4 the breadth (Steel 1794 vol. I p. 41, sloops, smacks and hoys), 46 ft above the deck; the hounds 3/4 of the whole from the heel (33 ft above the deck); stepped 3.8 ft below the water-line (Fincham's cutter, 0.269 of the breadth); raking 2.4 deg (Steel: cutters 1.5 in to the yard); stationed 0.15 of the water-line before the middle, well forward for a large mainsail (Holdsworth 1874 pp. 70 to 71; judgement on the figure). No topmast to strike: the topsail yard crosses the mast's own head. Provisional (truth 9), see gen_ships.py. Rating: square_sail, topsail, main.sail, fore.staysail in 55 kn -> 84.1 kN.
- id: main.mast
  class: mast
  x_m: 1.8
  rake_deg: 2.4
  height_m: 14.1
  rating_kn: 84.1
# gaff 21 ft, 3/5 of the boom (Steel p. 41); its jaws at the nock, 31 ft above the deck (the cutter's rule after Fincham art. 89). Rating: main.sail in 45 kn -> 23.5 kN.
- id: main.gaff
  class: gaff
  'on': main.mast
  length_m: 6.4
  height_m: 9.6
  rating_kn: 23.5
# boom 35 ft, 2/3 of the mast (Steel p. 41), over the counter; 4 ft above the deck (judgement); horse_m is the horse across the stern for the sheet to travel on (Steel 1794 vol. I, p. 167, HORSE: 'a thick iron rod, fastened at the ends to the inside of the stern of vessels that carry a fore and aft mainsail, for the main sheet to travel on'), half the beam (judgement: the inside breadth of the stern); the sheet's geometry reads it (evolutions/trim.py). Rating: the sails named in the script in 45 kn -> 23.5 kN (the engine's graph loads nothing on it).
- id: main.boom
  class: boom
  'on': main.mast
  length_m: 10.7
  height_m: 1.2
  horse_m: 2.1
  rating_kn: 23.5
# the cross-jack yard 31.5 ft, 3/5 of the mast (Steel p. 41), the square sail's, hoisted to the hounds; braces 58 deg from square, as the cutter's (judgement). Willaumez 1831, SMACK: a square sail hoisted and lowered with its yard. Provisional (truth 9), see gen_ships.py. Rating: square_sail in 22 kn -> 4.5 kN.
- id: square_sail.yard
  class: yard
  'on': main.mast
  length_m: 9.6
  height_m: 10.1
  brace_limit_deg: 58
  rating_kn: 4.5
# topsail yard 25.2 ft, 4/5 of the cross-jack yard (Steel p. 41), on the mast's head above the hounds; braces 64 deg from square, as the cutter's (judgement). Provisional (truth 9), see gen_ships.py. Rating: topsail in 40 kn -> 7.4 kN.
- id: topsail.yard
  class: yard
  'on': main.mast
  length_m: 7.7
  height_m: 13.6
  brace_limit_deg: 64
  rating_kn: 7.4
# the running bowsprit: 29 ft in all, 5/9 of the mast (Steel p. 41, the fraction uncertain in the small type), 8 ft of it inboard (the cutter's 0.60 of the breadth) and 21 ft outboard rigged out; it runs in a ring of iron and comes inboard (Lescallier 1791 p. 420), as the cutter's does; reefed, 14 ft outboard (a third in, the cutter's). Provisional (truth 9), see gen_ships.py. Rating: jib in 55 kn -> 12.1 kN.
- id: bowsprit
  class: bowsprit
  x_m: 6.4
  length_m: 6.3
  height_m: 1.0
  running: true
  housed_length_m: 4.2
  rigged_out: true
  rating_kn: 12.1
sails:
# square sail 58 m2 (Steel 1794 p. 124, 'Sloop's square-sail, or cross-jack': 22 ft deep, four-fifths of the mainsail's fore-leech; one reef-band, judgement); a fair-wind sail, in the light sails. Canvas No. 6 (Steel 1794 vol. I, Sail-making p. 124, 'Sloop's square-sail, or cross-jack': No. 6 or 7; the heavier taken); cloth 0.229 kN/m2, 0.71 of No. 2 by Luce App. E.
