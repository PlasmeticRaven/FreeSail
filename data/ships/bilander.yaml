# The bilander Hopewell: a British coasting bilander under a settee main, Chapman's
# bilander of 1768 (Pl. LXII No. 5) at the plate's own scale drawn as Gwyn's British
# bilander of about 1780 (RMG PAG3828, measured on the museum's image and never copied) on
# Steel 1805's brig collier's body. Generated by tools/gen_ships.py
# (tools/ships/bilander.py, her settee by tools/ships/settee.py); edit those and rerun, do
# not edit this file. Her design: docs/design/Design-Ship-Bilander.md. Rope: the brig's
# scaled to her sail (judgement). Spar ratings are provisional, set for truth 9 with the M1
# sail curves; see the script. Canvas: Steel 1794 vol. I; cloth ratings from the number by
# Luce App. E. Units: metres, m2, kg, kN. Comments mark judgements.
ship:
  name: Hopewell
  rig: bilander
  era_notes: 'A British coasting bilander under a settee main: two masts, a ship''s square fore and a
    main with the long lateen-cut settee under its topsail and a dry yard, a raised quarterdeck and a
    round windowed stern; an old survivor of a rig rare by 1769 (Falconer 1780, BILANDER) and ''seldom
    used but by the Dutch'' by 1794 (Steel 1794 vol. I p. 220), the last British bilander in the register
    in 1789 (Lloyd''s Register). Her hull Chapman''s bilander of 1768 at the plate''s own scale, 70.6
    by 19.4 ft (Architectura Navalis Mercatoria Pl. LXII No. 5), drawn as Edward Gwyn''s British bilander
    of about 1780 (RMG PAG3828) on Steel 1805''s brig collier''s body; 118 tons burthen on her waterline
    and 128 on her length taffrail to stem head by the old measure; rigged to Gwyn''s heights with Chapman''s
    yards. Unarmed by default, a trader of eight hands, with the armed merchant''s four 3-pounders and
    four swivels for the editor (Lloyd''s 1779 and 1782: the Elizabeth''s guns). Not the Hopewell of Poole,
    a bilander of 150 tons built in 1749 and lengthened in 1756 (Lloyd''s 1776, 1779), whose name she
    bears by the owner''s answer of 2026-10-29. Undated. See tools/ships/bilander.py for every figure''s
    source.'
  descriptions:
    bilander:
      rig: a bilander
      what: a bilander, a merchantman under a settee main, deep laden
      note: 'The tops make her out a bilander: her settee''s yard, peaked high over her stern and the
        longest spar she carries, is the rig''s mark, as a lugger''s lugs are, and the period named the
        rig on sight (Falconer 1780, BILANDER; Steel 1794 vol. I p. 220; Röding vol. I col. 304: it differs
        from the brig and the snow by its great sail); judgement on the words (D16 (a)). ''Deep laden''
        is the merchantman''s look, judgement, as the merchant brig''s. Unarmed, her file''s default;
        a merchant''s role (Build-Ships.md §8.2).'
      fit: unarmed
      roles:
      - merchant
hull:
  # 70.6 ft, Chapman 1768 Pl. LXII No. 5 sternpost to stem (72.5 Swedish ft at the plate's own scale, +-1.5 to 2 ft where the stem is read; Research-Bilander-2026-10.md §2.4, measured), D7 (a). Plainly: not scaled by D6 (a)'s 'about 2%' to 130 tons, a factor no source gives and inside the plate's own error (her design's §2.1).
  length_waterline_m: 21.52
  # 19.4 ft, No. 5's two breadth marks (19.9 Swedish ft, +-1.5%), taken as extreme (judgement: the marks do not say).
  beam_m: 5.91
  # 11.5 ft to the keel's lower edge (D29 (b)'s convention): Lloyd's draught loaded for the two bilanders of 130 tons, 12 ft for Elizabeth and 11 ft for the Duke of York of Bristol (read on the row images); the mean, judgement. The register's key (1781) does not say whether the column is the mean or the greatest. Steel 1805's brig collier of 170 tons draws 10 ft 9 in afore and abaft (Folio I, read), less than the register's bilanders of 130: the register's column perhaps the greatest draught deep laden (judgement). Chapman draws no draught.
  draught_m: 3.51
  # LWL x beam x draught x Cb 0.50 x 1025, the brig file's method (D7 (a)); Cb the brig's, judgement. The drawn hull's displacement is beside it in the generator's report, never in its place (Build-Ships.md §5.0 principle 8).
  displacement_kg: 229000.0
  # The brig's method: the frigate's 4 ft 3 in scaled by the breadth, 19.4 against 38.3 ft. Judgement; a deep-laden coaster.
  gm_m: 0.66
  # Tuned for her helm (her design's §9, the second knob) as the house tunes it, her helm sailed under plain sail in 15 kn: from the brig's 0.5 m as a share of her waterline (+0.40, 0.019 L), where she carried 12.2 degrees of lee helm at 60 degrees off the wind and 4.1 abeam, to +2.0, where she carries 4.0 degrees of lee helm at 60 degrees, 2.1 at 67.5 and 1.1 abeam. The house's little weather helm close-hauled wants about +3.0 (balanced there), where hove to she comes head to wind and makes sternway; +2.0 is the most, by quarter metres, her heave-to keeps her lying to within four to seven points in 8 to 25 kn, the polar's winds (judgement on the measures; at +2.25 she was forced round through the wind hove to in 8 kn). Her drawn lateral plane's centroid is at x -0.23; the figure is the engine's balance, not a drawn point.
  clr_x_m: 2.0
  # LWL x draught x 0.85, the brig's rule.
  lateral_area_m2: 64.2
  # D24 (a): the brig's 11.5 kn by the root of the waterlines, 70.6 over 88 ft. No period speed exists for a bilander (Research-Bilander-2026-10.md §4); within 9.8 to 10.8 kn if her polar wants it (her design's §9, the third knob). Kept at her step 4: her closest and her beat hold the brig's 50 and 60 degrees across the whole band, so nothing asks a move.
  hull_speed_kn: 10.3
  # Her upper deck at side at x 0 (D18 (a); Build-Ships.md §5.5), flush from the stem to the taffrail under the raised quarterdeck: Chapman's rail less a merchant's waist of about 2 ft 5 in (judgement). Steel 1805's coasting sloop floats with her deck 3 ft 0 1/2 in above the water at dead flat, the like freeboard. Steel's brig collier, the stand-in for her body, has her deck nearly at her top-timber line, its waist 3 in deep at the lowest place (Folio XXXII, read): a collier's flush deck, the check that does not hold (recorded; the datum stands).
  deck_height_m: 0.92
  # The brig's blade by her length and draught (judgement): 2.4 m2, its span 3.2 m; 35 degrees the period stop.
  rudder:
    area_m2: 2.4
    max_angle_deg: 35
    rate_deg_s: 3.5
    span_m: 3.2
  # Her lines (Build-Ships.md §5.0-§5.3; her design's §3): above the water Chapman 1768 Pl. LXII No. 5 at the plate's own scale (her side, her length, her masts) with Gwyn's sheer, raised quarterdeck, wale, head and stern on it (RMG PAG3828, measured and laid on Chapman's rail length); under the water Steel 1805's brig collier of 170 27/94 tons (Tables p. 26, the page image read), her type's nearest table, no lines of any bilander existing: lengths by her waterline over the collier's 76 ft 11 in between the perpendiculars, the sections by her beam over its 22 ft 11 in extreme breadth, so that its floor, tumblehome and flare keep their angles (principle 7). The drawn depth and displacement are recorded beside her draught and displacement in the generator's report, never moved (principle 8).
  profile:
    # The top of the side, taffrail to stem head. The waist Chapman's, 5.4 ft above the water (5.3 to 5.5 ft, measured); above it Gwyn's rise at Chapman's scale: the quarterdeck's light rail on stanchions from its break, 0.325 of the length from the taffrail, up to the taffrail, and the bow's rise to the stem head (measured on the hull crop). The taffrail and the stem head stand beyond the water's ends by Chapman's overhang, 75.6 less 70.6 ft, two-thirds abaft the post and a third before the stem (measured on the plate by two methods). Chapman's own sheer, read roughly, rises 2.7 ft forward and 3.6 ft aft (the check). Stand-in: Gwyn's metres rest on Chapman's scale.
