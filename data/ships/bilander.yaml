# The ground tackle (package 34, spec M5 §18): the anchors by the ship's size and the hemp cables by the fathom, every figure's rule in tools/gen_ships.py; chain cable is later than 1805 and the file says so.
ground_tackle:
  chain: false
  anchors:
  # The bowers: 6.4 cwt by the rule of five cwt to the hundred tons (128 tons burthen; the beam rule, two thirds the draught and the beam in cwt, gives 27.1), Luce 1866 ch. XIV. The cable 9.5 inches, half an inch to the foot of beam (judgement, unverified), rated as every rope by Luce ch. IV; two cables of 120 fathoms spliced on the best bower (Falconer 1780, CABLE; Lever 1808 p. 67). The period's check: Steel 1794 vol. I's anchor table is the Navy's and ends at the brigs of 200 tons, three anchors of 12 cwt, and the cutter, three of 10 cwt (the page image, IA leaf n127, read for her design), a King's allowance heavier than a merchant's: the house's rule, later than her years, is kept for the two traders alike (judgement; Bil-D §7). Two bowers and a kedge, no sheet or stream under 200 tons (Lever 1808 p. 67). Gwyn's catted anchor, if it is one, a bower.
  - id: best_bower
    kind: bower
    name: the best bower
    weight_kg: 330.0
    cable_fathoms: 240.0
    cable_in: 9.5
    cable_kn: 139.8
  - id: small_bower
    kind: bower
    name: the small bower
    weight_kg: 330.0
    cable_fathoms: 120.0
    cable_in: 9.5
    cable_kn: 139.8
  # The kedge, an eighth of the bower (Luce 1866 ch. XIV), on a hawser of half the cable's size (judgement).
  - id: kedge
    kind: kedge
    name: the kedge
    weight_kg: 40.0
    cable_fathoms: 120.0
    cable_in: 5.0
    cable_kn: 38.7
crew:
  # Eight (D43): a coasting trader of about 130 tons, the master, the mate, four seamen, a boy and a cook (judgement). No source gives a bilander's company (Research-Bilander-2026-10.md §2.8): the Nancy of Boston, 170 tons and catalogued 'brigantine or bilander', had ten in 1779 (TNA HCA 32/405/21, the catalogue); the merchant brig's five men to a hundred tons gives six or seven, and a settee dipped by hand at every tack wants the upper figure.
  complement: 8
  # A British coaster's people: the english list in data/crew/names.yaml, as the smack's.
  names: english
  stations:
    # Hands per station, both watches together (Bil-D §6.1; judgement). No forecastle station: the head sheets and the anchors fall to the fore topmen by the hands' ranking, a company of eight having no hand to spare for one. Fore topmen: 2, the main top's alike.
    fore_top: 2
    # Main topmen: 2, for the settee's loosing and furling aloft and her main topsail and topgallant (Ext §5.1 and its risk 10: two in the main top at the least).
    main_top: 2
    # Afterguard: the boy, 1, the messenger (the smack's and the merchant brig's).
    afterguard: 1
    # Idlers: the cook.
    idlers: 1
  ratings:
    # Share of the seamen by rating: the merchant brig's (judgement). A merchantman shipped able seamen and few others. Able: 0.70.
    able: 0.7
    # Ordinary: 0.20, judgement.
    ordinary: 0.2
    # Landsmen: 0.10, judgement.
    landsman: 0.1
  posts:
  # Station holders by post (spec M3 2.3): the master who commands her and the mate, as the smack's (data/people/bilander.yaml); names are drawn at muster.
  - post: master
  - post: mate
  idlers_by_trade:
    # How the idlers are made up: the cook, 1.
    cook: 1
  stores:
    # Water for two months: eight men at a gallon a day is about 2 tons, and some over (judgement).
    water_tons: 3
    # Provisions: two months, a coaster's passage and its delays (judgement).
    provisions_days: 60
    # The booms: a trader's spare (Bil-D §7; judgement after Luce 1866 ch. XVII, scaled down); see tools/ships/bilander.py.
    spare_spars:
      # A spare topsail yard, to answer either mast (judgement, after Luce 1866).
      yard: 1
    # Spare rope (judgement).
    cordage_fathoms: 80
    # The carpenter's shot plugs (package 73, spec M7 §14): tapered plugs of soft wood with oakum and tallow, kept ready in action (the Regulations and Instructions 1806, the Carpenter; Falconer 1780, PLUG: 'shot-plugs ... to stop holes made by cannon shot'); the count by her class, judgement. A small trader's 2, the smack's.
    shot_plugs: 2
    # The sail room (spec 3b §6.3): a trader's second suit of the sails she wears out (Bil-D §7); see tools/ships/bilander.py.
    sails:
    # A second fore topsail and jib (judgement, as the merchant brig's).
    - kind: fore.topsail
      canvas_no: 2
      condition: 100
    - kind: jib
      canvas_no: 6
      condition: 100
    # Storm canvas, one of each (spec 3b §6.4).
    - kind: fore.storm_staysail
      canvas_no: 1
      condition: 100
    - kind: main.storm_staysail
      canvas_no: 1
      condition: 100
  ration:
    # The ration (package 54, spec M7b 19): the Navy's table, the Regulations of 1806 (Sect. IX, Chap. I, Art. I), as data/crew/ration.yaml gives it; a coaster's articles promised the like, as the merchant brig's (judgement: no scale of the period's merchant service is in the references).
    table: navy
    # Water drawn a man a day for his drink, his grog and the coppers: a gallon, the figure her water above is reckoned at (judgement).
    water_gallons: 1
  # The named people beyond the posts (package 35, spec M5 §22): the boy as the messenger; see data/people/bilander.yaml.
  people:
  # An apprentice boy as the messenger (judgement), as the smack's.
  - role: boy
    station: afterguard
    rating: ordinary
    messenger: true
  # The quarter bill beyond the gun crews (spec M7 8a; package 70; docs/design/Design-WorkInAction.md): at quarters every man has a station by it, the gun crews the fit's (each gun's crew above), the sail trimmers here by station (the men who leave the guns for a brace or a sail: Luce 1884 ch. XX, 'Watch, Quarter and Station Bills'), the hands at the helm, the powder beyond the idlers, and the fighting book's priority when sail work wants more hands than the trimmers give; the marines, the carpenter's crew and the surgeon's mates have their stations by their trades. The counts are judgement against the stations above.
  quarter_bill:
    trimmers:
      # The trimmers: a topman of each top for the braces and the sheets, the merchant brig's (judgement); the settee's sheet is her trim aft.
      fore_top: 1
      main_top: 1
