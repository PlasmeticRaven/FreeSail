# The ground tackle (package 34, spec M5 §18): the anchors by the ship's size and the hemp cables by the fathom, every figure's rule in tools/gen_ships.py; chain cable is later than 1805 and the file says so.
ground_tackle:
  chain: false
  anchors:
  # The bowers: 11.2 cwt by the rule of five cwt to the hundred tons (224 tons burthen; the beam rule, two thirds the draught and the beam in cwt, gives 31.3), Luce 1866 ch. XIV. The cable 12 inches, half an inch to the foot of beam (judgement, unverified), rated as every rope by Luce ch. IV; two cables of 120 fathoms spliced on the best bower (Falconer 1780, CABLE; Lever 1808 p. 67).
  - id: best_bower
    kind: bower
    name: the best bower
    weight_kg: 570.0
    cable_fathoms: 240.0
    cable_in: 12.0
    cable_kn: 223.1
  - id: small_bower
    kind: bower
    name: the small bower
    weight_kg: 570.0
    cable_fathoms: 120.0
    cable_in: 12.0
    cable_kn: 223.1
  # The sheet anchor, the bowers' size and cable (Lever 1808 p. 67).
  - id: sheet
    kind: sheet
    name: the sheet anchor
    weight_kg: 570.0
    cable_fathoms: 120.0
    cable_in: 12.0
    cable_kn: 223.1
  # The stream anchor, a quarter of the bower (Luce 1866 ch. XIV, the Book of Allowances), its cable two thirds of the bower's (judgement).
  - id: stream
    kind: stream
    name: the stream anchor
    weight_kg: 140.0
    cable_fathoms: 120.0
    cable_in: 8.0
    cable_kn: 99.2
  # The kedge, an eighth of the bower (Luce 1866 ch. XIV), on a hawser of half the cable's size (judgement).
  - id: kedge
    kind: kedge
    name: the kedge
    weight_kg: 70.0
    cable_fathoms: 120.0
    cable_in: 6.0
    cable_kn: 55.8
crew:
  # A privateer's complement of about forty (Chapelle, The Baltimore Clipper; judgement, spec M3 2.3).
  complement: 40
  # A Baltimore crew: the american list in data/crew/names.yaml.
  names: american
  stations:
    # Hands per station, both watches together; a schooner has no main or mizzen top and carries no marines. Forecastlemen: 10, judgement (spec M3 2.3).
    forecastle: 10
    # Fore topmen, for the topsail and topgallant: 6, judgement (spec M3 2.3).
    fore_top: 6
    # Afterguard, at the main sheet and the gaff sails: 11, judgement (spec M3 2.3).
    afterguard: 11
    # Waisters: 6, judgement (spec M3 2.3).
    waisters: 6
    # Idlers: the trades below (spec M3 2.3).
    idlers: 4
  ratings:
    # Share of the seamen by rating: judgement. A privateer shipped prime seamen where she could, and more able hands than a King's ship. Able: 0.45.
    able: 0.45
    # Ordinary: 0.40, judgement.
    ordinary: 0.4
    # Landsmen: 0.15, judgement.
    landsman: 0.15
  posts:
  # Station holders by post (spec M3 2.3); names are drawn at muster.
  - post: master
  - post: mate
  - post: boatswain
  idlers_by_trade:
    # How the idlers are made up (spec M3 2.3). The cook: 1, judgement.
    cook: 1
    # A steward: 1, judgement.
    steward: 1
    # A carpenter: 1, judgement.
    carpenter's crew: 1
    # A sailmaker: 1, judgement.
    sailmaker's crew: 1
  stores:
    # Stores for a short cruise (spec M3 2.3). Water for six weeks: 40 men at a gallon a day is about 7.5 tons (judgement).
    water_tons: 8
    # Provisions: two months (judgement).
    provisions_days: 60
    # The booms: the spare spars by class (judgement after Luce 1866 ch. XVII, 'Stowing Booms', and Chapelle 1930, 'Masting Rules and Sail Plans'); see tools/gen_ships.py.
    spare_spars:
      # One topmast, to answer either mast (judgement, after Chapelle).
      topmast: 1
      # A spare topsail yard (judgement, after Luce 1866).
      yard: 1
      # A pair of topmast studding-sail booms (judgement, after Luce 1866).
      studdingsail_boom: 2
    # Spare rope (judgement).
    cordage_fathoms: 150
    # The carpenter's shot plugs (package 73, spec M7 §14): tapered plugs of soft wood with oakum and tallow, kept ready in action (the Regulations and Instructions 1806, the Carpenter; Falconer 1780, PLUG: 'shot-plugs ... to stop holes made by cannon shot'); the count by her class, judgement. A schooner's 8.
    shot_plugs: 8
    # The sail room (spec 3b §6.3), every sail new; see tools/gen_ships.py.
    sails:
    # A second foresail, fore topsail and jib (spec 3b §6.3, judgement).
    - kind: fore.sail
      canvas_no: 2
      condition: 100
    - kind: fore.topsail
      canvas_no: 2
      condition: 100
    - kind: jib
      canvas_no: 2
      condition: 100
    # Storm canvas, one of each (spec 3b §6.4, judgement).
    - kind: storm_trysail
      canvas_no: 1
      condition: 100
    - kind: storm_jib
      canvas_no: 1
      condition: 100
    # The occasional sails, one each (spec 3b §6.4).
    - kind: ringtail
      canvas_no: 5
      condition: 100
    - kind: water_sail
      canvas_no: 7
      condition: 100
  ration:
    # The ration (package 54, spec M7b 19): the Navy's table, the Regulations of 1806 (Sect. IX, Chap. I, Art. I), as data/crew/ration.yaml gives it; a private ship of war's articles promised the like (judgement).
    table: navy
    # Water drawn a man a day for his drink, his grog and the coppers: a gallon, the figure her water above is reckoned at (judgement).
    water_gallons: 1
  # The named people beyond the posts (package 35, spec M5 §22); see tools/gen_ships.py.
  people:
  # A boy as the messenger (judgement).
  - role: boy
    station: afterguard
    rating: landsman
    messenger: true
  # The quarter bill beyond the gun crews (spec M7 8a; package 70; docs/design/Design-WorkInAction.md): at quarters every man has a station by it, the gun crews the fit's (each gun's crew above), the sail trimmers here by station (the men who leave the guns for a brace or a sail: Luce 1884 ch. XX, 'Watch, Quarter and Station Bills'), the hands at the helm, the powder beyond the idlers, and the fighting book's priority when sail work wants more hands than the trimmers give; the marines, the carpenter's crew and the surgeon's mates have their stations by their trades. The counts are judgement against the stations above.
  quarter_bill:
    trimmers:
      # PROVISIONAL. The trimmers: four of the forecastlemen for the head sails (judgement).
      forecastle: 4
      # Three of the fore topmen for the fore braces and the topsail.
      fore_top: 3
      # Four of the afterguard at the main sheet and the gaffs.
      afterguard: 4
    # One man at the tiller (a Baltimore schooner steered with a tiller; judgement).
    helm: 1
    # Two of the waisters to pass the cartridges (judgement).
    powder: 2
    # The quarter gunners and the gunner's crew in the filling room, one to every four cannon (Falconer 1780, QUARTER-GUNNER, l.14283-14289); the swivels are not cannon (practice and resupply, between packages 72 and 73).
    filling: 1
    # The fighting book's priority when sail work wants more hands than the trimmers give (spec M7 8a): 'sail before guns' robs the guns (the disengaged battery first) and the log says from where; 'guns before sail' makes the sail work wait short-handed. The player's book and the doctrine may say otherwise.
    priority: sail before guns
    # Eight of her people with the stand of arms' muskets (PROVISIONAL, for package 75: judgement after the King's cutter's six of thirty); she bears no marines.
    small_arms: 8
    # Twenty-six boarders of her forty with cutlass and pistol (PROVISIONAL, for package 75: judgement after the King's cutter's twenty of thirty; a privateer's company boards almost whole).
    boarders: 26
# The armament (spec M7 7; package 70's shape): PROVISIONAL, the owner's ask of 2026-10-25 ahead of package 75, which gives the schooner her fits from the type's own records. Two fits the scenario chooses between (ship: {fit: ...}): the long Tom on its pivot with four carronades, the default, and a letter of marque's six long 6-pounders. Every figure's source is in tools/gen_ships.py; the weights are from memory and UNVERIFIED against a page.
