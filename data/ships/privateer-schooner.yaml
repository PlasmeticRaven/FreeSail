      # PROVISIONAL (the owner's loadout, 2026-10-25). The long Tom: a long 12-pounder of 34 cwt (from memory) on a pivot amidships between the masts, firing over the rail to either side; nine men by the gun's rule. Its arc from 60 to 140 degrees off the bow (the owner's ruling of the day, from her rig: the fore topmast backstays at about 55 to 60 degrees from the pivot, the main shrouds at about 140 to 150; docs/design/Proposal-PivotGun.md §3).
