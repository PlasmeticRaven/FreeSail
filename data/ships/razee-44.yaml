# The ground tackle (package 34, spec M5 §18): Steel's anchors and cables for a 64 (Steel 1794 vol. I; D33 (a); Indf §7), every figure's source in tools/ships/indefatigable.py; chain cable is later than 1805.
ground_tackle:
  chain: false
  anchors:
  # The bowers: Steel's four of 57 cwt for a 64 (Steel 1794 vol. I, the anchor table, the page image read: Ind §6.2; D33 (a)); the cables Steel's seven of 21 in ('A Cordage Table', read), rated as every rope by Luce 1866 ch. IV, laid three on the best bower and two on the small, 'three Cables on the best Bower, two on the small Bower' (Lever 1808 p. 67), 120 fathoms a cable (Falconer 1780, CABLE).
  - id: best_bower
    kind: bower
    name: the best bower
    weight_kg: 2896.0
    cable_fathoms: 360.0
    cable_in: 21.0
    cable_kn: 683.2
  - id: small_bower
    kind: bower
    name: the small bower
    weight_kg: 2896.0
    cable_fathoms: 240.0
    cable_in: 21.0
    cable_kn: 683.2
  # The sheet anchor, a bower's size, on one cable.
  - id: sheet
    kind: sheet
    name: the sheet anchor
    weight_kg: 2896.0
    cable_fathoms: 120.0
    cable_in: 21.0
    cable_kn: 683.2
  # The spare anchor, Steel's fourth bower, on the seventh cable; of the kind 'sheet', the schema's kinds being four (Indf §7).
  - id: spare_anchor
    kind: sheet
    name: the spare anchor
    weight_kg: 2896.0
    cable_fathoms: 120.0
    cable_in: 21.0
    cable_kn: 683.2
  # The stream anchor, Steel's 15 cwt for a 64, on the stream cable of 11.5 in (Steel 1794 vol. I, the anchor and cordage tables: Ind §6.2).
  - id: stream
    kind: stream
    name: the stream anchor
    weight_kg: 762.0
    cable_fathoms: 120.0
    cable_in: 11.5
    cable_kn: 204.9
  # The kedge, Steel's 7 cwt 2 qr for a 64 (as above), on a hawser of half the bower cable's size, the house rule (gen_ships.KEDGE_HAWSER_OF_BOWER; judgement).
  - id: kedge
    kind: kedge
    name: the kedge
    weight_kg: 381.0
    cable_fathoms: 120.0
    cable_in: 10.5
    cable_kn: 170.8
crew:
  # 330 men and boys, 'at first of 310, but afterwards of 330 men' (James vol. 1 p. 454; at the Virginie, p. 361), on the 44's column of the Regulations 1806 (p. 165) with 36 seamen over it (D32 (a)).
  complement: 330
  # A King's ship: the english list in data/crew/names.yaml.
  names: english
  stations:
    # Hands per station, both watches together: her 238 seamen, the complement less the posts, the marines and the idlers, shared among the six stations as the frigate-36's 182 are (28, 24, 30, 14, 50 and 36: judgement, Indf §6.1-§6.2), the column's petty officers and its boys among them, the boys in the afterguard as landsmen (spec M3 9 item 6). Forecastlemen: the head, anchors and headsails; the best older seamen (Luce 1884 ch. XX).
    forecastle: 37
    # Fore topmen.
    fore_top: 31
    # Main topmen, the largest top.
    main_top: 39
    # Mizzen topmen.
    mizzen_top: 18
    # Afterguard, the boys included (spec M3 9 item 6: boys count as landsmen).
    afterguard: 66
    # Waisters.
    waisters: 47
    # Marines: the 294 column's two lieutenants, two serjeants, two corporals and a drummer, 7, and 43 privates, the frigate-36's share of her 264 carried to 330 (judgement; D32 (a)); no establishment of private marines by rate was found (Ind §10.8). They stand watch and work as afterguard, never aloft (Luce 1884 ch. XX).
    marines: 50
    # Idlers: the trades below (Luce 1884 ch. XX: they stand no night watches).
    idlers: 30
  ratings:
    # Share of the seamen (not marines, idlers or officers) by rating: the frigate-36's (judgement, Indf §6.1). Able: 0.30.
    able: 0.3
    # Ordinary: 0.40, judgement.
    ordinary: 0.4
    # Landsmen: 0.30, judgement.
    landsman: 0.3
  posts:
  # Station holders by post (spec M3 2.3): the commissioned officers, the column's 3 lieutenants (the Regulations 1806 p. 165, the 294 column), then the standing and warrant officers and the master-at-arms, as the frigate-36's; her wardroom file (data/people/razee-44.yaml) gives them. Names are drawn at muster unless a post gives one.
  - post: captain
  - post: first lieutenant
  - post: second lieutenant
  - post: third lieutenant
  - post: master
  - post: boatswain
  - post: gunner
  - post: carpenter
  - post: purser
  - post: surgeon
  - post: sailmaker
  - post: master-at-arms
  idlers_by_trade:
    # How the idlers are made up, the 294 column's rows by trade (the Regulations 1806; Ind §4.2) and judgement where it says so; they must sum to the idlers. The carpenter's mate and crew of five, and the caulker: 7.
    carpenter's crew: 7
    # The sailmaker's mate and crew of one, and the ropemaker: 3.
    sailmaker's crew: 3
    # A cooper, for the casks (judgement: the column has none): 1.
    cooper: 1
    # The armourer and an armourer's mate: 2.
    armourer: 2
    # The ship's cook, and a cook's mate (judgement): 2.
    cook: 2
    # The purser's steward, and a gunroom steward (judgement): 2.
    steward: 2
    # Officers' servants, the frigate-36's eight (judgement): 8.
    servant: 8
    # The assistant surgeon: 1.
    surgeon's mate: 1
    # The captain's clerk and the schoolmaster: 2.
    clerk: 2
    # The two ship's corporals: 2.
    master-at-arms's party: 2
  stores:
    # Water: the frigate-36's 100 tons for her 264 carried by the complement, 125 tons in iron-hooped casks (Indf §7; judgement), as many weeks at a gallon a man a day as hers.
    water_tons: 125
    # Provisions: four months at full allowance for the complement, as the frigate-36's (judgement).
    provisions_days: 120
    # The booms: the spare spars by class, as the frigate-36's (Luce 1866 ch. XVII, 'Stowing Booms'; Luce 1884 ch. XI; Steel 1794 vol. I, 'Lashing of Booms'), of her own spars (Indf §7); see tools/ships/indefatigable.py.
    spare_spars:
      # The fore and main topmasts, one in each pile (Luce 1866).
      topmast: 2
      # A stump fore and a stump main topgallant mast, one in each pile (Luce 1866).
      topgallant_mast: 2
      # The spare fore and main topsail yards, on the quarters (Luce 1866).
      yard: 2
      # The fore and main topmast studding-sail booms, a pair in each pile (Luce 1866; the pair judgement).
      studdingsail_boom: 4
      # The spare jib-boom, amidships (Luce 1866); she has no flying jib-boom (Steel 1794 vol. I p. 49, the 64).
      jib_boom: 1
    # Spare rope in the boatswain's store: the frigate-36's 600 fathoms carried by the complement, to fifty fathoms (Indf §7; judgement).
    cordage_fathoms: 750
    # The carpenter's shot plugs (package 73, spec M7 §14): tapered plugs of soft wood with oakum and tallow, kept ready in action (the Regulations and Instructions 1806, the Carpenter; Falconer 1780, PLUG: 'shot-plugs ... to stop holes made by cannon shot'); the count by her class, judgement. One a gun of her default fit, 46 (Indf §7).
    shot_plugs: 46
    # The sail room (spec 3b §6.3): Luce's allowance for a frigate (1884 ch. X p. 171), as the frigate-36's, on her own sails (Indf §7), every sail new; see tools/ships/indefatigable.py.
    sails:
    # The second of each working sail, of the working number (Luce p. 171); she has one jib and no flying jib, and her spanker stands for the frigate's spanker.
    - kind: main.course
      canvas_no: 2
      condition: 100
    - kind: mizzen.topsail
      canvas_no: 4
      condition: 100
    - kind: fore.topgallant
      canvas_no: 6
      condition: 100
    - kind: main.topgallant
      canvas_no: 6
      condition: 100
    - kind: mizzen.topgallant
      canvas_no: 7
      condition: 100
    - kind: fore.royal
      canvas_no: 8
      condition: 100
    - kind: main.royal
      canvas_no: 8
      condition: 100
    - kind: mizzen.royal
      canvas_no: 8
      condition: 100
    - kind: jib
      canvas_no: 6
      condition: 100
    - kind: mizzen.spanker
      canvas_no: 2
      condition: 100
    - kind: fore.topmast_staysail
      canvas_no: 6
      condition: 100
    # The heavy-weather foresail and fore and main topsails, of No. 1 (Luce p. 171, the table's note).
    - kind: fore.course
      canvas_no: 1
      condition: 100
    - kind: fore.topsail
      canvas_no: 1
      condition: 100
    - kind: main.topsail
      canvas_no: 1
      condition: 100
    # Storm canvas, one of each (Luce p. 171).
    - kind: fore.storm_staysail
      canvas_no: 1
      condition: 100
    - kind: mizzen.storm_staysail
      canvas_no: 1
      condition: 100
    - kind: storm_mizzen
      canvas_no: 1
      condition: 100
    # The occasional sails, one each (spec 3b §6.4).
    - kind: ringtail
      canvas_no: 5
      condition: 100
    - kind: fore.save_all.starboard
      canvas_no: 7
      condition: 100
    - kind: fore.save_all.larboard
      canvas_no: 7
      condition: 100
  ration:
    # The ration (package 54, spec M7b 19): the Navy's table, the Regulations of 1806 (Sect. IX, Chap. I, Art. I), as data/crew/ration.yaml gives it; a King's ship.
    table: navy
    # Water drawn a man a day for his drink, his grog and the coppers: a gallon, the figure her water above is reckoned at (judgement).
    water_gallons: 1
  # The named people beyond the posts (package 35, spec M5 §22): each drawn from a station at muster, the counts above unchanged; see data/people/razee-44.yaml.
  people:
  # Two master's mates, the 44's column's two (the Regulations 1806 p. 165), able seamen of the forecastle (the Master, art. XXVIII: the mates and midshipmen assist in the observations).
