# Steel 1794 vol. I p. 49, the 64 column, her lower masts cut at the heel; her
# gaff and driver boom by Steel's rule (p. 40). Sails: Steel's table IV, the 64
# column, the topgallants and royals cut to the spars (the owner's rule).
# Units: metres, m2, kg, kN. Comments mark each judgement.
