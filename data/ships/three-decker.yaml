# The Purísima Concepción, three-decker of the Spanish navy, as rebuilt (1786-1793).
# Generated by tools/gen_ships.py (tools/ships/concepcion.py); edit those and
# rerun, do not edit this file. Hull and profile: measured on her own plan as
# built, PB-039 (Biblioteca Virtual de Defensa, record 1026905;
# docs/design/ships-design/pages-concepcion.md), her water the line as traced on it.
# Spars and sails: the 74's (tools/ships/bellerophon.py) x 1.15 by Steel's rule for
# her main mast, her mizen course cut at the mast and her yards under the bowsprit
# (tools/ships/mizen_yard.py and spritsail_yards.py). Guns by deck: Winfield et al.
# 2023, pp. 406-410; company: the regulation of 1788.
# Units: metres, m2, kg, kN. Comments mark each judgement.
ship:
  name: Purísima Concepción
  rig: ship
  era_notes: 'Purísima Concepción, a three-decker of 112 guns of the Spanish navy, the first rate of her
    class as rebuilt: built at Ferrol to Romero Landa''s ''sistema francés'', launched 24 December 1779
    (94 guns), rebuilt at Cádiz 1786 to 1793 as a 112 (the sixteenth lower pair cut in 1791), at Toulon
    in 1793 and Cape St Vincent in 1797, altered to 116 at Ferrol in 1803, driven ashore in Cádiz Bay
    on 7 March 1810 and burnt (Winfield et al. 2023, pp. 406-410: VR-Sp §4). Hull: her own plan as built,
    PB-039 (Biblioteca Virtual de Defensa, record 1026905), measured (pages-concepcion.md); rig: the 74''s
    x 1.15 by Steel''s rule; guns and company: Winfield and the regulations of 1788 and 1803; see tools/ships/concepcion.py
    for every figure and judgement.'
  descriptions:
    three-decker:
      rig: a three-decker
      what: a three-decker, sixteen ports a tier
      note: 'A ship of three gun decks: the tops make out a three-decker at her rig''s distance, her size
        and her three tiers being what the logs of the period record at first sight of a fleet (''another
        First-rate'', Nelson''s narrative, Nicolas vol. 2 p. 341; the lead''s ruling 17 of 2026-11-12
        for a ship of the line; JUDGEMENT on the distance, as the 74''s); the glass her three tiers of
        sixteen ports a side as rebuilt (VR-Sp §4). Not ''a first rate'' in what is made out: a rate is
        a navy''s book, not a sight (judgement); ''a first rate'' names her description in a scenario''s
        words. Her default fit serves a far ship of her; her roles a King''s ship''s and, where she leads
        a squadron, a commodore''s, a flagship through most of her service (VR-Sp §4; Con-D §12).'
      fit: concepcion 1797
      roles:
      - kings-ship
      - commodore
