# The ground tackle (package 34, spec M5 §18): four bowers, a stream and a kedge, the 74's scaled to a first rate (Con-D §7, JUDGEMENT), every figure's source in tools/ships/concepcion.py; chain cable is later than 1805.
ground_tackle:
  chain: false
  anchors:
  # The bowers: four of 89 cwt, the 74's 67 (Steel's 'Smaller 74 Guns' and Lavery 1985 p. 15, Table 4) scaled by her rig's area, x 1.32 (JUDGEMENT: Steel's 100-gun row is garbled in the OCR); seven cables of 24 in, the largest of Steel's table of the weight of cables (Steel 1794 vol. I, OCR l. 7944-7950; JUDGEMENT), and 100 fathoms, laid three on the best bower and two on the small, 'three Cables on the best Bower, two on the small Bower' (Lever 1808 p. 67).
  - id: best_bower
    kind: bower
    name: the best bower
    weight_kg: 4521.0
    cable_fathoms: 300.0
    cable_in: 24.0
    cable_kn: 892.4
  - id: small_bower
    kind: bower
    name: the small bower
    weight_kg: 4521.0
    cable_fathoms: 200.0
    cable_in: 24.0
    cable_kn: 892.4
  # The sheet anchor, a bower's size, on one cable.
  - id: sheet
    kind: sheet
    name: the sheet anchor
    weight_kg: 4521.0
    cable_fathoms: 100.0
    cable_in: 24.0
    cable_kn: 892.4
  # The spare anchor, the fourth bower, on the seventh cable; of the kind 'sheet', the schema's kinds being four, as the 74's.
  - id: spare_anchor
    kind: sheet
    name: the spare anchor
    weight_kg: 4521.0
    cable_fathoms: 100.0
    cable_in: 24.0
    cable_kn: 892.4
  # The stream anchor of 21 cwt, the 74's 16 x 1.32, on a stream cable of 15.5 in, the 74's 13 1/2 x 1.15 (JUDGEMENT), and 100 fathoms.
  - id: stream
    kind: stream
    name: the stream anchor
    weight_kg: 1067.0
    cable_fathoms: 100.0
    cable_in: 15.5
    cable_kn: 372.2
  # The kedge of 10.6 cwt, the 74's 8 x 1.32 (JUDGEMENT), on a hawser of half the bower cable's size, the house rule (gen_ships.KEDGE_HAWSER_OF_BOWER; judgement), of her cables' length (judgement).
  - id: kedge
    kind: kedge
    name: the kedge
    weight_kg: 539.0
    cable_fathoms: 100.0
    cable_in: 12.0
    cable_kn: 223.1
crew:
  # A navío of 112's company by the regulation of 1 January 1788, 877 men and boys: 19 commissioned officers, 10 major officers, 23 sea officers, 168 infantry, 57 infantry-artillery, 130 artillery, 200 seamen, 230 landsmen and 40 boys (Winfield et al. 2023, p. 1446 and the two pages following: VR-Sp §15; the book's Total, 848, leaves out the commissioned and the major officers), the 1797 fit's, the file's. Her own 839 (pp. 406-410, unbroken: VR-Sp §4) beside it, four per cent under. The war increase, a man for each gun of her main batteries, half infantry and half landsmen, is not filed (907 or 971 by the reading of 'battery': VR-Sp §15; the lead's). The 1809 fit's 1,015 by the regulation of 1803 is in its note.
  complement: 877
  # A ship of the Spanish navy: the spanish list in data/crew/names.yaml (package 90, N1).
  names: spanish
  stations:
    # Hands per station, both watches together: her seamen, the complement less the posts, the soldiers and the idlers, shared among the six stations as the frigate-36's 182 are (28, 24, 30, 14, 50 and 36: judgement, the 74's), the regulation's artillery, seamen, landsmen and boys and her alféreces among them, the boys in the afterguard as landsmen (spec M3 9 item 6). Forecastlemen: the head, anchors and headsails.
    forecastle: 88
    # Fore topmen.
    fore_top: 75
    # Main topmen, the largest top.
    main_top: 94
    # Mizzen topmen.
    mizzen_top: 44
    # Afterguard, the boys included (spec M3 9 item 6: boys count as landsmen).
    afterguard: 157
    # Waisters.
    waisters: 113
    # Soldiers: her soldiers, the 1788 regulation's 168 infantry and 57 infantry-artillery (Winfield et al. 2023, p. 1446: VR-Sp §15), in the marines' station, whose kit is the nation's: in the game they serve the carronades and no long gun, which her bill keeps (crew/quarters.py), and stand watch and work as afterguard, never aloft. The 1803 regulation's 275 (200 and 75) are in the 1809 fit's note, a departure.
    marines: 225
    # Idlers: the trades below (Luce 1884 ch. XX: they stand no night watches).
    idlers: 60
  ratings:
    # Share of the seamen (not soldiers, idlers or officers) by rating, by the regulation's kinds (JUDGEMENT, Con-D §6.1): her 200 seamen of its 600 artillery, seamen, landsmen and boys able, 0.33.
    able: 0.33
    # Ordinary: the 130 artillery, artilleros de mar, 0.22.
    ordinary: 0.22
    # Landsmen: the 230 landsmen and the 40 boys, 0.45.
    landsman: 0.45
  posts:
  # Station holders by post (spec M3 2.3), in the game's English, as for every ship: of the regulation's commissioned officers her brigadier commanding, the captain; the capitán de navío, her second; the capitán de fragata, the first lieutenant; and the four tenientes de navío and four tenientes de fragata, the second to the ninth lieutenants, the eight alféreces in her stations; the chiefs of her major and sea officers, the first and second pilots as the master and the second master, the boatswain, the gunner, the carpenter, the purser, the surgeon and the chaplain; and the sailmaker and the master-at-arms, posts in the 74's file (JUDGEMENT, Con-D §6.1). Her people file (data/people/three-decker.yaml) gives them. Names are drawn at muster unless a post gives one.
  - post: captain
  - post: second captain
  - post: first lieutenant
  - post: second lieutenant
  - post: third lieutenant
  - post: fourth lieutenant
  - post: fifth lieutenant
  - post: sixth lieutenant
  - post: seventh lieutenant
  - post: eighth lieutenant
  - post: ninth lieutenant
  - post: master
  - post: second master
  - post: boatswain
  - post: gunner
  - post: carpenter
  - post: purser
  - post: surgeon
  - post: chaplain
  - post: sailmaker
  - post: master-at-arms
  idlers_by_trade:
    # How the idlers are made up (JUDGEMENT, Con-D §6.1), the rest of the regulation's sea and major officers' trades and her officers' servants; they must sum to the idlers. The carpenters and caulkers of her sea officers and their crew, the 74's eleven scaled to a first rate (judgement): 15.
    carpenter's crew: 15
    # The sailmaker's mates and crew (judgement): 5.
    sailmaker's crew: 5
    # Two coopers, for the casks (judgement): 2.
    cooper: 2
    # The armourers of her sea officers (the regulation's kind; judgement): 4.
    armourer: 4
    # The cooks of her sea officers (the regulation's kind; judgement): 3.
    cook: 3
    # The purser's people (judgement): 4.
    steward: 4
    # The officers' servants, of her forty boys (judgement): 19.
    servant: 19
    # The surgeons of her major officers beyond the surgeon (judgement): 3.
    surgeon's mate: 3
    # The captain's and the purser's clerks (judgement): 3.
    clerk: 3
    # Two corporals (judgement): 2.
    master-at-arms's party: 2
  stores:
    # Water: the frigate-36's 100 tons for her 264 carried by the complement (Con-D §7; judgement, the 74's method), as many weeks at a gallon a man a day as hers.
    water_tons: 332
    # Provisions: four months at full allowance for the complement, the 74's (judgement).
    provisions_days: 120
    # The booms: the spare spars by class, the 74's (Luce 1866 ch. XVII, 'Stowing Booms'; Luce 1884 ch. XI; Steel 1794 vol. I, 'Lashing of Booms'), of her own spars (Con-D §7); see tools/ships/concepcion.py.
    spare_spars:
      # The fore and main topmasts, one in each pile (Luce 1866).
      topmast: 2
      # A stump fore and a stump main topgallant mast, one in each pile (Luce 1866).
      topgallant_mast: 2
      # The spare fore and main topsail yards, on the quarters (Luce 1866).
      yard: 2
      # The fore and main topmast studding-sail booms, a pair in each pile (Luce 1866; the pair judgement).
      studdingsail_boom: 4
      # The spare jib-boom, amidships (Luce 1866).
      jib_boom: 1
    # Spare rope in the boatswain's store: the frigate-36's 600 fathoms carried by the complement, to fifty fathoms (Con-D §7; judgement, the 74's).
    cordage_fathoms: 2000
    # The carpenter's shot plugs (package 73, spec M7 §14): tapered plugs of soft wood with oakum and tallow, kept ready in action (the Regulations and Instructions 1806, the Carpenter; Falconer 1780, PLUG: 'shot-plugs ... to stop holes made by cannon shot'); the count by her class, judgement. One a gun of her default fit (Con-D §7).
    shot_plugs: 112
    # The sail room (spec 3b §6.3): Luce's allowance for a frigate (1884 ch. X p. 171), as the 74's, on her own sails (Con-D §7), every sail new; see tools/ships/concepcion.py.
