  # The quarter bill beyond the gun crews (spec M7 8a; package 70; docs/design/Design-WorkInAction.md): at quarters every man has a station by it, the gun crews the fit's (each gun's crew above), the sail trimmers here by station (the men who leave the guns for a brace or a sail: Luce 1884 ch. XX, 'Watch, Quarter and Station Bills'), the hands at the helm, the powder beyond the idlers, and the fighting book's priority when sail work wants more hands than the trimmers give; the marines, the carpenter's crew and the surgeon's mates have their stations by their trades. The counts are judgement against the stations above.
  quarter_bill:
    trimmers:
      # The trimmers: what her seamen leave when one side's guns of 'concepcion 1797' and the wheel are manned, the soldiers serving no long gun, split by the frigate-36's trimmer shares, 8, 10, 12, 6 and 8 of 44 (the 74's rule; judgement). Of the forecastlemen, for the head sails and the fore braces.
      forecastle: 3
      # Of the fore topmen, for the fore braces aloft.
      fore_top: 3
      # Of the main topmen, the largest top.
      main_top: 4
      # Of the mizzen topmen, for the crossjack braces and the mizen course.
      mizzen_top: 2
      # Of the afterguard, at the main sheet and the after braces.
      afterguard: 3
    # Four at the wheel, two wheels' men on a first rate (Con-D §6.3, JUDGEMENT).
    helm: 4
    # The powder beyond the idlers: none, as the 74's; her boys among the idlers, her cooks, stewards, clerks, the coopers, the armourers and the sailmaker's crew pass the cartridges (Falconer 1780, QUARTERS; judgement).
    powder: 0
    # The quarter gunners and the gunner's crew in the filling room, one to every four cannon (Falconer 1780, QUARTER-GUNNER, l.14283-14289); the swivels are not cannon (practice and resupply, between packages 72 and 73). Hers one to every four cannon of her default fit (Falconer 1780, QUARTER-GUNNER; judgement for her).
    filling: 28
    # The fighting book's priority when sail work wants more hands than the trimmers give (spec M7 8a): 'sail before guns' robs the guns (the disengaged battery first) and the log says from where; 'guns before sail' makes the sail work wait short-handed. The player's book and the doctrine may say otherwise.
    priority: sail before guns
    # Seamen with the muskets of the stand of arms, the frigate-36's share of her seamen (20 of 182; judgement, the 74's); her soldiers are the musketry's body.
    small_arms: 63
    # The boarders by the bill, a quarter of her seamen told off from the guns' crews (Luce 1884 ch. XX; judgement, the shared rule), with the soldiers.
    boarders: 143
    # The soldiers the bill keeps in their division at the beat: her soldiers but those at the default fit's carronades, on the poop and the gangways with their muskets (the 74's form, Falconer 1780, QUARTERS; Con-D §6.3). Read by the bill by deck (B7.b): her long guns take no soldier. Plainly: Spanish practice put soldiers at the guns, the infantry-artillery the artillery's own (Con-D §6.1); the engine's rule keeps them from the long guns, and her report measures what that leaves for the lead.
    marines: 225
