    # As altered at Ferrol in 1803 and recommissioned to Cádiz in September 1809, to her loss in March 1810: 30 x 36, 32 x 24 and 32 x 18 on her three gun decks, 4 x 8 and 6 x 48-pounder obuses on the quarterdeck, 4 x 8 and 2 x 48-pounder obuses on the forecastle and 6 x 24-pounder obuses on the poop, 116 pieces, a broadside of 1,508 libras (1,627 lb) (Winfield p. 407: VR-Sp §4). The ordinance of 1803's three-decker of 112 carries two more 48-pounder obuses on the quarterdeck, 118 pieces, the poop's six outside the nominal count (VR-Sp §16): noted, not a fit. Plainly, her company: the Regulation of 16 October 1803 gives a 112 1,015, of whom 275 soldiers, 200 infantry and 75 infantry-artillery (VR-Sp §15); a company belongs to a file (the lead's ruling (5) of 2026-11-07), so this fit sails with the file's 877 of the 1788 regulation, the 1803 figure a departure recorded here (Con-D §6.1).
