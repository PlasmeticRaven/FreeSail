  side: starboard
  length_m: 5.5
  height_m: 14.0
  rating_kn: 2.3
# Rating: fore.topmast.studdingsail.larboard in 18 kn -> 2.3 kN.
- id: fore.topmast.studdingsail_boom.larboard
  class: studdingsail_boom
