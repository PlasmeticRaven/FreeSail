# fore topsail yard 36 ft, 0.75 of a 48 ft fore yard that is 0.57 of LWL (Fincham; Sea Lark's fore yard was 0.69, Chapelle p. 42); braces 58 deg from square as before (Chapelle is silent on bracing; Fincham 1843 art. 102's figures are for ships' lower yards; judgement, spec 3b §2.1). Provisional (truth 9), see gen_ships.py. Rating: fore.topsail in 40 kn -> 26.9 kN.
