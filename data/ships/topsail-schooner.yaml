# Reference ship: Speedwell, a Baltimore-built topsail schooner of about 1804, to the
# draught of Kemp's Lynx of 1812 (H.M. schooner Musquidobit; Chapelle, The Baltimore
# Clipper, 1930, pp. 82-83, fig. 17). Generated by tools/gen_ships.py; edit that script
# and rerun, do not edit this file. Rig: Fincham's masting rules as Chapelle gives them
# (pp. 159-162), checked against his spar tables (Sea Lark pp. 41-42, Spider pp.
# 165-167) and Marestier's schooners (pp. 113-115). Rope: Luce 1866 ch. IV. Rig details:
# Luce 1884 ch. XXXIV. Spar ratings are provisional, set for truth 9 with the M1 sail
# curves; see the script. Canvas: Steel 1794 vol. I (sloops and cutters); cloth ratings
# from the number by Luce App. E. Units: metres, m2, kg, kN. Comments mark judgements.
ship:
  name: Speedwell
  rig: topsail-schooner
  era_notes: 'A Baltimore-built topsail schooner of about 1804, built to the draught of Kemp''s Lynx of
    1812 (Chapelle 1930, pp. 82-83): 94 ft 7 in on deck, 24 ft beam, 224 tons, masts raking 1 in 5, a
    fore topsail and topgallant over a loose-footed foresail. Rig by Fincham''s rules as Chapelle gives
    them (pp. 159-162) checked against his spar tables; rope by Luce ch. IV; see tools/gen_ships.py for
    every rule.'
hull:
  # 85 ft: judgement between Lynx's 73 ft keel and 94.6 ft deck (Chapelle p. 82), her stem and post raking hard.
  length_waterline_m: 25.9
  # 24 ft 0 in extreme, 23 ft 8 in moulded (Chapelle p. 82).
  beam_m: 7.3
  # 10.9 ft mean: Marestier's draughts of 0.35 and 0.56 of the beam forward and aft (Chapelle p. 113) on Lynx's beam.
  draught_m: 3.3
  # LWL x beam x draught x Cb 0.33 x 1025, about 210 t; Spider (183 tons burthen) weighed 204 t equipped (p. 166); depth of hold 10.25 ft.
  displacement_kg: 211000.0
  # 3 ft 3 in: judgement; tender (Chapelle p. 104: schooners capsized when overpressed with sail), heavily ballasted.
  gm_m: 1.0
  # Rankine (Chapelle p. 159): the middle of the sail base lies 0.05 to 0.0625 of the base (1.6 to 1.7 x LWL) ahead of the centre of lateral area, so the geometric centre is about 1.4 m abaft this plan's centre of effort (+1.0 m under plain sail). The engine wants its centre of pressure further forward, as on the frigate: at +0.5 m she is balanced close-hauled in 15 kn and carries 5 deg of weather helm on a beam reach; at -0.4 m (the M1 value) she carried 4 deg of lee helm close-hauled. Judgement; package 10 checks truths 2 and 6.
  clr_x_m: 0.5
  # LWL x draught x 0.78 for a profile that is deep aft only.
  lateral_area_m2: 70.0
  # The type's recorded best is 11 to 12 knots; the derived 1.34 sqrt(LWL ft) = 12.4 is too generous. Package 10 may tune within 11 to 12.
  hull_speed_kn: 11.5
  # Port sills 3 ft 5 in above the water and 10 in above the deck (Spider's specification, Chapelle pp. 166-167): a low-sided vessel.
  deck_height_m: 0.9
  # A deep narrow blade, about 11 ft by 2 ft (span_m its depth, 11 ft; package 32e).
  rudder:
    area_m2: 2.0
    max_angle_deg: 35
    rate_deg_s: 4.0
    span_m: 3.4
spars:
# fore mast 72 ft heel to head (Fincham: 0.95 of the main), 61 ft above the deck, raking 1 in 5 like the main (Chapelle p. 82); stationed 0.30 of LWL before the middle (Fincham). Provisional (truth 9), see gen_ships.py. Rating: fore.topsail, fore.topgallant, fore.sail, fore.staysail, jib, flying_jib in 55 kn -> 240.9 kN.
- id: fore.mast
  class: mast
  x_m: 7.8
  rake_deg: 11.3
  height_m: 18.7
  rating_kn: 240.9
# fore topmast 36 ft with its pole (Fincham: hounded the beam, pole half of that), hounds 16 ft above the lower cap. Provisional (truth 9), see gen_ships.py. Rating: fore.topsail, fore.topgallant, flying_jib in 40 kn -> 47.1 kN.
- id: fore.topmast
  class: topmast
  steps_on: fore.mast
  height_m: 4.8
  rating_kn: 47.1
# fore topgallant 'mast': the 12 ft pole of the topmast, on which the topgallant sets (Fincham). Provisional (truth 9), see gen_ships.py. Rating: fore.topgallant in 25 kn -> 3.8 kN.
- id: fore.topgallant_mast
  class: topgallant_mast
  steps_on: fore.topmast
  height_m: 3.7
  rating_kn: 3.8
# main mast 76 ft heel to head: hounded 2.8 x the beam plus a head 0.35 of the topmast (Fincham, Chapelle p. 161; Marestier's schooners 3.08 to 3.23 x the beam, p. 114), 65 ft above the deck, raking 1 in 5; stationed 0.10 of LWL abaft the middle. Provisional (truth 9), see gen_ships.py. Rating: main.sail, main.gaff_topsail in 55 kn -> 130.7 kN.
