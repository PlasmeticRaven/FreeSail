# jib-boom 18 ft outboard. Provisional (truth 9), see gen_ships.py. Rating: the sails named in the script in 30 kn -> 8 kN (the engine's graph loads nothing on it).
- id: jib_boom
  class: jib_boom
  'on': bowsprit
  length_m: 5.5
  height_m: 4.0
  rating_kn: 8.0
# fore topmast studding-sail boom, half the topsail yard, at the fore yard's height; rated for its sail in 18 kn. Provisional (truth 9), see gen_ships.py. Rating: fore.topmast.studdingsail.starboard in 18 kn -> 2.3 kN.
- id: fore.topmast.studdingsail_boom.starboard
  class: studdingsail_boom
