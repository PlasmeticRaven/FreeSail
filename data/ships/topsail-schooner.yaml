# Reference ship: Speedwell, a Baltimore-built topsail schooner of about 1804.
# Generated by tools/gen_ships.py; edit that script and rerun, do not edit this file.
# Hull and spars: the type's proportions after Chapelle, anchored on Kemp's Lynx of
# 1812 (Winfield) and the Pride of Baltimore reconstructions. Rope: Luce 1866 ch. IV.
# Rig details: Luce 1884 ch. XXXIV 'Handling fore-and-afters'. Spar and cloth ratings
# are provisional, set for truth 9 with the M1 sail curves; see the script.
# Units: metres, m2, kg, kN. Comments mark each judgement.
ship:
  name: Speedwell
  rig: topsail-schooner
  era_notes: 'A Baltimore-built topsail schooner of about 1804: 95 ft on deck, 24 ft beam, raked masts,
    a fore topsail and topgallant over a loose-footed foresail. Proportions after Chapelle, anchored on
    Kemp''s Lynx of 1812; rope by Luce ch. IV; see tools/gen_ships.py for every rule and judgement.'
hull:
  # 84 ft on a 95 ft deck (judgement; Lynx 1812 was 97 ft 7 in on deck on a 73 ft keel).
  length_waterline_m: 25.6
  # 24 ft, as Lynx; the type's length-to-beam is about 4.
  beam_m: 7.3
  # 9 ft 9 in mean: 7 ft forward, 12 ft 6 in aft (judgement; the type's drag).
  draught_m: 3.0
  # LWL x beam x draught x Cb 0.31 x 1025: about 180 t (judgement; Pride of Baltimore II, 100 ft on deck, is 185 long tons).
  displacement_kg: 178000.0
  # 3 ft 3 in: judgement; a sharp, heavily ballasted hull, tender but not crank.
  gm_m: 1.0
  # Geometric centre of a lateral plane deep aft and cut away forward is about 2.0 m abaft midships; with a lead of 6 per cent of LWL (judgement): -0.4 m.
  clr_x_m: -0.4
  # LWL x draught x 0.78 for a profile that is deep aft only.
  lateral_area_m2: 60.0
  # The type's recorded best is 11 to 12 knots; the derived 1.34 sqrt(LWL ft) = 12.3 is too generous. Package 10 may tune within 11 to 12.
  hull_speed_kn: 11.5
  # Low freeboard, about 4 ft at midships.
  deck_height_m: 1.2
  # A deep narrow blade, about 11 ft by 2 ft.
  rudder:
    area_m2: 2.0
    max_angle_deg: 35
    rate_deg_s: 4.0
spars:
# fore mast 60 ft, 58 ft above the deck, raked (judgement, Chapelle); rated for foresail, topsail and topgallant in 55 kn. Provisional (truth 9), see gen_ships.py. Rating: fore.topsail, fore.topgallant, fore.sail, fore.staysail, jib, flying_jib in 55 kn -> 268 kN.
- id: fore.mast
  class: mast
  x_m: 7.5
  height_m: 17.7
  rating_kn: 268.0
# fore topmast 32 ft, 22 ft above the cap. Provisional (truth 9), see gen_ships.py. Rating: fore.topsail, fore.topgallant, flying_jib in 40 kn -> 59.8 kN.
- id: fore.topmast
  class: topmast
  steps_on: fore.mast
  height_m: 6.7
  rating_kn: 59.8
# fore topgallant mast 16 ft, 11 ft above the topmast head. Provisional (truth 9), see gen_ships.py. Rating: fore.topgallant in 25 kn -> 5.1 kN.
- id: fore.topgallant_mast
  class: topgallant_mast
  steps_on: fore.topmast
  height_m: 3.3
  rating_kn: 5.1
# main mast 64 ft, 62 ft above the deck (judgement, Chapelle: main truck about the deck length above the water). Provisional (truth 9), see gen_ships.py. Rating: main.sail, main.gaff_topsail in 55 kn -> 139 kN.
- id: main.mast
  class: mast
  x_m: -3.0
  height_m: 18.9
  rating_kn: 139.0
# main topmast 30 ft, a pole for the gaff topsail, which comes in early. Provisional (truth 9), see gen_ships.py. Rating: main.gaff_topsail in 22 kn -> 4.5 kN.
- id: main.topmast
  class: topmast
  steps_on: main.mast
  height_m: 5.9
  rating_kn: 4.5
# fore topsail yard 36 ft (1.5 x the beam, judgement); rated in 40 kn. Provisional (truth 9), see gen_ships.py. Rating: fore.topsail in 40 kn -> 32.6 kN.
- id: fore.topsail.yard
  class: yard
  'on': fore.topmast
  length_m: 11.0
  height_m: 22.7
  brace_limit_deg: 58
  rating_kn: 32.6
# fore topgallant yard 24 ft (the beam, judgement); rated in 25 kn. Provisional (truth 9), see gen_ships.py. Rating: fore.topgallant in 25 kn -> 5.1 kN.
- id: fore.topgallant.yard
  class: yard
  'on': fore.topgallant_mast
  length_m: 7.3
  height_m: 26.8
  brace_limit_deg: 60
  rating_kn: 5.1
# fore gaff 24 ft; the foresail is loose-footed and overlaps the main (Luce 1884 ch. XXXIV: a boom foresail sets worse on a wind). Rated in 45 kn. Rating: fore.sail in 45 kn -> 53.2 kN.
- id: fore.gaff
  class: gaff
  'on': fore.mast
  length_m: 7.3
  height_m: 14.0
  rating_kn: 53.2
# main gaff 28 ft, 0.55 of the boom; rated in 45 kn. Rating: main.sail in 45 kn -> 74.3 kN.
- id: main.gaff
  class: gaff
  'on': main.mast
  length_m: 8.5
  height_m: 15.0
  rating_kn: 74.3
# main boom 51 ft, 0.54 of the deck length, well over the taffrail (Chapelle). Rating: the sails named in the script in 45 kn -> 74.3 kN (the engine's graph loads nothing on it).
- id: main.boom
  class: boom
  'on': main.mast
  length_m: 15.5
  height_m: 1.5
  rating_kn: 74.3
# bowsprit 22 ft outboard, steeved low (judgement, Chapelle). Rating: the sails named in the script in 55 kn -> 102.2 kN (the engine's graph loads nothing on it).
- id: bowsprit
