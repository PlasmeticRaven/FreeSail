crew:
  # Winfield et al. 2023, p. 930: 167 men for the Spanish ship; the Danish 161 aboard in 1807 within 4% (Roos 1957 p. 90), so one company serves every fit (JUDGEMENT, Dia-D §6.1). The regulation of 1 January 1788 gives a corvette of 18 to 22 guns 138 in peace (p. 1446 and following: VR-Sp §15).
  complement: 167
  # Her people's names Spanish: the spanish list in data/crew/names.yaml (package 90, N1), which reads as Spain's where a scenario gives her no nation.
  names: spanish
  stations:
    # Hands per station, both watches together: her design's table (Dia-D §6.1), the 107 left beside her fifty soldiers and ten posts shared on her first draft's seven stations (the frigate-36's shares scaled to her company) by the largest remainders, the main top's and the idlers' tie given to the idlers (computed in the design; JUDGEMENT until her establishment's shares are read). Forecastlemen: the head, anchors and headsails.
    forecastle: 14
    # Fore topmen.
    fore_top: 12
    # Main topmen, the largest top.
    main_top: 15
    # Mizzen topmen.
    mizzen_top: 7
    # Afterguard, the boys included (spec M3 9 item 6: boys count as landsmen).
    afterguard: 25
    # Waisters.
    waisters: 18
    # Her soldiers: the regulation of 1 January 1788's forty infantry and ten infantry-artillery for a corvette of 18 to 22 guns (Winfield et al. 2023, p. 1446 and following: VR-Sp §15), the count sourced and its place in her 167 JUDGEMENT; Spain's kit (data/marines.yaml, `spanish`). They stand watch and work as afterguard, never aloft. The Danes carried a petty officer and ten soldiers (Roos 1957 p. 94).
    marines: 50
    # Idlers: the trades below, who stand no night watches (Luce 1884 ch. XX).
    idlers: 16
  ratings:
    # Share of the seamen by rating: the frigate-36's (judgement). Able: 0.30.
    able: 0.3
    # Ordinary: 0.40, judgement.
    ordinary: 0.4
    # Landsmen: 0.30, judgement.
    landsman: 0.3
  posts:
  # Station holders by post (spec M3 2.3): her commissioned officers, a teniente de navío commanding, as the regulation of 1788 and her plan have it (Dia-D §6.1), then the standing and warrant officers; their words the game's English. Names are drawn at muster unless a post gives one.
  - post: captain
  - post: first lieutenant
  - post: second lieutenant
  - post: master
  - post: boatswain
  - post: gunner
  - post: carpenter
  - post: purser
  - post: surgeon
  - post: sailmaker
  idlers_by_trade:
    # How the idlers are made up; they must sum to the idlers: the frigate-36's trades shared to her sixteen by the largest remainders (computed; JUDGEMENT).
    carpenter's crew: 3
    sailmaker's crew: 2
    cooper: 1
    cook: 1
    steward: 2
    servant: 4
    surgeon's mate: 1
    master-at-arms's party: 2
  stores:
    # Water: the frigate-36's 100 tons for 264 brought to her 167, about four months (judgement).
    water_tons: 63
    # Provisions: four months at full allowance for the complement (judgement).
    provisions_days: 120
    # The booms: the spare spars by class, the frigate-36's (Luce 1866 ch. XVII, 'Stowing Booms'; Luce 1884 ch. XI); see tools/ships/diana.py.
    spare_spars:
      # The fore and main topmasts, one in each pile (Luce 1866).
      topmast: 2
      # A stump fore and a stump main topgallant mast, one in each pile (Luce 1866).
      topgallant_mast: 2
      # The spare fore and main topsail yards, on the quarters (Luce 1866).
      yard: 2
      # The fore and main topmast studding-sail booms, a pair in each pile (Luce 1866; the pair judgement).
      studdingsail_boom: 4
      # The spare jib-boom, amidships (Luce 1866).
      jib_boom: 1
      # The flying jib-boom, in the port pile (Luce 1866).
      flying_jib_boom: 1
    # Spare rope in the boatswain's store: the frigate-36's 600 by her sail (judgement).
    cordage_fathoms: 400
    # The carpenter's shot plugs (package 73, spec M7 §14): tapered plugs of soft wood with oakum and tallow, kept ready in action (the Regulations and Instructions 1806, the Carpenter; Falconer 1780, PLUG: 'shot-plugs ... to stop holes made by cannon shot'); the count by her class, judgement. The frigate-36's 40 by her company: 25.
    shot_plugs: 25
    # The sail room (spec 3b §6.3): Luce's allowance for a frigate (1884 ch. X p. 171), the frigate-36's, every sail new; see tools/ships/diana.py.
    sails:
    # The second of each working sail (Luce p. 171).
    - kind: main.course
      canvas_no: 2
      condition: 100
    - kind: mizzen.topsail
      canvas_no: 4
      condition: 100
    - kind: fore.topgallant
      canvas_no: 6
      condition: 100
    - kind: main.topgallant
      canvas_no: 6
      condition: 100
    - kind: mizzen.topgallant
      canvas_no: 7
      condition: 100
    - kind: fore.royal
      canvas_no: 8
      condition: 100
    - kind: main.royal
      canvas_no: 8
      condition: 100
    - kind: mizzen.royal
      canvas_no: 8
      condition: 100
    - kind: jib
      canvas_no: 6
      condition: 100
    - kind: flying_jib
      canvas_no: 7
      condition: 100
    - kind: mizzen.spanker
      canvas_no: 2
      condition: 100
    - kind: fore.topmast_staysail
      canvas_no: 6
      condition: 100
    # The heavy-weather foresail and fore and main topsails, of No. 1 (Luce p. 171, the table's note).
    - kind: fore.course
      canvas_no: 1
      condition: 100
    - kind: fore.topsail
      canvas_no: 1
      condition: 100
    - kind: main.topsail
      canvas_no: 1
      condition: 100
    # Storm canvas, one of each (Luce p. 171).
    - kind: fore.storm_staysail
      canvas_no: 1
      condition: 100
    - kind: mizzen.storm_staysail
      canvas_no: 1
      condition: 100
    - kind: storm_mizzen
      canvas_no: 1
      condition: 100
    # The occasional sails, one each (spec 3b §6.4).
    - kind: ringtail
      canvas_no: 5
      condition: 100
    - kind: fore.save_all.starboard
      canvas_no: 7
      condition: 100
    - kind: fore.save_all.larboard
      canvas_no: 7
      condition: 100
  ration:
    # The ration (package 54, spec M7b 19): the Navy's table, the Regulations of 1806 (Sect. IX, Chap. I, Art. I), as data/crew/ration.yaml gives it; a man-of-war's, no Spanish table being in the tree (judgement).
    table: navy
    # Water drawn a man a day for his drink, his grog and the coppers: a gallon, the figure her water above is reckoned at (judgement).
    water_gallons: 1
  # The named people beyond the posts (package 35, spec M5 §22): each drawn from their station at muster, the counts above unchanged (data/people/corvette-20.yaml).
  people:
  # A pilot's mate, an able seaman of the forecastle, the master's mate's role in the game's English (judgement).
  - role: master's mate
    station: forecastle
    rating: able
  # A guardiamarina as the captain's messenger, one of the boys of the afterguard.
  - role: midshipman
    station: afterguard
    rating: landsman
    messenger: true
  # The officer of her soldiers, drawn from the fifty.
  - role: lieutenant of marines
    station: marines
    rating: marine
  # The sergeant of her soldiers, drawn from the fifty.
  - role: sergeant of marines
    station: marines
    rating: marine
  # The quarter bill beyond the gun crews (spec M7 8a; package 70; docs/design/Design-WorkInAction.md): at quarters every man has a station by it, the gun crews the fit's (each gun's crew above), the sail trimmers here by station (the men who leave the guns for a brace or a sail: Luce 1884 ch. XX, 'Watch, Quarter and Station Bills'), the hands at the helm, the powder beyond the idlers, and the fighting book's priority when sail work wants more hands than the trimmers give; the marines, the carpenter's crew and the surgeon's mates have their stations by their trades. The counts are judgement against the stations above.
  quarter_bill:
    trimmers:
      # The trimmers: the frigate-36's by station brought to her plain sail (judgement, as the 74's and the Neufchatel's).
      forecastle: 5
      fore_top: 7
      main_top: 8
      mizzen_top: 4
      afterguard: 5
    # Two at the wheel (judgement: a frigate-built ship of 1804, Dia-D §6.4).
    helm: 2
    # The powder beyond the idlers: none; her stewards, servants, cooper and the sailmaker's crew pass the cartridges (judgement, as the frigate-36's).
    powder: 0
    # The quarter gunners and the gunner's crew in the filling room, one to every four cannon (Falconer 1780, QUARTER-GUNNER, l.14283-14289); the swivels are not cannon (practice and resupply, between packages 72 and 73).
    filling: 5
    # The fighting book's priority when sail work wants more hands than the trimmers give (spec M7 8a): 'sail before guns' robs the guns (the disengaged battery first) and the log says from where; 'guns before sail' makes the sail work wait short-handed. The player's book and the doctrine may say otherwise.
    priority: sail before guns
    # The small-arms men: the frigate-36's share of her company (judgement).
    small_arms: 13
    # The boarders by the bill, told off from the guns' crews with her soldiers: the frigate-36's share of her company (judgement).
    boarders: 38
# The ground tackle (package 34, spec M5 §18): the anchors by the ship's size and the hemp cables by the fathom, every figure's rule in tools/gen_ships.py; chain cable is later than 1805 and the file says so.
ground_tackle:
  chain: false
  anchors:
  # The bowers: 22.4 cwt by the rule of five cwt to the hundred tons (449 tons burthen; the beam rule, two thirds the draught and the beam in cwt, gives 38), Luce 1866 ch. XIV. The cable 15 inches, half an inch to the foot of beam (judgement, unverified), rated as every rope by Luce ch. IV; two cables of 120 fathoms spliced on the best bower (Falconer 1780, CABLE; Lever 1808 p. 67).
  - id: best_bower
    kind: bower
    name: the best bower
    weight_kg: 1140.0
    cable_fathoms: 240.0
    cable_in: 15.0
    cable_kn: 348.6
  - id: small_bower
    kind: bower
    name: the small bower
    weight_kg: 1140.0
    cable_fathoms: 120.0
    cable_in: 15.0
    cable_kn: 348.6
  # The sheet anchor, the bowers' size and cable (Lever 1808 p. 67).
  - id: sheet
    kind: sheet
    name: the sheet anchor
    weight_kg: 1140.0
    cable_fathoms: 120.0
    cable_in: 15.0
    cable_kn: 348.6
  # The stream anchor, a quarter of the bower (Luce 1866 ch. XIV, the Book of Allowances), its cable two thirds of the bower's (judgement).
  - id: stream
    kind: stream
    name: the stream anchor
    weight_kg: 280.0
    cable_fathoms: 120.0
    cable_in: 10.0
    cable_kn: 154.9
  # The kedge, an eighth of the bower (Luce 1866 ch. XIV), on a hawser of half the cable's size (judgement).
  - id: kedge
    kind: kedge
    name: the kedge
    weight_kg: 140.0
    cable_fathoms: 120.0
    cable_in: 7.5
    cable_kn: 87.1
# The hold (package 35, spec M5 §23): room for 45 tons of cargo beyond her own stores, 0.1 of the 449 tons burthen (a ship of war's hold is her own stores and ballast: judgement; her 335 toneladas de arqueo (Winfield p. 930) a capacity, not a weight; Falconer 1780, HOLD); see tools/gen_ships.py.
hold:
  capacity_tons: 45
# The pumps (package 73, spec M7 §13): the chain pump of Cole and Bentinck, a ton in 43 seconds and a half with four men (Falconer 1780, PUMP), and the common brake pump with two; the counts by the ship's class (Lavery, Arming and Fitting; Steel 1794); see tools/gen_ships.py.
