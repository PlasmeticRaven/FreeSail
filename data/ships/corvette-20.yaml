          24: 1580
      # A cartridge's powder in pounds: the service charge of cylinder powder for one shot by the gun's kind and calibre, the Regulations 1806 (1808 printing), Table No. 29, read on the page image (Build-Ships.md §10; the OCR has its title at l.27498-27502 and lost its figures; freesail/ship/charges.py): a third of the shot's weight for a gun and a twelfth for a carronade, rounded down to the ounce, and 2 oz for the half-pounder swivel. A gun the table does not name takes its kind's share of the shot to the nearest ounce (freesail/ship/parts.py, charge_lb).
      charges:
        carronade:
          24: 2.0
      # The powder below in barrels of a hundred pounds: the whole barrel was made to contain a hundred pounds, of late filled with ninety to leave the powder room to be shifted (Adye 1804 p. 46, BARRELS); the barrel's whole kept (JUDGEMENT), half the filled powder rounded up to the barrel (judgement: the period kept most of its powder in the barrels).
      powder_barrels: 16
      # The Regulations' allowance for exercise a month: a charge and a round shot for a fourth of the upper deck guns in a ship of one deck, for six months after the guns are received (the Regulations 1806, 1808 printing, the Gunner, Art. XXI, l.13122-13144; the Captain's chapter, l.8842-8879, gives a third); the first six months' figure, the game keeping no commissioning date (judgement).
      exercise_charges: 5
      shot:
        24:
          round: 1200
          grape: 120
          chain: 120
