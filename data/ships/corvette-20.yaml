# The corvette Diana, 1809-1817: the Danish light frigate of 1804 in the Spanish navy.
# Generated by tools/gen_ships.py (tools/ships/diana.py); edit those and rerun, do not
# edit this file. Hull and profile: measured on the Spanish navy's plan of her, 'the
# corvette of war la Diana, of 20 carronades of 30' (BVD 1037832, PB-021;
# docs/design/ships-design/pages-diana.md), her load line the arrowed line as drawn.
# Spars: Luce 1866 ch. VII's chain on her particulars, Steel 1794's 20-gun column the
# check. Sails and rope: the frigate-36's by the same chain. Units: metres, m2, kg, kN.
# Comments mark each judgement.
ship:
  name: Diana
  rig: ship
  era_notes: The Diana, a light frigate of the Danish navy built at Copenhagen in 1804, taken by Spain
    at Cartagena in September 1809 and kept as a corvette to 1832 (Winfield et al. 2023, p. 930; Roos
    1957). 124 pies by 32 pies 6 pulgadas by 16, 540 toneladas 691 libras on her plan's table; 167 men.
    Hull and profile measured on the Spanish navy's plan of her of 1809-1810 (BVD 1037832, PB-021; docs/design/ships-design/pages-diana.md),
    her load line the arrowed line as drawn; masts and yards by Luce's chain on her particulars, sails
    the frigate-36's set by the same chain; see tools/ships/diana.py for every figure and judgement.
  descriptions:
    corvette:
      rig: a ship
      what: a corvette, flush-decked, eleven ports a side
      note: 'The Spanish navy''s corvette of 1809 to 1817, the Danish light frigate Diana of 1804 (Winfield
        et al. 2023, p. 930; Roos 1957 p. 94): what the glass makes out, one tier of eleven ports in a
        flush side and three masts square-rigged on a small hull; the tops make her out a ship (Dia-D
        §8, the made-out rule; her rank at the rig''s distance held as designed by the lead''s nudge 32,
        Dia-D §17.2 item 1). Her default fit serves a far ship of her; her roles a King''s ship''s, and
        a cruiser''s against an enemy''s trade or privateers on a coast, her prize doctrine read from
        data/captains/cruiser.yaml (Dia-D §8.1).'
      fit: carronadas de a 30 1810
      roles:
      - kings-ship
      - cruiser
