# The lugger: L'Éclair, a French gun-lugger taken in 1795 (RMG ZAZ6306), 101 tons, 59 ft
# 3 in on deck by 20 ft 4 in, as the chasse-marée of the war (docs/design/
# VesselReferences-2026-10.md § 1, decision 42). Generated by tools/gen_ships.py;
# edit that script and rerun, do not edit this file. Spars: Forfait 1788, Table VII
# (p. 75, the 60-pied lougre), the masts on her breadth and the yards on her length;
# heels: Fincham 1843 p. 61; the
# lug and its dip: Forfait pp. 5 to 6 and 52 to 55, Lescallier 1791 pp. 391 to 392 and
# 408 to 409, Steel 1794 vol. I, LUGGER. Units: metres, m2, kg, kN. Comments mark
# judgements. Package 43b (spec M6 §19; the proposal's §4.4): the lug and its dip are
# the engine's additions, as the running bowsprit was the cutter's.
ship:
  name: Éclair
  rig: lugger
  era_notes: 'L''Éclair, a French gun-lugger of the war taken in 1795 and taken off afloat at Portsmouth
    (RMG ZAZ6306): 101 tons burthen, 59 ft 3 in on the range of the deck, 45 ft 11 in keel for tonnage,
    20 ft 4 in breadth, 7 ft depth in hold, three guns (guns are not parts until milestone 7); a chasse-marée
    of three masts with dipping lugs, lug topsails, a lug mizen to an outrigger and jibs on a running
    bowsprit, by Forfait 1788''s Table VII (the 60-pied lougre), with the taille-vent for a blow; see
    tools/gen_ships.py for every rule.'
  descriptions:
    lugger:
      rig: a lugger
      what: a chasse-marée, three-masted under lugs
      note: L'Éclair's hull (RMG ZAZ6306) as the Breton and Norman coaster, fisherman or privateer of
        the war (Forfait 1788 pp. 52 to 55; spec M6 §19; judgement on the words).
hull:
  # 55 ft: judgement between the 45.9 ft keel for tonnage and the 59.25 ft on the range of the deck (RMG ZAZ6306).
  length_waterline_m: 16.8
  # 20 ft 4 in extreme (RMG ZAZ6306; the inch figure may carry a half).
  beam_m: 6.2
  # 7.0 ft mean: 8.5 ft aft, 5.5 ft forward (judgement: a chasse-marée drew most aft; her depth in hold 7 ft 0 in, the plan).
  draught_m: 2.1
  # LWL x beam x draught x Cb 0.45 x 1025, about her 101 tons burthen (Cb judgement, the cutter's: a beamy hull, fine at the ends for speed: luggers were built 'pour la marche', Lescallier 1791 p. 408).
  displacement_kg: 101000.0
  # 3 ft 11 in: judgement; a beamy hull that carried a great press of sail high when others reefed (Forfait 1788 p. 53), stiffer than the cutter.
  gm_m: 1.2
  # 5 ft 3 in abaft the middle: judgement, measured (docs/dev/TuningNotes.md, package 43b). At 2 ft abaft, near Forfait's centre of effort (0.024 L abaft, Table VII), the great lugs to leeward griped her up into the wind as she gathered way with the rudder hard over; here she carries four degrees of weather helm at seven points and is nearly balanced close-hauled.
  clr_x_m: -1.6
  # LWL x draught x 0.85 (the cutter's rule).
  lateral_area_m2: 30
  # 1.34 sqrt(55 ft).
  hull_speed_kn: 9.9
  # The deck about 3 ft 3 in above the water (judgement).
  deck_height_m: 1.0
  # A blade about 8 ft deep (judgement).
  rudder:
    area_m2: 1.4
    max_angle_deg: 35
    rate_deg_s: 5.0
    span_m: 2.5
