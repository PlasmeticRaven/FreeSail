  era_notes: 'L''Éclair, a French gun-lugger of the war taken in 1795 and taken off afloat at Portsmouth
    (RMG ZAZ6306): 101 tons burthen, 59 ft 3 in on the range of the deck, 45 ft 11 in keel for tonnage,
    20 ft 4 in breadth, 7 ft depth in hold, three guns (guns are not parts until milestone 7); a chasse-marée
    of three masts with dipping lugs, lug topsails, a lug mizen to an outrigger and jibs on a running
    bowsprit, by Forfait 1788''s Table VII (the 60-pied lougre), with the taille-vent for a blow; see
    tools/gen_ships.py for every rule.'
