# The ground tackle (package 34, spec M5 §18): the anchors by the ship's size and the hemp cables by the fathom, every figure's rule in tools/gen_ships.py; chain cable is later than 1805 and the file says so.
ground_tackle:
  chain: false
  anchors:
  # The bowers: 5 cwt by the rule of five cwt to the hundred tons (101 tons burthen; the beam rule, two thirds the draught and the beam in cwt, gives 25), Luce 1866 ch. XIV. The cable 10 inches, half an inch to the foot of beam (judgement, unverified), rated as every rope by Luce ch. IV; two cables of 120 fathoms spliced on the best bower (Falconer 1780, CABLE; Lever 1808 p. 67).
  - id: best_bower
    kind: bower
    name: the best bower
    weight_kg: 250.0
    cable_fathoms: 240.0
    cable_in: 10.0
    cable_kn: 154.9
  - id: small_bower
    kind: bower
    name: the small bower
    weight_kg: 250.0
    cable_fathoms: 120.0
    cable_in: 10.0
    cable_kn: 154.9
  # The kedge, an eighth of the bower (Luce 1866 ch. XIV), on a hawser of half the cable's size (judgement).
  - id: kedge
    kind: kedge
    name: the kedge
    weight_kg: 30.0
    cable_fathoms: 120.0
    cable_in: 5.0
    cable_kn: 38.7
crew:
  # Thirty: judgement. Forfait 1788 p. 54: the war lugger 'exige un équipage d'élite & fort nombreux'; no figure for her complement was found (the references note).
  complement: 30
  # A Breton and Norman crew: the french list in data/crew/names.yaml.
  names: french
  stations:
    # Hands per station, both watches together; no tops: the fore lug, the jibs and the bowsprit, 10, judgement.
    forecastle: 10
    # Afterguard, at the main and mizen lugs: 10, judgement.
    afterguard: 10
    # Waisters: 5, judgement.
    waisters: 5
    # Idlers: the cook and a carpenter (spec M3 2.3).
    idlers: 2
  ratings:
    # Share of the seamen by rating: 'un équipage d'élite' (Forfait p. 54). Able: 0.70.
    able: 0.7
    # Ordinary: 0.25, judgement.
    ordinary: 0.25
    # Landsmen: 0.05, judgement.
    landsman: 0.05
  posts:
  # Station holders by post (spec M3 2.3): the master who commands her, his mate and the boatswain; names are drawn at muster.
  - post: master
  - post: mate
  - post: boatswain
  idlers_by_trade:
    # The cook: 1, judgement.
    cook: 1
    # A carpenter: 1, judgement.
    carpenter's crew: 1
  stores:
    # Stores for a month (judgement): 30 men at a gallon a day is about 4 tons.
    water_tons: 4
    # Provisions: a month (judgement).
    provisions_days: 30
    # The booms: a spare lug yard and a spare topmast (judgement: the lugger's masting 'est sujette à des accidens fréquens', Forfait p. 54).
    spare_spars:
      # A spare lug yard (judgement).
      lug_yard: 1
      # A spare topmast (judgement).
      topmast: 1
    # Spare rope (judgement).
    cordage_fathoms: 80
    # The sail room (spec 3b §6.3), every sail new; see tools/gen_ships.py.
    sails:
    # A spare main lug and jib (judgement).
    - kind: main.lug
      canvas_no: 2
      condition: 100
    - kind: jib
      canvas_no: 2
      condition: 100
    # The taille-vent for a blow and a storm jib (Forfait p. 52).
    - kind: taille_vent
      canvas_no: 1
      condition: 100
    - kind: storm_jib
      canvas_no: 1
      condition: 100
  ration:
    # The ration (package 54, spec M7b 19): the Navy's table, the Regulations of 1806 (Sect. IX, Chap. I, Art. I), as data/crew/ration.yaml gives it; the measure for a French vessel too, whose own ration the references do not give (judgement).
    table: navy
    # Water drawn a man a day for his drink, his grog and the coppers: a gallon, the figure her water above is reckoned at (judgement).
    water_gallons: 1
  # The named people beyond the posts (package 43b): a boy as the messenger; see tools/gen_ships.py.
  people:
  # A boy as the messenger (judgement).
  - role: boy
    station: afterguard
    rating: landsman
    messenger: true
# The hold (package 35, spec M5 §23): room for 50 tons of cargo beyond her own stores, 0.5 of the 101 tons burthen (a chasse-marée, a coaster deep in the hold: judgement; Falconer 1780, HOLD); see tools/gen_ships.py.
hold:
  capacity_tons: 50
# The boats (package 35, spec M5 §23): their lengths by Luce 1866's rule ('Boats', 'Rules for Size of Boats for Ships-of-War': the launch 2.6 times the square root of the ship's length, the cutters 0.9 of it), the allowance after Steel 1794 vol. II and Falconer 1780 (BOAT, PINNACE, YAWL), the oars a thwart to three feet, the tons by Luce's weight rule for the boat herself; see tools/gen_ships.py.
boats:
# The lugger's boat, a yawl (judgement).
- id: boat
  kind: yawl
  name: the boat
  length_ft: 16.0
  oars: 4
  crew: 5
  tons: 0.1
