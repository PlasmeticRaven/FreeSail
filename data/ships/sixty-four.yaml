  - role: midshipman
    station: afterguard
    rating: landsman
    messenger: true
  # The captain of marines, drawn from the detachment.
  - role: captain of marines
    station: marines
    rating: marine
  # The lieutenant of marines, drawn from the detachment.
  - role: lieutenant of marines
    station: marines
    rating: marine
  # The serjeant of marines, drawn from the detachment.
  - role: sergeant of marines
    station: marines
    rating: marine
  # The quarter bill beyond the gun crews (spec M7 8a; package 70; docs/design/Design-WorkInAction.md): at quarters every man has a station by it, the gun crews the fit's (each gun's crew above), the sail trimmers here by station (the men who leave the guns for a brace or a sail: Luce 1884 ch. XX, 'Watch, Quarter and Station Bills'), the hands at the helm, the powder beyond the idlers, and the fighting book's priority when sail work wants more hands than the trimmers give; the marines, the carpenter's crew and the surgeon's mates have their stations by their trades. The counts are judgement against the stations above.
  quarter_bill:
    trimmers:
      # The trimmers: what her seamen leave when one side's guns of 'ardent class 1784', the chasers and the wheel are manned, the marines taking the carronades first, split by the frigate-36's trimmer shares, 8, 10, 12, 6 and 8 of 44 (Indf §6.4; judgement). The bill leaves the marines not wanted at the carronades for their division, as Falconer quarters them on the poop and forecastle or gangway (1780, QUARTERS); the beat to quarters (crew/quarters.py) takes the marines to the long guns before the topmen (Indf §6.4; the station order is the engine's, open for the lead). Of the forecastlemen, for the head sails and the fore braces (Luce 1884 ch. XX: the forecastlemen 'the best older seamen').
      forecastle: 10
      # Of the fore topmen, for the fore braces aloft.
      fore_top: 12
      # Of the main topmen, the largest top.
      main_top: 14
      # Of the mizzen topmen, for the crossjack braces and the mizen course.
      mizzen_top: 7
      # Of the afterguard, at the main sheet and the after braces.
      afterguard: 10
    # Two quartermasters at the wheel (Luce 1884 ch. XX, the quartermasters), as the frigate-36's (judgement).
    helm: 2
    # The powder beyond the idlers: none; her cooks, stewards, servants, clerks, the cooper, the armourers and the sailmaker's crew pass the cartridges, as the frigate-36's (judgement after Luce 1884 ch. XX, the powder division).
    powder: 0
    # The quarter gunners and the gunner's crew in the filling room, one to every four cannon (Falconer 1780, QUARTER-GUNNER, l.14283-14289); the swivels are not cannon (practice and resupply, between packages 72 and 73). Her 16 are the Regulations' quarter gunners of the 491 column (p. 165: Ind §4.2), the period's figure twice over (Indf §5.4).
    filling: 16
    # The fighting book's priority when sail work wants more hands than the trimmers give (spec M7 8a): 'sail before guns' robs the guns (the disengaged battery first) and the log says from where; 'guns before sail' makes the sail work wait short-handed. The player's book and the doctrine may say otherwise.
    priority: sail before guns
    # Seamen with the muskets of the stand of arms, the frigate-36's share of her seamen (20 of 182; judgement). Falconer's men to the small arms by the Admiralty's order (1780, QUARTERS, OCR l. 14335-14372: a 5th rate 50, a 4th rate of 60 guns 70, a 3rd rate of 70 guns 80) run close to whole detachments of marines, and stand for the whole party, marines and seamen (Indf §6.4).
    small_arms: 39
    # The boarders by the bill, a quarter of her seamen told off from the guns' crews (Luce 1884 ch. XX; judgement, the shared rule), with the marines, who board with the bayonet.
    boarders: 88
