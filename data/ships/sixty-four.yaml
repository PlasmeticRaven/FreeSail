crew:
  # The class's establishment from 1794, 491 (Winfield 1793-1817 p. 99; the Regulations 1806 p. 165, the 64's column; D17 (a)); 500 as built, but a file carries one complement whatever its fits, and the nine make no difference to her sailing.
  complement: 491
  # A King's ship: the english list in data/crew/names.yaml.
  names: english
  stations:
    # Hands per station, both watches together: her 351 seamen, the complement less the posts, the marines and the idlers, shared among the six stations as the frigate-36's 182 are (28, 24, 30, 14, 50 and 36: judgement, Indf §6.1-§6.2), the column's petty officers and its boys among them, the boys in the afterguard as landsmen (spec M3 9 item 6). Forecastlemen: the head, anchors and headsails; the best older seamen (Luce 1884 ch. XX).
    forecastle: 54
    # Fore topmen.
    fore_top: 46
    # Main topmen, the largest top.
    main_top: 58
    # Mizzen topmen.
    mizzen_top: 27
    # Afterguard, the boys included (spec M3 9 item 6: boys count as landsmen).
    afterguard: 96
    # Waisters.
    waisters: 70
    # Marines: the 491 column's captain, two lieutenants, two serjeants, two corporals and a drummer, 8, and 76 privates (judgement: the Bellona's share in 1761, 97 marines in her 567, Lavery 1985 p. 17 Table 7, via Bel §13.4; the frigate-36's share would give 74; the owner's leave of 2026-10-28); no establishment of private marines by rate was found (Ind §10.8). They stand watch and work as afterguard, never aloft (Luce 1884 ch. XX).
    marines: 84
    # Idlers: the trades below (Luce 1884 ch. XX: they stand no night watches).
    idlers: 42
  ratings:
    # Share of the seamen (not marines, idlers or officers) by rating: the frigate-36's (judgement, Indf §6.1). Able: 0.30.
    able: 0.3
    # Ordinary: 0.40, judgement.
    ordinary: 0.4
    # Landsmen: 0.30, judgement.
    landsman: 0.3
  posts:
  # Station holders by post (spec M3 2.3): the commissioned officers, the column's 5 lieutenants (the Regulations 1806 p. 165, the 491 column), then the standing and warrant officers and the master-at-arms, as the frigate-36's; her wardroom file (data/people/sixty-four.yaml) gives them. Names are drawn at muster unless a post gives one.
  - post: captain
  - post: first lieutenant
  - post: second lieutenant
  - post: third lieutenant
  - post: fourth lieutenant
  - post: fifth lieutenant
  - post: master
  - post: boatswain
  - post: gunner
  - post: carpenter
  - post: purser
  - post: surgeon
  - post: sailmaker
  - post: master-at-arms
  idlers_by_trade:
    # How the idlers are made up, the 491 column's rows by trade (the Regulations 1806; Ind §4.2) and judgement where it says so; they must sum to the idlers. The carpenter's mate and crew of eight, the caulker and the caulker's mate: 11.
    carpenter's crew: 11
    # The sailmaker's mate and crew of two, and the ropemaker: 4.
    sailmaker's crew: 4
    # A cooper, for the casks (judgement: the column has none): 1.
    cooper: 1
    # The armourer and two armourer's mates: 3.
    armourer: 3
    # The ship's cook, and a cook's mate (judgement): 2.
    cook: 2
    # The purser's steward and the steward's mate, and a gunroom steward (judgement): 3.
    steward: 3
    # Officers' servants (judgement: the frigate-36's eight, and more for her five lieutenants and the captain of marines): 12.
    servant: 12
    # The two assistant surgeons: 2.
    surgeon's mate: 2
    # The captain's clerk and the schoolmaster: 2.
    clerk: 2
    # The two ship's corporals: 2.
    master-at-arms's party: 2
  stores:
    # Water: the frigate-36's 100 tons for her 264 carried by the complement, 186 tons in iron-hooped casks (Indf §7; judgement), as many weeks at a gallon a man a day as hers.
    water_tons: 186
    # Provisions: four months at full allowance for the complement, as the frigate-36's (judgement).
    provisions_days: 120
    # The booms: the spare spars by class, as the frigate-36's (Luce 1866 ch. XVII, 'Stowing Booms'; Luce 1884 ch. XI; Steel 1794 vol. I, 'Lashing of Booms'), of her own spars (Indf §7); see tools/ships/indefatigable.py.
    spare_spars:
      # The fore and main topmasts, one in each pile (Luce 1866).
      topmast: 2
      # A stump fore and a stump main topgallant mast, one in each pile (Luce 1866).
      topgallant_mast: 2
      # The spare fore and main topsail yards, on the quarters (Luce 1866).
      yard: 2
      # The fore and main topmast studding-sail booms, a pair in each pile (Luce 1866; the pair judgement).
      studdingsail_boom: 4
      # The spare jib-boom, amidships (Luce 1866); she has no flying jib-boom (Steel 1794 vol. I p. 49, the 64).
      jib_boom: 1
    # Spare rope in the boatswain's store: the frigate-36's 600 fathoms carried by the complement, to fifty fathoms (Indf §7; judgement).
    cordage_fathoms: 1100
    # The carpenter's shot plugs (package 73, spec M7 §14): tapered plugs of soft wood with oakum and tallow, kept ready in action (the Regulations and Instructions 1806, the Carpenter; Falconer 1780, PLUG: 'shot-plugs ... to stop holes made by cannon shot'); the count by her class, judgement. One a gun of her default fit, 64 (Indf §7).
    shot_plugs: 64
    # The sail room (spec 3b §6.3): Luce's allowance for a frigate (1884 ch. X p. 171), as the frigate-36's, on her own sails (Indf §7), every sail new; see tools/ships/indefatigable.py.
    sails:
    # The second of each working sail, of the working number (Luce p. 171); she has one jib and no flying jib, and her mizen course stands for the frigate's spanker.
    - kind: main.course
      canvas_no: 2
      condition: 100
    - kind: mizzen.topsail
      canvas_no: 4
      condition: 100
    - kind: fore.topgallant
      canvas_no: 6
      condition: 100
    - kind: main.topgallant
      canvas_no: 6
      condition: 100
    - kind: mizzen.topgallant
      canvas_no: 7
      condition: 100
    - kind: fore.royal
      canvas_no: 8
      condition: 100
    - kind: main.royal
      canvas_no: 8
      condition: 100
    - kind: mizzen.royal
      canvas_no: 8
      condition: 100
    - kind: jib
      canvas_no: 6
      condition: 100
    - kind: mizzen.course
      canvas_no: 2
      condition: 100
    - kind: fore.topmast_staysail
      canvas_no: 6
      condition: 100
    # The heavy-weather foresail and fore and main topsails, of No. 1 (Luce p. 171, the table's note).
    - kind: fore.course
      canvas_no: 1
      condition: 100
    - kind: fore.topsail
      canvas_no: 1
      condition: 100
    - kind: main.topsail
      canvas_no: 1
      condition: 100
    # Storm canvas, one of each (Luce p. 171).
    - kind: fore.storm_staysail
      canvas_no: 1
      condition: 100
    - kind: mizzen.storm_staysail
      canvas_no: 1
      condition: 100
    - kind: storm_mizzen
      canvas_no: 1
      condition: 100
    # The occasional sails, one each (spec 3b §6.4).
    - kind: fore.save_all.starboard
      canvas_no: 7
      condition: 100
    - kind: fore.save_all.larboard
      canvas_no: 7
      condition: 100
  ration:
    # The ration (package 54, spec M7b 19): the Navy's table, the Regulations of 1806 (Sect. IX, Chap. I, Art. I), as data/crew/ration.yaml gives it; a King's ship.
    table: navy
    # Water drawn a man a day for his drink, his grog and the coppers: a gallon, the figure her water above is reckoned at (judgement).
    water_gallons: 1
  # The named people beyond the posts (package 35, spec M5 §22): each drawn from a station at muster, the counts above unchanged; see data/people/sixty-four.yaml.
  people:
  # Three master's mates, the 64's column's three (the Regulations 1806 p. 165), able seamen of the forecastle (the Master, art. XXVIII: the mates and midshipmen assist in the observations).
  - role: master's mate
    station: forecastle
    rating: able
  # Three master's mates, the 64's column's three (the Regulations 1806 p. 165), able seamen of the forecastle (the Master, art. XXVIII: the mates and midshipmen assist in the observations).
  - role: master's mate
    station: forecastle
    rating: able
  # Three master's mates, the 64's column's three (the Regulations 1806 p. 165), able seamen of the forecastle (the Master, art. XXVIII: the mates and midshipmen assist in the observations).
  - role: master's mate
    station: forecastle
    rating: able
  # A midshipman as the captain's messenger, one of the boys of the afterguard.
  - role: midshipman
    station: afterguard
    rating: landsman
    messenger: true
  # The captain of marines, drawn from the detachment (one of the eighty-four).
  - role: captain of marines
    station: marines
    rating: marine
  # The lieutenant of marines, drawn from the detachment.
  - role: lieutenant of marines
    station: marines
    rating: marine
  # The serjeant of marines, drawn from the detachment.
  - role: sergeant of marines
    station: marines
    rating: marine
  # The quarter bill beyond the gun crews (spec M7 8a; package 70; docs/design/Design-WorkInAction.md): at quarters every man has a station by it, the gun crews the fit's (each gun's crew above), the sail trimmers here by station (the men who leave the guns for a brace or a sail: Luce 1884 ch. XX, 'Watch, Quarter and Station Bills'), the hands at the helm, the powder beyond the idlers, and the fighting book's priority when sail work wants more hands than the trimmers give; the marines, the carpenter's crew and the surgeon's mates have their stations by their trades. The counts are judgement against the stations above.
  quarter_bill:
    trimmers:
      # The trimmers: what her 351 seamen leave when one side's guns of 'ardent class 1784', the chasers and the wheel are manned, the marines taking the carronades first: 296 men at the guns, 0 of them marines, and 2 at the wheel leave 53, split by the frigate-36's trimmer shares, 8, 10, 12, 6 and 8 of 44 (Indf §6.4; judgement). The bill leaves the marines not wanted at the carronades for their division, as Falconer quarters them on the poop and forecastle or gangway (1780, QUARTERS); the beat to quarters (crew/quarters.py) takes the marines to the long guns before the topmen, so at muster on 'ardent class 1784' every gun crew fills, 84 marines stand at the guns, 84 of them at the long guns, no marines' division forms and the trimmers are 137, the topmen the guns leave among them (measured at seed 7, Indf §6.4; the station order is the engine's, open for the lead). Of the forecastlemen, for the head sails and the fore braces (Luce 1884 ch. XX: the forecastlemen 'the best older seamen').
      forecastle: 10
      # Of the fore topmen, for the fore braces aloft.
      fore_top: 12
      # Of the main topmen, the largest top.
      main_top: 14
      # Of the mizzen topmen, for the crossjack braces and the mizen course.
      mizzen_top: 7
      # Of the afterguard, at the main sheet and the after braces.
      afterguard: 10
    # Two quartermasters at the wheel (Luce 1884 ch. XX, the quartermasters), as the frigate-36's (judgement).
    helm: 2
    # The powder beyond the idlers: none; her cooks, stewards, servants, clerks, the cooper, the armourers and the sailmaker's crew pass the cartridges, as the frigate-36's (judgement after Luce 1884 ch. XX, the powder division).
    powder: 0
    # The quarter gunners and the gunner's crew in the filling room, one to every four cannon (Falconer 1780, QUARTER-GUNNER, l.14283-14289); the swivels are not cannon (practice and resupply, between packages 72 and 73). Her 16 are the Regulations' quarter gunners of the 491 column (p. 165: Ind §4.2), the period's figure twice over (Indf §5.4).
    filling: 16
    # The fighting book's priority when sail work wants more hands than the trimmers give (spec M7 8a): 'sail before guns' robs the guns (the disengaged battery first) and the log says from where; 'guns before sail' makes the sail work wait short-handed. The player's book and the doctrine may say otherwise.
    priority: sail before guns
    # Seamen with the muskets of the stand of arms, the frigate-36's share of her 351 seamen (20 of 182; judgement). Falconer's men to the small arms by the Admiralty's order (1780, QUARTERS, OCR l. 14335-14372: a 5th rate 50, a 4th rate of 60 guns 70, a 3rd rate of 70 guns 80) run close to whole detachments of marines, and stand for the whole party, marines and seamen (Indf §6.4).
    small_arms: 39
    # The boarders by the bill, a quarter of her 351 seamen told off from the guns' crews (Luce 1884 ch. XX; judgement, the shared rule), with the marines, who board with the bayonet.
    boarders: 88
