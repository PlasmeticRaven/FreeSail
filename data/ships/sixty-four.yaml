# The ground tackle (package 34, spec M5 §18): Steel's anchors and cables for a 64 (Steel 1794 vol. I; D33 (a); Indf §7), every figure's source in tools/ships/indefatigable.py; chain cable is later than 1805.
ground_tackle:
  chain: false
  anchors:
  # The bowers: Steel's four of 57 cwt for a 64 (Steel 1794 vol. I, the anchor table, the page image read: Ind §6.2; D33 (a)); the cables Steel's seven of 21 in ('A Cordage Table', read), rated as every rope by Luce 1866 ch. IV, laid three on the best bower and two on the small, 'three Cables on the best Bower, two on the small Bower' (Lever 1808 p. 67), 120 fathoms a cable (Falconer 1780, CABLE).
  - id: best_bower
    kind: bower
    name: the best bower
    weight_kg: 2896.0
    cable_fathoms: 360.0
    cable_in: 21.0
    cable_kn: 683.2
  - id: small_bower
    kind: bower
    name: the small bower
    weight_kg: 2896.0
    cable_fathoms: 240.0
    cable_in: 21.0
    cable_kn: 683.2
  # The sheet anchor, a bower's size, on one cable.
  - id: sheet
    kind: sheet
    name: the sheet anchor
    weight_kg: 2896.0
    cable_fathoms: 120.0
    cable_in: 21.0
    cable_kn: 683.2
  # The spare anchor, Steel's fourth bower, on the seventh cable; of the kind 'sheet', the schema's kinds being four (Indf §7).
  - id: spare_anchor
    kind: sheet
    name: the spare anchor
    weight_kg: 2896.0
    cable_fathoms: 120.0
    cable_in: 21.0
    cable_kn: 683.2
  # The stream anchor, Steel's 15 cwt for a 64, on the stream cable of 11.5 in (Steel 1794 vol. I, the anchor and cordage tables: Ind §6.2).
  - id: stream
    kind: stream
    name: the stream anchor
    weight_kg: 762.0
    cable_fathoms: 120.0
    cable_in: 11.5
    cable_kn: 204.9
  # The kedge, Steel's 7 cwt 2 qr for a 64 (as above), on a hawser of half the bower cable's size, the house rule (gen_ships.KEDGE_HAWSER_OF_BOWER; judgement).
  - id: kedge
    kind: kedge
    name: the kedge
