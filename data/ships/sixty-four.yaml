      # Square. The knuckle, the transom's foot where the side closes to it, is the wing transom at its ends, 6 ft 4 1/2 in above WL1, rounded up 4 in to 6 ft 9 in at the middle line, the middle the higher, as a beam rounds up; the transom's half-breadths 13 ft 0 in at the knuckle, the wing transom's end, and 9 ft 0 in at the taffrail's side, 26 ft 11 in above WL1, on the side counter timber's outline seen from aft, each with the plank: measured on 1407F's body plan, ±0.05 ft. Plainly: stern_m's after face runs straight up the post on 1407F to 8.0 ft above WL1 before the counter leaves it, 1 ft 3 in above the wing transom at the middle line; the two readings are not reconciled (the line above 6 ft 9 in may be the rudder head's), open on 1407F. Two tiers of quarter gallery, the upper deck's and the quarterdeck's, each from its rail's lower edge to its top rail, measured on 1407F at full resolution. Two bands of five stern lights, read on ZAZ1953's stern elevation, her own as built, the lower within 10 ft 9 in of the middle line and the upper within 9 ft 7 in (measured at 4.63 px to the foot, ±0.3 ft), at the heights of the quarter gallery's aftmost lights on 1407F, which ZAZ1953 draws in line with them. Steel's 64 (1805 Folio LI, read) as a check: the lower counter's touch at the middle line 10.9 ft above WL1 against 1407F's 11.4, the upper's 13.4 against 14.1, the taffrail 30.4 against 28.0, the stern 22 ft broad at the top-timber line against 19.8-22.1 ft on the outline.
