crew:
  # Winfield: the Amazon class establishment, 264 men.
  complement: 264
  # A King's ship: the english list in data/crew/names.yaml.
  names: english
  stations:
    # Hands per station, both watches together. Forecastlemen: the head, anchors and headsails; the best older seamen (Luce 1884 ch. XX). 28: judgement (spec M3 2.3).
    forecastle: 28
    # Fore topmen: judgement (spec M3 2.3); Luce: the smartest of the young seamen.
    fore_top: 24
    # Main topmen: judgement (spec M3 2.3), the largest top.
    main_top: 30
    # Mizzen topmen: judgement (spec M3 2.3).
    mizzen_top: 14
    # Afterguard, the boys included (spec M3 9 item 6: boys count as landsmen): judgement (spec M3 2.3).
    afterguard: 50
    # Waisters: judgement. The spec's 48 less the twelve posts, so that stations and posts make the 264 of the establishment (the spec's figures made 276); the waist is the station whose numbers no yard or gear fixes.
    waisters: 36
    # Marines: judgement (spec M3 2.3), a sergeant's party for a frigate; they stand watch and work as afterguard, never aloft (Luce 1884 ch. XX).
    marines: 40
    # Idlers: the trades below (Luce 1884 ch. XX: they stand no night watches).
    idlers: 30
  ratings:
    # Share of the seamen (not marines, idlers or officers) by rating: judgement (spec M3 2.3), a wartime frigate's books (Falconer, ORDINARY: able and ordinary as rated on the navy books). Able: 0.30.
    able: 0.3
    # Ordinary: 0.40, judgement.
    ordinary: 0.4
    # Landsmen: 0.30, judgement.
    landsman: 0.3
  posts:
  # Station holders by post (spec M3 2.3): the commissioned officers, then the standing and warrant officers (Falconer, ORDINARY and CARPENTER). Names are drawn at muster unless a post gives one.
  - post: captain
  - post: first lieutenant
  - post: second lieutenant
  - post: third lieutenant
  - post: master
  - post: boatswain
  - post: gunner
  - post: carpenter
  - post: purser
  - post: surgeon
  - post: sailmaker
  - post: master-at-arms
  idlers_by_trade:
    # How the idlers are made up; they must sum to the idlers. Judgement for a frigate of 264 (spec M3 2.3). The carpenter's mates and crew: 6.
    carpenter's crew: 6
    # The sailmaker's mate and crew: 3.
    sailmaker's crew: 3
    # The cooper, for the casks: 1.
    cooper: 1
    # The armourer, at the forge: 1.
    armourer: 1
    # The ship's cook and his mate: 2.
    cook: 2
    # Purser's, captain's and gunroom stewards: 3.
    steward: 3
    # Officers' servants: 8.
    servant: 8
    # The surgeon's mates: 2.
    surgeon's mate: 2
    # The captain's clerk: 1.
    clerk: 1
    # The ship's corporals: 3.
    master-at-arms's party: 3
  stores:
    # Numbers only in milestone 3 (spec M3 10 says which milestone consumes each). Water: 100 tons in iron-hooped casks (spec M3 2.3 after Winfield, about four months at the frigates' allowance; at a gallon a man a day it is some twelve weeks for 264).
    water_tons: 100
    # Provisions: four months at full allowance for the complement (judgement).
    provisions_days: 120
    # Spare topmasts and yards in the waist and on the booms (judgement).
    spare_spars: 4
    # Spare rope in the boatswain's store (judgement).
    cordage_fathoms: 600
    # The sail room (spec 3b §6.3): Luce's allowance for a frigate (1884 ch. X p. 171), every sail new; see tools/gen_ships.py.
    sails:
    # The second of each working sail, of the working number (Luce p. 171).
    - kind: main.course
      canvas_no: 2
      condition: 100
    - kind: mizzen.topsail
      canvas_no: 4
      condition: 100
    - kind: fore.topgallant
      canvas_no: 6
      condition: 100
    - kind: main.topgallant
      canvas_no: 6
      condition: 100
    - kind: mizzen.topgallant
      canvas_no: 7
      condition: 100
    - kind: fore.royal
      canvas_no: 8
      condition: 100
    - kind: main.royal
      canvas_no: 8
      condition: 100
    - kind: mizzen.royal
      canvas_no: 8
      condition: 100
    - kind: jib
      canvas_no: 6
      condition: 100
    - kind: flying_jib
      canvas_no: 7
      condition: 100
    - kind: mizzen.spanker
      canvas_no: 2
      condition: 100
    - kind: fore.topmast_staysail
      canvas_no: 6
      condition: 100
    # The heavy-weather foresail and fore and main topsails, of No. 1 (Luce p. 171, the table's note).
    - kind: fore.course
      canvas_no: 1
      condition: 100
    - kind: fore.topsail
      canvas_no: 1
      condition: 100
    - kind: main.topsail
      canvas_no: 1
      condition: 100
    # Storm canvas, one of each (Luce p. 171).
    - kind: fore.storm_staysail
      canvas_no: 1
      condition: 100
    - kind: mizzen.storm_staysail
      canvas_no: 1
      condition: 100
    - kind: mizzen.storm_mizzen
      canvas_no: 1
      condition: 100
    # The occasional sails, one each (spec 3b §6.4).
    - kind: mizzen.ringtail
      canvas_no: 5
      condition: 100
    - kind: fore.save_all.starboard
      canvas_no: 7
      condition: 100
    - kind: fore.save_all.larboard
      canvas_no: 7
      condition: 100
