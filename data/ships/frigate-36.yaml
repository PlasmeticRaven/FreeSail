# The ground tackle (package 34, spec M5 §18): the anchors by the ship's size and the hemp cables by the fathom, every figure's rule in tools/gen_ships.py; chain cable is later than 1805 and the file says so.
ground_tackle:
  chain: false
  anchors:
  # The bowers: 46.6 cwt by the rule of five cwt to the hundred tons (933 tons burthen; the beam rule, two thirds the draught and the beam in cwt, gives 48.3), Luce 1866 ch. XIV. The cable 19 inches, half an inch to the foot of beam (judgement, unverified), rated as every rope by Luce ch. IV; two cables of 120 fathoms spliced on the best bower (Falconer 1780, CABLE; Lever 1808 p. 67).
  - id: best_bower
    kind: bower
    name: the best bower
    weight_kg: 2370.0
    cable_fathoms: 240.0
    cable_in: 19.0
    cable_kn: 559.3
  - id: small_bower
    kind: bower
    name: the small bower
    weight_kg: 2370.0
    cable_fathoms: 120.0
    cable_in: 19.0
    cable_kn: 559.3
  # The sheet anchor, the bowers' size and cable (Lever 1808 p. 67).
  - id: sheet
    kind: sheet
    name: the sheet anchor
    weight_kg: 2370.0
    cable_fathoms: 120.0
    cable_in: 19.0
    cable_kn: 559.3
  # The stream anchor, a quarter of the bower (Luce 1866 ch. XIV, the Book of Allowances), its cable two thirds of the bower's (judgement).
  - id: stream
    kind: stream
    name: the stream anchor
    weight_kg: 590.0
    cable_fathoms: 120.0
    cable_in: 12.5
    cable_kn: 242.1
  # The kedge, an eighth of the bower (Luce 1866 ch. XIV), on a hawser of half the cable's size (judgement).
  - id: kedge
    kind: kedge
    name: the kedge
    weight_kg: 300.0
    cable_fathoms: 120.0
    cable_in: 9.5
    cable_kn: 139.8
crew:
  # Winfield: the Amazon class establishment, 264 men.
  complement: 264
  # A King's ship: the english list in data/crew/names.yaml.
  names: english
  stations:
    # Hands per station, both watches together. Forecastlemen: the head, anchors and headsails; the best older seamen (Luce 1884 ch. XX). 28: judgement (spec M3 2.3).
    forecastle: 28
    # Fore topmen: judgement (spec M3 2.3); Luce: the smartest of the young seamen.
    fore_top: 24
    # Main topmen: judgement (spec M3 2.3), the largest top.
    main_top: 30
    # Mizzen topmen: judgement (spec M3 2.3).
    mizzen_top: 14
    # Afterguard, the boys included (spec M3 9 item 6: boys count as landsmen): judgement (spec M3 2.3).
    afterguard: 50
    # Waisters: judgement. The spec's 48 less the twelve posts, so that stations and posts make the 264 of the establishment (the spec's figures made 276); the waist is the station whose numbers no yard or gear fixes.
    waisters: 36
    # Marines: judgement (spec M3 2.3), a sergeant's party for a frigate; they stand watch and work as afterguard, never aloft (Luce 1884 ch. XX).
    marines: 40
    # Idlers: the trades below (Luce 1884 ch. XX: they stand no night watches).
    idlers: 30
  ratings:
    # Share of the seamen (not marines, idlers or officers) by rating: judgement (spec M3 2.3), a wartime frigate's books (Falconer, ORDINARY: able and ordinary as rated on the navy books). Able: 0.30.
    able: 0.3
    # Ordinary: 0.40, judgement.
    ordinary: 0.4
    # Landsmen: 0.30, judgement.
    landsman: 0.3
  posts:
  # Station holders by post (spec M3 2.3): the commissioned officers, then the standing and warrant officers (Falconer, ORDINARY and CARPENTER). Names are drawn at muster unless a post gives one.
  - post: captain
  - post: first lieutenant
  - post: second lieutenant
  - post: third lieutenant
  - post: master
  - post: boatswain
  - post: gunner
  - post: carpenter
  - post: purser
  - post: surgeon
  - post: sailmaker
  - post: master-at-arms
  idlers_by_trade:
    # How the idlers are made up; they must sum to the idlers. Judgement for a frigate of 264 (spec M3 2.3). The carpenter's mates and crew: 6.
    carpenter's crew: 6
    # The sailmaker's mate and crew: 3.
    sailmaker's crew: 3
    # The cooper, for the casks: 1.
    cooper: 1
    # The armourer, at the forge: 1.
    armourer: 1
    # The ship's cook and his mate: 2.
    cook: 2
    # Purser's, captain's and gunroom stewards: 3.
    steward: 3
    # Officers' servants: 8.
    servant: 8
    # The surgeon's mates: 2.
    surgeon's mate: 2
    # The captain's clerk: 1.
    clerk: 1
    # The ship's corporals: 3.
    master-at-arms's party: 3
  stores:
    # Numbers only in milestone 3 (spec M3 10 says which milestone consumes each). Water: 100 tons in iron-hooped casks (spec M3 2.3 after Winfield, about four months at the frigates' allowance; at a gallon a man a day it is some twelve weeks for 264).
    water_tons: 100
    # Provisions: four months at full allowance for the complement (judgement).
    provisions_days: 120
    # The booms: the spare spars by class (Luce 1866 ch. XVII, 'Stowing Booms'; Luce 1884 ch. XI, 'Stowing Booms'; Steel 1794 vol. I, 'Lashing of Booms': "the spare topmasts, yards, &c. stowed on the boat skids"); see tools/gen_ships.py.
    spare_spars:
      # The fore and main topmasts, one in each pile (Luce 1866).
      topmast: 2
      # A stump fore and a stump main topgallant mast, one in each pile (Luce 1866).
      topgallant_mast: 2
      # The spare fore and main topsail yards, on the quarters (Luce 1866).
      yard: 2
      # The fore and main topmast studding-sail booms, a pair in each pile (Luce 1866; the pair judgement).
      studdingsail_boom: 4
      # The spare jib-boom, amidships (Luce 1866).
      jib_boom: 1
      # The flying jib-boom, in the port pile (Luce 1866).
      flying_jib_boom: 1
    # Spare rope in the boatswain's store (judgement).
    cordage_fathoms: 600
    # The carpenter's shot plugs (package 73, spec M7 §14): tapered plugs of soft wood with oakum and tallow, kept ready in action (the Regulations and Instructions 1806, the Carpenter; Falconer 1780, PLUG: 'shot-plugs ... to stop holes made by cannon shot'); the count by her class, judgement. A frigate's 40.
    shot_plugs: 40
    # The sail room (spec 3b §6.3): Luce's allowance for a frigate (1884 ch. X p. 171), every sail new; see tools/gen_ships.py.
    sails:
    # The second of each working sail, of the working number (Luce p. 171).
    - kind: main.course
      canvas_no: 2
      condition: 100
    - kind: mizzen.topsail
      canvas_no: 4
      condition: 100
    - kind: fore.topgallant
      canvas_no: 6
      condition: 100
    - kind: main.topgallant
      canvas_no: 6
      condition: 100
    - kind: mizzen.topgallant
      canvas_no: 7
      condition: 100
    - kind: fore.royal
      canvas_no: 8
      condition: 100
    - kind: main.royal
      canvas_no: 8
      condition: 100
    - kind: mizzen.royal
      canvas_no: 8
      condition: 100
    - kind: jib
      canvas_no: 6
      condition: 100
    - kind: flying_jib
      canvas_no: 7
      condition: 100
    - kind: mizzen.spanker
      canvas_no: 2
      condition: 100
    - kind: fore.topmast_staysail
      canvas_no: 6
      condition: 100
    # The heavy-weather foresail and fore and main topsails, of No. 1 (Luce p. 171, the table's note).
    - kind: fore.course
      canvas_no: 1
      condition: 100
    - kind: fore.topsail
      canvas_no: 1
      condition: 100
    - kind: main.topsail
      canvas_no: 1
      condition: 100
    # Storm canvas, one of each (Luce p. 171).
    - kind: fore.storm_staysail
      canvas_no: 1
      condition: 100
    - kind: mizzen.storm_staysail
      canvas_no: 1
      condition: 100
    - kind: storm_mizzen
      canvas_no: 1
      condition: 100
    # The occasional sails, one each (spec 3b §6.4).
    - kind: ringtail
      canvas_no: 5
      condition: 100
    - kind: fore.save_all.starboard
      canvas_no: 7
      condition: 100
    - kind: fore.save_all.larboard
      canvas_no: 7
      condition: 100
  ration:
    # The ration (package 54, spec M7b 19): the Navy's table, the Regulations of 1806 (Sect. IX, Chap. I, Art. I), as data/crew/ration.yaml gives it; a King's ship.
    table: navy
    # Water drawn a man a day for his drink, his grog and the coppers: a gallon, the figure her water above is reckoned at (judgement).
    water_gallons: 1
  # The named people beyond the posts (package 35, spec M5 §22): each drawn from his station at muster, the counts above unchanged; see tools/gen_ships.py.
  people:
  # Two master's mates, able seamen of the forecastle (the Regulations of 1806, the Master, art. XXVIII: the mates and midshipmen assist him in the observations).
  - role: master's mate
    station: forecastle
    rating: able
  # Two master's mates, able seamen of the forecastle (the Regulations of 1806, the Master, art. XXVIII: the mates and midshipmen assist him in the observations).
  - role: master's mate
    station: forecastle
    rating: able
  # A midshipman as the captain's messenger, one of the boys of the afterguard.
  - role: midshipman
    station: afterguard
    rating: landsman
    messenger: true
  # The lieutenant of marines, drawn from the detachment (one of the forty).
  - role: lieutenant of marines
    station: marines
    rating: marine
  # The sergeant of marines, drawn from the detachment.
  - role: sergeant of marines
    station: marines
    rating: marine
  # The quarter bill beyond the gun crews (spec M7 8a; package 70; docs/design/Design-WorkInAction.md): at quarters every man has a station by it, the gun crews the fit's (each gun's crew above), the sail trimmers here by station (the men who leave the guns for a brace or a sail: Luce 1884 ch. XX, 'Watch, Quarter and Station Bills'), the hands at the helm, the powder beyond the idlers, and the fighting book's priority when sail work wants more hands than the trimmers give; the marines, the carpenter's crew and the surgeon's mates have their stations by their trades. The counts are judgement against the stations above.
  quarter_bill:
    trimmers:
      # The trimmers: of the forecastlemen, for the head sails and the fore braces (Luce 1884 ch. XX: the forecastlemen 'the best older seamen'); the five counts make the 44 hands the 264 leave when every gun of a side, the chasers and the wheel are manned (judgement).
      forecastle: 8
      # Of the fore topmen, for the fore braces and the topsails aloft.
      fore_top: 10
      # Of the main topmen, the largest top, for the main braces.
      main_top: 12
      # Of the mizzen topmen, for the crossjack braces and the spanker.
      mizzen_top: 6
      # Of the afterguard, at the main sheet and the after braces; the rest of the afterguard to the quarterdeck carronades.
      afterguard: 8
    # Two quartermasters at the wheel (Luce 1884 ch. XX, the quartermasters).
    helm: 2
    # The powder beyond the idlers: none; a frigate's cooks, stewards, servants, the clerk, the cooper, the armourer and the sailmaker's crew pass the cartridges (judgement after Luce 1884 ch. XX, the powder division).
    powder: 0
    # The quarter gunners and the gunner's crew in the filling room, one to every four cannon (Falconer 1780, QUARTER-GUNNER, l.14283-14289); the swivels are not cannon (practice and resupply, between packages 72 and 73).
    filling: 10
    # The fighting book's priority when sail work wants more hands than the trimmers give (spec M7 8a): 'sail before guns' robs the guns (the disengaged battery first) and the log says from where; 'guns before sail' makes the sail work wait short-handed. The player's book and the doctrine may say otherwise.
    priority: sail before guns
