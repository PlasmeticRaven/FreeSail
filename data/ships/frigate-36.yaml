# Reference ship: Amazon, a 36-gun 18-pounder frigate of the Amazon class (Rule, 1795).
# Generated by tools/gen_ships.py; edit that script and rerun, do not edit this file.
# Hull: Winfield's published dimensions of the class. Spars: Luce 1866 ch. VII rules,
# checked against Falconer 1780 art. YARD. Rope: Luce 1866 ch. IV (breaking strain of
# tarred hemp, one third for the working load) and ch. VIII (sizes by class). Brace
# limits: Luce 1866 ch. XXIV (d'Ulloa, Fincham). Spar ratings are provisional, set for
# truth 9 with the M1 sail curves; see the script's docstring. Canvas: Steel 1794 vol. I
# with Kipping and Luce 1884 p. 171; cloth ratings from the number by Luce App. E.
# Units: metres, m2, kg, kN. Comments mark each judgement.
ship:
