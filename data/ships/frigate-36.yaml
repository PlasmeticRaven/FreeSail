  era_notes: 'A 36-gun 18-pounder frigate of the Amazon class (Sir William Rule, launched 1795): gundeck
    143 ft 2.5 in, keel 119 ft 5.5 in, beam 38 ft 4 in, 933 tons burthen. Spars by the rules of Luce 1866
    ch. VII checked against Falconer 1780; rope by Luce ch. IV; see tools/gen_ships.py for every rule
    and judgement.'
hull:
  # 137 ft: judgement, 0.96 of the 143 ft gundeck (keel 119 ft 6 in). Amazon class 1795, Winfield.
  length_waterline_m: 41.8
  # 38 ft 4 in extreme breadth (Winfield).
  beam_m: 11.7
  # 15 ft mean, judgement: 13 ft forward, 17 ft aft stored for sea (unladen 10 ft 3 in / 15 ft 3 in, Winfield).
  draught_m: 4.6
  # LWL x beam x draught x Cb 0.55 x 1025: about 1,270 t, 1.36 x the 933 tons burthen (judgement: the usual ratio for the type).
  displacement_kg: 1270000.0
  # 4 ft 3 in: judgement, typical of an 18-pounder frigate (3.5 to 5 ft).
  gm_m: 1.3
  # Geometric centre of the lateral plane about 1.0 m abaft midships (drag of the keel, deadwood aft); the centre of pressure with way on lies a lead of about 10 per cent of LWL ahead of it (judgement): +3.0 m. Package 8 set +3.5; package 10 moved it 0.5 m aft after the raked masts carried the sail centres aft (docs/dev/TuningNotes.md): with the tuned curves she then carries about 1 deg of weather helm close-hauled and 2 on a beam reach in 15 kn (truth 6), and gets under way from rest without rounding up into the wind (truth 17); at +3.5 she rounded up to 33 deg off with sternway.
  clr_x_m: 3.0
  # LWL x draught x 0.85 for the fullness of the profile.
  lateral_area_m2: 160.0
  # The best speed of 18-pounder frigates in sailing-quality reports is 12 to 13 knots (Winfield); the derived 1.34 sqrt(LWL ft) = 15.7 is a modern yacht's figure. Package 10 may tune within 12.5 to 13.5.
  hull_speed_kn: 13.0
  # Upper (gun) deck at midships, about 6 ft above the load line.
  deck_height_m: 1.8
  # Blade about 15 ft by 4 ft 3 in; 35 degrees is the period stop.
  rudder:
    area_m2: 6.0
    max_angle_deg: 35
    rate_deg_s: 3.0
