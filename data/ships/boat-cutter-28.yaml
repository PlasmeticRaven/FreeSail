# what it differs from, each line marked in its note; to read, Steel 1805 Folio LVII.
# Units: metres, m2, kg, kN. Comments mark judgements. The oars' three figures and
# the oar force: docs/design/Design-BoatAndPersonAboard.md §5.2.
ship:
  name: the boat
  rig: boat
  era_notes: 'The frigate''s first cutter, an eight-oared boat with a lug: the pattern of the frigate''s
    first cutter (28 ft); her second cutter (25 ft) is the same pattern smaller and is recorded so, no
    file. A boat of the ships'' files (package 82; docs/design/Design-BoatAndPersonAboard.md §5), manned
    as a hull of the world when she is commanded and the script''s boat on her errands otherwise; her
    name is her ship''s (''the Raven''s boat'') when she is manned. Sources: Steel 1805 p. 181 (''ships''
    cutters ... shorter, broader, and deeper, in proportion ... clincher built, and constructed for sailing
    or rowing''); Luce 1866 ''Boats'' (the first cutter 0.9 of the launch); the frigate''s file (Luce''s
    rule, 0.9 x 31). To read: Steel 1805, Folio LVII, ''Dimensions and scantlings of boats'' (IA leaves
    599 to 602), which gives the pattern''s dimensions by length; read, its figures replace the judgement
    here, and never the game''s behaviour. Built by tools/gen_ships.py; edit the script and rerun.'
hull:
  # 28 ft, the boat's length (the pattern's; judgement from the ships' boats lists, which Luce's rule sizes).
  length_waterline_m: 8.5
  # 7.00 ft, a quarter of the length (Luce 1866, 'Boats': a named period rule).
  beam_m: 2.1
  # 1.50 ft laden (judgement: to read, Steel 1805 Folio LVII).
  draught_m: 0.5
  # 2,900 kg laden: the boat herself by Luce's weight rule and her men and their gear the rest (judgement).
  displacement_kg: 2900.0
  # 0.5 m, a boat's (judgement: an open boat is tender under sail and stiff with her men sat low).
  gm_m: 0.5
  # Amidships (judgement).
  clr_x_m: 0.0
  # LWL x draught x 0.85, the small vessels' rule.
  lateral_area_m2: 3.61
  # 1.34 sqrt(28 ft).
  hull_speed_kn: 7.1
  # The gunwale 1.25 ft above the water laden (a depth of 2.75 ft less the draught; judgement); a man standing in her looks from 1.7 m over it (freesail/world/lookout.py).
  deck_height_m: 0.38
  # A yoke's rudder hung on the transom, 0.45 m2 (a boat's rudder is large for her size, about a sixtieth of a square metre to the foot of her length: judgement after the yawl's and the launch's blades), as deep as her depth, put over quickly by the coxswain's yoke lines (judgement).
  rudder:
    area_m2: 0.45
    max_angle_deg: 35
    rate_deg_s: 20.0
    span_m: 0.84
spars:
# one mast of 17 ft above the gunwale, stepped at will in a thwart's clamp and unstepped to pull (Steel 1794 vol. II, the boats' stores table: masts, sails and halyards allowed to the yawl and the cutter), unstayed; judgement on the length (about 0.6 of the boat's). To read: Steel 1805, Folio LVII, 'Dimensions and scantlings of boats' (IA leaves 599 to 602), which gives the pattern's dimensions by length; read, its figures replace the judgement here, and never the game's behaviour. Rating: lug in 25 kn -> 1.3 kN.
- id: mast
