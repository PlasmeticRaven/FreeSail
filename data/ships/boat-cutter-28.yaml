# The oars (package 82; the design's §5.2): the thrust of one oar is min(thrust_n, power_w / way) x the stroke x the men's tiring, 1 / (1 + hours / tiring_h); thrust_n a man's pull on the blade at no way, power_w his power at the oar over hours, tiring_h the hours that halve his strength. Judgement, fitted to the brief's words (three to four knots light under four oars, a knot and a half towing, the men tiring by the hour); the oar a lever of the second class striking the water (Falconer 1780, OAR), which gives no figure. Read by freesail/physics/oars.py and by nothing else.
