  height_m: 5.2
  rating_kn: 1.3
# the lug's yard 15 ft, 0.9 of the mast, slung at a third and peaked (judgement after the luggers' practice, Forfait 1788 p. 53). Rating: lug in 25 kn -> 1.3 kN.
- id: lug_yard
  class: lug_yard
  'on': mast
  length_m: 4.7
  height_m: 4.9
  rating_kn: 1.3
sails:
