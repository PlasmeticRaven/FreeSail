# The ground tackle (package 34, spec M5 §18): Steel's anchors and cables for a vessel of 14 guns and 300 tons (Steel 1794 vol. I; Neuf-D §7), every figure's source in tools/ships/neufchatel.py; chain cable is later than her years.
ground_tackle:
  chain: false
  anchors:
  # The bowers: Steel's three of 20 cwt for '14 Guns, 300 Tons', the row nearest her 328 tons (Steel 1794 vol. I, the anchor table, the page image read: Neuf-D §7; the house prefers Steel, D33); the cables the cordage table's 'Sloops' column, five of 13.5 in (read; the column judgement, the table having none for 14 guns, its '20 guns' column six of 14 1/2 in), rated as every rope by Luce 1866 ch. IV, laid two on the best bower, two on the small and one on the sheet (judgement), 120 fathoms a cable (Falconer 1780, CABLE). Steel's table is the Navy's; no source gives a privateer's. The house's rule (Luce 1866 ch. XIV, the generator's ground_tackle_for) is set aside for the period's own table on her tonnage.
  - id: best_bower
    kind: bower
    name: the best bower
    weight_kg: 1016.0
    cable_fathoms: 240.0
    cable_in: 13.5
    cable_kn: 282.4
  - id: small_bower
    kind: bower
    name: the small bower
    weight_kg: 1016.0
    cable_fathoms: 240.0
    cable_in: 13.5
    cable_kn: 282.4
  # The sheet anchor, Steel's third bower, on one cable.
  - id: sheet
    kind: sheet
    name: the sheet anchor
    weight_kg: 1016.0
    cable_fathoms: 120.0
    cable_in: 13.5
    cable_kn: 282.4
  # The stream anchor, Steel's 7 cwt for the row, on the 'Sloops' stream cable of 8 in (Steel 1794 vol. I, the anchor and cordage tables, read).
  - id: stream
    kind: stream
    name: the stream anchor
    weight_kg: 356.0
    cable_fathoms: 120.0
    cable_in: 8.0
    cable_kn: 99.2
  # The kedge, Steel's 3 cwt 2 qr for the row, on a hawser of half the bower cable's size, the house rule (gen_ships.KEDGE_HAWSER_OF_BOWER; judgement).
  - id: kedge
    kind: kedge
    name: the kedge
    weight_kg: 178.0
    cable_fathoms: 120.0
    cable_in: 6.75
    cable_kn: 70.6
crew:
  # 'From Boston, 18 guns, 130 men' (Niles' Weekly Register vol. VII p. 284, 31 December 1814, read); 130 in Collier's report as reprinted (D36 (a)). Emmons 1853's 127 (p. 190), James's '120 or 130 men' in October (vol. 6 p. 237) and Cobb's 163 'all told' (1841 p. 39) beside it. Her large crew for prizes (the brief) is this company: about seven men a gun, with nine prize-masters to take her prizes in.
  complement: 130
  # An American privateer's crew: the american list in data/crew/names.yaml (D39 with the brief); her file names no nation, the list's being the United States' where a scenario names none (world/nations.py), and a scenario's `nation:` wins.
  names: american
  stations:
    # Hands per station, both watches together: her seamen, the complement less the posts, the marines and the idlers (Neuf-D §6.1; the shares judgement): the fore top the larger for her four fore yards and the studding sails, the afterguard for the great mainsail and the gaffs; no main top, her main a schooner's with crosstrees and no top (Cobb 1841 p. 91), as the topsail schooner's. Nine prize-masters among the afterguard's able seamen (Cobb p. 40), one of them drawn by name below: a post stands on the quarterdeck and never hauls (crew/muster.py), and prizes are package 74's, which takes its prize crews from her company. Her people's nations were mixed (Cobb p. 42; Stevens 1915 p. 27). Forecastlemen: the head, the anchors and the headsails.
    forecastle: 20
    # Fore topmen, for her four fore yards and the studding sails.
    fore_top: 24
    # Afterguard, at the main sheet and the gaffs, the boys among them as landsmen (spec M3 9 item 6).
    afterguard: 30
    # Waisters.
    waisters: 20
    # Marines: Cobb was put 'with seven others' in the long boat at quarters with muskets, 'the first intimation I had of being drafted into the marine corps' (1841 p. 73, read); Coggeshall counts 'officers and marines' (1856 p. 241). At least eight; sixteen is judgement, the long boat's eight and as many forward (Neuf-D §6.2). Landsmen with muskets, not a detachment as a King's ship's; no marine officer, none being named. Their kit the scenario's nation's (data/nations.yaml: the United States' basic).
    marines: 16
    # Idlers: the trades below (Luce 1884 ch. XX: they stand no night watches).
    idlers: 8
  ratings:
    # Share of the seamen (not marines, idlers or officers) by rating: judgement (Neuf-D §6.1). The privateer schooner ships prime seamen; her December crew did not: the prize money of her last cruise drew 'many, who otherwise never would have gone to sea' (Cobb 1841 p. 39), and Cobb was a green hand. Able: 0.35.
    able: 0.35
    # Ordinary: 0.35, judgement.
    ordinary: 0.35
    # Landsmen: 0.30, judgement.
    landsman: 0.3
  posts:
  # Station holders by post (spec M3 2.3): her December crew's, 'besides the captain, we had five lieutenants, nine prize-masters, quarter-masters, sailing-masters, boatswains, gunners, carpenters, and sail-makers in profusion' (Cobb 1841 p. 40, read), one of each warrant (judgement), and the surgeon (pp. 75-76); their mates petty officers in the stations (judgement). Her wardroom file (data/people/hermaphrodite-brig.yaml) gives them; names are drawn at muster unless a post gives one.
  - post: captain
  - post: first lieutenant
  - post: second lieutenant
  - post: third lieutenant
  - post: fourth lieutenant
  - post: fifth lieutenant
  - post: master
  - post: surgeon
  - post: boatswain
  - post: gunner
  - post: carpenter
  - post: sailmaker
  idlers_by_trade:
    # How the idlers are made up (Neuf-D §6.1; judgement); they must sum to the idlers. Two of the carpenter's crew: 2.
    carpenter's crew: 2
    # One of the sailmaker's: 1.
    sailmaker's crew: 1
    # A cooper, for her water and provision casks: 1.
    cooper: 1
    # An armourer, for her blunderbusses, muskets and pikes: 1.
    armourer: 1
    # A cook: 1.
    cook: 1
    # A steward, Cobb's 'purser's steward' (p. 75): 1.
    steward: 1
    # A servant: 1.
    servant: 1
  stores:
    # Water for two months at a gallon a man a day (judgement, Neuf-D §7); her hold was 'cleared away underneath the deck, except the water and provision casks' for prize goods (Cobb 1841 p. 40).
    water_tons: 35
    # Provisions for three months (judgement): her cruise of 1814 ran from Cherbourg on 4 July to Boston on 15 October (Stevens 1915 p. 26; Niles vol. VII p. 120).
    provisions_days: 90
    # The booms: the spare spars by class, the brig-sloop's list (Luce 1866 ch. XVII, 'Stowing Booms', scaled to a brig-sloop) on her own spars (Neuf-D §7; judgement); see tools/ships/neufchatel.py.
    spare_spars:
      # A spare topmast (judgement, after Luce 1866 and the brig-sloop's).
      topmast: 1
      # A stump topgallant mast (judgement, after Luce 1866).
      topgallant_mast: 1
      # A spare topsail yard (judgement, after Luce 1866).
      yard: 1
      # A pair of topmast studding-sail booms for her fore (judgement, after Luce).
      studdingsail_boom: 2
      # The spare jib-boom (Luce 1866).
      jib_boom: 1
    # Spare rope in the boatswain's store: the brig-sloop's (judgement).
    cordage_fathoms: 300
    # The carpenter's shot plugs (package 73, spec M7 §14): tapered plugs of soft wood with oakum and tallow, kept ready in action (the Regulations and Instructions 1806, the Carpenter; Falconer 1780, PLUG: 'shot-plugs ... to stop holes made by cannon shot'); the count by her class, judgement. One a gun of her fit.
    shot_plugs: 18
    # The sail room (spec 3b §6.3) by the topsail schooner's method (Neuf-D §7), every sail new; see tools/ships/neufchatel.py.
    sails:
    # A second fore gaff sail, fore topsail and jib, the sails a privateer on a cruise could least do without, as the topsail schooner's (spec 3b §6.3, judgement).
    - kind: fore.sail
      canvas_no: 2
      condition: 100
    - kind: fore.topsail
      canvas_no: 2
      condition: 100
    - kind: jib
      canvas_no: 2
      condition: 100
    # Storm canvas, one of each (spec 3b §6.4).
    - kind: fore.storm_staysail
      canvas_no: 1
      condition: 100
    - kind: storm_trysail
      canvas_no: 1
      condition: 100
    - kind: storm_jib
      canvas_no: 1
      condition: 100
  ration:
    # The ration (package 54, spec M7b 19): the Navy's table, the Regulations of 1806 (Sect. IX, Chap. I, Art. I), as data/crew/ration.yaml gives it; a private ship of war's articles promised the like (judgement).
    table: navy
    # Water drawn a man a day for his drink, his grog and the coppers: a gallon, the figure her water above is reckoned at (judgement).
    water_gallons: 1
  # The named people beyond the posts (package 35, spec M5 §22): each drawn from a station at muster, the counts above unchanged; see data/people/hermaphrodite-brig.yaml.
  people:
  # One of her nine prize-masters (Cobb 1841 p. 40; one kept her in charge at Boston while she fitted out, p. 27), an able seaman of the afterguard drawn by name; the rest among the afterguard's able seamen (Neuf-D §6.1; judgement).
  - role: prize-master
    station: afterguard
    rating: able
  # A quartermaster, Cobb 1841 p. 40's 'quarter-masters' (one sent to the masthead as the best man aboard, p. 94), an able seaman of the afterguard (judgement: one drawn).
  - role: quartermaster
    station: afterguard
    rating: able
  # A boy as the captain's messenger (judgement).
  - role: boy
    station: afterguard
    rating: landsman
    messenger: true
  # The quarter bill beyond the gun crews (spec M7 8a; package 70; docs/design/Design-WorkInAction.md): at quarters every man has a station by it, the gun crews the fit's (each gun's crew above), the sail trimmers here by station (the men who leave the guns for a brace or a sail: Luce 1884 ch. XX, 'Watch, Quarter and Station Bills'), the hands at the helm, the powder beyond the idlers, and the fighting book's priority when sail work wants more hands than the trimmers give; the marines, the carpenter's crew and the surgeon's mates have their stations by their trades. The counts are judgement against the stations above.
  quarter_bill:
    trimmers:
      # The trimmers: the brig-sloop's twenty-seven (brig.yaml's bill) carried by her plain sail against the brig's, a quarter more (Neuf-D §6.4; the arithmetic in the generator's report), split by each mast's work (judgement). Of the forecastlemen, for the headsails and the fore tacks and sheets.
      forecastle: 9
      # Of the fore topmen, for her four fore yards.
      fore_top: 11
      # Of the afterguard, at the main sheet, the gaffs and the fore gaff sail's sheet.
      afterguard: 15
    # One man at the tiller, as the privateer schooner's (judgement).
    helm: 1
    # Two of the waisters to pass the cartridges, as the privateer schooner's (judgement).
    powder: 2
    # The quarter gunners and the gunner's crew in the filling room, one to every four cannon (Falconer 1780, QUARTER-GUNNER, l.14283-14289); the swivels are not cannon (practice and resupply, between packages 72 and 73). Her eighteen pieces give four (Neuf-D §5.4).
    filling: 4
    # The fighting book's priority when sail work wants more hands than the trimmers give (spec M7 8a): 'sail before guns' robs the guns (the disengaged battery first) and the log says from where; 'guns before sail' makes the sail work wait short-handed. The player's book and the doctrine may say otherwise. Hers the privateer schooner's: her trade was running and chasing (Neuf-D §6.4).
    priority: sail before guns
    # Her sixteen marines and ten seamen with the muskets and blunderbusses (Coggeshall 1856 p. 241): a fifth of her company, the privateer schooner's share of hers (judgement, Neuf-D §6.4).
    small_arms: 26
    # Boarders with cutlass, pistol and pike, two thirds of her company: the privateer schooner's share, 'a privateer's company boards almost whole' (judgement, Neuf-D §6.4).
    boarders: 85
# The armament (spec M7 7; package 70's shape; docs/design/Design-Ship-PrinceDeNeufchatel.md §5): her one fit, each gun on its port of the hull's profile to the centimetre with its deck named (Build-Ships.md §4.4, §6's checklist); the weights by Adye 1804 (pp. 72, 155) and the crews by Douglas 1829 and Falconer 1780 (D31 (c)); the magazine a private ship of war's. Every figure's source is in tools/ships/neufchatel.py.
armament:
  default: as taken 1814
  fits:
    # Her one fit (D22 (a)): 16 x 12-pounder carronades and 2 long 6-pounders, 18 pieces, no pivot (Winfield pp. 335-336, the Admiralty's record, most likely as taken: judgement). Eighteen guns sailing from Boston on 21 December 1814 (Niles vol. VII p. 284), in Cobb (p. 39) and in the Naval Chronicle ('pierced for 22 guns, and mounting 18', vol. 33 p. 72); 18 in October (James vol. 6 p. 237). Cobb's 'nine and eighteen pounders' (p. 39) is one witness 26 years on, and no other source gives them; 17 guns in October (Niles vol. VII p. 120; Coggeshall 1856 p. 241) and 14 by her log (Stevens 1915 p. 26); the 12-lb bags of musket balls of the boat action (Stevens p. 27) fit 12-pounder carronades (judgement). No pivot: no source names one and none is drawn, though none of her sheets is a deck plan (Neuf §2.7). Her small arms blunderbusses, muskets and boarding pikes (Coggeshall p. 241); her guns double shotted with canister and bags of musket balls (Coggeshall 1861 p. 468; Stevens p. 27), grape to the engine. The default.
