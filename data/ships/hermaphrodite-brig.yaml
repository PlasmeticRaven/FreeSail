  # Her side, decks and ports (Neuf-D §3; Build-Ships.md §5.1): x forward of the middle of her waterline between the rabbets, z above her sailing-trim line at each station, metres; measured on RMG ZAZ6177 (her lines, taken off at Deptford in 1815; 7.05 px/ft, +-0.3 ft) but where a line's note says judgement. Her ports and masts are Neuf's figures forward of the post at deck height, through the join to the after rabbet (tools/ships/neufchatel.py, POST_AT_DECK_FT).
