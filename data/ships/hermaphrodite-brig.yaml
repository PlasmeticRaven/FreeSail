# The Prince de Neufchatel: the American privateer hermaphrodite brig of 1812-1814, 328
# tons, taken in December 1814 (Winfield 1793-1817 pp. 335-336; RMG ZAZ6177, her lines, and
# ZAZ6179, her sail plan, measured on the museum's images and never copied). Generated by
# tools/gen_ships.py (tools/ships/neufchatel.py); edit those and rerun, do not edit this
# file. Her design: docs/design/Design-Ship-PrinceDeNeufchatel.md. Rope: the brig-sloop's
# and the topsail schooner's scaled to her sail (judgement). Spar ratings are provisional,
# set for truth 9 with the M1 sail curves; see the script. Canvas: Steel 1794 vol. I; cloth
# ratings from the number by Luce App. E. Units: metres, m2, kg, kN. Comments mark
# judgements.
ship:
  name: Prince de Neufchatel
  rig: hermaphrodite brig
  era_notes: 'A Baltimore privateer hermaphrodite brig of 1812, built at New York (Winfield, British Warships
    in the Age of Sail 1793-1817, pp. 335-336; her lines and sail plan, RMG ZAZ6177 and ZAZ6179): the
    American privateer Prince de Neufchatel of 328 tons, built in 1812-13, eighteen guns and 130 men,
    taken by Leander, Newcastle and Acasta on 28 December 1814 and taken off at Deptford in 1815; flush-decked,
    on her own lines, with a brig''s square foremast and a schooner''s main, a large loose-footed fore
    gaff sail lapping the mainmast. Her hull from her lines, her rig from her sail plan with the yards
    doubled, Fincham 1843 p. 78 only for spars it does not draw; see tools/ships/neufchatel.py for every
    figure''s source.'
  descriptions:
    hermaphrodite brig:
      rig: a brig
      what: a hermaphrodite brig, a brig's foremast and a schooner's main, long and low, pierced for eleven
        guns a side
      note: '''Hermaphrodite rigged'' (Niles vol. VII p. 120; Cobb 1841 p. 38; Coggeshall 1856 p. 241),
        Rankine''s word for the rig (via Chapelle 1930 p. 164); ''lying low in the water'' (Cobb p. 38);
        ''pierced for 22 guns'' (Naval Chronicle vol. 33 p. 72). The Admiralty''s ''American Schooner''
        (RMG ZAZ6177, ZAZ6179) and Winfield''s schooner (pp. 335-336); her log''s ''privateer brig'' (Stevens
        1915 p. 26). At four miles the tops make out a brig, her square fore the brig''s (D15 (a); judgement
        on the words). Her one fit, her file''s default; a privateer''s role (Build-Ships.md §8.2).'
      fit: as taken 1814
      roles:
      - privateer
hull:
  # 107.3 ft between the post's and the stem's rabbets at her sailing-trim line (D29 (b); measured on RMG ZAZ6177, +-0.5 ft: Neuf §2.4); 110.1 ft over the post's after side and the gripe's fore side (measured); 110 ft 8 in on deck (Winfield 1793-1817 pp. 335-336).
  length_waterline_m: 32.7
  # 25 ft 8 in extreme (Winfield pp. 335-336; ZAZ6177's table '25-8?', read, tentative); 25 ft 4 in moulded (the table); her line 24.47 ft moulded, 24.8 ft outside the plank (measured: Neuf §2.4).
  beam_m: 7.82
  # 10 ft 4 1/2 in mean to the false keel's bottom at the sailing-trim line drawn on her own lines, 'Draught of Water when in sailing Trim' (ZAZ6177, read): 11 ft 8 3/4 in aft, 9 ft 0 in forward (measured, +-0.25 ft; ZAZ6179 gives about 11.8 and 9.25 independently); about 0.5 ft less if the faint line is the keel's bottom (Neuf §2.3). D38 (a), D29 (b).
  draught_m: 3.16
  # Measured at her sailing-trim line, +-10 t (Neuf §2.5: the moulded volume off the three traced waterlines and the rabbets, the plank, keel and rudder added). The weight budget for 130 men, 18 guns and stores is about 315 t (judgement): the drawn trim is plausible, perhaps a little light.
  displacement_kg: 288000.0
  # D23 (a): the metacentre 1.59 m above her line (measured, +-0.15 m: Neuf §2.5); Fincham 1843 p. 19's class ratios on his first example give 2.12 m for a brig of 10 guns and 2.40 for one of 18, the weight budget about 2.2 (judgement). Kept at her tuning, within 2.0-2.2 (Neuf-D §9): no account gives her heel (docs/dev/TuningNotes.md).
  gm_m: 2.1
  # Tuned against the helm (Neuf-D §9; docs/dev/TuningNotes.md, old beside new), so that she carries a little weather helm close-hauled in 15 kn and a little with the wind abeam (judgement): ahead of the geometric centre of the plane the file counts, -0.80 m without the rudder (measured, Neuf §2.6), by 0.2 m. Her helm falls from close-hauled to the beam, so that with her fore staysail the 46 m2 that fits forward of her fore mast no single figure holds both of the helm's bands as first set: each band is widened by 0.2 degrees and the centre re-tuned to this figure (the owner's ruling for the lead, 2026-11-08). +0.3 to start; +0.1 before the fore staysail was corrected from its working 93 m2.
  clr_x_m: -0.6
  # 1,100 sq ft to the false keel's bottom, keel, gripe and post counted and the rudder not (measured, +-5%: Neuf §2.6; D29 (b)); 97 m2 on the faint line and 105 with the rudder.
  lateral_area_m2: 102.0
  # D24 (a): the topsail schooner's 11.5 (on Lynx's hull, the same type) carried by the root of the waterlines, 107.3 to 85 ft; kept at her tuning, her best in a strong breeze inside her accounts' band across the whole of 12.5-13.9 (Neuf-D §9: 12.5 a little under the brig's carried by her length, 13.9 the 1.34 root-length rule the schooner's note calls too generous; judgement on both bounds; docs/dev/TuningNotes.md).
  hull_speed_kn: 12.9
  # Her flush deck at side at mid-length, 3.8 ft above her line (measured, +-0.3 ft: Neuf §2.7), Build-Ships.md §5.5's rule for a new file; 'a flush deck fore and aft' (Cobb 1841 p. 38, read), so that D18's options give one datum (Neuf-D §2.2). Cobb's 'trunk of the quarter deck' (p. 103) is read as a cabin trunk aft, not a deck (judgement), and is not in the profile.
  deck_height_m: 1.16
  # The blade below her line, 28.1 sq ft, its span 11.7 ft to the heel (measured, Neuf §2.6; ZAZ6179's dashed blade 11.9 ft); the angle and the rate the topsail schooner's (judgement: no source gives them).
