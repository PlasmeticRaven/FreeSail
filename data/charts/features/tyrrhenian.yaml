    source: 'Michelot 1715, p. 78: men of war and large ships anchor farther out, to the S.S.E. of the lanthorn about a mile off, in 30 and 35 fathom; Purdy 1826, p. 110: ships of war generally lie about a mile to the southward of the light-house in 30 or 35 fathoms; p. 110, Mr Smith 1818: the best anchoring-marks are Fort St. Elmo on, or a little open to the westward of, the light-house on the mole-head, and Posilipo point a sail''s breadth or two open to the southward of Castle dell'' Ovo, in from 18 to 14 fathoms, mud and clay; p. 111, a British officer 1817: Posilipo nearly in one with Castle Ovo and the light-house N.W. or N.W. by N., in 10 or 11 fathoms, half a mile from the mole-head, good holding ground; Derrotero 1849, p. 85: the true anchorage is S.S.E. of the light less than a mile off; L''Abeille anchored in 16 fathoms, fine sand; Smyth 1854, p. 178: the tide-hour at Naples given as 11h 20m, though the rise is but a foot or two; the depth taken between Smith''s and the Derrotero''s'
    says: 'The road of Naples, St. Elmo on with the lantern and Posilipo open south of the Castle dell'' Ovo, in 14 to 18 fathoms, mud and clay; open to the south-west, which sends in a great swell.'

