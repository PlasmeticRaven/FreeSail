# The features of the Tyrrhenian's block (package 79d, the region `tyrrhenian`;
# docs/dev/ChartBlocks.md): Sardinia south of 40.99 N (the west coast from Capo Caccia and
# Alghero, Oristano, San Pietro, the gulf of Palmas where Nelson's fleet watered in 1805,
# Cagliari, and the east coast from Tavolara), the Roman coast from Monte Argentario by
# Civita Vecchia and the Tiber to Gaeta, the Pontine islands, the bay of Naples with
# Ischia, Procida and Capri, and south to Cape Palinuro. North of 40.99 N and west of
# 11.15 E is the region `ligurian-sea`'s (the Maddalena, Corsica, Elba). The form and the
# rules are channel-west.yaml's (its head). The sources, in the references' form
# (docs/references/README.md; the texts under docs/references/pilots/, package 79c's
# research pass):
#
#   Michelot 1709, 1715   the Portulan and its English: the Roman coast, Gaeta and Naples
#                   (his survey of the gulf of Naples made in 1701, 1709 p. 113), the
#                   fanals of the period.
#   Smyth 1828      Sketch of the Present State of the Island of Sardinia: his survey of
#                   1823 to 1824, Sardinia's coasts, Cagliari, Alghero, San Pietro.
#   Purdy 1826      sections VII (Sardinia) and VIII (Italy), with the remarks of 1817 and
#                   1818; Norie 1831; Purdy 1840's Pharonology; Lamberti 1844; the
#                   Derrotero 1849; Smyth 1854 (the table of positions, the heights; p. 178
#                   the tides).
#   Admiralty 1913, 1916   vols. I (ch. IX, Sardinia) and II (Italy): MODERN, for heights,
#                   depths and banks only.
#   James 1837      vol. 3, pp. 338 to 340: Nelson's fleet at Pula and in the gulf of Palmas,
#                   February to April 1805; vol. 4, p. 121: the Anglo-Russian landing at
#                   Naples in November 1805.
#
# Positions in the modern frame, checked against this block's tiles by the channel-west
# rule (a scratch script outside the repository), every move in `fix`. **Islets the grid
# lacks** (the Toro, Cavoli, the Catalano rock, La Botte, Santo Stefano of Ventotene, Li
# Galli) are rocks of their height and extent; the Formiche of Vivara and the banks of
# Licosa are left at the pilots' positions. **The lights of 1805**: Civita Vecchia's and
# Anzio's fanals (Michelot 1709, the earliest record read) and Naples' Lanterna on the mole
# (`from` 1701, Michelot's survey of the gulf: the earliest record read, the tower older,
# UNVERIFIED). Not yet: Fiumicino's on the Clementine tower (1825, Norie 1831's notice, its
# year an OCR's, UNVERIFIED) and Gaeta's (1831, Norie's first record, UNVERIFIED); no light
# on Sardinia in 1805 (Smyth 1828 found Cape St Elias' tower used only for signals and San
# Pietro's column never lit). Vesuvius burns: the pilots' "a light by night and smoke by
# day" in its `says`.
#
# Not here: Sicily, the Lipari islands and the Strait of Messina, a later block; the
# Adriatic's shore in the block's north-east tiles (Ortona and Pescara), a later block's;
# Porto Santo Stefano and Giannutri (11.10 to 11.12 E, north of 40.99 N) lie in
# `ligurian-sea`'s tiles and in neither features file (a later pass).

region: tyrrhenian
features:

  # ---------------------------------------------------------------------------
  # Sardinia's west and south: Capo Caccia, Porto Conte and Alghero (the harbour patch alghero), Bosa and Oristano, San Pietro and Sant'Antioco, the gulf of Palmas, Teulada and Spartivento, and Cagliari (the harbour patch cagliari) with Cape Carbonara
  # ---------------------------------------------------------------------------

  - id: cape-falcone
    kind: headland
    name: Cape Falcone
    modern: Capo del Falcone
    lat_deg: 40.9699
    lon_deg: 8.2043
    height_m: 190
    fix: moved 106 m to the grid's land (the first placing read 18 m of water)
    source: 'Purdy 1826, p. 83: Cape Falcone, the N.W. end of Sardinia, has a watch-tower on it, and the ground about it is shoal and rocky; between Asinara and the cape two passages formed by the little isles Piana and Pelosa, fit for small craft only; Smyth 1828, p. 272: Cape Falcon is the northern extreme of the Nurra, one tower on the highest summit and a second on the isolated rock of Pelosa at its base, a narrow shallow strait lined with sharp rocks between the cape and Asinara; Derrotero 1849, OCR l. 9527 to 9533: the Pasa Grande, south of Piana, fit only for vessels drawing under 10 feet; Smyth 1854, p. 439: Capo del Falcone, tower, 610 feet; Admiralty 1913, p. 706: tower on its highest summit 633 feet above the sea (height from these)'
    says: 'Cape Falcone, the north-west end of Sardinia, high with a watch-tower on its summit; the sound inside it to Asinara is shoal and rocky, fit for small craft only.'

  - id: porto-torres
    kind: town
    name: Porto Torres
    modern: Porto Torres
    lat_deg: 40.838
    lon_deg: 8.401
    height_m: 20
    source: 'Smyth 1828, p. 263: Porto Torres is a small haven of two moles, defended by a stout octagon tower, capable of holding a few small vessels; those of large size lie in the road nearly a mile outside, where the anchorage is pretty good; height JUDGEMENT (the tower and the town above the port)'
    says: 'Porto Torres, a small haven of two moles with a stout octagon tower, the port of Sassari; large ships ride in the road near a mile outside.'

  - id: cape-caccia
    kind: headland
    name: Cape Caccia
    modern: Capo Caccia
    lat_deg: 40.5606
    lon_deg: 8.1654
    height_m: 186
    fix: moved 15 m to the grid's land (the first placing read 1 m of water)
    source: 'Smyth 1828, p. 275: the cliffs of Monte Ghiscera terminate at Capo Caccia, a noble headland upwards of 500 feet in height; ships may round this cape at any distance, it being very bold; Purdy 1826, p. 83: from Cape dell'' Argentara to Cape Caccia S. by W. 9 miles, thence to the cape of Porto Conte 4 1/2 miles; Derrotero 1849, OCR l. 9578 to 9585: high land cut vertically to the sea, a white cliff crowned with sharp pinnacles with a watch-tower on the highest, all this coast extremely clean; Smyth 1854, p. 439: summit 575 feet; Admiralty 1913, p. 705: 610 feet (height)'
    says: 'Cape Caccia, a noble white cliffy headland crowned with peaks and a watch-tower, very bold-to; Porto Conte opens close within it to the eastward.'

  - id: porto-conte
    kind: anchorage
    name: Porto Conte
    modern: Porto Conte
    lat_deg: 40.591
    lon_deg: 8.196
    height_m: 0
    depth_fathoms: 8
    bottom: 'weed and ooze; further in, sand and shells over muddy clay'
    source: 'Smyth 1828, p. 275: the excellent harbour of Porto Conte, though exposed to the S.W. winds, is perfectly safe for frigates by bringing up in from six to ten fathoms; smaller vessels find better shelter N.E. of the Torre Nuova in three or four fathoms, on a bottom of sand and shells over muddy clay; water from pools and wells at the head; p. 277: the bottom in-shore bristled with nacres, dangerous to hempen cables; Derrotero 1849, OCR l. 9642 to 9646: large ships should not pass the tower of the anchorage but anchor E. and W. with it a few cables off in 6, 8 or 10 brazas, weed and ooze (yerbas y lama); Purdy 1826, p. 83: the entrance a mile and a quarter broad, the depths decreasing from 15 to 4 fathoms, sheltered from every wind'
    says: 'Porto Conte, a fine harbour within Cape Caccia; frigates bring up abreast the Torre Nuova in seven to ten fathoms, weed and ooze, safe save from the south-west.'

  - id: monte-doglia
    kind: hill
    name: Monte d'Oglio
    modern: Monte Doglia
    lat_deg: 40.604
    lon_deg: 8.223
    height_m: 437
    source: 'Smyth 1828, p. 277: Monte d''Oglio is conical and nearly 1400 feet high, under it a rivulet from which water for shipping is obtained; Smyth 1854, p. 439: Monte d''Oglia, summit 1398, a mark for Alghero; Admiralty 1913, p. 704: Monte Doglia 1,480 feet; height from the modern chart (437 m), position JUDGEMENT from the modern chart'
    says: 'Monte d''Oglio, a conical hill between Porto Conte and the road of Alghero, the mark for Alghero from the offing.'

  - id: alghero
    kind: town
    name: Alghero
    modern: Alghero
    lat_deg: 40.5578
    lon_deg: 8.3125
    height_m: 20
    source: 'Smyth 1828, p. 281: the town is built on a low rocky point jutting out from a sandy beach, a parallelogram with stout walls flanked by bastions and towers, entered by two gates, one at the mole and landing-place on the north; commanded by two neighbouring heights; p. 282: twelve churches and convents, 6700 souls; water from cisterns within the walls and fountains outside; Smyth 1854, p. 439: Alghero, torre Sperone; Purdy 1826, p. 83: the town of Alghero, or Algher, east of Cape Galera; height JUDGEMENT (the walls and steeples)'
    says: 'Alghero, a walled Catalan town on a low rocky point with bastions and towers, its landing-place and little mole on the north side.'

  - id: alghero-road
    kind: anchorage
    name: the road of Alghero
    modern: Rada di Alghero
    lat_deg: 40.574
    lon_deg: 8.293
    height_m: 0
    depth_fathoms: 10
    bottom: 'good holding ground, weed and sand'
    source: 'Smyth 1828, p. 280: the approach to Alghero is shallow some distance out, the outer extreme of the shoal water marked by Maddalena, a little rock with a ruined chapel N.W. of the town; to the S.W. of it tolerable summer anchorage in from ten to fifteen fathoms, good holding ground, seldom used by cruizers; Purdy 1826, p. 83: vessels may anchor off Alghero in 8 or 10 fathoms, but quite exposed to the West and S.W. winds; Norie 1831, OCR l. 7185 to 7188: anchorage in 7 to 10 fathoms east of the island within the bay, or before Alghero in 10 fathoms exposed to S. and S.W. winds; Admiralty 1913, p. 705: good holding ground about 1 1/2 miles N.W. of the town in 8 to 10 fathoms, a summer anchorage; small vessels over weeds and sand off Torre Galera (the bottom)'
    says: 'The road of Alghero, a summer berth in ten fathoms, good holding ground, outside the Maddalena rock; open to all winds from the westward.'

  - id: cape-marargiu
    kind: headland
    name: Cape Marargiu
    modern: Capo Marargiu
    lat_deg: 40.3367
    lon_deg: 8.3818
    height_m: 100
    fix: moved 899 m to the grid's land (the first placing lay off the cape)
    source: 'Smyth 1828, p. 286: to Cape Marargiu the coast is steep and tabled, rising towards the summits of Mount Minerva; off Marargiu an islet of moderate height; Purdy 1826, p. 83: Cape Maraggio lies 10 miles southward of Alghero; Derrotero 1849, OCR l. 9660 to 9663: a cape jutting W.S.W. from very high lands, descending in a gentle and unequal slope, with a tower on its N.E. part; Admiralty 1913, p. 703: an islet outside the cape, a rocky shoal of 2 1/2 fathoms a third of a mile W.S.W.; the land rising to 2,556 feet behind; height of the point JUDGEMENT'
    says: 'Cape Marargiu, a steep tabled point under high mountains, an islet off it; give it a good berth for a shoal close outside.'

  - id: bosa
    kind: town
    name: Bosa
    modern: Bosa
    lat_deg: 40.2985
    lon_deg: 8.498
    height_m: 80
    source: 'Smyth 1828, pp. 286 to 287: Bosa in a fine valley between two tabled hills, on the northern bank of the Termo; opposite the mouth the islet of Rossa, fortified with a well-constructed round tower; small vessels lie in tolerable security between the islet and the shore, boats inside the river; its churches very imposing from the offing; p. 288: on a hill above the town the walls and two square towers of the old castle; Purdy 1826, p. 83: the fortified town of Bosa a mile from the sea; you may anchor within the island before the mouth of the river; Norie 1831, OCR l. 7189 to 7191: you may anchor before Bosa in 8 or 7 fathoms; height JUDGEMENT (the castle on the hill over the town)'
    says: 'Bosa, a little walled town up the river Termo with its old castle on the hill above; small craft lie inside the islet of Rossa and its round tower at the river''s mouth.'

  - id: cape-mannu
    kind: headland
    name: Cape Mannu
    modern: Capo Mannu
    lat_deg: 40.034
    lon_deg: 8.3775
    height_m: 50
    fix: moved 45 m to the grid's land (the first placing read 4 m of water)
    source: 'Smyth 1828, pp. 291 to 292: Cape Mannu forms the south extreme of the gulf of Bosa; its white round tower stands on a tabled cliff of moderate height which declines to the eastward, so as to give the cape the appearance of a gunner''s quoin; north of it the islet of Pelosa; Purdy 1826, p. 84: Cape Mannu 14 miles S.S.W. of the isle of Bosa, a watch-tower on it; Isola del Peloso a low isle surrounded by a shoal of sand and rocks; height JUDGEMENT from the moderate cliff'
    says: 'Cape Mannu, a low tabled cape like a gunner''s quoin with a white round tower, the southern point of the gulf of Bosa.'

  - id: mal-di-ventre
    kind: island
    name: Mal di Ventre
    modern: Isola di Mal di Ventre
    lat_deg: 39.9895
    lon_deg: 8.303
    height_m: 18
    extent_m: 900
    source: 'Smyth 1828, pp. 292 to 293: Mal di ventre is triangular and flat, and shelves out to the N.E. and S.W.; it and Coscia di donna lie about six miles apart and four or five from the coast; the channel between them perfectly safe for the largest ships, keeping a little more than half way towards Mal-di-ventre; nor is there any danger from the isles to the main; Purdy 1826, p. 84: Mal di Ventre a league westward of Cape Mannu, surrounded by a shoal of sand and rocks, a channel of 10 to 7 fathoms between it and the cape; Derrotero 1849, OCR l. 9690 to 9699: a chain of low islands and rocks, very dangerous by night; height from the modern chart'
    says: 'Mal di Ventre, a low flat island shelving out north-east and south-west, four or five miles off the coast north of Oristano; a dangerous low land by night.'

  - id: catalano-rock
    kind: rock
    name: Coscia di Donna
    modern: Scoglio del Catalano
    lat_deg: 39.877
    lon_deg: 8.297
    height_m: 9
    extent_m: 100
    fix: 'an islet the grid lacks (water in EMODnet''s grid, ChartBlocks.md ''An isle the grid lacks''): given as a rock of its height and an extent of its size, so that a ship cannot sail through it'
    source: 'Smyth 1828, p. 292: Coscia di donna is a small black rock with deep water close to it, except a reef at the N.N.E. end; Smyth 1854, p. 439: Coscia di donna (Catalano); Purdy 1826, p. 84: Coscia di Donna 2 1/2 miles S.W. of the south end of Mal di Ventre, surrounded in a similar manner, a channel of 6 and 7 fathoms between (Purdy and the Derrotero, OCR l. 9693 to 9699, note that the two names are often exchanged on the charts); height JUDGEMENT'
    says: 'Coscia di Donna, a small black rock with deep water about it save a reef at its north-north-east end, outermost of the Mal di Ventre chain.'

  - id: cape-san-marco
    kind: headland
    name: Cape St. Marco
    modern: Capo San Marco
    lat_deg: 39.859
    lon_deg: 8.4357
    height_m: 51
    fix: moved 240 m to the grid's land (the first placing read 11 m of water)
    source: 'Smyth 1828, p. 292: Cape San Marco, a tongue of land with a well placed tower on a conical hill, and another on its eastern side; p. 293: reefs tailing out a little off each point; Purdy 1826, p. 84: the Cape and Tower of St. Marco on the north side of the entrance of Oristano Bay, a reef to the south of the tower; Derrotero 1849, OCR l. 9685 to 9688: two towers on the cape, rocks and a shoal stretching almost a mile to the S.; height JUDGEMENT from the modern chart (the conical hill)'
    says: 'Cape St. Marco, a low tongue of land with a tower on a conical hill, the northern point of Oristano bay; a reef runs off it to the southward.'

  - id: oristano-road
    kind: anchorage
    name: 'the road of Oristano, within Cape Frasca'
    modern: 'Golfo di Oristano, east of Capo Frasca'
    lat_deg: 39.775
    lon_deg: 8.485
    height_m: 0
    depth_fathoms: 7
    bottom: 'ooze, very good holding ground'
    source: 'Derrotero 1849, OCR l. 9774 to 9786: the third anchorage, called la Rada, east of Cape Frasca, the most convenient for getting under way; ten brazas a little off the coast; this magnificent road, able to take the largest squadron, has everywhere an excellent bottom of ooze (lama) of very good holding; keep a quarter mile from the north point of the cape for a shoal of two feet, and avoid a 3-braza shoal 1 1/2 miles S.E. of it; Smyth 1828, p. 293: the extensive bay of Oristano, excellent anchorage during the shore winds, but a great sea with the westerly ones; two or three vessels may lie securely in six or seven fathoms by rounding San Marco, or, running from a southerly gale, by standing inside La Frasca to a similar depth; Purdy 1826, p. 84: the largest and best bay on the western coast of Sardinia, a commodious rendezvous for a fleet, soundings in the centre 6, 5, 4 and 3 fathoms'
    says: 'The road of Oristano within Cape Frasca, room for a fleet in seven fathoms, ooze and good holding; open to the westerly winds, which raise a great sea and surf.'

  - id: cape-frasca
    kind: headland
    name: Cape la Frasca
    modern: Capo Frasca
    lat_deg: 39.768
    lon_deg: 8.453
    height_m: 85
    source: 'Smyth 1828, p. 299: Cape la Frasca is a long flat point, of moderate height, falling abruptly on the northern side; Derrotero 1849, OCR l. 9727 to 9736: the cape called de Napoli, commonly de la Frasca, not very high but cut steep at its base, of a blackish colour with a watch-tower; very clean, and to be borrowed on rather than San Marcos; Purdy 1826, p. 84: Cape Frasca the south point of Oristano Bay, two leagues from St. Marco with 10 to 15 fathoms between; height JUDGEMENT from the modern chart (the tableland of the cape)'
    says: 'Cape la Frasca, a long flat dark point of moderate height, steep-to on its north side; the southern point of Oristano bay, to be borrowed on going in.'

  - id: monte-arcuentu
    kind: hill
    name: the Finger of Oristano
    modern: Monte Arcuentu
    lat_deg: 39.5917
    lon_deg: 8.5583
    height_m: 785
    source: 'Smyth 1828, pp. 301 to 302: the rugged ridges of Arcuentu, the peak of which is 2315 feet above the sea, being a distinguishing sea-mark, is called the finger of Oristano; p. 292: the pinnacle called Finger-hill by seamen, a remarkable object seen from afar; Derrotero 1849, OCR l. 9798 to 9810: a very high arid mountain whose peak, the Dedo or Pulgar de Oristan, may be seen 15 or 20 leagues off; steering for it one makes the land near Oristano; Smyth 1854, p. 439: M. Arcuentu, the mark, the finger of Oristano, 2315; height from the modern chart'
    says: 'The Finger of Oristano, a lofty peak seen fifteen or twenty leagues off; steer for it to make the gulf of Oristano, minding Mal di Ventre.'

  - id: monte-linas
    kind: hill
    name: Monte Linas
    modern: Monte Linas (Punta Perda de sa Mesa)
    lat_deg: 39.445
    lon_deg: 8.635
    height_m: 1236
    source: 'Smyth 1854, p. 439: from Cape Pecora a bearing to M. Linas, 4000 feet; Smyth 1828, p. 302: the coast from Cape Pecora along the mountains of Arbus and Monte Ferru to Porto Paglia; Purdy 1826, p. 84: from Cape Pecora to Cape Altano all the land is very high, with irregular mountains, no shelter from westerly winds; height and position from the modern chart'
    says: 'Monte Linas, the highest of the high irregular mountains of the Iglesiente behind Cape Pecora; no shelter under that coast from westerly winds.'

  - id: san-pietro-island
    kind: island
    name: the island of St. Pietro
    modern: Isola di San Pietro
    lat_deg: 39.145
    lon_deg: 8.28
    height_m: 211
    source: 'Smyth 1828, p. 307: San Pietro is of a triangular shape, eighteen or twenty miles in circuit, higher on the north side than on the south; p. 313: off the west point lies the Gallo rock, about thirty feet high; Purdy 1826, p. 84: St. Pietro two leagues long N. and S., about 4 miles broad, the western side high; Smyth 1854, p. 439: the north summit, Guardia dei Mori, 680 feet; height from the modern chart'
    says: 'The island of St. Pietro, three-cornered and high on its north and west sides, with the town of Carloforte on its eastern shore.'

  - id: carloforte
    kind: town
    name: Carloforte
    modern: Carloforte
    lat_deg: 39.145
    lon_deg: 8.306
    height_m: 25
    source: 'Smyth 1828, p. 308: a town and castle built on the shores of a small bay on the east side of San Pietro, named Carloforte; the tower redoubt of Vittorio at the Spalmatore mounting eight guns on its parapet, with a small column on the summit intended to bear a light but not hitherto used; p. 307: the colony from Tabarca in 1737; water at wells between Spalmatore point and Vittorio tower; Purdy 1826, p. 84: a town on the eastern side, several salt-pits; height JUDGEMENT'
    says: 'Carloforte, the little walled town of the Tabarchine fishers on the east side of St. Pietro, its castle above and the Vittorio redoubt by the shore; no light shown.'

  - id: carloforte-road
    kind: anchorage
    name: the road of St. Pietro
    modern: 'Canale di San Pietro, off Carloforte'
    lat_deg: 39.138
    lon_deg: 8.3198
    height_m: 0
    depth_fathoms: 6
    bottom: weed
    fix: moved 15 m to water of 6 m (the first placing read 5.4 m)
    source: 'Smyth 1828, p. 306: San Pietro with the coast of Sant''Antioco forms a spacious harbour, secure in every wind; a stranger may easily enter by the southern channel and anchor in six or seven fathoms between Sant''Antioco and Carloforte, where I rode out two very severe gales from the N.W. in perfectly smooth water; coming from the northward borrow on Piana to avoid the Secca de'' Marmi in mid-channel; Derrotero 1849, OCR l. 9870 to 9889: the anchorage before the town in 6 or 7 brazas, weed; Lamberti 1844, p. 332: anchor in five and six braccia, weedy bottom (fondo erboso), keeping the Toro open of Sant''Antioco going in; Purdy 1826, p. 84: depths in the road from 4 to 5 and 6 fathoms'
    says: 'The road of St. Pietro off Carloforte, six fathoms, weedy ground, smooth water in any wind; come in by the southern channel, keeping the Toro open of Sant''Antioco.'

  - id: sant-antioco-island
    kind: island
    name: the island of St. Antioco
    modern: Isola di Sant'Antioco
    lat_deg: 39.03
    lon_deg: 8.4
    height_m: 271
    source: 'Smyth 1828, pp. 314 to 316: Sant''Antioco, almost twenty-six miles in circuit, diversified with hills and valleys; the western coast rocky and iron-bound with a bold approach, 12 to 16 fathoms two furlongs off; the town of Sant''Antioco with 1800 inhabitants and an old castle on its highest part, joined to the main by a rough stone bridge of 300 yards; Purdy 1826, p. 84: 10 miles long N. and S., forming the western side of the Gulf of Palma; height from the modern chart'
    says: 'The island of St. Antioco, hilly and iron-bound on its west side, joined to the main by a causeway; the gulf of Palmas lies within its eastern shore.'

  - id: vacca-islet
    kind: island
    name: the Vacca
    modern: Isola la Vacca
    lat_deg: 38.937
    lon_deg: 8.448
    height_m: 93
    source: 'Smyth 1828, p. 315: the S.W. point of Sant''Antioco, Sperone, forms a channel with the quoin-shaped islet of Vacca and the lower one of Vitelli, 13 to 20 fathoms, clear but for three rocks fifteen feet under water half a mile S. 24 W. of Cannai tower; Purdy 1826, pp. 84 to 85: off Point Speroni a large rock or islet named La Vacca; between it and the point two rocks with not more than 3 feet over them; Vacca may be approached on the south side to a cable''s length in 17 or 18 fathoms; James 1837 vol. 3, p. 338: on 10 March 1805 the Victory and a few ships passed between the island of Vache and the main, the rest of the fleet outside it; Admiralty 1913, p. 685: 305 feet (height), position after its lat. 38 56 N., long. 8 27 E.'
    says: 'The Vacca, a steep quoin-shaped islet off Point Sperone; the channel inside it serves, borrowing on the islet, for rocks lie off the point.'

  - id: toro-islet
    kind: rock
    name: the Toro
    modern: Isola il Toro
    lat_deg: 38.86
    lon_deg: 8.41
    height_m: 113
    extent_m: 200
    fix: 'an islet the grid lacks (water in EMODnet''s grid, ChartBlocks.md ''An isle the grid lacks''): given as a rock of its height and an extent of its size, so that a ship cannot sail through it'
    source: 'Smyth 1828, p. 315: S.S.W. from Vacca nearly five miles, across a clear channel of thirty or forty fathoms, is Toro rock, a bold object that marks this part of the coast from seaward, five or six hundred feet high; latitude 38 51 58 N.; Derrotero 1849, OCR l. 9905 to 9908: an enormous isolated steep rock that may be passed very close, a very good mark for these parts; Purdy 1826, p. 85: a sunken rock on which the cutter Fox struck lies between 4 and 5 leagues south of the Toro; Admiralty 1913, p. 685: 364 feet, seen 15 to 20 miles (height)'
    says: 'The Toro, a bold steep rock standing alone some five miles south of the Vacca, the mark for the gulf of Palmas from seaward; pass it as close as you please.'

