# The features of Biscay south and Galicia, the Gironde to the Minho (spec M6 §26, the
# blocks' item 3; package 39c): hazards, marks, lights with their dates, places,
# anchorages and bottom notes, in the period's words, each with its source in the
# references' form (docs/references/README.md), on the rules of channel-west.yaml's head,
# read from:
#
#   Tofiño 1789     Vicente Tofiño de San Miguel, Derrotero de las costas de España en el
#                   Océano Atlántico, y de las Islas Azores ó Terceras (Madrid 1789), the
#                   Atlantic volume of the Derrotero, its pages headed 'Tom. II'; the
#                   OCR text of the Universidad de Sevilla's copy (Internet Archive
#                   A302201, public domain mark), checked against the Bayerische
#                   Staatsbibliothek's (bub_gb_04Yq4fsvB8gC). 'Descripción de la costa
#                   comprehendida desde Cabo Prior hasta la embocadura del río Miño',
#                   pp. 1 to 73; 'Derrotero de las costas de España en el Océano
#                   Cantábrico y golfo de Gascuña', from the river of Bayonne to Cabo
#                   Prior, pp. 131 to 189. His soundings are brazas of two varas
#                   castellanas (1.672 m: the vara of Burgos 0.8359 m, unverified here,
#                   the encyclopaedia's figure from memory) at low water of spring tides,
#                   and his heights of tide pies de Burgos (a third of the vara); an
#                   anchorage's `depth_fathoms` is his brazas turned to English fathoms
#                   (x 0.914) and rounded to the half, and his figure is in the source.
#                   His longitudes are from the meridian of Cadiz, and are not used: the
#                   positions are the modern chart's.
#   Tofiño 1789,    Atlas Marítimo de España (the Universidad de Sevilla's copy, Internet
#   Atlas           Archive A062039040, public domain mark), the plans of Ferrol (1789)
#                   and Santander (1788), read at full resolution (some 7,500 by 5,000
#                   pixels) through the archive's IIIF server: the names and the
#                   soundings the Derrotero's pages refer to.
#   Faden 1793      Le Petit Neptune Français; or, French Coasting Pilot (Internet Archive
#                   lepetitneptunefr00fade), the OCR text: Magin's 'Sailing Instructions
#                   for the Entrance of the Gironde, or River of Bourdeaux', pp. 84 to 88
#                   (the Tower of Cordouan's footnote, p. 85); 'Coast of Arcasson',
#                   'Bassin d'Arcasson', 'Bayonne' and 'St. Jean de Luz', pp. 89 to 92;
#                   'Tides and Currents', p. 93. In his translation's fathoms and leagues.
#   Lighthouse      the Lighthouse Directory (R. Rowlett, University of North Carolina
#   Directory       at Chapel Hill, ibiblio.org/lighthouse), its pages for Spain's Basque
#                   Country, Cantabria, Asturias and Galicia and France's Aquitaine, read
#                   2026-10-10: the lights' years (the encyclopaedias refused the build
#                   network for its rate); the lights of the 1830s to 1860s carry the
#                   year they were first lit so that 1805 does not see them.
#
# The block's bounds are 42.0 to 45.9 N and 9.33 to 0.9 W: Pointe de la Coubre and the
# Pertuis de Maumusson (45.7 to 45.8 N) are the block's marks though their water lies on
# biscay-north's southern row of tiles (the seam rule keeps the tiles theirs; the chart
# reads the finest tile there is). The Minho's mouth, Mount Santa Tecla and La Guardia
# (41.87 to 41.9 N) are the Portuguese block's (package 39d), south of 42 N.
#
# Positions are in the modern frame (WGS 84, the EMODnet DTM 2024 grid the tiles are cut
# from): first placed from the modern chart as each entry names it, then checked against
# the block's tiles and EMODnet's shoalest sounding by channel-west.yaml's rule (a
# headland, island, town, castle, church, mill, tower to the nearest land within 800 m; a
# light to the nearest land within 400 m; a rock or ledge to the nearest shoal head within
# 400 m; an anchorage to water holding half the pilot's depth within 800 m); where a
# position rests on the pilot's bearing and distance alone the entry says so in `fix`.
# Heights are above the sea for the horizon: JUDGEMENT throughout, from the grid's own
# land about the mark and the pilot's words ("muy alta", "de mediana altura"), but for
# Cordouan's (Faden's 175 French feet, the lanthorn included).
#
# The lights of 1805: the Tower of Cordouan (a fire of coals every night, Faden p. 85), the
# Tower of Hercules at Corunna ("un pequeño farol que sirve de linterna", Tofiño p. 10)
# and the lanthorn of St Sebastian on Mount Igueldo (seen seven or eight leagues by night,
# Tofiño pp. 149 to 150) were lit; the Derrotero names no other Spanish light on this
# coast. The lights of the nineteenth century (Finisterre, Villano, Cape Mayor,
# Machichaco, Peñas and the rest) are dated out where their year was read.
#
# The lead reviews this list against the sources before the merge: the citation is on
# every line for that.

region: biscay-south
features:

  # ---------------------------------------------------------------------------
  # The Gironde: Point la Coubre, Cordouan and the roads of Royan and Verdon
  # ---------------------------------------------------------------------------

  - id: coubre-point
    kind: headland
    name: Point la Coubre
    modern: Pointe de la Coubre
    lat_deg: 45.6955
    lon_deg: -1.2330
    height_m: 15
    source: "Faden 1793, 'Entrance of the Gironde', pp. 84 to 85: from Oleron or the entrance of Maumusson to Point La Coubre keep off at sea, because of several points of banks stretching off from Oleron; the banks of Point La Coubre on the north side of the Channel of Charentais"
    says: "Point la Coubre, the low northern point of the river of Bourdeaux, with its banks and breakers off it."

  - id: coubre-wooden-tower
    kind: beacon
    name: the Wooden Tower on Point la Coubre
    modern: the sea mark of 1700s on Pointe de la Coubre (gone; the modern light stands near)
    lat_deg: 45.6940
    lon_deg: -1.2300
    height_m: 20
    source: "Faden 1793, 'To enter by the Channel of Charentais', p. 85: the Tower of Cordouan and the Wooden Tower on Point la Coubre are necessarily to be seen; sail toward Cordouan S by E till you bring the Wooden Tower to bear east; p. 86: the two beacons, or marks, on Point La Coubre"
    says: "The Wooden Tower on Point la Coubre, the mark for the northern channels of the Gironde."

  - id: maumusson
    kind: place
    name: the Pertuis de Maumusson
    modern: the Pertuis de Maumusson, between Oléron and the coast of Arvert
    lat_deg: 45.7980
    lon_deg: -1.2350
    height_m: 0
    source: "Faden 1793, 'Entrance of the Gironde', pp. 83 to 84: to pass through Maumusson it is necessary to have a pilot; the banks change very often; between the point of Maumusson and the end of Oleron are several banks"
    says: "The Pertuis de Maumusson between Oleron and the coast of Arvert, its banks changing often: no passage without a pilot."
    fix: "placed in the pass's water between Oleron's south end and the coast of Arvert"

  - id: st-palais-steeple
    kind: church
    name: the steeple of St Palais
    modern: the church of Saint-Palais-sur-Mer
    lat_deg: 45.6440
    lon_deg: -1.0890
    height_m: 25
    source: "Faden 1793, 'The Channel of Lescameau', p. 87: the Steeple of St. Palais on with the beacon, or a sail's breadth open with the Wood; 'Channel des Graves', p. 88: the Castle of St. Palais"
    says: "The steeple of St Palais, which brought on with the beacon leads in by the channel of Lescameau."

  - id: royan
    kind: town
    name: Royan
    modern: Royan
    lat_deg: 45.6235
    lon_deg: -1.0290
    height_m: 20
    source: "Faden 1793, 'Entrance of the Gironde', pp. 85 to 88: all that part of the river beyond the English Bar, from Point Terre Negre to Royan, is clean, with deep water; Royan and its windmills a mark of the Channel des Graves; St. Peter's Church of Royan on with the Point a mark of the anchorage"
    says: "Royan on the north shore of the river's mouth, its windmills and St Peter's church the marks of the road."

  - id: royan-road
    kind: anchorage
    name: the road of Royan
    modern: the anchorage off Royan in the Gironde's mouth
    lat_deg: 45.6150
    lon_deg: -1.0450
    height_m: 0
    bottom: "sand and mud"
    source: "Faden 1793, 'Channel des Graves', p. 88: when ships have sailed beyond Grave Point they generally come to an anchor in the road of Verdon, or in that of Royan; St. Peter's Church of Royan on with the Point, or Meche's Windmills E by N; the ground judgement (the river's)"
    says: "The road of Royan, where a ship lies within Grave Point for the tide and the river's pilot."

  - id: grave-point
    kind: headland
    name: Grave Point
    modern: Pointe de Grave
    lat_deg: 45.5714
    lon_deg: -1.0650
    height_m: 8
    source: "Faden 1793, 'The Channel of La Porte' and 'Channel des Graves', pp. 87 to 88: steer to the east, giving to Point Grave a sufficient birth to double it; take a greater offing to round Grave Point with greater safety"
    says: "Grave Point, the low southern point of the river's mouth, to be given a good berth in rounding it."
    fix: "moved 90 m to the grid's land at the point"

  - id: verdon-road
    kind: anchorage
    name: the road of Verdon
    modern: the anchorage of Le Verdon within the Pointe de Grave
    lat_deg: 45.5520
    lon_deg: -1.0480
    height_m: 0
    bottom: "sand and mud"
    source: "Faden 1793, 'Channel des Graves', p. 88: they generally come to an anchor in the road of Verdon; the marks for the best anchoring ground St. George's Windmills on with the middle of the two sand-downs called Terrier de l'Attache; when you set sail from the road of Verdon to go to Bourdeaux you steer towards Meche's Windmills SE by E; the ground judgement"
    says: "The road of Verdon within Grave Point, where ships for Bourdeaux wait for the tide and their pilot."

  - id: soulac-church
    kind: church
    name: the church of Soulac
    modern: Notre-Dame-de-la-fin-des-Terres, Soulac-sur-Mer
    lat_deg: 45.5130
    lon_deg: -1.1250
    height_m: 25
    source: "Faden 1793, 'Channel des Graves', pp. 87 to 88: the Church of Soulac on with the beacon; shape your course toward the Church or the Windmill of Soulac between ESE and E by S"
    says: "The church of Soulac in its sand-hills, which brought on with the beacon leads in by the Channel des Graves."

  - id: cordouan-light
    kind: light
    name: the Tower of Cordouan
    modern: the Phare de Cordouan
    lat_deg: 45.5863
    lon_deg: -1.1736
    height_m: 60
    lit: {from: 1611, until: null, range_nm: 18, character: "a light of lamps and reflectors on the high conical tower raised by 1788 (before it, a fire of coals in the lanthorn of 1727)"}
    source: "Faden 1793, 'Entrance of the Gironde', p. 85 and its footnote: the entrance of the River of Bourdeaux is easily known by a fine light-house, commonly called Tower of Cordouan, of the greatest utility in lighting ships during the night; begun in 1584 by Louis de Foix and finished in 1611; an iron lanthorn in 1727; a fire of 225 pounds of coals lighted every night; the Lighthouse Directory (R. Rowlett, ibiblio.org/lighthouse), 'France: Aquitaine', read 2026-10-10: Cordouan (2), 1611, Argand reflectors installed in 1782 and the old superstructure replaced by the conical tower completed in 1788, its focal plane 60 m; the range judgement"
    says: "The Tower of Cordouan on its rocks in the mouth of the river of Bourdeaux, its light burning all night high on the new tower."

  - id: cordouan-rocks
    kind: ledge
    name: the rocks of Cordouan
    modern: the plateau de Cordouan
    lat_deg: 45.5900
    lon_deg: -1.1800
    height_m: 0
    extent_m: 900
    source: "Faden 1793, 'To enter by the Channel of Charentais', p. 85: remain at a proper distance from the rocks of Cordouan, where the current catches generally the ships which come too near them during the ebb, or at half tide going down; 'The Channel of La Porte', p. 87: the Tower of Cordouan, which you are to range along very near"
    says: "The rocks of Cordouan about the tower, where the ebb sets a ship that comes too near them."
    fix: "the extent cut to the plateau about the tower, under a kilometre, so that the channels on either side stay open"

  - id: gironde-mouth
    kind: place
    name: the mouth of the river of Bourdeaux
    modern: the mouth of the Gironde
    lat_deg: 45.6000
    lon_deg: -1.1100
    height_m: 0
    source: "Faden 1793, 'Entrance of the Gironde', p. 85: the disposition of the rocky and sandy banks which lie at the mouth of this river makes five channels: the Channel of Charentais, of Matelier or of Saintonge, of Lescameau, of La Porte and the Channel des Graves; p. 93: at the mouth of the river of Bourdeaux the currents are very strong"
    says: "The mouth of the river of Bourdeaux, five channels among its banks and its currents very strong."

  # ---------------------------------------------------------------------------
  # The coast of Arcasson and the Basque coast of France
  # ---------------------------------------------------------------------------

  - id: arcachon-banks
    kind: bank
    name: the Banks of Arcasson
    modern: the banks of the Passes du Bassin d'Arcachon
    lat_deg: 44.5700
    lon_deg: -1.2600
    height_m: 0
    depth_fathoms: 2.5
    source: "Faden 1793, 'Bassin d'Arcasson', pp. 89 to 90: before the Bassin of Arcasson there are several banks, which block up the entrance and leave only two little channels; both entrances of this Bason have not above 2 or 3 fathoms water at low tide; one may easily descry the Banks of Arcasson when near them, for the sea breaks there continually"
    says: "The Banks of Arcasson before the bason, the sea breaking on them continually; two or three fathoms in the channels at low water."

  - id: cap-ferret
    kind: headland
    name: the northern point of Arcasson
    modern: the Cap Ferret
    lat_deg: 44.6350
    lon_deg: -1.2500
    height_m: 10
    source: "Faden 1793, 'Bassin d'Arcasson', pp. 89 to 90: one channel along the northern point of the harbour; the marks to know when you are near Arcasson are a low, level land, destitute of trees, on the north side of its entrance, and on the south side high downs, which appear like little mountains"
    says: "The northern point of Arcasson, a low level land without trees, the high downs to the south of the entrance."
    fix: "the modern point; the spit has grown southward since the period"

  - id: arcachon-road
    kind: anchorage
    name: the anchorage within the Bason of Arcasson
    modern: the channel off Arcachon within the Bassin
    lat_deg: 44.6650
    lon_deg: -1.1900
    height_m: 0
    depth_fathoms: 10
    source: "Faden 1793, 'Bassin d'Arcasson', p. 89: when you have doubled that point you steer along close by the southern shore, as the lead guides, and cast anchor where you please in 10 or 15 fathoms water, or farther inwards in 3 or 4 fathoms; the tides at half after 3 o'clock at new and full moon"
    says: "Within the Bason of Arcasson a ship anchors along the southern shore in ten or fifteen fathoms."

  - id: adour-bar
    kind: shoal
    name: the bar of Bayonne
    modern: the bar of the Adour
    lat_deg: 43.5290
    lon_deg: -1.5300
    height_m: 0
    depth_fathoms: 0.5
    source: "Faden 1793, 'Bayonne', p. 91: the bar of Bayonne being very subject to change, you are obliged to take a pilot; at low water not above 3 or 4 feet deep, so that there is no entrance but at high water; Tofiño 1789, 'Río, barra y puerto de Bayona', pp. 131 to 133: in June 1787 five to six feet at low water of spring tides, and rarely more; a square pyramidal tower on a sand hill on the west bank, a mile within, with a mast to bring in one with it for the best water"
    says: "The bar of Bayonne, three to six feet at low water and shifting with every gale: a pilot, and high water, to pass it."

  - id: bayonne
    kind: town
    name: Bayonne
    modern: Bayonne
    lat_deg: 43.4920
    lon_deg: -1.4750
    height_m: 20
    source: "Tofiño 1789, 'Río, barra y puerto de Bayona', p. 134: a fine city a league up the river, a free port of much commerce, where the King of France has a kind of arsenal for corvettes and store-ships, and the masts of the Pyrenees; Faden 1793, 'Bayonne', p. 91: you anchor before the city, below the bridge, in 4, 5 or 6 fathoms"
    says: "Bayonne, a league up the Adour, a free port with the King of France's yard for corvettes and the Pyrenees' masts."

  - id: biarritz
    kind: town
    name: Biarritz
    modern: Biarritz
    lat_deg: 43.4830
    lon_deg: -1.5590
    height_m: 30
    source: "Tofiño 1789, p. 134: between the river of Bayonne and Bidart the village of Biarits"
    says: "The village of Biarritz on its cliffs south of the Adour."

  - id: larrun
    kind: hill
    name: the mountain of Larrun
    modern: La Rhune
    lat_deg: 43.3090
    lon_deg: -1.6355
    height_m: 905
    source: "Tofiño 1789, 'Puerto de Socoa', pp. 136 to 137: the knowledge of this port from the offing is given by the mountains Larrun and la Batallera; Larrun is the first mountain from the east, high and sharp with a hermitage on its summit, through which runs the line between the two kingdoms; the height the modern chart's"
    says: "Larrun, high and sharp with a hermitage on its summit on the line between France and Spain: the mark for St Jean de Luz from the offing."

  - id: st-jean-de-luz-road
    kind: anchorage
    name: the Bay of St Jean de Luz
    modern: the bay of Saint-Jean-de-Luz
    lat_deg: 43.3960
    lon_deg: -1.6760
    height_m: 0
    depth_fathoms: 6
    bottom: "sand with rocks that cut the cables"
    source: "Faden 1793, 'St. Jean de Luz', pp. 91 to 92: at the farther end of a bay which affords anchorage in 5, 6, 7 or 8 fathoms water, but the bottom is full of rocks which cut the cables; the harbour under the town dry every tide and to be entered at high water; Tofiño 1789, pp. 135 to 137: the river of St Jean de Luz four feet at low water between its moles; within the bay the ground not of the best, rocky patches among the sand"
    says: "The Bay of St Jean de Luz, five to eight fathoms, but the ground full of rocks that cut the cables; the harbour dries."

  - id: socoa-fort
    kind: castle
    name: the tower of Socoa
    modern: the Fort de Socoa
    lat_deg: 43.3950
    lon_deg: -1.6870
    height_m: 15
    source: "Tofiño 1789, 'Puerto de Socoa', p. 135: on the point of Socoa a round tower with a fortification at its foot, from which a mole runs SE a cable, the little port nearly dry at low water; Faden 1793, p. 92: the harbour of Socoa, dry every tide, receives all the great ships of the place"
    says: "The round tower of Socoa on the western point of the bay, its little harbour behind the moles drying at low water."

  - id: sainte-barbe-tower
    kind: tower
    name: the tower on the eastern point of St Jean de Luz
    modern: the Pointe Sainte-Barbe
    lat_deg: 43.3985
    lon_deg: -1.6620
    height_m: 25
    source: "Faden 1793, 'St. Jean de Luz', p. 92: the marks to know St. Jean de Luz are a high tower, situated on the extremity of the eastern point of the bay, and on which a fire is lighted; Tofiño 1789, p. 134: the eastern point of the bay, Santa Bárbara, of middling height and steep, with a battery"
    says: "The high tower on the eastern point of the Bay of St Jean de Luz, on which a fire is lighted."

  # ---------------------------------------------------------------------------
  # Guipúzcoa: Cape Higuer, Passages, St Sebastian, Guetaria
  # ---------------------------------------------------------------------------

  - id: cabo-higuer
    kind: headland
    name: Cape Higuer
    modern: Cabo Higuer
    lat_deg: 43.3930
    lon_deg: -1.7950
    height_m: 40
    source: "Tofiño 1789, 'Cabo la Higuera', p. 138: three miles W of the tower of Socoa; of middling height, with an islet surrounded by rocks to its NE leaving a passage for small craft only; the western point of the bay and river of Fuenterrabía"
    says: "Cape Higuer, of middling height with an islet and rocks off it, the western point of the bay of Fuenterrabía."

  - id: fuenterrabia
    kind: town
    name: Fuenterrabía
    modern: Hondarribia
    lat_deg: 43.3680
    lon_deg: -1.7930
    height_m: 25
    source: "Tofiño 1789, p. 138: the Bidasoa the bound of the kingdoms of Spain and France, Fuenterrabía on its western bank and Hendaye on the eastern; a foot of water at low water within the bar; p. 139: ships of any class may anchor in the bay in 6 or 8 brazas, sand, SE of Cape Higuer before its castle"
    says: "Fuenterrabía, the Spanish fortress on the Bidasoa, the river barred with sand and the bound of the two kingdoms."

  - id: jaizkibel
    kind: hill
    name: Mount Jaysquivel
    modern: Jaizkibel
    lat_deg: 43.3450
    lon_deg: -1.8600
    height_m: 540
    source: "Tofiño 1789, p. 137 and p. 146: the mountain Jaysquivel, the last of the Pyrenees to the sea, rises from Cape Higuer and ends at Passages, the first high land on the shore, its summit a level ridge; on its western fall lies the port of Passages; the height the modern chart's"
    says: "Mount Jaysquivel, the last of the Pyrenees, a long level ridge from Cape Higuer to Passages."

  - id: pasajes-mouth
    kind: place
    name: the mouth of Passages
    modern: the entrance of the port of Pasaia
    lat_deg: 43.3385
    lon_deg: -1.9290
    height_m: 0
    source: "Tofiño 1789, 'Puerto de Pasages', pp. 139 to 140: the mouth in 43° 20' 10\" N; two low points of rock, Arando grande and Arando chico, narrow it to 92 brazas; within, 50 to 70 brazas wide; p. 146: from the offing an opening like the letter V a league east of the castle of St Sebastian"
    says: "The mouth of Passages, a cleft in the high land like a V between the rocks of Arando, ninety brazas wide."

  - id: bancha-grande
    kind: rock
    name: the Bancha grande
    modern: a sunken head off the western point of the entrance of Pasaia
    lat_deg: 43.3400
    lon_deg: -1.9320
    height_m: 0
    dries_m: -4.2
    source: "Tofiño 1789, 'Baxos a la entrada', pp. 141 to 142: N 21° W 79 brazas from the point of Arando chico, 66 brazas off the shore, a sunken peak with only two and a half brazas on it at low water, five to six about it; it breaks when there is a sea"
    says: "The Bancha grande, a sunken head with two and a half brazas on it off the western rocks of Passages, breaking in a sea."
    fix: "the pilot's bearing and distance from the point; the dries_m his two and a half brazas"

  - id: pasajes-road
    kind: anchorage
    name: the harbour of Passages
    modern: the inner harbour of Pasaia below San Pedro
    lat_deg: 43.3238
    lon_deg: -1.9208
    height_m: 0
    depth_fathoms: 3.5
    bottom: "mud"
    source: "Tofiño 1789, pp. 141 and 143: between the castle of Santa Isabel and the tower of San Sebastián the only anchorage for ships drawing more than ten feet; anchor in three and a half or four brazas and run lines ashore to the pierced rocks; the great harbour beyond nearly dry at low water; the high water at three o'clock at full and change, the rise twelve feet, eight to ten at the quarters (p. 145); the ground judgement"
    says: "Passages within its narrows, three and a half to four brazas, the ship moored with lines to the rocks."
    fix: "moved 190 m into the grid's water of the inner harbour"

  - id: igueldo-light
    kind: light
    name: the lanthorn of St Sebastian
    modern: the old light of Monte Igueldo, San Sebastián
    lat_deg: 43.3205
    lon_deg: -2.0080
    height_m: 180
    lit: {from: 1778, until: 1855, range_nm: 21, character: "a lanthorn on a very white tower on the summit of Mount Igueldo"}
    source: "Tofiño 1789, 'Concha y muelles de San Sebastián', pp. 147 and 149 to 150: the tower and lanthorn of San Sebastián on the summit of Mount Igueldo; the castle of la Mota and the lanthorn are seen in clear weather ten to twelve leagues, for the tower is very white, and by night the lanthorn shows the place, so well disposed that it is seen seven to eight leagues; the range his seven leagues of twenty to the degree; the Lighthouse Directory (R. Rowlett, ibiblio.org/lighthouse), 'Spain: Basque Country', read 2026-10-10: Monte Igueldo (1), 1778, its focal plane about 180 m, too high for foggy weather, replaced by the lower light of 1855"
    says: "The lanthorn of St Sebastian on Mount Igueldo, a very white tower whose light is seen seven or eight leagues."

  - id: mota-castle
    kind: castle
    name: the castle of la Mota
    modern: the Castillo de la Mota on Monte Urgull
    lat_deg: 43.3250
    lon_deg: -1.9870
    height_m: 120
    source: "Tofiño 1789, 'Ciudad de San Sebastián', p. 146: Mount Orgullo of middling height, with the great castle of la Mota on its summit in 43° 19' 30\" N; at its foot on the land side the city of San Sebastián, capital of Guipúzcoa"
    says: "The castle of la Mota on Mount Orgullo above St Sebastian, seen ten or twelve leagues in clear weather."

  - id: santa-clara-island
    kind: rock
    name: the Isle of Santa Clara
    modern: Isla de Santa Clara
    lat_deg: 43.3217
    lon_deg: -1.9978
    height_m: 40
    extent_m: 200
    source: "Tofiño 1789, p. 147: in the middle of the Concha's mouth the Isle of Santa Clara with a hermitage; the passage between it and Mount Igueldo closed by reefs; that between it and Mount Orgullo clean, with 9 and 10 brazas"
