# The features of the Channel east (spec M6 §26, block 1; package 39a; docs/dev/ChartBlocks.md):
# Lyme Bay, Portland and Weymouth, the Dorset coast to the Needles, the Channel Islands, the
# Cotentin, the bay of St Malo to Cape Fréhel; and Dartmouth and Torbay, whose harbour patch
# is this block's though their water lies in channel-west's bounds (west of 3 W, where
# channel-west lists no level-3 tile; the bounds' check takes a harbour patch's box as the
# block's). The form and the rules are channel-west.yaml's (its head): hazards, marks,
# lights with their dates, places, anchorages and roads, each with its source in the
# references' form (docs/references/README.md), read from the pilots named in
# docs/references/Charts.md:
#
#   Faden 1793      Le Petit Neptune Français; or, French Coasting Pilot (Internet Archive
#                   lepetitneptunefr00fade): Cape Barfleur and its light-house, Cherbourg,
#                   Cape la Hague (pp. 26 to 29); 'Isles of Jersey, Guernsey, Alderney, &c.
#                   by Captain Dobree' (pp. 29 to 36); the French coast from the Grand Ance
#                   to Cape Fréhel (pp. 36 to 41); Morlaix (p. 44, in channel-west.yaml). In
#                   period exactly: the directions as a master of 1805 read them.
#   White 1835      Martin White, Sailing Directions for the English Channel (Internet Archive
#                   sailingdirectio00whitgoog): 'Coast of England' pp. 37 to 45 (the Start
#                   to the Needles); 'Coast of France' pp. 58 to 90 (Cape la Hague to Cape
#                   Fréhel, from his own survey); 'Directions for the Channel Islands' pp. 91
#                   to 167. White surveyed the islands for the Admiralty from 1813; his marks
#                   are later than 1805, the rocks and the depths are the same rocks.
#   Imray 1874      James F. Imray, Sailing Directions for the English Channel, part I
#                   (Internet Archive sailingdirection00unse_0): 'Poole Bay to Start Point'
#                   pp. 56 to 71 (Weymouth, Portland, Torbay, Dartmouth), the Needles
#                   pp. 48 to 51.
#   Bellin 1764     Petit Atlas Maritime t. V no. 44, 'St Malo et environs' (David Rumsey
#                   6903.531), read at full resolution (the St Malo override's head).
#   Trinity House   the lighthouse pages of trinityhouse.co.uk, read 2026-10-09: Portland
#                   Bill (the patent of 26 May 1716, two lighthouses with coal fires, Argand
#                   lamps in August 1788, a new tower in 1789, the towers of 1869, the one of
#                   1906), the Casquets (first exhibited 30 October 1724, three lights in a
#                   triangle; Argand lamps 25 November 1790; revolving 1818), the Needles
#                   (the cliff-top tower lit 29 September 1786, 144 m above the sea; the
#                   tower on the rocks 1859), Hurst Point (lit 29 September 1786; a higher
#                   light added 1812), St Catherine's (1838), Anvil Point (1881), Alderney
#                   (1912), Berry Head (1906).
#   the encyclopaedia   fr.wikipedia.org, read 2026-10-09: 'Phare du cap Fréhel' (lit
#                   November 1702, the winter months only until 1717; reverberating oil lamps
#                   1774; revolving 1821; the new tower 1845 to 1847), 'Phare de Gatteville'
#                   (the Rouen chamber's tower lit November 1775, oil reflectors 1780, the new
#                   tower 1829 to 1835), as Faden 1793 p. 26 has Barfleur's of 1775.
#
# Positions are in the modern frame (WGS 84, the EMODnet DTM 2024 grid the tiles are cut
# from), first placed from the builder's knowledge of the modern chart and the pilots'
# bearings, then checked against this block's tiles by the rule of channel-west.yaml's
# head (a headland, island, town, castle, church or tower to the nearest land within 800 m;
# a light to the nearest land or shoal head within 400 m; a rock, ledge or drying rock to
# the nearest shoal head within 400 m; an anchorage to the nearest water holding half the
# pilot's depth within 800 m); where a position rests on a pilot's words alone the entry
# says so in `fix`. Heights are above the sea for the horizon, the modern chart's or the
# pilot's. A light's `lit` has `from` and `until`, so that 1805 sees the Casquets, Portland,
# the Needles' cliff-top light, Hurst's first tower, Barfleur and Fréhel, and not the Start,
# Berry Head, St Catherine's, Anvil Point, Cap de la Hague, Carteret or the Corbière;
# `range_nm` is the period lamp's, a judgement from the pilot's words or the elevation.
# `dries_m` is a danger's head against the chart's datum (LAT taken as the pilot's low
# water of springs): negative for the water over it, positive for how far it dries.
#
# Not here: Morlaix (3.83 W) lies in channel-west's bounds and its marks are in
# channel-west.yaml (the brief's item 1); the Start, the Skerries' south end and the coast
# west of Dartmouth are channel-west's.

region: channel-mid
features:

  # ---------------------------------------------------------------------------
  # Dartmouth and Torbay (the harbour patch dartmouth-torbay, in channel-west's water)
  # ---------------------------------------------------------------------------

  - id: dartmouth-castle
    kind: castle
    name: Dartmouth Castle
    modern: Dartmouth Castle
    lat_deg: 50.34230
    lon_deg: -3.56371
    height_m: 20
    source: "White 1835, 'Coast of England', p. 39: St Petrox church and Dartmouth Castle on the western side of the entrance, just within the Battery Point; p. 40: keep the Castle open to the eastward of the Blackstone"
    says: "Dartmouth Castle with St Petrox church beside it, on the western side of the harbour's mouth just within the Battery Point."

  - id: kingswear-castle
    kind: castle
    name: Kingswear Old Castle
    modern: Kingswear Castle
    lat_deg: 50.34070
    lon_deg: -3.56149
    height_m: 15
    source: "White 1835, 'Coast of England', p. 39: the Old Castle of Kingswear stands on the rocks near the water's edge on the eastern side"
    says: "Kingswear Old Castle, on the rocks at the water's edge on the eastern side of the entrance."

  - id: stoke-fleming-church
    kind: church
    name: Stoke Fleming church
    modern: St Peter's church, Stoke Fleming
    lat_deg: 50.3236
    lon_deg: -3.5986
    height_m: 90
    source: "White 1835, 'Coast of England', p. 39: the square steeple of Stoke Fleming church, very conspicuous near a white house on the land south-west of the harbour's mouth, marks its position until Kingswear Old Castle and St Petrox church come in sight"
    says: "The square steeple of Stoke Fleming church by its white house, south-west of the harbour: the mark for Dartmouth before the entrance opens."

  - id: the-blackstone-dartmouth
    kind: rock
    name: the Blackstone
    modern: Blackstone Rocks (Dartmouth)
    lat_deg: 50.3343
    lon_deg: -3.5560
    height_m: 3
    fix: "White's words alone: a black rugged rock always above water, the south-western of the range off the entrance; placed from the modern chart's rocks off Blackstone Point and checked against the grid; the grid (EMODnet's 1/16 minute, resampled at the harbour patch's level) does not resolve the rock; left where the first placing put it"
    source: "White 1835, 'Coast of England', pp. 39 to 40: the Blackstone, a very remarkable black rugged rock, always above the water; give it a berth of half a cable"
    says: "The Blackstone, a black rugged rock always above water off the harbour's mouth; give it half a cable and steer for the entrance."

  - id: the-homestone
    kind: rock
    name: the Homestone
    modern: Homestone Rocks
    lat_deg: 50.33293
    lon_deg: -3.56062
    height_m: 0
    dries_m: -0.9  # 'on some occasions as little as 3 feet water upon it'
    fix: "White: 220 fathoms south of the Blackstone; moved 390 m to the grid's shoal head of 6.7 m, the patch of rocks off the entrance (the grid smooths a head of three feet)"
    source: "White 1835, 'Coast of England', p. 39: the Homestone, 220 fathoms south (S S W 1/2 W) from the Blackstone, has on some occasions as little as 3 feet water; p. 40: the Castle open east of the Blackstone carries you east of it"
    says: "The Homestone, two hundred and twenty fathoms south of the Blackstone, with sometimes no more than three feet on it; keep the Castle open to the eastward of the Blackstone."

  - id: froward-point
    kind: headland
    name: Proward Point
    modern: Froward Point
    lat_deg: 50.33477
    lon_deg: -3.53980
    height_m: 70
    source: "White 1835, 'Coast of England', pp. 39 to 40: the ledges which project nearly a quarter of a mile from Proward Point; keep Kingswear Point in one with Dartmouth Castle to avoid them"
    says: "Proward Point, east of the entrance, with rocky ledges running a quarter of a mile to seaward: keep Kingswear Point in one with Dartmouth Castle."

  - id: the-range-dartmouth
    kind: anchorage
    name: the Range
    modern: the Range, outside Dartmouth
    lat_deg: 50.3345
    lon_deg: -3.5490
    height_m: 0
    depth_fathoms: 5
    source: "White 1835, 'Coast of England', p. 40: between the Blackstone and Proward Point is the anchorage called the Range, where vessels occasionally anchor in 5 fathoms, only as preparatory for entering; caught there by southerly winds there is no alternative but slipping"
    says: "The Range, between the Blackstone and Proward Point, five fathoms: an anchorage only to wait for the harbour, for a southerly wind sends in a sea and leaves nothing but to slip."

  - id: dartmouth-harbour
    kind: anchorage
    name: Dartmouth harbour
    modern: the Dart off Kingswear
    lat_deg: 50.3490
    lon_deg: -3.5712
    height_m: 0
    depth_fathoms: 5
    bottom: "mud"
    fix: "the channel's core abreast of Kingswear, in the Dartmouth override's five fathoms (the grid alone smooths the river to two or three metres)"
    source: "White 1835, 'Coast of England', p. 40: having passed the Castle keep the western shore on board, and anchor abreast of Kingswear, or Dartmouth, as convenient; no square-rigged vessel should enter or leave except with leading winds, the flaws coming off the high land; between S W by S and S E by E the winds blow truly in; Imray 1874, 'Dartmouth', p. 69: abreast the town 10 to 3 1/2 fathoms at low water; the bottom judgement"
    says: "Dartmouth harbour, anchored abreast of Kingswear or the town under the high land; a square-rigged ship goes in and out only with a leading wind, for the flaws come off the hills with great force."

  - id: dartmouth
    kind: town
    name: Dartmouth
    modern: Dartmouth
    lat_deg: 50.3515
    lon_deg: -3.5790
    height_m: 20
    source: "White 1835, 'Coast of England', pp. 39 to 41: well adapted for the reception of trading vessels in any number; the entrance narrow"
    says: "Dartmouth, a harbour for trading vessels in any number behind a narrow entrance."

  - id: berry-head
    kind: headland
    name: the Berry Head
    modern: Berry Head
    lat_deg: 50.40125
    lon_deg: -3.48867
    height_m: 55
    source: "White 1835, 'Coast of England', p. 39: the southern boundary of Torbay, lofty and precipitous, discerned at 7 and 8 leagues; Imray 1874, 'Tor Bay', pp. 67 to 68: about 180 feet high, steep to, flat on its summit, seen 20 miles; its lighthouse dates from 1906 (Trinity House)"
    says: "The Berry Head, lofty and precipitous with a flat top, the south side of Torbay; seen seven or eight leagues off and steep to."

  - id: brixham
    kind: town
    name: Brixham
    modern: Brixham
    lat_deg: 50.3955
    lon_deg: -3.5130
    height_m: 20
    source: "Imray 1874, 'Tor Bay', p. 68: Brixham harbour; the anchorage usually preferred is Brixham roads"
    says: "Brixham, the fishermen's harbour under the Berry Head."

  - id: brixham-road
    kind: anchorage
    name: Brixham road
    modern: Brixham Roads, Tor Bay
    lat_deg: 50.4100
    lon_deg: -3.4950
    height_m: 0
    depth_fathoms: 6
    bottom: "mud and clay"
    fix: "Imray's bearings, Brixham church about S W and the Berry Head S S E, in the grid's 10.7 m"
    source: "Imray 1874, 'Tor Bay', p. 68: the anchorage usually preferred is Brixham roads, with Brixham church about S W and Berry head S S E; the whole bay good anchorage over mud and clay, shelter from all winds from N E northerly to S by W; p. 67: the bay 8 to 6 fathoms deep, decreasing to the shore"
    says: "Brixham road in Torbay, Brixham church south-west and the Berry Head south-south-east, six fathoms on mud and clay: sheltered from every wind from north-east round by the west to south, open to the easterly gale."

  - id: torbay
    kind: anchorage
    name: Torbay
    modern: Tor Bay
    lat_deg: 50.4450
    lon_deg: -3.5150
    height_m: 0
    depth_fathoms: 7
    bottom: "mud and clay"
    source: "Imray 1874, 'Tor Bay', pp. 67 to 68: between Hope Nose and Berry head, N N E and S S W 3 1/2 miles, running in about 3 miles, 8 to 6 fathoms; open to eastward, south-easterly gales sending in a heavy sea"
    says: "Torbay, between Hope's Nose and the Berry Head, eight to six fathoms over mud and clay: the fleet's anchorage in a westerly gale, open to the east."

  - id: hopes-nose
    kind: headland
    name: Hope's Nose
    modern: Hope's Nose
    lat_deg: 50.46296
    lon_deg: -3.48668
    height_m: 30
    source: "Imray 1874, 'Tor Bay', p. 67: Tor bay lies between Hope Nose and Berry head; the Ore-stone, Flat rock, Thatcher and the Shags off it"
    says: "Hope's Nose, the north point of Torbay, with the Ore Stone and the Thatcher off it."

  - id: the-ore-stone
    kind: island
    name: the Ore Stone
    modern: Orestone
    lat_deg: 50.4596
    lon_deg: -3.4742
    height_m: 30
    fix: "the grid does not resolve the islet (its least depth 3.4 m within 800 m); left at the modern chart's position"
    source: "Imray 1874, 'Tor Bay', p. 67: the outermost of the rocks south and west of Hope Nose; vessels entering from the northward may keep close to it, but not the west side, shoal half a cable off"
    says: "The Ore Stone, the outermost rock off Hope's Nose; a ship coming into Torbay from the north may keep close to it on its seaward side."

  - id: thatcher-rock
    kind: rock
    name: the Thatcher
    modern: Thatcher Rock
    lat_deg: 50.4575
    lon_deg: -3.5030
    height_m: 40
    fix: "the grid does not resolve the rock, two cables off the shore; left at the modern chart's position"
    source: "Imray 1874, 'Tor Bay', p. 67: the Thatcher, among the rocks west of Hope Nose; the Ore-stone its own length open of the Thatcher, E 1/2 S, leads clear of the shoals on the north side of the bay"
    says: "The Thatcher, a high rock in the north side of Torbay; the Ore Stone open of it leads clear of the shoals there."

  # ---------------------------------------------------------------------------
  # Lyme Bay to Portland
  # ---------------------------------------------------------------------------

  - id: lyme-regis
    kind: town
    name: Lyme
    modern: Lyme Regis and the Cobb
    lat_deg: 50.7250
    lon_deg: -2.9370
    height_m: 20
    source: "Imray 1874, 'Poole Bay to Start Point', p. 64: Lyme Regis and its pier, the Cobb; White 1835, 'Remarks on the soundings', p. 5: the soundings from the Start to Lyme Regis"
    says: "Lyme, with its Cobb, a pier-harbour for small craft at the head of the great bay."

  - id: golden-cap
    kind: hill
    name: the Golden Cap
    modern: Golden Cap
    lat_deg: 50.7238
    lon_deg: -2.8460
    height_m: 191
    source: "Imray 1874, 'Poole Bay to Start Point', pp. 63 to 64, the coast from Bridport to Lyme; the name and the height the modern chart's"
    says: "The Golden Cap, the highest cliff of the coast between Lyme and Bridport, its top yellow in the sun."

  - id: chesil-beach
    kind: place
    name: the Chesil Beach
    modern: Chesil Beach
    lat_deg: 50.6150
    lon_deg: -2.5400
    height_m: 10
    source: "White 1835, 'Coast of England', p. 43: in the vicinity of Chesil Beach the shore is low; Imray 1874, p. 59: strangers alarmed by the Race have run their vessels on shore on Chesil beach, a fatal error"
    says: "The Chesil Beach, a long bank of pebbles from Abbotsbury to Portland with deep water close to: a ship embayed here in a south-westerly gale is lost."

  - id: portland-high-land
    kind: hill
    name: the high land of Portland
    modern: the Verne, Isle of Portland
    lat_deg: 50.5640
    lon_deg: -2.4390
    height_m: 149
    source: "White 1835, 'Coast of England', p. 43: the Peninsula of Portland suddenly rises and forms a very remarkable promontory in the form of a wedge declining to the southward; Imray 1874, 'Portland Bill', p. 59: in its highest part 488 feet"
    says: "The high land of Portland, a wedge rising steeply from the Chesil Beach and declining to the southward to the Bill."

  - id: portland-bill
    kind: headland
    name: the Bill of Portland
    modern: Portland Bill
    lat_deg: 50.51674
    lon_deg: -2.45466
    height_m: 20
    source: "White 1835, 'Coast of England', pp. 37 to 42: from the Start to Portland E 1/2 S 17 leagues; between them do not come within 30 fathoms until past the meridian of Portland; Imray 1874, 'Portland Bill', p. 59: three to four fathoms at two cables off on the south-east side"
    says: "The Bill of Portland, the low southern end of the island, with the Race off it; keep without thirty fathoms in thick weather."

  - id: portland-high-light
    kind: light
    name: the upper light of Portland
    modern: Old Higher Lighthouse, Portland
    lat_deg: 50.5208
    lon_deg: -2.4560
    height_m: 60
    lit: {from: 1716, until: 1906, range_nm: 18, character: "a fixed light, Argand lamps since 1788 (White 1835 has it revolving in two minutes)"}
    source: "Trinity House, 'Portland Bill Lighthouse' (the patent of 26 May 1716, two lighthouses with coal fires; Argand lamps in August 1788, the upper or old house with two rows of seven; the towers replaced 1869 and 1906); White 1835, 'Coast of England', p. 42: the two lights in one bearing N 53 W lead between the Race and the Shambles; their heights above high water 198 and 131 feet, 1,500 feet apart"
    says: "The upper light of Portland, the higher of the two; the two lights in one lead between the Race and the Shambles."

  - id: portland-low-light
    kind: light
    name: the lower light of Portland
    modern: Old Lower Lighthouse, Portland (the bird observatory)
    lat_deg: 50.5172
    lon_deg: -2.4527
    height_m: 40
    lit: {from: 1716, until: 1906, range_nm: 15, character: "a fixed light, lens-lit Argand lamps since 1788"}
    source: "Trinity House, 'Portland Bill Lighthouse' (the two lighthouses of 1716; the low light's six Argand lamps with Rogers's lenses); White 1835, 'Coast of England', p. 42: the lowest, south-eastern light; Imray 1874, p. 59: the low light visible seaward only between S E by E 1/2 E and W by S 1/2 S"
    says: "The lower light of Portland; keep the upper light open to the southward of it passing between the Shambles and the Bill on the north-eastern stream."

  - id: portland-bill-light
    kind: light
    name: Portland Bill lighthouse
    modern: Portland Bill Lighthouse
    lat_deg: 50.51680
    lon_deg: -2.45479
    height_m: 43
    lit: {from: 1906, until: null, range_nm: 25, character: "a group of four flashes every twenty seconds"}
    source: "Trinity House, 'Portland Bill Lighthouse': built 1906 to replace the high and low lights"
    says: "The single tower on the Bill, which replaced the two lights in 1906."

  - id: portland-ledge
    kind: ledge
    name: Portland Ledge
    modern: Portland Ledge
    lat_deg: 50.50329
    lon_deg: -2.45776
    height_m: 0
    dries_m: -5.5  # 'from 3 to 9 fathoms' over it (Imray), the shoalest three
    extent_m: 1800
    source: "White 1835, 'Coast of England', p. 41: the rocky ledge which projects somewhat more than a mile in a southerly direction from the Bill, both sides remarkably steep; Imray 1874, 'Portland Ledge', p. 59: a mile S S W from the pitch of the Bill, the soundings over it 3 to 9 fathoms"
    says: "Portland Ledge, a steep shelf of rock running a mile south-south-west from the Bill with three to nine fathoms on it, the cause of the Race."

  - id: portland-race
    kind: place
    name: the Race of Portland
    modern: Portland Race
    lat_deg: 50.4950
    lon_deg: -2.4500
    height_m: 0
    source: "White 1835, 'Coast of England', pp. 41 to 42: a periodical ebullition of the sea raging with great violence on the southern side of the Bill, two miles off with northerly winds and half a mile with southerly; east of the ledge on the north-eastern stream, west of it on the south-western; dangerous for small vessels at springs; a channel between the Race and the Bill with 3 to 9 fathoms within a third of a mile of the Bill, with a free wind and slack water"
    says: "The Race of Portland, raging off the Bill on the ledge: to the eastward of it on the flood stream and to the westward on the ebb, and at springs no place for a small vessel."

  - id: the-shambles
    kind: bank
    name: the Shambles
    modern: The Shambles
    lat_deg: 50.51194
    lon_deg: -2.36839
    height_m: 0
    dries_m: -3.4  # 'the depths vary from 11 feet to 7 fathoms'
    extent_m: 3700
    source: "White 1835, 'Coast of England', p. 41: a dangerous shoal of coarse shingle, sand and shells, its western end S 63 E 2 3/4 miles and its eastern N 87 E 4 1/2 miles from the pitch of the Bill, two miles long and three-quarters broad, from 11 feet to 7 fathoms; always distinguishable by the rippling in fine weather; between it and Portland a good working channel of 9 to 16 fathoms"
    says: "The Shambles, a bank of shingle and shells two miles long east-south-east of the Bill with only eleven feet on its shoalest part; the ripple shows it in fine weather, and between it and the Bill there is a working channel."

  - id: portland-west-bay
    kind: anchorage
    name: Portland West Bay
    modern: West Bay, Portland
    lat_deg: 50.5530
    lon_deg: -2.4930
    height_m: 0
    depth_fathoms: 14
    bottom: "coarse loose gravel or shingle"
    fix: "White's bearings: the Bill S 30 E, Chesilton village N 78 E, a mile or more off shore"
    source: "White 1835, 'Coast of England', pp. 42 to 43: on the north-western side of the Bill, very good shelter from S S E to N by E, deep water of 12 to 16 fathoms on coarse loose gravel or shingle; a vessel is on all occasions much safer at sea than in West Bay"
    says: "Portland West Bay, twelve to sixteen fathoms on coarse shingle a mile off the island: shelter from an easterly wind, a trap in a westerly one."

  - id: portland-road
    kind: anchorage
    name: Portland Road
    modern: Portland Harbour (before the breakwaters)
    lat_deg: 50.5800
    lon_deg: -2.4360
    height_m: 0
    depth_fathoms: 7
    bottom: "firm blue clay"
    source: "Imray 1874, 'Portland Road', p. 60: excellent anchorage on firm solid blue clay, 5 to 10 fathoms within; the breakwater (begun 1849) has sheltered it from the southerly, south-easterly and E S E gales, the only winds which formerly rendered Portland road dangerous; little or no tide"
    says: "Portland Road, under the north-east side of the island, seven fathoms on blue clay with little tide: good holding, but open to the gales from south-east round to east."

  - id: portland-castle
    kind: castle
    name: Portland Castle
    modern: Portland Castle
    lat_deg: 50.56867
    lon_deg: -2.44650
    height_m: 10
    source: "Imray 1874, 'Portland Road', p. 60, the road under the castle; the castle's date (1539 to 1541, one of the King's forts) from the encyclopaedia's 'Portland Castle', from memory, unverified"
    says: "Portland Castle, the low fort on the shore of the road at the north end of the island."

  - id: weymouth
    kind: town
    name: Weymouth
    modern: Weymouth
    lat_deg: 50.6085
    lon_deg: -2.4560
    height_m: 15
    source: "Imray 1874, 'Weymouth Road and Harbour', p. 58: a very convenient little place for vessels not drawing more than 10 feet, lying afloat at the quays almost always; high water full and change 6h 56m, springs rise 7 feet"
    says: "Weymouth, a small pier-harbour for vessels of ten feet's draught, with the King's sea-bathing and the town on the beach."

  - id: weymouth-road
    kind: anchorage
    name: Weymouth Road
    modern: Weymouth Bay off the harbour
    lat_deg: 50.6080
    lon_deg: -2.4370
    height_m: 0
    depth_fathoms: 6
    bottom: "sand and gravel"
    source: "Imray 1874, 'Weymouth Road and Harbour', p. 58: good anchorage in from 5 to 8 fathoms at half or three-quarters of a mile E S E from the jetty head on sand and gravel; foul ground within three-quarters of a mile of the northern shore; very little tide"
    says: "Weymouth Road, five to eight fathoms on sand and gravel three-quarters of a mile east-south-east of the pier head, with scarcely any tide."

  - id: wyke-regis-church
    kind: church
    name: Wyke Regis church
    modern: All Saints, Wyke Regis
    lat_deg: 50.6017
    lon_deg: -2.4806
    height_m: 40
    source: "White 1835, 'Coast of England', p. 41: Wyke Regis church distinctly open to the northward of the north-east point of Portland, N by W 1/2 W, the leading mark to clear the eastern end of the Shambles; in one with it, over the end of the shoal in 7 fathoms"
    says: "Wyke Regis church, its tower the mark for the Shambles: open north of Portland's north-east point you pass east of the shoal."

  # ---------------------------------------------------------------------------
  # The Dorset coast to the Needles, and the back of the Wight
  # ---------------------------------------------------------------------------

  - id: st-albans-head
    kind: headland
    name: St Alban's Head
    modern: St Aldhelm's Head
    lat_deg: 50.57736
    lon_deg: -2.05543
    height_m: 105
    source: "White 1835, 'Coast of England', pp. 43 to 44: between Weymouth Bay and St Alban's Head the shore principally cliff; from a league off Portland E 1/2 S 15 miles, and after passing St Alban's Head east 19 miles to the Needles"
