    fix: "the rock is smaller than the grid's cell, whose least depth is 3.3 m; the lights stand where the modern chart has the lighthouse"
    source: "Trinity House, 'Casquets Lighthouse': three towers with closed coal fires in a horizontal triangle, St Peter, St Thomas and Dungeon, first exhibited 30 October 1724; Argand lamps and reflectors 25 November 1790; a revolving apparatus in each tower 1818; Faden 1793, p. 30: three light-houses in the form of a triangle which may be seen 5 or 6 miles off in a dark night; White 1835, p. 38: all three of equal height, 80 feet above high water, appearing as two from six bearings; the range a judgement between Faden's fires and the elevation"
    says: "The three lights of the Casquets, in a triangle on the great rock; from some bearings they show as two, and a stranger may take the Casquets for Portland."

