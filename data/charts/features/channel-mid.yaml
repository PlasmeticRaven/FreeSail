    lon_deg: -2.38401
    height_m: 25
    extent_m: 1200
    source: "Faden 1793, 'The Caskets', p. 30: a cluster of rocks west of Ortach 3 or 4 miles, some above the sea and the greatest part under water; a ship may pass between them and Ortach keeping nearest to Ortach; White 1835, 'Coast of England', p. 38: the soundings round the Casquets within 3 leagues do not differ from Portland's, so that the one may be mistaken for the other in bad weather"
    says: "The Casquets, a cluster of rocks seven miles west of Alderney, the greatest part under water, with their three lights; between them and Guernsey the tides run strongly and round the compass in twelve hours."

  - id: casquets-lights
