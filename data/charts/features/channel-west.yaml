    says: "The point of the Pezeaux, steep cliffs south of Camaret, and off it the five or six great rocks called the hay-ricks."

  - id: tas-de-pois
    kind: rock
    name: the Tas de Foin
    modern: Tas de Pois
    lat_deg: 48.2540
    lon_deg: -4.6350
    height_m: 40
    extent_m: 600
    fix: "the modern chart's Tas de Pois off Pen-Hir; the grid does not resolve the rocks as land, and the check left the position"
    source: "Faden 1793, 'Pointe des Pezeaux', p. 58: five or six great rocks which go by the name of Tas de Foin, hay-ricks, on account of their similitude to heaps of hay"
    says: "The hay-ricks, five or six great rocks off the point of the Pezeaux, like heaps of hay from the sea."

  - id: bec-de-la-chevre
