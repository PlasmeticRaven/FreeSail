    name: the Lavandière
    modern: La Lavandière (western entrance of the Île de Batz channel)
    lat_deg: 48.7327
    lon_deg: -4.0453
    height_m: 2
    fix: "Bellin's Petite and Grande Lavandière georeferenced to 48.7321, -4.0388 and 48.7314, -4.0431; the modern grid's shoal head 3.8 m under the datum at 48.7327, -4.0453, within 400 m (the grid smooths a rock Faden's pilot pushed off with an oar); the height above the datum judgement on Faden's 'a single rock'"
    source: "Faden 1793, 'Isle de Bas', p. 46: a single rock about a third of the distance between the end of the isle and the main land; 'you must steer close by it, and push it with a long oar; it is very safe'; at twice a ship's length from it is another rock under water, called Le Couillon; pass between them with the Lavandière on the starboard side and the Couillon on the larboard; Bellin 1764 (Petite and Grande Lavandière)"
    says: "The Lavandière, a single rock at the western entrance of the channel of Bas, a third of the way from the island to the main: steer close by it and keep it to starboard going in, for the Couillon lies under water twice a ship's length from it on the other hand."

  - id: batz-western-entrance
