    says: "South-west by south of Ushant, twelve or thirteen leagues off, the lead finds seventy to seventy-five fathoms on coarse white and red sand with small worn-out stones; at twenty leagues a hundred fathoms and grey sand with chaff like bran."

  - id: soundings-off-ushant-near
