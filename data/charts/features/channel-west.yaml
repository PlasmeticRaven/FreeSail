  # The channel of the Isle of Bas and the harbour of Roscoff (package 35b): the marks the
  # patch names (data/charts/overrides/channel-west/roscoff.yaml), read from Bellin's sheet
  # of 1764 (Petit Atlas Maritime t. V no. 51) georeferenced by them, and Faden's words.
  # Positions by the head's rule: the sheet's place, georeferenced, moved to the modern
  # grid's land or shoal head within 400 m where there is one (`fix` says which).

  - id: roscoff-church
