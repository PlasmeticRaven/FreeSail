    lon_deg: -4.9000
    height_m: 0
    bottom: "putrid shells and mouldering pieces of old rock"
    depth_fathoms: 42
    source: "Faden 1793, 'The Channel called Passage de l'Iroise', p. 61: between the isles south of Ushant and the Raz, six leagues wide, the common track to and from Brest; 40 to 45 fathoms on a bottom of putrid shells and mouldering pieces of old rocks; the flood NE and the ebb SW, high water about four o'clock"
    says: "The Iroise, six leagues wide between the isles and the Raz, the common track to and from Brest: forty to forty-five fathoms on putrid shells and mouldering rock, the flood setting north-east and the ebb south-west."

  - id: pointe-du-raz
