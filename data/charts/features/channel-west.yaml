    source: "The encyclopaedia's 'Phare du Tévennec' (read 2026-10-09): until 1875 two lights in the sector of Sein, the isle's of 1839 and the fixed light of the first order lit in 1839 on the summit of the Pointe du Raz, the feu du Bec du Raz; not lit in 1805"
    says: "The light on the Bec du Raz, which was not yet built in 1805."

  - id: tevennec-light
    kind: light
    name: the light of the Livenet
    modern: Phare du Tévennec
    lat_deg: 48.07206
    lon_deg: -4.79387
    height_m: 28
    lit: {from: 1875, until: null, range_nm: 9, character: "a fixed light, white and red sectors (not yet built in 1805)"}
    source: "The encyclopaedia's 'Phare du Tévennec' (read 2026-10-09): first lit on 15 March 1875, a fixed light in white and red sectors; not lit in 1805"
    says: "The light on the Livenet, which was not yet built in 1805."

  - id: la-vieille-light
    kind: light
    name: the light of the Old Woman
    modern: Phare de la Vieille
    lat_deg: 48.04056
    lon_deg: -4.75639
    height_m: 33
    lit: {from: 1887, until: null, range_nm: 18, character: "a light on the rock (not yet built in 1805)"}
    source: "The encyclopaedia's 'Phare de la Vieille' (read 2026-10-09): built 1882 to 1887 on the rock of Gorlebella, in service from 1887; not lit in 1805"
    says: "The light on the Old Woman, which was not yet built in 1805."

# ---------------------------------------------------------------------------
# The common tracks (spec M6 §4; package 40): see the head of the file.
# ---------------------------------------------------------------------------
tracks:
  - id: channel-to-brest
    name: the track from the Channel to Brest, west about Ushant by the Iroise
    source: "Faden 1793, p. 61: the Passage de l'Iroise, between the isles south of Ushant and the Raz, six leagues wide, the common track to and from Brest; the soundings seven leagues south-west of Ushant (p. 60), the mark a ship from the Channel makes for before she hauls in for the Iroise; the merchant passage's book for the point off the Lizard"
    marks: [49 52 N 5 06 W, soundings-off-ushant-near, iroise]
  - id: lizard-to-plymouth
    name: the track up Channel from the Lizard to Plymouth, a mile to the westward of the Eddystone
    source: "White 1835 pp. 26 to 31 and Imray 1874 pp. 75 to 85, the coast from the Lizard to Plymouth with the Eddystone kept to the eastward; the naval cruise's book for the point off the Eddystone; judgement for the point off the Deadman"
    marks: [49 52 N 5 06 W, 50 08 N 4 42 W, 50 11 N 4 18 W]
