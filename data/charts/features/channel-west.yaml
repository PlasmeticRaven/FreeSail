    lat_deg: 48.05608
    lon_deg: -5.00700
    height_m: 1
    source: "The French encyclopaedia's 'Phare d'Ar-Men' (read 2026-09-30): the rock at the end of the chaussée de Sein, its lighthouse built 1867 to 1881; position from the modern chart"
    says: "Ar Men, the rock at the end of the chaussée de Sein, unlit until 1881."

  - id: soundings-off-ushant
    kind: bottom
    name: the soundings south-west of Ushant
