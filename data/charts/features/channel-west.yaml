    source: "Faden 1793, 'Les Basses du Lis and Le Menjan', p. 58: named from the ship Le Lis which touched upon them, before which they were unknown; at low tide at least 14 or 15 feet"
    says: "The Basses du Lis, a league south of the Parquette, with fourteen or fifteen feet at low water, unknown until the ship Le Lis touched on them; and Le Menjan a league east-south-east, as deep."

