# The features of the western Channel and the Western Approaches (spec M5 §10; the study
# docs/design/ChartData.md §4, §5.2; package 32): hazards, marks, lights with their dates,
# places, anchorages, transits and bottom notes, in the period's words, each with its
# source in the references' form (docs/references/README.md), read from the pilots named
# in docs/references/Charts.md:
#
#   Faden 1793      Le Petit Neptune Français; or, French Coasting Pilot (Internet Archive
#                   lepetitneptunefr00fade), the pages of the directions for Ushant, the Four,
#                   St Matthew, Brest, Camaret and the Iroise (pp. 53 to 62).
#   White 1835      Martin White, Sailing Directions for the English Channel (Internet Archive
#                   sailingdirectio00whitgoog), 'Coast of England' pp. 13 to 35.
#   Imray 1874      James F. Imray, Sailing Directions for the English Channel, part I
#                   (Internet Archive sailingdirection00unse_0, catalogued there as 1848; its
#                   title page reads 1874, its variation note 1873), 'Start Point to
#                   Plymouth' pp. 75 to 85, 'Plymouth to Land's End and the Seven Stones'
#                   pp. 85 to 103, 'Scilly Islands' pp. 104 to 108.
#   Trinity House   the lighthouse pages of trinityhouse.co.uk, read 2026-09-30, for the
#                   English lights' dates; the encyclopaedia pages named for the French.
#
# Positions are in the modern frame (WGS 84, the EMODnet DTM 2024 grid the tiles are cut
# from). They were first placed from the builder's knowledge of the modern chart and the
# pilots' bearings, then checked against the chart's coast and EMODnet's shoalest sounding
# in each cell, and where the first placing missed the land or the shoal they were moved
# by a stated rule (package 32's report): a headland, island, town, castle, church, mill,
# beacon or tower to the nearest land within 800 m; a light to the nearest land or shoal
# head within 400 m; a rock, ledge or drying rock to the nearest shoal head within 400 m;
# an anchorage to the nearest water holding half the pilot's depth within 800 m. Where a
# position rests on a pilot's bearing and distance alone (a sunken rock the modern grid
# does not resolve) the entry says so in `fix`, and the check left it where the pilot puts
# it: the Penwin and Vaze, the Dragstone, the Seven Stones, the Nun Deeps, the Mingan, the
# Bellen and the hay-ricks are such. The precision is that of the grid, a cable or so, and
# a mark's position is the mark's, not its summit's. Heights are above the sea
# for the horizon (spec §11), the modern chart's or the pilot's. A light carries `lit`:
# `from` the year it was first lit and `until` the year it was put out, so that 1805 sees
# St Agnes and not the Bishop (truth 65); `range_nm` is the period lamp's, a judgement
# from the pilot's words where one is given ("five leagues", White) and from the
# elevation where none is. `says` is a line the log can say; `view` names a coastal view.
# `dries_m` (package 34, the tide) is a danger's head against the chart's datum, the
# pilot's figure for the water over it at low water (negative) or how far it dries
# (positive), LAT taken as the pilot's low water; a rock with none is read as awash at the
# datum, or as standing its `height_m` above it. The grounding reads the tide over it.
#
# The lead reviews this list against the sources before the merge: the citation is on
# every line for that.
#
# The common tracks (spec M6 §4; package 40), under `tracks:` at the end of the file:
# the period's tracks between the sea's marks, each an id, a name, a source and the
# marks in order (a feature by its id, or a position pricked on the chart). The rules-
# based captain's planner (freesail/world/captains.py) joins them to the ports' own
# tracks (`tracks:` in data/ports/*.yaml) where the straight line between two places
# runs across the land or a charted danger; the chart's loader passes the section over.

region: channel-west
features:

  # ---------------------------------------------------------------------------
  # The Lizard and the coast to Falmouth
  # ---------------------------------------------------------------------------

  - id: lizard-point
    kind: headland
    name: the Lizard
    modern: Lizard Point
    lat_deg: 49.9594
    lon_deg: -5.2067
    height_m: 60
    source: "White 1835, 'Coast of England', p. 24"
    says: "The Lizard, a bold and precipitous promontory; you may approach it with great confidence, night or day, if the weather be at all clear."
    view: "Serres 1801, plate 13, 'Lizard, N.W.'; 'Lizard, N.E.'; 'Lizard, N.N.W.'"

  - id: lizard-lights
    kind: light
    name: the Lizard lights
    modern: Lizard Lighthouse
    lat_deg: 49.9587
    lon_deg: -5.2028
    height_m: 70
    lit: {from: 1752, until: null, range_nm: 20, character: "two fixed lights, in one W by N"}
    source: "Trinity House, 'Lizard Lighthouse' (completed 1752, first lit 22 August); White 1835, 'Coast of England', p. 24: the two lights stand high, their line of bearing W by N"
    says: "The two lights of the Lizard, standing high; a leading mark for avoiding the Wolf and the Manacles, though at night their brilliancy makes them hard to tell apart."

  - id: the-stags
    kind: ledge
    name: the Stags
    modern: Stag Rocks
    lat_deg: 49.95338
    lon_deg: -5.21120
    height_m: 2
    extent_m: 700
    source: "White 1835, 'Coast of England', p. 24"
    says: "The Stag rocks, advancing south and south-west from the Lizard three-quarters of a mile, with from five to nine fathoms close to and among them."

  - id: the-beast
    kind: headland
    name: the Beast
    modern: Bass Point
    lat_deg: 49.96244
    lon_deg: -5.18686
    height_m: 60
    source: "White 1835, 'Coast of England', p. 24 (note): the eastern part of the land at the Lizard, higher than the lights"
    says: "The Beast, the eastern part of the Lizard land, higher than the lighthouses, which it hides from a ship nearer Black Head than a mile and a half."

  - id: rose-rock
    kind: rock
    name: the Rose
    modern: Rose Rock (off Bass Point)
    lat_deg: 49.95844
    lon_deg: -5.19686
    height_m: 0
    dries_m: -4  # thirteen feet on them at low water (the pilot's words below)
    fix: "White's bearing and distance: half a mile from the Lizard Point, S 89 E; three small heads with 13 feet at low water"
    source: "White 1835, 'Coast of England', p. 24"
    says: "The Rose rock, half a mile east of the Lizard point, three small heads with thirteen feet on them at low water and overfalls about it."

  - id: spanam-rock
    kind: rock
    name: the Spanam
    modern: Spernan Shoal
    lat_deg: 49.96000
    lon_deg: -5.16500
    height_m: 0
    dries_m: -8.2  # four fathoms and a half over them
    fix: "White: above a mile from the shore, N 83 E of the Lizard Point; 4 1/2 fathoms on it"
    source: "White 1835, 'Coast of England', p. 25"
    says: "The Spanam, three heads with four fathoms and a half over them, above a mile east of the Lizard; the sea breaks about it with great impetuosity."

  - id: craggan-rock
    kind: rock
    name: the Craggan
    modern: Craggan Rocks (off Cadgwith)
    lat_deg: 49.97746
    lon_deg: -5.17345
    height_m: 0
    dries_m: -2.9  # nine feet and a half on them
    fix: "White: S 15 E of Cadgwith Cove, two-thirds of a mile; three heads with 9 1/2 feet at low water"
    source: "White 1835, 'Coast of England', p. 24"
    says: "The Craggan rock, three heads in a triangle with nine feet and a half on them, two-thirds of a mile off Cadgwith; a stranger should not come within a mile of the shore."

  - id: cadgwith
    kind: place
    name: Cadgwith Cove
    modern: Cadgwith
    lat_deg: 49.9890
    lon_deg: -5.1770
    height_m: 30
    source: "White 1835, 'Coast of England', p. 24"
    says: "Cadgwith cove, a fishing cove under the cliffs north-east of the Lizard."

  - id: black-head
    kind: headland
    name: Black Head
    modern: Black Head
    lat_deg: 50.0060
    lon_deg: -5.1070
    height_m: 60
    source: "White 1835, 'Coast of England', p. 25"
    says: "Black Head, the Manacles three miles E by S of it."

  - id: coverack
    kind: place
    name: Coverack
    modern: Coverack
    lat_deg: 50.0240
    lon_deg: -5.0960
    height_m: 20
    source: "Imray 1874, 'Plymouth to Land's End', p. 93"
    says: "Coverack, a small cove with a pier, north of Black Head."

  - id: lowland-point
    kind: headland
    name: Lowland Point
    modern: Lowland Point
    lat_deg: 50.0380
    lon_deg: -5.0700
    height_m: 10
    source: "White 1835, 'Coast of England', p. 25"
    says: "Lowland Point, low land under the Manacles; large ships should not haul to the northward after the Lizard until it opens east of Black Head."

  - id: the-manacles
    kind: ledge
    name: the Manacles
    modern: Manacle Rocks
    lat_deg: 50.04666
    lon_deg: -5.04419
    height_m: 3
    dries_m: 2  # covering and uncovering: judgement, the heads dry two metres
    extent_m: 900
    source: "White 1835, 'Coast of England', p. 25: three miles E by S from Black Head, three-quarters of a mile SE by S from Manacle Point; one head always above water, the rest cover and uncover"
    says: "The Manacles, a group of dangerous rocks connected by ledges, projecting a mile from the nearest headland; one head always above water, the rest covering and uncovering."
    view: "Serres 1801, plate 13, 'the Manacles'"

  - id: penwin-and-vaze
    kind: rock
    name: the Penwin and the Vaze
    modern: Penwin and Vase rocks (the Manacles' outliers)
    lat_deg: 50.0530
    lon_deg: -5.0330
    height_m: 0
    dries_m: 0  # the one awash (at the datum), the other with five feet
    fix: "White: six-tenths of a mile ENE of the highest Manacle, a cable apart; the Penwin awash at low water, five feet on the Vaze"
    source: "White 1835, 'Coast of England', pp. 25 to 26"
    says: "The Penwin and the Vaze, outliers of the Manacles, the one awash and the other with five feet at low water: Mawnan church open of the Nare Head will not clear them."

  - id: manacles-clearing-mark
    kind: transit
    name: Mawnan church open of Nare Point
    modern: Mawnan church and Nare Point (the Helford's south side)
    lat_deg: 50.0530
    lon_deg: -5.0330
    marks: [nare-point, mawnan-church]
    bearing_deg: 335
    fix: "Package 33b (playtest 12): the transit's near mark is the Helford's Nare Point, which White and Imray call 'the Nare Head' in the Manacles' paragraph, not the Nare Head of the Roseland east of Falmouth; the marks were corrected from the page, the near mark first, and the bearing is that of the church beyond the point from a ship on the line (334° true from Nare Point to the church's tower)"
    source: "White 1835, 'Coast of England', p. 26: the square tower of Mawnan church well open north-east of the lowest point of the Nare Head gives a third of a mile off the Penwin and Vaze; Imray 1874, 'Plymouth to Land's End', p. 92 (the Helford 'between Rosemullion and Nare points') and p. 93 (the same mark, 'Mawnan church ... in one with the lowest part of the Nare head')"
    says: "Rounding the Manacles, do not shut in the Beast until the square tower of Mawnan church is well open to the north-east of the lowest point of the Nare, the Helford's south point."

  - id: manacle-point
    kind: headland
    name: Manacle Point
    modern: Manacle Point
    lat_deg: 50.05375
    lon_deg: -5.05812
    height_m: 40
    source: "White 1835, 'Coast of England', p. 25"
    says: "Manacle Point, the rocks three-quarters of a mile SE by S of it."

  - id: st-keverne-church
    kind: church
    name: St Keverne church
    modern: St Keverne church tower
    lat_deg: 50.0440
    lon_deg: -5.0930
    height_m: 110
    source: "White 1835, 'Coast of England', p. 26; Imray 1874, p. 90 (the mark for St Just Pool)"
    says: "St Keverne church, on the high ground behind the Manacles; a mark for Cross Road and St Just Pool."

  - id: helford-river
    kind: place
    name: Helford river
    modern: Helford River
    lat_deg: 50.09462
    lon_deg: -5.10180
    height_m: 10
    source: "Imray 1874, 'Plymouth to Land's End', p. 92"
    says: "The Helford river, a deep inlet between Rosemullion Head and the Nare, with the Gedges at its mouth."

  - id: the-gedges
    kind: rock
    name: the Gedges
    modern: August Rock (the Gedges)
    lat_deg: 50.0985
    lon_deg: -5.1050
    height_m: 0
    extent_m: 150
    source: "Imray 1874, 'Plymouth to Land's End', p. 92"
    says: "The Gedges rocks at the mouth of the Helford, on the northern side of the entrance."

  - id: rosemullion-head
    kind: headland
    name: Rosemullion Head
    modern: Rosemullion Head
    lat_deg: 50.10712
    lon_deg: -5.08574
    height_m: 40
    source: "Imray 1874, 'Plymouth to Land's End', p. 92"
    says: "Rosemullion Head, the north point of the Helford's mouth."

  - id: mawnan-church
    kind: church
    name: Mawnan church
    modern: Mawnan church (St Mawnan and St Stephen)
    lat_deg: 50.1063
    lon_deg: -5.1010
    height_m: 60
    source: "White 1835, 'Coast of England', p. 25"
    says: "The square tower of Mawnan church, above the Helford's north shore: the mark for the Penwin and the Vaze."

  - id: nare-point
    kind: headland
    name: Nare Point
    modern: Nare Point (the Helford's south side)
    lat_deg: 50.08668
    lon_deg: -5.08646
    height_m: 30
    fix: "Package 33b (playtest 12): named Nare Point, as Imray 1874 names it in the Helford's paragraph, to keep it apart from the Nare Head of the Roseland (nare-head); White 1835 writes 'the Nare Head' for this point too, in the Manacles' paragraph"
    source: "White 1835, 'Coast of England', pp. 25 to 26 (the Manacles' mark); Imray 1874, 'Plymouth to Land's End', p. 92: the Helford's entrance 'lies between Rosemullion and Nare points'"
    says: "Nare Point, the south point of the Helford's mouth, whose lowest point in one with Mawnan church is the mark for the Penwin and the Vaze; White calls it the Nare Head, and the Nare Head of the Roseland lies east of Falmouth."

  # ---------------------------------------------------------------------------
  # Falmouth: the harbour, the Roads and the marks
  # ---------------------------------------------------------------------------

  - id: pendennis-castle
    kind: castle
    name: Pendennis castle
    modern: Pendennis Castle
    lat_deg: 50.14631
    lon_deg: -5.04966
    height_m: 71
    source: "Imray 1874, 'Plymouth to Land's End', p. 88: Pendennis castle on the western side of the entrance, 233 feet above high water"
    says: "Pendennis castle, on its height on the western side of the entrance, two hundred and thirty feet above the water."
    view: "Serres 1801, plate 13, 'Pendennis Castle'"

  - id: pendennis-point
    kind: headland
    name: Pendennis Point
    modern: Pendennis Point
    lat_deg: 50.14597
    lon_deg: -5.05045
    height_m: 30
    source: "Imray 1874, 'Plymouth to Land's End', p. 88"
    says: "Pendennis Point, the Black Rock E by S a third of a mile from it."

  - id: st-anthony-head
    kind: headland
    name: St Anthony's Head
    modern: St Anthony Head (Zone Point)
    lat_deg: 50.14222
    lon_deg: -5.01375
    height_m: 22
    source: "White 1835, 'Coast of England', p. 26; Imray 1874, p. 88"
    says: "St Anthony's Point, the eastern side of the entrance; give it a good berth, and in hazy weather two cables."
    view: "Serres 1801, plate 13, 'St Mawes'"

  - id: st-anthony-light
    kind: light
    name: St Anthony's light
    modern: St Anthony's Lighthouse
    lat_deg: 50.14194
    lon_deg: -5.01363
    height_m: 22
    lit: {from: 1835, until: null, range_nm: 13, character: "revolving, a bright face every twenty seconds"}
    source: "White 1835, 'Coast of England', p. 26 (note): 'a light-house is now erecting on this point'; Imray 1874, p. 89: the white stone lighthouse, 72 feet above high water, visible about 13 miles; Trinity House, 'St Anthony's Lighthouse' (1835)"
    says: "The lighthouse on St Anthony's point, white stone, established in 1835; in 1805 there was none."

  - id: black-rock-falmouth
    kind: drying
    name: the Black Rock
    modern: Black Rock (Falmouth)
    lat_deg: 50.14205
    lon_deg: -5.03364
    height_m: 2
    dries_m: 3  # showing at half-tide: judgement, the mean level above the datum
    extent_m: 100
    source: "White 1835, 'Coast of England', p. 26; Imray 1874, p. 89: nearly in the middle of the entrance, appears at half-tide; a perch with a ball on it (later)"
    says: "The Black Rock, nearly in the middle of the entrance and almost opposite Pendennis castle, showing at half-tide; the eastern channel is the better."

  - id: falmouth-eastern-channel
    kind: transit
    name: Killiganoon house on with Mylor Point
    modern: the eastern channel's leading line, N by E
    lat_deg: 50.1500
    lon_deg: -5.0260
    marks: [mylor-point, st-anthony-head]
    bearing_deg: 11
    source: "White 1835, 'Coast of England', p. 26: Killiganoon House on with Milor Point bearing N 1/4 E carries a ship in mid-channel through Carrick Road"
    says: "The leading mark for the eastern channel: Killiganoon house on with Mylor Point, bearing north a quarter east, carries a ship in mid-channel through Carrick Road."

  - id: falmouth-western-channel
    kind: transit
    name: Feock house on with Mylor Point
    modern: the western channel's leading line, N by E half E
    lat_deg: 50.1440
    lon_deg: -5.0380
    marks: [mylor-point, pendennis-point]
    bearing_deg: 17
    source: "White 1835, 'Coast of England', p. 26: frigates not drawing more than 18 feet may pass between the Black Rock and Pendennis Point; Feock House on with Milor Point, N by E half E, carries a ship over Falmouth Bank in 5 fathoms at half-tide"
    says: "Frigates drawing not more than eighteen feet may pass between the Black Rock and Pendennis Point, Feock house on with Mylor Point; at half-tide there is water for ships of the line."

  - id: st-mawes-castle
    kind: castle
    name: St Mawes castle
    modern: St Mawes Castle
    lat_deg: 50.1560
    lon_deg: -5.0240
    height_m: 25
    source: "Imray 1874, 'Plymouth to Land's End', p. 89"
    says: "St Mawes castle, on the eastern shore above the entrance, the Lugo rock a sixth of a mile SSW of it."

  - id: lugo-rock
    kind: rock
    name: the Lugo rock
    modern: Lugo Rock
    lat_deg: 50.1540
    lon_deg: -5.0250
    height_m: 0
    extent_m: 80
    source: "Imray 1874, 'Plymouth to Land's End', p. 89"
    says: "The Lugo rock, a dangerous patch a sixth of a mile SSW from St Mawes castle."

  - id: st-mawes-bank
    kind: bank
    name: St Mawes bank
    modern: St Mawes Bank
    lat_deg: 50.1560
    lon_deg: -5.0300
    height_m: 0
    dries_m: -2.4  # eight to fifteen feet on it: the least
    extent_m: 500
    depth_fathoms: 2
    source: "Imray 1874, 'Plymouth to Land's End', p. 89: a hard bank with 8 to 15 feet on it, its edge steep; White 1835, p. 26: not within 9 or 8 fathoms"
    says: "St Mawes bank, a hard flat stretching from the eastern shore above the castle almost halfway across, eight to fifteen feet on it and thirteen or fourteen fathoms at its steep edge."

  - id: falmouth-bank
    kind: bank
    name: Falmouth bank
    modern: Falmouth Bank
    lat_deg: 50.1500
    lon_deg: -5.0430
    height_m: 0
    dries_m: -4.6  # two fathoms and a half to three on it: the least
    extent_m: 600
    depth_fathoms: 3
    source: "Imray 1874, 'Plymouth to Land's End', p. 89: 2 1/2 to 3 fathoms, decreasing to a foot at Penarrow point; White 1835, p. 26: 20 feet on the foul spots within the Black Rock"
    says: "Falmouth bank, stretching from Pendennis Point across the approach to the town, two fathoms and a half to three on it, and within the Black Rock some spots of foul ground with twenty feet at low water springs."

  - id: governor-rock
    kind: rock
    name: the Governor
    modern: Governor Rock
    lat_deg: 50.1530
    lon_deg: -5.0400
    height_m: 0
    dries_m: -3.7  # a two-fathom patch
    source: "Imray 1874, 'Plymouth to Land's End', p. 90: a 2-fathom patch a cable within the edge of Falmouth bank"
    says: "The Governor rock, a two-fathom patch a cable within the edge of Falmouth bank."

  - id: carrick-road
    kind: anchorage
    name: Carrick Road
    modern: Carrick Roads
    lat_deg: 50.16307
    lon_deg: -5.03453
    height_m: 0
    depth_fathoms: 12
    bottom: "good holding ground"
    source: "Imray 1874, 'Plymouth to Land's End', p. 90: between St Mawes and Falmouth banks, 7 to 17 fathoms, the channel 320 fathoms wide, the usual anchorage for ships of war; White 1835, p. 27: keep the hawse open, southerly winds throw in much sea"
    says: "Carrick Road, between St Mawes and Falmouth banks, seven to seventeen fathoms, the usual anchorage for ships of war; moored here the hawse must be kept open, for southerly winds throw in much sea."

  - id: cross-road
    kind: anchorage
    name: Cross Road
    modern: Cross Roads
    lat_deg: 50.1780
    lon_deg: -5.0270
    height_m: 0
    depth_fathoms: 10
    bottom: "mud"
    source: "Imray 1874, 'Plymouth to Land's End', p. 90; White 1835, p. 26: the Summer-house open of Falmouth church leads through Cross Road till St Keverne church opens east of Pendennis Point"
    says: "Cross Road, between the north edge of St Mawes bank and the bank off Penarrow; better shelter than Carrick Road, though far from the town."

  - id: st-just-pool
    kind: anchorage
    name: St Just Pool
    modern: St Just Pool
    lat_deg: 50.18260
    lon_deg: -5.02818
    height_m: 0
    depth_fathoms: 14
    bottom: "mud"
    source: "White 1835, 'Coast of England', p. 26: anchor in St Just Pool in 14 or 15 fathoms with St Keverne church open east of Pendennis Point; Imray 1874, p. 90: 12 or 15 fathoms, muddy bottom, several first-class ships of war at moorings"
    says: "St Just Pool, fourteen or fifteen fathoms on mud, room for several ships of the line at moorings; St Keverne church over Pendennis Point is the mark."

  - id: mylor-point
    kind: headland
    name: Mylor Point
    modern: Penarrow Point (Mylor)
    lat_deg: 50.18606
    lon_deg: -5.02659
    height_m: 15
    source: "White 1835, 'Coast of England', p. 26 ('Milor Point'); Imray 1874, p. 89 ('Milor or Penarrow point')"
    says: "Mylor or Penarrow Point, on the western shore of the Road, from which an extensive bank runs a long way up the river."

  - id: trefusis-point
    kind: headland
    name: Trefusis Point
    modern: Trefusis Point
    lat_deg: 50.16669
    lon_deg: -5.04629
    height_m: 20
    source: "White 1835, 'Coast of England', p. 26"
    says: "Trefusis Point, the rising ground over which St Budock church comes when a ship has run through Carrick Road."

  - id: falmouth-town
    kind: town
    name: Falmouth
    modern: Falmouth
    lat_deg: 50.15346
    lon_deg: -5.06946
    height_m: 25
    source: "Imray 1874, 'Plymouth to Land's End', pp. 88 and 90: the anchorage off the town in 3 fathoms decreasing to one at Flushing; White 1835, p. 26"
    says: "Falmouth, the town under Pendennis, its church a mark; the anchorage before it in three fathoms shoaling to one at Flushing, and the packets' quay."

  - id: falmouth-church
    kind: church
    name: Falmouth church
    modern: King Charles the Martyr, Falmouth
    lat_deg: 50.1530
    lon_deg: -5.0730
    height_m: 30
    source: "White 1835, 'Coast of England', p. 26; Imray 1874, p. 90"
    says: "Falmouth church, a mark with the Summer-house for Cross Road."

  - id: st-budock-church
    kind: church
    name: St Budock church
    modern: Budock church
    lat_deg: 50.1580
    lon_deg: -5.0980
    height_m: 90
    source: "White 1835, 'Coast of England', p. 26; Imray 1874, p. 90 ('Budoc church in line with the centre of Swan pool')"
    says: "St Budock church, on the hill behind Falmouth: the mark for the outer road with Swanpool."

  - id: falmouth-outer-road
    kind: anchorage
    name: Falmouth outer road
    modern: Falmouth Bay
    lat_deg: 50.1330
    lon_deg: -5.0350
    height_m: 0
