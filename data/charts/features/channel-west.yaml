    source: "Faden 1793, 'Rocks called Le Gouemont and La Vandree', p. 58"
    says: "The Gouemont and the Vandrée, two rocks half a league south of St Matthew's Point with twelve or thirteen feet on them at low water springs."

  - id: basses-du-lis
