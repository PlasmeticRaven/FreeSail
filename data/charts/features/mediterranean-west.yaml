# The features of the Mediterranean west, the Strait's east bound (5 W) to Cape Palos and
# Cartagena with the island of Alboran, and the Barbary coast from Ceuta's east by the
# Peñon de Velez, Alhucemas, Melilla and the Zafarines to Oran and Mers-el-Kebir (package
# 79c, the block's first region; the second, `balearics`, beyond 0.05 E): hazards, marks,
# lights with their dates, places, anchorages and bottom notes, in the period's words,
# each with its source in the references' form (docs/references/README.md), on the rules
# of channel-west.yaml's head, read from:
#
#   Tofiño 1787     Vicente Tofiño de San Miguel, Derrotero de las costas de España en el
#                   Mediterráneo y su correspondiente de África (Madrid, Ibarra, 1787;
#                   docs/references/pilots/tofino-1787-derrotero-costas-espana-mediterraneo-ocr.txt),
#                   cited by his marginal headings and printed pages. His soundings are brazas
#                   of two Castilian varas (1.672 m; x 0.914 to fathoms), his feet the pie de
#                   Burgos (0.279 m), his bearings true, his miles of sixty to the degree, his
#                   longitudes from Cadiz's meridian.
#   Purdy 1826      John Purdy, The New Sailing Directions for the Mediterranean Sea (Internet
#                   Archive newsailingdirec01purdgoog), much of it Tofiño's in English, later
#                   than the period: where it adds to Tofiño the entry says so.
#   Purdy 1840      his New Sailing Directory for the Strait and the Western Division, its
#                   'Pharonology' for the lights' later history.
#   Smyth 1854      W. H. Smyth, The Mediterranean, the table of positions (Part V).
#
# Positions are in the modern frame (WGS 84, the EMODnet DTM 2024 grid the tiles are cut
# from): first placed from the modern chart as remembered or from the pilot's bearings,
# as each entry's `fix` says, then checked against the block's tiles by channel-west.yaml's
# rule (a headland, island, town, castle, church, tower or hill to the nearest land within
# 800 m; a light to the nearest land within 400 m; a rock, ledge, shoal or bank to the
# shoalest head of the tiles within 400 m, never onto the land above two metres; an
# anchorage to water holding half the pilot's depth within 800 m), by a script kept
# outside the repository; a move is said in `fix`. Where the first placing missed by more
# than the rule's reach the mark was moved to the nearest land or water beyond it and the
# `fix` says so (the mark's place is then the coast's, a cable or two, not the remembered
# point). An isle the grid lacks (EMODnet's cells some 115 m interpolate across it) is a
# `rock` of its height with an `extent_m` of its size, so that a ship cannot sail through
# it (docs/dev/ChartBlocks.md). Heights are above the sea for the horizon; a height not
# from a pilot is FROM MEMORY or JUDGEMENT as marked.
#
# The modern ports are the grid's land or dredged water where 1805 had beach and road
# (Málaga's, Almería's, Cartagena's Escombreras over its bay, Palma's, Oran's, Algiers'):
# no period sheet is read with its datum here, so no patch; the port files say
# `datum: unverified`.
#
# The lead reviews this list against the sources before the merge: the citation is on
# every line for that.
#
# The lights of 1805: Málaga's mole lantern alone (Tofiño 1787 p. 34, 'la linterna del
# Muelle'; its first lighting UNVERIFIED before him, taken from 1787). Tofiño names no
# light at Cartagena, Cape de Gata, Alboran, Cape Palos, Melilla or Oran; Mers-el-Kebir's
# 'linterna' is a tower of the castle (Tofiño p. 147), its light only planned in 1837
# (Bérard 1837, pp. 172 to 173). The later lights (Cape de Gata's, Alboran's, Cape Palos's,
# Mers-el-Kebir's) are not entered: no year for them is read here, and 1805 has none.
# Estepona (5.15 W) and Tetuan are the Strait's (`strait`), west of 5 W.

