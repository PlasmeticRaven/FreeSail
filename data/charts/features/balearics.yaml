  dries_m: -1.7
  source: 'Tofiño 1787, pp. 160 to 161: at a quarter of the distance from the little Dado (the southern) to the great, N 50° W, a shoal with one braza on it where the sea commonly breaks; this and the shoal off the Malvins are the only hidden dangers, the rest of the islets clean and steep-to; p. 182: avoid passing between the two Dados for the shoal between them'
  says: 'Do not pass between the two Dados: there is a shoal of one braza between them on which the sea commonly breaks.'
  fix: a quarter of the way from the little Dado to the great by Tofiño's words; 1 braza (1.7 m); FROM MEMORY of the Daus' places, to be checked; moved 382 m to the shoalest head of the tiles within 400 m (-25.9 m against the datum)
- id: malvins-shoal
