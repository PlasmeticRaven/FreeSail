- id: portmany-road
  kind: anchorage
  name: Port Magno or Port St Antonio
  modern: Badia de Sant Antoni de Portmany
  lat_deg: 38.974
  lon_deg: 1.293
  height_m: 0
  depth_fathoms: 6.4
  bottom: excellent holding ground
  source: 'Tofiño 1787, ''Puerto de San Antonio'', pp. 168 to 169: in summer good for ships of any number and size, choosing depth and berth as they please, but in winter, for the continual N and NW winds and the sea from that quarter, fit only for small craft, whose holding ground is excellent; the entry has nothing to guard but what is seen: steer for the middle of the mouth, Cape Negrete and Nono in one in 20 brazas, and go in to 6 or 8, letting go where the church bears about ENE; moor NE and SW, the sheet anchor to the SW'
  says: 'Anchored in Port Magno in seven brazas, the church of St Antonio bearing east-north-east, moored north-east and south-west: a summer road, for the north-westers send in a sea in winter.'
