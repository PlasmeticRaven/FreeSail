  says: Off the north end of the great Malvin, two-thirds of a cable to the north-west, a shoal of one braza.
  fix: two-thirds of a cable NW by W of the islet's north end, the islet placed by Tofiño's bearing from the castle; 1 braza (1.7 m); moved 237 m to the shoalest head of the tiles within 400 m (-8.0 m against the datum)
