# The features of the Balearics, Ivica, Formentera, Majorca with Cabrera and Minorca with
# Port Mahon, and of the Barbary coast from Arzew to Algiers and Cape Matifu (package 79c,
# the block's second region, beyond 0.05 E; the first, `mediterranean-west`, west of it):
# hazards, marks, lights with their dates, places, anchorages and bottom notes, in the
# period's words, each with its source in the references' form (docs/references/README.md),
# on the rules of channel-west.yaml's head, read from:
#
#   Tofiño 1787     Vicente Tofiño de San Miguel, Derrotero de las costas de España en el
#                   Mediterráneo y su correspondiente de África (Madrid, Ibarra, 1787;
#                   docs/references/pilots/tofino-1787-derrotero-costas-espana-mediterraneo-ocr.txt),
#                   cited by his marginal headings and printed pages. His soundings are brazas
#                   of two Castilian varas (1.672 m; x 0.914 to fathoms), his feet the pie de
#                   Burgos (0.279 m), his bearings true, his miles of sixty to the degree, his
#                   longitudes from Cadiz's meridian.
#   Purdy 1826      John Purdy, The New Sailing Directions for the Mediterranean Sea (Internet
#                   Archive newsailingdirec01purdgoog), much of it Tofiño's in English, later
#                   than the period: where it adds to Tofiño the entry says so.
#   Purdy 1840      his New Sailing Directory for the Strait and the Western Division, its
#                   'Pharonology' for the lights' later history.
#   Smyth 1854      W. H. Smyth, The Mediterranean, the table of positions (Part V).
#
# Positions are in the modern frame (WGS 84, the EMODnet DTM 2024 grid the tiles are cut
# from): first placed from the modern chart as remembered or from the pilot's bearings,
# as each entry's `fix` says, then checked against the block's tiles by channel-west.yaml's
# rule (a headland, island, town, castle, church, tower or hill to the nearest land within
# 800 m; a light to the nearest land within 400 m; a rock, ledge, shoal or bank to the
# shoalest head of the tiles within 400 m, never onto the land above two metres; an
# anchorage to water holding half the pilot's depth within 800 m), by a script kept
# outside the repository; a move is said in `fix`. Where the first placing missed by more
# than the rule's reach the mark was moved to the nearest land or water beyond it and the
# `fix` says so (the mark's place is then the coast's, a cable or two, not the remembered
# point). An isle the grid lacks (EMODnet's cells some 115 m interpolate across it) is a
# `rock` of its height with an `extent_m` of its size, so that a ship cannot sail through
# it (docs/dev/ChartBlocks.md). Heights are above the sea for the horizon; a height not
# from a pilot is FROM MEMORY or JUDGEMENT as marked.
#
# The modern ports are the grid's land or dredged water where 1805 had beach and road
# (Málaga's, Almería's, Cartagena's Escombreras over its bay, Palma's, Oran's, Algiers'):
# no period sheet is read with its datum here, so no patch; the port files say
# `datum: unverified`.
#
# The lead reviews this list against the sources before the merge: the citation is on
# every line for that.
#   Vargas Ponce 1787  José Vargas Ponce, Descripciones de las islas Pithiusas y Baleares
#                   (the islands' towns and works); Grasset 1807, Voyage dans les îles
#                   Baléares et Pithiuses ... 1801 à 1805 (Mahon's lazaretto and hospital);
#   Bérard 1837     Auguste Bérard, Description nautique des côtes de l'Algérie (the French
#                   survey of 1831 to 1833: the land and the water, not the French works
#                   after 1830); Michelot 1709 and 1715 (the Algiers lantern).
#
# The lights of 1805: Porto Pí's tower by Palma (a lantern lit every night, Tofiño 1787
# p. 185; Vargas Ponce 1787 p. 36, the privilege of 1369) and Algiers' mole lantern
# (Michelot 1709, 'une lanterne qu'on allume le soir'; Michelot 1715 p. 90; Tofiño 1787
# p. 152 names the lantern). No other light in the region in 1805: Purdy 1840's
# Pharonology finds 'no regular light-towers' in the Balearics but Palma's; the later
# lights are not entered. Port Mahon is placed by hand on the tiles by Tofiño's plan of
# its entry (pp. 211 to 213): its islands, which the grid lacks, are rocks of their
# height, and his passage between them and the south shore is left open.

region: balearics
features:
- id: ivica-castle
  kind: castle
  name: the castle of Iviza
  modern: Dalt Vila, the castle and walled town of Eivissa
  lat_deg: 38.9067
  lon_deg: 1.436
  height_m: 85
  source: 'Tofiño 1787, ''Derrotero de la isla de Iviza'', p. 159: N 18° 15'' E of the tower of las Portas, 3 miles, the castle of Iviza; p. 160: the west side of the harbour is the land from Punta Ratyada north to a point with a little tower called the Torreón del Mar, and on the height of that land stand the castle and city of Iviza; Purdy 1826, ''Island Iviza'', p. 33: the castle about three miles N 18° 15'' E from the tower of Las Portas'
  says: The castle and city of Iviza on the height at the west side of the harbour, three miles north-north-east of the tower of las Portas.
  fix: FROM MEMORY, the castle on the summit of Dalt Vila; the height JUDGEMENT (the hill under the castle)
- id: ivica-harbour-anchorage
  kind: anchorage
  name: the harbour of Iviza
  modern: Port d'Eivissa, the outer harbour between Dalt Vila and Botafoc
  lat_deg: 38.9095
  lon_deg: 1.444
  height_m: 0
  depth_fathoms: 6.9
  bottom: unstated; the best berth in 7 or 8 brazas
  source: 'Tofiño 1787, ''Entrada en el puerto de Iviza'', pp. 181 to 182: steer for the middle of the mouth, leaving Isla Grosa and Botafuego to starboard and Punta Ratyada and the Isla Negra to port, and in 7 or 8 brazas, which is the best, let go, the best bower to the SW, keeping nearer Isla Plana than the city, so as to give the end of a cable or hawser to it in hard easterly winds; in winter, when the N and NW blow hard, back the NE anchor, for they drag easily; the entry not to be attempted by night without much practice; Purdy 1826, p. 33, the same in English (''7 or 6 1/2 fathoms'')'
  says: Anchored in the harbour of Iviza in seven brazas, nearer Isla Plana than the town, the best bower to the south-west and a hawser ready for the island.
  fix: FROM MEMORY, the middle of the mouth between Botafoc and the town; 7 1/2 brazas (6.9 fathoms)
- id: isla-grosa-ivica
  kind: island
  name: the Isla Grossa
  modern: Illa Grossa (Eivissa harbour, now joined to the Botafoc breakwater)
  lat_deg: 38.9042
  lon_deg: 1.4558
  height_m: 30
  source: 'Tofiño 1787, p. 159: N 40° E 3 1/2 miles from the tower of las Portas the south end of Isla Grosa, which, or an islet close to its west side called the Botafuego, with Punta Ratyada or the Isla Negra on its east, form the mouth of the harbour of Iviza; Grosa and Plana of some height, separated by a channel of 1/2 braza that fishermen pass in fine weather; p. 182: coming from the east pass between the south point of Isla Grosa and the Dado grande, 3/4 mile, very deep and steep-to; Purdy 1826, p. 33'
  says: 'The Isla Grossa, the east side of the mouth of Iviza harbour: from the eastward pass between its south point and the great Dado, three-quarters of a mile, deep and clean.'
  fix: FROM MEMORY; the height JUDGEMENT; moved 35 m to the nearest land of the tiles
- id: botafoc
  kind: island
  name: Botafuego
  modern: Illa de Botafoc (now under the breakwater and its light)
  lat_deg: 38.9086
  lon_deg: 1.4503
  height_m: 10
  source: 'Tofiño 1787, p. 159: an islet close to the west side of Isla Grosa called the Botafuego, which with Punta Ratyada forms the mouth of the harbour; up to two brazas in the channel between Botafuego and Isla Grosa; p. 182: abreast of the south point of Isla Grosa stand on to be abreast of Botafuego, and that passed, go for the anchorage; Purdy 1826, p. 33 (''Botafuego'')'
  says: 'Botafuego, the islet under the west side of the Isla Grossa: when it is passed, bear up for the anchorage of Iviza.'
  fix: FROM MEMORY; the height JUDGEMENT; moved 202 m to the nearest land of the tiles
- id: dados-shoal
