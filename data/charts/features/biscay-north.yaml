# The features of Biscay north, the Raz de Sein to the Pertuis d'Antioche (spec M6 §26;
# package 39b): hazards, marks, lights with their dates, places, anchorages and bottom
# notes, in the period's words, each with its source in the references' form
# (docs/references/README.md), on the rules of channel-west.yaml's head, read from:
#
#   Faden 1793      Le Petit Neptune Français; or, French Coasting Pilot (Internet Archive
#                   lepetitneptunefr00fade), the OCR text, chapter IV, 'Directions for
#                   sailing on the coast of France in the Bay of Biscay', pp. 65 to 84 (the
#                   Raz of Fontenay to the Pertuis de Maumusson); 'Tides and Currents',
#                   pp. 92 to 93; Du Bocage's 'Account of the depths of water and nature of
#                   the ground, from the Beg du Raz to the mouth of the river of
#                   Bourdeaux', pp. 93 to 94. In his translation's fathoms and leagues.
#   Bellin 1764     Petit Atlas Maritime t. V no. 85, 'Carte de l'entrée de la Charente et
#                   environs de Rochefort' (David Rumsey 6903.572), read at full resolution
#                   through the collection's IIIF server: the Aix road's patch
#                   (overrides/biscay-north/aix-basque-roads.yaml) and its names.
#   encyclopaedia   the French encyclopaedia's pages for the lights and the places named in
#                   each entry, read 2026-10-09 (positions and dates).
#   SHOM            the Références Altimétriques Maritimes (data.gouv.fr's record; the WFS
#                   layer RAM_BDD_WLD_WGS84G_WFS:ram_3857, read 2026-10-09): the tide
#                   gauges' and the ports' positions where a feature is a port's.
#
# The block's marks of the Raz de Sein that lie north of 48 N (La Vieille, the Plate,
# Tévennec, the Pont des Chats, the Chaussée de Sein, the Raz's passage, Audierne) are
# channel-west's region and are in channel-west.yaml, as the region's bounds have it.
#
# Positions are in the modern frame (WGS 84, the EMODnet DTM 2024 grid the tiles are cut
# from): first placed from the encyclopaedia's coordinates or the modern chart as each
# entry says, then checked against the chart's coast and EMODnet's shoalest sounding by
# channel-west.yaml's rule (a headland, island, town, castle, church, mill, tower to the
# nearest land within 800 m; a light to the nearest land or shoal head within 400 m; a
# rock or ledge to the nearest shoal head within 400 m; an anchorage to water holding
# half the pilot's depth within 800 m); where a position rests on a pilot's bearing and
# distance alone the entry says so in `fix`. Heights are above the sea for the horizon:
# JUDGEMENT throughout, from the grid's own land about the mark (Groix 40 m, Belle Isle
# 46, Houat and Yeu 26 under the mark) and the encyclopaedia's towers where a light's
# entry cites them (the Baleines' 29 m, Yeu's 54 above the sea).
#
# The lights of 1805: the Baleines (Vauban's tower, a fire every night, Faden p. 80) and
# Chassiron (a fire of wood in two places, p. 81) were lit; Penmarch, Goulphar on Belle
# Île, the Pilier, Yeu, Groix's Pen Men and the Teignouse were not yet, and carry the
# year they were first lit so that 1805 does not see them. The tower of Cordouan is
# biscay-south's (package 39c).
#
# The lead reviews this list against the sources before the merge: the citation is on
# every line for that.

region: biscay-north
features:

  # ---------------------------------------------------------------------------
  # The Raz's southern side, the Bay of Audierne and the Penmarks
  # ---------------------------------------------------------------------------

  - id: raz-soundings
    kind: bottom
    name: the soundings two leagues south-west of the Raz
    modern: the approach to the Raz de Sein from the south
    lat_deg: 47.9700
    lon_deg: -4.8400
    height_m: 0
    bottom: "very fine grey and white sand"
    depth_fathoms: 25
    source: "Faden 1793, Du Bocage's account, p. 93: two leagues S W of the Raz, 25 to 26 fathoms, very fine grey and white sand"
    says: "Two leagues south-west of the Raz the lead finds twenty-five or twenty-six fathoms on very fine grey and white sand."
    fix: "the pilot's bearing and distance from the Raz, two leagues (six miles) south-west; the modern grid has 40 to 50 m there"

  - id: la-gamelle
    kind: ledge
    name: La Gamelle
    modern: La Gamelle (the rocks before Audierne)
    lat_deg: 47.9980
    lon_deg: -4.5450
    height_m: 0
    extent_m: 600
    source: "Faden 1793, 'Hodierne', p. 65: before it lies E S E and W N W a great rocky bank called La Gamette, distant from the shore a quarter of a league; ships pass between this bank and the land on the east as well as the west side"
    says: "La Gamelle, a great rocky bank a quarter of a league off Audierne, lying east-south-east and west-north-west; ships pass inside it by either end, steering near the shore."
    fix: "the pilot's distance from the shore, a quarter of a league south of the harbour's mouth; the modern grid's shoal heads there"

  - id: penmarch-point
    kind: headland
    name: the Penmarks
    modern: Pointe de Penmarc'h (Pointe Saint-Pierre)
    lat_deg: 47.7983
    lon_deg: -4.3728
    height_m: 10
    source: "Faden 1793, 'Penmark Rocks', p. 65: from Hodierne to the rocks of Penmark the coast runs S E a little southerly, forming a great bay; it is all high land till within a small distance of these rocks, where it sinks into a valley; the encyclopaedia's 'Phare d'Eckmühl' for the point's position"
    says: "The Penmarks, a low point where the high land of the Bay of Audierne sinks into a valley, with a town and several churches on it and a great number of rocks off it."

  - id: penmarch-town
    kind: town
    name: Penmark
    modern: Penmarc'h (Saint-Guénolé and Kérity)
    lat_deg: 47.8128
    lon_deg: -4.3367
    height_m: 25
    source: "Faden 1793, 'Penmark Rocks', p. 65: a valley on which you see a town and several churches; the encyclopaedia's 'Penmarch' for the position"
    says: "The town of Penmark in its valley behind the point, with several church towers, the mark for the rocks."

  - id: penmarch-rocks
    kind: ledge
    name: the Rocks of Penmark
    modern: les Étocs and the rocks of Penmarc'h
    lat_deg: 47.7938
    lon_deg: -4.3888
    height_m: 2
    extent_m: 800
    source: "Faden 1793, 'Penmark Rocks', pp. 65 to 66: at full three quarters of a league from this town a great number of rocks are above and under water, with some passages between them for barks and small ships, known only to the people of the place; the coast from the rocks to the river of Pont l'Abbé is full of banks and rocks which extend near a league in breadth"
    says: "The Rocks of Penmark, a great number above and under water three quarters of a league off the town, with passages known only to the people of the place: give them a wide berth."
    fix: "the pilot's distance from the town; the Étocs west of the point, where the modern grid's heads stand"

  - id: penmarch-light
    kind: light
    name: the Penmarks light
    modern: the old light of Penmarc'h (beside the Phare d'Eckmühl)
    lat_deg: 47.7979
    lon_deg: -4.3735
    height_m: 41
    lit: {from: 1835, until: 1897, range_nm: 16, character: "a fixed light (not yet built in 1805)"}
    source: "The encyclopaedia's 'Phare d'Eckmühl' (read 2026-10-09): before the tower of 1897 the 'Vieille tour' by the chapel of Saint-Pierre, a watch tower and perhaps a fire tower in the fifteenth century, then the 'phare de Penmarc'h', put in service in 1835, forty metres high, the direct predecessor of Eckmühl; not lit in 1805"
    says: "The Penmarks light, which was not yet built in 1805."

  - id: pont-labbe-road
    kind: anchorage
    name: the anchorage under the Isle Tudy
    modern: the mouth of the river of Pont-l'Abbé, Loctudy and Île-Tudy
    lat_deg: 47.8372
    lon_deg: -4.1640
    height_m: 0
    depth_fathoms: 2
    bottom: "sand"
    source: "Faden 1793, 'River du Pont l'Abbé', p. 66: little frequented and accessible only at high water, almost barred with banks; within, wide enough, with anchorage under the shelter of a little isle called L'Isle Tudy; the encyclopaedia's 'Île-Tudy' and 'Loctudy' for the position"
    says: "The river of Pont l'Abbé, almost barred with banks and accessible only at high water; within it a ship lies under the shelter of the Isle Tudy."

  - id: benodet-road
    kind: anchorage
    name: the anchorage before Benauder
    modern: the mouth of the Odet at Bénodet
    lat_deg: 47.8687
    lon_deg: -4.1082
    height_m: 0
    depth_fathoms: 6
    bottom: "sand"
    source: "Faden 1793, 'The River of Quimper', p. 66: a rock under water a good quarter of a league without the entrance, south of the eastern point; enter nearer the west side, then re-approach the eastern side till before a town called Benauder, and anchor in 6 or 7 fathoms; the encyclopaedia's 'Bénodet' for the position"
    says: "The river of Quimper: enter by the west side for the rock under water off the eastern point, then close the eastern shore and anchor before Benauder in six or seven fathoms."

  - id: concarneau
    kind: town
    name: Concarneau
    modern: Concarneau, the Ville close
    lat_deg: 47.8706
    lon_deg: -3.9178
    height_m: 15
    source: "Faden 1793, 'Concarneau', p. 66: rocks above and under water at the entrance on both sides leaving only a small channel in the middle; the mark to enter, a castle on the east side brought in a line with a mill farther up the country; anchor before Concarneau in 4 or 5 fathoms; the encyclopaedia's 'Ville close de Concarneau'"
    says: "Concarneau, its walled town and castle on an islet in the harbour; rocks on both sides of the entrance leave a small channel in the middle, the castle in a line with the mill up the country leading in."

  - id: concarneau-road
    kind: anchorage
    name: the anchorage before Concarneau
    modern: the Baie de la Forêt off Concarneau
    lat_deg: 47.8640
    lon_deg: -3.9250
    height_m: 0
    depth_fathoms: 4
    bottom: "sand and mud"
    source: "Faden 1793, 'Concarneau', p. 66: then you may anchor before Concarneau in 4 or 5 fathoms water; the tides at above 4 o'clock"
    says: "Before Concarneau a ship anchors in four or five fathoms."

  - id: glenan-isles
    kind: island
    name: the Isles of Glenan
    modern: l'archipel des Glénan
    lat_deg: 47.7220
    lon_deg: -3.9983
    height_m: 15
    extent_m: 4000
    source: "Faden 1793, 'Isles of Glenan', p. 67: about 3 leagues south of Concarneau harbour, a cluster of small islands making a good haven where a ship may lie under cover from all winds, but the entrance difficult; encompassed on the south and west with rocks above and under water, the north side clear enough; the encyclopaedia's 'Archipel des Glénan'"
    says: "The Isles of Glenan, a cluster of small low islands three leagues south of Concarneau, encompassed with rocks on the south and the west; the north side is clear enough."

  - id: glenan-road
    kind: anchorage
    name: the road north of Glenan
    modern: the passage between the Glénan and the main
    lat_deg: 47.7600
    lon_deg: -3.9800
    height_m: 0
    depth_fathoms: 10
    bottom: "sand"
    source: "Faden 1793, 'Isles of Glenan', p. 67: you may sail between the main land and Glenan by steering nearer to that island, and there anchor in 10 or 12 fathoms water; there are several rocks under water by the shores of these islands"
    says: "Between the main and Glenan a ship may anchor in ten or twelve fathoms, keeping nearer the island."

  - id: penfret-light
    kind: light
    name: the light of Penfret
    modern: Phare de Penfret
    lat_deg: 47.7208
    lon_deg: -3.9535
    height_m: 36
    lit: {from: 1838, until: null, range_nm: 15, character: "a light on the east isle of Glenan (not yet built in 1805)"}
    source: "The encyclopaedia's 'Phare de Penfret' (read 2026-10-09): the building finished and the light put in service in 1838; not lit in 1805"
    says: "The light on Penfret, which was not yet built in 1805."

  - id: la-jument-glenan
    kind: rock
    name: La Jument
    modern: La Jument des Glénan
    lat_deg: 47.6595
    lon_deg: -4.0172
    height_m: 0
    source: "Faden 1793, 'Rock called La Jument, or the Mare', p. 67: a league and one third S S W of the west point of Glenan, almost perpetually under water, the sea breaking over it on the least swell; 40 fathoms close by it, but better to pass at a distance"
    says: "The Mare, a rock almost always under water a league and a third south-south-west of Glenan; the sea breaks on it at the least swell."
    fix: "the pilot's bearing and distance from the west point of Glenan; the modern rock of that name, where the grid's head stands"

  - id: isles-aux-moutons
    kind: island
    name: the Sheep Islands
    modern: l'île aux Moutons
    lat_deg: 47.7763
    lon_deg: -4.0246
    height_m: 10
    source: "Faden 1793, 'Isles aux Moutons, or Sheep Islands', p. 67: to the E N E of the east end of the Glenans (in the modern frame, north-west of them); many rocks under water along their south side, the north or land side clear, and one may anchor in 10 or 12 fathoms"
    says: "The Sheep Islands, with rocks under water to the south of them and clear water on the land side."

  - id: soundings-south-of-glenan
    kind: bottom
    name: the soundings south of Glenan
    modern: the shelf south of the Glénan
    lat_deg: 47.3500
    lon_deg: -4.0000
    height_m: 0
    bottom: "grey sand speckled with black"
    depth_fathoms: 52
    source: "Faden 1793, Du Bocage's account, p. 94: seven or eight leagues south of Glenan, from 50 to 55 fathoms, grey sand speckled with black"
    says: "Seven or eight leagues south of Glenan the lead finds fifty to fifty-five fathoms on grey sand speckled with black."
    fix: "the pilot's distance south of Glenan, seven leagues and a half"

  # ---------------------------------------------------------------------------
  # Groix, Port Louis and L'Orient
  # ---------------------------------------------------------------------------

  - id: groix
    kind: island
    name: the Isle of Groix
    modern: Île de Groix
    lat_deg: 47.6380
    lon_deg: -3.4650
    height_m: 45
    extent_m: 3000
    source: "Faden 1793, 'Groix, or Grouais', p. 70: directly fronting Port Louis, 2 leagues to the south of it, near a league and a half in length E S E and W N W, with several trees and houses on it; very clear all round except on the S E side"
    says: "The Isle of Groix, two leagues off Port Louis, a league and a half long, with trees and houses on it; clear all round but for the Cat's End on its south-east side."

  - id: bout-des-chats
    kind: ledge
    name: the Cat's End
    modern: la pointe des Chats and its rocks, Groix
    lat_deg: 47.6150
    lon_deg: -3.4150
    height_m: 1
    extent_m: 800
    source: "Faden 1793, 'Groix', p. 70: on the S E side a bank of rocks which stretches half a league into the sea, called Bout des Chats (the cat's end)"
    says: "The Cat's End, a bank of rocks stretching half a league to sea from the south-east end of Groix."
    fix: "the pilot's half league from Groix's south-east point; the modern grid's heads off the Pointe des Chats"

  - id: groix-road
    kind: anchorage
    name: the road of Groix
    modern: the anchorage north-east of Groix
    lat_deg: 47.6560
    lon_deg: -3.4350
    height_m: 0
    depth_fathoms: 12
    bottom: "sand and little pebbles like coral"
    source: "Faden 1793, 'Groix', p. 70: between this isle and the land, nearer the land, is a bank with only 12 or 13 feet on it at low water; the anchorage is between this bank and the isle in 10, 12 to 15 fathoms, on a bottom of sand and little pebbles resembling coral"
    says: "The road of Groix, between the island and the bank toward the land, in ten to fifteen fathoms on sand and little pebbles like coral."

  - id: pen-men-light
    kind: light
    name: the light of Pen Men
    modern: Phare de Pen Men, Groix
    lat_deg: 47.6487
    lon_deg: -3.5098
    height_m: 59
    lit: {from: 1839, until: null, range_nm: 20, character: "the light on the west end of Groix (not yet built in 1805)"}
    source: "The encyclopaedia's 'Phare de Pen-Men' (read 2026-10-09): built in 1836 and put in service in 1839 (a light begun near the place in 1798 was not finished); not lit in 1805"
    says: "The light on the west end of Groix, which was not yet built in 1805."

  - id: port-louis-citadel
    kind: castle
    name: the citadel of Port Louis
    modern: la citadelle de Port-Louis
    lat_deg: 47.7067
    lon_deg: -3.3633
    height_m: 20
    source: "Faden 1793, 'Port Louis', pp. 67 to 68: an excellent harbour with a very good citadel, a town on the eastern side and a large village on the west; the mark to enter, the edge of the citadel in a line with St Catherine, a little convent on a point within; the encyclopaedia's 'Citadelle de Port-Louis'"
    says: "The citadel of Port Louis on the point of the harbour's eastern side, the mark for the entrance with the convent of St Catherine within."

  - id: port-louis
    kind: town
    name: Port Louis
    modern: Port-Louis
    lat_deg: 47.7083
    lon_deg: -3.3550
    height_m: 15
    source: "Faden 1793, 'Port Louis', p. 68: when you are got within the citadel you anchor in 5 or 6 fathoms, or else run aground under the town to the north of it at high tide, the place being dry at every tide; high water at 4 o'clock and a half at full and change; SHOM's RAM, 'Port-Louis (Locmalo)', for the position"
    says: "Port Louis, the town on the eastern side of the harbour's mouth under its citadel; the shore under it dries at every tide."

  - id: port-louis-road
    kind: anchorage
    name: the road of Port Louis
    modern: the anchorage within the citadel of Port-Louis
    lat_deg: 47.7130
    lon_deg: -3.3620
    height_m: 0
    depth_fathoms: 5
    bottom: "mud"
    source: "Faden 1793, 'Port Louis', p. 68: when you are got within the citadel you cast anchor in 5 or 6 fathoms water; p. 69: a ship drawing above 21 feet cannot make for the road of Pennemané but at high water spring tides, and anchors at Port Louis"
    says: "Within the citadel of Port Louis a ship anchors in five or six fathoms; a ship of more than twenty-one feet lies here and not at Pennemané."

  - id: pennemane-road
    kind: anchorage
    name: the road of Pennemané
    modern: the anchorage off Pen-Mané, Locmiquélic
    lat_deg: 47.7333
    lon_deg: -3.3476
    height_m: 0
    depth_fathoms: 4
    bottom: "mud"
    source: "Faden 1793, d'Après de Mannevillette's instructions, p. 69: proceed for the road of Pennemané, leaving the rock Paugarne or Quintrec on the starboard hand; a ship drawing above 21 feet cannot make for this road but at high water spring tides"
    says: "The road of Pennemané above St Michael's island, the anchorage for L'Orient's ships, which a ship of more than twenty-one feet reaches only at high water springs."

  - id: lorient
    kind: town
    name: L'Orient
    modern: Lorient
    lat_deg: 47.7480
    lon_deg: -3.3600
    height_m: 15
    source: "Faden 1793, 'L'Orient', p. 68: three quarters of a league above Port Louis at the bottom of the bay formed by the confluence of the Plotscorf and Blavet rivers, the place from whence the whole Asiatic trade of the French is carried on; the encyclopaedia's 'Lorient'"
    says: "L'Orient at the head of the bay where the Scorff meets the Blavet, the port of the French East India trade and a dockyard of the King's ships."

  - id: lorient-tower
    kind: tower
    name: the tower of L'Orient
    modern: la tour de la Découverte, Lorient
    lat_deg: 47.7493
    lon_deg: -3.3566
    height_m: 38
    source: "Faden 1793, d'Après de Mannevillette's instructions, p. 69: by the middle channel, bring the tower of L'Orient in one with the westernmost bastion of the citadel of Port Louis; the encyclopaedia's 'Lorient' for the signal tower of the enclos (judgement for its height)"
    says: "The tower of L'Orient over the dockyard, the mark for the middle channel in one with the citadel's western bastion."

  - id: larmor-tower
    kind: church
    name: the tower of Larmor
    modern: l'église Notre-Dame de Larmor
    lat_deg: 47.7069
    lon_deg: -3.3836
    height_m: 30
    source: "Faden 1793, d'Après de Mannevillette's instructions, p. 68: from Groix or the offing, keep the tower of Larmor N E 1/2 E 1/2 E by compass till one of the mills east of Port Louis is hid by the town walls, which carries you in mid-channel between the Saisies of Larmor and the Sows"
    says: "The church tower of Larmor on the western shore of the entrance, the leading mark from Groix into the Great Channel."

  - id: les-truies
    kind: ledge
    name: the Sows
    modern: les Truies, the entrance of Lorient
    lat_deg: 47.6860
    lon_deg: -3.3790
    height_m: 1
    extent_m: 250
    source: "Faden 1793, d'Après de Mannevillette's instructions, p. 68: coming from the offing to pass to the westward of the Truyes (the Sows) and the Errants, which they call the Great Channel, you sail in mid-channel between the Saisies of Larmor and the Sows"
    says: "The Sows, rocks off the entrance of Port Louis; the Great Channel runs west of them, between them and the Saisies of Larmor."
    fix: "d'Après's leading line and the modern grid's heads off the entrance; the rocks' name the modern chart's"

  - id: gavres-point
    kind: headland
    name: Gavre
    modern: la pointe de Gâvres
    lat_deg: 47.6920
    lon_deg: -3.3560
    height_m: 8
    source: "Faden 1793, d'Après de Mannevillette's instructions, p. 70: a fountain seen on the beach of Gavre in a line with a single tree on the same part of the peninsula; the third entrance, Gavre Channel, only fit for small vessels"
    says: "The low point of Gavre on the eastern side of the entrance, with the Gavre Channel inside it for small vessels only."

  # ---------------------------------------------------------------------------
  # Quiberon, Houat and Hedic, the Cardinals and the bay
  # ---------------------------------------------------------------------------

  - id: quiberon-point
    kind: headland
    name: Point Quiberon
    modern: la pointe du Conguel, Quiberon
    lat_deg: 47.4770
    lon_deg: -3.0970
    height_m: 8
    source: "Faden 1793, 'Quiberon', p. 70: from Port Louis to Quiberon Point the coast runs S E above 5 1/2 leagues, all low land with downs between; at Point Quiberon is a ledge of rocks which reaches to the isle of Houat"
    says: "Point Quiberon, the low end of the peninsula; a ledge of rocks runs from it to the isle of Houat."

  - id: quiberon-ledge
    kind: ledge
    name: the ledge of Quiberon
    modern: le plateau de la Teignouse and the Quiberon ledges
    lat_deg: 47.4606
    lon_deg: -3.0620
    height_m: 1
    extent_m: 800
    source: "Faden 1793, 'Quiberon', p. 70: at Point Quiberon is a ledge of rocks which reaches to the isle of Houat; 'Houat and Hedic', p. 71: there is no passage between them because of the ledge, contiguous to both (the note: the British ships discovered one, through which Commodore Duff's squadron passed from the Bay of Quiberon in 1759)"
    says: "The ledge from Point Quiberon to Houat, no passage for the French pilots; the British found one in fifty-nine."
    fix: "the pilot's words, from the point to Houat; the middle of the modern plateau"

  - id: la-teignouse
    kind: rock
    name: La Teignouse
    modern: la Teignouse
    lat_deg: 47.4572
    lon_deg: -3.0458
    height_m: 3
    source: "Faden 1793, 'Houat and Hedic', p. 71: a high rock called La Teignouse, wide of all the rest at the N by W end, the mark for passing between Houat and Hedic; the encyclopaedia's 'Phare de la Teignouse' (read 2026-10-09) for the rock's position, between the peninsula of Quiberon and Houat in the prolongation of the Pointe du Conguel"
    says: "La Teignouse, a high rock standing wide of the rest on the ledge between Quiberon and Houat."
    fix: "Faden puts it at Houat's N by W end as the mark for the passage between Houat and Hedic; the modern rock of the name, which the light of 1845 marks, is the one taken"

  - id: teignouse-light
    kind: light
    name: the Teignouse light
    modern: Phare de la Teignouse
    lat_deg: 47.4572
    lon_deg: -3.0458
    height_m: 20
    lit: {from: 1845, until: null, range_nm: 15, character: "a light on the rock (not yet built in 1805)"}
    source: "The encyclopaedia's 'Phare de la Teignouse' (read 2026-10-09): built from 1843, first lit on 1 January 1845; not lit in 1805"
    says: "The light on the Teignouse, which was not yet built in 1805."

  - id: houat
    kind: island
    name: the Isle of Houat
    modern: Houat
    lat_deg: 47.3900
    lon_deg: -2.9600
    height_m: 30
    extent_m: 2500
    source: "Faden 1793, 'Houat and Hedic Islands', p. 71: about 2 leagues to the south of Point Quiberon, about a league in length E S E and W N W, surrounded on the S E and the north with a multitude of rocks above and under water"
