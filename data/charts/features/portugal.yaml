    says: "Before the Berlinga's fort a ship anchors in twelve to fifteen brazas on sand, sheltered from the westward, with water in abundance; she makes sail with any easterly."

  - id: berlenga-light
    kind: light
    name: the Berlinga light
    modern: Farol da Berlenga (Duque de Bragança)
