# The features of Portugal and Cadiz, the Minho to the bay of Cadiz (spec M6 §26; package
# 39d): hazards, marks, lights with their dates, places, anchorages and bottom notes, in the
# period's words, each with its source in the references' form (docs/references/README.md),
# on the rules of channel-west.yaml's head, read from:
#
#   Tofiño 1789     Derrotero de las costas de España en el Océano Atlántico, y de las
#                   Islas Azores (Madrid, 1789; Internet Archive A302201, the copy of the
#                   Universidad de Sevilla, the OCR text): 'Derrotero de la Costa de
#                   Portugal desde el Rio Miño hasta el Cabo de S. Vicente', pp. 74 to 93
#                   (with Pimentel's Portuguese directions quoted, the lines he marks with
#                   commas); 'Descripción de las Islas Berlingas', pp. 83 to 84; 'Descripción
#                   de la Costa de Portugal y España desde el Cabo de S. Vicente hasta Cabo
#                   Trafalgar', pp. 94 to 110; 'Descripción de la Bahía de Cadiz', pp. 111 to
#                   120 (the instruction of the King's pilots of Cadiz); 'desde el Castillo de
#                   S. Sebastian de Cadiz hasta el Cabo Trafalgar', pp. 121 to 122. In period
#                   exactly (his survey of the Portuguese coast in the frigate, 1786 to 1788).
#                   His depths are in brazas of six Castilian feet (1.6718 m: 0.914 of an
#                   English fathom), his leagues of twenty to the degree (three miles), his
#                   bearings magnetic as he gives them.
#   Tofiño 1789,    'Plano del Puerto de Cadiz' (Atlas Marítimo de España, the Universidad
#   the plan        de Sevilla's copy, Internet Archive A062039040 page 24, read at full
#                   resolution): the bay's names and soundings, and the Cadiz override
#                   (overrides/portugal/cadiz-bay.yaml).
#   encyclopaedia   the Portuguese and Spanish encyclopaedias' pages for the lights and the
#                   castles (pt. and es.wikipedia.org, read 2026-10-10): their dates and
#                   positions.
#
# The marks south of 36.4 N (Sancti Petri and its bar, Torre Bermeja and the Barrosa, Cape
# Roche and its ledges, the Marrajotes, the Laja de Plaste, Juan Vela, Conil, Cape
# Trafalgar) are the Strait's region (package 39f) and are not here; Tofiño's pp. 121 to
# 128 give them.
#
# Positions are in the modern frame (WGS 84, the EMODnet DTM 2024 grid the tiles are cut
# from): first placed from the encyclopaedia's coordinates or the modern chart as each
# entry says, then checked against the chart's coast and EMODnet's shoalest sounding by
# channel-west.yaml's rule (a headland, island, town, castle, church, mill, tower to the
# nearest land within 800 m; a light to the nearest land or shoal head within 400 m; a
# rock or ledge to the nearest shoal head within 400 m; an anchorage to water holding
# half the pilot's depth within 800 m); a move is said in `fix`. Heights are above the sea
# for the horizon: JUDGEMENT throughout, the modern chart's heights of the capes and the
# hills (Monchique's Fóia 902 m, Sintra 529, the Arrábida 501, the Cerro de São Miguel
# 410), the grid's own land about the mark elsewhere.
#
# The lights of 1805: the Senhora da Luz at the Douro's mouth (1761), Cabo da Roca (1772),
# the Guia at Cascais (1761), São Julião (1761) and the Bugio (1775) at the Tagus's bar,
# Cabo Carvoeiro (1790), Cabo Espichel's tower (1790), the convent's light on Cape St
# Vincent (relit 1606) and the lantern of San Sebastián at Cadiz (Tofiño's "gran
# Linterna", 1789); not yet: the Berlenga (1842), Cape St Vincent's tower (1846), Cape
# Santa Maria (1851), Cabo Mondego (1858) and Chipiona (1867), which carry the year they
# were first lit so that 1805 does not see them.
#
# The lead reviews this list against the sources before the merge: the citation is on
# every line for that.

region: portugal
features:

  # ---------------------------------------------------------------------------
  # The Minho to the Douro
  # ---------------------------------------------------------------------------

  - id: monte-santa-tecla
    kind: hill
    name: the Mount of Santa Tecla
    modern: Monte de Santa Tecla, A Guarda
    lat_deg: 41.8930
    lon_deg: -8.8710
    height_m: 341
    source: "Tofiño 1789, 'Extremo Norte de la Costa de Portugal', p. 76: S 6 10' E seven miles and a half from the Mount of Santa Tecla is Cape Viana; the mount the north bank of the Minho's mouth"
    says: "The Mount of Santa Tecla over the mouth of the Minho, the last of Spain."

  - id: minho-mouth
    kind: place
    name: the mouth of the Minho
    modern: the mouth of the Minho, between A Guarda and Caminha
    lat_deg: 41.8660
    lon_deg: -8.8620
    height_m: 5
    source: "Tofiño 1789, p. 76: the high range behind Viana, seen sixteen to eighteen leagues off, the first land made, gives knowledge of the mouths of the Minho and the Lima"
    says: "The mouth of the Minho, the bounds of Spain and Portugal."

  - id: viana
    kind: town
    name: Viana
    modern: Viana do Castelo
    lat_deg: 41.6930
    lon_deg: -8.8320
    height_m: 30
    source: "Tofiño 1789, p. 76: on the north side of the river Lima a good town called Viana, very visible for its whiteness; Pimentel: the bar narrow and dangerous, for vessels of small draught, take a pilot"
    says: "Viana on the north bank of the Lima, very visible for its whiteness; its bar narrow and dangerous, for small vessels only."

  - id: viana-road
    kind: anchorage
    name: the anchorage off Viana
    modern: off the mouth of the Lima
    lat_deg: 41.6700
    lon_deg: -8.8650
    height_m: 0
    depth_fathoms: 6.4
    bottom: "sand"
    source: "Tofiño 1789, p. 76, Pimentel: a reef runs south from Cape Viana; to anchor outside it in seven, eight or nine brazas put the town north-east"
    says: "Without the reef of Cape Viana a ship anchors in seven to nine brazas with the town north-east of her."
    fix: "Pimentel's bearing of the town and his depth; the bottom not given (sand by the coast's character, judgement)"

  - id: cavalos-de-fao
    kind: ledge
    name: the Horses of Fão
    modern: Cavalos de Fão, off Esposende and Fão
    lat_deg: 41.5150
    lon_deg: -8.7980
    height_m: 0
    extent_m: 600
    source: "Tofiño 1789, p. 77, Pimentel: off the town of Fão two reefs of stone level with the water run out half a league to sea, called the Horses of Fão; do not come under fifteen brazas near them"
    says: "The Horses of Fão, two reefs of rock awash half a league off the town: keep in fifteen brazas."

  - id: vila-do-conde
    kind: town
    name: Villa do Conde
    modern: Vila do Conde
    lat_deg: 41.3530
    lon_deg: -8.7470
    height_m: 20
    source: "Tofiño 1789, p. 77: known by its white houses at the mouth of the bar; Pimentel: many rocks above water before the bar's entrance, pass south of them; eighteen palmos on the bar at high water and ten at low; do not enter without a pilot"
    says: "Villa do Conde, white houses at the mouth of its bar, with many rocks before it; never entered without a pilot."

  # ---------------------------------------------------------------------------
  # Oporto and the Douro
  # ---------------------------------------------------------------------------

  - id: leixoes
    kind: rock
    name: the Leixões
    modern: the rocks of Leixões (within the modern harbour's moles)
    lat_deg: 41.18300
    lon_deg: -8.70400
    height_m: 3
    extent_m: 200
    source: "Tofiño 1789, pp. 78 to 79, Pimentel: half a league north of the bar of Oporto, before the castle of Matosinhos, a ridge of rocks always visible called the Leixões, and a musket shot north-west of them a dangerous shoal; one may pass between the Leixões and the coast in eight and ten brazas"
    says: "The Leixões, a ridge of rocks always above water half a league north of the bar, with a dangerous shoal a musket shot north-west of them."
    fix: "the rocks stand within the modern harbour of Leixões, which the grid has dredged (7 m); left where the modern chart has them"

  - id: sao-joao-da-foz
    kind: castle
    name: the castle of São João da Foz
    modern: Forte de São João Baptista da Foz
    lat_deg: 41.14822
    lon_deg: -8.67600
    height_m: 15
    source: "Tofiño 1789, p. 79, Pimentel: on the north point of the entrance the castle of São João da Foz, from which a ridge of rocks runs south-west two cables"
    says: "The castle of São João da Foz on the north point of the Douro's entrance, a ridge of rocks running two cables south-west from it."
    fix: "moved 25 m to the nearest land in the block's tiles"

  - id: senhora-da-luz-light
    kind: light
    name: the light of Our Lady of the Light
    modern: Farol da Senhora da Luz, Foz do Douro
    lat_deg: 41.15444
    lon_deg: -8.67748
    height_m: 40
    lit: {from: 1761, until: null, range_nm: 10, character: "a fixed light kept by the brotherhood of the hermitage"}
    source: "Tofiño 1789, p. 78: the hermitage of Our Lady of the Light, where they keep a light every night; the encyclopaedia's 'Farol da Senhora da Luz' (read 2026-10-10): in service in 1761, a light kept by its brotherhood perhaps from the end of the seventeenth century"
    says: "The light of Our Lady of the Light by São João da Foz, kept every night."

  - id: sao-miguel-o-anjo
    kind: church
    name: the hermitage of São Miguel
    modern: Capela-Farol de São Miguel-o-Anjo, Foz do Douro
    lat_deg: 41.14817
    lon_deg: -8.67040
    height_m: 10
    source: "Tofiño 1789, p. 79, Pimentel: to enter this river bring the hermitage of São Miguel on the river's bank in one with the hermitage of Santa Catalina farther in, and so steer till near the Pilar"
    says: "The hermitage of São Miguel on the bank of the Douro, the leading mark over the bar with Santa Catalina beyond it."
    fix: "moved 75 m to the nearest land in the block's tiles"

  - id: filgueira
    kind: rock
    name: the Filgueira
    modern: the rock off the Foz (Pedra da Filgueira)
    lat_deg: 41.14371
    lon_deg: -8.67854
    height_m: 2
    extent_m: 100
    source: "Tofiño 1789, p. 79, Pimentel: south-west of the castle's reef another rock always visible called the Filgueira, which is to be left to larboard going in"
    says: "The Filgueira, a rock always above water south-west of the castle's reef: leave it to larboard going in."
    fix: "Pimentel's bearing from the castle; the modern chart's rock off the Foz; moved 50 m to the nearest shoal head in the block's tiles"

  - id: cabedelo
    kind: bank
    name: the Cabedelo
    modern: the Cabedelo, the sand spit on the Douro's south side
    lat_deg: 41.1430
    lon_deg: -8.6680
    height_m: 0
    source: "Tofiño 1789, p. 79, Pimentel: the south point of the bar is low and of sand, called the Cabedelo, from which a flat of sand with little water runs north; the bar's mouth changes after a gale, so a pilot of the place is needed"
    says: "The Cabedelo, the low sand point on the south of the bar, a flat with little water running north from it; the bar shifts with every gale."

  - id: oporto
    kind: town
    name: Oporto
    modern: Porto
    lat_deg: 41.1410
    lon_deg: -8.6110
    height_m: 60
    source: "Tofiño 1789, p. 78: the city of Oporto, one of the most commercial of Portugal, more than half a league inland; it stands on a height and is seen four or five leagues off, the black belfry of the Clérigos in it; the bar of Oporto at the mouth of the Douro in 41 11' N"
    says: "Oporto on its height half a league up the Douro, one of the most commercial cities of Portugal."

  - id: clerigos-tower
    kind: tower
    name: the black belfry of the Clérigos
    modern: Torre dos Clérigos, Porto
    lat_deg: 41.1457
    lon_deg: -8.6146
    height_m: 120
    source: "Tofiño 1789, p. 78: in the city a black belfry called of the Clérigos; the city seen four to five leagues off when the horizon is clear"
    says: "The black belfry of the Clérigos over Oporto, seen four or five leagues off in clear weather."

  - id: oporto-road
    kind: anchorage
    name: the road off the bar of Oporto
    modern: off the mouth of the Douro
    lat_deg: 41.1500
    lon_deg: -8.7000
    height_m: 0
    bottom: "sand and rock"
    source: "Tofiño 1789, p. 78: the bar changes with the gales, which obliges a ship to take a pilot, easily had, for the fishermen are vigilant and come off at once; in bad weather they cannot, and then the port is not to be sought; the sea rises much on this coast from the third and fourth quadrants"
    says: "Off the bar of Oporto a ship waits for the pilot, who comes off at once in fair weather; in foul she cannot seek the port."
    fix: "no anchorage depth in the directions; the position off the bar in the modern grid's 15 to 20 m, judgement"

  # ---------------------------------------------------------------------------
  # Aveiro to the Berlings
  # ---------------------------------------------------------------------------

  - id: douro-within-bar
    kind: anchorage
    name: within the bar of Oporto
    modern: the mouth of the Douro off São João da Foz
    lat_deg: 41.14698
    lon_deg: -8.67272
    height_m: 0
    bottom: "sand"
    source: "Tofiño 1789, p. 79, Pimentel: leaving a stone in the middle of the channel to starboard, past it all is good anchorage up to the city, keeping the middle of the channel; the bar's mouth changes after a gale, so call a pilot of the land"
    says: "Within the bar of Oporto, past the stone in mid-channel, good anchorage all the way up to the city."
    fix: "the river above the Foz is narrower than EMODnet's cell and not in its grid (GEBCO's fill has it as land): the mooring is the mouth within the bar, where the grid holds one to two metres at the datum; the bottom the Cabedelo's sand, judgement; moved 175 m to water of 2 m in the block's tiles"

  - id: aveiro-bar
    kind: place
    name: the bar of Aveiro
    modern: the mouth of the Ria de Aveiro
    lat_deg: 40.64083
    lon_deg: -8.74648
    height_m: 3
    source: "Tofiño 1789, p. 80: a low sandy coast, hard to know, with fishermen's huts to the town of Aveiro, which lies low and up the river with a house at the bar's mouth; Pimentel: its mouth shifts, take a pilot of the country; three poles for beacons; at high water springs twenty palmos, at low twelve to thirteen"
    says: "The bar of Aveiro on a low sandy coast, its mouth shifting: three poles for beacons, and a pilot of the country."
    fix: "moved 375 m to the nearest land in the block's tiles"

  - id: cabo-mondego
    kind: headland
    name: Cape Mondego
    modern: Cabo Mondego
    lat_deg: 40.1910
    lon_deg: -8.9050
    height_m: 60
    source: "Tofiño 1789, pp. 80 to 81: the Alto de Mondego, a mountain of middling height lying north-east and south-west, very flat on its top, ending in a point at both ends, and from the south-west end a ridge of rocks of more than a cable runs out, to which give a berth; seen from afar it looks an island, not to be mistaken for the Berlings"
    says: "Cape Mondego, the end of a flat-topped mountain that looks an island from afar; a ridge of rocks runs a cable off its south-western end."

  - id: alto-de-mondego
    kind: hill
    name: the Alto de Mondego
    modern: Serra da Boa Viagem
    lat_deg: 40.2050
    lon_deg: -8.8800
    height_m: 258
    source: "Tofiño 1789, p. 80: the Alto de Mondego, a mountain of middling height very flat on its top; the height the modern chart's"
    says: "The Alto de Mondego, a flat-topped mountain over the cape, looking an island from a distance."

  - id: mondego-light
    kind: light
    name: Cape Mondego light
    modern: Farol do Cabo Mondego
    lat_deg: 40.19100
    lon_deg: -8.90517
    height_m: 96
    lit: {from: 1858, until: null, range_nm: 28, character: "not yet built in 1805"}
    source: "The encyclopaedia's 'Farol do Cabo Mondego' (read 2026-10-10): built 1858; not lit in 1805"
    says: "Cape Mondego's light, which was not yet built in 1805."

  - id: buarcos-road
    kind: anchorage
    name: the road of Buarcos
    modern: off Buarcos, north of the mouth of the Mondego
    lat_deg: 40.16057
    lon_deg: -8.88602
    height_m: 0
    depth_fathoms: 5.5
    bottom: "sand"
    source: "Tofiño 1789, p. 81, Pimentel: the town of Buarcos, where there is an anchorage in six or seven brazas, sand, and where those who would enter the Mondego take a pilot, for its mouth shifts; at high water sixteen to seventeen palmos on its bar, at low eight"
    says: "The road of Buarcos in six or seven brazas on sand, where a ship takes her pilot for the Mondego's shifting bar."
    fix: "moved 500 m to water of 5.0 m in the block's tiles"

  - id: figueira
    kind: town
    name: Figueira
    modern: Figueira da Foz
    lat_deg: 40.1500
    lon_deg: -8.8600
    height_m: 15
    source: "Tofiño 1789, p. 81: about four miles south-east of Cape Mondego the town of Figueiras and the fort of Santa Catalina on the north point of the mouth of the river Mondego"
    says: "Figueira and its fort of Santa Catarina on the north point of the Mondego's mouth."

  - id: nazare-church
    kind: church
    name: the church of Our Lady of Nazareth
    modern: Santuário de Nossa Senhora da Nazaré, the Sítio
    lat_deg: 39.6040
    lon_deg: -9.0730
    height_m: 110
    source: "Tofiño 1789, p. 81, Pimentel: the cove of Pederneira, good for pataches, easy to know by a church of Our Lady of Nazareth on the top of its north point, and there is no other on the whole coast"
    says: "The church of Our Lady of Nazareth on the high north point of Pederneira, the only one like it on the coast."

  - id: pederneira-road
    kind: anchorage
    name: the cove of Pederneira
    modern: the bay of Nazaré
    lat_deg: 39.5960
    lon_deg: -9.0800
    height_m: 0
    bottom: "sand"
    source: "Tofiño 1789, p. 81, Pimentel: the cove of Pederneira, small and good for pataches"
    says: "The little cove of Pederneira under Our Lady of Nazareth, good for small craft."
    fix: "no depth in the directions; the bottom sand by the beach, judgement"

  - id: obidos-lagoon
    kind: place
    name: the lagoon of Óbidos
    modern: Lagoa de Óbidos
    lat_deg: 39.4100
    lon_deg: -9.2200
    height_m: 3
    source: "Tofiño 1789, p. 82: a fifth of the way from Cape Ficeron to Cape Carvoeiro the lagoon of Óbidos; Pimentel's port of Selir, small and good only for pataches, is doubtless in it"
    says: "The lagoon of Óbidos, the little port of Selir in it, for pataches only."

  - id: cabo-carvoeiro
    kind: headland
    name: Cape Carvoeiro
    modern: Cabo Carvoeiro, Peniche
    lat_deg: 39.35979
    lon_deg: -9.40810
    height_m: 30
    source: "Tofiño 1789, p. 82: Cape Carvoeiro or of Peniche, a low, steep, salient point with an islet at its foot and a hermitage of Our Lady of the Remedies on its top; west of the steep land, low sandy ground crossing north and south, so that ships coasting in thick weather have taken the cape for the Berlings and been lost on the low land, taking it for the channel; if you see the Berlinga you will see the high farallones north of it"
    says: "Cape Carvoeiro, a low steep point with an islet at its foot and a hermitage on top: in thick weather it has been taken for the Berlings and ships lost on the low land behind it."
    fix: "moved 25 m to the nearest land in the block's tiles"

  - id: carvoeiro-light
    kind: light
    name: Cape Carvoeiro light
    modern: Farol do Cabo Carvoeiro
    lat_deg: 39.36023
    lon_deg: -9.40807
    height_m: 57
    lit: {from: 1790, until: null, range_nm: 12, character: "a fixed light"}
    source: "The encyclopaedia's 'Farol do Cabo Carvoeiro' (read 2026-10-10): ordered by the Pombaline alvará of 1 February 1758, in service in 1790; Tofiño 1789 names no light there"
    says: "The light on Cape Carvoeiro, lit since 1790."
    fix: "moved 50 m to the nearest land in the block's tiles"

  - id: nau-dos-corvos
    kind: rock
    name: the islet of Cape Carvoeiro
    modern: Nau dos Corvos
    lat_deg: 39.3600
    lon_deg: -9.4115
    height_m: 30
    extent_m: 60
    source: "Tofiño 1789, p. 82: Cape Carvoeiro, salient, with an islet at its foot"
    says: "The high islet at the foot of Cape Carvoeiro."

  - id: peniche
    kind: town
    name: Peniche
    modern: Peniche
    lat_deg: 39.3560
    lon_deg: -9.3810
    height_m: 10
    source: "Tofiño 1789, pp. 82 to 83: east and north of the cape the town of Peniche de Cima at the beginning of the low land, almost an island; east and south of it, at the end of the steep land, Peniche de Baixo, from which the long beach runs"
    says: "Peniche on its low neck of land behind Cape Carvoeiro, almost an island."

  - id: peniche-road
    kind: anchorage
    name: the road of Peniche
    modern: the bay east of Peniche
    lat_deg: 39.34854
    lon_deg: -9.36828
    height_m: 0
    bottom: "sand"
