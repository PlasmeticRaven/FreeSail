    lat_deg: 28.6830
    lon_deg: -17.7650
    height_m: 15
    source: "Purdy 1825, pp. 218 to 219 (Glas): the chief port Santa Cruz, on the east side; approaching, Palma appears shaped exactly like a saddle; steer for a little to windward of the lowest place till within a mile, then run along shore southward and the town shows close by the sea; a large town; near the mole a castle or battery with a few cannon; a fountain in the middle of the town; Norie 1805, Table XL: Palma, Town 28 37 N"
    says: "Santa Cruz of Palma, close by the sea under its steep high land: steer for the middle of the saddle and run south along shore, and the town and its shipping show within a mile."

  - id: santa-cruz-de-la-palma-castle
