    lat_deg: 28.6880
    lon_deg: -17.7640
    height_m: 8
    source: "Purdy 1825, p. 219 (Glas): near the mole is a castle, or battery, mounted with a few cannon, for the defence of the shipping"
    says: "The castle by the mole of Santa Cruz of Palma, a few guns for the shipping."

  - id: santa-cruz-de-la-palma-road
    kind: road
    name: the road of Santa Cruz of Palma
    modern: the anchorage off Santa Cruz de La Palma
    lat_deg: 28.6800
    lon_deg: -17.7600
    height_m: 0
    depth_fathoms: 18
    bottom: "clean and good"
    source: "Purdy 1825, pp. 218 to 219 (Glas): the road within a musket-shot of the shore, where vessels commonly ride in 15 or 20 fathoms, exposed to easterly winds, yet with good anchors and cables safe in all winds, for the ground is clean and good and the high land facing the road repels the wind; a north-east swell comes rolling in but the wind off the land checks it; in winter the swell breaks high on the beach and stops the boats for three or four days together"
    says: "The road of Santa Cruz of Palma, a musket-shot off in fifteen or twenty fathoms on clean ground: open to the east, but the high land throws the wind back and a ship rides with a slack cable."

