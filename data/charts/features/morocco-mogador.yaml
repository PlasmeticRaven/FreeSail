# The features of Morocco's Atlantic coast (package 106b), morocco-mogador, as the period's
# pilots give them, each with its source in the references' form (docs/references/README.md),
# on the rules of channel-west.yaml's head, read from:
#
#   Purdy 1825      John Purdy, Memoir ... to accompany the new chart of the Atlantic Ocean,
#                   1825 (docs/references/pilots/purdy-1825-memoir-atlantic-ocean-ocr.txt),
#                   'Tangier to Rabat' and 'Rabat to Mogodor', 'Mogodor to Cape Noon', pp. 152
#                   to 157 (l. 22171 to 22620), cited by page; it quotes Jackson for Sallee.
#   Jackson 1809    James Grey Jackson, An Account of the Empire of Marocco, 1809
#                   (pilots/jackson-1809-account-empire-marocco-ocr.txt), ch. V, the seaports
#                   (l. 4055 to 5065), cited by line of the OCR (the pages are not printed in it).
#
# No light stood on this coast in 1805 by any source on file, and none is entered. Positions
# are in the modern frame, first placed FROM MEMORY of the modern chart and the pilots'
# bearings and distances, then checked against the region's tiles by channel-west.yaml's rule
# (a headland, town, castle or tower to the nearest land within 800 m; a danger to the grid's
# shoal head; an anchorage to water of the pilot's depth), each move in `fix`. Heights for the
# horizon are the pilots' where they give one, else FROM MEMORY (UNVERIFIED). The grid closes
# the rivers (the Lucos at Larache, the Seboo at Mamora, the Bu Regreg at Sallee): their mouths
# read as land or under a metre, where the pilots let in vessels of 100 tons at high water (a
# finding, noted in docs/dev/TuningNotes.md; the ports lie in their roads, as the pilots put
# the ships).

region: morocco-mogador
features:
  - id: mogador
    kind: town
    name: Mogador, or Suera
    modern: Essaouira
    lat_deg: 31.5130
    lon_deg: -9.7700
    height_m: 15
    source: "Jackson 1809, l. 4722 to 4768: built by the Emperor Sidi Mohammed ben Abdallah in 1760, its proper name Saweera; the citadel holds the custom-house, the treasury and the foreign merchants' houses; l. 4892 to 4894: a beautiful appearance from the sea, the houses all of stone and white; l. 4919 to 4920: the only port with a regular and uninterrupted commerce with Europe; Purdy 1825, p. 155: on a low flat desert of accumulating sand, nearly surrounded by water at springs; population computed at 10,000; the height FROM MEMORY"
    says: "Mogador, white and walled on its spit of sand, the Long Battery along its sea face: the one port of this coast in regular trade with Europe."
  - id: mogador-island
    kind: island
    name: the island of Mogador
    lat_deg: 31.5000
    lon_deg: -9.7850
    height_m: 25
    source: "Purdy 1825, p. 155: an island lying S.W. of the town forms the harbour, about 1 1/2 mile in circumference; Jackson 1809, l. 4762: about two miles in circumference; the height FROM MEMORY"
    says: "The island of Mogador, which forms the harbour south-west of the town."
  - id: mogador-road
    kind: road
    name: the road of Mogador
    lat_deg: 31.5150
    lon_deg: -9.8000
    height_m: 0
    depth_fathoms: 18
    bottom: "sand"
    source: "Purdy 1825, p. 155: large ships do not enter the port, but anchor about 1 1/2 mile westward of the Skala, or long battery; a winter seldom passes but some ships are driven ashore by the S.W. winds, between the 8th of December and the 18th of January, the season called Liali; Jackson 1809, l. 4762 to 4768: ships of war and of great burden lie about a mile and a half west of the Long Battery, l. 4922 to 4926: the Liali from the 20th of December to the 30th of January, old style; the depth the grid's and the bottom JUDGEMENT"
    says: "The road of Mogador, a mile and a half west of the Long Battery, where ships of war lie: in the Liali, from December into January, the south-westerly gales drive ships ashore here."
    fix: "a mile and a half west of the battery in the grid's 35 m (19 fathoms)"
  - id: mogador-harbour
    kind: anchorage
    name: the harbour within the island
    lat_deg: 31.5050
    lon_deg: -9.7750
    height_m: 0
    depth_fathoms: 3
    bottom: "good ground, sand"
    source: "Purdy 1825, p. 155: between the island and the main on the south is the anchorage, in some parts only 12 feet at low water; the north passage between the town and the island, running close by the rocks with five fathoms; the best anchorage under the island, the ground good; going out on the south side along the bank from the main you are soon in 4 and then 10 fathoms; the tide flows at full and change at 4h [OCR '4b.'] and rises from 10 to 12 feet [OCR 'lu to 12'], the current scarcely perceptible; Jackson 1809, l. 4762 to 4768: ten or twelve feet at ebb"
    says: "The harbour under the island of Mogador, twelve feet at low water in places: in by the north passage close by the rocks, out by the south along the bank; the tide rises ten to twelve feet."
    fix: "between the island and the town in the grid's 6 m"
  - id: cape-sem
    kind: headland
    name: Cape Sem, or Teyent
    modern: Cap Sim
    lat_deg: 31.3900
    lon_deg: -9.8300
    height_m: 60
    source: "Purdy 1825, p. 156: two leagues to the southward of Mogador, under Cape Sem or Teyent, a rocky bank stretching two leagues off, 13 fathoms a league from shore, 20 fathoms rocky ground at two leagues, 35 and 40 fathoms oozy sand at 3 or 4; hereabout the current sets violently to the southward; the height FROM MEMORY"
    says: "Cape Sem, two leagues south of Mogador, with a rocky bank two leagues off it; the current sets hard to the southward here."
  - id: cape-tefelneh
    kind: headland
    name: Cape Tefelneh
    modern: Cap Tafelney
    lat_deg: 31.0790
    lon_deg: -9.8201
    height_m: 100
    source: "Purdy 1825, p. 156: from Mogodor to Cape Tefelneh the coast trends nearly S.W. 12 leagues; the cape high and steep, bordered with rocks stretching some distance out; anchoring ground under it on the south, sheltered from east and N.E. winds, in 10 fathoms, sand; the height FROM MEMORY"
    says: "Cape Tefelneh, high and steep and bordered with rocks; anchorage under its south side in ten fathoms, sheltered from the east and north-east."
    fix: "FROM MEMORY in the grid's water; moved 950 m to the nearest land"
  - id: cape-ghir
    kind: headland
    name: Cape Geer
    modern: Cap Ghir
    lat_deg: 30.6300
    lon_deg: -9.8900
    height_m: 360
    source: "Purdy 1825, p. 156: Cape Geer very remarkable, seen 3 or 4 leagues off; about 4 miles within land to the northward a round hummock, a mark for the cape, the land farther north higher still; Jackson 1809, l. 701 to 707: there is always wind at this cape, and ships within a league of it are almost always becalmed on its south side, three days getting down to Agadeer; the height FROM MEMORY"
    says: "Cape Geer, very remarkable, with a round hummock four miles inland to the north of it: there is always wind at the cape and a calm on its south side."
  - id: cape-ghir-reef
    kind: ledge
    name: the reef off Cape Geer
    lat_deg: 30.6475
    lon_deg: -9.8925
    height_m: 0
    extent_m: 500
    source: "Purdy 1825, p. 156: from the north side of the cape a reef extends some distance out to sea, and should not be approached nearer than in 30 fathoms [OCR 'SO']; the head at the datum, the pilot giving no figure"
    says: "The reef off the north side of Cape Geer: come no nearer than thirty fathoms."
    fix: "the grid's shoal head off the cape's north side (3 m); the grid does not carry it far out (a finding)"
  - id: santa-cruz-agadir
    kind: town
    name: Agadeer, or Santa Cruz
    modern: the kasbah of Agadir (Agadir Oufella)
    lat_deg: 30.4270
    lon_deg: -9.6230
    height_m: 236
    source: "Purdy 1825, p. 157: the town of Agadeer, or Santa-Cruz, about 5 leagues south-eastward of Cape Geer at the bottom of the bay, the last port of Marocco on the Atlantic, on the summit of a mountain, strong by nature, its principal battery below guarding a spring of fresh water close to the sea, the Portuguese Fonte at the mountain's foot; Jackson 1809, l. 4959 to 4991: the centre of an extensive commerce with Timbuctoo under Muley Ismael; the governor refused to deliver it up in 1773 [OCR '177s'], and after its surrender the merchants were ordered to Mogodor; the height FROM MEMORY"
    says: "Agadeer, or Santa Cruz, on the summit of its mountain over the bay, the battery and the spring at its foot: the Emperor closed it to trade and sent its merchants to Mogador."
  - id: agadir-road
    kind: road
    name: the road of Agadeer
    lat_deg: 30.4020
    lon_deg: -9.6280
    height_m: 0
    depth_fathoms: 5
    bottom: "sand, a rocky ledge to the north"
    source: "Purdy 1825, p. 157: considered the best road on the coast of Marocco, large and well sheltered; to anchor, enter so far that the storehouses bear E.N.E., south of a rocky ledge lying off the town in 7 or 8 fathoms; the best riding with Cape Geer bearing North in 6 or 7 fathoms; the small bower laid out before the land wind, the sheet anchor out to the S.W. against a storm; run along by the cape's land, northerly winds being very prevalent; by night no nearer than 12 or 14 fathoms; Jackson 1809, l. 4512 to 4514 and 4953 to 4955: with Fedala's the only road where ships ride in security in winter; the bottom JUDGEMENT"
    says: "The road of Agadeer, the best on the coast, in six or seven fathoms south of the rocky ledge off the town: lay the small bower toward the land and the sheet anchor out to the south-west against a gale."
    fix: "the place first chosen off the Fonte lies within the modern harbour's moles, which are the grid's land; moved south of them to the grid's 9.5 m (5 fathoms), JUDGEMENT"
