    source: "White 1835, 'Coast of England', p. 46: the eastern end of the trees on Portsmouth Lines in one with South-Sea Castle, the mark for the Nab light-vessel; Imray 1874, 'Spithead and its approaches', p. 36: Portsmouth church tower in line with Southsea castle"
    says: "Portsmouth, the King's dockyard and the garrison town on the east side of the harbour's mouth, its church tower and the trees of its lines over Spithead."

  - id: round-tower-portsmouth
