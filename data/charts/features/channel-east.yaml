# The features of the Channel's east block (package 79b; docs/dev/ChartBlocks.md): the
# Wight's eastern end, Spithead, St Helens road and Portsmouth; Poole; Selsey and the
# Owers; the Sussex coast to Beachy Head; Rye bay and Dungeness; Dover, the South
# Foreland, the Downs and Deal, the Goodwin Sands and the North Foreland; and on the
# French side the Seine's mouth and Le Havre, Fecamp, Dieppe, the Somme, Boulogne, Calais
# and the Flemish banks to Dunkirk. Spithead and Poole lie in channel-mid's bounds (west of
# 1 W), where channel-mid lists no level-3 tile: their harbour patches and their marks are
# this block's, as Dartmouth's were package 39a's (the bounds' check takes a harbour
# patch's box as the block's); the rest of the Wight, the Solent west of the Spithead
# patch, the Needles and Hurst are channel-mid's file. The form and the rules are
# channel-west.yaml's (its head). The sources, in the references' form
# (docs/references/README.md; docs/references/Charts.md, package 79b):
#
#   Faden 1793      Le Petit Neptune Français; or, French Coasting Pilot (Internet Archive
#                   lepetitneptunefr00fade): Dunkirk, its road behind the Brack and the
#                   banks of Flanders, Gravelines and Calais (pp. 2 to 9); Blanc Nez, Gris
#                   Nez, the Calbarde, St John's road, Boulogne, Etaples, the Somme,
#                   Treport, Dieppe, Cape Lailly's light of 1775, St Vallery, Fecamp, the
#                   Needles of Etretat, Cape la Heve's two lights of 1775, the roads of
#                   Havre by M. de Gaulle (1776), the Havre, Honfleur and the Amfar, the
#                   rocks of Calvados (pp. 10 to 22). In period exactly.
#   Moore 1799      The New Practical Navigator (Internet Archive
#                   bim_eighteenth-century_the-practical-navigator_moore-john-hamilton_1799):
#                   the catechism's Downs, Goodwin, Ripraps, Dungeness, Beachy Head, the
#                   Owers with "a floating light on them which has been shifted several
#                   times", and the approach to Spithead by the Princessa, the Dean, the
#                   Warner and the Nab buoy (pp. 298 to 300). In period exactly.
#   White 1835      Sailing Directions for the English Channel (Internet Archive
#                   sailingdirectio00whitgoog): 'Coast of England' pp. 45 to 58 (Dunnose to
#                   the Downs: Spithead's marks and anchorage, St Helens, the Owers and
#                   their light-vessel, the Park, Seaford road, Beachy Head, the Royal
#                   Sovereign shoals, Fairlight, Dungeness and its bays, the Downs, the
#                   Varne and the Ridge, the Vergoyers, the tides of the Strait); 'Coast of
#                   France' pp. 58 to 60 (Cape la Heve, Fecamp, Antifer, Point d'Ailly and
#                   La Galere, the Somme, Montalembert).
#   Imray 1874      Sailing Directions for the English Channel, part I (Internet Archive
#                   sailingdirection00unse_0): 'Margate Roads to South Foreland' pp. 1 to 11
#                   (the North Foreland, the Goodwin, Trinity bay, the Gull Stream, the
#                   Brake, the Downs, Deal bank, Ramsgate); 'South Foreland to Beachy Head'
#                   pp. 11 to 12 (Dover); 'Spithead and its approaches' pp. 35 to 38 (the
#                   Horse and Dean, the Princessa, Bembridge ledge, the Nab, St Helen's
#                   road, the anchorage at Spithead); 'Poole' pp. 54 to 55. Later than the
#                   period: the banks are the same banks, the works are not (the Admiralty
#                   pier at Dover, building from 1847, is not drawn).
#   the encyclopaedia   en.wikipedia.org and fr.wikipedia.org, read 2026-10-29: 'South
#                   Foreland Lighthouses', 'North Foreland', 'Dungeness Lighthouse', 'Belle
#                   Tout Lighthouse', 'Goodwin Sands', 'Lightship', 'Phare de la Hève',
#                   'Phare d'Ailly', 'Phare de Calais', 'Tour du Guet', 'Phare du cap
#                   Gris-Nez', 'Phare de Dunkerque', 'Phare de Gravelines', 'Tour d'Odre'.
#   The Maritime Archaeology Trust, 'Lighthouses and Lightvessels'
#                   (maritimearchaeologytrust.org, read 2026-10-29): the Nab lightvessel
#                   active from 24 September 1812 (the Public Ledger and Daily Advertiser of
#                   29 September); the Owers from 1788; the North Goodwin from 1795. Cited
#                   as "the encyclopaedia" form's named reference, with the page.
#
# Positions are in the modern frame (WGS 84, the EMODnet DTM 2024 grid the tiles are cut
# from), first placed from the modern chart and the pilots' bearings, then checked against
# this block's tiles by the rule of channel-west.yaml's head (a scratch script outside the
# repository); a move is said in `fix`. Heights are above the sea for the horizon. A
# light's `lit` has `from` and `until`, so that 1805 sees the South Foreland's two, the
# North Foreland, Dungeness (Wyatt's tower of 1792), the Owers' floating light, the North
# Goodwin's, Cape la Heve's two, Cape Lailly's, Dunkirk's fanal on the Risban and the
# lantern on Boulogne's bank, and not the Nab (1812), the Gull and the South Sand Head
# (named first in 1832), Belle Tout (1828), Calais (the Tour du Guet 1818, the tower of
# 1848), Gris Nez (1837) or Gravelines (1843); `range_nm` is the period lamp's, a
# judgement from the pilot's words or the elevation. `dries_m` is a danger's head against
# the chart's datum (LAT taken as the pilot's low water of springs): negative for the water
# over it, positive for how far it dries. A danger's `extent_m` is kept under a kilometre
# and laid on the foul ground itself (ChartBlocks.md): the Goodwin is given as five heads.
#
# Not here: the Thames above the North Foreland and the Nore, and the Flemish coast east
# of Dunkirk (Ostend, Flushing) are later blocks; Cherbourg, La Hougue, the Isles St
# Marcouf, Barfleur, the Needles, Hurst, St Catherine's and Dunnose are channel-mid's.

region: channel-east
features:

