    fix: "moved 420 m to the grid's land: the grid smooths the harbour's narrow mouth and its points"
    source: "White 1835, 'Coast of England', p. 44: Sconce Point open of Round Tower Point (the Needles' channel); Modern chart: the Round Tower at the mouth of Portsmouth harbour, built in the fifteenth century"
    says: "The Round Tower on the point at the mouth of Portsmouth harbour, the town's side."

