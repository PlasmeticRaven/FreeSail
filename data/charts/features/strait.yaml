# The features of the Strait, Cape Roche and Cape Trafalgar to Gibraltar, Ceuta and Cape
# Spartel (spec M6 §26, block 6; package 39f): hazards, marks, lights with their dates,
# places, anchorages and bottom notes, in the period's words, each with its source in the
# references' form (docs/references/README.md), on the rules of channel-west.yaml's head,
# read from:
#
#   Tofiño 1787     Vicente Tofiño de San Miguel, Derrotero de las costas de España en el
#                   Mediterráneo y su correspondiente de África (Madrid, Ibarra, 1787;
#                   Internet Archive derroterodelasco00tofi), the OCR text: 'Descripción de
#                   las costas de Europa y África que forman el Estrecho de Gibraltar',
#                   pp. 1 to 11; 'Descripción de la Bahía de Algeciras y Gibraltar', pp. 12
#                   to 22; 'Costa de África', pp. 22 to 27. His soundings are brazas of two
#                   Castilian varas (1.672 m; the plan's legend, below) and his feet the
#                   pie de Burgos (0.279 m), his miles of sixty to the degree.
#   Tofiño 1789     the same, Derrotero de las costas de España en el Océano Atlántico
#                   (Internet Archive bub_gb_04Yq4fsvB8gC), 'Descripción de la costa de
#                   Andalucía', pp. 127 to 130: Conil, Cape Roche, the Laja de Conil, the
#                   sand bank and the Aceytera off Cape Trafalgar.
#   Tofiño 1786     his 'Plano geométrico de la Bahía de Algeciras y Gibraltar' (Atlas
#                   Marítimo de España, 1789; David Rumsey 13360.037), read at full
#                   resolution through the collection's IIIF server: its legend's letters
#                   and its soundings, the bay's patch (overrides/strait/gibraltar-
#                   algeciras.yaml).
#   Purdy 1826      John Purdy, The New Sailing Directory for the Mediterranean Sea
#                   (Internet Archive newsailingdirec01purdgoog), pp. 1 to 9 ('Strait of
#                   Gibraltar', 'Bay of Gibraltar', 'Cape Spartel and Tangier Bay',
#                   'Tangier to Ceuta', 'Ceuta and Tetuan', 'The Tides and Current of the
#                   Strait'), pp. 349 to 353; much of it Tofiño's in English, with the
#                   English ships' notes of 1799 to 1824. Later than the period, and the
#                   nearest English directions read: where it adds to Tofiño the entry
#                   says so.
#   encyclopaedia   the Spanish and English encyclopaedias' pages for the lights and the
#                   places named in each entry, read 2026-10-10 (dates and positions).
#
# Positions are in the modern frame (WGS 84, the EMODnet DTM 2024 grid the tiles are cut
# from): first placed from the modern chart, the encyclopaedia's coordinates or Tofiño's
# bearings and distances as each entry says, then checked against the block's tiles by
# channel-west.yaml's rule (a headland, island, town, castle, church, tower to the
# nearest land within 800 m; a light to the nearest land within 400 m; a rock or ledge
# to the shoalest head within 400 m; an anchorage to water holding half the pilot's
# depth within 800 m); a move is said in `fix`. Tofiño's survey is the period's best of
# these waters (his bases measured, his marks by two theodolites), so where his bearings
# put a sunken danger the entry keeps them. Heights are above the sea for the horizon:
# the Rock's Purdy's 1,400 feet, the rest JUDGEMENT from the grid's land about the mark.
#
# The lights of 1805: NONE in the block. Every light of the Strait is later (Tarifa's
# on the island, first recorded in 1826 and UNVERIFIED before it, Europa Point's of 1841,
# Ceuta's of 1855, Trafalgar's of 1860, Spartel's of 1864, Carnero's of 1874), and each
# carries its year so that 1805 does not see it. Tofiño 1787 names no light between Cadiz
# and Malaga; the lamp the friars kept in the tower of Our Lady of Europe had no shrine
# to keep it after 1704, when the shrine ceased to be used and was taken for military use
# (the encyclopaedia's 'Shrine of Our Lady of Europe', read 2026-10-10; the lamp's end
# JUDGEMENT from that). A ship enters the Strait by night on the land's loom and
# the moon.
#
# Cadiz and its bay (36.5 N) are the block `portugal`'s (package 39d), whose bounds abut
# these at 36.4 N; Cape Roche, Conil and Cape Trafalgar are this block's.
#
# The lead reviews this list against the sources before the merge: the citation is on
# every line for that.

region: strait
features:

  # ---------------------------------------------------------------------------
  # Cape Roche, Conil and Cape Trafalgar
  # ---------------------------------------------------------------------------

  - id: cape-roche
    kind: headland
    name: Cape Roche
    modern: Cabo Roche
    lat_deg: 36.2953
    lon_deg: -6.1418
    height_m: 25
    source: "Tofiño 1789, 'Descripción de la costa de Andalucía', p. 127: from Cape Roche to Conil the coast is beach with some points of rock nothing salient"
    says: "Cape Roche, a low point of rock between the beaches of Sancti Petri and Conil."

  - id: conil
    kind: town
    name: Conil
    modern: Conil de la Frontera
    lat_deg: 36.2770
    lon_deg: -6.0880
    height_m: 30
    source: "Tofiño 1789, 'Riachuelo de Conil', p. 127: at the foot of the Atalaya a rivulet where the coasting craft enter at high water, its mouth dry at low"
    says: "Conil, its watch-tower over a little river the coasters enter at high water; the mouth is dry at low water."

  - id: conil-atalaya
    kind: tower
    name: the Atalaya of Conil
    modern: Torre de Guzmán, Conil
    lat_deg: 36.2765
    lon_deg: -6.0875
    height_m: 40
    source: "Tofiño 1789, 'Laja de Conil', p. 127: the Atalaya of Conil, from which the Laja is laid off"
    says: "The Atalaya of Conil, the tower over the town, the mark the Laja is reckoned from."

  - id: castilobos-tower
    kind: tower
    name: the tower of Castilobos
    modern: Torre de Castilobos (Castilnovo)
    lat_deg: 36.2520
    lon_deg: -6.0740
    height_m: 12
    source: "Tofiño 1789, 'Torre de Castilobo', p. 127: S 25° 50' E 1 6/10 miles from the Atalaya the tower of Castilobo, square, on the beach, which is very low"
    says: "The tower of Castilobos, square, standing on the low beach south of Conil."
    fix: "Tofiño's bearing and distance from the Atalaya of Conil"

  - id: laja-de-conil
    kind: ledge
    name: the Laja of Conil
    modern: Laja de Conil (the shoals off Castilnovo)
    lat_deg: 36.2310
    lon_deg: -6.1030
    height_m: 0
    extent_m: 500
    dries_m: -3.3
    source: "Tofiño 1789, 'Laja de Conil', pp. 127 to 128: S 15° W 3 miles scant from the Atalaya of Conil, and S 54° 10' W and S 39° 30' W 2 miles scant from the tower of Castilobo, its north and south ends; 3 to 4 brazas at those points, breaking when there is a swell, and 2 to 4 1/2 brazas of rock over the rest"
    says: "The Laja of Conil, a ledge of rock with two to four brazas over it three miles south-south-west of the Atalaya; it breaks when there is a swell."
    fix: "Tofiño's bearings from the Atalaya and from Castilobo, the ends' middle; 2 brazas (3.3 m) the least he gives"

  - id: trafalgar-bank
    kind: bank
    name: the sand bank off Cape Trafalgar
    modern: the Placer de Meca (the sand west of Cape Trafalgar)
    lat_deg: 36.1810
    lon_deg: -6.1060
    height_m: 0
    depth_fathoms: 2.7
    bottom: "sand"
    source: "Tofiño 1789, 'Placer de arena', p. 128: N 83° W 4 miles scant from Cape Trafalgar the NW end of a great bank of sand that runs NW and SE a mile and a half and half a mile NE and SW, with 3 brazas in its least and 8 to 10 all about its edge; its SE end S 76° W 3 miles scant from the cape"
    says: "A great bank of sand four miles west of Cape Trafalgar, three brazas on its shoalest and eight to ten about its edge."
    fix: "Tofiño's two bearings and distances from the cape, the middle; 3 brazas (5.0 m) as English fathoms"

  - id: cape-trafalgar
    kind: headland
    name: Cape Trafalgar
    modern: Cabo de Trafalgar
    lat_deg: 36.1830
    lon_deg: -6.0350
    height_m: 20
    source: "Tofiño 1787, 'Cabo Trafalgár', p. 1: the most westerly northern point of the Strait, in latitude 36° 10′ 15″; low, of broken land, salient, with a watch tower near its end; the encyclopaedia's 'Cabo de Trafalgar' (read 2026-10-10) for the position"
    says: "Cape Trafalgar, the north-west point of the Strait: low and broken land, salient, with a watch-tower near its end."

  - id: trafalgar-tower
    kind: tower
    name: the tower of Cape Trafalgar
    modern: Torre de Trafalgar (the almenara beside the lighthouse)
    lat_deg: 36.1832
    lon_deg: -6.0345
    height_m: 22
    source: "Tofiño 1787, 'Cabo Trafalgár', p. 1: a watch tower near its end; Tofiño 1789, p. 129: the Torre de Trafalgar, the mark of the Aceytera"
    says: "The watch-tower on Cape Trafalgar, the mark the Aceytera and the sand bank are laid off from."

  - id: trafalgar-light
    kind: light
    name: the light of Cape Trafalgar
    modern: Faro de Cabo Trafalgar
    lat_deg: 36.1829
    lon_deg: -6.0352
    height_m: 50
    lit: {from: 1860, until: null, range_nm: 19, character: "a light on the cape (not yet built in 1805)"}
    source: "The encyclopaedia's 'Faro de Cabo Trafalgar' (es, read 2026-10-10): raised in 1860 beside the almenara, to Eduardo Saavedra's project of 1857; not lit in 1805"
    says: "The light of Cape Trafalgar, which was not yet built in 1805."

  - id: aceitera
    kind: ledge
    name: the Aceytera
    modern: Bajo de la Aceitera (Los Bajos de Trafalgar)
    lat_deg: 36.1660
    lon_deg: -6.0710
    height_m: 0
    extent_m: 600
    dries_m: -2.5
    source: "Tofiño 1789, 'Aceytera', pp. 128 to 129: S 80° 15' W 2 miles scant from Cape Trafalgar its NW end, S 60° 20' W the same distance its least water, S 53° 44' W its SE end; a chain of rocks a mile NNW and SSE and two cables NE and SW, its least water a braza and a half at low water, up to 5 1/2 in places; between it and the cape a ripple that seems a breaker, 'la Risa del Cabo', the eddies of the currents (p. 130)"
    says: "The Aceytera, a chain of rocks two miles south-west of Cape Trafalgar with a braza and a half on its shoalest at low water; between it and the cape the water boils like a breaker, the Laugh of the Cape."
    fix: "Tofiño's bearing and distance of the least water from the tower; 1 1/2 brazas (2.5 m) at low water"

  - id: trafalgar-rocky-flat
    kind: rock
    name: the rocky flat north-west of Cape Trafalgar
    modern: the rocks off the Playa de Zahora
    lat_deg: 36.2013
    lon_deg: -6.0546
    height_m: 0
    extent_m: 150
    dries_m: -2.1
    source: "Tofiño 1789, 'Cabo Trafalgar', p. 127: from a point of rock a mile and a half NW of the cape a flat of rock runs a cable and a half SW, with only 1 1/4 brazas at its end, then 6, 8 and more"
    says: "A flat of rock a mile and a half north-west of Cape Trafalgar, running out a cable and a half with a braza and a quarter at its end."
    fix: "Tofiño's distance from the cape, the flat's end; 1 1/4 brazas (2.1 m); moved 400 m to the shoalest head of EMODnet's grid within 400 m (-2.5 m)"

  - id: meca-heights
    kind: hill
    name: the heights of Meca
    modern: Altos de Meca (the Sierra de la Breña)
    lat_deg: 36.2050
    lon_deg: -5.9900
    height_m: 150
    source: "Tofiño 1787, 'Altos de Meca', p. 2: a level ridge of more than moderate height divided in two; Tofiño 1789, p. 127: very flat on its summit, green with brush and patches of white sand, the mark for the cape"
    says: "The heights of Meca, a level ridge divided in two, green with brush and white with patches of sand: the mark for Cape Trafalgar."

  - id: barbate-road
    kind: anchorage
    name: the road of Barbate
    modern: Ensenada de Barbate
    lat_deg: 36.1700
    lon_deg: -5.9350
    height_m: 0
    depth_fathoms: 7
    bottom: "clean ground"
    source: "Tofiño 1787, 'Ensenada de Barbate', p. 2: in its middle a good anchorage, clean, in what brazas you will, before a white gully east of the river; here the Glorioso, dismasted, saved herself at anchor in 1746"
    says: "The road of Barbate, between Cape Trafalgar and Cape Plata: good clean anchorage in any depth before the white gully east of the river."
    fix: "the road's middle; the depth JUDGEMENT (Tofiño's 'the brazas you will')"

  - id: barbate-reef
    kind: ledge
    name: the reef off the river of Barbate
    modern: the rocks off the mouth of the Barbate
    lat_deg: 36.1824
    lon_deg: -5.9307
    height_m: 0
    extent_m: 700
    dries_m: -2.0
    source: "Tofiño 1787, 'Ensenada de Barbate', p. 2: SW of the river's mouth and near it a reef with 7 and 10 feet over it, lying E and W half a league; the river's entrance very narrow, 15 feet at high water"
    says: "A reef with seven and ten feet over it, half a league long east and west, south-west of the mouth of the river of Barbate."
    fix: "Tofiño's place south-west of the river's mouth; 7 feet of Burgos (2.0 m); moved 380 m to the shoalest head of EMODnet's grid within 400 m (0.4 m)"

  - id: zahara-bay
    kind: anchorage
    name: the bay of Zahara
    modern: Ensenada de Zahara de los Atunes
    lat_deg: 36.1341
    lon_deg: -5.8507
    height_m: 0
    depth_fathoms: 5
    bottom: "sand"
    source: "Tofiño 1787, 'Ensenada de Sara', pp. 2 to 3: 7 1/10 miles S 73° 14' E of Cape Trafalgar its NW point, rising to a mountain with two towers; the bay commodious and in good weather proper for small craft"
    says: "The bay of Zahara under its mountain with two towers, commodious in good weather for small craft."
    fix: "the bay's middle; the depth JUDGEMENT; moved 120 m to water holding half the pilot's depth"

  - id: camarinal-point
    kind: headland
    name: the point of the Camarinal
    modern: Cabo de Gracia (where the Faro de Camarinal stands)
    lat_deg: 36.0884
    lon_deg: -5.8100
    height_m: 60
    source: "Tofiño 1787, 'Punta del Camarinal', p. 3: the SE side of the bay of Zahara, a low salient point with rocks to be given a third of a league's berth, the point of middling height with a watch tower; the encyclopaedia's 'Punta Camarinal' (es, read 2026-10-10): the Faro de Camarinal stands on the cape now called de Gracia, west of the point that now bears the name"
    says: "The point of the Camarinal, of middling height with a watch-tower; its rocks want a third of a league's berth."
    fix: "moved 40 m to the nearest land of the tiles"

  - id: camarinal-rocks
    kind: ledge
    name: the rocks of the Camarinal
    modern: the rocks off Cabo de Gracia
    lat_deg: 36.0868
    lon_deg: -5.8111
    height_m: 0
    extent_m: 400
    source: "Tofiño 1787, 'Punta del Camarinal', p. 3: a low salient point with stones that must be given a third of a league's berth"
    says: "The rocks off the Camarinal: give them a third of a league."
    fix: "moved 400 m to the shoalest head of EMODnet's grid within 400 m (-3.6 m)"

  - id: cape-plata
    kind: headland
    name: Cape Plata
    modern: Punta Camarinal (the foot of the Sierra de la Plata)
    lat_deg: 36.0810
    lon_deg: -5.7960
    height_m: 80
    source: "Tofiño 1787, 'Cabo de Plata', p. 3: it comes down from the mountain of the same name, declining insensibly to its point, and shows well salient with some stones; between it and the Camarinal a bay with a beach, shelter from the E and NE in 8 to 10 brazas"
    says: "Cape Plata, falling insensibly from its mountain to a salient point with some stones."

  - id: bolonia-bay
    kind: anchorage
    name: the bay of Bolonia
    modern: Ensenada de Bolonia
    lat_deg: 36.0759
    lon_deg: -5.7658
    height_m: 0
    depth_fathoms: 8
    bottom: "sand"
    source: "Tofiño 1787, 'Punta Paloma', p. 3: between Cape Plata and Punta Paloma the bay of Bolonia, good anchorage and shelter for every kind of vessel in what depth you will at half a cannon shot from the coast, with no more berth to give than to the Camarinal and Cape Plata"
    says: "The bay of Bolonia: good anchorage for every kind of vessel at half a cannon-shot from the beach."
    fix: "half a cannon shot off the beach; the depth JUDGEMENT; moved 140 m to water holding half the pilot's depth"

  - id: punta-paloma
    kind: headland
    name: Punta Paloma
    modern: Punta Paloma
    lat_deg: 36.0620
    lon_deg: -5.7170
    height_m: 40
    source: "Tofiño 1787, 'Torre y punta Paloma', p. 3: S 72° E 4 1/2 miles of Cape Plata the tower and point of Paloma, surrounded with great low stones; the encyclopaedia's 'Punta Paloma' (es, read 2026-10-10)"
    says: "Punta Paloma with its tower, girt with great low stones; the Cabezos lie off it."

  - id: valdevaqueros
    kind: anchorage
    name: the bay of Valdevaqueros
    modern: Ensenada de Valdevaqueros
    lat_deg: 36.0640
    lon_deg: -5.6900
    height_m: 0
    depth_fathoms: 4
    bottom: "sand"
    source: "Tofiño 1787, 'Ensenada de Valdebaqueros', p. 3: Punta Paloma and the point and tower of the Peña form the bay of Valdebaqueros, with shelter and anchorage for small vessels"
    says: "The bay of Valdevaqueros, an anchorage for small vessels between Punta Paloma and the tower of the Peña."
    fix: "the depth JUDGEMENT"

  - id: pena-tower
    kind: tower
    name: the tower of the Peña
    modern: Torre de la Peña, Tarifa
    lat_deg: 36.0542
    lon_deg: -5.6588
    height_m: 40
    source: "Tofiño 1787, pp. 3 and 5: S 78° E 3 1/2 miles of Punta Paloma the point and tower of the Peña, on a rock eighty-four steps high at the foot of the Sierra de Enmedio"
    says: "The tower of the Peña on its rock at the foot of the Sierra de Enmedio, the mark for the Cabezos."
    fix: "moved 640 m to the nearest land of the tiles"

  - id: arroyo-del-puerco
    kind: bank
    name: the shoal of Arroyo del Puerco
    modern: Bajo de Arroyo del Puerco
    lat_deg: 36.0300
    lon_deg: -5.7270
    height_m: 0
    depth_fathoms: 4.6
    bottom: "rock"
    source: "Tofiño 1787, 'Arroyo del Puerco', p. 7: a mile W of the Cabezos and 2 1/2 from Punta Paloma, a flat of stones a mile long NE and SW, narrow, with 5 to 6 brazas at three quarters flood; 15 to 20 between it and the coast"
    says: "Arroyo del Puerco, a narrow flat of stones a mile long with five or six brazas over it, a mile west of the Cabezos."
    fix: "Tofiño's distances from the Cabezos and Punta Paloma; 5 brazas (8.4 m) as English fathoms"

  - id: cabezos
    kind: rock
    name: the Cabezos
    modern: Bajo de los Cabezos
    lat_deg: 36.0190
    lon_deg: -5.7050
    height_m: 0
    extent_m: 500
    dries_m: -0.5
    source: "Tofiño 1787, 'Los Cabezos', p. 6: the most dangerous shoals for their little water and for lying farthest out; three, in the form of a horseshoe over three quarters of a mile WNW and ESE, so little water at low water springs that it comes to mid-leg on those who gather shellfish; the easternmost N 76° 54' W of the tower of the Isle of Tarifa 4 8/10 miles and S 46° 5' W 3 1/2 miles of the Peña; rare the year no vessel is lost on them; Purdy 1826, p. 2"
    says: "The Cabezos, three heads in a horseshoe nearly five miles west of the Isle of Tarifa, so shoal at low water springs that the shell-gatherers wade on them to mid-leg: rare is the year a vessel is not lost there."
    fix: "Tofiño's theodolite bearing and distance from the tower of the Isle of Tarifa; the head's water JUDGEMENT from his 'mid-leg' (half a metre)"

  - id: valdevaqueros-rock
    kind: rock
    name: the rock of Valdevaqueros
    modern: Piedra de Valdevaqueros (Bajo de la Peña)
    lat_deg: 36.0350
    lon_deg: -5.6790
    height_m: 0
    extent_m: 150
    dries_m: -3.1
    source: "Tofiño 1787, 'Baxo de Valdebaqueros', p. 7: N 58° W of the tower of the Isle of Tarifa 4 miles a small rock called of Valdebaqueros or of the Peña, 2 3/4 brazas at high water, 5 close by, rock, and 7 a little farther; between it and the tower of the Peña a channel a mile and a quarter wide with 10 brazas, sand, in its middle; Purdy 1826, p. 3: 4 1/2 fathoms rocky bottom very near to it"
    says: "The rock of Valdevaqueros, with under three brazas over it at high water, four miles west-north-west of the Isle of Tarifa; the channel inside it, a mile and a quarter wide, carries ten brazas."
    fix: "Tofiño's bearing and distance from the tower of the Isle of Tarifa (his league from the Peña agrees not; Purdy's channel of a mile and a quarter is taken); the head 2 3/4 brazas at high water less the rise, JUDGEMENT"

  # ---------------------------------------------------------------------------
  # Tarifa and the Spanish shore to Cape Carnero
  # ---------------------------------------------------------------------------

  - id: tarifa-island
    kind: island
    name: the Isle of Tarifa
    modern: Isla de las Palomas, Tarifa
    lat_deg: 36.0062
    lon_deg: -5.6085
    height_m: 15
    source: "Tofiño 1787, 'Isla de Tarifa', pp. 4 to 5: small, round and even, low on its SE side where the tower is and higher on the NW; parted from the reef that runs S from Santa Catalina by a channel a cable wide with 8 feet at low water; very clean and bold on all its outer side; the encyclopaedia's 'Punta de Tarifa' (es, read 2026-10-10)"
    says: "The Isle of Tarifa, small, round and even, the southernmost land of Europe; very clean and bold on its outer side."
    fix: "moved 560 m to the nearest land of the tiles"

  - id: tarifa-island-tower
    kind: tower
    name: the tower of the Isle of Tarifa
    modern: the tower on the Isla de las Palomas (where the lighthouse now stands)
    lat_deg: 36.0061
    lon_deg: -5.6090
    height_m: 25
    source: "Tofiño 1787, 'Isla de Tarifa', pp. 4 to 5: the tower on the low SE side of the isle, the station of his theodolite for the Cabezos"
    says: "The tower on the Isle of Tarifa, the point the Strait's dangers are laid off from."
    fix: "moved 700 m to the nearest land of the tiles"

  - id: tarifa-light
    kind: light
    name: the light of Tarifa
    modern: Faro de Punta de Tarifa
    lat_deg: 36.0061
    lon_deg: -5.6090
    height_m: 41
    lit: {from: 1826, until: null, range_nm: 18, character: "a revolving light on the isle's tower (not lit in 1805 by Tofiño's survey)"}
    source: "The encyclopaedia's 'Faro de Punta de Tarifa' (es, read 2026-10-10): the almenara of Philip II's coastal towers turned to a light, 'it must have been built in the second half of the eighteenth century', the first document a plan of 1826 whose legend reads 'Fanal giratorio y torre de Tarifa'; Purdy 1826, 'Strait of Gibraltar', p. 2: 'the lighthouse of Tarifa'; Tofiño 1787, pp. 4 to 6, describes the isle's tower and its theodolite station and names no light, nor any between Cadiz and Malaga. The year the first record's, 1826; the light's first lighting UNVERIFIED (between 1787 and 1826), and 1805 taken without it on Tofiño's silence"
    says: "The light of Tarifa, which was not yet lit in 1805."
    fix: "the tower's place on the tiles (the isle is narrower than the grid's cell; no land within 400 m of the light's own position)"

  - id: marroquina
    kind: rock
    name: the Marroquina
    modern: Piedra Marroquina
    lat_deg: 36.0001
    lon_deg: -5.6116
    height_m: 0
    extent_m: 100
    dries_m: 0.0
    source: "Tofiño 1787, 'Piedra Marroquina', p. 5: a small rock, covered at times by the sea, half a musket shot from the isle on the SW side of the tower"
    says: "The Marroquina, a small rock awash half a musket-shot south-west of the tower of the Isle of Tarifa."
    fix: "Tofiño's half a musket shot SW of the tower; awash; moved 200 m to the shoalest head of EMODnet's grid within 400 m (-4.9 m)"

  - id: santa-catalina-tarifa
    kind: church
    name: the hermitage of Santa Catalina
    modern: Ermita de Santa Catalina, Tarifa
    lat_deg: 36.0125
