# The features of the Gulf of Lion's block (package 79d, the region `gulf-of-lion`;
# docs/dev/ChartBlocks.md): Cape Creus and the Roussillon, the Languedoc shore and the
# mouths of the Rhone, Marseille, Toulon and its roads, where the French fleet lay in 1803
# to 1805 under Nelson's watch, the Hyeres islands and their road, and Provence and the
# Riviera to Nice, Villefranche, Monaco and Ventimiglia, west of 7.73 E. East of it, from
# San Remo and Genoa to Leghorn, Elba, Corsica and the Maddalena, is the region
# `ligurian-sea` (features/ligurian-sea.yaml; the Gulf split at the column edge 7.73 E by
# the lead's ruling on the package's first step). The form and the rules are
# channel-west.yaml's (its head). The sources, in the references'
# form (docs/references/README.md; the texts under docs/references/pilots/, package 79c's
# research pass, its report in docs/dev/TuningNotes.md, "Package 79c"):
#
#   Michelot 1709   Le Portulan de la mer Mediterranee (Marseille): the French coast, the
#                   Riviera and Italy; the fanals of the period. Before the period and in
#                   use through it.
#   Michelot 1715   The Mediterranean Pilot (the English of the same): the Gulf of Lyons,
#                   Provence, Genoa, Leghorn, Elba.
#   Purdy 1826      The New Sailing Directions for the Mediterranean Sea: sections IV to
#                   VIII, with Captain Smith's remarks of 1818 on the French coast, Captain
#                   Ryves's survey of the Maddalena of 1802 and Mr Atkinson's of 1804.
#   Norie 1831      New Piloting Directions for the Mediterranean Sea.
#   Purdy 1840      The New Sailing Directory for the Strait of Gibraltar and the Western
#                   Division: its 'Pharonology' dates the lights first lit after 1805.
#   Lamberti 1844   Portolano del mare Mediterraneo (Michelot in Italian with the lights).
#   Derrotero 1849  Derrotero de las costas de Europa y Africa en el Mediterraneo, desde el
#                   cabo de Creus: the spine, in Spanish; its translator's notes date the
#                   lights of the 1830s and 1840s.
#   Smyth 1854      The Mediterranean: the table of positions, the heights.
#   Admiralty 1916  The Mediterranean Pilot, vol. II (the French coast): MODERN, for the
#                   heights, depths and banks only, never for 1805's works or lights.
#   James 1837      The Naval History of Great Britain, vol. 3 (docs/references/james/):
#                   Nelson's station off Cape Sicie (p. 177); Porquerolles and the Grande
#                   Passe in June 1804 (p. 238).
#
# Where a page could not be read with confidence from an OCR's running heads the line of
# the OCR text is cited instead ("OCR l. 4821").
#
# Positions are in the modern frame (WGS 84, the EMODnet DTM 2024 grid the tiles are cut
# from), first placed from the modern chart and the pilots' bearings, then checked against
# this block's tiles by the rule of channel-west.yaml's head (a scratch script outside the
# repository: a land mark to the nearest land within 800 m, a light to land or a shoal head
# within 400 m, an anchorage to water of half the pilot's depth within 800 m, a danger to
# the nearest shoal head within 400 m); a move is said in `fix`, and the few moved farther
# by the builder's reading say so. **Islets the grid lacks** (EMODnet's sixteenth of a
# minute reads water over them: Planier, the Fourmigues of Giens, Grand Ribaud, Bagaud and
# the Fourmigue of Golfe Juan) are given as rocks of their height and an extent of
# their size (ChartBlocks.md, "An isle the grid lacks"), so that a ship cannot sail
# through them; dangers the grid does not hold (the Regas, the Veyrun, the Cassidaigne,
# the Esquillade) are left at the pilots' positions and say so. Heights are above the sea
# for the horizon: Cape Sicie's chapel, Mount Faron and Coudon over Toulon, the Esterel and
# the Maritime Alps are the great marks of this coast.
#
# The lights: a light's `lit` has `from` and `until`, so that 1805 sees what 1805 had. In
# 1805: the fanals of Cette, Port-Vendres and Marseille (Fort St Jean), each `from` the
# earliest record read (Michelot 1709 and 1715), no pilot giving the year each was first
# lit. Not yet in 1805: Cape Bearn and Mount Agde (1836, the Derrotero's notes), Camarat
# (1831), Porquerolles and the Titan (1837), La Garoupe (1 July 1837, Purdy 1840); their
# exact years, where no text dates them, UNVERIFIED and said so, the texts bracketing them
# after 1805 (Purdy 1826 and Norie 1831 name none, Purdy 1840 lists them). Planier's tower,
# lit by 1818 (Captain Smith in Purdy 1826) and unlit in Michelot 1715, has no `lit`: no
# source dates it between. `range_nm` is the period lamp's, from the pilot's leagues or
# JUDGEMENT.
#
# Not here: west of 3 E (the Canigou, Roses) is a later block's; east of 7.73 E the
# region `ligurian-sea`'s. The block reaches south to 40.56 N, where `balearics` (package
# 79c) ends, the open sea between Minorca and the Gulf with no mark in it.

region: gulf-of-lion
features:
  # ---------------------------------------------------------------------------
  # Cape Creus, the Roussillon and Languedoc, the mouths of the Rhone and Marseille (the harbour patch marseille)
  # ---------------------------------------------------------------------------

  - id: cape-creus
    kind: headland
    name: Cape de Creux
    modern: Cap de Creus
    lat_deg: 42.3189
    lon_deg: 3.3198
    height_m: 80
    fix: 'moved 190 m west to the grid''s land: the point and its islet read as water; moved 15 m to the grid''s land (the first placing read 3 m of water)'
    source: 'Michelot 1715, OCR l. 2946: ''it is the outermost part of the coast, and the beginning of the Gulf of Lyons'', the island at its foot gives perfect knowledge of it, the currents set very swiftly to the SW; Purdy 1826, OCR l. 684 (the table of positions): Cape de Creus, lat. 42 19 35; Norie 1831, OCR l. 3443 to 3518: Cape de Creux and its tower, the two islands off it; height JUDGEMENT from the modern chart (the cape''s ridge behind the point)'
    says: 'Cape de Creux, the easternmost point of Spain and the beginning of the Gulf of Lyons, a rugged high cape with a little island at its foot; the current sets hard to the south-west about it.'

  - id: cape-bear
    kind: headland
    name: Cape Bearn
    modern: Cap Béar
    lat_deg: 42.5145
    lon_deg: 3.1365
    height_m: 220
    source: 'Michelot 1715, p. 35: Cape d''Esbiere (Bearn) is a large point which stretches out the most of any upon the coast, and near it a very low rock above water; when you cannot reach Port Vendre you may anchor to the westward of it over against a sandy shore; Derrotero 1849, OCR l. 267 to 270: cabo Bearn of middling height, rough and broken, its points low, a hummock on it and further in on a bare mountain the Tower of the Devil (torre del Diablo); height the mountain over the cape, 220 m, at which the light of 1836 stands (OCR l. 271)'
    says: 'Cape Bearn, a rough broken headland of middling height running far out, the high bare ridge behind it with an old tower; Port Vendre lies close within it to the westward.'

  - id: cape-bear-light
    kind: light
    name: the light on Mount Bearn
    modern: 'the first Cap Béar light (1836), on the height above Port-Vendres'
    lat_deg: 42.514
    lon_deg: 3.124
    height_m: 220
    lit:
      from: 1836
      until: null
      range_nm: 21
      character: a fixed light
    source: 'Derrotero 1849, OCR l. 270 to 274: in 1836 a fixed light was built on cape Bearn, 220 m (720 ft) above the sea, 800 m SE of the entrance of Port Vendre, seen 7 leagues; Purdy 1840, Pharonology, p. iii: a fixed light on Mount Bearn about 875 yards to the S.E. of the entrance of Port Vendres, of the first class, 722 feet above the sea, seen seven leagues; range from the seven leagues'
    says: 'The light on Mount Bearn above Port Vendre, a fixed light very high, seen seven leagues: not lit in 1805, first shown in 1836.'

  - id: port-vendres-light
    kind: light
    name: the light-house of Port Vendre
    modern: 'Fort du Fanal, Port-Vendres'
    lat_deg: 42.5196
    lon_deg: 3.1099
    height_m: 33
    lit:
      from: 1715
      until: null
      range_nm: 9
      character: a fixed light
    fix: moved 280 m south-west to the grid's land on the north point of the entrance
    source: 'Michelot 1715, p. 35: on the starboard side going in there is a small fort with some guns in it, and in the middle of the fort a small square tower which serves for a light-house (Michelot 1709, p. 53: ''une petite tour quarree qu''on apelle le Fanal''): the date is the earliest that names it lit, the first year not in the sources; Purdy 1826, p. 49: on the north side is a small fort in which is a square light-house; Derrotero 1849, OCR l. 277 to 281: the farola on the right-hand point, ringed by a star-shaped battery, a fixed light 33 m high seen 3 leagues; Norie 1831, OCR l. 28820: a fixed light in the Fort du Fanal, 108 feet, seen 4 leagues; range JUDGEMENT for the period lamp, three leagues'
    says: 'The little square light-tower in the fort on the north point of Port Vendre''s entrance, a fixed light seen some three leagues; keep it close aboard to starboard going in.'

  - id: port-vendres
    kind: anchorage
    name: Port Vendre
    modern: 'Port-Vendres, the avant-port'
    lat_deg: 42.5212
    lon_deg: 3.1125
    height_m: 0
    depth_fathoms: 5
    bottom: sand and mud; grass and mud within
    source: 'Purdy 1826, p. 49: the entrance between the light-house point and the great rock in 9 fathoms; the best anchorage in 3 or 4 fathoms off a stone redoubt on the larboard side; good water behind a fortification at the bottom of the port; Michelot 1715, p. 35: in four, three and two fathom water, the ground grass and mud; exposed to the NE and ENE; Derrotero 1849, OCR l. 318 to 321 and 399 to 402: the avant-port within the farola and the great rock in 40 to 60 feet, sand and mud, the bottom everywhere sand and mud so that a ship grounding takes little hurt; depth JUDGEMENT within the grid''s water at the entrance'
    says: 'Port Vendre, a small deep cove under the mountains and the only port of this coast for a ship of any size: in five fathoms within the entrance, sand and mud, moored head and stern against the north-easters.'

  - id: collioure
    kind: town
    name: Collioure
    modern: Collioure
    lat_deg: 42.5255
    lon_deg: 3.0835
    height_m: 20
    source: 'Purdy 1826, p. 49: nearly a league to the north-westward of Port Vendre, the town at the foot of a rising ground with Fort Miradou, a castle on a point of rocks, an islet with a chapel off the north point, and farther inland the Fort of St. Elme on a hill which defends both Port Vendre and Collioure; frequented by small craft only, exposed to East and N.E. winds; Michelot 1715, pp. 35 and 36: the small fort of St. Elme with a tower seen a great way off; Derrotero 1849, OCR l. 420 to 446: the walled town, the islet with its hermitage, sand in 24 to 32 feet'
    says: 'Collioure, a little walled town in a bay with a castle on its rocks and a chapel on an islet, Fort St. Elme high on the hill above it; fit for small craft only, and open to the east.'

  - id: mount-st-loup
    kind: hill
    name: Mount Agde
    modern: 'Mont Saint-Loup, Cap d''Agde'
    lat_deg: 43.294
    lon_deg: 3.505
    height_m: 113
    source: 'Michelot 1715, p. 37: Mount Agde, about half a league up in the country opposite the mole, which you see a pretty way off appearing in a round figure and like an island, two houses almost at the top; Purdy 1826, p. 50: Cette known by a round mountain over the town, resembling that of Agde, which at a distance appears like an island; Derrotero 1849, OCR l. 597 to 599: monte de Agde, high enough, from afar like a sugar-loaf a little rounded with two houses on the summit; height from the modern chart'
    says: 'Mount Agde, a round hill standing alone over the low shore like an island, two houses near the top: the mark for Fort Brescou and the river of Agde.'

  - id: mount-agde-light
    kind: light
    name: the light of Mount Agde
    modern: the former light on Mont Saint-Loup
    lat_deg: 43.294
    lon_deg: 3.505
    height_m: 126
    lit:
      from: 1836
      until: null
      range_nm: 27
      character: 'a revolving light, eclipsed once a minute'
    source: 'Derrotero 1849, OCR l. 590 to 596: on Mount Saint-Loup, better known to seamen as Mount Agde, a revolving light with eclipses was placed in 1836, 126 m (387 ft) above the sea, seen 9 leagues; Purdy 1840, Pharonology, pp. iii to iv: a tower and light of the first class on the Mont d''Agde or St. Loup, a flash once a minute, 413 feet, the flashes seen nine leagues off; range from the nine leagues'
    says: 'The light on Mount Agde, a great revolving light seen nine leagues: not lit in 1805, first shown in 1836.'

  - id: fort-brescou
    kind: castle
    name: Fort Brescou
    modern: Fort de Brescou
    lat_deg: 43.2628
    lon_deg: 3.5019
    height_m: 15
    fix: 'moved 150 m south-west to the middle of the grid''s land: the islet is a few cells wide'
    source: 'Purdy 1826, p. 50: the fort of Brescou stands on a flat rock surrounded by the sea at 5 or 6 cables'' length from the shore; half-way between the mole-head and the fort a sunken rock of only 4 feet, and several rocks a full cable''s length without the fort; Michelot 1715, p. 37: a small fort with four bastions on a flat rock; you may anchor at a cable''s distance between Fort Brescou and the shore in three fathom and a half, the ground ooze and grass, sheltered from the SW sea by the chain of rocks; height JUDGEMENT (the fort on its rock)'
    says: 'Fort Brescou, a little four-bastioned fort on a flat rock half a league off Mount Agde; small vessels lie within it in three fathom and a half, ooze and grass, but give the rocks about it a berth.'

  - id: mount-st-clair
    kind: hill
    name: Mount Cette
    modern: 'Mont Saint-Clair, Sète'
    lat_deg: 43.3965
    lon_deg: 3.6805
    height_m: 175
    source: 'Michelot 1715, p. 37: Mount Cette appears almost like Mount Agde from the offing, but from the eastward like the awning of a galley, and like an island which way soever you see it; on the top an hermitage with some old ruins of fortifications and reddish spots; Purdy 1826, p. 50: a round mountain over the town, resembling that of Agde, which at a distance appears like an island; on the top an old hermitage; Derrotero 1849, OCR l. 660 to 666: from the east long and flat-topped, the hermitage of Santa Clara and a fortified barrack like white spots; height from the modern chart'
    says: 'Mount Cette, a long round hill alone between the sea and the great pond, the hermitage of St. Clair on its top; from the offing it shows like an island.'

  - id: cette-light
    kind: light
    name: the light of Cette
    modern: 'Fort Saint-Louis, Sète, the môle Saint-Louis'
    lat_deg: 43.3967
    lon_deg: 3.7
    height_m: 25
    lit:
      from: 1709
      until: null
      range_nm: 9
      character: a fixed light
    fix: moved 30 m north to the grid's land on the mole; moved 15 m to the grid's land or shoal head
    source: 'Michelot 1709, p. 57: at the end of the mole a battery and a tower in the middle on which is a fanal lit in the evening for knowing the place by night (''un fanal qu''on allume le soir''): the date is the earliest the sources show it lit, the first year not in them; Michelot 1715, p. 37: a tower on the middle of the mole, on the top of which is a lanthorn lighted every night; Purdy 1826, p. 50: a mole about 280 fathoms with a battery and a light-tower on its end; Derrotero 1849, OCR l. 716 to 721: the battery of St. Louis about the light, fixed, 25 m, seen 10 miles; Norie 1831, OCR l. 28832: fixed, 84 feet, seen 4 leagues; range JUDGEMENT for the period lamp, three leagues'
    says: 'The light on the mole of Cette, a fixed light lit every night; pass within half a ship''s length of the mole-head going in, for the deep water is there.'

  - id: aigues-mortes
    kind: town
    name: Aigues-Mortes
    modern: Aigues-Mortes
    lat_deg: 43.568
    lon_deg: 4.191
    height_m: 30
    source: 'Purdy 1826, p. 50: the town of Aigues-mortes (pronounced eg-mort) on the low land upon the edge of a salt-pond, 25 miles from Cette; several shoal banks hereabout which render anchoring dangerous with southerly winds; p. 51: many vessels carried by the current into the bight of Aigues-mortes and wrecked; Michelot 1715, p. 38: the town about a league from the shore, though formerly the sea reached its walls; in the gulf you may anchor in four, five and six fathom sheltered from the E and ESE; height the town''s great tower (the Tour de Constance) from the modern chart'
    says: 'Aigues-Mortes, the old walled town behind the salt-ponds a league from the sea, its great round tower over the marsh; keep a good offing from the bight, where the current sets ships ashore with southerly winds.'

  - id: tour-du-tampan
    kind: tower
    name: the Tower of Tampan
    modern: 'the Tour du Tampan (Saint-Genest), Camargue (gone)'
    lat_deg: 43.37
    lon_deg: 4.645
    height_m: 20
    fix: 'the tower is gone: placed from Smyth''s table (the Tanpan, lat. 43 21 37, corrected by the 0.004 degrees his St. Louis tower lies south of its site) and the Derrotero''s bearing of the Camargue light, 2 miles S.E. by S. of St. Genest; uncertain by half a mile'
    source: 'Michelot 1715, p. 39: about 4 or 5 miles north from the Point of Tignes a large square tower called the Tower of Tampan, standing on low ground, on the top a sort of sentry-box which at a distance looks like the sail of a ship; seen a great deal sooner than the land, one of the marks to know the low point by; Derrotero 1849, OCR l. 957 to 962: on the tongue ending the Camargue to the south an old tower called by the country people the tower of Tumpan and of St. Genest by the charts; Smyth 1854, OCR l. 25514 (the table of positions): Rhone Delta, Tanpan douane; height JUDGEMENT'
    says: 'The Tower of Tampan, a great square tower on the low Camargue with a watch-box on its top like a sail, seen before the land: the mark for the Point of Tignes and the mouths of the Rhone.'

  - id: tour-st-louis
    kind: tower
    name: the Tower of St. Louis
    modern: 'Tour Saint-Louis, Port-Saint-Louis-du-Rhône'
    lat_deg: 43.3866
    lon_deg: 4.8048
    height_m: 20
    source: 'Purdy 1826, p. 51: the chief entrance of the Rhone may be found by the tower of St. Louis, which stands on the north bank of the river and may be seen much sooner than the land about it; the sands at the entrance often shift and no stranger can enter without a pilot; Derrotero 1849, OCR l. 967 to 969: the river runs straight 4 miles to the tower of St. Louis, where it divides into three branches; Smyth 1854, OCR l. 25513: Rhone Delta, S. Louis tower; Modern chart: the tower built in 1737; height JUDGEMENT'
    says: 'The Tower of St. Louis on the north bank at the great mouth of the Rhone, seen long before the low land; the bar shifts, and none should go in without a pilot.'

  - id: tour-de-bouc
    kind: castle
    name: the Tower of Bouc
    modern: 'Fort de Bouc, Port-de-Bouc'
    lat_deg: 43.398
    lon_deg: 4.9838
    height_m: 30
    fix: 'moved 230 m north-west to the grid''s land: the fort''s islet reads as water'
    source: 'Purdy 1826, p. 51: on the south side of the mouth of Bouc harbour is a fortress with a square tower called the Tower of Bouc, which, being composed of white stone, may be seen a great way off; Michelot 1715, p. 40: a fortress with a square tower in the middle of white stone, seen a great way off, on the low point of an island separated from the main by a small rivulet; Derrotero 1849, OCR l. 1046 to 1052; Norie 1831, OCR l. 28845: a light shown from the tower of the fort, 98 feet (in 1831; the year it was first shown not found, so no light is entered); height from Norie''s elevation'
    says: 'The Tower of Bouc, a white square tower in a fort on the south point of the entrance to Martigues, seen a great way off over the low shore.'

  - id: bouc-harbour
    kind: anchorage
    name: the Harbour of Bouc
    modern: 'Port-de-Bouc, the anse within the entrance'
    lat_deg: 43.402
    lon_deg: 4.99
    height_m: 0
    depth_fathoms: 3
    bottom: mud and grass
    source: 'Purdy 1826, p. 51: the harbour appears large but is very shallow except in the middle, from 4 to 2 1/2 fathoms on mud and grass; the mouth about 150 fathoms broad; within the entrance the ledge le Foucard with 5 or 6 feet; p. 52: anchor with Languette Point bearing west; Michelot 1715, p. 40: the best anchorage to the ENE of the low point Languette, 13 and 14 foot water, the ground mud and grass; open to the SW; Derrotero 1849, OCR l. 1074 to 1076: 15 or 16 feet, weed and mud'
    says: 'The harbour of Bouc within the white tower, three fathoms on mud and grass with Languette Point bearing west; mind the Foucard ledge within the north point.'

  - id: cape-couronne
    kind: headland
    name: Cape Couronne
    modern: Cap Couronne
    lat_deg: 43.3268
    lon_deg: 5.0535
    height_m: 25
    source: 'Purdy 1826, p. 52: Cape Couronne, nearly 5 miles S. by E. from the Tower of Bouc, is smooth and low; the Bay of Marseille between it and Cape Croisette, the one low and the other high; Michelot 1715, p. 41: you know Cape Couronne by its being a smooth low point, the free-stone of Marseilles is fetched from hence; Derrotero 1849, OCR l. 1104 to 1106: a low point, even and well out, the western end of the bay of Marseille; height JUDGEMENT from the grid'
    says: 'Cape Couronne, a smooth low point, the western horn of the Bay of Marseilles; give it a mile for the Regas off it.'

  - id: the-regas
    kind: ledge
    name: the Regas
    modern: 'the Régas shoal, off Cap Couronne'
    lat_deg: 43.3165
    lon_deg: 5.042
    height_m: 0
    dries_m: -1.7
    extent_m: 300
    fix: 'placed by the pilots'' bearing and distance, a mile S.W. of the cape between Purdy''s S.S.W. and Michelot''s W.S.W.: the grid does not resolve the ledge; the grid has no shoal here (EMODnet''s sixteenth of a minute does not hold it, ChartBlocks.md): left at the pilot''s position, a danger by name'
    source: 'Purdy 1826, p. 52: the Regas, a ledge of rocks and sand with 5 or 6 feet over it, lies at the distance of a mile S.S.W. from the cape, and between this and the land are two other shoals with less water; Michelot 1715, p. 41: WSW from the point of Cape Couronne a ledge of rocks and sand under water called Regas, about a mile from the land, with only 5 or 6 foot water, so that the sea breaks there in blowing weather; Derrotero 1849, OCR l. 1107 to 1110: the Regas, very dangerous, breaking almost continually, 5 to 6 feet'
    says: 'The Regas, a ledge of rock and sand a mile off Cape Couronne with but five or six feet on it, breaking in any wind; pass without it.'

  - id: planier
    kind: island
    name: Planier
    modern: Île du Planier
    lat_deg: 43.199
    lon_deg: 5.23
    height_m: 10
    extent_m: 200
    grid_lacks: true
    fix: 'an islet the grid lacks (water in EMODnet''s grid, ChartBlocks.md ''An isle the grid lacks''): given as an island the grid lacks (`grid_lacks`), its height and an extent of its size (a rock until package 94), so that a ship cannot sail through it'
    source: 'Michelot 1715, p. 43: a small island called Planier, because it is very plain and low, upon which there is an uninhabited tower which only serves to let you know it; do not come near it to the SW, SE and East for rocks stretching about a mile; p. 41: a small flat island lying a great way out with a tower upon it, called the Tower of Planier; Purdy 1826, p. 52: the Isle of Planier, almost level with the water, but having a white tower on it which may be seen afar off; p. 54 (Mr. Smith, master of the Ganymede, 1818): a light is exhibited by night on the white tower, seen 3 or 4 leagues (the year it was first lit not found in the sources, so no light is entered); height JUDGEMENT for the low island and its tower'
    says: 'Planier, a low flat island far out in the mouth of the bay with a white tower on it, seen before the island; foul with rocks a mile to the south-east and south-west.'

  - id: the-veyrun
    kind: rock
    name: the Veyrun
    modern: 'the Veyron shoal, east of Planier'
    lat_deg: 43.1906
    lon_deg: 5.248
    height_m: 0
    dries_m: -4.6
    extent_m: 200
    fix: 'placed by the pilots'' bearing and distance, a mile E.S.E. of Planier: the grid does not resolve the shoal; the grid has no shoal here (EMODnet''s sixteenth of a minute does not hold it, ChartBlocks.md): left at the pilot''s position, a danger by name'
    source: 'Purdy 1826, p. 52: a shoal of rocks called the Veyrun, having a depth of only 15 feet, lies S.E. 1/2 E. nearly a mile from Planier, the only danger hereabout; p. 54 (Mr. Smith, 1818): the Veyrun, a reef of rocks with 15 feet of water upon them, one mile E.S.E. from Planier; Derrotero 1849, OCR l. 1333 to 1339: the Vaire-un, a mile E. 1/4 S.E. of the tower, 1 and 2 brazas, the sea breaking on it in bad weather'
    says: 'The Veyrun, a reef with fifteen feet on it a mile east-south-east of Planier, breaking in bad weather: give Planier a mile and a half in a great ship.'

  - id: ratonneau
    kind: island
    name: Ratoneau
    modern: 'Île Ratonneau, the Frioul'
    lat_deg: 43.2805
    lon_deg: 5.308
    height_m: 74
    fix: 'on the grid''s land, 400 m south of the island''s middle: the grid keeps only the islands'' eastern ends'
