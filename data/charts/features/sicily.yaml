    says: 'Port Miggiaro, Gozo''s landing, under Fort Chambray: a road for a short stay in ten fathoms of sand, open to the east, the west and the south.'

  - id: fort-chambray
    kind: castle
    name: Fort Chambray
    modern: 'Fort Chambray'
    lat_deg: 36.0220
    lon_deg: 14.2965
    height_m: 60
    source: 'Purdy 1826, p. 162: Fort Chambray on the south-east coast of Gozo; Smyth 1854, p. 445: 35 59 37 N, 14 16 55 E'
    says: 'Fort Chambray on the height over Port Miggiaro.'

  - id: filfla
