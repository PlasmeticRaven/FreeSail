    modern: 'Siracusa (Ortigia)'
    lat_deg: 37.0620
    lon_deg: 15.2930
    height_m: 15
    source: 'Smyth 1824, p. 170: the modern town wholly on the island of Ortygia; p. 163: salt, wine, oil and fish its only trade; Nelson''s fleet refitted here in five days in 1798; Purdy 1826, pp. 142 to 143: the entrance half a mile wide under the castle of Maniace and its light, the people about 13,000'
    says: 'Syracuse on its island of Ortygia, walled, the Great Harbour to the west of it.'

  - id: maniace
    kind: castle
    name: the castle of Maniace
    modern: 'Castello Maniace'
    lat_deg: 37.0545
    lon_deg: 15.2935
    height_m: 15
