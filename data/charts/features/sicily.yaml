# The features of Sicily and Malta's block (package 105, the region `sicily`;
# docs/dev/ChartBlocks.md): step 2's marks, Malta and Gozo with Comino and Filfla, the east
# coast of Sicily from Cape Passaro by Syracuse, Augusta and Catania to Messina, the Faro
# of Messina with Scylla and Charybdis, Milazzo, and Calabria's toe from Scylla by Reggio
# to Cape Spartivento. South of 38.5 N, where `tyrrhenian` ends; east of 11.1466 E, where
# `tunis-coast` ends. The form and the rules are channel-west.yaml's (its head). The
# sources, in the references' form (docs/references/README.md; the texts under
# docs/references/pilots/; this package's short pass in docs/dev/TuningNotes.md, "Package
# 105"):
#
#   Smyth 1824      Memoir Descriptive of the Resources, Inhabitants, and Hydrography, of
#                   Sicily and its Islands: his survey of 1814 to 1816; the coasts (chs.
#                   III to VII) and the Appendix's hydrographical description (pp. i to
#                   xxxvi) and table of positions (pp. xxxvii to xl, east of Greenwich).
#                   Bearings true. The first authority for Sicily and the Faro.
#   Purdy 1826      The New Sailing Directions for the Mediterranean Sea: Malta (pp. 157 to
#                   166), the Faro and Sicily's east coast (pp. 134 to 144, much of it
#                   Smyth's), Calabria (pp. 115 to 116). Bearings by compass, the true in
#                   brackets; the variation at Malta 17 1/2 to 18 degrees west.
#   Norie 1831      New Piloting Directions for the Mediterranean Sea: Malta (pp. 142 to
#                   146), the Faro (pp. 133 to 136, with Mr Blyth's notes). Bearings true,
#                   the magnetic in brackets.
#   Lamberti 1844   Portolano del mare Mediterraneo, Malta, p. 197 (after the period).
#   Smyth 1854      The Mediterranean: the Faro's currents (pp. 179 to 181), the winds (pp.
#                   250 to 253), the table of positions (pp. 442 to 445).
#   Admiralty 1913  The Mediterranean Pilot, vol. I, chs. VII and VIII: MODERN, for the
#                   heights and depths only.
#
# Positions are in the modern frame (WGS 84, the EMODnet DTM 2024 grid), first placed from
# the modern map and the pilots, then checked against this block's tiles by the rule of
# channel-west.yaml's head (a scratch script outside the repository: a land mark on the
# grid's land, a road on water of about the pilot's depth, a danger on the grid's shoal
# head); a move is said in `fix`. Smyth's longitudes run a minute or two east of the grid's
# (the Faro's light 15 40 40 E against the modern point's 15 39 E).
#
# The lights. The Faro's lighthouse was built on an ancient tower's ruins "two hundred
# years" before Smyth wrote (1824, p. 108: about the 1620s, the year not given), and stood
# in the period; Messina's light was "so indifferent" that Smyth advised no stranger to
# pass the Faro by night (p. 111); Milazzo had a "miserable little light-house" (p. viii)
# and Augusta a "miserable" light on the Torre d'Avalos (p. 161). No source on file gives
# the year St Elmo's light at Valletta was first lit, nor its character before Lamberti's
# revolving light of 1844: St Elmo is entered as its fort, not as a light. Messina's and
# the Faro's are entered lit from 1624 and 1700 (JUDGEMENT: the Faro's Smyth's two hundred
# years; Messina's before the period, its year not read), their ranges JUDGEMENT.
#
# Not here: the Adventure bank (no period pilot on file names it: Smyth surveyed it in the
# Adventure after his Memoir, and the pilots of 1826 and 1831 have it not); Graham's shoal,
# which rose in 1831; the west, the south coast and the islands (step 3).
region: sicily
features:
  # ---------------------------------------------------------------------------
  # Malta: Valletta, the Grand Harbour and Marsamxett (the harbour patch valletta)
  # ---------------------------------------------------------------------------

  - id: valletta
    kind: town
    name: Valletta
    modern: 'Valletta'
    lat_deg: 35.8983
    lon_deg: 14.5129
    fix: 'moved 102 m to the grid''s land'
    height_m: 50
    source: 'Purdy 1826, p. 164: the city on its peninsula between the Grand Port and Marsa Muscetto, its first stone laid by the Grand Master La Valette in 1566; Smyth 1854, p. 445: the palace 35 53 55 N, 14 30 50 E'
    says: 'Valletta on its ridge of rock between the two harbours, its walls and bastions and the dome of its churches over them.'

  - id: st-elmo
    kind: castle
    name: Fort St Elmo
    modern: 'Fort St Elmo'
    lat_deg: 35.9015
    lon_deg: 14.5193
    height_m: 20
    source: 'Purdy 1826, p. 164: St Elmo on the point of the peninsula defends both entrances; its round light-tower appears like a sail from the east or north (the year of the light not given); Norie 1831, p. 144: St Elmo 35 54 6 N, 14 31 10 E; Smyth 1854, p. 445: the light 35 54 12 N, 14 31 20 E, 167 feet'
    says: 'Fort St Elmo on the point between the two harbours, its round tower showing like a sail.'

  - id: fort-ricasoli
    kind: castle
    name: Fort Ricasoli
    modern: 'Fort Ricasoli'
    lat_deg: 35.8947
    lon_deg: 14.5278
    fix: 'moved 456 m to the grid''s land'
    height_m: 15
    source: 'Purdy 1826, p. 164: Punta del Orsa (Ricasoli) on the eastern side of the entrance, the Grand Port no more than 250 fathoms wide between it and St Elmo; Norie 1831, p. 144 (350 fathoms); Lamberti 1844, p. 197'
    says: 'Fort Ricasoli on the eastern point of the Grand Harbour''s mouth.'

  - id: ricasoli-reef
    kind: rock
    name: the reef off Ricasoli
    modern: 'the reef off Ricasoli point'
    lat_deg: 35.8986
    lon_deg: 14.5273
    fix: 'moved 128 m to the grid''s shoal head (9.0 m)'
    height_m: 0
    dries_m: -5.2
    extent_m: 40
    source: 'Purdy 1826, p. 164: a small reef of 17 feet on the eastern side of the entrance, 20 or 30 fathoms from Punta del Orsa, with 5 fathoms close to it; Norie 1831, p. 144; Lamberti 1844, p. 197 (25 braccia from Ricasoli)'
    says: 'A reef of seventeen feet off Ricasoli point, five fathoms close to it: keep the middle of the mouth.'

  - id: valletta-outer-road
    kind: anchorage
    name: off the mouth of the Grand Harbour
    modern: 'off the entrance of Grand Harbour'
    lat_deg: 35.9035
    lon_deg: 14.5300
    height_m: 0
    depth_fathoms: 18
    bottom: soft mud and clay
    source: 'Purdy 1826, p. 164: should the wind be scant or out of the harbour anchor any way off the entrance in 15 to 20 fathoms and warp in, the entrance too narrow and the wind too variable to turn in; without, 80 to 60 fathoms of fine soft mud and clay; a pilot always to be had on making the usual signal off the harbour; Norie 1831, p. 144'
    says: 'Off the mouth of the Grand Harbour, fifteen to twenty fathoms: anchor here and warp in, for the mouth is too narrow to turn in. Make the signal and a pilot comes off.'

  - id: grand-harbour
    kind: anchorage
    name: the Grand Harbour
    modern: 'Grand Harbour, above Senglea point'
    lat_deg: 35.8870
    lon_deg: 14.5130
    height_m: 0
    depth_fathoms: 10
    bottom: mud
    source: 'Purdy 1826, p. 165: the men-of-war above Sanglea Point in 10 and 11 fathoms, Sanglea Point East and the dome of Floriana N W by compass; the merchant ships along the western shore from the Pratique Office up to Floriana; Bighi bay for summer only, a north wind sending in a heavy sea; Norie 1831, p. 144 (the marks true); Smyth 1854, p. 251: the gregale rakes the harbours of Valletta and sends in a prodigious swell; Admiralty 1913, p. 500: 14 to 5 fathoms to the Gun Wharf (the depths)'
    says: 'The Grand Harbour, ten and eleven fathoms above Senglea point for men-of-war, the merchantmen along the Valletta side; safe from all but the gregale, which sends in a heavy swell.'

  - id: marsamxett
    kind: anchorage
    name: Marsamxett, the quarantine harbour
    modern: 'Marsamxett Harbour, above Manoel island'
    lat_deg: 35.8979
    lon_deg: 14.5040
    fix: 'moved 120 m to the grid''s water of about the pilot''s depth'
    height_m: 0
    depth_fathoms: 8
    bottom: mud
    source: 'Purdy 1826, p. 165: Marsa Muscetto the quarantine harbour, its entrance 150 fathoms wide under Fort Tigne; a reef of 2 to 2 1/2 fathoms round Point Dragut, cleared by keeping Ricasoli open of St Elmo; anchor off in 14 or 15 fathoms and warp in, the best berth above Lazaretto island; water opposite the lazaretto; Norie 1831, p. 145 and its note of the quarantine dues of 1 January 1830; Admiralty 1913, p. 499: 5 to 18 fathoms (the depths)'
    says: 'Marsamxett, the quarantine harbour, where a ship from a foul port lies above the lazaretto island to do her quarantine.'

  - id: manoel-lazaretto
    kind: castle
    name: Fort Manoel and the lazaretto
    modern: 'Fort Manoel, Manoel island'
    lat_deg: 35.9010
    lon_deg: 14.5060
    fix: 'moved 333 m to the grid''s land'
    height_m: 15
    source: 'Purdy 1826, p. 165: the fort and the lazaretto on Manuel island, the lazaretto on its south side; the Pratique Office opposite Fort Manuel; Norie 1831, p. 145'
    says: 'Fort Manoel on its island in Marsamxett, the lazaretto under it on the south side.'

  # ---------------------------------------------------------------------------
  # Malta: Marsaxlokk, the east coast and St Paul's Bay (the harbour patches marsaxlokk and st-pauls-bay)
  # ---------------------------------------------------------------------------

  - id: marsaxlokk
    kind: anchorage
    name: Marsa Scirocco
    modern: 'Marsaxlokk Bay'
    lat_deg: 35.8322
    lon_deg: 14.5539
    fix: 'moved 224 m to the grid''s water of about the pilot''s depth'
    height_m: 0
    depth_fathoms: 9
    bottom: good holding ground
    source: 'Purdy 1826, p. 166: a very safe harbour except in southerly winds, which seldom blow home; good holding in 5 to 15 fathoms, the north-east side the safest; ships of the line outside, north-east of the shoal and half a mile off it, in 20 to 22 fathoms; St Lucian''s castle N by W 1/2 W by compass the leading mark; Norie 1831, p. 146; Lamberti 1844, p. 197: good in all winds but the south, the best berth on the north-east side in 5 to 9 passa'
    says: 'Marsa Scirocco, a safe bay in five to fifteen fathoms, the north-east side the best; only a southerly blowing home troubles it.'

  - id: benghisa-reef
    kind: shoal
    name: the Benhisa reef
    modern: 'the reef off Benghisa point'
    lat_deg: 35.8074
    lon_deg: 14.5401
    fix: 'moved 881 m to the grid''s shoal head (9.1 m)'
    height_m: 0
    dries_m: -5.5
    extent_m: 150
    source: 'Purdy 1826, p. 166: the reef a mile S S E 1/2 E by compass from Benhisa tower, 3 to 9 fathoms over it and 10 to 20 round; the passage between it and the point not safe, 3 or 4 fathoms a cable off the point; it breaks in southerly winds (Norie 1831, p. 146: south-westerly)'
    says: 'The Benhisa reef, three fathoms at the least, a mile off the point at the south end of Marsa Scirocco: do not pass inside it.'

  - id: munxar-reef
    kind: ledge
    name: the Munxar reef
    modern: 'the Munxar reef off St Thomas bay'
    lat_deg: 35.8662
    lon_deg: 14.5727
    fix: 'moved 1401 m to the grid''s shoal head (0.1 m)'
    height_m: 0
    dries_m: -1.5
    extent_m: 200
    source: 'Purdy 1826, p. 165: from the white cliff south of Marsa Scala the Munxar reef runs due east by compass two miles, 5 feet to 9 fathoms, 17 fathoms close to; Norie 1831, p. 145: E N E 1/2 E true, a mile and a half'
    says: 'The Munxar reef, five feet at its shoalest, running out a mile and more from the cliffs south of Marsa Scala.'

  - id: st-pauls-bay
    kind: anchorage
    name: St Paul's Bay
    modern: 'St Paul''s Bay'
    lat_deg: 35.9486
    lon_deg: 14.4080
    fix: 'moved 180 m to the grid''s water of about the pilot''s depth'
    height_m: 0
    depth_fathoms: 8
    bottom: soft mud and clay
    source: 'Purdy 1826, p. 164: the entrance a mile and more between Salmonetta and Kaura point; open to easterly and north-easterly winds, but the anchors will never start while the cables hold; the best berth abreast the little harbour on the starboard hand going in, 10 to 6 fathoms of soft mud and clay; foul ground of 7 and 6 1/2 fathoms a quarter of a mile south of Salmonetta; Norie 1831, p. 143'
    says: 'St Paul''s Bay, six to ten fathoms of soft mud and clay, open to the east and north-east but holding well.'

  - id: salmonetta
    kind: island
    name: Salmonetta (St Paul's islands)
    modern: 'St Paul''s Islands (Selmunett)'
    lat_deg: 35.9654
    lon_deg: 14.3968
    fix: 'moved 398 m to the grid''s land'
    height_m: 20
    source: 'Purdy 1826, p. 164: Salmonetta at the west side of the entrance of St Paul''s Bay; St Paul''s tower over it S by W 1/2 W the mark for the bank''s winter anchorage (p. 163); the height Admiralty 1913 (modern)'
    says: 'Salmonetta, the low islet off the western point of St Paul''s Bay.'

  # ---------------------------------------------------------------------------
