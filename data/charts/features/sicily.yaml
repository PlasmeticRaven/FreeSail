    grid_lacks: true
    extent_m: 120
    source: 'Purdy 1826, p. 166: Filfla half a league off the south coast, 27 to 37 fathoms between it and Malta (his mile in length too long: the Admiralty 1913, p. 506, gives 190 feet high and two cables long, the height); Norie 1831, p. 146: W S W 6 miles from Benhisa, 2 miles off the coast; Lamberti 1844, p. 198: one may pass inside it in 30 passa'
    says: 'Filfla, a lone rock of an island off Malta''s south coast.'

  # ---------------------------------------------------------------------------
  # Cape Passaro and Syracuse (the harbour patches passaro and syracuse)
  # ---------------------------------------------------------------------------

