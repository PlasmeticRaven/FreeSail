    says: 'Comino and its tower between Malta and Gozo, a fair channel either side of it.'

  - id: mgarr
    kind: anchorage
    name: Port Miggiaro
    modern: 'Mgarr, Gozo'
    lat_deg: 36.0230
    lon_deg: 14.3020
    height_m: 0
    depth_fathoms: 10
    bottom: sand
