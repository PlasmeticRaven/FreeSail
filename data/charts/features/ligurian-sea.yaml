# The features of the Ligurian sea's block (package 79d, the region `ligurian-sea`, the
# Gulf of Lion's east part by the lead's ruling on the package's first step, east of the
# column edge 7.73 E; docs/dev/ChartBlocks.md): the western Riviera from San Remo to
# Genoa, Portofino and the gulf of Spezia, Leghorn and the Meloria, the Tuscan islands
# and Elba, Corsica whole, and the Maddalena islands with Agincourt Sound and the north
# shore of Sardinia, where Nelson's fleet watered in 1803 to 1805 while it watched Toulon.
# West of 7.73 E is the region `gulf-of-lion` (features/gulf-of-lion.yaml). The form and
# the rules are channel-west.yaml's (its head). The sources, in the references'
# form (docs/references/README.md; the texts under docs/references/pilots/, package 79c's
# research pass, its report in docs/dev/TuningNotes.md, "Package 79c"):
#
#   Michelot 1709   Le Portulan de la mer Mediterranee (Marseille): the French coast, the
#                   Riviera and Italy; the fanals of the period. Before the period and in
#                   use through it.
#   Michelot 1715   The Mediterranean Pilot (the English of the same): the Gulf of Lyons,
#                   Provence, Genoa, Leghorn, Elba.
#   Purdy 1826      The New Sailing Directions for the Mediterranean Sea: sections IV to
#                   VIII, with Captain Smith's remarks of 1818 on the French coast, Captain
#                   Ryves's survey of the Maddalena of 1802 and Mr Atkinson's of 1804.
#   Norie 1831      New Piloting Directions for the Mediterranean Sea.
#   Purdy 1840      The New Sailing Directory for the Strait of Gibraltar and the Western
#                   Division: its 'Pharonology' dates the lights first lit after 1805.
#   Lamberti 1844   Portolano del mare Mediterraneo (Michelot in Italian with the lights).
#   Derrotero 1849  Derrotero de las costas de Europa y Africa en el Mediterraneo, desde el
#                   cabo de Creus: the spine, in Spanish; its translator's notes date the
#                   lights of the 1830s and 1840s.
#   Smyth 1828      Sketch of the Present State of the Island of Sardinia: the Maddalena
#                   and Nelson's berth at Mezzo Schifo (Agincourt Sound).
#   Smyth 1854      The Mediterranean: the table of positions, the heights.
#   Admiralty 1913, 1916   The Mediterranean Pilot, vols. I (ch. IX, Sardinia) and II (the
#                   French coast, Corsica, Italy): MODERN, for the heights, depths and
#                   banks only, never for 1805's works or lights.
#   James 1837      The Naval History of Great Britain, vol. 3 (docs/references/james/):
#                   Nelson's station off Cape Sicie and the fleet in Agincourt Sound,
#                   31 October 1803 (pp. 176 to 177).
#
# Where a page could not be read with confidence from an OCR's running heads the line of
# the OCR text is cited instead ("OCR l. 4821").
#
# Positions are in the modern frame (WGS 84, the EMODnet DTM 2024 grid the tiles are cut
# from), first placed from the modern chart and the pilots' bearings, then checked against
# this block's tiles by the rule of channel-west.yaml's head (a scratch script outside the
# repository: a land mark to the nearest land within 800 m, a light to land or a shoal head
# within 400 m, an anchorage to water of half the pilot's depth within 800 m, a danger to
# the nearest shoal head within 400 m); a move is said in `fix`, and the few moved farther
# by the builder's reading say so. **Islets the grid lacks** (EMODnet's sixteenth of a
# minute reads water over them: Tino, Palmaiola, the Formiche of Grosseto, the Giraglia,
# the Lavezzi and the Sanguinaires) are given as rocks of their height and an extent of
# their size (ChartBlocks.md, "An isle the grid lacks"), so that a ship cannot sail
# through them; dangers the grid does not hold (the Maddalena's reefs from Ryves's and
# Atkinson's surveys, the Algajola shoal) are left at the pilots' positions
# and say so. Heights are above the sea for the horizon: the mountains of Corsica (Monte
# Cinto 2,706 m, seen thirty leagues off) and of Elba are the great marks of this sea
# (`chart.SEARCH_HEIGHT_M`, package 39e).
#
# The lights: a light's `lit` has `from` and `until`, so that 1805 sees what 1805 had. In
# 1805: Genoa's Lanterna and Leghorn's tower, each `from` the earliest record read
# (Michelot 1709 and 1715) where no pilot gives the year it was first lit, the builder's
# memory of the true year (Genoa's of 1543, Leghorn's of 1303) said UNVERIFIED beside it.
# Not yet in 1805: the Tino (1838, Purdy 1840), and Corsica's coast lights (the Revellata, the Sanguinaires and
# Pertusato in the 1840s, the Giraglia 1848: Purdy 1840 names only Bastia's on the island,
# the Derrotero 1849 the rest lit or building). Porto Ferrajo's on Fort Stella and Bastia's
# mole-head fire are `from` 1826, the earliest record read, UNVERIFIED (for the lead: the
# builder's memory has Porto Ferrajo's of 1788). `range_nm` is the period lamp's, from the pilot's leagues or JUDGEMENT.
#
# Not here: Monte Argentario, Port Ercole and Giannutri, east of 11 E, are the Tyrrhenian's
# (the region `tyrrhenian`, built after this one), as is Sardinia south of 40.99 N (Monte
# Limbara among it); west of 7.73 E the region `gulf-of-lion`'s.

region: ligurian-sea
features:
  # ---------------------------------------------------------------------------
  # The western Riviera from San Remo to Genoa (the harbour patch genoa)
  # ---------------------------------------------------------------------------

  - id: san-remo
    kind: town
    name: St. Remo
    modern: Sanremo
    lat_deg: 43.816
    lon_deg: 7.7745
    height_m: 50
    source: 'Purdy 1826, p. 66: between Cape Nero and Cape dell''Arma, each with a square watch-tower, the small and pleasant town of St. Remo on a little rising ground, gardens with orange, lemon and palm trees; within a small mole 6 to 8 feet; large vessels anchor off the town at a mile in 7 or 8 fathoms on mud and sand; Derrotero 1849, p. 65: at San Remo anchor in 6 to 10 brazas, sand and mud; height JUDGEMENT'
    says: 'St. Remo, the little town on its rising ground among orange and palm trees, between two capes with square towers; ships lie a mile off in seven or eight fathoms, mud and sand.'

  - id: cape-delle-mele
    kind: headland
    name: Cape delle Melle
    modern: Capo Mele
    lat_deg: 43.958
    lon_deg: 8.17
    height_m: 221
    source: 'Purdy 1826, p. 66: Cape delle Melle five miles E.N.E. 1/2 E. from Cape Verde or Oneglia, a large high point, almost round, projecting far into the sea, a watch-tower on it with two houses adjoining; Michelot 1715, p. 57 (OCR l. 4652): the point that stretches the most out into the sea of any upon this coast; Derrotero 1849, p. 66: when coming from the W. along the coast Cape Mele is the last that can be seen to the E., the coast falling away N.E. beyond it; some reckon it the western limit of the gulf of Genoa; Admiralty 1916, p. 247: steep, rounded, covered with olive trees, 725 feet high'
    says: 'Cape delle Melle, the great round high cape with its watch-tower, standing out farthest of any on the Riviera of the west; beyond it the coast falls away to the north-east for Genoa.'

  - id: alassio-road
    kind: anchorage
    name: the road of Alassio
    modern: Baia di Alassio
    lat_deg: 43.9965
    lon_deg: 8.186
    height_m: 0
    depth_fathoms: 12
    bottom: sand and mud
    source: 'Purdy 1826, p. 67: the town of Allassio a league from Cape delle Melle, three small forts and a small mole; anchor opposite it at a mile, the best berth with the church-steeple on with another farther inland, in from 18 to 10 fathoms on sand and mud; the S.E. winds blow in but a current generally sets to the S.W.; Derrotero 1849, p. 66: the anchorage before the town in 12 to 18 brazas, bottom mud, sheltered from the W.'
    says: 'Alassio road, a mile off the long town with its three little forts, ten to eighteen fathoms on sand and mud, the church steeple on with the one inland; the current sets south-west.'

  - id: gallinara
    kind: island
    name: Isola Galinara
    modern: Isola Gallinara
    lat_deg: 44.0255
    lon_deg: 8.2255
    height_m: 87
    source: 'Purdy 1826, p. 67: the Isola Galinara, about a mile in circumference, a mile to the southward of Albenga, very high, with a watch-tower; anchor to the west of it in 14 to 10 fathoms with a fast upon the island; a channel between it and the coast with 9 fathoms in the middle, shoal near the coast; the town of Albenga a mile up the country with several towers; Derrotero 1849, p. 66: a very high island with a tower on it, a passage between it and the cape for all ships keeping nearer the island; Admiralty 1916, p. 249: 285 feet high, a tower on its summit; a spit with 3 1/2 fathoms 2 cables north of it'
    says: 'Gallinara, the high little island with its watch-tower off Albenga; there is a passage inside it, keeping nearer the island than the low sandy point of the river.'

  - id: finale
    kind: town
    name: Finale
    modern: Finale Ligure (Finalmarina)
    lat_deg: 44.1715
    lon_deg: 8.3415
    height_m: 60
    source: 'Purdy 1826, p. 67: the smaller town of Finale 3 miles west of Cape Noli; anchor before it in from 8 to 5 fathoms, but no shelter from the sea-winds; behind the town on a little eminence two considerable forts near each other, by which and Cape Noli the place may be known from sea; Michelot 1715, p. 58: belonging to the King of Spain, two very considerable forts upon a little hill, and a large point with great white spots of sand seen from the westward; Derrotero 1849, p. 66: the town at the foot of a hill with a fortress on either side above it; anchor before it with land winds in 6 to 8 brazas; height JUDGEMENT (the forts'' eminence)'
    says: 'Finale, the town under its two forts on the eminence behind, known from the westward by the white spots on its point; an open road in six to eight fathoms.'

  - id: cape-vado
    kind: headland
    name: Cape Vado
    modern: Capo di Vado
    lat_deg: 44.2575
    lon_deg: 8.448
    height_m: 161
    source: 'Purdy 1826, p. 67: Cape Vado stretches some distance out to seaward and appears whitish at a distance; on its summit the fort of St. Stefano and the ruins of some old fortifications; Michelot 1715, p. 58: a large point appearing whitish, ruins of fortifications on its top; Derrotero 1849, p. 66: part of a high mountain, a watch-tower on its summit, covered with ruins and whitish in colour; Admiralty 1916, p. 251: large caves on its eastern extreme give it a whitish appearance; on its summit, 528 feet high, the ruins of an old fort'
    says: 'Cape Vado, the whitish cape with the old fort and ruins on its top, the mark of Vado road.'

  - id: vado-road
    kind: anchorage
    name: the road of Vado
    modern: Rada di Vado Ligure
    lat_deg: 44.2733
    lon_deg: 8.448
    height_m: 0
    depth_fathoms: 8
    bottom: mud and weeds
    fix: moved 135 m to water of 8 m (the first placing read -0.5 m)
    source: 'Purdy 1826, pp. 67 to 68: the road and town of Vado to the N.W. of the cape; in the bottom some houses along shore with a small chapel, before which anchor in 5 or 6 fathoms with fasts on shore, the ground mud and weeds; Fort St. Lorenzo half a mile S.E. of the town, sunken rocks off it; large ships anchor farther out; East and S.E. winds send a great swell but the ground is good; guard against the N.W.; Derrotero 1849, p. 67: anchor opposite a chapel in 5 to 6 brazas, weed and mud, larger ships farther out in 9 or 12 brazas, of such good holding that with good moorings all weathers may be ridden; Admiralty 1916, p. 252: anchorage 3 cables off between Forti Vado and San Lorenzo in about 11 fathoms, mud, good holding'
    says: 'Vado road, under the whitish cape, the great ships in eight or ten fathoms off the chapel, mud and weeds, good holding though the south-easters send in a swell.'

  - id: savona
    kind: town
    name: Savona
    modern: Savona (with the Fortezza del Priamar)
    lat_deg: 44.3075
    lon_deg: 8.481
    height_m: 30
    source: 'Purdy 1826, p. 68: Savona nearly four miles N.E. of Vado, defended by a considerable fortress to the south of it upon a rock near the sea; before the town a mole open to the N.E., now almost choked with sand and rocks, 7 or 9 feet within; lie without the mole with a hawser to it in 12 or 14 feet; Derrotero 1849, p. 67: the city defended by a citadel crowning a rock by the sea, its little port almost closed by a sand bar with about 8 feet at most; height JUDGEMENT'
    says: 'Savona, a large town with its fortress on the rock by the sea; the old mole harbour is nearly choked with sand and fit only for small craft.'

  - id: genoa-lanterna
    kind: light
    name: the Lanthorn of Genoa
    modern: 'Lanterna di Genova (Capo del Faro, San Benigno)'
    lat_deg: 44.4042
    lon_deg: 8.9047
    height_m: 117
    lit:
      from: 1709
      until: null
      range_nm: 20
      character: 'a fixed light, a great lantern atop the square white tower'
    source: 'Michelot 1715, p. 59 (OCR l. 4821): without the New Mole to the westward, upon a high fortified rock, a very high square white tower called the Light-house, upon which a large lanthorn is lighted in the night-time for a mark to all ships, and by day signals made for ships and galleys; Michelot 1709, OCR l. 7183: the same, ''le Fanal''; Purdy 1826, p. 68: upon the summit of a high point of rock a cable''s length west of the New Mole the lighthouse, a lofty square white tower with a lantern on its top, seen at a great distance; give the point a berth for rocks off it; Purdy 1840, Pharonology, p. v (OCR l. 697): an antient square white tower on the rocky point of San Benigno, total height above the sea 410 feet, fixed, five large lamps with reflectors (1840); Derrotero 1849, p. 67: the great light on a fortified rock, seen more than 24 miles; Admiralty 1916, p. 259: 385 feet above high water, the tower 249 feet high; the YEAR 1543 (the present tower rebuilt and relit after the siege of the Briglia; a light kept on the point since the twelfth century) is the builder''s knowledge, not the pilots'', JUDGEMENT: the pilots attest it lit in 1709 and through the period; range_nm JUDGEMENT for the oil lamps of 1805, less than the 24 miles of 1849; the light''s from is the earliest record read, Michelot 1709 (the tower of 1543, rebuilt and lit that year, is the builder''s memory and UNVERIFIED)'
    says: 'The great Lanthorn of Genoa, the lofty square white tower on its fortified rock west of the New Mole, lighted every night; give its point a berth for the rocks off it.'

  - id: genoa
    kind: town
    name: Genoa
    modern: Genova (the old city)
    lat_deg: 44.408
    lon_deg: 8.931
    height_m: 50
    source: 'Purdy 1826, p. 68: the city of Genoa, beautified with noble buildings, at the foot of some high mountains at the bottom of the gulf of the same name, seen at a great distance from sea; a wall not only about the town but around the mountain; the port before the town formed on the south by two moles; St. Pietro de Arena, a suburb of magnificent buildings along a sandy shore to the west; Michelot 1715, p. 59: the capital of a very ancient republick, a trading city very flourishing; easily known by the number of country seats about it, the whiteness of its great walls and the very high light-house; height JUDGEMENT'
    says: 'Genoa the Superb, the republic''s city of palaces rising from its port up the foot of the mountains, walled about together with the mountain behind.'

  - id: genoa-heights
    kind: hill
    name: the mountain of the walls of Genoa
    modern: 'Forte Sperone, the summit of the Mura Nuove (Monte Peralto)'
    lat_deg: 44.427
    lon_deg: 8.933
    height_m: 490
    source: 'Purdy 1826, p. 68: Genoa stands at the foot of some high mountains and may be seen at a great distance from sea; there is a wall not only about the town but around the mountain, which is cultivated and covered with fine gardens; Michelot 1715, p. 59: a pretty high wall not only about the town but round all the mountain; Derrotero 1849, p. 67: the city at the foot of a high mountain, walled, and another outer wall takes in the city and the mountain; the summit''s height and its fort (Sperone, on the apex of the walls of the 1630s) are the modern chart''s: JUDGEMENT'
    says: 'The high mountain behind Genoa girdled by the city''s outer wall, its fort on the summit where the walls meet, seen far out to sea.'

  - id: genoa-new-mole
    kind: mark
    name: the New Mole of Genoa
    modern: 'Molo Nuovo (its head of the period, now within the port''s later works)'
    lat_deg: 44.403
    lon_deg: 8.911
    height_m: 5
    fix: 'laid by the pilots'' figures (the mole runs E.S.E. from the foot of the light about 200 to 280 toises), not on the modern chart: the head of 1805 lies within the later port works and quays'
    source: 'Purdy 1826, p. 68: the port formed on the south by two moles 16 or 18 feet above the water; that on the west, stretching eastward, is the New Mole; the mole-heads about 300 fathoms asunder; you may range very near the head of the New Mole, 10 and 12 fathoms close to it; the general anchorage for large ships behind it; Michelot 1715, p. 59: the new mole stretches into the sea to the S.E. about 180 fathom, the galleys lying along it with their sterns to it; Derrotero 1849, p. 67: the west or great mole, also called the new, runs 200 toises E.S.E. from the foot of the light, fitted with granite bollards'
    says: 'The New Mole, running out from under the light-house; its head is steep-to with ten and twelve fathoms close to, and the great ships lie behind it.'

  - id: genoa-old-mole
    kind: mark
    name: the Old Mole of Genoa
    modern: Molo Vecchio
    lat_deg: 44.4093
    lon_deg: 8.9205
    height_m: 5
    fix: laid at the head of the modern Molo Vecchio; the mole of 1805 may have been somewhat shorter (Michelot's 150 fathom; Lamberti 1844 says it was lengthened)
    source: 'Purdy 1826, p. 68: the mole on the east, which stretches to the westward, is called the Old Mole; you may not approach so near its head as some loose rocks lie a little way from it; p. 69: the eastern side within the Old Mole used by merchant-vessels only, the depths insufficient for large ships; water to be had at the old mole; Michelot 1715, p. 59: the old mole before the town stretches toward the point of the New Mole about 150 fathom; at its end a battery of 9 or 10 guns and near its middle a little square fort; Lamberti 1844, p. 134: the old mole lengthened to narrow the mouth, a small light kindled on it every night'
    says: 'The Old Mole before the town, with its battery at the head and a little square fort; keep off its head, where loose rocks lie under water.'

  - id: genoa-port
    kind: anchorage
    name: the port of Genoa
    modern: 'Porto di Genova, the old harbour within the moles'
    lat_deg: 44.4082
    lon_deg: 8.9188
    height_m: 0
    depth_fathoms: 8
    bottom: mud and clay
    fix: laid in the water of the modern inner harbour between the old moles' lines; the berth behind the New Mole of 1805 is now largely quays; moved 67 m to water of 8 m (the first placing read -0.2 m)
    source: 'Purdy 1826, p. 68: the general anchorage for large ships is behind the New Mole, mud and clay bottom, good holding ground, an anchor ahead and two fasts astern to the New Mole; room for four or five sail to lie at their anchors; the North and N.E. winds blow very strongly from the mountains in winter; p. 69: with the winds at S.S.E. and S.E. the sea runs very high in the harbour; Michelot 1715, p. 59: great ships moor in the middle of the harbour in 8 and 10 fathom, anchors N.W. and S.E.; Derrotero 1849, pp. 67 to 68: ships of the line and frigates moor in the west part of the port inside the new mole in 9 or 10 brazas'
    says: 'Within the moles of Genoa, the men-of-war behind the New Mole in eight or ten fathoms on mud and clay, an anchor ahead and two fasts to the mole; a south-easter sends a high sea into the harbour.'

  - id: genoa-road
    kind: anchorage
    name: the road of Genoa
    modern: the roadstead south of the port of Genoa (outside the Diga foranea)
    lat_deg: 44.388
    lon_deg: 8.915
    height_m: 0
    depth_fathoms: 18
    bottom: clay
    fix: 'laid by Purdy''s bearing and distance: one to two miles without the mole, the lighthouse bearing N. by W. to N.N.W.; the modern breakwater stands between it and the old port'
    source: 'Purdy 1826, p. 69: there is anchorage in the roads from between one to two miles without the mole, in from 10 to 24 fathoms, clay bottom, with the lighthouse bearing from N. by W. to N.N.W.; p. 68: there is no difficulty in sailing in between the mole-heads, room enough for the largest ships; Derrotero 1849, p. 68: S.W., S. and S.E. winds raise much sea in the port; the only precaution entering is to give a berth to the point of the light and not to close the mole-heads'
    says: 'Genoa road, a mile or two without the moles with the light-house bearing north by west, ten to twenty-four fathoms on clay; open to all the winds from the sea.'


  # ---------------------------------------------------------------------------
  # Portofino, the gulf of Spezia, Leghorn and the Meloria (the harbour patch leghorn), the Tuscan islands and Elba with Porto Ferrajo (the harbour patch porto-ferrajo)
  # ---------------------------------------------------------------------------

  - id: monte-portofino
    kind: hill
    name: Mount Porto-Fino
    modern: Monte di Portofino
    lat_deg: 44.321
    lon_deg: 9.17
    height_m: 610
    source: 'Purdy 1826, p. 72: the point of Mount Porto-Fino is large, and appears round and steep on all sides, the land very high and steep; Admiralty 1916, p. 267: Monte Portofino, the summit of the promontory, is 2,001 feet high'
    says: 'Mount Porto-Fino, the great round headland east of Genoa, high and steep on all sides, the first mark of the Riviera of the Levant.'

  - id: cape-portofino
    kind: headland
    name: the point of Porto-Fino
    modern: Punta del Capo (Punta di Portofino)
    lat_deg: 44.3001
    lon_deg: 9.215
    height_m: 100
    fix: moved 409 m to the grid's land (the first placing read 62 m of water)
    source: 'Purdy 1826, p. 72: from the point of Mount Porto-Fino to that which forms the harbour of Porto-Fino the distance to the E.S.E. is 3 miles, the land between very high and steep; the last point forms the western point of the Gulf of Rapalo; height JUDGEMENT from the steep land behind the point'
    says: 'The point of Porto-Fino, the steep south-east end of the mount, the western point of the Gulf of Rapalo.'

  - id: portofino-harbour
    kind: anchorage
    name: Porto-Fino
    modern: Portofino harbour
    lat_deg: 44.3034
    lon_deg: 9.2135
    height_m: 0
    depth_fathoms: 4
    bottom: mud and weeds
    fix: moved 240 m to water of 30 m (the first placing read -38.5 m)
    source: 'Purdy 1826, p. 72: the fortified town and little harbour of Porto-Fino, capable of seven or eight galleys, 140 fathoms long and 70 wide, cannot be seen until nearly opposite; 9 fathoms at the entrance, within only 3 or 4 fathoms, the ground mud and weeds; a small fort on the south point; open to winds from the E.N.E.'
    says: 'Porto-Fino, a little harbour for galleys under the mount, in 3 or 4 fathoms on mud and weeds, open to the E.N.E.'

  - id: sestri-levante
    kind: town
    name: Sestri di Levante
    modern: Sestri Levante
    lat_deg: 44.271
    lon_deg: 9.395
    height_m: 15
    source: 'Purdy 1826, p. 72: the town of Sestri di Levante stands near the S.E. point of the Gulf of Rapalo, 3 leagues E. by E. from Porto-Fino; the gulf very deep, the anchorage close to the land but in no part safe, being exposed to southerly winds'
    says: 'Sestri di Levante on its point at the south-east end of the Gulf of Rapalo, no safe anchorage with the wind southerly.'

  - id: punta-mesco
    kind: headland
    name: Point del Mesco
    modern: Punta Mesco
    lat_deg: 44.1335
    lon_deg: 9.634
    height_m: 311
    source: 'Purdy 1826, p. 72: at 10 1/2 miles from Sestri Point is the Point del Mesco, large, very high, steep on all sides, with a chapel on it; thence to Porto Venere 7 miles, the coast very high and steep with several villages near the sea; Admiralty 1916, p. 272: on the point the ruins of San Antonio convent, 1,020 feet above high water'
    says: 'Point del Mesco, large, very high and steep, with a chapel on it, the western end of the high coast of the Cinque Terre.'

  - id: riomaggiore
    kind: town
    name: Rio Maggiore
    modern: Riomaggiore (Cinque Terre)
    lat_deg: 44.0995
    lon_deg: 9.7378
    height_m: 30
    source: 'Purdy 1826, p. 72: from the Point del Mesco to Porto Venere the coast is very high and steep, and has several villages near the sea; Admiralty 1916, p. 274: Rio Maggiore village at the mouth of a narrow valley just northward of Capo di Negro, which rises to a mountain 1,115 feet high with a white sanctuary'
    says: The villages of the Cinque Terre in their clefts of the high steep coast between the Mesco and Porto Venere; Rio Maggiore the easternmost.

  - id: porto-venere
    kind: town
    name: Porto Venere
    modern: Porto Venere
    lat_deg: 44.0505
    lon_deg: 9.8355
    height_m: 20
    source: 'Purdy 1826, p. 72: Porto Venere lies a little to the west of the entrance of the Gulf of La Spezia, a small town by the sea-side at the foot of a mountain covered with olive-trees; the island Palmaria directly opposite forms the harbour; Derrotero 1849, p. 71: water at a well outside the town and in the cloister of the convent of San Francisco'
    says: 'Porto Venere, a small walled town at the foot of its olive mountain, Palmaria across the narrow strait making its harbour.'

  - id: porto-venere-anchorage
    kind: anchorage
    name: the harbour of Porto Venere
    modern: 'Seno di Porto Venere, between Palmaria and the main'
    lat_deg: 44.0545
    lon_deg: 9.8445
    height_m: 0
    depth_fathoms: 7
