    source: 'James 1837, vol. 3, pp. 177-178: on 31 October 1803 the whole squadron anchored without an accident in Agincourt sound, under the Sardinian shore, a noble harbour formed by an indented bay, defended to the northward by St Estevan, Spargiotou, Magdalena and Cibrera; Captain Ryves of the Agincourt surveyed the islands in 1802 and Lord Nelson named the anchorage; Purdy 1826, p. 89: hauling round Point Liche in 15 or 16 fathoms, land-locked; the anchoring-ground is extremely good; the N.W. wind blows with great violence; the water rises and falls about 3 feet; Smyth 1828, p. 248: the berth to be preferred is at the Mezzo Schifo, S.W. of the town, near the Pararau, good for watering, wood cut close by; Derrotero 1849, p. 150: la rada de Agincurt, able to hold a squadron, anchor in 10 and 12 fathoms S.S.E. of punta Cerdeña and W.S.W. of fort San Jorge on San Stefano, sheltered from all seas and winds; Admiralty 1913, pp. 640-641: Rada di Mezzo Schifo (Agincourt road), 11 fathoms over weed, holding good, bad in the northern part'
    says: 'Agincourt Sound, Lord Nelson''s anchorage under the Sardinian shore, land-locked in twelve fathoms, weed and good holding ground; the north-wester comes down off the hills very hard.'

