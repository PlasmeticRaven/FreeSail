# The features of the Western Islands, the Azores (spec M6 §26, block 5 as decision 44
# widened it; package 39e): the nine islands, their roads and their marks as 1805 had
# them, in the period's words, each with its source in the references' form
# (docs/references/README.md), on the rules of channel-west.yaml's head, read from:
#
#   Tofiño 1789     Vicente Tofiño de San Miguel, Derrotero de las costas de España en el
#                   Océano Atlántico, y de las Islas Azores ó Terceras (Madrid, 1789;
#                   Internet Archive derroterodelasco00tofi_0), the OCR text, 'Derrotero
#                   de las Islas Azores ó Terceras', pp. 190 to 235: San Miguel pp. 190 to
#                   197, Santa María pp. 197 to 201, the Hormigas (the Formigas) pp. 201 to
#                   202, Tercera and the road of Angra pp. 203 to 209, San Jorge pp. 209 to
#                   212, Graciosa pp. 212 to 215, Pico pp. 215 to 219, Fayal and its road
#                   pp. 219 to 227 (the Peak's height and its horizon pp. 225 to 226),
#                   Flores pp. 227 to 232, Cuervo p. 233. In period exactly: the Spanish
#                   survey of the islands made in 1788 from Angra and Fayal. In Spanish:
#                   the names here are the English pilots' where they had one (Fayal, St
#                   Michael's, St Mary's, St George's, the Formigas or Ants), the
#                   Portuguese otherwise; his depths are in brazas of two varas, 1.672 m,
#                   given here in English fathoms (0.914 to the braza) with his figure in
#                   the source; his Spanish feet (pies, a third of the vara, 0.279 m) the
#                   same.
#   Norie 1805      J. W. Norie, A New and Complete Epitome of Practical Navigation, 1805,
#                   the table of latitudes and longitudes (the Azores, the longitudes lost
#                   to the OCR's columns) and Table XLI (p. 250; the page image read for
#                   Funchal, the Azores' rows not legible in the OCR).
#   encyclopaedia   the Portuguese encyclopaedia's pages for the lights, read 2026-10-10
#                   (pt.wikipedia.org): the Ponta do Arnel's, lit 26 November 1876, "the
#                   first light set up in the Azores"; the Ferraria's 1901; Gonçalo Velho's
#                   on Santa Maria 15 November 1927; the Contendas' 1 February 1934; the
#                   Ponta do Topo's 1927; the Ponta da Ilha's 1946; the Ribeirinha's on
#                   Fayal 1 November 1919; Santa Clara's at Ponta Delgada 15 June 1945. No
#                   light stood in the islands in 1805.
#
# No period plan of a road was transcribed (Tofiño's plans of Angra and of the port of
# Fayal are named in his text, "véase su plano", and were not found from this machine),
# so no override is patched and the port files say `datum: unverified`.
#
# Positions are in the modern frame (WGS 84, the EMODnet DTM 2024 grid the tiles are cut
# from): first placed from the modern chart (from memory) and Tofiño's bearings and
# distances, then checked against the region's tiles by channel-west.yaml's rule (a
# headland, island, town, castle or hill to the nearest land within 800 m; a light to the
# nearest land within 400 m; a rock to the nearest shoal head within 400 m; an anchorage
# to water holding half the pilot's depth within 800 m), each move in `fix`. Heights are
# above the sea for the horizon, the modern chart's from memory (UNVERIFIED) unless the
# entry says otherwise. The islands' peaks stand far above the search's reach
# (`chart.SEARCH_HEIGHT_M`, 300 m) and are seen to their own horizon in clear weather;
# the Peak of Pico is the voyage's landfall.
#
# The lead reviews this list against the sources before the merge: the citation is on
# every line for that.

region: azores
features:

  # ---------------------------------------------------------------------------
  # St Michael's (São Miguel)
  # ---------------------------------------------------------------------------

  - id: ponta-delgada-town
    kind: town
    name: Ponta Delgada
    modern: Ponta Delgada
    lat_deg: 37.7410
    lon_deg: -25.6680
    height_m: 20
    source: "Tofiño 1789, 'Isla de San Miguel', pp. 190 to 191: the mole of the town of Punta Delgada, the principal of the whole island, with much trade in its fruits with the other islands and with Lisbon, a mile and a half N E of the point of the same name"
    says: "Ponta Delgada, the chief town of St Michael's, along the shore of its open bay."

  - id: ponta-delgada-point
    kind: headland
    name: the point of Ponta Delgada
    modern: Ponta de Santa Clara
    lat_deg: 37.7332
    lon_deg: -25.6900
    height_m: 10
    source: "Tofiño 1789, 'Isla de San Miguel', pp. 190 to 191: the Punta Delgada, in latitude 37 43 5x N, low, of stone, with a castle that defends its anchorage"
    says: "The point of Ponta Delgada, low and of stone, with a castle on it, a mile and a half south-west of the town."
    fix: "moved 90 m to the grid's land"

  - id: ponta-delgada-road
    kind: anchorage
    name: Ponta Delgada Road
    modern: the anchorage off Ponta Delgada
    lat_deg: 37.7290
    lon_deg: -25.6650
    height_m: 0
    depth_fathoms: 32
    bottom: "sand"
    source: "Tofiño 1789, 'Isla de San Miguel', p. 191: the road, open to the winds and seas of the second, third and part of the fourth quadrant, offers two anchorages, the principal south of the town in 30 or 40 brazas, sand, the islet of Rosto de Cão on with the church of S Roque, and the tower of the great church by a large country house north of it"
    says: "Ponta Delgada Road, open from east round by south to west: anchor south of the town in thirty or forty brazas on sand, the Rosto de Cão on with the church of São Roque."
    fix: "moved 450 m south to the grid's 51 m, the pilot's thirty brazas"

  - id: rosto-de-cao
    kind: island
    name: the islet of Rosto de Cão
    modern: Ilhéu de São Roque (Rosto de Cão)
    lat_deg: 37.7540
    lon_deg: -25.6300
    height_m: 20
    source: "Tofiño 1789, 'Isla de San Miguel', p. 191: the islet of Rastro de Cans bears N 70 E three miles from the Punta Delgada; easy to know, being the only high and steep land seen at the bottom of the bay, at the western end of a beach"
    says: "The islet of Rosto de Cão, the only high steep land at the bottom of the bay, the leading mark for Ponta Delgada Road with the church of São Roque."

  - id: galera-point
    kind: headland
    name: the Ponta da Galera
    modern: Ponta da Galera
    lat_deg: 37.7080
    lon_deg: -25.5130
    height_m: 10
    source: "Tofiño 1789, 'Isla de San Miguel', p. 191: S 75 E seven miles and a half from the Punta Delgada is that of the Galera, low, of stone, with islets at its foot and a battery; between the two points the coast forms a great bay"
    says: "The Ponta da Galera, low and of stone with islets at its foot and a battery, the east end of the great bay of Ponta Delgada."
    fix: "the first placing lay in the bay with no land within 800 m; placed on the grid's southernmost land east of the bay, by Caloura, which Tofiño's S 75 E 7 1/2 miles from the point of Ponta Delgada fits within a mile and five degrees (his bearings true: this pair proves it, a magnetic bearing would put it twenty degrees off)"

  - id: vila-franca-islet
    kind: island
    name: the islet of Villa Franca
    modern: Ilhéu de Vila Franca do Campo
    lat_deg: 37.7060
    lon_deg: -25.4420
    height_m: 62
    source: "Tofiño 1789, 'Isla de San Miguel', p. 192: S 83 E two and a quarter miles from the Punta de la Galera is the middle of the islet of Villafranca, high and steep on the S and S W, low on the S E, with a little harbour mouth north for four or five small craft, two feet at its entrance at low water"
    says: "The islet of Villa Franca, high and steep on its south side, with a little harbour inside it that dries."
    fix: "the grid does not resolve the islet (9 m of water at its place, the shore's land 600 m north): its place the modern chart's, from memory, unverified"

  - id: vila-franca-road
    kind: anchorage
    name: the anchorage of Villa Franca
    modern: the channel between the Ilhéu de Vila Franca and the shore
    lat_deg: 37.7097
    lon_deg: -25.4386
    height_m: 0
    depth_fathoms: 10
    bottom: "sand"
    source: "Tofiño 1789, 'Isla de San Miguel', p. 192: the channel the islet forms with the coast, about three cables wide, is the principal anchorage of Villafranca, with 10 and 11 brazas, sand; ships moor N and S with a cable ashore to the islet, which is too small to shelter them from E S E round by S to S S W"
    says: "Villa Franca's anchorage between the islet and the shore, ten or eleven brazas on sand, moored north and south with a line to the islet; open from east-south-east to south-south-west."
    fix: "moved 190 m to the grid's 9 m, half the pilot's ten brazas, between the islet's place and the shore"

  - id: pico-da-vara
    kind: hill
    name: the high land of the east end of St Michael's
    modern: Pico da Vara
    lat_deg: 37.8090
    lon_deg: -25.2150
    height_m: 1103
    source: "Tofiño 1789, 'Isla de San Miguel', p. 193: this part of the island is the highest, for from close to its shores rise very high mountains, which fall away westward as the island narrows in its middle; the height the modern chart's (from memory, unverified)"
    says: "The high mountains of the east end of St Michael's, the island's highest land."

  - id: arnel-point
    kind: headland
    name: the Ponta do Arnel
    modern: Ponta do Arnel
    lat_deg: 37.8240
    lon_deg: -25.1370
    height_m: 60
    source: "Tofiño 1789, 'Isla de San Miguel', pp. 193 to 194: N three quarters of a mile from the Punta de la Marquesa is that called del Arnel, lower than the former, with a little harbour of the same name, very bad, unsheltered and its bottom stone; the Marquesa the most easterly of the island, latitude 37 48 10 N"
    says: "The Ponta do Arnel, the east end of St Michael's, with a poor little boat harbour under it."

  - id: arnel-light
    kind: light
    name: the light of the Ponta do Arnel
    modern: Farol da Ponta do Arnel
    lat_deg: 37.8250
    lon_deg: -25.1360
    height_m: 66
    lit: {from: 1876, until: null, range_nm: 19, character: "an occulting light (not yet built in 1805)"}
    source: "The encyclopaedia's 'Farol da Ponta do Arnel' (pt.wikipedia, read 2026-10-10): in service 26 November 1876, the first light of the Azores; focal height 66 m"
    says: "The light of the Ponta do Arnel, which was not yet built in 1805."

  - id: ferraria-point
    kind: headland
    name: the Ponta da Ferraria
    modern: Ponta da Ferraria
    lat_deg: 37.8580
    lon_deg: -25.8516
    height_m: 50
    source: "Tofiño 1789, 'Isla de San Miguel', p. 190: the Punta de la Ferrería, the most westerly of the island, in latitude 37 54 15 N; high and steep, a low point running out from its foot, from which a reef runs S W a league with 7 to 10 brazas, stone, on which the sea breaks much in a heavy swell"
    says: "The Ponta da Ferraria, the west end of St Michael's, high and steep; a reef runs a league south-west from its foot, and in a heavy sea it breaks."
    fix: "moved 120 m to the grid's land"

  - id: ferraria-light
    kind: light
    name: the light of the Ferraria
    modern: Farol da Ponta da Ferraria
    lat_deg: 37.8600
    lon_deg: -25.8510
    height_m: 107
    lit: {from: 1901, until: null, range_nm: 27, character: "three flashes (not yet built in 1805)"}
    source: "The encyclopaedia's 'Farol da Ferraria' (pt.wikipedia, read 2026-10-10): built 1901; focal height 107 m"
    says: "The light of the Ferraria, which was not yet built in 1805."

  - id: mosteiros-islets
    kind: island
    name: the Mosteiros
    modern: Ilhéus dos Mosteiros
    lat_deg: 37.8930
    lon_deg: -25.8330
    height_m: 50
    source: "Tofiño 1789, 'Isla de San Miguel', p. 196: between the Punta de Matogos and the Ferrería are the islets Mosteiros, the greatest high, steep and flat on its top, with a hole through which the sea passes, and four smaller on its land side"
    says: "The Mosteiros, high steep islets off the west end of St Michael's, the greatest with a hole through it."
    fix: "the grid does not resolve the islets (30 m of water at their place): their place the modern chart's, from memory, unverified"

  - id: ribeira-grande
    kind: town
    name: Ribeira Grande
    modern: Ribeira Grande
    lat_deg: 37.8210
    lon_deg: -25.5200
    height_m: 15
    source: "Tofiño 1789, 'Isla de San Miguel', p. 195: the town of Riveira grande, large and rich, with a great beach, the only one on the north coast, but so unsheltered that only in a very smooth sea can one land on it"
    says: "Ribeira Grande on the north coast of St Michael's, a rich town on an open beach where a boat lands only in a smooth sea."

  # ---------------------------------------------------------------------------
  # St Mary's (Santa Maria) and the Formigas
  # ---------------------------------------------------------------------------

  - id: santa-maria-town
    kind: town
    name: the town of St Mary's
    modern: Vila do Porto
    lat_deg: 36.9440
    lon_deg: -25.1450
    height_m: 30
    source: "Tofiño 1789, 'Isla de Santa María', pp. 199 to 201: the port of Santa María, where is the town of that name, capital of the island, very unsheltered and exposed to the southerlies; small craft only anchor in it, and in summer"
    says: "The town of St Mary's over its little open port, exposed to the southerly winds."

  - id: santa-maria-high-land
    kind: hill
    name: the Pico Alto of St Mary's
    modern: Pico Alto, Santa Maria
    lat_deg: 36.9850
    lon_deg: -25.0880
    height_m: 587
    source: "Tofiño 1789, 'Isla de Santa María', p. 197: the eastern part of this island is high and broken, the western low and even; in the first some mountains and peaks, the highest called Pico alto; its coasts clean and steep-to; the height the modern chart's (from memory, unverified)"
    says: "The Pico Alto of St Mary's, over the high broken east of the island; the west end is low and even."

  - id: castelo-point
    kind: headland
    name: the Ponta do Castelo
    modern: Ponta do Castelo, Santa Maria
    lat_deg: 36.9290
    lon_deg: -25.0170
    height_m: 80
    source: "Tofiño 1789, 'Isla de Santa María', p. 197: the Punta do Castelo is the south-easternmost of the island, in latitude 36 56 47 N; high, with a cleft that forms a peak like a sentry box; one may anchor N N E of it near the point in 10 brazas, sand"
    says: "The Ponta do Castelo, the south-east point of St Mary's, high, with a peak on it like a sentry box."

  - id: goncalo-velho-light
    kind: light
    name: the light of the Ponta do Castelo
    modern: Farol de Gonçalo Velho
    lat_deg: 36.9300
    lon_deg: -25.0170
    height_m: 115
    lit: {from: 1927, until: null, range_nm: 25, character: "flashing (not yet built in 1805)"}
    source: "The encyclopaedia's 'Farol de Gonçalo Velho' (pt.wikipedia, read 2026-10-10): in service 15 November 1927; focal height 115 m"
    says: "The light of the Ponta do Castelo, which was not yet built in 1805."

  - id: sao-lourenco-road
    kind: anchorage
    name: the port of St Lawrence
    modern: Baía de São Lourenço, Santa Maria
    lat_deg: 36.9941
    lon_deg: -25.0499
    height_m: 0
    depth_fathoms: 14
    bottom: "sand, very clean"
    source: "Tofiño 1789, 'Isla de Santa María', pp. 198 and 201: the port of San Lorenzo, formed by the islet of its name and the Punta dos Matos, a long mile apart; the bottom sand and very clean, 10 brazas between the points increasing outward, but not to anchor in more than 20, beyond which it is bad; the best anchorage of the island; water got by digging in the sand of the beach"
    says: "The port of St Lawrence on the east side of St Mary's, the island's best anchorage: ten to twenty brazas on clean sand, and water dug from the beach."
    fix: "the first placing was on the grid's land; moved 470 m to the grid's 13 m in the bay, the pilot's ten brazas between the points"

  - id: formigas
    kind: rock
    name: the Formigas, or Ants
    modern: Ilhéus das Formigas
    lat_deg: 37.2710
    lon_deg: -24.7800
    height_m: 9
    extent_m: 600
    source: "Tofiño 1789, 'Islotes llamados las Hormigas', pp. 201 to 202: stones the navigators thought a grave risk between St Mary's and St Michael's, but surveyed they are all visible, together and clean, and ships of all sizes may pass north or south of them; the whole runs N 50 E and S 50 W six cables; the Hormigón, a round thick rock 10 or 12 varas high, the highest of them, the first seen; at a distance they look like a city; latitude 37 17 10 N; Norie 1805, the table: 'Formigas, or Ants'"
    says: "The Formigas, or Ants, a cluster of black rocks six cables long, the highest ten or twelve varas, like a city at a distance; all of them visible and clean, and a ship may pass either side."
    fix: "the modern chart's place, from memory; the grid has neither the rocks nor any water under 34 m within eight kilometres of them, so the Formigas stand in the world by this feature alone (a rock of 9 m and 600 m of solid ground about it, `Chart.danger_under`)"

  - id: dollabarat
    kind: shoal
    name: the shoal south-east of the Formigas
    modern: Recife Dollabarat
    lat_deg: 37.2320
    lon_deg: -24.7230
    height_m: 0
    source: "Tofiño 1789, 'Islotes llamados las Hormigas', p. 202: the pilots of St Mary's agree that the Hormigas have a shoal that runs far out on their S E part; sounded with two of them aboard looking for its least water, not less than 11 brazas was found on it; in a heavy sea it must break; the modern chart's Dollabarat reef about three miles south-east of the Formigas (from memory, unverified), which the grid has at its least depth"
    says: "A shoal south-east of the Formigas that breaks in a heavy sea; the Spanish survey found no less than eleven brazas on it, but give it a berth."
    fix: "the modern chart's place, from memory; the grid has 100 m there and no water under 34 m within eight kilometres: no shoal in the world, as Tofiño found none under eleven brazas"

  # ---------------------------------------------------------------------------
  # Terceira and the road of Angra
  # ---------------------------------------------------------------------------

  - id: monte-brasil
    kind: hill
    name: Monte Brasil
    modern: Monte Brasil
    lat_deg: 38.6447
    lon_deg: -27.2337
    height_m: 205
    source: "Tofiño 1789, 'Isla Tercera', p. 203: in the middle and most southerly part of this island rises Monte del Brasil, high enough and sheer to the sea, with two pillars on its top that serve as look-outs, falling gently to the north, on whose skirt is the citadel of San Juan; the pillars in latitude 38 38 1x N"
    says: "Monte Brasil, high and sheer to the sea with its two look-out pillars on top, the citadel on its northern skirt and Angra beyond."
    fix: "moved 42 m to the grid's land"

  - id: angra-town
    kind: town
    name: Angra
    modern: Angra do Heroísmo
    lat_deg: 38.6560
    lon_deg: -27.2190
    height_m: 25
    source: "Tofiño 1789, 'Isla Tercera', p. 203: the city of Angra, the residence of the Captain General, the Bishop and the government of all the islands, spreads over the plain from the citadel; its mole of hazardous access in any swell"
    says: "Angra, the city of the Captain General and the Bishop, at the head of its bay under Monte Brasil."

  - id: angra-citadel
    kind: castle
    name: the citadel of St John
    modern: Fortaleza de São João Baptista
    lat_deg: 38.6510
    lon_deg: -27.2270
    height_m: 40
    source: "Tofiño 1789, 'Isla Tercera', pp. 203 to 204: on the northern skirt of Monte Brasil the citadel or castle of San Juan, the principal defence of the whole island and of the city; from it walls and batteries run round the eastern skirt of the mount to the castle of San Antonio"
    says: "The citadel of St John on the skirt of Monte Brasil, the defence of the island and of Angra."

  - id: angra-san-sebastian
    kind: castle
    name: the castle of St Sebastian
    modern: Forte de São Sebastião, Angra
    lat_deg: 38.6545
    lon_deg: -27.2100
    height_m: 20
    source: "Tofiño 1789, 'Isla Tercera', pp. 203 to 204: N 41 30 E six tenths of a mile from the top of Monte Brasil is the castle of San Sebastian; between it and that of San Antonio is the anchorage; at its foot the little beach called the Puerto de las Pipas, where the fishing boats are hauled up and one may land when the swell forbids the mole"
    says: "The castle of St Sebastian on the east side of Angra's bay, with the little beach of the Pipas at its foot where a boat lands when the mole cannot be used."

  - id: angra-road
    kind: anchorage
    name: Angra Road
    modern: the anchorage east of Monte Brasil
    lat_deg: 38.6440
    lon_deg: -27.2160
    height_m: 0
    depth_fathoms: 32
    bottom: "sand"
    source: "Tofiño 1789, 'Isla Tercera', p. 204: ships of some size and all ships of war anchor east of Monte del Brasil in 30 or 40 brazas, sand, and must be ready to make sail the moment a wind from the second or third quadrant is announced; merchant ships moor in four within the line of the castles of San Antonio and San Sebastian, open to the second and part of the third quadrant, and in winter are often lost on the coast"
    says: "Angra Road: a ship of war anchors east of Monte Brasil in thirty or forty brazas on sand, ready to put to sea at the first of a southerly or south-easterly; the merchants moor within, between the castles, and lose ships there in winter."

  - id: ilheus-das-cabras
    kind: island
    name: the Cabras
    modern: Ilhéus das Cabras
    lat_deg: 38.6287
    lon_deg: -27.1481
    height_m: 146
    source: "Tofiño 1789, 'Isla Tercera', p. 205: the islands Cabras bear S 80 30 E four miles from the top of Monte Brasil, two thirds of a mile from the nearest coast; two, the eastern the greater and higher, sheer on its south side, like a wedge seen east to west; between them and the coast any ship may pass in 9, 12 and 13 brazas, sand"
    says: "The Cabras, two islets four miles east of Monte Brasil, the eastern high and sheer to the south like a wedge; a ship may pass inside them in nine to thirteen brazas."
    fix: "the grid does not resolve the islets as land: placed on its shoal head awash (0.1 m under the datum) 600 m east of the first placing, two thirds of a mile off the coast as Tofiño has them; a ship grounds on that head"

  - id: contendas-point
    kind: headland
    name: the Pico das Contendas
    modern: Ponta das Contendas
    lat_deg: 38.6410
    lon_deg: -27.0820
    height_m: 80
    source: "Tofiño 1789, 'Isla Tercera', p. 205: the coast runs east to the Pico de las Contiendas, notable for standing out into the sea and forming three peaks on its summit"
    says: "The Pico das Contendas, standing out to sea with three peaks on its top, the south-east corner of Terceira."

  - id: contendas-light
    kind: light
    name: the light of the Contendas
    modern: Farol das Contendas
    lat_deg: 38.6430
    lon_deg: -27.0830
    height_m: 53
    lit: {from: 1934, until: null, range_nm: 23, character: "four flashes, white and red (not yet built in 1805)"}
    source: "The encyclopaedia's 'Farol das Contendas' (pt.wikipedia, read 2026-10-10): lit 1 February 1934 (its tower built 1882); focal height 53 m"
    says: "The light of the Contendas, which was not yet built in 1805."

  - id: praia-terceira
    kind: town
    name: Praya
    modern: Praia da Vitória
    lat_deg: 38.7320
    lon_deg: -27.0660
    height_m: 15
    source: "Tofiño 1789, 'Isla Tercera', p. 206: between the Malmerenda and the Baxíos a great bay with a beach and a town at its head called Praya, with batteries to defend this only accessible place of the island"
    says: "Praya at the head of its great sandy bay on the east side of Terceira."

  - id: praia-road
    kind: anchorage
    name: Praya Road
    modern: the bay of Praia da Vitória
    lat_deg: 38.7280
    lon_deg: -27.0420
    height_m: 0
    depth_fathoms: 23
    bottom: "sand"
    source: "Tofiño 1789, 'Isla Tercera', pp. 206 to 207: the bay is clean with much depth and good holding, room for a squadron, sheltered from the third and fourth quadrants but wholly open to the first and second; the most convenient anchorage with the Malmerenda on the islet of Caneiros and the tower of Santa Cruz bearing W, in 25 brazas, sand"
    says: "Praya Road, room for a squadron on good sandy ground in twenty-five brazas, sheltered from the west but open to every easterly wind."

  - id: santa-barbara
    kind: hill
    name: the Serra de Santa Bárbara
    modern: Serra de Santa Bárbara
    lat_deg: 38.7300
    lon_deg: -27.3220
    height_m: 1021
    source: "Tofiño 1789, 'Isla Tercera', pp. 207 to 208: near the Punta Gorda rises a notable mount called the Pico de Santa Bárbara with a look-out on its top; the island has a ridge running nearly east and west whose western end is the highest, called Santa Bárbara or the Serreta; the height the modern chart's (from memory, unverified)"
    says: "The Serra de Santa Bárbara, the high western end of Terceira, with a look-out on its top."

  # ---------------------------------------------------------------------------
  # St George's (São Jorge) and Graciosa
  # ---------------------------------------------------------------------------

  - id: velas-town
    kind: town
    name: Velas
    modern: Velas, São Jorge
    lat_deg: 38.6800
    lon_deg: -28.2060
    height_m: 15
