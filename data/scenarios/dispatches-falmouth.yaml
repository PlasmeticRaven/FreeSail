# FreeSail: the dispatches (the owner's scenario of 2026-10-18 for the director's test,
# docs/dev/M7b-WorkPackages.md, "The testing round after 59"). A merchant cutter of
# Falmouth bound for Plymouth with the business about her and a director above the game
# on the dispatches brief (data/director/briefs/dispatches.yaml): the packet, the frigate
# to windward, the search or the chase, the landing at Plymouth are the director's to
# bring about by world orders, within the brief's limits and the channel's doubt. A model
# at the captain's station (--station captain), the player at the officer's (--seat
# officer), the director through its door (--station director). Nothing is pinned on this
# file.
#     py -m freesail.ui.server --scenario data/scenarios/dispatches-falmouth.yaml --seat officer

name: The dispatches, Falmouth to Plymouth
seed: 7
start: 1805-06-12T05:00
position: {lat_deg: 50.1631, lon_deg: -5.0345}   # Carrick Road, the usual anchorage (Imray 1874 p. 90)
region: channel-west
nation: britain
ship:
  file: data/ships/cutter.yaml
  heading_deg: 190
  glass: true
  instrument: octant
wind:
  gustiness: 0.3
  variability: 0.3

# The captain's intent (spec M6 §4): the rules captain sails by it when nobody holds the
# station; a model captain reads it as his night orders.
intent: trade tin from Falmouth to Plymouth

people:
  - {role: master, skill: 0.9}

# The packet as a thing (spec M7b §17a; package 53b): in the captain's keeping from the
# start, where it goes with him, is given by a free line ('give the packet to Mr Veale') to
# a person within his reach, and is found where it lies by anyone who looks.
things:
  - a sealed packet, in the captain's keeping, from the Custom House

papers:
  chart: {year: 1804}
  epitome: moore
  almanac: 1805
  price_lists: [falmouth]

cargo:
  purse_pounds: 400

# Fowey has no port file yet (data/ports/): the scenario named it and could not load
# (packages 59 and 62, found on the way by both); the two ports of the passage stand.
ports: [falmouth, plymouth]
business: on

# A south-westerly day: fair for Plymouth along the coast, and a frigate to the southward
# holds the weather gage.
weather:
  wind:
    - {at: 1805-06-12T05:00, from_deg: 225, knots: 15, air_mass: neutral}
    - {at: 1805-06-12T14:00, from_deg: 240, knots: 17}
    - {at: 1805-06-13T00:00, from_deg: 260, knots: 12}
  background:
    {hpa: 1016, gradient_hpa_per_100km: 0.5, high_toward_deg: 200}

director:
  brief: dispatches
