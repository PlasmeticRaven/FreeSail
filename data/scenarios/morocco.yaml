# FreeSail: Morocco's Atlantic coast block's passage (package 106b). A free passage, not a
# gate's: a British merchant brig out of Gibraltar for Mogador, the one port of the coast in
# regular trade with Europe (Jackson 1809, l. 4919 to 4920), with woollens and iron for the
# merchants there. She has come through the Strait and rounded Cape Spartel in the night, and is
# four leagues off El Araiche at daybreak, standing down the coast. The block's water on the
# whole chart (`chart: atlantic-east`), its marks (data/charts/features/morocco-*.yaml) and its
# ports. Given to either driver with --scenario:
#     py -m freesail.ui.console --scenario data/scenarios/morocco.yaml
# and printed whole by
#     py tools/day_log.py data/scenarios/morocco.yaml --hours 24 --reckoning
#
# The passage as the book beside this file sails it (morocco.orders): she keeps the offing a
# merchantman keeps on a lee shore with the current setting her southward along it (Purdy 1825,
# p. 152: one to two miles an hour at springs), out to the offing west of Sallee and then to the
# mark ten miles west of Cape Cantin, "to avoid the rocks about that cape" (Purdy p. 155), and
# down to the offing fifteen miles west of Mogador, where she heaves to for the day. The weather is
# pinned: the summer's wind along the coast from N. by E. to N.E. (Purdy 1825, p. 152), fifteen
# knots, judgement, so that the passage is the same on every machine. Sailed for the package's
# notes (docs/dev/TuningNotes.md, package 106b); not a gate's.

name: Morocco, the brig from Gibraltar for Mogador
seed: 7
start: 1805-06-15T05:00
position: {lat_deg: 35.2500, lon_deg: -6.4000}   # four leagues west-north-west of El Araiche
chart: atlantic-east
nation: britain
ship:
  file: data/ships/merchant-brig.yaml
  heading_deg: 220
  speed_kn: 5
  glass: true
  instrument: octant

people:
  - {role: master, skill: 0.8}

papers:
  chart: {year: 1804}
  epitome: norie                  # which has the coast's two places (data/tides/establishments.yaml)
  almanac: 1805

cargo:
  purse_pounds: 150

ports: [tangier, larache, rabat, mazagan, safi, mogador, agadir]

weather:
  wind:
    - {at: 1805-06-15T04:00, from_deg: 20, knots: 15, air_mass: neutral}
    - {at: 1805-06-15T16:00, from_deg: 25, knots: 16}
    - {at: 1805-06-16T04:00, from_deg: 15, knots: 14}
    - {at: 1805-06-16T16:00, from_deg: 20, knots: 15}
    - {at: 1805-06-17T04:00, from_deg: 20, knots: 14}
  background:
    {hpa: 1019, gradient_hpa_per_100km: 0.3, high_toward_deg: 330}
  systems:
    - name: the Azores high
      kind: high
      radius_km: 1500
      track:
        - {at: 1805-06-14T12:00, x_km: -900, y_km: 700, hpa: 1026}
        - {at: 1805-06-18T12:00, x_km: -880, y_km: 700, hpa: 1026}
  sky: {sky: detached clouds, weather: fine, visibility: the horizon}
  sea: true

standing_orders:
  - data/scenarios/morocco.orders

orders:
  - set plain sail
  - shape a course for 33 54 N 7 54 W
