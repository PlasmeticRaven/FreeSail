# FreeSail: Sicily and Malta, Valletta through the Faro to Palermo (package 105, step 3). A
# free passage of the block's water, not a gate's and not pinned: the frigate weighs from off
# the mouth of the Grand Harbour, crosses the channel of Malta north-north-eastward to the
# offing of Cape Passaro, runs up the east coast of Sicily outside Syracuse, Augusta and
# Catania, enters the Faro of Messina from the south, passes Messina and the Faro point with
# the stream that runs there six hours north and six south (Smyth 1824, pp. 109 to 110), and
# runs west along the north coast, south of Vulcano, past Cape Orlando, Cefalù and Cape
# Zaffarana, into the gulf of Palermo, where she anchors in the road off the mole in nineteen
# fathoms of stiff clay (Smyth 1824, App. p. iv); on the whole chart (`chart:
# atlantic-east`), so that she sails `sicily`'s water from end to end and its harbour patches
# of Valletta, the Faro and Palermo.
#
# April 1808: Malta the King's since 1800 (James 1837, vol. 2, p. 445), Sicily the King of the
# Two Sicilies', his court at Palermo and the British garrison at Messina (Smyth 1824, p.
# 122; James 1837, vol. 4, p. 122); the nations table (June 1805's picture) reads the King of
# the Two Sicilies neutral to her. Her errand JUDGEMENT: despatches from Malta for the court
# at Palermo.
#
# Given to either driver with --scenario:
#     py -m freesail.ui.server --scenario data/scenarios/the-faro.yaml
#     py -m freesail.ui.console --scenario data/scenarios/the-faro.yaml
# and printed whole, with the account against the truth, by
#     py tools/day_log.py data/scenarios/the-faro.yaml --hours 72 --reckoning
#
# The weather is pinned (a spring scirocco, south-east and east-south-east at twelve to
# fourteen knots, a fair wind for the whole run, the north coast's quarter at the last;
# Smyth 1854, pp. 250 to 253, the winds of the Sicilian seas; JUDGEMENT), so that the passage
# is the same on every machine; the sea and the motion are kept. Its figures at seed 7 are in
# docs/dev/TuningNotes.md (package 105), measured once: not a gate's, not pinned.

name: Sicily and Malta, Valletta through the Faro to Palermo
