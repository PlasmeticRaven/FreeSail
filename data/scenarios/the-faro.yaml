    - {at: 1808-04-20T18:00, from_deg: 130, knots: 14}
    - {at: 1808-04-21T06:00, from_deg: 125, knots: 13}
    - {at: 1808-04-21T18:00, from_deg: 115, knots: 12}
    - {at: 1808-04-22T06:00, from_deg: 110, knots: 12}
    - {at: 1808-04-22T18:00, from_deg: 100, knots: 11}
    - {at: 1808-04-23T06:00, from_deg: 95, knots: 10}
  background:
    {hpa: 1012, gradient_hpa_per_100km: 0.25, high_toward_deg: 60}
  systems:
