# FreeSail: the captive (package 74, step 7; docs/design/Design-Prizes.md §3 and §8; spec
# M7 §19). The player's frigate Amazon has struck to the French frigate Didon in the mouth
# of the Channel and he is a prisoner aboard her, bound for Brest with his own ship a prize
# astern under her prize master; his parole is asked a minute after the taking in the
# captor's words and is his to give or refuse at his own prompt (`say to the captain: I
# give my parole`); the director above the game on the captive's brief shapes what follows
# (a gale that night, a cartel in the offing, a friendly cruiser at dawn) by plausible
# causes. The strike and the possession are the scenario's own world order two minutes in,
# when the Didon has been made a full ship beside her; nothing is pinned on this file.
#     py -m freesail.ui.server --scenario data/scenarios/captive.yaml
#     py -m freesail.ui.console --scenario data/scenarios/captive.yaml

name: The captive, aboard the captor for Brest
seed: 7
start: 1805-06-12T14:00
position: {lat_deg: 48.9000, lon_deg: -5.2000}   # the mouth of the Channel, forty miles west of Ushant
region: channel-west
nation: britain
ship:
  file: data/ships/frigate-36.yaml
  name: Amazon
  heading_deg: 150
  glass: true
  instrument: sextant

people:
  - {role: captain, name: Captain Bowen}
  - {role: master, skill: 0.8}

papers:
  chart: {year: 1804}
  epitome: moore
  almanac: 1805

ports: [brest, falmouth, plymouth]

# The captor: a French frigate three cables to windward, bound for Brest, made a full ship
# at the first switch; the Amazon strikes to her by the world order below.
ships:
  - {id: didon, description: frigate, name: Didon, nation: france,
     position: {lat_deg: 48.9040, lon_deg: -5.2020}, goal: "bound for Brest",
     intent: "bound for Brest", colours: shown}

world_orders:
  - {at: 1805-06-12T14:02, order: 'ship "the ship": struck to the Didon'}

director:
  brief: captive
