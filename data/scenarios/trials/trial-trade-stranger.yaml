# FreeSail: a captain's trial (spec M6 §9 item 1; decision 41; package 40c, the lead).
# A British merchant schooner bound for Falmouth, mid-Channel, a French brig-sloop put on the sea by the director within two miles an hour in: hauling off from her (evading), and the passage resumed when she is lost to sight.
# The rules-based captain of freesail/world/captains.py sails her by the intent alone, no
# book; the trial proves the states he enters and the books he loads against the doctrine
# (data/captains/merchant.yaml). Pinned in tests/test_captain_trials.py at seed 7 and
# measured in docs/dev/TuningNotes.md (package 40c). The gate's owner runs it with no order
# of the ship's given, world orders only (spec M6 §9 item 2).

name: A captain's trial, a merchant schooner and a privateer
seed: 7
start: 1805-06-14T04:00
position: 49 20 N 5 20 W
region: channel-west
nation: britain
ship:
  file: data/ships/topsail-schooner.yaml
  heading_deg: 20
  speed_kn: 5
  glass: true
  instrument: octant
wind:
  gustiness: 0.3
  variability: 0.3

intent: bound for Falmouth

people:
  - {role: master, skill: 0.8}

