# FreeSail: a captain's trial (spec M6 §9 item 1; decision 41; package 40c, the lead).
# The frigate on a station off Ushant with sea room, a westerly gale rising to forty-four knots by ten in the forenoon and easing by night: hove to for weather, filled away when the gale is over, the station kept again.
# The rules-based captain of freesail/world/captains.py sails her by the intent alone, no
# book; the trial proves the states he enters and the books he loads against the doctrine
# (data/captains/kings-ship.yaml). Pinned in tests/test_captain_trials.py at seed 7 and
# measured in docs/dev/TuningNotes.md (package 40c). The gate's owner runs it with no order
# of the ship's given, world orders only (spec M6 §9 item 2).

