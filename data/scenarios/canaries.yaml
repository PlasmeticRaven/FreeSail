papers:
  chart: {year: 1804}
  epitome: norie                  # a ship of war's, which has Canary Island (data/tides/establishments.yaml)
  almanac: 1805

cargo:
  purse_pounds: 200

ports: [santa-cruz-de-tenerife, orotava, las-palmas, santa-cruz-de-la-palma, san-sebastian-de-la-gomera, arrecife, cabras]

weather:
  wind:
    - {at: 1805-06-20T04:00, from_deg: 30, knots: 15, air_mass: neutral}
    - {at: 1805-06-20T12:00, from_deg: 35, knots: 16}
    - {at: 1805-06-20T20:00, from_deg: 30, knots: 14}
  background:
    {hpa: 1019, gradient_hpa_per_100km: 0.3, high_toward_deg: 340}
  systems:
    - name: the Azores high
      kind: high
      radius_km: 1500
      track:
        - {at: 1805-06-19T12:00, x_km: -700, y_km: 900, hpa: 1026}
        - {at: 1805-06-21T12:00, x_km: -680, y_km: 900, hpa: 1026}
  sky: {sky: detached clouds, weather: fine, visibility: the horizon}
  sea: true

standing_orders:
  - data/scenarios/canaries.orders

orders:
  - set plain sail
  - shape a course for 28 33.6 N 16 04.2 W
