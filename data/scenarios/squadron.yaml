# FreeSail: the squadron promoting in station (spec M7 §21; package 72; the owner's
# scenario of the brief). A June forenoon of 1805 south of the Lizard with a westerly: the
# King's frigate (the player's) cruising on her station, and the Channel squadron, a
# frigate with a brig-sloop and a cutter in line ahead at two cables under a far commodore,
# two miles and a half to the south-west and standing across her bows on the same station. The
# squadron keeps its line at far detail (one brain in the commodore, the rest on the station
# leg); as it comes within the crewed distance of the player's ship its ships are promoted
# to full crews under the cap, one by one, each promoted ship's captain keeping her station
# by his book (`in company`, the order `keep your station`) so that the line is unbroken
# through the promotion; and when they draw away again they are demoted to far detail in
# station. Given to either driver with --scenario:
#     py -m freesail.ui.server --scenario data/scenarios/squadron.yaml
#     py -m freesail.ui.console --scenario data/scenarios/squadron.yaml
#
# Played by the player: `the squadron` (the set, its commodore, its formation, each ship's
# station), `the station`, `strangers`, the private signal; her captain answers the
# commodore's private signal by his book. Played by the rules captain with no model seated:
# he keeps his station and answers the signal. The squadron's book is
# data/squadrons/squadron.yaml.
#
# The weather is pinned (a westerly of fourteen knots, the sky clear), so that the
# squadron at seed 7 is the same on every machine; its figures are measured in
# tests/test_known_truths.py (truths 7-152 onward) and recorded in docs/dev/TuningNotes.md
# (package 72).

name: The squadron promoting in station
seed: 7
start: 1805-06-12T10:00
position: {lat_deg: 49.50, lon_deg: -5.50}   # south of the Lizard
region: channel-west
nation: britain
ship:
  file: data/ships/frigate-36.yaml
  heading_deg: 200
  speed_kn: 6
  glass: true
intent: keep the station off the Lizard within 10 miles
wind:
  from_deg: 270
  knots: 14
  gustiness: 0.0
  variability: 0.0

papers:
  chart: {year: 1804}
  almanac: 1805

ports: [falmouth, plymouth, brest]

standing_orders:
  - data/standing_orders/starter.orders

# the Channel squadron: the Medusa, commodore, with the Nimble and the Sparrow in her wake
# at two cables, in line ahead, on the same station as the player's frigate, standing
# north-east across her bows two miles and a half to the south-west
ships:
  - {id: medusa, description: frigate, name: Medusa, nation: britain,
     position: 49 28.2 N 5 32.7 W, goal: "patrolling off the Lizard within 10 miles",
     intent: "keep the station off the Lizard within 10 miles", colours: shown,
     heading_deg: 45, squadron: channel}
  - {id: nimble, description: brig-sloop, name: Nimble, nation: britain,
     position: 49 28.1 N 5 32.9 W, goal: "patrolling off the Lizard within 10 miles",
     intent: "keep the station off the Lizard within 10 miles", colours: shown,
     heading_deg: 45, squadron: channel}
  - {id: sparrow, description: cutter, name: Sparrow, nation: britain,
     position: 49 27.9 N 5 33.1 W, goal: "patrolling off the Lizard within 10 miles",
     intent: "keep the station off the Lizard within 10 miles", colours: shown,
     heading_deg: 45, squadron: channel}

squadrons:
  - id: channel
    name: the Channel squadron
    kind: squadron
    commander: medusa
    members: [medusa, nimble, sparrow]
    formation: line ahead
    interval_cables: 2

orders:
  - set plain sail
