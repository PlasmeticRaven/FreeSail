# FreeSail: a smack out of Falmouth (the owner's ask of 2026-10-17, for testing the smack
# of package 43b). The Cornish smack on the Culloden's lines, British, lying in Carrick Road
# on an August morning in the pilchard season, the world's business about her: the Poll Bank
# off Scilly and the oozy ground off the Eddystone are the grounds the business's fishermen
# work from Falmouth and Plymouth, and the market buys pilchards and fish. Since package 56
# she fishes: the seine in Gerrans Bay by day, the trawl on the Eddystone's ground, the
# lines on the soundings ('the fishing grounds', 'shoot the seine', 'haul the seine',
# 'sell the catch'; data/fishing/ and the primer's chapter for the fisherman). Given to
# either driver with --scenario:
#     py -m freesail.ui.server --scenario data/scenarios/smack-falmouth.yaml
#     py -m freesail.ui.console --scenario data/scenarios/smack-falmouth.yaml

name: A smack out of Falmouth
seed: 7
start: 1805-08-14T04:30
position: {lat_deg: 50.1631, lon_deg: -5.0345}   # Carrick Road, the usual anchorage (Imray 1874 p. 90)
region: channel-west
nation: britain
ship:
  file: data/ships/smack.yaml
  heading_deg: 190
  glass: true
  instrument: octant
wind:
  gustiness: 0.3
  variability: 0.3

people:
  - {role: master, skill: 0.7}    # a fishing master who keeps a reckoning

papers:
  chart: {year: 1804}
  epitome: moore
  almanac: 1805
  price_lists: [falmouth]

cargo:
  purse_pounds: 40

ports: [falmouth, plymouth, st-marys, roscoff, brest]

# The world's business (spec M6 §19; package 43b): the Channel's trade, fishermen and
# cruisers drawn under the seed; her own kind among them on the grounds.
business: on

weather:
  climatology: true

orders:
  - let go the best bower
