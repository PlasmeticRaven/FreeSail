# FreeSail: the primer's lessons in pilot water (docs/primer/18-lessons.md; package 40b):
# a pilotage by cross bearings past the Manacles, the set found between two fixes and
# allowed, heaving to for the Falmouth pilot, and coming to an anchor in the outer road
# with the stream running, veering to a scope and weighing.
#
# The frigate four miles south-east of Black Head at eight in the morning of 14 June
# 1805, the westerly on her beam and Falmouth to the north, her account from a departure
# at the start (a mile in doubt). No book: the orders are the officer's alone, typed at
# the prompt as the chapter gives them.
#     py -m freesail.ui.console --scenario data/scenarios/lesson-falmouth.yaml
# The chapter's run, measured once at seed 7, and the orders with their times, are in
# docs/dev/TuningNotes.md under package 40b (`tools/lesson_run.py` runs it again).
#
# The day's weather is pinned: a westerly of twelve knots and a clear sky over the old
# high, so that the marks are seen and the pilot comes off.

name: Pilot water, Black Head to Falmouth road
seed: 7
start: 1805-06-14T08:00
position: 49 56 N 5 04 W
region: channel-west
ship:
  file: data/ships/frigate-36.yaml
  heading_deg: 20
  speed_kn: 6
  glass: true
  instrument: sextant
wind:
  gustiness: 0.3
  variability: 0.3

papers:
  chart: {year: 1804}
  epitome: norie
  almanac: 1805

cargo:
  purse_pounds: 200

ports: [falmouth, plymouth, brest]

weather:
  wind:
    - {at: 1805-06-14T00:00, from_deg: 270, knots: 12, air_mass: neutral}
  background:
    {hpa: 1018, gradient_hpa_per_100km: 0.4, high_toward_deg: 200}
  systems:
    - name: the old high over Biscay
      kind: high
      radius_km: 900
      track:
        - {at: 1805-06-13T12:00, x_km: 300, y_km: -500, hpa: 1024}
        - {at: 1805-06-15T12:00, x_km: 500, y_km: -600, hpa: 1022}
  sky: {sky: clear, weather: fine, visibility: the horizon}
  sea: true

orders:
  - set plain sail
  - steer NNE
