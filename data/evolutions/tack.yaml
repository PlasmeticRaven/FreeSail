# Tack ship (spec §8.5, scripted). The script in freesail/evolutions/scripts.py
# gives the helm and the braces their orders on a timeline and watches the
# ship's head against the wind:
#   "Helm's a-lee"        the helm is ordered twelve points round, through the wind
#   "Mainsail haul"       within a point of the wind, the after yards swing (brace_s)
#   "Let go and haul"     head through the wind, the head yards swing (brace_s)
#   steady on the new close-hauled course: ship.tacked.
# She misses stays if her way falls below min_speed_kn, or she hangs longer
# than stays_timeout_s, before her head comes through; then the yards are
# squared for a wear and the helm put up.
# A frigate in a working breeze takes five to ten minutes from "ready about"
# to steady on the new tack; the turn itself is the physics' to make.
id: tack
verb: tack
applies_to: {class: ship}
script: tack
preconditions:
  - {check: dyn.speed >= knots(2), reason: "She has not way enough on her to stay: {speed} through the water."}
  - {check: close_hauled(), reason: "She is not close-hauled; bring her by the wind before going about."}
timing:
  brace_s: 45            # to swing the after yards, and again the head yards
  stays_timeout_s: 180   # longer than this without coming through and she has missed stays
  min_speed_kn: 0.8      # below this before coming through and she has missed stays
  steady_deg: 5          # within this of the new course counts as steady
  steady_timeout_s: 300  # or after this long on the new course order (package 10: at 120 s
                         # the frigate was called tacked while still gathering way nine
                         # degrees off her course; she is steady in about five and a half)
on_start: {log: "All hands about ship."}
on_complete: {log: "Tacked; braced up on the {new_tack} tack, heading {new_course}.", kind: ship.tacked, severity: notable}
on_fail: {log: "Missed stays: {reason}. Squared the yards and fell off on the {old_tack} tack.", kind: ship.missed_stays, severity: urgent}
# crew (package 19): checked; "Tacking and wearing: weather main-topsail and upper
# braces" is in every topman's billet: all hands (Luce 1884, ch. XVIII Organization, 'Station Billet').
crew: {hands: all, rating: ordinary, stations: [all hands]}
source: "Luce 1866, ch. XXIV Working to Windward, 'Tacking', 'Missing Stays'; Lever 1808, 'Tacking Expeditiously'"
