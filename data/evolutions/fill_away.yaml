# Fill away after lying to (scripted): right the helm, order the close-hauled
# course on the present tack, and brace the backed yards round full over
# brace_s. Undoes heave_to; needs ship.extra["hove_to"] to be present.
id: fill_away
verb: fill_away
applies_to: {class: ship}
script: fill_away
preconditions: []
timing:
  brace_s: 45     # to brace the backed yards round full
on_start: {log: "Fill away; man the after braces."}
on_complete: {log: "Filled away; braced full and steering {new_course}.", kind: ship.filled_away, severity: notable}
on_fail: {log: "Could not fill away: {reason}.", kind: evolution.failed, severity: notable}
crew: {hands: 12, rating: ordinary, stations: [afterguard]}
source: "Luce 1866, ch. XXVI Emergencies, 'To fill away, after lying to with the main topsail to the mast'"
