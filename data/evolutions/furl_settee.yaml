# Furl a settee: clew it up if it is drawing, then the topmen lay aloft and out along the
# yard, as on a lateen yard, whose woldings are the steps "to climb to the peek to furl or
# loose the sail" (Falconer 1780, YARD), and furl it on the yard. No source lowers the yard to
# furl it. One lowered on deck to be dipped is furled where it lies and hoisted again. Times as
# for furling a square sail (judgement).
#
# Where the hands on deck are too few to begin it, as a small coaster's watch of two by night,
# all hands are called for it and piped down after, as a small company was turned up for
# any work of her great sail (judgement; no source on her watches was found).

# Build notes (not served by the library's catalogue):
# Package 75, B3.3: docs/design/Design-ShipsEngineExtensions.md §5.3 (Bil §1.4: "no source says
# the yard was lowered to furl"; furl_square's furl). Ext E6 for a sail laced to a yard.
# Package 75, the lead's ruling (1) of 2026-11-10 (the bilander's short watch): `too_few: all
# hands` (`hands.CrewRequest.calls_all_hands`, `Runner._watch_too_few`), on the settee's
# files alone so that no other ship's work changes.
id: furl_settee
verb: furl
applies_to: {class: settee}
preconditions:
  - {check: sail.state != furled, reason: "The {sail} is furled already.", done: true}
  - {check: sail.state != blown_out, reason: "The {sail} is blown out; there is nothing left to furl."}
  - {check: sail.state != unbent, reason: "The {sail} is unbent; there is no sail on the yard to furl."}
requires:
  - {check: not wrecked(spar_chain(sail)), reason: "the {sail}'s yard or mast is wrecked"}
steps:
  - do: clew_up
    duration_s: 60
    if: "sail.state in [set, loosed]"
    sets: {sail.state: in_the_gear}
    log: "Clewed up the {sail}."
  - do: furl
    duration_s: 150
    aloft: true
    if: not sail.yard_lowered
    sets: {sail.state: furled}
  - do: furl_on_deck
    instead_of: furl
    duration_s: 150
    if: sail.yard_lowered
    sets: {sail.state: furled}
    log: "Furled the {sail} on its yard on deck."
  - do: hoist
    duration_s: 60
    if: sail.yard_lowered
    via: halyard_of(sail)
    sets: {sail.yard_lowered: "false"}
    log: "Hoisted the {sail}'s yard, the sail furled on it."
on_start:
  log: "Lay aloft and furl the {sail}."
  # in the gear its yard may be on deck (`yard_lowered`, which the map does not read), where it
  # is furled; the furl aloft sends the topmen up itself (B3.3's review)
  from: {in_the_gear: "Hands to furl the {sail}."}
on_complete: {log: "Furled the {sail} on its yard.", kind: sail.furled, severity: notable}
on_fail: {log: "Could not furl the {sail}: {reason}.", kind: evolution.failed, severity: notable}
# crew: the main top's men aloft, the afterguard at the gear (judgement, as furl_square's)
crew: {hands: 6, rating: ordinary, stations: [topmen, afterguard], too_few: all hands}
source: "Falconer 1780, YARD (the woldings); furl_square's times (judgement)"
