# Take in a gaff sail: let go the outhaul and brail it up (a spanker with a
# standing gaff), or settle the throat and peak halyards and lower it onto
# the boom (a schooner's main). Either way it is left in the gear, not stowed.
id: take_in_gaff
verb: take_in
applies_to: {class: gaff}
preconditions:
  - {check: "sail.state in [set, loosed]", reason: "The {sail} is {state}; there is nothing to take in.", done: true}
requires:
  - {check: not wrecked(spar_chain(sail)), reason: "the {sail}'s gaff or mast is wrecked"}
steps:
  - do: brail_up
    duration_s: 90
    sets: {sail.state: in_the_gear}
on_start: {log: "Hands to the {sail} brails and halyards."}
on_complete: {log: "Took in the {sail}.", kind: sail.taken_in, severity: notable}
on_fail: {log: "Could not take in the {sail}: {reason}.", kind: evolution.failed, severity: notable}
# crew (package 19): checked; the afterguard man the spanker brails (Luce 1884, ch. XVIII Organization, 'Duties of Men in Different Parts of the Ship').
# hands: milestone 2's number, kept: package 17's tests were built on these numbers.
# It is more than one watch of the schooner has at this rating (six ordinary, seven
# able, two landsmen on deck at the least), so there the request is made up with
# better hands and goes a little faster than milestone 2; the frigate's watch fills it.
crew: {hands: 8, rating: ordinary, stations: [afterguard]}
source: "Luce 1866, ch. XXIII At Sea, 'The Spanker' (taking in); Luce 1884, ch. XXXIV Handling Fore-and-Afters"
