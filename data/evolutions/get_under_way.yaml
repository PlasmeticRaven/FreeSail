# Get under way (spec M5 §23; package 35; the owner, 2026-10-02: `weigh` alone leaves her
# with the anchor up and no sail set, and `get under way` is Luce's whole sequence). The
# evolution as Luce 1866, ch. XXI Getting Under Way, 'To get under way and stand out on a
# wind' (pp. 393 to 396 of the 1877 printing), gives it: "Pass and lash the messenger;
# get up the nippers and capstan bars; rig the fish, and reeve the cat and fish
# purchases; send the ready-men aloft to get the sails ready for loosing; ... call, All
# hands up anchor! bring to on the cable, and unbitt; man the bars, Heave around! and
# heave in the cable to a short stay. ... The cable being in to a short stay, Pawl the
# capstan! stopper the cable well, and unship the bars. Stations for loosing sail! Lay
# aloft sail-loosers! and when the men are aloft and ready, Lay out and Loose! Man the
# topsail sheets and halliards! ... Stand by! Let fall! Sheet home! Lay in! Lay down from
# aloft! ... Hoist away the topsails! ... Brace up the after-yards for the tack on which
# you wish to cast, and the head-yards abox to pay her off. Top up the spanker-boom, and
# bear it over on the side you wish to cast. ... The sails being set, Man the bars! ship
# and swifter them; Heave around! at the same time giving her a sheer with the helm. The
# officer of the forecastle reports when the cable is 'up and down', and also, when the
# anchor is 'aweigh!' at the former report, Man the jib and flying-jib-halliards! The
# fore-topsail pays her head off, and as soon as the head-sails will take the right way,
# Let go the downhauls, hoist away! Put the helm a-lee for stern-board, at the same time,
# heave the anchor up to the bows; and as soon as it is high enough, Avast heaving! Pawl
# the capstan! stopper the cable; cat and fish the anchor. When she has fallen off
# sufficiently, Right the helm! Brace around the head yards, and set the spanker. Trim
# the yards and stand out to sea, making sail as required." And of the tide (p. 393):
# "When about to get under way (the ship being tide rode and the wind aft), the
# comparative strength of wind and tide must be well considered ... it is equally bad
# management when the anchor is hove up and the ship is drifted by the tide without
# steerage way."
#
# The script (freesail/evolutions/scripts.py, GetUnderWayScript) does it in phases:
#   rig_capstan   the messenger passed, the bars shipped (as heave_short), unless she is
#                 hove short already
#   heave_short   the cable in to a short stay
#   loose         the topsails loosed, sheeted home and hoisted (a fore-and-after's
#                 mainsail set, as Luce has it set "before starting the anchor" where
#                 there is not room to go astern); the after yards braced up for the
#                 tack to cast on and the head yards abox
#   heave         the cable hove up and down
#   break_out     the anchor broken out: aweigh; the jib hoisted; the helm a-lee for the
#                 stern-board
#   cast          the head yards kept abox till her head has paid off; then the helm
#                 righted, the head yards braced round, the spanker set, the course
#                 steered; meanwhile the anchor hove up, catted and fished
# Parameters: `tack`, the tack to cast on (the pilot's, else the one her head falls off
# to from the wind); `course_deg`, the course to steer when she has cast (the pilot's
# course out of the road; none: full and by on the tack). The sails she gets under way
# under are the topsails and the jib on a square rig, the mainsail and the jib on a
# fore-and-after; the captain makes more sail as he pleases.
id: get_under_way
verb: get_under_way
applies_to: {class: ship}
script: get_under_way
params: {tack: null, course_deg: null}
preconditions: []
timing:
  rig_capstan_s: 180        # as heave_short's: judgement
  heave_fathoms_per_s: 0.1  # six fathoms a minute at the capstan: judgement
  short_stay_per_depth: 1.5 # a cable and a half the depth (heave_short's judgement on Luce's "in a line with the fore topmast stay")
  loose_s: 240              # the sail-loosers aloft, let fall, sheeted home and hoisted (Luce's sequence; the time judgement, a frigate's topsails in four minutes)
  brace_s: 60               # the after yards braced up and the head yards abox: judgement
  break_out_s: 60           # the anchor broken out of the ground: judgement
  hoist_fathoms_per_s: 0.2  # the anchor hove up to the bows, by the depth: judgement
  cast_points: 7            # her head paid off this far from the wind before the head yards are filled and the spanker set: past close-hauled, so that the spanker does not bring her back into the wind before she has way (judgement on Luce's "fallen off sufficiently"; the package found four points too few, docs/dev/TuningNotes.md)
  cast_timeout_s: 420       # she is given seven minutes to cast before the yards are filled regardless
  cat_and_fish_s: 300       # as weigh_anchor's: judgement
on_start: {log: "All hands up anchor! Pass the messenger, ship the bars; send the ready-men aloft to get the sails ready for loosing."}
on_complete: {log: "Under way on the {tack} tack, {sail_words}; {anchor} catted and fished; {course_words}.", kind: ship.under_way, severity: notable}
on_fail: {log: "Could not get under way: {reason}.", kind: evolution.failed, severity: notable}
# crew: all hands ("All hands up anchor!"); a manoeuvre (Luce's whole sequence has the
# ship's company at the bars, aloft and at the braces by turns), so it belays the sail
# work in hand.
crew: {hands: all, rating: ordinary, stations: [all hands]}
belays: true
source: "Luce 1866, ch. XXI Getting Under Way, 'Remarks on Casting' and 'To get under way and stand out on a wind' (pp. 392 to 396 of the 1877 printing); ch. XXXV; Lever 1808, 'Weighing the Anchor', 'Catting and Fishing the Anchors' (p. 68); Falconer 1780, AWEIGH, To CAST"
