# Haul the seine. The circle contracted, the bunt raised "so as to get the net under the
# fish and bring them to the surface, when they are taken out in baskets and put into the
# boats" (Holdsworth 1874 p. 158, the tuck-sean), the boat bringing them alongside and the
# fish struck into the well and the hold. An hour: judgement.
#
# The script (freesail/evolutions/scripts.py, FishingGearScript) holds the gear and not the
# ship; the order's checks (the gear she carries, the ground she is on, its season, the
# hour and the wind) are freesail/orders/fishing.py's.
id: haul_seine
verb: haul the seine
applies_to: {class: ship}
script: fishing_gear
params: {gear: seine, action: haul, ground: null}
preconditions: []
timing:
  haul_s: 3600
on_start: {log: "Haul the seine; tuck the fish into the boat."}
on_complete: {log: "{catch}", kind: fishing.hauled, severity: notable}
on_fail: {log: "Could not haul the seine: {reason}.", kind: evolution.failed, severity: notable}
crew: {hands: all, rating: ordinary, stations: [all hands]}
source: "Holdsworth 1874 p. 158 (tucking the sean)"
