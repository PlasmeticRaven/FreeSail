# The relieving tackles rove to the tiller when the wheel or the tiller ropes are shot away
# (scripted, RelievingTacklesScript in evolutions/repair_scripts.py). The hit that takes the
# wheel says the helm is lost until the relieving tackles are rove, and this is their rigging:
# two tackles hooked to the tiller's end below and manned there, the helm's orders passed
# down. Steel 1794, vol. 1, RELIEVING-TACKLES, "used when the tiller-ropes are damaged, have
# one end made fast to a rope strap, with a thimble on each side of the tiller, and the other
# end to an eye-bolt in the side"; Luce 1884, the quarter bill: "at the relieving tackles, an
# officer or quartermaster, with a few men to steer the vessel in case the wheel or
# tiller-ropes are shot away". Falconer 1780's RELIEVING-TACKLES are the careening tackles,
# another use of the name. One phase, `reeve`; at its end the helm answers again. Her
# steering meanwhile is as it was, the rudder held where the shot left it.
id: relieving_tackles
verb: relieving_tackles
applies_to: {class: ship}
script: relieving_tackles
params: {}
preconditions: []
timing:
  reeve_s: 300   # hooked to the tiller and manned below: five minutes (JUDGEMENT; Luce's quarter bill keeps men stationed at them, so the tackles are at hand)
on_start: {log: "Rig the relieving tackles! Hands below to the tiller."}
on_complete: {log: "{done}", kind: helm.relieved, severity: notable}
on_fail: {log: "Could not rig the relieving tackles: {reason}.", kind: evolution.failed, severity: notable}
# crew: "an officer or quartermaster, with a few men" (Luce 1884, l. 21775): six hands
# (JUDGEMENT in the number: two tackles, three a fall)
crew: {hands: 6, rating: ordinary, stations: [afterguard, waisters]}
source: "Steel 1794, RELIEVING-TACKLES (the tiller-ropes damaged); Luce 1884, the quarter bill and ch. on tackles (to steer if the wheel or tiller-ropes are shot away); Falconer 1780, HELM and TILLER; the minutes and the hands JUDGEMENT"
