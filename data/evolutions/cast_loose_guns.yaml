# Cast loose the guns (spec M7 §8; package 70; scripted, CastLooseScript in
# evolutions/action_scripts.py). The crews cast off the tackles and the breechings'
# lashings, take out the tompions and provide the guns (the powder horns, the match,
# the rammers and sponges; Douglas 1820, part II, "Cast loose your guns"); from then the
# guns are served by the battery's cycle (`freesail/combat/guns.py`): loaded, run out and
# primed as the standing intentions have it, and fired as they bear or at the word.
# Wanted at quarters; refused in words before the beat.
id: cast_loose_guns
verb: cast_loose_guns
applies_to: {class: ship}
script: cast_loose_guns
preconditions: []
timing:
  cast_loose_s: 60   # the tackles cast off and the guns provided (Douglas 1820, part II; judgement for the minute)
on_start: {log: "Cast loose the guns!"}
on_complete: {log: "The guns are cast loose and provided ({count} of them).", kind: guns.cast_loose, severity: notable}
on_fail: {log: "Could not cast loose the guns: {reason}.", kind: evolution.failed, severity: notable}
# crew: the gun crews at their guns; the quarter bill's hands, not the watch's, so the
# runner takes all hands (they are called already) and the crews do the work
crew: {hands: all, rating: ordinary, stations: [all hands]}
source: "Douglas 1820, part II, the words of command ('Cast loose your guns'; 'Take out your tompions'); Luce 1884, ch. XX 'General Quarters'"
