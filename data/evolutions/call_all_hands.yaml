# Call all hands (spec M3 §4.2 and §6): the boatswain and his mates pipe "All
# hands!" down the hatchways and the watch below turns out, lashes up its
# hammocks and comes up the ladders. The arrival itself (a third at once, the
# rest over the delay) is the watch routine's (crew/routine.py, package 18);
# this file makes the call an evolution with its delay and its log line, so
# that it journals and replays like any other order. The order that starts
# it ("call all hands", "turn the hands up") is package 20's.
#
# The delay is ALL_HANDS_DELAY_S of the routine, ninety seconds. No hands are
# asked for: the call is the routine's, not work for the watch.
id: call_all_hands
verb: call_all_hands
applies_to: {class: ship}
params: {why: "by the captain's order"}   # the words in brackets in the log: "to shorten sail"
steps:
  - do: turn_up
    duration_s: 90
    log: "The watch below on deck."
on_start: {log: "All hands! ({why})", kind: crew.all_hands, severity: notable}
on_complete: {log: "All hands on deck.", kind: crew.all_hands_up, severity: routine}
on_fail: {log: "Could not turn the hands up: {reason}.", kind: evolution.failed, severity: notable}
crew: {hands: 0}
source: "Luce 1884, ch. XVIII Organization, 'Boatswain's Mates' (working at all hands they pass the orders by pipe); ch. XIX Duties of Midshipmen, 'Duties of the Mate of the Gun-Deck' (\"see the men turn out promptly when 'all hands' are called\")"
