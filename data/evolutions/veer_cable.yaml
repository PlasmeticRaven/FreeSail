# Veer cable (spec M5 §18; package 34): more cable given to the anchor she rides by.
# "When the wind is so violent as to bring the anchors home, and make the vessel drive,
# the cable is veered away; and, in veering away, the turns of the stopper laniards are
# slackened, and a portion of the cable suffered to go out of the hawse, to let the
# vessel further astern of her anchor; in which situation she bears less strain on the
# flukes, and is less liable to drag the anchor; for, the more cable is out, the flukes
# become deeper buried, and the ship rides in greater safety" (Steel 1794 vol. II, p. 292,
# 'Of coming to anchor'). Luce's first answer to an anchor dragging ("veer more cable",
# the World's line, physics/anchor.py).
#
# Package 37f (the review of gate 5c's playtests, 5.8 and 10.4): the cable veered is
# the anchor's that the order names (parameter `anchor`; the one she rides by when it
# names none), and "to" is kept wherever the name stands: "veer to 80 fathoms", "veer
# the best bower to 80 fathoms" and "veer to 80 fathoms on the best bower" all veer to
# eighty; "veer 20 fathoms" and "veer the small bower 20 fathoms" veer twenty more. In
# game 9 `veer the small bower to 80 fathoms` veered the best bower, and `veer the best
# bower to 80 fathoms` veered eighty more. An anchor that is not down is refused by name,
# with the one she rides by; a "to" less than what is out is refused, as before, with the
# order that does it ("heave in to 60 fathoms").
#
# Parameters: `fathoms` (how many more to veer, or with `to` true the scope to veer to);
# `anchor`; a bare "veer cable" veers a third as much again (judgement).
id: veer_cable
verb: veer_cable
applies_to: {class: ship}
script: veer_cable
params: {fathoms: null, to: false, anchor: null}
preconditions: []
timing:
  veer_fathoms_per_s: 0.5  # the stoppers slackened and the cable surged through the
                           # bitts a few fathoms at a time: judgement, half the rate it
                           # runs when let go
on_start: {log: "Veer away on {anchor} cable."}
on_complete: {log: "Veered to {fathoms} on {anchor}.", kind: cable.veered, severity: routine}
on_fail: {log: "Could not veer cable: {reason}.", kind: evolution.failed, severity: routine}
# crew: the forecastlemen at the stoppers and the bitts (judgement in the number).
crew: {hands: 8, rating: ordinary, stations: [forecastle]}
source: "Steel 1794 vol. II, p. 292; Lever 1808, 'Single Anchor', p. 97 (the long or leeward service veered to against wind and tide); Luce 1866, ch. XXXIV, p. 568 (the scope to ride by)"
