# Set a gaff sail (spanker, driver, a schooner's fore or main). Cast off the
# gaskets or clear away the brails, then hoist by the throat and peak
# halyards, or haul out along a standing gaff by the outhaul, and trim the
# sheet, trimmed to the point of sail (the sheet angle is set from the apparent wind). About three and a half minutes.
id: set_gaff
verb: set
applies_to: {class: gaff}
preconditions:
  - {check: sail.state != set, reason: "The {sail} is set already.", done: true}
  - {check: sail.state != blown_out, reason: "The {sail} is blown out; a new one must be bent."}
  # not sheeted on a parted sheet nor hoisted on a parted halyard (package 31b)
  - {check: "not wrecked(sheets_of(sail)) and not wrecked(halyard_of(sail))", reason: "{parted}"}
requires:
  - {check: not sail.wrecked, reason: "the {sail} is wrecked"}
  - {check: not wrecked(spar_chain(sail)), reason: "the {sail}'s gaff or mast is wrecked"}
  - {check: "not wrecked(spar_of_role(sail, boom))", reason: "the {sail}'s boom is wrecked"}
# From furled, the gaskets are cast off and the brails cleared away; brailed up in the
# gear it is loose already, and the brails are let go (Luce 1866, ch. XXIII At Sea, 'The
# Spanker', setting it; Luce 1884, ch. XXXIV Handling Fore-and-Afters). Fifteen seconds is
# judgement; the owner's rule of package 29b, each state its own case.
steps:
  - do: clear_away
    duration_s: 60
    if: sail.state == furled
    sets: {sail.state: loosed}
    log: "Cast off the gaskets and cleared away the brails of the {sail}."
  - do: let_go_brails
    instead_of: clear_away
    duration_s: 15
    if: sail.state == in_the_gear
    sets: {sail.state: loosed}
    log: "Let go the brails of the {sail}."
  - do: hoist
    duration_s: 120
    via: halyard_of(sail)
    sets: {sail.state: set, sail.sheet_angle: "clamp(abs(dyn.apparent_wind_angle) - deg(25), deg(18), deg(85))"}
  - do: haul_out
    duration_s: 30
    if: sail.state != set
    sets: {sail.state: set, sail.sheet_angle: "clamp(abs(dyn.apparent_wind_angle) - deg(25), deg(18), deg(85))"}
on_start: {log: "Hands to the {sail} halyards and outhaul."}
on_complete: {log: "Set the {sail}.", kind: sail.set, severity: notable}
on_fail: {log: "Could not set the {sail}: {reason}.", kind: evolution.failed, severity: notable}
# crew (package 19): the afterguard man the spanker gear; the topmen of the sail's mast
# loose the peak (Luce 1884, ch. XVIII Organization, 'Duties of Men in Different Parts of the Ship').
# hands: milestone 2's number, kept: package 17's tests were built on these numbers.
# It is more than one watch of the schooner has at this rating (six ordinary, seven
# able, two landsmen on deck at the least), so there the request is made up with
# better hands and goes a little faster than milestone 2; the frigate's watch fills it.
crew: {hands: 10, rating: ordinary, stations: [afterguard, topmen]}
source: "Luce 1866, ch. XXIII At Sea, 'The Spanker' (setting); Luce 1884, ch. XXXIV Handling Fore-and-Afters"
