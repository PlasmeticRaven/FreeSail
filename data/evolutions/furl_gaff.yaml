# Furl a gaff sail: brail it up or lower it if it is still drawing, then pass
# the gaskets along the gaff or the boom. Not in the required list for M2,
# but the verb table's `furl` needs a `furl_<class>` for every class.
id: furl_gaff
verb: furl
applies_to: {class: gaff}
preconditions:
  - {check: sail.state != furled, reason: "The {sail} is furled already.", done: true}
  - {check: sail.state != blown_out, reason: "The {sail} is blown out; there is nothing left to furl."}
requires:
  - {check: not wrecked(spar_chain(sail)), reason: "the {sail}'s gaff or mast is wrecked"}
steps:
  - do: brail_up
    duration_s: 90
    if: sail.state in [set, loosed]
    sets: {sail.state: in_the_gear}
    log: "Brailed up the {sail}."
  - do: furl
    duration_s: 120
    aloft: true
    sets: {sail.state: furled}
on_start: {log: "Hands to furl the {sail}."}
on_complete: {log: "Furled the {sail}.", kind: sail.furled, severity: notable}
on_fail: {log: "Could not furl the {sail}: {reason}.", kind: evolution.failed, severity: notable}
# crew (package 19): the afterguard furl the spanker and the mizzen topmen "loose and
# furl the peak of the spanker" (Luce 1884, ch. XVIII Organization, 'Duties of Men in Different Parts of the Ship'); topmen are those of the sail's own mast.
# hands: milestone 2's number, kept: package 17's tests were built on these numbers.
# It is more than one watch of the schooner has at this rating (six ordinary, seven
# able, two landsmen on deck at the least), so there the request is made up with
# better hands and goes a little faster than milestone 2; the frigate's watch fills it.
crew: {hands: 8, rating: ordinary, stations: [afterguard, topmen]}
source: "Luce 1866, ch. XX In Charge of the Deck, 'To Furl Sails'; ch. XXIII 'The Spanker'"
