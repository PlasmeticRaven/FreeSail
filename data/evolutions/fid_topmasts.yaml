# Fid the topmasts (scripted, SwayUpScript on the topmasts): undo
# strike_topmasts. Each struck topmast is swayed up and fidded, the rigging set
# up, and the topsail yard and topmast studding sail booms put back in their
# places, the sails on them furled. The topgallant masts stay on deck until
# "sway up the topgallant masts".
#
# Luce's sequence is compressed to two phases, both aloft:
#   mast   top tackles manned, swayed aloft, fidded, the rigging set up
#   yards  the topsail yard swayed up off the cap and the booms got out again
id: fid_topmasts
verb: fid_topmasts
applies_to: {class: ship}
script: sway_up
params:
  mast: topmast
  poles: []
  with_masts: true
  what: topmasts
  verb_words: fid
  aloft: [mast, yards]
timing:
  mast_s: 1080   # swayed aloft, fidded, rigging set up (judgement)
  yards_s: 240   # topsail yards off the caps, booms in their places (judgement)
on_start: {log: "Sway up topmasts! Man the top tackles."}
on_complete: {log: "Swayed up and fidded {swayed}.", kind: spar.swayed_up, severity: notable}
on_fail: {log: "Could not fid the topmasts: {reason}.", kind: evolution.failed, severity: notable}
# crew: all hands, as for striking them (Luce 1884, ch. XVIII Organization, 'Station
# Billet': "Strike and fid topmasts: fid and unfid mast").
crew: {hands: all, rating: able, stations: [all hands]}
source: "Luce 1884, ch. XVIII Organization, 'Station Billet' (\"Strike and fid topmasts: fid and unfid mast\"); ch. XX Port Drills, 'Sending Up and Down Topgallant-Masts' (the same work one mast lower); Luce 1866, ch. X Rigging Ship, 'To Set up Topmast Rigging'"
