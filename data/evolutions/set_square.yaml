# Set a square sail from furled or from the gear. The topmen lay aloft and
# loose it, the sheets are hauled home, and then the yard is hoisted by its
# halyard (topsails, topgallants, royals) or, for a course whose yard does
# not hoist, the tack is hauled aboard and the sheet aft. A working watch's
# pace: about four and a half minutes for a topsail, three for a course.
# Luce (ch. XVI) records a French crew single-reefing topsails at exercise in
# under two and a half minutes, so these are not fast times.
id: set_square
verb: set
applies_to: {class: square}
preconditions:
  - {check: sail.state != set, reason: "The {sail} is set already."}
  - {check: sail.state != blown_out, reason: "The {sail} is blown out of the bolt-ropes; a new one must be bent."}
  - {check: sail.state != unbent, reason: "The {sail} is unbent; bend a sail to the yard first."}
  # a sail is not sheeted home on a sheet that is gone, nor hoisted on a parted halyard
  # (package 31b, playtest 11's finding 7): reeve a new one first (reeve_line.yaml)
  - {check: "not wrecked(sheets_of(sail)) and not wrecked(lines_of(sail, tack)) and not wrecked(halyard_of(sail))", reason: "{parted}"}
requires:
  - {check: not sail.wrecked, reason: "the {sail} is wrecked"}
  - {check: not wrecked(spar_chain(sail)), reason: "the {sail}'s yard or mast is wrecked or sent down"}
# Each state the sail is set from is its own case (the owner, package 29b): furled, the
# topmen lay aloft and loose it; hanging in the gear, clewed up or hauled up, it is loose
# already, and setting it is deck work: let go the clewlines and buntlines and sheet home
# (Luce 1866, ch. XXIII At Sea, 'To set a Topsail' after it has been clewed up, 'To set a
# Course' after it has been hauled up). Twenty seconds to let go and overhaul the gear is
# judgement, a quarter of the loosing; loosed and sheeted skip what is done, as before.
steps:
  - do: loose
    duration_s: 90
    if: sail.state == furled
    sets: {sail.state: loosed}
    log: "Laid aloft and loosed the {sail}."
    aloft: true
  - do: let_go_gear
    instead_of: loose
    duration_s: 20
    if: sail.state == in_the_gear
    sets: {sail.state: loosed}
    log: "Let go the {sail} clewlines and buntlines."
  - do: sheet_home
    duration_s: 60
    if: sail.state == loosed
    sets: {sail.state: sheeted}
  - do: hoist
    duration_s: 120
    via: halyard_of(yard_of(sail))
    sets: {sail.state: set}
  - do: haul_aboard
    duration_s: 30
    if: sail.state != set
    sets: {sail.state: set}
on_start:
  log: "Hands aloft to loose the {sail}."
  from: {in_the_gear: "Man the {sail} sheets; let go the clewlines and buntlines."}
on_complete: {log: "Set the {sail}.", kind: sail.set, severity: notable}
on_fail: {log: "Could not set the {sail}: {reason}.", kind: evolution.failed, severity: notable}
# crew (package 19): "Making sail: loose topsail, then on deck to halliards" (the
# topman's station billet); the forecastlemen loose the foresail, the afterguard the
# mainsail (Luce 1884, ch. XVIII Organization, 'Duties of Men in Different Parts of the Ship').
# hands: milestone 2's number, kept: package 17's tests were built on these numbers.
# It is more than one watch of the schooner has at this rating (six ordinary, seven
# able, two landsmen on deck at the least), so there the request is made up with
# better hands and goes a little faster than milestone 2; the frigate's watch fills it.
crew: {hands: 12, rating: ordinary, stations: [topmen, forecastle, afterguard]}
source: "Luce 1866, ch. XXIII At Sea, 'To set a Topsail', 'To set a Top-gallant sail', 'To set a Foresail'; Lever 1808, 'Setting the Topsails'"
