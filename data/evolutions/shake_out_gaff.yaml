# Shake a reef out of a gaff sail: settle the halyards a little, cast off the
# points and ease the earing, then hoist away throat and peak.
id: shake_out_gaff
verb: shake_out
applies_to: {class: gaff}
params: {reefs: 1}
preconditions:
  - {check: sail.state == set, reason: "The {sail} is {state}; set it before shaking out a reef."}
  - {check: sail.reefs > 0, reason: "The {sail} has no reef in it."}
requires:
  - {check: not wrecked(spar_chain(sail)), reason: "the {sail}'s gaff or mast is wrecked"}
steps:
  - do: settle
    duration_s: 30
  - do: shake_out
    duration_s: 120
    sets: {sail.reefs: "max(sail.reefs - params.reefs, 0)"}
    log: "Cast off the reef points of the {sail}."
  - do: hoist
    duration_s: 60
    via: halyard_of(sail)
on_start: {log: "Hands to shake a reef out of the {sail}."}
on_complete: {log: "Shook the reef out of the {sail}; now {state}.", kind: sail.reef_shaken_out, severity: notable}
on_fail: {log: "Could not shake out the reef in the {sail}: {reason}.", kind: evolution.failed, severity: notable}
crew: {hands: 8, rating: ordinary, stations: [afterguard]}
source: "Luce 1866, ch. XXVII Reefing, 'To turn out Reefs', 'Boom Mainsail'"
