# The wheel repaired after it or its ropes are shot away (scripted, RepairWheelScript in
# evolutions/repair_scripts.py; package 116, card 5). The hit that takes the wheel leaves her
# with no helm; the relieving tackles (relieving_tackles.yaml) give her one from below, slower
# than the wheel's; this is the wheel itself made good: new wheel-ropes rove from the barrel
# to the tiller and the wheel's stanchions and spokes mended by the carpenter's crew. Luce
# 1884, on the wheel-ropes parting: the relieving tackles hooked, "send hands down to hook
# and work them, and reeve new wheel-ropes". One phase, `mend`; at its end she steers by
# the wheel again at the wheel's rate, and the relieving tackles, if they were rove, are
# cast off. It may be ordered with the tackles rove or without them: without, she has no
# helm until it is done.
id: repair_wheel
verb: repair_the_wheel   # the work as the log names it: "repairing the wheel"
work: repair the wheel
applies_to: {class: ship}
script: repair_wheel
params: {}
preconditions: []
timing:
  mend_s: 1800   # new wheel-ropes rove and the wheel made good: half an hour (JUDGEMENT; no figure found in Luce, Steel or Falconer)
on_start: {log: "Repair the wheel! The carpenter's crew to the wheel; new wheel-ropes to be rove."}
on_complete: {log: "{done}", kind: helm.repaired, severity: notable}
on_fail: {log: "Could not repair the wheel: {reason}.", kind: evolution.failed, severity: notable}
# crew: the carpenter's crew and a quartermaster's hands at the ropes: four hands (JUDGEMENT)
crew: {hands: 4, rating: able, stations: [idlers, afterguard]}
source: "Luce 1884, the wheel-ropes parting (the relieving tackles hooked and new wheel-ropes rove); Falconer 1780, HELM (the wheel, the tiller-rope and the barrel); the minutes and the hands JUDGEMENT"
