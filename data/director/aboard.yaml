# The things a director may have found aboard the player's ship (spec M7b §3, `aboard:`;
# package 50): each is a report of the ship's own people (the carpenter's, the cooper's, the
# purser's) with what it does in the part graph or the stores, and the condition under which
# the simulation could have produced it on its own. An `aboard:` order whose condition does
# not hold is doubted, not refused (decision 50): the channel says why, and the director may
# enter it again with a `[reason: ...]`. The table is what the game can do, never the list of
# what the director may say: words it does not know are answered honestly and logged.
#
# Fields:
#   `words`: the forms the order takes after `aboard:`, matched whole. A form may name one
#     slot, filled by the ship's own name for it: `{spar}` ("the fore topmast"), `{sail}`
#     ("the fore topsail"), `{line}` ("the starboard main brace", or "the main brace" for
#     the first of the pair), `{anchor}` ("the best bower"), `{good}` ("tin", a good in
#     the hold) or `{person}` ("the first lieutenant", "Mr Pearce"; package 73). Keep
#     commas out of the forms: an `aboard:` order with a comma that is no form of the
#     table is read as a thing made or moved (package 53b).
#   `report`: the notable line the play log carries, said by the ship's people and never
#     naming the order; the slot is filled there too.
#   `effect`: what changes, one key or several, each done in turn:
#     `spar_condition`, `sail_condition`, `line_condition`: the slot's part cut to the
#       figure (0 to 100), so that it carries away, or a sail bears, the less;
#     `cable_condition`: the `{anchor}`'s cable cut to the figure (it parts at nought);
#     `water_tons`: tons of water lost; `water_share`: that share of what is in the tier;
#     `water_foul`: the water marked foul (the needs read it; watering clears it);
#     `provisions_share`: that share of the provisions lost; `provisions_days`: so many days;
#     `cargo_tons`, `cargo_share`: tons, or a share, of the `{good}` struck off the manifest
#       with the thing's `cause` in the hold's ledger;
#     `spare_sails_condition`: the sail room's spare canvas worn to the figure;
#     `cordage_share`: that share of the boatswain's spare cordage lost;
#     `chronometer_stopped`: the chronometer stopped, its reading saying the words given
#       (the master winds it and sets it going by the account);
#     `glass_broken`: the glass gone, its readings saying it is broken;
#     `leak_stopped`: the ground's leak and every started seam stopped (the carpenter's
#       caulking by a cause; package 73);
#     `well_pumped`: the water in the well pumped out, and the carpenter's feet counted
#       afresh (doubted while the ship's own pumps and hands could do it);
#     `leak_tons_per_h`: a seam started, making so many tons an hour until the carpenter
#       caulks it (`stop the leak`; package 73);
#     `sick_men`: so many men taken ill, on the sick list for the flux's days with the
#       thing's `cause` words (package 73, spec M7 §16); `sick_share`: that share of the fit
#       men; `person_hurt`: the `{person}` wounded, `light` or `grave`, his station told its
#       roads as a hit tells them (§16a); `surgeon_sick`: the surgeon on his own list, the
#       wounded to his mates and their messmates until he is up;
#     `report_only` (or no effect): nothing modelled yet, said so in the `unmodelled` words.
#     An effect that wants what she lacks (no chronometer, no glass, no spare canvas) is
#     answered "no way as said", and nothing changes.
#   `state`: the word for a part's condition in the director's answer ("sprung", "rotten").
#   `plausible_when`: every condition named must hold, else the `doubt` words:
#     `strained`: the part has borne a strain above the figure of its rating in the last
#       watch, or the mean wind has been fresh (twenty knots);
#     `sea_above`: the sea's words beyond the ones named (smooth, moderate, short, heavy,
#       very heavy), so that she has been working;
#     `days_out`: days of the ship's time since the voyage began;
#     `days_since_watered`: days since she last took in water (the voyage's start until then);
#     `wind_above`: the mean wind at or above so many knots;
#     `at_anchor`: true, she lies at an anchor; false, she does not;
#     `leaking`: true, she is making water from a grounding or a started seam; false,
#       she is not;
#     `well_above`: more than so many metres of water in the well;
#     `pumps_cannot`: true, the ship's own pumps cannot do it (no pumps, no company, or
#       the pumps manned and losing); false, they could (package 73).
#   `harm`: `none`, `hurt` or `deadly`, and a brief with `nobody_dies` refuses the deadly.
#   `source`: where the thing is found in the period's books, or "judgement".
things:
  # -- the guns (package 70; spec M7 §8, §9) ---------------------------------------------
  - id: gun_dismounted
    words: ["{gun} is found dismounted", "{gun} found dismounted", "{gun} dismounted"]
    source: Douglas 1820, part I (a gun dismounted by shot, or by its own recoil when the breeching parts); judgement
    report: "The gunner reports {gun} dismounted: the carriage broken under it, the gun on the deck; it is out of the bill until the carpenter can get it up again."
    effect: {gun_dismounted: true}
    plausible_when: {under_fire: true}
    doubt: "nothing has struck {gun}: no shot has come aboard in the last ten minutes, and a gun does not leave its carriage of itself"
    harm: none
  - id: cartridges_damp
    words: ["the cartridges found damp", "the cartridges are found damp", "a quarter of the cartridges found damp", "the powder found damp"]
    source: the gunner's survey of the magazine (Steel 1794, the gunner's duty); the logs' "found the powder damp" after a leak or a shot hole by the magazine; judgement for the share
    report: "The gunner reports a quarter of the cartridges damp in the magazine, the powder caked; he has struck them off and will dry what he can when the galley fire is lit again."
    effect: {cartridges_damp: 0.25}
    doubt: "the magazine is dry: no water in the well above a foot and no shot hole by it; damp cartridges want one or the other (enter it again with a reason, and it is done)"
    plausible_when: {well_above: 0.3}
    harm: none
  # -- the spars, the sails and the rigging ---------------------------------------------
  - id: spar_sprung
    words: ["{spar} is found sprung", "{spar} found sprung", "{spar} sprung"]
    source: Falconer 1780, SPRUNG ("the state of a mast or yard when it is cracked or split by the violence of the wind")
    report: "The carpenter reports {spar} sprung: it will not bear a press of sail, and he asks that it be fished when the weather serves."
    effect: {spar_condition: 30}
    plausible_when: {strained: 0.6}
    doubt: "nothing has strained {spar}: she has carried no press of sail in the last watch, and a spar does not spring of itself in a steady breeze"
    harm: none
  - id: spar_rotten
    words: ["{spar} is found rotten", "{spar} found rotten", "{spar} found decayed"]
    source: Falconer 1780, ROTTEN; the carpenter's survey of the masts and yards (Steel 1794, the carpenter's duty); judgement for the figure
    report: "The carpenter reports {spar} rotten under the paint: sound to the eye, soft to his knife a foot deep. He would have it eased of a press of sail until a new one can be got."
    effect: {spar_condition: 50}
    state: rotten
    doubt: "a spar's rot is the carpenter's finding at any survey"
    harm: none
  - id: sail_mildewed
    words: ["{sail} is found mildewed", "{sail} found mildewed", "{sail} found rotten with mildew"]
    source: Falconer 1780, MILDEW; canvas furled wet in warm weather (Kipping 1847, the care of sails); judgement for the figure
    report: "The sailmaker reports {sail} mildewed in the folds where it was furled wet: the cloth is tender, and he would not trust it in a fresh breeze."
    effect: {sail_condition: 45}
    state: mildewed
    plausible_when: {days_out: 7}
    doubt: "she sailed within the week: canvas does not mildew so soon"
    harm: none
  - id: sail_chafed
    words: ["{sail} is found chafed", "{sail} found chafed", "{sail} chafed through"]
    source: Falconer 1780, CHAFE; the sail against the stays and the tops in a sea
    report: "The sailmaker reports {sail} chafed nearly through where it works against the rigging: it wants a patch, and will not bear much until it has one."
    effect: {sail_condition: 40}
    state: chafed
    plausible_when: {sea_above: ["smooth", "a smooth sea", "calm"]}
    doubt: "she lies easy on a smooth sea: canvas chafes when she rolls and works"
    harm: none
  - id: line_chafed
    words: ["{line} is found chafed", "{line} found chafed", "{line} found stranded"]
    source: Falconer 1780, STRANDED ("the state of a rope when one of its strands is broken"); CHAFE
    report: "The boatswain reports {line} chafed and a strand gone: it will hold for now, but not a heavy strain, and he asks leave to reeve a new one."
    effect: {line_condition: 35}
    state: chafed
    plausible_when: {strained: 0.6}
    doubt: "nothing has strained {line}: she has carried no press of sail in the last watch, and a rope does not strand at its ease"
    harm: none
  - id: cable_chafed
    words: ["{anchor} cable is found chafed", "{anchor} cable found chafed", "{anchor} cable found chafed in the hawse", "{anchor} cable chafed in the hawse"]
    source: Falconer 1780, CHAFE and SERVICE (the cable served in the hawse against it); a rocky road
    report: "The boatswain reports {anchor}'s cable chafed in the hawse and on the ground: the service is gone through and the strands are showing. It may not hold her in a blow."
    effect: {cable_condition: 40}
    state: chafed
    plausible_when: {at_anchor: true}
    doubt: "she rides at no anchor: a cable stowed in the tier does not chafe"
    harm: none
  - id: spare_canvas_mildewed
    words: ["the spare canvas is found mildewed", "the spare canvas found mildewed", "mildew found in the sail room", "the sail room found damp"]
    source: Falconer 1780, MILDEW; the sail room's stowage (Steel 1794); judgement for the figure
    report: "The sailmaker reports mildew in the sail room: the spare canvas was stowed damp, and the worst of it is tender."
    effect: {spare_sails_condition: 60}
    plausible_when: {days_out: 10}
    doubt: "she sailed within ten days, the spare canvas aired and dry: mildew wants longer"
    harm: none
  - id: cordage_spoiled
    words: ["rats found at the cordage", "the spare cordage found rotten", "the spare rope found rotten"]
    source: the boatswain's store; judgement for the share
    report: "The boatswain reports the spare cordage in his store gnawed and rotten in the coils: a quarter of it will not serve."
    effect: {cordage_share: 0.25}
    harm: none
  # -- the water and the provisions -------------------------------------------------------
  - id: cask_stove
    words: ["a cask found stove", "a cask is found stove", "a water cask stove", "a cask stove"]
    source: Falconer 1780, STOWAGE; the ground tier of the hold
    report: "The cooper reports a water cask stove in the ground tier: a ton of water lost to the bilge."
    effect: {water_tons: 1.0}
    plausible_when: {sea_above: ["smooth", "a smooth sea", "calm"]}
    doubt: "she lies easy on a smooth sea: nothing has started a cask in the tier"
    harm: none
  - id: casks_leaking
    words: ["the leaguers found leaking", "the water casks found leaking", "the casks found leaking", "the ground tier found leaking"]
    source: Falconer 1780, LEAGUER (the largest cask, stowed in the ground tier); the cooper's duty; judgement for the share
    report: "The cooper reports the leaguers in the ground tier leaking at the chimes where she has worked them: a good part of the water is in the well."
    effect: {water_share: 0.15}
    plausible_when: {sea_above: ["smooth", "a smooth sea", "calm"]}
    doubt: "she lies easy on a smooth sea: the casks have not been worked"
    harm: none
  - id: water_foul
    words: ["the water is found foul", "the water found foul", "the water foul"]
    source: the purser's casks; Regulations and Instructions 1806, the Purser
    report: "The purser reports the water in the ground tier foul: the hands turn from it, and he asks that she water at the first port."
    effect: {water_foul: true}
    plausible_when: {days_since_watered: 5}
    doubt: "she watered within the week: casks do not foul in five days"
    harm: none
  - id: water_brackish
    words: ["the water is found brackish", "the water found brackish"]
    source: watering from a stream near its mouth, where the tide reaches (Falconer 1780, WATERING-PLACE); judgement
    report: "The purser reports the last water brackish, taken too near the stream's mouth: the hands drink it and are the worse for it."
    effect: {water_foul: true}
    doubt: "brackish water is the watering-place's, found at the first taste"
    harm: none
  - id: bread_spoiled
    words: ["the bread is found damp", "the bread found damp", "the bread found mouldy", "the biscuit found mouldy", "the bread room found damp"]
    source: the bread room, lined against the damp (Steel 1794); Regulations and Instructions 1806, the Purser (the survey of provisions); judgement for the share
    report: "The purser reports the bread room damp and a part of the biscuit mouldy: what is spoiled goes over the side, and he asks for a survey."
    effect: {provisions_share: 0.08}
    plausible_when: {days_out: 7}
    doubt: "she was victualled within the week: the biscuit does not mould so soon"
    harm: none
  - id: meat_rotten
    words: ["a cask of beef found rotten", "a cask of pork found rotten", "a cask of meat found rotten", "the beef found rotten", "the pork found rotten"]
    source: Regulations and Instructions 1806, the Purser (provisions condemned by survey); judgement for the share
    report: "The cook reports a cask of the salt meat rotten when it was broached: it stinks, and the purser has it condemned and over the side."
    effect: {provisions_share: 0.04}
    plausible_when: {days_out: 10}
    doubt: "she was victualled within ten days: the casks were sound when they came aboard"
    harm: none
  - id: rats_in_the_bread_room
    words: ["rats found in the bread room", "rats in the bread room", "rats found at the bread"]
    source: the period's every ship; judgement for the share
    report: "The purser reports the rats got into the bread room: bags gnawed and a good deal of the bread fouled."
    effect: {provisions_share: 0.03}
    harm: none
  - id: weevils
    words: ["weevils found in the biscuit", "the biscuit found full of weevils", "the bread found full of weevils"]
    source: the period's every ship
    report: "The cook reports the biscuit full of weevils: the hands knock it on the table before they eat it, as they always have."
    effect: {report_only: true}
    unmodelled: "the biscuit is eaten as it is; nothing of the people's temper is modelled yet"
    harm: none
  # -- the cargo -------------------------------------------------------------------------
  - id: cargo_wet
    words: ["the {good} is found wet", "the {good} found wet", "the {good} found damaged by the bilge water", "{good} found spoiled"]
    source: Falconer 1780, BILGE-WATER; the merchant's damage by sea water (judgement for the share)
    report: "The mate reports bilge water got up into the {good} where she has been working: a part of it is spoiled past selling."
    effect: {cargo_share: 0.1}
    cause: "found damaged by the bilge water"
    plausible_when: {sea_above: ["smooth", "a smooth sea", "calm"]}
    doubt: "she lies easy on a smooth sea: the bilge has not been up into the hold"
    harm: none
  # -- the instruments --------------------------------------------------------------------
  - id: chronometer_stopped
    words: ["the chronometer is found stopped", "the chronometer found stopped", "the chronometer stopped"]
    source: the marine chronometer's sensitivity to a shock (`docs/design/Navigation1805.md`); judgement
    report: "The master reports the chronometer stopped in its box: a heavy sea has jarred it. He has it wound and will set it going by the account, which is no Greenwich time."
    effect: {chronometer_stopped: "stopped by a jar in a heavy sea"}
    plausible_when: {sea_above: ["smooth", "a smooth sea", "calm", "moderate", "a moderate sea"]}
    doubt: "she lies easy in no more than a moderate sea: nothing has jarred the chronometer in its box"
    harm: none
  - id: glass_broken
    words: ["the glass is found broken", "the glass found broken", "the barometer found broken"]
    source: the marine barometer's tube, hung in gimbals (`docs/design/WeatherSystems.md`); judgement
    report: "The master reports the glass broken: the tube cracked in its gimbals and the mercury run out. There is no glass aboard now."
    effect: {glass_broken: true}
    plausible_when: {sea_above: ["smooth", "a smooth sea", "calm", "moderate", "a moderate sea"]}
    doubt: "she lies easy in no more than a moderate sea: nothing has thrown the glass in its gimbals"
    harm: none
  - id: compass_sticking
    words: ["the compass found sticking", "the compass is found sticking", "the binnacle compass found sticking"]
    source: Falconer 1780, COMPASS (the card hung on its pin); judgement
    report: "The master reports the binnacle compass card sticking on its pin: it lags when she comes round, and he has the spare compass got up."
    effect: {report_only: true}
    unmodelled: "nothing of the compass's error is modelled yet"
    harm: none
  # -- the hull ---------------------------------------------------------------------------
  - id: seam_working
    words: ["a seam found working", "a seam is found working", "a seam working", "she is found making water", "a leak found", "a leak is found"]
    source: "Falconer 1780, LEAK; the well sounded each watch; the rate judgement (a started seam a few tons an hour, which two hands at a brake pump hold; package 73, docs/design/Design-WaterAndHealth.md)"
    report: "The carpenter reports a seam working below the wale on the weather side, making water at some two tons an hour; the well is to be sounded every glass, and he asks for hands to caulk it."
    effect: {leak_tons_per_h: 2.0}
    plausible_when: {sea_above: ["smooth", "a smooth sea", "calm"]}
    doubt: "she has not been working in a sea: a seam opens under a labouring ship, not at her ease"
    harm: none
  # -- the people's health (package 73, spec M7 §16, §16a; item 8) ------------------------
  - id: man_taken_ill
    words: ["a man taken ill", "a man is taken ill", "a man fallen ill", "a man on the sick list", "a man down with the flux", "a man down with a fever"]
    source: "the sick lists of the period's ships (Trotter, Medicina Nautica; Blane): the flux and the fevers the sea's own; judgement"
    report: "The surgeon reports a man taken ill and put on the sick list: a fever, with the flux; he is in the sick berth and off the bill until it passes."
    effect: {sick_men: 1}
    cause: "a fever, with the flux"
    plausible_when: {days_out: 2}
    doubt: "she is not two days out: the fevers and the flux come with the days at sea and the water in the casks"
    harm: hurt
  - id: fever_in_the_ship
    words: ["the fever in the ship", "a fever in the ship", "the flux in the ship", "fever broken out", "the fever broken out", "the flux broken out", "the ship's fever"]
    source: "the fevers that went through a ship's company (Trotter, Medicina Nautica; the Mediterranean and West India stations' returns): a tenth down in a week; judgement"
    report: "The surgeon reports a fever broken out in the ship: a tenth of the people down with it in the sick berth, and he fears more; he asks for the sick berth to be aired and the decks washed with vinegar."
    effect: {sick_share: 0.1}
    cause: "the fever in the ship"
    plausible_when: {days_out: 7}
    doubt: "she is not a week out: a fever goes through a ship's company after weeks at sea, not days"
    harm: hurt
  - id: person_hurt
    words: ["{person} is hurt", "{person} hurt", "{person} is wounded", "{person} fallen down the hatchway", "{person} is down"]
    source: "the accidents of the sea (a fall down a hatchway, a block from aloft, a man thrown against a gun in a seaway; the surgeons' journals, from memory); judgement"
    report: "{person} is hurt: a fall down the hatchway in the seaway; he is bruised and cut about the head, and the surgeon has him."
    effect: {person_hurt: light}
    cause: "a fall down the hatchway"
    plausible_when: {sea_above: ["smooth", "a smooth sea", "calm"]}
    doubt: "a smooth sea and nothing working: a man is hurt by a fall in a seaway, by a block in a blow, or by the enemy's shot"
    harm: hurt
  - id: person_badly_hurt
    words: ["{person} is badly hurt", "{person} badly hurt", "{person} is dangerously hurt", "{person} is badly wounded"]
    source: "as person_hurt: the fall that breaks a man (judgement)"
    report: "{person} is badly hurt: a fall from the gangway to the deck below in the seaway, and the surgeon has him in the cockpit; it is a dangerous hurt."
    effect: {person_hurt: grave}
    cause: "a fall from the gangway"
    plausible_when: {sea_above: ["smooth", "a smooth sea", "calm"]}
    doubt: "a smooth sea and nothing working: a man is broken by a fall in a seaway, not at his ease"
    harm: hurt
  - id: surgeon_taken_ill
    words: ["the surgeon taken ill", "the surgeon is taken ill", "the surgeon fallen ill", "the surgeon is ill", "the surgeon down with a fever", "the doctor taken ill"]
    source: "the surgeons who took the fevers of their own sick berths (Trotter; the West India station's losses of surgeons, from memory); judgement"
    report: "The surgeon is taken ill with a fever and has put himself on his own list: his mates and the men's messmates dress the wounded until he is up."
    effect: {surgeon_sick: true}
    cause: "a fever"
    plausible_when: {days_out: 2}
    doubt: "she is not two days out: a surgeon takes the fever from his sick berth, which has had nobody in it"
    harm: hurt
  - id: bilge_foul
    words: ["the bilge found foul", "the bilge water found stinking", "the well found foul"]
    source: Falconer 1780, BILGE-WATER; the ship sweetened by pumping in fresh water (judgement)
    report: "The carpenter reports the bilge foul: the well stinks to the berth deck, and he asks that she be pumped out and sweetened."
    effect: {report_only: true}
    unmodelled: "nothing of the bilge or the people's health is modelled yet"
    harm: none
  # -- the hull's repair: the hotfix's two forms of 2026-10-21, kept as the director's causes
  # beside the carpenter's own work and the pumps (package 73, spec M7 §13: `stop the leak`
  # caulks the ground's leak and a started seam in the carpenter's hours, `plug the shot
  # holes` plugs them, `man the pumps` pumps her out), each with its doubt ----------
  - id: leak_stopped
    words: ["the leak found and stopped", "the leak stopped", "the leak fothered", "her strained seams caulked"]
    source: Falconer 1780, LEAK and FOTHERING; the carpenter's crew at the seams (Steel 1794, the carpenter's duty)
    report: "The carpenter reports the leak found and stopped: the seams she strained are payed and caulked, and the well gains no more from them."
    effect: {leak_stopped: true}
    plausible_when: {leaking: true}
    doubt: "she is making no water from the ground or a started seam: there is no leak to stop (a shot hole is the carpenter's plug: 'plug the shot holes')"
    harm: none
  - id: well_pumped
    words: ["the well pumped out", "the well pumped dry", "she is pumped out", "the ship pumped out"]
    source: Falconer 1780, PUMP; the hands at the chain pump until she sucks
    report: "The carpenter reports her pumped out: the hands were at the pumps until they sucked, and the well is dry."
    effect: {well_pumped: true}
    plausible_when: {well_above: 0, pumps_cannot: true}
    doubt: "the well is dry already, or she has pumps and hands to pump her out herself ('man the pumps' is the captain's order, and the pumps gain or lose by their rates)"
    harm: none
