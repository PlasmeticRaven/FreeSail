# Sail classes: how each kind of sail turns wind into force.
#
# Read by freesail/physics/sails.py once at import (spec §7.2). Owned by
# package 4; package 10 tunes the numbers against the known truths in §7.6.
#
# For every class:
#   alpha_deg      angles of attack (degrees) at which the curves are tabulated.
#                  The angle of attack is the angle between the apparent wind
#                  and the sail's chord (the yard of a square sail, the boom or
#                  foot of a fore-and-aft sail), folded into 0..90. 0 means the
#                  wind blows along the cloth (the sail shakes), 90 means it
#                  blows square onto it (the sail is a wall).
#   lift           C_L at each angle: force across the wind, the "pull" of a
#                  sail that is drawing. Piecewise linear between points.
#   drag           C_D at each angle: force along the wind, the "push".
#   luff_angle_deg below this angle of attack the sail luffs (shivers along
#                  the leech and gives nothing). Also used for the helm's
#                  "full and by": the ship's luffing angle is the chord angle
#                  plus this, for the sail that luffs first.
#   reef_factor    fraction of area lost per reef band taken.
#   furled_windage fraction of the area that still catches wind when the sail
#                  is furled on its spar (a rolled-up bundle, not cloth).
#   notes          why the numbers look the way they do.
#
# The values are package 10's tuning against the known truths (spec §7.6,
# docs/dev/TuningNotes.md). Every foot is dead below about ten degrees of
# attack: a coarse flax sail shakes there, which is what limits how close a
# ship can lie. Lift peaks at 1.12 (square, at 35°), 1.25 (gaff, at 30°) and
# 1.3 (jib-headed, at 28°), lower than §7.2's starting guesses, with drag from
# about 0.1 at 0° to 1.2 at 90°; the square sail's drag at its peak is 0.5, a
# baggy sail's. Square sails keep more lift at large angles, fore-and-aft
# sails less. These remain tuning values, not physics constants.

classes:
  square:
    # Milestone 3b: the curve's foot and peak moved five degrees up the angle of attack
    # (was 0, 10, 15, 20, 25, 30, 35, 45 ...; peak 1.12 at 35). Fincham's measured brace
    # limits (art. 102) let the yards lie sharper than milestone 2's, and on the old curve
    # the frigate held three knots at 52 off the wind, which Fincham's long ships never
    # did ("seldom within six points"). A square sail set at a small angle to the wind
    # luffs before it draws; this is the tuning that meets the record (TuningNotes, 3b).
    alpha_deg: [0, 15, 20, 25, 30, 35, 40, 45, 60, 75, 90]
    lift: [0.0, 0.0, 0.12, 0.42, 0.78, 1.02, 1.12, 1.02, 0.72, 0.40, 0.0]
    drag: [0.10, 0.12, 0.15, 0.22, 0.30, 0.40, 0.50, 0.68, 0.95, 1.14, 1.20]
    luff_angle_deg: 18
    reef_factor: 0.20
    furled_windage: 0.04
    notes: >
      A square sail is set on a yard and drives on either face, though only the
      after face drives forward. Braced up it works like a coarse wing; run
      square before the wind it is a wall and gives pure drag. It keeps more
      lift past the peak than a fore-and-aft sail because the belly of the
      sail carries the flow.

  gaff:
    alpha_deg: [0, 10, 15, 20, 25, 30, 40, 50, 60, 75, 90]
    lift: [0.0, 0.0, 0.25, 0.75, 1.15, 1.25, 1.0, 0.72, 0.5, 0.25, 0.0]
    drag: [0.08, 0.10, 0.13, 0.18, 0.24, 0.32, 0.50, 0.70, 0.90, 1.10, 1.20]
    luff_angle_deg: 10
    reef_factor: 0.25
    furled_windage: 0.06
    notes: >
      A four-sided fore-and-aft sail on a gaff, with or without a boom. It
      points well and pulls hard at a sharp angle but stalls past 30°. Eased
      right off before the wind it gives drag only, which is why it should be
      squared off to 70° or more on a run.

  jibheaded:
    alpha_deg: [0, 8, 12, 18, 22, 28, 35, 45, 60, 75, 90]
    lift: [0.0, 0.0, 0.15, 0.6, 0.95, 1.3, 1.2, 0.9, 0.5, 0.22, 0.0]
    drag: [0.06, 0.08, 0.10, 0.14, 0.18, 0.24, 0.34, 0.55, 0.88, 1.10, 1.20]
    luff_angle_deg: 12
    reef_factor: 0.30
    furled_windage: 0.03
    notes: >
      Triangular sails on a stay or hoisted to a masthead: jibs, staysails,
      gaff topsails. The most efficient cloth aboard for its size, and the
      first to shake when the ship is pinched. Their pull is well forward,
      which is why taking them in gives weather helm.

  lug:
    alpha_deg: [0, 10, 15, 22, 28, 35, 45, 60, 75, 90]
    lift: [0.0, 0.0, 0.3, 0.85, 1.15, 1.2, 0.95, 0.65, 0.36, 0.0]
    drag: [0.10, 0.12, 0.16, 0.24, 0.34, 0.46, 0.64, 0.90, 1.12, 1.20]
    luff_angle_deg: 18
    reef_factor: 0.25
    furled_windage: 0.06
    notes: >
      A lugsail is a square sail's cousin set fore-and-aft on a yard slung
      off-centre. It behaves between the two: nearly as weatherly as a gaff
      sail, and it holds its lift a little longer when eased.

  lateen:
    alpha_deg: [0, 10, 15, 22, 28, 35, 45, 60, 75, 90]
    lift: [0.0, 0.0, 0.3, 0.8, 1.1, 1.15, 0.95, 0.65, 0.36, 0.0]
    drag: [0.10, 0.12, 0.17, 0.25, 0.35, 0.48, 0.66, 0.92, 1.12, 1.20]
    luff_angle_deg: 18
    reef_factor: 0.25
    furled_windage: 0.08
    notes: >
      A triangular sail on a long yard peaked up sharply. Weatherly for its
      age and forgiving when eased; the long yard is heavy, so the furled
      bundle catches more wind than most.

  sprit:
    alpha_deg: [0, 12, 18, 25, 30, 40, 50, 60, 75, 90]
    lift: [0.0, 0.0, 0.35, 0.85, 1.05, 1.0, 0.75, 0.5, 0.25, 0.0]
    drag: [0.10, 0.13, 0.18, 0.26, 0.34, 0.52, 0.72, 0.92, 1.12, 1.20]
    luff_angle_deg: 18
    reef_factor: 0.25
    furled_windage: 0.06
    notes: >
      A four-sided sail held out by a diagonal sprit. Baggier and less
      efficient than a gaff sail, and it luffs earlier, but it needs no boom.

  studding:
    alpha_deg: [0, 10, 18, 25, 30, 35, 45, 60, 75, 90]
    lift: [0.0, 0.0, 0.16, 0.76, 1.19, 1.35, 1.21, 0.86, 0.49, 0.0]
    drag: [0.12, 0.14, 0.2, 0.3, 0.4, 0.5, 0.72, 1.0, 1.18, 1.25]
    luff_angle_deg: 18
    reef_factor: 0.0
    furled_windage: 0.0
    notes: >
      Light extra sails boomed out beyond the yardarms in fair weather. They
      hang from their parent yard's angle, so they trim as it does. Light
      cloth set flat in clear air beyond the yardarms: the peak is tuned
      above the square sail's (package 10, truth 14: the frigate's studding
      sails add 15 per cent on a broad reach in ten knots; the lee side's
      are blanketed by the weather side's), and they drag more. Nothing
      useful close-hauled. They are stowed inboard when not set, so no
      windage.

# Windage: what the wind pushes on that is not a drawing sail (spec §7.5 and
# the SailForces contract). Fractions of a sail's area by state, except that
# "furled" uses the class's furled_windage above. A wreck (a sail on a spar
# that has carried away) counts three times its furled windage.
windage:
  states:
    in_the_gear: 0.15      # hauled up in the clewlines and buntlines, bagging
    loosed: 0.25           # hanging loose, flogging
    sheeted: 0.40          # sheets home but not hoisted or not drawing
    blown_out: 0.05        # tatters on the bolt-ropes
  spar_area_factor: 0.025  # drag area of a spar and its rigging = factor * length^2
  spar_drag_coefficient: 1.0
  wreck_multiplier: 3.0
