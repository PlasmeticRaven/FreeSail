# FreeSail: the world's business (spec M6 §19, "the world generates the business: the small
# step now, the loop later"; package 43b). Read by freesail/world/business.py when a
# scenario says `business: on` (or a density); the recorded passages say `off` and are
# sailed by their own named ships, so that they pin. Every figure here is JUDGEMENT on the
# period's traffic, said so; the ships' names are the common names of their nations'
# merchant lists of the war, from memory.
#
# What is drawn, under the seed (the World's `business` stream, apart from every other):
# the trade of the ports of the region in play, a cargo carried from a port where its price
# is low to one where it is high (the ports' own market tables, `data/ports/*.yaml`, as of
# the day), under a flag the port of destination will take; the fishermen on the grounds
# of the coast's features (a bottom or a bank the lead finds at sea, worked from the
# nearest port that sells fish), a smack or a lugger; the cruisers of the nations at war
# on the stations the cruiser's doctrine names (`data/captains/cruiser.yaml`, `stations:`);
# each with an intent and a captain of her own (package 43's brains), at the chart's edges
# coming in and in the ports, and leaving at the edges or going in when her business is
# done. No supply and demand: what the ships carry moves no price (a later milestone's).

# The population of a region the size of the western Channel (four degrees by three) at
# density 1, the scenario's `business: on`; a density scales every figure (judgement: the
# Channel's traffic of a summer day as the recorded passages' dozen sketched it, the
# coasting trade and the fishermen thinner in war).
population:
  traders_in_port: 3      # merchantmen lying in the region's ports at the start, bound away
  traders_at_sea: 3       # merchantmen at the edges, coming in for a port of the region
  fishermen: 4            # smacks and luggers on the grounds or bound for them
  cruisers_per_side: 1    # a cruiser of each nation at war on a station of her own
  # package 72 (spec M7 §22; data/regimes.yaml): the convoys of the nations that convoy
  # (four to eight sail under an escort, the Channel's coasting convoys; judgement), and
  # the blockades the nations' knobs name are drawn whole (`naval.blockades`), each once
  convoys: 1
# package 72 (the owner's requirement of 2026-10-17): the business follows the player's
# ship across the regions, and a ship beyond the region's edge is put out of the world
# only when she is bound away AND farther than this from the player's ship (or a set of
# hers is): beyond the horizon and a watch's sailing (judgement)
carry_over_nm: 30
# A ship arrives at an edge, bound in, or sails from a port, bound away, by the draw once
# an hour with these chances at density 1 (judgement: about six traders and two fishermen
# a day across the region), so long as the region holds fewer than `most_ships`.
arrivals_per_hour:
  trader: 0.25
  fisherman: 0.08
most_ships: 16

# A cargo is carried where its price at the destination is this many times its price at
# the port it was bought in or more (the ports' tables as of the day); the trader carries
# from forty to the most her hold takes, in tons (judgement).
price_ratio_least: 1.3
cargo_tons: [30, 120]
# The share of the traders drawn in port that load for a market beyond the region (the
# ocean trade, Lisbon's and the Americas'), outward bound: she sails for a mark beyond an
# edge open to the sea and leaves the region there (judgement: a third).
outward_bound_share: 0.34
# Her wait in port before she sails (package 43's `IN_PORT_WAIT_S`, twelve hours, is the
# brains'; a ship drawn in port at the start has had part of it): judgement.
in_port_hours_drawn: [1, 11]
# Package 84, step 4 (the owner's decision 5, docs/DesignProposal.md decision 53): a trader
# of the business or of a scenario that reaches her port with a trade intent transacts
# there instead of vanishing: her cargo sold to the port's market (each ton lowering the
# price by SUPPLY_PER_TON, freesail/world/ports.py, the market's own rule), a return cargo
# bought where a route worth carrying runs from that port (`price_ratio_least`), and she
# sails again with it; with no route worth it she sails home empty, and with no home she is
# gone from the sea as before. `false` keeps package 43's wait-and-vanish.
transact: true

# A fishing ground: a feature of the chart of kind `bottom` or `bank` with a sounding of so
# many fathoms, so far from the coast, and a port within reach that sells fish (pilchards,
# fish, cod) to be her home; a trip of so many hours on the ground (Holdsworth 1874 pp. 137
# to 139: a shot of the lines and the hauling, a tide or two; the trawl smacks out for days).
# Package 56: the grounds' tables of data/fishing/ name each ground's season, fish and
# yield, and the fish quays' prices are data/fishing/fish.yaml's; a ground the tables do
# not name keeps the default there.
fishing:
  depth_fathoms: [10, 80]
  off_the_coast_nm: 2
  home_within_nm: 45
  trip_hours: [8, 30]
  goods: [fish, pilchards, cod, herring, sardines, mackerel]

# The hull a trader of each nation is drawn from, in turn under the seed (judgement: the
# French coasting trade in chasse-marées, the British in brigs and schooners, the Americans
# in schooners, the Danes in brigs).
trader_kinds:
  britain: [merchant brig, schooner, merchant brig]
  france: [lugger, lugger, schooner]
  spain: [merchant brig, lugger]
  united-states: [schooner, schooner, merchant brig]
  denmark: [merchant brig]
  portugal: [merchant brig, schooner]
  default: [merchant brig]
# The neutral flags a cargo for an enemy's port is carried under (judgement: the Americans
# and the Danes carried most of the neutral trade of 1805).
neutrals: [united-states, denmark, portugal]
# A fisherman of each nation: Brixham's trawl smacks, Cornwall's luggers, Brittany's
# chasse-marées (judgement).
fisher_kinds:
  britain: [smack, smack, lugger]
  france: [lugger]
  default: [smack]

names:
  britain: [Betsey, Nancy, Two Brothers, Mary, Friendship, Industry, Endeavour, Hope, Fortitude, Providence, Polly, Sally, Brothers, Union, Ann, Liberty, Diligence, Good Intent, Prosperous, Speedwell]
  france: [Saint-Pierre, Bonne-Mère, Marie-Anne, Deux-Frères, Notre-Dame-de-Bon-Secours, Jeune-Henriette, Espérance, Sainte-Anne, Saint-Yves, Aimable-Rose, Hirondelle, Saint-Guénolé]
  spain: [San José, Nuestra Señora del Carmen, San Antonio, Santa Rosa, La Esperanza]
  united-states: [Polly, Hannah, Sally, Two Sisters, Commerce, Enterprise, Lydia, Eliza, Rising Sun, Columbia]
  denmark: [Anna Maria, Fortuna, Haabet, Christiane, Frederik, Twende Brødre]
  portugal: [Bom Jesus, Nossa Senhora da Conceição, São Pedro, Esperança]
  default: [Fortune, Hope, Endeavour]

# The cruisers' names (judgement, names of the period's lists not taken by a recorded
# passage's own ships: the Harpy, the Palinure and the Renard are theirs).
cruiser_names:
  britain: [Cruizer, Snake, Busy, Fly, Scorpion, Rattler, Sparrowhawk, Cygnet, Nimble, Active]
  france: [Bayonnaise, Vigilante, Diligente, Sans-Souci, Général-Ernouf, Brave, Hasard, Vengeur]

# The rumours of the quay (the owner's note 24): the boat sent ashore for the prices brings
# back two or three words of prices high or low at the ports the market knows (the ports of
# the region and those within `rumour_within_nm`), drawn from those ports' own tables, true
# as of the day, said as rumour; a price is told when it is this far from the port's own.
rumours:
  within_nm: 250
  how_many: [2, 3]
  ratio: 1.3

# Package 74 (spec M7 §18 and §20; docs/design/Design-Prizes.md §5): the prize court and the
# money. Every figure's source stands beside it; a figure FROM MEMORY is so marked for the
# owner's references through the lead (the lead's ruling 3 of 2026-11-07).
prize_values:
  # the hull's price a ton burthen by her kind, worn by age; the guns by the hundredweight
  merchant_hull_pounds_per_ton: 8.0     # FROM MEMORY of the Lloyd's sales of prizes in the war years; unverified
  man_of_war_hull_pounds_per_ton: 12.0  # FROM MEMORY of the Navy Board's purchases of prizes; unverified
  wear_per_year: 0.02                   # two per cent a year from her build year (judgement)
  age_years_unknown: 10                 # a file with no build year is taken as ten years old (judgement)
  guns_pounds_per_cwt: 4.0              # the Ordnance's price of iron; FROM MEMORY, unverified
  worth_least_pounds: 400.0             # under it a prize is not worth her prize crew (the design's §2.7; judgement)
prize_courts:
  # the court sits where she is brought in, in so many days (the Vice-Admiralty courts'
  # summary condemnations of the war; the High Court's months are not modelled: judgement)
  britain: {days: 7, name: "the Vice-Admiralty court", home_name: "the High Court of Admiralty", source: "the Vice-Admiralty courts' summary condemnations of the war; the names from the period's usage, FROM MEMORY"}
  france: {days: 7, name: "le Conseil des prises", source: "the period's usage, FROM MEMORY"}
  spain: {days: 10, name: "el Tribunal de presas", source: "judgement; decision 64's row; the name from the period's usage, FROM MEMORY"}
  default: {days: 7, name: "the prize court", source: "judgement"}
prize_money:
  agent_share: 0.05          # the prize agents' five per cent; FROM MEMORY, unverified
  court_fees_pounds: 20.0    # a sentence's fees; judgement
  head_money_pounds: 5.0     # a head of the men aboard a ship of war or a privateer at the start of the engagement; the Prize Acts' figure FROM MEMORY, unverified
  costs_share: 0.1           # costs and damages against the captor for a neutral wrongly taken: a tenth of her valuation; FROM MEMORY of the Admiralty court's awards, unverified
  salvage_share: 0.125       # an eighth to the recaptors of a ship of their own nation retaken; FROM MEMORY, unverified
  purchase_for_the_service: true   # a King's ship's prize of war taken up by the yard: three fourths now, a fourth with a later sentence (the Regulations, the Captain, art. XXXI, on file)
  reserved_share: 0.25
  # the sharing among all the ships in sight at the moment the enemy surrendered, a ship that
  # took no part included (Lavery, Nelson's Navy, p. 116: the sharing; the division among them
  # by their complements is judgement, FROM MEMORY of the period's practice, the source gives
  # the sharing and not the division)
  in_sight_shared: true
  in_sight_division: complements
prize_shares:
  # the eighths by date, the scheme in force at the court's date read. The classes and the
  # figures of the two British schemes are CONFIRMED by Lavery, Nelson's Navy: The Ships, Men
  # and Organization, 1793-1815, p. 116 (the book's words are not copied here); the shares
  # within the petty officers' and the crew's half from 1808 are not in that source and stay
  # FROM MEMORY. Lavery notes special rules for captures by small ships or ships with reduced
  # crews: not modelled.
  - nation: britain
    from: 1708-01-01
    until: 1808-01-01
    source: "Lavery, Nelson's Navy, p. 116 (the Act of 1708, 6 Anne c. 13, in force in 1805)"
    classes:
      - {name: "the captain", share: 0.375, note: "three eighths; one of them to the flag officer when he sails under an admiral's orders, kept under orders direct from the Admiralty (not modelled: no flag)"}
      - {name: "the captains of marines and of land forces, the sea lieutenants and the masters", share: 0.125, note: "one eighth, divided equally among them"}
      - {name: "the lieutenants and quartermasters of marines, the officers of land forces, the boatswain, the gunner, the purser, the carpenter, the master's mates, the surgeons and the chaplains", share: 0.125, note: "one eighth"}
      - {name: "the midshipmen, the surgeon's mates, the sergeants of marines and the petty officers", share: 0.125, note: "one eighth"}
      - {name: "the crew and the marines", share: 0.25, note: "the remaining quarter"}
  - nation: britain
    from: 1808-01-01
    until: 1900-01-01
    source: "Lavery, Nelson's Navy, p. 116 (the Order in Council of 1808)"
    classes:
      - {name: "the captain", share: 0.25, note: "two eighths; a third of it to the flag officer where there is one (not modelled: no flag)"}
      - {name: "the commissioned officers' class", share: 0.125, note: "one eighth, as before"}
      - {name: "the warrant officers' class", share: 0.125, note: "one eighth, as before"}
      - {name: "the petty officers and the crew", share: 0.5, note: "four eighths between them; the shares within that half are not in the source and stay FROM MEMORY: the midshipmen and the principal petty officers four shares and a half each, the able seamen three, the ordinary two, the landsmen and the boys one"}
  - nation: privateer
    from: 1700-01-01
    until: 1900-01-01
    source: "FROM MEMORY of the Channel privateers' articles, unverified: the owners and the crew by halves"
    classes:
      - {name: "the owners", share: 0.5, note: "by the articles"}
      - {name: "the crew", share: 0.5, note: "by the articles, among them by their shares"}
  - nation: france
    from: 1700-01-01
    until: 1900-01-01
    source: "the French distribution not read; the British eighths of the date kept until a source is (decision 64: the row present and honest)"
    classes: british
  - nation: spain
    from: 1700-01-01
    until: 1900-01-01
    source: "the Spanish distribution not read; the British eighths of the date kept until a source is (decision 64: the row present and honest)"
    classes: british
