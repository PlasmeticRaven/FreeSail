# FreeSail: the regimes of a nation's ships (spec M7 §22; package 72;
# docs/design/Design-Squadrons.md). Read by freesail/world/regimes.py and the world's
# business (freesail/world/business.py): a ship of a nation is in port, in ordinary, on
# station, on passage, in convoy or escorting, on blockade, in chase, each a few rules in
# data. Package 72 wrote the shape and the first of each; package 79a sourced them. The
# nations' knobs (who keeps the sea, who keeps port and slips out when the blockade is blown
# off, who convoys, whose privateers chase what pays) are each nation's `naval:` entry in
# data/nations.yaml.
#
# Package 79a (spec M7 §22; the brief's item 1): every knob read against the period's books
# in the references (docs/references/README.md) and its `source:` written by work, volume
# and page where one was found; where none was, the figure stays and its source says
# "judgement" plainly with what was looked for. NO FIGURE MOVED: where a source gives a
# different figure it is written beside the knob as "the source gives N; kept at M until
# re-measured", for the lead to rule. The works, as cited:
#   James — William James, *The Naval History of Great Britain*, the 1837 edition in six
#     volumes (the printings of 1886 and 1902), vol. and printed page;
#   Nicolas — *The Dispatches and Letters of Nelson*, ed. Nicolas, 1845, vol. and page;
#   Niles — *Niles' Weekly Register*, Baltimore, vols. VI to VIII (1814 to 1815);
#   the Regulations 1806 — the Admiralty's *Regulations and Instructions relating to His
#     Majesty's Service at Sea* (1806; the 1808 printing), page;
#   Falconer 1780 — *An Universal Dictionary of the Marine*, by entry.
# Mahan (*The Influence of Sea Power upon the French Revolution and Empire*), on whom 72's
# sources leaned from memory, is not in the repository: what rested on him alone is said
# so. The convoy acts of 1798 and 1803 are named by none of the works held (James, Nicolas,
# Niles and Jackson searched for the acts, the bills and "without convoy").

regimes:
  in port:
    rule: "at anchor within the port's reach, her business the brains' wait (freesail/world/brains.py IN_PORT_WAIT_S); she sails when ready for sea"
    source: "spec M6 §4; package 43 (no figure: the brains' wait is theirs)"
  in ordinary:
    rule: "a hull in port with no company and no intent (`regime: in ordinary` on her entry, or the director's `ship \"X\": in ordinary at <port>`): she lies at the anchorage and sails for nothing until commissioned by the business (a nation that slips out when the blockade is blown off, with her `sortie`) or the director (`ship \"X\": commissioned for <intent>`), after the delay below"
    commission_delay_h: {value: [48, 120], source: "two to five days: a ship in ordinary wanted her company raised and her stores got in. The Regulations 1806 pp. 203 to 205 (the warrant officers of a ship in ordinary keep her store-rooms fit to receive her stores whenever she is put into commission, and get them aboard as expeditiously as may be) and pp. 74 to 75 (men lent by the port admiral to a ship newly commissioned that must be got ready for sea more expeditiously than her own men can); the Regulations give no days. Nicolas vol. 1 pp. 298 to 304: the Agamemnon 64 commissioned on 26 or 30 January 1793, her men raised at the Norfolk ports, down the Medway on 16 March, at the Nore by 18 April still short of a hundred, at Spithead on 28 April. The source gives some eleven to thirteen weeks from the commission to the sea; kept at two to five days until re-measured (judgement: the weeks of the record cut for play, for a ship whose company the business does not raise man by man)"}
    slip_out_clear_nm: {value: 15, source: "no enemy man of war within fifteen miles of the port's outer road for the minutes below, or on the port's blockade station (data/ports, `blockade_station`), and she slips out. James vol. 3 p. 311: the inshore frigates of August 1805 (the Indefatigable and the Niobe) reconnoitring the harbour from a station about four miles south by east of the Black Rocks; p. 312: the main body about three leagues south by west of Ushant, two frigates and a brig-sloop on the look-out in-shore; p. 314: a division out of Brest in December 1805 in the absence of the blockading fleet, retired into port. Both stations lie within the fifteen miles or the blockade station's six. No distance at which the French look-outs judged the offing clear is given in the works held: the fifteen miles judgement (looked for in James vols. 3 and 4 on Brest, Rochefort, Ferrol and Cadiz)"}
    slip_out_clear_minutes: {value: 60, source: "an hour of the offing clear, not a glance. The sorties James gives came on a clear offing with no hour told: Missiessy out of Rochefort on 11 January 1805 in the temporary absence of Graves (vol. 4 p. 79); Allemand out of the road of Aix on 16 July 1805, four days after Stirling raised the blockade by order (vol. 4 p. 47; five French ships seen getting under way as the blockaders disappeared from the coast, vol. 3 p. 368); the Glorioso out of Cadiz on 31 May 1805 finding a frigate and two brigs the only British force off it (vol. 3 p. 375); Allemand out of Rochefort in January 1808 seeing only a frigate and a brig off the port (vol. 4 p. 287). Judgement (looked for: an interval between the offing's clearing and the weighing, in James vols. 3 and 4)"}
    slip_out_wind_max_kn: {value: 22, source: "no sortie in more than a fresh breeze (the top of Beaufort's force 5): the gale that blows the blockade off keeps her in too, and she slips out when it moderates. James vol. 4 p. 287: Allemand out of Rochefort in January 1808 on a moderate breeze at north-east by north; vol. 4 p. 390: Willaumez out of Brest on 21 February 1809 after westerly gales had driven Gambier from his station; vol. 3 p. 170: in the south-westerly gales of Christmas 1803 the blockaders all retired to Plymouth and the French ready for sea made no attempt to sail. But vol. 3 p. 314: the division out of Brest on 13 December 1805 took advantage of a brisk gale from the north-east, a fair wind off the land, and vol. 4 pp. 119 to 120: French frigates out of Cadiz in February 1806 on a strong easterly that had driven the squadron west to Cape Santa Maria. The source gives a sortie in a strong fair wind from the land; kept at 22 knots from any quarter until re-measured (judgement)"}
    source: "Falconer 1780, ORDINARY (the warrant officers and a crew of labourers in charge of the ships laid up in the harbours by the royal dockyards); the Regulations 1806 pp. 110 to 113 (the guard ship's captain seeing the ships in ordinary keep a proper watch) and pp. 203 to 205; James vol. 3 pp. 311 to 314 and vol. 4 pp. 47, 79 and 287 for the sorties. Mahan on the blockade of Brest, from memory, is not in the repository"
  on station:
    intent: "keep the station off {place} within {nm} miles"
    book: squadron
    rule: "a cruiser or a King's ship on a station of her doctrine's (data/captains/cruiser.yaml `stations:`); a squadron on station a set under the squadron's book"
    source: "spec M6 §4; package 43b; Falconer 1780, CRUISE (the cruisers on their station traverse the sea backward and forward under an easy sail within a limited space; Falconer has no entry STATION)"
  on passage:
    intent: "bound for {place}"
    rule: "a ship on her way between ports alone, or a squadron on passage in line ahead"
    source: "spec M6 §4 (no figure)"
  in convoy:
    book: convoy
    formation: order of sailing
    size: {value: [4, 8], source: "a handful to a dozen sail; the ocean convoys of hundreds are beyond the cap. The convoys James and Niles number: eight merchant vessels for Newfoundland under the Wolverine, 1804 (James vol. 3 p. 259); six for Goree under the Lark, 1806 (vol. 4 p. 91); about fourteen from Honduras under the brig-sloop Frolic, 1812 (vol. 5 p. 389); ten from Gibraltar under the Armada 74 and a bomb, 1814 (Niles vol. VII p. 192); 23 from Cork for the West Indies, 1806 (James vol. 4 pp. 89 to 90); 25 or 30 from Archangel under two brig-sloops, 1813 (vol. 6 p. 70); 35 from Malta, 1805 (vol. 4 p. 13); 70 and 137 homeward from the Baltic, 1808 (vol. 4 pp. 368 to 369). No British coasting convoy of the Channel is numbered in the works held. The source gives six to 35 for the convoys under a sloop or frigates; kept at four to eight until re-measured (judgement: the cap's room for a convoy beside the region's trade)"}
    rule: "merchantmen of a nation that convoys sail as a set under an escort, in the order of sailing at the slowest ship's pace, reading the convoy book; the business draws them in port bound out or at an edge bound in"
    source: "the Regulations 1806 pp. 398 to 403, Convoys (art. I: the printed convoy instructions with the rendezvous and signals delivered to each master; art. II: the list of the ships on form No. 41; art. V: no more sail than lets the heaviest sailing ship keep company, the slowest ship's pace); Niles vol. VII p. 175 (masters prosecuted for quitting their convoy or sailing without it) and p. 285 (no vessel let cross the Irish Channel without convoy, 1814). The convoy acts of 1798 and 1803 are named by none of the works held (looked for in James, Nicolas, Niles and Jackson); from memory"
  escorting:
    intent: "convoy the trade from {a} to {b}"
    role: commodore
    escort: {value: brig-sloop, source: "a brig-sloop or a ship-sloop the escort of the smaller convoys James names: the ship-sloop Wolverine (vol. 3 p. 259), the ship-sloop Lark (vol. 4 p. 91), the brig-sloop Frolic (vol. 5 p. 389), two brig-sloops from Archangel (vol. 6 p. 70); frigates and a sloop for 23 sail to the West Indies (vol. 4 pp. 89 to 90); a 74 with frigates and sloops for the great fleets of 1814 (Niles vol. VI pp. 14 and 197). The brig-sloop as the sources give it for a convoy of a handful"}
    rule: "the escort is the set's commander with the commodore's doctrine: he does not leave the convoy to chase, covers a straggler, closes the convoy round him when an enemy is in sight (data/squadrons/convoy.yaml)"
    source: "the Regulations 1806 pp. 399 to 400, Convoys, art. IV: the officer in charge of a convoy is to consider the protecting of it as his most particular duty, and is never to chase himself; arts. VI and VII: he reports the masters who disobey and the ships that separate"
  on blockade:
    intent: "blockade {port}"
    book: blockade
    rule: "a squadron off an enemy's port, the inshore division on the port's approach and the main body in the offing (data/squadrons/blockade.yaml `inshore`, `offshore`), blown off to its lee rendezvous by a westerly gale and back when it moderates; the blockaded nation's ship in ordinary slips out when the offing is clear"
    source: "the blockade of Brest, 1803 to 1805: Cornwallis sailed from Cawsand Bay on 17 May 1803 to cruise off Ushant and watch the French in Brest (James vol. 3 p. 169); the blockading ships one and all retired to Plymouth and other ports in the south-westerly gales of Christmas 1803 and were back by 12 January (pp. 170 and 214); a gale drove the fleet from the coast on 11 April 1805 and Gardner regained his station with 17 sail on the 13th (p. 307); the inshore frigates four miles south by east of the Black Rocks and the main body three leagues south by west of Ushant in August 1805 (pp. 311 to 312); 22 months of the blockade kept, two winters among them (p. 307); westerly gales drove Gambier off Ushant in 1809 (vol. 4 p. 390). The source gives Plymouth and Cawsand Bay for the lee rendezvous where the book (data/squadrons/blockade.yaml, not this package's file) has Torbay, which none of James's pages on Brest in vols. 3 and 4 names; kept at Torbay until re-measured. Off Rochefort the blockaders put into Quiberon Bay in a south-westerly gale (vol. 4 p. 79); off Cadiz an easterly drove them west (vol. 4 pp. 119 to 120) and the westerlies' danger was of being forced into the Mediterranean (vol. 3 p. 380)"
  in chase:
    rule: "the state `chasing` by doctrine; a division detached in chase by the commander's signal (the ships pointed out to chase) and recalled (discontinue the chase), the set's divisions"
    source: "the 1799 book's signals for the chase and the recall, which is not among the works held (from memory); the Regulations 1806 pp. 399 to 400 forbid the convoy's escort to chase himself, which the escort's doctrine keeps; judgement (looked for: the chase's signals in the Regulations 1806 and Jackson's logs)"
