  # console and the server take `read the standing orders from <file>`, and the ship,
  # should it reach her, says so.
  read the standing orders from:
    synonyms: [load the standing orders from, read standing orders from]
    object: driver
    level: driver
  # Console and client control. If one of these reaches the ship, the
  # captain typed it at the wrong prompt; say so.
  hold:
    synonyms: [pause, stop the clock]
    object: driver
    level: driver
  go:
    synonyms: [resume, run]
    object: driver
    level: driver
  time:
    synonyms: [tick, speed up, slow down]
    object: driver
    level: driver

# ---------------------------------------------------------------------------
# Which evolution a level 1 sail verb starts, by sail class (spec §8.4).
# A class missing from a verb's list means the verb has no meaning for that
# class, and the order is rejected with the sentence in `refusals`.
# ---------------------------------------------------------------------------
evolutions:
  set:
    square: set_square
    gaff: set_gaff
    jibheaded: set_jibheaded
    studding: set_studding
    lug: set_lug
    lateen: set_lateen
    sprit: set_sprit
  take in:
    square: take_in_square
    gaff: take_in_gaff
    jibheaded: take_in_jibheaded
    studding: take_in_studding
    lug: take_in_lug
    lateen: take_in_lateen
    sprit: take_in_sprit
  furl:
    square: furl_square
  reef:
    square: reef_square
    gaff: reef_gaff
    bowsprit: reef_bowsprit  # package 32b: a cutter's running bowsprit, run in to its reef
  shake out:
    square: shake_out_square
    gaff: shake_out_gaff
  brace: brace
  square: brace
  back: brace
  tack ship: tack
  wear ship: wear
  heave to: heave_to
  fill away: fill_away
  # milestone 3b (spec 3b §6.3 and §6.4): any sail the ship's two rigs carry is bent from
  # and unbent to the sail room, storm canvas and the occasional sails among them
  bend:
    square: bend_sail
    gaff: bend_sail
    jibheaded: bend_sail
    studding: bend_sail
  unbend:
    square: unbend_sail
    gaff: unbend_sail
    jibheaded: unbend_sail
    studding: unbend_sail
  shift:
    square: shift_sail
    gaff: shift_sail
    jibheaded: shift_sail
    studding: shift_sail
    spar: shift_spar  # package 30b: any spar carried away, for a spare of its class
  cut away: clear_wreck
  send down: clear_wreck
  # a parted line rove afresh, or spliced (package 31b; the verb says which)
  reeve: reeve_line
  splice: reeve_line
  goose wing:
    square: goose_wing
  # rig out and rig in take a studding sail boom, or the studding sail on it; and a running
  # bowsprit (package 32b), rigged out to its full length or run in to its reef
  rig out:
    studdingsail_boom: rig_out_studdingsail_boom
    studding: rig_out_studdingsail_boom
    bowsprit: rig_out_bowsprit
  rig in:
    studdingsail_boom: rig_in_studdingsail_boom
    studding: rig_in_studdingsail_boom
    bowsprit: reef_bowsprit
  send down the topgallant masts: send_down_topgallant_masts
  sway up the topgallant masts: sway_up_topgallant_masts
  send down the topgallant yards: send_down_topgallant_yards
  cross the topgallant yards: cross_topgallant_yards
  strike the topmasts: strike_topmasts
  fid the topmasts: fid_topmasts
  box haul: boxhaul
  wear short round: wear_short_round
  box her off: box_off
  lie a try: lie_a_try
  scud: scud
  back and fill: back_and_fill
  loose sails to dry: loose_sails_to_dry
  furl all: furl_all
  # milestone 3b: the catharpins (one evolution per lower mast) and the bowlines
  # (one per bowline hauled out; letting go and easing one is done at the pin)
  swifter in the catharpins: swifter_in_catharpins
  ease the catharpins: ease_catharpins
  haul:
    bowline: haul_bowline
  # trim the <sail> (package 32e, spec M5 open item 13): a fore-and-aft sail's sheet worked
  # to the trim the wind wants, an evolution with hands and time; a square sail's yard is
  # braced (the `brace` evolution above)
  trim:
    gaff: trim_gaff_sheet
    jibheaded: trim_jib_sheet
    lug: trim_gaff_sheet
    lateen: trim_gaff_sheet
    sprit: trim_gaff_sheet

refusals:
  furl: "A {class} sail is not furled on its spar; take it in instead."
  reef: "The {name} has no reef bands; it is set whole or not at all."
  shake out: "The {name} has no reef bands; there is nothing to shake out."
  bend: "The {name} is a {class} sail; no rig in this milestone bends one."
  unbend: "The {name} is a {class} sail; no rig in this milestone bends one."
  shift: "The {name} is a {class} sail; no rig in this milestone bends one. Take it in instead."
  goose wing: "The {name} is a {class} sail; it has no clews to goose-wing. Only a course or a topsail is goose-winged."
  scandalise: "The {name} cannot be scandalised: the physics has no state for a gaff sail with its peak dropped yet, only set, reefed or taken in. Ease the sheet, reef it or take it in instead."

# How each class of sail is taken in, in the period word (Luce 1866, ch.
# XXIII; Luce 1884, ch. XXXIV). A take-in synonym listed here is refused for
# a sail whose class does not list it, with the first word that does. A
# `course` is a square sail on a lower yard. Synonyms not listed here at
# all ("take in", "douse", "hand") suit any sail.
# Package 37l: a jib and a studding sail (the water sail among them) come down by their
# halyards, and "lower" is said of them as of a gaff sail.
take_in_words:
  course: [haul up, clew up]
  square: [clew up]
  gaff: [brail up, brail in, haul up, lower]
  jibheaded: [haul down, lower]
  studding: [take in, haul down, lower]
  lug: [lower]
  lateen: [lower]
  sprit: [lower]

# ---------------------------------------------------------------------------
# Brace modes: the target brace angle for each word (spec §8.2). `limit`
# means the yard's own brace_limit; `aback` the limit for the other tack
# (the sail pressed against the mast); `wind` the best angle for the present
# apparent wind, as `trim the yards` finds it. Degrees here; radians inside.
# ---------------------------------------------------------------------------
brace_modes:
  sharp up: limit
  up: 30
  in: 15
  square: 0
  by the lifts: 0
  full: limit
  aback: aback
  sharp aback: aback
  abox: aback
  to the wind: wind
  # package 37p: braced about, the same angle on the other side ("brace about the head yards
  # sharp the other way", Steel 1794 vol. II); with a count of points, `in` and `up` are
  # reckoned from where the yards stand ("brace the fore yards in a point")
  about: about

# Modifiers a verb phrase carries in itself: "close reef" is "reef ...
# close", "haul aft" is "haul ... home", and "brace round" with nothing else
# said braces for the tack the wind is on. Keys are `Order.modifiers` keys.
phrase_modifiers:
  brace round: {round: true}
  close reef: {close: true}
  shake out the reefs in: {close: true}
  shake the reefs out of: {close: true}
  double reef: {reefs: 2}
  single reef: {reefs: 1}
  treble reef: {reefs: 3}
  haul aft: {home: true}
  haul home: {home: true}
  haul flat: {home: true}
  # milestone 3b: the head yards braced sharper than the after yards (Fincham art. 96)
  brace sharp up with the head yards sharper: {brace_mode: sharp up, head_sharper: true}
  brace sharp up head yards sharper: {brace_mode: sharp up, head_sharper: true}
  brace up with the head yards sharper: {brace_mode: sharp up, head_sharper: true}
  brace the yards sharp up with the head yards sharper: {brace_mode: sharp up, head_sharper: true}
  brace round with the head yards sharper: {round: true, head_sharper: true}
  trim sails with the head yards sharper: {head_sharper: true}
  trim sails head yards sharper: {head_sharper: true}
  trim the sails with the head yards sharper: {head_sharper: true}
  trim the yards with the head yards sharper: {head_sharper: true}
  trim the yards head yards sharper: {head_sharper: true}

# Words after a line's name that mean "all the way in": "haul the jib sheet
# aft", "haul the topsail sheets home".
haul_home: [home, aft, flat, flat aft, chock home, right home, hard in, flat in]

# ---------------------------------------------------------------------------
# Sides. `port` is accepted and echoed as larboard. `weather` and `lee`
# resolve from the current tack when the order is parsed.
# ---------------------------------------------------------------------------
sides:
  starboard: starboard
  stbd: starboard
  larboard: larboard
  port: larboard
  weather: weather
  windward: weather
  lee: lee
  leeward: lee
both_sides: [both sides, both, either side, on both sides]

# ---------------------------------------------------------------------------
# Other modifier words.
# ---------------------------------------------------------------------------
manner: [handsomely, roundly, cheerly, smartly, together]
a_little: [a little, a trifle, a bit]
# After a line's name, that it is rove again: "reeve the fore topsail sheet afresh" (31b).
afresh: [afresh, anew, again]
# After a sheet's name, the side it is hauled on (package 32e): "haul the jib sheet to
# windward" holds the sail aback on the weather side (Luce 1884, ch. XXXIV, 'Sloops', 'To
# Heave to'; Luce 1866, ch. XXIV, 'Tacking': "haul the spanker boom well over to the
# windward"); "to leeward" lets it lie to leeward again.
sheet_to:
  to windward: weather
  over to windward: weather
  well over to windward: weather
  to weather: weather
  to leeward: lee
  over to leeward: lee
reef_close: [close, close reefed, close reef, close reefs, all reefs]
tack_phrase: ["on the", "on", "to the"]   # "on the starboard tack", "to the starboard tack"
point_directions:
  "up": "up"
  "off": "off"
  to starboard: starboard
  to larboard: larboard
  to port: larboard
  to windward: up
  to leeward: "off"

# ---------------------------------------------------------------------------
# Numbers as words. Digits are also accepted.
# ---------------------------------------------------------------------------
numbers:
  a: 1
  an: 1
  one: 1
  two: 2
  three: 3
  four: 4
  five: 5
  six: 6
  seven: 7
  eight: 8
  nine: 9
  ten: 10
  eleven: 11
  twelve: 12
  sixteen: 16
  half: 0.5

# ---------------------------------------------------------------------------
# Generated-name rules (spec §6.5). A part id such as `fore.topsail.yard`
# becomes the phrase "fore topsail yard" (dots and underscores to spaces);
# then every word with an entry below also takes each of its alternatives,
# so "fore tops'l yard" and "fore topsl yard" are names too. Apostrophes are
# optional when matching, so the plain spellings need not be listed.
# ---------------------------------------------------------------------------
contractions:
  topsail: [tops'l, topsl, top sail]
  topgallant: [t'gallant, t'gan's'l, tgallant, topgallant sail, top gallant]
  topgallants: [t'gallants, t'gan's'ls, topgallant sails]
  royal: [royal sail]
  studdingsail: [stuns'l, stunsail, studding sail, stun'sail]
  studdingsails: [stuns'ls, stunsails, studding sails, kites]
  crossjack: [cro'jack, crojack]
  staysail: [stays'l, staysl, stay sail]
  staysails: [stays'ls, stay sails]
  forecourse: [fore course]
  course: [course]
  gaff_topsail: [gaff tops'l]
  spanker: [driver]
  halyard: [halliard, haulyard]
  # sides inside a name
  larboard: [port]
  fore: [fore]
  mizzen: [mizen, mizzen]
  jib: [jib]

# Segment words that are dropped when they sit between others in a line's
# name: `main.yard.brace.starboard` is "the main brace", not "the main yard
# brace" (though that is accepted too).
droppable_inner_words: [yard]

# ---------------------------------------------------------------------------
# Group evolutions: verb phrases that expand to a list of ordinary orders,
# given in the order a ship of the period would do them (Luce 1866, ch.
# XXIII). Each order is handled as if the captain had given it; an order
# whose object this ship does not have is passed over, so one list serves
# every rig. Orders that fail for another reason (a sail already set) are
# reported in the log line and the rest are still carried out.
# ---------------------------------------------------------------------------
group_evolutions:
  set plain sail:
    - set the plain sail
  # Package 32b: the cutter's square sail (Steel's "cross-jack") and her topgallant are
  # light canvas outside her plain sail (mainsail, foresail, jib and topsail); on the
  # other rigs both lines are passed over, the topgallants being plain sail already set
  # and the square sail no noun of theirs. The square sail is a fair-wind sail and comes
  # in with the studding sails when it freshens.
  make all sail:
    - set the plain sail
    - set the square sail
    - set the topgallants
    - set the royals
    - set the flying jib
    - set the staysails
    - set the gaff topsail
    - set the studdingsails, both sides
  shorten sail:
    - take in the studdingsails
    - take in the square sail
    - take in the royals
    - take in the flying jib
    - take in the topgallants
    - take in the gaff topsail
    - reef the topsails, one reef

# ---------------------------------------------------------------------------
# Hands selectors (spec M3 §5.1): which hands an order sets to work, said as
# "send the larboard watch aloft to furl the main course", "send the fore
# topmen to loose the fore topsail", or "... with the starboard watch" after
# any order that sets men to work. The request is filled from those hands
# only; a watch that is below is turned up for it. Each phrase names a watch
# (starboard, larboard) or a station of the ship file (fore_top, afterguard...).
# The names are the watch bill's (Luce 1884, ch. XX, 'Watch, Quarter and
# Station Bills').
# ---------------------------------------------------------------------------
hands_selectors:
  starboard watch: starboard
  larboard watch: larboard
  port watch: larboard
  forecastlemen: forecastle
  forecastle men: forecastle
  fore topmen: fore_top
  foretopmen: fore_top
  main topmen: main_top
  maintopmen: main_top
  mizzen topmen: mizzen_top
  mizen topmen: mizzen_top
  afterguard: afterguard
  afterguards: afterguard
  waisters: waisters
  marines: marines
  idlers: idlers
# Kinds of work by a noun, for `belay the reef` (package 29c): the noun and the verb
# whose evolutions it names. "Belay the reef in the mainsail" names its sail too.
work_nouns:
  reef: reef
  reefs: reef
  reefing: reef
  furl: furl
  furling: furl
  trim: trim
  bracing: brace
  tack: tack ship
  wear: wear ship
  bend: bend
  bending: bend
  shift: shift
  wreck: cut away
# Words between "send the ... " and the order: "aloft to", "forward to", "to".
send_directions: [aloft, up aloft, up, forward, aft, on deck, into the tops, into the rigging]

# ---------------------------------------------------------------------------
# Package 33c (the passage's words; playtests 12 and 13, decision 30). Everything in
# this block is new and nothing above it is changed: `freesail/orders/vocabulary.py`
# reads these keys after the ones above and never lets one of them take a phrase an
# earlier verb already has.
# ---------------------------------------------------------------------------
# Other words for existing verbs, each to the verb's canonical name: the words the owner
# and the watcher reached for in the gate's passage and the two free passages (the
# refused orders of playtests 12 and 13, `refused*.md` in their folders). "Take a sounding" and
# "sound" are the hand lead ("Sounding, the operation of trying the depth of the water,
# and the quality of the ground, by a plummet, called the lead", Falconer 1780,
# *Sounding*); "cast the lead" the same. "Tend" is the afterguard's word for a sheet, as
# "tend the sheets" above ("trim the spanker sheet" and "tend the spanker sheet" are
# read as the sail's trim: the grammar takes the sheet's name to its sail). "Trice up"
# the driver's tack is the period's way of spilling a gaff sail's wind, which the physics
# has no state for yet, as it has none for a peak dropped: it is answered with the
# scandalise refusal's words.
aliases:
  take a sounding: heave the lead
  get a sounding: heave the lead
  sound: heave the lead
  sound with the lead: heave the lead
  cast the lead: heave the lead
  tend: trim
  work up a reckoning: work up the reckoning
  work up reckoning: work up the reckoning
  work up the reckoning's uncertainty: work up the reckoning
  work up the reckoning's doubt: work up the reckoning
  take a bearing: take a bearing of
  trice up: scandalise
  trice up the tack of: scandalise
  trice: scandalise
  tryce up: scandalise
  tryce: scandalise
  # Package 35: the port's and the people's other words
  up anchor and away: get under way
  send for the master to the cabin: send for
  pass the word: send for
# A reading asked at the prompt (package 33c): every phrase of the readings registry
# (`freesail/api/readings.py`), said alone or after one of the asking words, is a query
# answered in the log in the registry's own words (`freesail/orders/prompt.py`); the
# vocabulary takes the phrases from the registry itself, so a row added there is a word
# here for nothing. `aliases` gives another name of a reading, to the registry's words.
reading_words:
  asking: [what is, what's, what are, ask the master, ask the master for, take, tell me, show me]
  aliases:
    the reckoning's doubt: the reckoning's uncertainty
    the master's doubt: the reckoning's uncertainty
    the position: the reckoning
    our position: the reckoning
    the last cast: the depth
    the soundings: the depth
    # Package 35: the people, the papers and the port
    who is aboard: the people
    the ship's people: the people
    the officers: the people
    the cargo: the manifest
    the hold: the manifest
    the money: the purse
    the market: the prices
    the price list: the prices
    the pilot's words: the pilot
    the pilot cutter: a sail in sight
    the stranger: a sail in sight
    the sail: a sail in sight

# ---------------------------------------------------------------------------
# The world-order channel (spec M5 §26; package 36; `freesail/world/orders.py`): orders
# to the world, not to the ship, given only by a scenario file at a time or by the lead's
# harness, never by the captain (the `captain:` channel, package 40, is the exception:
# it sets the rules-based captain's intent, which is the scenario's to give). A line at
# the prompt that opens with one of these
# channels' words and a colon, or with the words below, is refused with the sentence
# here (truth 71); the captain orders his ship, sends the boat and reads what the
# lookout sees. The channels are the channel's own (`orders.CHANNELS`); a test keeps the
# two lists one.
# ---------------------------------------------------------------------------
world_orders:
  channels: [weather, ship, message, port, person, captain]
  words: [world order, order to the world, order the world]
  refusal: "That is an order to the world, not to the ship: the weather, the other sail, a message, a port and the people ashore are the scenario's and the director's to order, journaled at the driver's mark; the captain orders his ship, sends the boat and reads what the lookout sees."

# Kinds of work by a noun, for `belay the lead` (package 33c), beside `work_nouns` above:
# the lead's work is the order's that started it.
more_work_nouns:
  lead: heave the lead
  sounding: heave the lead
  cast: heave the lead
  log: heave the log

# ---------------------------------------------------------------------------
# What undoes what (package 37g, item 5; the review of gate 5c's playtests, 5.4 and 10.5):
# the pairs of orders of which the later undoes the earlier on a part they share. The
# harness's detector for a station with authority counts a link in its chain only for
# such a pair (`freesail.standing.runtime.undoes`): the same sail set and taken in, hove
# to and filled away, an anchor let go and weighed, cable veered and hove in, a thing
# allowed and disallowed. Three in a chain bring its word (set, take in, set). Altering
# the course is conning and is no pair here, however often; nor is the next thing after
# the last (heave to, fill away, steer). The old rule, "touches the same part", spoke 42
# times in the nine games of gate 5c's playtests and was right twice by its own lights;
# every one of those 42 chains is silent by this table (`tests/test_officer.py`). The
# standing orders' own conflict rule is not this one and is unchanged. Each name is a
# verb of the table above; a pair is read both ways.
# ---------------------------------------------------------------------------
undoes:
  - [set, take in]
  - [set, furl]
  - [reef, shake out]
  - [rig out, rig in]
  - [bend, unbend]
  - [heave to, fill away]
  - [call all hands, pipe down]
  - [let go the anchor, weigh]
  - [come to an anchor, weigh]
  - [let go the anchor, get under way]
  - [come to an anchor, get under way]
  - [veer cable, heave short]
  - [veer cable, heave in]
  - [moor, unmoor]
  - [send down the topgallant masts, sway up the topgallant masts]
  - [send down the topgallant yards, cross the topgallant yards]
  - [strike the topmasts, fid the topmasts]
  - [swifter in the catharpins, ease the catharpins]
  # a thing allowed and disallowed: a standing order belayed and resumed (the station's
  # own, on the same rule), and the captain's word given and taken back
  - [belay standing order, resume standing order]
  - [you may, you may not]
  - [you may work the ship, you may not work the ship]

# ---------------------------------------------------------------------------
# What cannot be undone (package 37g, item 18; the owner's ruling of 2026-10-07 on the
# general grant: it keeps back "what cannot be undone: slipping or cutting a cable,
# cutting away, and any other order of the vocabulary that gives up something of the
# ship's for good"). The orders of the table above that give up something of the ship's
# for good, which the captain's general authority to work the ship does not open and his
# word allows by name. Today the vocabulary has one: `cut away`, the wreck of a spar
# carried away cut clear and lost over the side. That one has been within the officer's
# own domain since package 37 (the vocabulary's object `wreck`), so that he can clear a
# wreck without waiting for the captain; the grant opens nothing by it and keeps nothing
# back in practice, and the list stands for the orders to come. There is no order yet to
# slip or cut a cable; when one is written it is listed here. (Selling the cargo and
# spending the purse are the port's business, kept back under that head.)
# ---------------------------------------------------------------------------
irrevocable:
  - cut away

# ---------------------------------------------------------------------------
# Words the ship does not take, each refused with what to say instead or with the
# milestone it belongs to (package 37l; the review of gate 5c's playtests, G17: hints that
# pointed the wrong way, "man the pumps" answered "did you mean 'demand'?", "as you were"
# answered "'ease' or 'give chase'?"). A line that begins with one of these phrases is
# refused in its sentence before the grammar reads it (`orders.handle`), and so is a
# standing order's action (`orders.read_whole`).
# ---------------------------------------------------------------------------
refused_phrases:
  hoist our colours: &colours "Colours and signals are milestone 7's: the ensign, the private signal and the signal book come with the other ships that answer them, and this ship has no flag locker yet."
  hoist the colours: *colours
  hoist colours: *colours
  show our colours: *colours
  show the colours: *colours
  show your colours: *colours
  hoist the ensign: *colours
  show the ensign: *colours
  hoist a flag: *colours
  hoist the flag: *colours
  make the private signal: *colours
  make a signal: *colours
  make the signal: *colours
  hoist a signal: *colours
  man the pumps: &pumps "The pumps are not worked in this game yet: she makes no water through her seams or a shot hole, and the well is not sounded (the hull's damage is a later milestone's). 'Sound the well' says so."
  rig the pumps: *pumps
  work the pumps: *pumps
  pump ship: *pumps
  pump her out: *pumps
  as you were: "'As you were' is not an order the ship keeps: say 'belay that' to stop the last order's work where it stands, 'belay all work' for everything in hand, or give the order that puts her back ('square the yards', 'steer SW by W')."
  lay out the stream anchor: &stream "The boat lays out the kedge and no other anchor in this game: say 'lay out a kedge astern' (or to a point, 'lay out a kedge to the NE'), 'let go the stream anchor' from the ship, or 'back the anchor' with the stream."
  lay out the stream: *stream
  carry out the stream anchor: *stream
  carry out the stream: *stream
  put the helm over: &helm "'Put the helm over' says not which way: say 'helm a-lee' (the helm down, her head coming up to the wind), 'hard a-weather' (the helm up, her head paying off), 'bear away' or 'come up' with the points, or 'steer' a course."
  put the helm hard over: *helm
  helm over: *helm
  put her helm over: *helm
