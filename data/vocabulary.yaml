# The vocabulary of Orders, the imperative dialect (spec §8).
#
# Everything here is data the parser reads at start-up. A new verb, a new
# synonym or a new contraction is added here, not in the code. Ship-specific
# nouns (part ids, aliases, groups) live in the ship file; this file holds
# what is true of every ship.

# ---------------------------------------------------------------------------
# Verbs. `object` says what kind of thing the verb works on:
#   sail      a sail or a group of sails (level 1, starts an evolution per sail)
#   yards     a yard, a group of yards, or nothing (meaning every yard)
#   line      one running line (level 0, acts on the part at once)
#   heading   a compass heading, degrees, or a number of points
#   points    an optional number of points (default one)
#   none      nothing after the verb but modifiers
#   driver    a console command that reached the ship by mistake
# `level` is the control ladder level of docs/DesignProposal.md §2.2.
# ---------------------------------------------------------------------------
verbs:
  set:
    synonyms: [make sail on, loose and set, hoist, loose]
    object: sail
    level: 1
  take in:
    # The period words are particular: a course is hauled up, a topsail
    # clewed up, a spanker brailed up, a boom mainsail lowered, a jib hauled
    # down (Luce 1866, ch. XXIII: "Up mainsail and spanker"). `take_in_words`
    # below says which suit which sail; the others suit any.
    synonyms: [clew up, haul down, take in the, douse, hand, haul up, brail up, brail in, lower]
    object: sail
    level: 1
  furl:
    synonyms: []
    object: sail
    level: 1
  reef:
    # "close reef", "double reef" and "single reef" carry their count in the
    # verb (`phrase_modifiers` below); "take in one reef in the topsails" is
    # read as a reef too (grammar.py), whatever the number.
    synonyms: [take a reef in, take in a reef in, close reef, double reef, single reef, treble reef]
    object: sail
    level: 1
  shake out:
    synonyms: [shake out the reef in, shake the reef out of, shake the reefs out of,
               shake out the reefs in]
    object: sail
    level: 1
  brace:
    # "lay" is Luce's word for the same act ("Lay the head yards square!",
    # "lay the main topsail aback"). "brace round" with no mode braces sharp
    # up for the tack the wind is on (`phrase_modifiers`).
    # Milestone 3b: sharp up on a wind the after yards stand sharper than the
    # head yards (Fincham 1843, art. 94); braced up "with the head yards
    # sharper" it is the reverse, for a ship griping with much way on (art. 96:
    # "brace the head-yards sharper than the after-yards"). The words are part
    # of the verb phrase (`phrase_modifiers`), so say them without a comma.
    synonyms: [brace round, lay, brace sharp up with the head yards sharper,
               brace sharp up head yards sharper, brace up with the head yards sharper,
               brace the yards sharp up with the head yards sharper,
               brace round with the head yards sharper]
    object: yards
    level: 1
  trim:
    # "Trim sails!" braces every yard to the wind and tends the sheets; the
    # narrower forms do one or the other (Luce 1866 ch. XXIV "To Trim Yards").
    # On a wind the after yards are trimmed sharper than the head yards, or,
    # "with the head yards sharper", the reverse (Fincham 1843, arts. 94, 96).
    # Milestone 4 (spec M4 §7): "trim the <sail>" tends that sail's sheet and braces
    # its yard to the wind if it is square; "trim the topsails" and "trim the fore
    # yard" likewise; "tend the sheets" is every fore-and-aft sheet and no brace. The
    # object is `yards` so that, as with "brace", nothing after the verb means the
    # whole ship and a sail or a yard may be named.
    synonyms: [trim sails, trim sail, trim the sails, trim the sails to the wind,
               trim the yards, trim yards, trim the yards to the wind, trim the yards and sheets,
               trim the sheets, trim sheets, trim the sheets and yards, tend the sheets,
               tend sheets, tend the sheets and braces,
               trim sails with the head yards sharper, trim sails head yards sharper,
               trim the sails with the head yards sharper,
               trim the yards with the head yards sharper, trim the yards head yards sharper]
    object: yards
    level: 1
  haul:
    # "haul aft", "haul home" and "haul flat" haul the line all the way in
    # (`phrase_modifiers`); so does "aft" or "home" after the line's name.
    # A bowline is hauled out by hands (milestone 3b, spec 3b §4): "haul the
    # weather bowlines", "haul the fore bowline" (the weather one, unless a side
    # is said) start an evolution for each; "steady out the bowlines" is Luce's
    # order for it when braced up (Luce 1884, ch. XXIV, 'Tacking': "Haul taut
    # the lifts and weather braces! Steady out the bo'lines!").
    synonyms: [haul on, haul in, haul taut, round in, haul aft, haul home, haul flat, steady out,
               haul out]
    object: line
    level: 0
  ease:
    synonyms: [ease off, ease away, slack, slack away, slacken, start]
    object: line
    level: 0
  check:
    synonyms: []
    object: line
    level: 0
  let go:
    # "Clear away the bowlines!" is Luce's word for letting them go before the
    # yards are swung (Luce 1884, ch. XXIV, 'Wearing': "Put the helm up! Clear
    # away the bo'lines!").
    synonyms: [cast off, let fly, let run, clear away]
    object: line
    level: 0
  belay:
    synonyms: [make fast, avast hauling on, avast]
    object: line
    level: 0
  square:
    # "Square the yards!": brace square. Nothing after it means every yard.
    synonyms: []
    object: yards
    level: 1
  back:
    # "Back the main topsail": brace its yard aback, that is, sharp up for
    # the other tack, as heaving to does (Luce 1866, ch. XXVI). Needs a yard
    # or a square sail; "back" alone is refused.
    synonyms: [lay aback, brace aback]
    object: yards
    level: 1
  sheet home:
    # Level 0 on a sail: its sheets hauled home and belayed (a square sail),
    # or hauled flat aft (a fore-and-aft sail).
    synonyms: [sheet home the, haul home the sheets of, haul aft the sheets of]
    object: sail
    level: 0
  steer:
    synonyms: [course, helm, steer for, head]
    object: heading
    level: 1
  come up:
    synonyms: [luff, luff up, come up to the wind, come to the wind, keep her up, keep your luff]
    object: points
    level: 1
  bear away:
    # "Fall off", "off the wind", "steer off the wind" and "bear off the wind" from the
    # owner's first playtest (milestone 4): the words reached for before "bear off" was
    # found. "By and large" is a description of how she sails, not a helm order, and
    # stays refused.
    synonyms: [keep away, bear up, keep her off, keep her away, keep off, bear off,
               fall off, off the wind, steer off the wind, bear off the wind]
    object: points
    level: 1
  keep her full:
    # The conning words for sailing by the wind (Luce 1866, ch. XXIV,
    # 'Conning'): "nothing off" and "no higher" keep her full and by, and
    # "luff and touch her" is the same order given from the other side, as
    # close as she will lie with the sails just full. The log echoes the word.
    synonyms: [full and by, keep her full and by, sail her full and by, steer full and by,
               bring her by the wind, steer by the wind, keep her by the wind, by the wind,
               bring her to the wind, haul her wind, haul the wind, keep her a good full,
               a good full and by, nothing off, no higher, luff and touch her]
    object: none
    level: 1
  # Conning words to the helmsman (Luce 1866, ch. XXIV 'Conning'; Falconer,
  # *Helm*). "Steady" holds the heading she has; "meet her" checks her swing
  # and holds her there; "right the helm" puts the rudder amidships and
  # leaves it; "helm a-lee" and "helm a-weather" put the rudder hard over to
  # bring her up to the wind or pay her off, and leave it there until the
  # next helm order.
  steady:
    synonyms: [steady as she goes, steady so, very well thus, thus, keep her so, keep her thus,
               steady as you go]
    object: none
    level: 1
  meet her:
    synonyms: [meet her with the helm, check her]
    object: none
    level: 1
  right the helm:
    synonyms: [helm amidships, rudder amidships, midships, amidships, right the rudder,
               helm midships]
    object: none
    level: 1
  helm a-lee:
    synonyms: [hard a-lee, helm's a-lee, put the helm down, put the helm a-lee, down with the helm,
               hard down, helm down, down helm]
    object: none
    level: 1
  helm a-weather:
    synonyms: [hard up, hard a-weather, helm's a-weather, put the helm up, put the helm a-weather,
               up with the helm, helm up, up helm]
    object: none
    level: 1
  tack ship:
    synonyms: [ready about, go about, about ship, tack, put her about, stays]
    object: none
    level: 1
  wear ship:
    # "Gybe" is the later word for wearing a fore-and-aft vessel; the log
    # says so when it is used. "Wear under bare poles" is the same evolution
    # with no sail set (Luce 1884, ch. XXIV, 'To Wear under Bare Poles': "Man
    # the weather fore rigging ... put the helm a-weather and work the yards
    # as usual"); it is refused while any sail is set.
    synonyms: [wear, bear up and wear, wear round, gybe, jibe, gybe her, wear her round,
               wear under bare poles, wear her under bare poles]
    object: none
    level: 1
  heave to:
    synonyms: [heave her to, lie to, bring her to]
    object: none
    level: 1
  fill away:
    synonyms: [fill, fill and stand on, let draw]
    object: none
    level: 1
  # Milestone 3 (package 19): the catalogue to forty. Sail work first.
  bend:
    # A new sail from the sail room bent to a bare yard (Luce 1884, ch. XX
    # 'Bending sail'). Uses a spare sail.
    synonyms: [bend on, bend a new]
    object: sail
    level: 1
  unbend:
    # Unbent from the yard and sent down (Luce 1884, ch. XX 'To unbend sail').
    synonyms: [unbend and send down]
    object: sail
    level: 1
  shift:
    # The old sail unbent and a new one bent (Luce 1884, ch. XXXII 'Shifting
    # Sails and Spars'). Uses a spare sail.
    synonyms: [shift the sail, change]
    object: sail
    level: 1
  goose wing:
    # One clew hauled up, the other set (Luce 1884, ch. XXIV: "A foresail in
    # this state is 'goose-winged'"). "goose-wing" reads as "goose wing".
    synonyms: [goosewing]
    object: sail
    level: 1
  rig out:
    # A studding sail boom (Luce 1884, ch. XXIII: "Set taut! Rig out! Hoist
    # away!"). The object is the boom or the studding sail it carries; the
    # grammar reads it as it reads a sail.
    synonyms: [run out]
    object: sail
    level: 1
  rig in:
    synonyms: []
    object: sail
    level: 1
  # Spars aloft (Luce 1884, ch. XX, 'Sending up and down topgallant-masts';
  # ch. XXIX, 'Preparations for a Gale'). The whole order is the verb: every
  # mast of that kind the ship has.
  send down the topgallant masts:
    synonyms: [send down topgallant masts, send down the topgallant mast, down topgallant masts,
               send down the topgallant masts and yards, send down the topgallant yards and masts,
               strike the topgallant masts, strike topgallant masts, strike the topgallant mast]
    object: none
    level: 1
  sway up the topgallant masts:
    synonyms: [sway up topgallant masts, sway up the topgallant mast, up topgallant masts,
               send up the topgallant masts, send up topgallant masts, send up the topgallant mast,
               sway up and fid the topgallant masts, fid the topgallant masts]
    object: none
    level: 1
  send down the topgallant yards:
    synonyms: [send down topgallant yards, send down the light yards,
               send down the topgallant and royal yards, down topgallant and royal yards,
               send down topgallant and royal yards]
    object: none
    level: 1
  cross the topgallant yards:
    synonyms: [cross topgallant yards, cross the light yards, cross the topgallant and royal yards,
               cross topgallant and royal yards, send up the topgallant yards,
               sway up the topgallant yards]
    object: none
    level: 1
  strike the topmasts:
    synonyms: [strike topmasts, strike the topmast, house the topmasts, house topmasts]
    object: none
    level: 1
  fid the topmasts:
    synonyms: [fid topmasts, fid the topmast, sway up the topmasts, sway up and fid the topmasts,
               send up the topmasts]
    object: none
    level: 1
  # The lower rigging (milestone 3b, spec 3b §3). Swiftering in the catharpins
  # bowses the lower shrouds in to the catharpin legs so that the lower yard
  # braces sharper (Steel 1794, vol. I, CATHARPINS, "to afford room to brace the
  # yards sharp"; Lever 1808, fig. 182: shrouds "catharpined in"); easing them
  # sets the shrouds out again. Without a mast named, every lower mast; with one
  # ("on the main", "the fore catharpins"), that mast only. The verb handler
  # reads the mast from the phrase, so every form is listed here.
  swifter in the catharpins:
    synonyms: [swifter in the catharpins on the fore, swifter in the catharpins on the main,
               swifter in the catharpins on the mizzen, swifter in the catharpins on the mizen,
               swifter in the catharpins on the fore mast, swifter in the catharpins on the main mast,
               swifter in the catharpins on the mizzen mast,
               swifter in the fore catharpins, swifter in the main catharpins,
               swifter in the mizzen catharpins, swifter in the mizen catharpins,
               swifter in catharpins, swifter the catharpins, catharpin in the shrouds,
               catharpin in the lower shrouds, catharpin in the fore shrouds,
               catharpin in the main shrouds, catharpin in the mizzen shrouds]
    object: none
    level: 1
  ease the catharpins:
    synonyms: [ease the catharpins on the fore, ease the catharpins on the main,
               ease the catharpins on the mizzen, ease the catharpins on the mizen,
               ease the catharpins on the fore mast, ease the catharpins on the main mast,
               ease the catharpins on the mizzen mast,
               ease the fore catharpins, ease the main catharpins, ease the mizzen catharpins,
               ease the mizen catharpins, ease catharpins, ease off the catharpins,
               cast off the catharpins, cast off the catharpins on the fore,
               cast off the catharpins on the main, cast off the catharpins on the mizzen]
    object: none
    level: 1
  # Handling the ship (Luce 1884, ch. XXIV, XXIX; Appendix I).
  box haul:
    # "box-haul" reads as "box haul".
    synonyms: [boxhaul, box haul her, box haul the ship, boxhaul her, boxhaul the ship]
    object: none
    level: 1
  wear short round:
    synonyms: [wear her short round, ware short round]
    object: none
    level: 1
  lie a try:
    # "lie a-try" reads as "lie a try". Lying to under the close-reefed main
    # topsail is the same thing said in full ("lie to" alone is heave to).
    synonyms: [lie a try under the main topsail, lie to under the main topsail,
               lie to under the close reefed main topsail, lie to under a close reefed main topsail,
               bring her to under the main topsail]
    object: none
    level: 1
  scud:
    synonyms: [scud before it, scud before the wind, scud before the gale, run before it,
               run before the gale, bear up and scud]
    object: none
    level: 1
  back and fill:
    synonyms: [back and fill her]
    object: none
    level: 1
  loose sails to dry:
    synonyms: [loose the sails to dry, loose sail to dry, loose all sail to dry,
               loose the sail to dry, loose all sails to dry]
    object: none
    level: 1
  furl all:
    # "Furl sail!" is Luce's call for furling everything (ch. XX 'To furl sail').
    synonyms: [furl all sails, furl all sail, furl everything, furl sails, furl sail]
    object: none
    level: 1
  scandalise:
    # Dropping the peak of a gaff sail to spill the wind. The physics has no
    # such state yet, so the order is always refused with `refusals` below.
    synonyms: [scandalize, drop the peak of, scandalise the peak of]
    object: sail
    level: 1
  # Milestone 3 (package 20): the crew orders (spec M3 §5.1). They reach the
  # watch routine at once, not through the evolution runner: a call for all
  # hands must not queue behind the very tack it is meant to help.
  call all hands:
    # "All hands!" is the boatswain's call at the hatchways (Luce 1884,
    # ch. XX, 'Organization': the watch below "called" and "turned up").
    synonyms: [all hands, all hands on deck, call all hands on deck, turn the hands up,
               turn up all hands, turn up the hands, turn all hands up]
    object: none
    level: 1
  pipe down:
    # "... clear up the decks and pipe down" ends every all-hands evolution in
    # Luce (ch. XXIII, XXIV); the watch below goes below.
    synonyms: [pipe the watch below, pipe the hands down, pipe down the hands,
               send the watch below, pipe down all hands]
    object: none
    level: 1
  relieve the watch:
    # An early watch change (Luce 1884, 'The Officer of the Deck': "relieve
    # the watch" and have the watch on deck mustered).
    synonyms: [relieve the deck, change the watch]
    object: none
    level: 1
  # A query, not an order: the console answers it with the watch bill, as it
  # answers `state`, and it is never journaled. Should it reach the ship (the
  # browser's command line), the ship says it is the console's.
  muster:
    synonyms: [muster the crew, muster the hands, muster the ship's company, muster the watch,
               muster the watch bill]
    object: driver
    level: driver
  # Group evolutions: verb phrases with no object, expanded from the list below.
  set plain sail:
    synonyms: [make plain sail, make sail]
    object: none
    level: 1
  make all sail:
    synonyms: [set all sail, crowd sail, crack on]
    object: none
    level: 1
  shorten sail:
    synonyms: [take in sail, reduce sail, snug her down]
    object: none
    level: 1
  # The standing dialect (milestone 4, spec M4 §3): level 2 of the control ladder.
  # `standing order "name": <trigger> [, if <condition>] then <order> [; <order>]` and
  # the book's orders. `orders.handle` hands these to `freesail.standing.grammar` before
  # the imperative parser sees them; they are listed here so that completion, the
  # spelling hints and the verb table know the words.
  standing order:
    synonyms: []
    object: standing
    level: 2
  standing orders:
    synonyms: [the standing orders, list the standing orders, show the standing orders]
    object: standing
    level: 2
  show standing order:
    synonyms: [show the standing order]
    object: standing
    level: 2
  belay standing order:
    synonyms: [belay the standing order, cancel standing order, cancel the standing order]
    object: standing
    level: 2
  resume standing order:
    synonyms: [resume the standing order]
    object: standing
    level: 2
  belay all standing orders:
    synonyms: [belay the standing orders, belay every standing order, cancel all standing orders]
    object: standing
    level: 2
  # The station sentences (milestone 4b, spec M4 §12): what the captain says to an
  # agent's station. `orders.handle` hands them to `freesail.orders.stations` before the
  # imperative parser sees them; they are listed here so that completion, the spelling
  # hints and the verb table know the words. `ask`, `stand down` and `resume` are
  # orders (journaled); the journal is a query like `state`.
  ask the watcher:
    synonyms: [ask watcher]
    object: station
    level: 2
  stand down the watcher:
    synonyms: [stand the watcher down]
    object: station
    level: 2
  resume the watcher:
    synonyms: [continue the watcher]
    object: station
    level: 2
  show the watcher's journal:
    synonyms: [the watcher's journal, show the watcher journal, show the journal of the watcher]
    object: station
    level: 2
  # Reading a file of standing orders is the driver's business (it reads the disk): the
  # console and the server take `read the standing orders from <file>`, and the ship,
  # should it reach her, says so.
  read the standing orders from:
    synonyms: [load the standing orders from, read standing orders from]
    object: driver
    level: driver
  # Console and client control. If one of these reaches the ship, the
  # captain typed it at the wrong prompt; say so.
  hold:
    synonyms: [pause, stop the clock]
    object: driver
    level: driver
  go:
    synonyms: [resume, run]
    object: driver
    level: driver
  time:
    synonyms: [tick, speed up, slow down]
    object: driver
    level: driver

# ---------------------------------------------------------------------------
# Which evolution a level 1 sail verb starts, by sail class (spec §8.4).
# A class missing from a verb's list means the verb has no meaning for that
# class, and the order is rejected with the sentence in `refusals`.
# ---------------------------------------------------------------------------
evolutions:
  set:
    square: set_square
    gaff: set_gaff
    jibheaded: set_jibheaded
    studding: set_studding
    lug: set_lug
    lateen: set_lateen
    sprit: set_sprit
  take in:
    square: take_in_square
    gaff: take_in_gaff
    jibheaded: take_in_jibheaded
    studding: take_in_studding
    lug: take_in_lug
    lateen: take_in_lateen
    sprit: take_in_sprit
  furl:
    square: furl_square
  reef:
    square: reef_square
    gaff: reef_gaff
  shake out:
    square: shake_out_square
    gaff: shake_out_gaff
  brace: brace
  square: brace
  back: brace
  tack ship: tack
  wear ship: wear
  heave to: heave_to
  fill away: fill_away
  # milestone 3b (spec 3b §6.3 and §6.4): any sail the ship's two rigs carry is bent from
  # and unbent to the sail room, storm canvas and the occasional sails among them
  bend:
    square: bend_sail
    gaff: bend_sail
    jibheaded: bend_sail
    studding: bend_sail
  unbend:
    square: unbend_sail
    gaff: unbend_sail
    jibheaded: unbend_sail
    studding: unbend_sail
  shift:
    square: shift_sail
    gaff: shift_sail
    jibheaded: shift_sail
    studding: shift_sail
  goose wing:
    square: goose_wing
  # rig out and rig in take a studding sail boom, or the studding sail on it
  rig out:
    studdingsail_boom: rig_out_studdingsail_boom
    studding: rig_out_studdingsail_boom
  rig in:
    studdingsail_boom: rig_in_studdingsail_boom
    studding: rig_in_studdingsail_boom
  send down the topgallant masts: send_down_topgallant_masts
  sway up the topgallant masts: sway_up_topgallant_masts
  send down the topgallant yards: send_down_topgallant_yards
  cross the topgallant yards: cross_topgallant_yards
  strike the topmasts: strike_topmasts
  fid the topmasts: fid_topmasts
  box haul: boxhaul
  wear short round: wear_short_round
  lie a try: lie_a_try
  scud: scud
  back and fill: back_and_fill
  loose sails to dry: loose_sails_to_dry
  furl all: furl_all
  # milestone 3b: the catharpins (one evolution per lower mast) and the bowlines
  # (one per bowline hauled out; letting go and easing one is done at the pin)
  swifter in the catharpins: swifter_in_catharpins
  ease the catharpins: ease_catharpins
  haul:
    bowline: haul_bowline

refusals:
  furl: "A {class} sail is not furled on its spar; take it in instead."
  reef: "The {name} has no reef bands; it is set whole or not at all."
  shake out: "The {name} has no reef bands; there is nothing to shake out."
  bend: "The {name} is a {class} sail; no rig in this milestone bends one."
  unbend: "The {name} is a {class} sail; no rig in this milestone bends one."
  shift: "The {name} is a {class} sail; no rig in this milestone bends one. Take it in instead."
  goose wing: "The {name} is a {class} sail; it has no clews to goose-wing. Only a course or a topsail is goose-winged."
  scandalise: "The {name} cannot be scandalised: the physics has no state for a gaff sail with its peak dropped yet, only set, reefed or taken in. Ease the sheet, reef it or take it in instead."

# How each class of sail is taken in, in the period word (Luce 1866, ch.
# XXIII; Luce 1884, ch. XXXIV). A take-in synonym listed here is refused for
# a sail whose class does not list it, with the first word that does. A
# `course` is a square sail on a lower yard. Synonyms not listed here at
# all ("take in", "douse", "hand") suit any sail.
take_in_words:
  course: [haul up, clew up]
  square: [clew up]
  gaff: [brail up, brail in, haul up, lower]
  jibheaded: [haul down]
  studding: [take in, haul down]
  lug: [lower]
  lateen: [lower]
  sprit: [lower]

# ---------------------------------------------------------------------------
# Brace modes: the target brace angle for each word (spec §8.2). `limit`
# means the yard's own brace_limit; `aback` the limit for the other tack
# (the sail pressed against the mast); `wind` the best angle for the present
# apparent wind, as `trim the yards` finds it. Degrees here; radians inside.
# ---------------------------------------------------------------------------
brace_modes:
  sharp up: limit
  up: 30
  in: 15
  square: 0
  by the lifts: 0
  full: limit
  aback: aback
  sharp aback: aback
  abox: aback
  to the wind: wind

# Modifiers a verb phrase carries in itself: "close reef" is "reef ...
# close", "haul aft" is "haul ... home", and "brace round" with nothing else
# said braces for the tack the wind is on. Keys are `Order.modifiers` keys.
phrase_modifiers:
  brace round: {round: true}
  close reef: {close: true}
  shake out the reefs in: {close: true}
  shake the reefs out of: {close: true}
  double reef: {reefs: 2}
  single reef: {reefs: 1}
  treble reef: {reefs: 3}
  haul aft: {home: true}
  haul home: {home: true}
  haul flat: {home: true}
  # milestone 3b: the head yards braced sharper than the after yards (Fincham art. 96)
  brace sharp up with the head yards sharper: {brace_mode: sharp up, head_sharper: true}
  brace sharp up head yards sharper: {brace_mode: sharp up, head_sharper: true}
  brace up with the head yards sharper: {brace_mode: sharp up, head_sharper: true}
  brace the yards sharp up with the head yards sharper: {brace_mode: sharp up, head_sharper: true}
  brace round with the head yards sharper: {round: true, head_sharper: true}
  trim sails with the head yards sharper: {head_sharper: true}
  trim sails head yards sharper: {head_sharper: true}
  trim the sails with the head yards sharper: {head_sharper: true}
  trim the yards with the head yards sharper: {head_sharper: true}
  trim the yards head yards sharper: {head_sharper: true}

# Words after a line's name that mean "all the way in": "haul the jib sheet
# aft", "haul the topsail sheets home".
haul_home: [home, aft, flat, flat aft, chock home, right home, hard in, flat in]

# ---------------------------------------------------------------------------
# Sides. `port` is accepted and echoed as larboard. `weather` and `lee`
# resolve from the current tack when the order is parsed.
# ---------------------------------------------------------------------------
sides:
  starboard: starboard
  stbd: starboard
  larboard: larboard
  port: larboard
  weather: weather
  windward: weather
  lee: lee
  leeward: lee
both_sides: [both sides, both, either side, on both sides]

# ---------------------------------------------------------------------------
# Other modifier words.
# ---------------------------------------------------------------------------
manner: [handsomely, roundly, cheerly, smartly, together]
a_little: [a little, a trifle, a bit]
reef_close: [close, close reefed, close reef, close reefs, all reefs]
tack_phrase: ["on the", "on", "to the"]   # "on the starboard tack", "to the starboard tack"
point_directions:
  "up": "up"
  "off": "off"
  to starboard: starboard
  to larboard: larboard
  to port: larboard
  to windward: up
  to leeward: "off"

# ---------------------------------------------------------------------------
# Numbers as words. Digits are also accepted.
# ---------------------------------------------------------------------------
numbers:
  a: 1
  an: 1
  one: 1
  two: 2
  three: 3
  four: 4
  five: 5
  six: 6
  seven: 7
  eight: 8
  nine: 9
  ten: 10
  eleven: 11
  twelve: 12
  sixteen: 16
  half: 0.5

# ---------------------------------------------------------------------------
# Generated-name rules (spec §6.5). A part id such as `fore.topsail.yard`
# becomes the phrase "fore topsail yard" (dots and underscores to spaces);
# then every word with an entry below also takes each of its alternatives,
# so "fore tops'l yard" and "fore topsl yard" are names too. Apostrophes are
# optional when matching, so the plain spellings need not be listed.
# ---------------------------------------------------------------------------
contractions:
  topsail: [tops'l, topsl, top sail]
  topgallant: [t'gallant, t'gan's'l, tgallant, topgallant sail, top gallant]
  topgallants: [t'gallants, t'gan's'ls, topgallant sails]
  royal: [royal sail]
  studdingsail: [stuns'l, stunsail, studding sail, stun'sail]
  studdingsails: [stuns'ls, stunsails, studding sails, kites]
  crossjack: [cro'jack, crojack]
  staysail: [stays'l, staysl, stay sail]
  staysails: [stays'ls, stay sails]
  forecourse: [fore course]
  course: [course]
  gaff_topsail: [gaff tops'l]
  spanker: [driver]
  halyard: [halliard, haulyard]
  # sides inside a name
  larboard: [port]
  fore: [fore]
  mizzen: [mizen, mizzen]
  jib: [jib]

# Segment words that are dropped when they sit between others in a line's
# name: `main.yard.brace.starboard` is "the main brace", not "the main yard
# brace" (though that is accepted too).
droppable_inner_words: [yard]

# ---------------------------------------------------------------------------
# Group evolutions: verb phrases that expand to a list of ordinary orders,
# given in the order a ship of the period would do them (Luce 1866, ch.
# XXIII). Each order is handled as if the captain had given it; an order
# whose object this ship does not have is passed over, so one list serves
# every rig. Orders that fail for another reason (a sail already set) are
# reported in the log line and the rest are still carried out.
# ---------------------------------------------------------------------------
group_evolutions:
  set plain sail:
    - set the plain sail
  make all sail:
    - set the plain sail
    - set the royals
    - set the flying jib
    - set the staysails
    - set the gaff topsail
    - set the studdingsails, both sides
  shorten sail:
    - take in the studdingsails
    - take in the royals
    - take in the flying jib
    - take in the topgallants
    - take in the gaff topsail
    - reef the topsails, one reef

# ---------------------------------------------------------------------------
# Hands selectors (spec M3 §5.1): which hands an order sets to work, said as
# "send the larboard watch aloft to furl the main course", "send the fore
# topmen to loose the fore topsail", or "... with the starboard watch" after
# any order that sets men to work. The request is filled from those hands
# only; a watch that is below is turned up for it. Each phrase names a watch
# (starboard, larboard) or a station of the ship file (fore_top, afterguard...).
# The names are the watch bill's (Luce 1884, ch. XX, 'Watch, Quarter and
# Station Bills').
# ---------------------------------------------------------------------------
hands_selectors:
  starboard watch: starboard
  larboard watch: larboard
  port watch: larboard
  forecastlemen: forecastle
  forecastle men: forecastle
  fore topmen: fore_top
  foretopmen: fore_top
  main topmen: main_top
  maintopmen: main_top
  mizzen topmen: mizzen_top
  mizen topmen: mizzen_top
  afterguard: afterguard
  afterguards: afterguard
  waisters: waisters
  marines: marines
  idlers: idlers
# Words between "send the ... " and the order: "aloft to", "forward to", "to".
send_directions: [aloft, up aloft, up, forward, aft, on deck, into the tops, into the rigging]
