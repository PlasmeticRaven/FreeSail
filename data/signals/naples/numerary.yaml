# FreeSail: the Neapolitan numerary signal book, the day signals (spec M7 §3; package 76;
# docs/design/Design-Signals.md). The form is data/signals/britain/numerary.yaml's (its head
# says the fields). The book is the *Segnali di giorno, e di notte all'ancora ed alla vela per
# uso della flottiglia di S. M.* (Naples, Angelo Coda, 1807; docs/references/signals/): the
# flotilla's book of the kingdom under Joseph, two years after the period, the one book of a
# Mediterranean faction found. Its general signals by day, at anchor and under sail, are
# numbered, their numbers read on the page (the scan's text reads a figure as a letter here and
# there, set right by the list's order) and its words given as `original`. Its thirty
# particular signals of one flag and a pendant (the pendant's place giving the ten) are named
# in the declaration and not taken as entries. The entries from 201 are meanings the game's
# orders want and the general signals lack, marked `made: true`.

entries:
  - {number: 35, meaning: "A sail discovered in the bearing signalled", also: ["a strange sail in sight", "strange sail", "a sail in sight", "sails in sight"], original: "Si scopre una vela al rombo del vento segnalato", does: {news: true}, qualifiers: [compass], source: "Segnali di giorno e di notte, Naples 1807, the general signals by day, No. 35"}
  - {number: 36, meaning: "Several ships discovered in the bearing signalled", also: ["several sail in sight", "a fleet in sight"], original: "Si scoprono diversi bastimenti al rombo del vento segnalato", does: {news: true}, qualifiers: [compass], source: "Segnali di giorno e di notte, Naples 1807, the general signals by day, No. 36"}
