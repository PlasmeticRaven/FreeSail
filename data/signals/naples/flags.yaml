# FreeSail: the Neapolitan signal flags drawn (package 102, step 2; docs/design/Design-Signals.md,
# "The signal flags drawn"). The shape of data/signals/britain/flags.yaml (its head says the
# fields). Every flag from the plate of the flotilla's book of 1807 (Joseph's kingdom), in
# colour: the flags 0 to 12 (0 the general flag, alone the annulment; 0 to 9 the figures of a
# numbered signal, `numeral 0` to `numeral 9`), the three cornets and the national one, the
# six pendants and the national one, the two substitutes; the plate's flags drawn 2:3.

nation: naples
sources:
  - "Segnali di giorno, e di notte ... per uso della flottiglia di S. M., Naples 1807, the plate 'Bandiere dei segnali' (leaf 2, in colour)"
flags:
