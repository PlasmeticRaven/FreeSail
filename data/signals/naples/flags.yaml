    kind: flag
    words: "the flag 0, yellow"
    proportion: [2, 3]
    drawing:
      - {rect: [0, 0, 1, 1], colour: yellow}
    dates: ""
    mark: plate
    source: "Segnali di giorno, e di notte ... per uso della flottiglia di S. M., Naples 1807, the plate 'Bandiere dei segnali' (leaf 2, in colour), No. 0 (the general flag; alone the annulment)"
