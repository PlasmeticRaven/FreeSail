# FreeSail: the Neapolitan night and fog signals (spec M7 §3, §5; package 76;
# docs/design/Design-Signals.md). The form is data/signals/britain/night_fog.yaml's. The
# flotilla's book of 1807 (Naples; docs/references/signals/) gives thirteen night signals, read
# on the page by number and meaning; how each is shown by lanterns is in the book's figures,
# which the scan's text does not give, so `show` names the signal by its number and the book's
# lanterns. No fog signals are in the book: the fog list is made in the period's form, guns in
# two times, every entry marked.

source: "Segnali di giorno e di notte, Naples 1807, the night signals; the fog made"

night:
  - {number: 1, meaning: "Make sail, or anchor if under sail", also: ["weigh", "weigh anchor", "get under way"], show: "the night signal No. 1 by lanterns, as the book figures it", does: {order: "weigh anchor"}, source: "Segnali di giorno e di notte, Naples 1807, the night signals, No. 1 (the lanterns are in the book's figures, which the scan's text does not give)"}
  - {number: 2, meaning: "Come within hail of one another", also: ["come within hail", "keep closer order", "close order", "close up"], show: "the night signal No. 2 by lanterns, as the book figures it", does: {order: "close the flag"}, source: "Segnali di giorno e di notte, Naples 1807, the night signals, No. 2 (the lanterns are in the book's figures, which the scan's text does not give)"}
  - {number: 3, meaning: "Tack", also: ["tack", "tack together", "put about together"], show: "the night signal No. 3 by lanterns, as the book figures it", does: {order: "put her about"}, source: "Segnali di giorno e di notte, Naples 1807, the night signals, No. 3 (the lanterns are in the book's figures, which the scan's text does not give)"}
  - {number: 4, meaning: "Form the line of battle", also: ["form the line", "form the line of battle"], show: "the night signal No. 4 by lanterns, as the book figures it", does: {}, source: "Segnali di giorno e di notte, Naples 1807, the night signals, No. 4 (the lanterns are in the book's figures, which the scan's text does not give)"}
  - {number: 5, meaning: "Open fire, or cease it", also: ["open fire", "engage", "engage the enemy"], show: "the night signal No. 5 by lanterns, as the book figures it", does: {state: "engaging"}, source: "Segnali di giorno e di notte, Naples 1807, the night signals, No. 5 (the lanterns are in the book's figures, which the scan's text does not give)"}
  - {number: 6, meaning: "Chase, or reconnoitre the ships in sight", also: ["general chase", "chase", "to chase", "reconnoitre"], show: "the night signal No. 6 by lanterns, as the book figures it", does: {state: "chasing"}, source: "Segnali di giorno e di notte, Naples 1807, the night signals, No. 6 (the lanterns are in the book's figures, which the scan's text does not give)"}
  - {number: 7, meaning: "The chasers to retire", also: ["discontinue the chase", "recall", "the recall"], show: "the night signal No. 7 by lanterns, as the book figures it", does: {state: "on passage"}, source: "Segnali di giorno e di notte, Naples 1807, the night signals, No. 7 (the lanterns are in the book's figures, which the scan's text does not give)"}
  - {number: 8, meaning: "Ships discovered", also: ["strange sail", "a strange sail in sight", "enemy in sight"], show: "the night signal No. 8 by lanterns, as the book figures it", does: {news: true}, source: "Segnali di giorno e di notte, Naples 1807, the night signals, No. 8 (the lanterns are in the book's figures, which the scan's text does not give)"}
  - {number: 9, meaning: "Damage", also: ["damage", "in distress", "want assistance"], show: "the night signal No. 9 by lanterns, as the book figures it", does: {news: true}, source: "Segnali di giorno e di notte, Naples 1807, the night signals, No. 9 (the lanterns are in the book's figures, which the scan's text does not give)"}
  - {number: 10, meaning: "The damaged ship to part for the nearest port", also: ["make for the nearest port"], show: "the night signal No. 10 by lanterns, as the book figures it", does: {}, source: "Segnali di giorno e di notte, Naples 1807, the night signals, No. 10 (the lanterns are in the book's figures, which the scan's text does not give)"}
  - {number: 11, meaning: "Form the order of sailing, following the commander's manoeuvres", also: ["follow the commander"], show: "the night signal No. 11 by lanterns, as the book figures it", does: {}, in_succession: true, source: "Segnali di giorno e di notte, Naples 1807, the night signals, No. 11 (the lanterns are in the book's figures, which the scan's text does not give)"}
  - {number: 13, meaning: "Bear away, following the commander", also: ["bear away", "bear up"], show: "the night signal No. 13 by lanterns, as the book figures it", does: {}, source: "Segnali di giorno e di notte, Naples 1807, the night signals, No. 13 (the lanterns are in the book's figures, which the scan's text does not give)"}

fog:
  - {meaning: "Tack together", also: ["tack", "tack together"], fire: "two guns, and a minute after two guns", does: {order: "put her about"}, source: "the period's form, guns in two times as the other books' (no fog signals in the flotilla's book); made", made: true}
  - {meaning: "Wear together", also: ["wear", "wear together"], fire: "three guns, and a minute after three guns", does: {order: "wear ship"}, source: "the period's form, guns in two times as the other books' (no fog signals in the flotilla's book); made", made: true}
  - {meaning: "Make more sail", also: ["make sail", "more sail"], fire: "one gun, and a minute after two guns", does: {order: "make sail"}, source: "the period's form, guns in two times as the other books' (no fog signals in the flotilla's book); made", made: true}
  - {meaning: "Shorten sail", also: ["shorten sail", "take in sail"], fire: "two guns, and a minute after one gun", does: {order: "shorten sail"}, source: "the period's form, guns in two times as the other books' (no fog signals in the flotilla's book); made", made: true}
  - {meaning: "Bring to", also: ["heave to", "lie to", "bring to"], fire: "three guns, and a minute after one gun", does: {order: "heave to"}, source: "the period's form, guns in two times as the other books' (no fog signals in the flotilla's book); made", made: true}
  - {meaning: "Anchor", also: ["come to an anchor", "anchor"], fire: "four guns, and a minute after one gun", does: {order: "come to an anchor"}, source: "the period's form, guns in two times as the other books' (no fog signals in the flotilla's book); made", made: true}
  - {meaning: "Enemy in sight", also: ["the enemy in sight", "strange sail"], fire: "five guns quick", does: {news: true}, source: "the period's form, guns in two times as the other books' (no fog signals in the flotilla's book); made", made: true}
  - {meaning: "Keep closer order", also: ["keep closer order", "close order", "keep company"], fire: "a gun every half hour", does: {order: "close the flag"}, source: "the period's form, guns in two times as the other books' (no fog signals in the flotilla's book); made", made: true}
