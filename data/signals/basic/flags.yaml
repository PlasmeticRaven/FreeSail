# FreeSail: the basic book's signal flags drawn, and the private tables' plain flags of every
# root (package 102, step 2; docs/design/Design-Signals.md, "The signal flags drawn"). The shape
# of data/signals/britain/flags.yaml (its head says the fields). The basic book's flags are
# made, as its numbers are; the private tables' flags ('a blue pendant', 'a red and white
# flag': every root's private.yaml, themselves made) are drawn once here from their words and
# read by every root after its own file.

nation: basic
sources:
  - "the common form of the period's books (made)"
flags:
  - name: "numeral 1"
    kind: flag
    words: "the numeral flag one"
    proportion: [2, 3]
    drawing:
      - {rect: [0, 0, 1, 1], colour: red}
    dates: ""
    mark: made
    source: "made: the basic book's flags are the builder's (book.yaml), in the common designs of the period's books (Howe's, Kempenfelt's, Perrin pp. 169 to 172)"
