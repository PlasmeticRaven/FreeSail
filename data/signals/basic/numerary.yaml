# FreeSail: the basic numerary signal book, the day signals (spec M7 §3; package 71;
# docs/design/Design-Signals.md). The form is data/signals/britain/numerary.yaml's (its
# head says the fields). A few dozen entries in the common form of the period's national
# books; every number MADE, every meaning one the books had. Package 76 builds each nation's
# own root out from this.

entries:
  - {number: 1, meaning: "Enemy in sight", also: ["the enemy in sight", "an enemy in sight"], does: {news: true}, qualifiers: [compass], source: "the common form (made)", made: true}
  - {number: 2, meaning: "A strange sail in sight", also: ["strange sail", "a sail in sight"], does: {news: true}, qualifiers: [compass, number], source: "the common form (made)", made: true}
