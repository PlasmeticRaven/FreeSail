    kind: flag
    words: "the numeral flag one"
    proportion: [2, 3]
    drawing:
      - {rect: [0, 0, 1, 1], colour: red}
    dates: ""
    mark: made
    source: "made: no figure found (Barry 1800 has no plate in the scan; Preble 1894 names the squadron's flags of 1803-1804 in words, not their colours); Barry's own example the colours' (No. 214: a red flag the unit, a blue the tens, a yellow the hundreds), the rest JUDGEMENT"
