# FreeSail: the United States' signal flags drawn (package 102, step 2;
# docs/design/Design-Signals.md, "The signal flags drawn"). The shape of
# data/signals/britain/flags.yaml (its head says the fields). No figure was found: **every flag
# here is made**, from Barry's words (his example's red unit, blue tens and yellow hundreds) and
# Preble's account of the squadron's books of 1803-1804 (ten numerals, three triangles as
# repeaters, a cornet, an answering flag, the diptote). A numbered signal flies its units
# uppermost, as Barry's Essay has it.

nation: united-states
sources:
  - "Barry, A Set of Signals, Norfolk 1800 (no figure)"
  - "Preble, History of the Flag of the United States, Boston 1894 (the flags named, not drawn)"
flags:
