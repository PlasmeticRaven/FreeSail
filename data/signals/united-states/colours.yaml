# FreeSail: the United States flags of command and identity (spec M7 §1; package 76, the
# owner's addition of 2026-11-07; docs/design/Design-Signals.md, "As built out", which gives the
# shape). The flag of fifteen stripes and fifteen stars (1795 to 1818), the long pennant of a
# captain in command, and the commodore's broad pennant with the union's stars are Preble's
# (1894); the United States had no admiral, so no admiral's flag; where each flew in action is
# Roosevelt's account of the *Constitution* (1812): her commodore's pendant at the main,
# ensigns at the mizzen peak and the main topgallant masthead, a jack at the fore. The drawings
# are the builder's from those words, the proportions judgement.

nation: united-states
sources:
  - "Preble, History of the Flag of the United States of America, Boston 1894 (the flag of 1795 to 1818, the pennant, the commodore's broad pennant)"
  - "Babron, Précis des pratiques de l'art naval, Brest 1817 (the flag of the United States, for war and trade)"
  - "Roosevelt, The Naval War of 1812, New York 1882 (the commodore's pendant at the main, the ensigns doubled and the jack at the fore in action)"
