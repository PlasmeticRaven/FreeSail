# FreeSail: the United States numerary signal book, the day signals (spec M7 §3; package 76;
# docs/design/Design-Signals.md). The form is data/signals/britain/numerary.yaml's (its head
# says the fields). The book is John Barry's *A Set of Signals presented to the Navy of the
# United States of America* (Norfolk, Virginia, 1800; docs/references/signals/), the senior
# captain's book and the nearest to the period found: its signals by day and night, more than
# twelve hundred, numbered in the order of their first words (his "alphabetical and
# numerical" plan), each made by a flag a figure. The numbers are his, read on the page (the
# long s read as s; a figure the scan split, read by its neighbours' order); his words given
# as `original`. Where a signal comes in a series by the bearing (the strange ships, the
# danger, the chase), the entry is the series' first, the bearing said beside, as the game's
# qualifier does. The squadron's books of 1803 to 1804 (Morris's and Preble's, in
# manuscript among Preble's papers, as Preble's *History of the Flag* tells them) are not
# laid out; their flags are in book.yaml. The entries from 1401 are meanings the game's
# orders want and Barry's pages read here do not give, marked `made: true`.

