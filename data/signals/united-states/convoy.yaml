# FreeSail: the United States convoy's signals (spec M7 §3; package 76;
# docs/design/Design-Signals.md). The form is data/signals/britain/convoy.yaml's. Barry's book
# (Norfolk, 1800) carries the fleet's signals about a convoy, each read on the page with its
# number: the convoy to make sail on the course the chasing signal shows, to close its
# stragglers, to disperse, the escort to lead it or leave it. The masters' own book is not
# found: Preble's convoy signals of 1800 (the *Essex*'s, copied from a British code Sir Roger
# Curtis gave him at the Cape, as Preble's account tells it) lie with his papers and are not
# laid out. So the masters' orders below are the British file's in the period's form, numbered
# from 1, and every one of them is marked `made: true`.

source: "Barry 1800 for the fleet's signals about a convoy; the masters' book in the period's form, made"
made: true

entries:
  - {number: 1042, meaning: "The convoy to make sail", also: ["make sail", "make more sail", "more sail"], does: {order: "make sail"}, source: "Barry 1800, the signals by day and night, No. 1042 (the course they are to steer shewn by the chasing signal for that point)"}
  - {number: 321, meaning: "Close, the straggling ships of the convoy", also: ["close round the commodore", "keep closer order", "close order", "close up", "keep together"], does: {order: "close the flag"}, qualifiers: [ship], source: "Barry 1800, the signals by day and night, No. 321"}
  - {number: 452, meaning: "Disperse, the convoy so to do", also: ["disperse", "the convoy to disperse", "proceed independently", "part company", "proceed on your voyage"], does: {release: true}, source: "Barry 1800, the signals by day and night, No. 452"}
