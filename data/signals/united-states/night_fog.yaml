# FreeSail: the United States night and fog signals (spec M7 §3, §5; package 76;
# docs/design/Design-Signals.md). The form is data/signals/britain/night_fog.yaml's (`show`
# what is shown by night, `fire` what is fired in fog, `does` as the numerary's). By night
# Barry's book (Norfolk, 1800; docs/references/signals/) makes every signal of the day book on
# the same numeral principle by lanterns: the figures of the triangular flags answered by
# lights (for the red two lights one over the other, for the white one, for the blue one set
# apart), the lanterns bent on frames of oak in triangles and squares two feet six inches
# apart, the figures seven feet apart, the highest counted first, a single lantern the answer;
# the night entries below are the day book's by number in those lanterns. The squadron's
# books of 1803 to 1804 made their night signals by lanterns too (Preble's account). In fog
# no American signal was found: the fog list is made in the period's form, guns in two times,
# every entry marked.

source: "Barry 1800, the signals by night (the lantern figures); the fog made"

