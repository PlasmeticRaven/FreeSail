# FreeSail: the French night and fog signals (spec M7 §3, §5; package 71, built out by
# package 76; docs/design/Design-Signals.md). The FORM is Audibert Ramatuelle's, Cours
# élémentaire de tactique navale, 1802 (docs/references/signals/), ch. IV, §§ 88 to 93: by
# night every signal is guns fired in two times, the first the upper and the second the lower,
# ten seconds between the guns and a minute between the times, the ships repeating it by as many
# lanterns, upper over lower, as there were guns in each time; a table to a chapter, its rows
# the upper guns and its columns the lower, six guns at most to a signal, so twenty-one cells a
# chapter; the first chapter without rockets (the battle's orders, since only it can be made by
# lanterns alone in action), the second with a rocket between the times, the third with a
# rocket after. In fog the same guns in two times, one chapter, and the signal "de conserve"
# for keeping company: the general a gun at intervals, the chiefs repeating it each quarter of
# an hour, every ship answering with a swivel gun (§ 93). Which order stood in which cell no
# page found gives (Audibert's tables are on his plates, and the service's book of the year VI
# is not online), so every cell below is MADE in that form, but the fog's keeping company,
# which is his.
#
# `show` is what is fired and shown by night, `fire` in fog; `does` as the numerary's.

source: "Audibert Ramatuelle, Cours élémentaire de tactique navale, 1802, ch. IV §§ 88 to 93 (the form); the cells made"

night:
  - {meaning: "Enemy in sight", also: ["the enemy in sight", "an enemy in sight"], show: "one gun, a rocket, and a minute after one gun", does: {news: true}, source: "the form Audibert 1802 § 88, chapter 2; the cell made", made: true}
  - {meaning: "A strange sail in sight", also: ["strange sail", "a sail in sight"], show: "one gun, and a minute after one gun, and a rocket", does: {news: true}, source: "the form Audibert 1802 § 88, chapter 3; the cell made", made: true}
  - {meaning: "Tack together", also: ["tack", "put about together"], show: "one gun, a rocket, and a minute after two guns", does: {order: "put her about"}, source: "the form Audibert 1802 § 88, chapter 2; the cell made", made: true}
  - {meaning: "Tack in succession", also: ["tack in succession"], show: "one gun, and a minute after two guns, and a rocket", does: {order: "put her about"}, in_succession: true, source: "the form Audibert 1802 § 88, chapter 3; the cell made", made: true}
  - {meaning: "Wear together", also: ["wear", "wear ship together"], show: "one gun, a rocket, and a minute after three guns", does: {order: "wear ship"}, source: "the form Audibert 1802 § 88, chapter 2; the cell made", made: true}
  - {meaning: "Wear in succession", also: ["wear in succession"], show: "one gun, and a minute after three guns, and a rocket", does: {order: "wear ship"}, in_succession: true, source: "the form Audibert 1802 § 88, chapter 3; the cell made", made: true}
  - {meaning: "Make more sail", also: ["make sail", "more sail"], show: "one gun, a rocket, and a minute after four guns", does: {order: "make sail"}, source: "the form Audibert 1802 § 88, chapter 2; the cell made", made: true}
  - {meaning: "Shorten sail", also: ["shorten sail", "take in sail"], show: "one gun, and a minute after four guns, and a rocket", does: {order: "shorten sail"}, source: "the form Audibert 1802 § 88, chapter 3; the cell made", made: true}
  - {meaning: "Bring to", also: ["heave to", "lie to", "bring to"], show: "one gun, a rocket, and a minute after five guns", does: {order: "heave to"}, source: "the form Audibert 1802 § 88, chapter 2; the cell made", made: true}
  - {meaning: "Fill and make sail", also: ["fill", "fill away", "make sail again"], show: "one gun, and a minute after five guns, and a rocket", does: {order: "fill away"}, source: "the form Audibert 1802 § 88, chapter 3; the cell made", made: true}
  - {meaning: "Anchor", also: ["come to an anchor", "anchor"], show: "one gun, a rocket, and a minute after six guns", does: {order: "come to an anchor"}, source: "the form Audibert 1802 § 88, chapter 2; the cell made", made: true}
  - {meaning: "Weigh", also: ["weigh anchor", "get under way"], show: "one gun, and a minute after six guns, and a rocket", does: {order: "weigh anchor"}, source: "the form Audibert 1802 § 88, chapter 3; the cell made", made: true}
  - {meaning: "Chase", also: ["general chase", "to chase", "chase in the direction"], show: "one gun, and a minute after one gun", does: {state: "chasing"}, source: "the form Audibert 1802 § 88, chapter 1; the cell made", made: true}
  - {meaning: "Discontinue the chase", also: ["recall", "the recall", "give up the chase"], show: "one gun, and a minute after two guns", does: {state: "on passage"}, source: "the form Audibert 1802 § 88, chapter 1; the cell made", made: true}
  - {meaning: "Engage the enemy", also: ["engage", "engage the enemy"], show: "one gun, and a minute after three guns", does: {state: "engaging"}, source: "the form Audibert 1802 § 88, chapter 1; the cell made", made: true}
  - {meaning: "Discontinue the action", also: ["break off the action", "haul off"], show: "one gun, and a minute after four guns", does: {state: "on passage"}, source: "the form Audibert 1802 § 88, chapter 1; the cell made", made: true}
  - {meaning: "Keep closer order", also: ["close order", "close up", "close round the commodore"], show: "one gun, and a minute after five guns", does: {order: "close the flag"}, source: "the form Audibert 1802 § 88, chapter 1; the cell made", made: true}
  - {meaning: "Danger: rocks or shoals", also: ["danger", "breakers", "shoal water", "land in sight"], show: "two guns, a rocket, and a minute after one gun", does: {news: true}, source: "the form Audibert 1802 § 88, chapter 2; the cell made", made: true}
  - {meaning: "I am in want of assistance", also: ["want assistance", "in distress", "distress"], show: "two guns, and a minute after one gun, and a rocket", does: {news: true}, source: "the form Audibert 1802 § 88, chapter 3; the cell made", made: true}
  - {meaning: "Show your colours", also: ["show the private signal", "the private signal"], show: "two guns, a rocket, and a minute after two guns", does: {order: "show the private signal"}, source: "the form Audibert 1802 § 88, chapter 2; the cell made", made: true}
  - {meaning: "Affirmative", also: ["yes", "affirmative", "answer", "the signal is seen and understood"], show: "two guns, and a minute after two guns, and a rocket", does: {answer: "affirmative"}, source: "the form Audibert 1802 § 88, chapter 3; the cell made", made: true}
  - {meaning: "Negative", also: ["no", "negative", "cannot comply"], show: "two guns, a rocket, and a minute after three guns", does: {answer: "negative"}, source: "the form Audibert 1802 § 88, chapter 2; the cell made", made: true}

fog:
  - {meaning: "Tack together", also: ["tack", "put about together"], fire: "one gun, and a minute after one gun", does: {order: "put her about"}, source: "the form Audibert 1802 § 91; the cell made", made: true}
  - {meaning: "Tack in succession", also: ["tack in succession"], fire: "one gun, and a minute after two guns", does: {order: "put her about"}, in_succession: true, source: "the form Audibert 1802 § 91; the cell made", made: true}
  - {meaning: "Wear together", also: ["wear", "wear ship together"], fire: "one gun, and a minute after three guns", does: {order: "wear ship"}, source: "the form Audibert 1802 § 91; the cell made", made: true}
  - {meaning: "Wear in succession", also: ["wear in succession"], fire: "one gun, and a minute after four guns", does: {order: "wear ship"}, in_succession: true, source: "the form Audibert 1802 § 91; the cell made", made: true}
  - {meaning: "Make more sail", also: ["make sail", "more sail"], fire: "one gun, and a minute after five guns", does: {order: "make sail"}, source: "the form Audibert 1802 § 91; the cell made", made: true}
  - {meaning: "Shorten sail", also: ["shorten sail", "take in sail"], fire: "one gun, and a minute after six guns", does: {order: "shorten sail"}, source: "the form Audibert 1802 § 91; the cell made", made: true}
  - {meaning: "Bring to", also: ["heave to", "lie to", "bring to"], fire: "two guns, and a minute after one gun", does: {order: "heave to"}, source: "the form Audibert 1802 § 91; the cell made", made: true}
  - {meaning: "Fill and make sail", also: ["fill", "fill away"], fire: "two guns, and a minute after two guns", does: {order: "fill away"}, source: "the form Audibert 1802 § 91; the cell made", made: true}
  - {meaning: "Anchor", also: ["come to an anchor", "anchor"], fire: "two guns, and a minute after three guns", does: {order: "come to an anchor"}, source: "the form Audibert 1802 § 91; the cell made", made: true}
  - {meaning: "Weigh", also: ["weigh anchor", "get under way"], fire: "two guns, and a minute after four guns", does: {order: "weigh anchor"}, source: "the form Audibert 1802 § 91; the cell made", made: true}
  - {meaning: "Enemy in sight", also: ["the enemy in sight", "a strange sail in sight", "strange sail"], fire: "two guns, and a minute after five guns", does: {news: true}, source: "the form Audibert 1802 § 91; the cell made", made: true}
  - {meaning: "Danger: rocks or shoals", also: ["danger", "breakers", "shoal water"], fire: "three guns, and a minute after one gun", does: {news: true}, source: "the form Audibert 1802 § 91; the cell made", made: true}
  - {meaning: "Keep company", also: ["keep company", "keep closer order", "close order"], fire: "a gun at intervals, repeated by the chiefs each quarter of an hour, every ship answering with a swivel gun", does: {order: "close the flag"}, source: "Audibert 1802, § 93, the signal de conserve"}
  - {meaning: "Affirmative", also: ["yes", "affirmative", "answer"], fire: "three guns, and a minute after two guns", does: {answer: "affirmative"}, source: "the form Audibert 1802 § 91; the cell made", made: true}

keeping:
  at_anchor: {do: "ring the bell", every_s: 120, source: "the custom at anchor in a fog (judgement; as the British)"}
  under_way: {do: "fire a gun", every_s: 1800, source: "the fleet's gun every half hour in a fog (from memory; judgement)"}
  under_way_alone: {do: "beat the drum", every_s: 300, source: "the custom (judgement)"}
