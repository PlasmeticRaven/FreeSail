# FreeSail: the French signal books' declaration (spec M7 §3; package 71, built out by
# package 76; docs/design/Design-Signals.md). The same shape as data/signals/britain/book.yaml
# (its head says the fields).
#
# The sources, laid under docs/references/signals/ and read on the page (the research pass is
# in docs/dev/TuningNotes.md, "Package 76"). The French navy of 1805 made its signals by du
# Pavillon's system, which Audibert Ramatuelle's *Cours élémentaire de tactique navale* (Paris,
# 1802, dedicated to the First Consul) calls "the best of the systems known" (ch. IV, § 67) and
# describes: every signal two flags, an upper and a lower, read in a square table of as many
# rows and columns as there are flags, the row by the upper flag and the column by the lower,
# the cell holding the order and its number ("the order in the cell No. 286", § 71); some
# twenty flags to the table, of two colours each (white and red, yellow and black), with
# guidons and pendants beside them; a guidon over the two flags when the signal is a bare
# number (the ship's number, the sails seen, the fathoms; § 73); the thirty-two points of the
# compass by one flag under a guidon (§ 74); chapters of the table for the fleet under sail and
# at anchor. The Republic's own book of the year VI (1797), *Signaux généraux de jour, de nuit
# et de brume*, is not online (Corbett 1908, App. F No. 122, places a copy in the Royal United
# Service Institution); no page gives the service's numbers or which order stood in which cell,
# so **every number in the French books is made** (a cell of the table, the builder's), the
# meanings checked against Orvilliers's *Signaux généraux pour l'escadre du Roi* (Brest, 1772:
# the royal fleet's whole book before du Pavillon's reform, its words given as `original`
# where it has the order) and Audibert. No telegraphic dictionary: the French navy had none of
# Popham's kind, and Audibert proposes none.

nation: france
system: well-built           # her own sources and system, no dictionary; the numbers made
sources:
  - "Audibert Ramatuelle, Cours élémentaire de tactique navale, Paris, 1802 (du Pavillon's system: the table, the flags, the night and fog signals by guns in two times, the convoy's escort)"
  - "Orvilliers, Signaux généraux pour l'escadre du Roi, Brest, 1772 (the meanings and their words)"
  - "du Pavillon, Rapport d'un projet de signaux, Versailles, 1775; Bigot de Morogues, Tactique navale, 1763 (the system's ground)"
  - "Tronjoly, Signaux de jour and Signaux de nuit pour la division, Isle de France, 1779 (a division's book)"
hoist_form: table            # two flags, the upper and the lower, read as a cell (Audibert § 71)
flags:
  table_flags: 20            # "le nombre généralement reconnu nécessaire pour les signaux est de vingt-un" (Audibert § 67, note); twenty to the table (§ 74)
  guidons: true              # beside the flags (§ 67)
  pendants: true             # the 'flammes' (§ 67)
  numerary_guidon: true      # a guidon over two flags: the signal is the cell's number alone (§ 73)
  compass_guidon: true       # a point of the compass by one flag under a guidon (§ 74)
  telegraph: false           # no dictionary
hoist_s: 60
read_s: 60
read_nm: 2.0
glass_factor: 1.5
flies_s: 1800
