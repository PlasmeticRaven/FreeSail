# FreeSail: the French instructions to merchantmen under convoy (spec M7 §3; package 71, built
# out by package 76; docs/design/Design-Signals.md). Audibert Ramatuelle's chapter on the
# escort of convoys (Cours élémentaire de tactique navale, 1802, part II ch. V; docs/references/
# signals/) gives the practice: the commander of the convoy gives every ship under his escort
# its own signals of day, night and fog, which no ship may let be taken (an officer who does,
# in a surrender, answers to a council of war); recognition at a distance by sails hoisted,
# lowered, sheeted home or clewed up a set number of times, with a flag or pendant at the
# moment named; by day each ship shows on his signal a black tablet with the day's number
# painted on it, on both sides; at night words of the watch, and a doubtful ship questioned on
# her port, her owners, her captain and her name. He prints no table of the convoy's signals,
# so the meanings below are the masters' book's in the period's form and every number is MADE.
#
# The form is the numerary's (number, meaning, also, does, in_succession, qualifiers, source,
# made).

