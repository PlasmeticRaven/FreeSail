# FreeSail: the French signal flags drawn (package 102, step 2; docs/design/Design-Signals.md,
# "The signal flags drawn"). The shape of data/signals/britain/flags.yaml (its head says the
# fields). Every flag from Audibert Ramatuelle's plate of 1802 (the atlas's Pl. 3, in colour;
# docs/references/signals/pages/), the twenty flags of du Pavillon's table as he proposes them
# (1 to 10 white and red, 11 to 20 yellow and black), the zero 'égal à tous', four guidons and
# six pendants, 2:3 as his § 68 gives them. It is his proposal, not the service's book of the
# year VI, which is not found: said in each row. A table hoist flies two of the twenty, the
# upper the cell's row and the lower its column (`flags.table_flags`).

nation: france
sources:
  - "Audibert Ramatuelle, Cours élémentaire de tactique navale, Paris 1802, the atlas, Pl. 3, and the text, ch. IV § 67 to 68"
flags:
