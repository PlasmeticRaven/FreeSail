      - {poly: [[0, 0], [0.5, 0.5], [0, 1]], colour: red}
      - {poly: [[1, 0], [0.5, 0.5], [1, 1]], colour: red}
    dates: ""
    mark: plate
    source: "Audibert Ramatuelle, Cours élémentaire de tactique navale (1802), the atlas, Pl. 3, 'Tableau général des pavillons, guidons & flammes', No. 1; Audibert's proposal for du Pavillon's table, the service's book of the year VI not found"
