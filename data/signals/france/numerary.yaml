# FreeSail: the French numerary signal book, the day signals (spec M7 §3; package 71;
# docs/design/Design-Signals.md). The form is data/signals/britain/numerary.yaml's (its head
# says the fields). The meanings are the ones every fleet book of the period had, in the
# French navy's own phrases where the builder remembers them (`original`: 'chasser
# l'ennemi', 'virer de bord vent devant par la contre-marche' for tacking in succession,
# 'virer lof pour lof' for wearing, 'se former en ligne de bataille', 'combattre de près');
# the numbers are MADE (none of the Code's numbers is remembered), the book smaller than the
# British by the brief. Package 76 builds it out against du Pavillon and the Code.

entries:
  - {number: 1, meaning: "Enemy in sight", also: ["the enemy in sight", "an enemy in sight"], original: "Ennemi en vue", does: {news: true}, qualifiers: [compass], source: "the Code of the 1790s (the number made)", made: true}
