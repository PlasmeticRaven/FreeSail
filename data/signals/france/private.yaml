# FreeSail: the form of the French private signals, the 'signaux de reconnaissance' (spec
# M7 §2; package 71, read against Audibert by package 76; docs/design/Design-Signals.md). The
# form is data/signals/britain/private.yaml's (its head says the fields and the draw).
# Audibert Ramatuelle (Cours élémentaire de tactique navale, 1802, ch. IV § 70) says what they
# were: the recognition signals each government gives its ships of war, flags hoisted and
# answered, for which the ships must close near enough to make out the flags (and in thick
# weather nearer still, not without danger); he wishes them preceded by preparatory signals
# made with the highest sails. The flags at named places answered by others, with the ensign
# where the table says, and by night lights and 'feux de Bengale', are 71's form from memory;
# the tables themselves are lost and the game's are MADE under the seed.

source: "the signaux de reconnaissance as Audibert 1802, ch. IV § 70, describes them; the form's places from memory; the tables made under the seed"
made: true
changes: monthly
day:
  challenge: "a {flag} at the {place}"
  reply: "a {flag} at the {place}, with the ensign at the {ensign_place}"
  pools:
    flag: ["tricolour pendant", "white flag", "blue flag", "red flag", "blue and white flag", "red and white flag", "yellow flag", "chequered blue and white flag", "white pendant", "red pendant"]
    place: ["main topmast head", "fore topmast head", "mizen peak", "fore yardarm", "main yardarm", "ensign staff"]
    ensign_place: ["mizen peak", "ensign staff", "main topmast head"]
night:
  challenge: "{n} lights {arrangement} at the {place}"
  reply: "{n} lights {arrangement} at the {place}, and a Bengal light"
  pools:
    n: ["one", "two", "three"]
    arrangement: ["horizontal", "one over the other", "in a triangle"]
    place: ["mizen peak", "ensign staff", "main topmast head", "fore topmast head"]
carried_by: [kings-ship, cruiser, commodore]
answer_wait_s: 300
