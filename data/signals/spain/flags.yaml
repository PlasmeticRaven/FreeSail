    dates: ""
    mark: made
    source: "made: no figure of Mazarredo's twenty flags found (their values 'on a separate sheet', not held; his 1781 leaf 14 and 1799 leaf 6 are tables of numbers); drawn after the period's common designs, in the Spanish navy's colours of the ensign (red and yellow) with white and blue: JUDGEMENT"
