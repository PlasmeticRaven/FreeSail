# FreeSail: the Spanish signal flags drawn (package 102, step 2; docs/design/Design-Signals.md,
# "The signal flags drawn"). The shape of data/signals/britain/flags.yaml (its head says the
# fields). No figure of Mazarredo's flags was found (his plan puts their values on a separate
# sheet, not held), so **every flag here is made**, each said so: the twenty of the table, the
# universal flag, the two cornets, the white pendant for the signals added below the table, an
# answering pendant. A table hoist flies two of the twenty, the upper the cell's row and the
# lower its column; the universal for the lower where they would be the same flag (the plan's
# own use of it); a signal of one flag (Nos. 401 to 420) that flag alone.

nation: spain
sources:
  - "Mazarredo, Instrucciones y señales, Cádiz 1781 (the plan: the twenty flags, the universal flag, the cornets, the pendants); no figure found"
flags:
