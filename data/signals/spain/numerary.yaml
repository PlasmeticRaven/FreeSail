# FreeSail: the Spanish numerary signal book, the day signals (spec M7 §3; package 76;
# docs/design/Design-Signals.md). The form is data/signals/britain/numerary.yaml's (its head
# says the fields). The Real Armada's book in its own numbers: José de Mazarredo's
# *Instrucciones y señales para el régimen y maniobras de la esquadra* (first printed at
# Cádiz in 1781 for Córdoba's squadron; the third edition, by royal order, Madrid;
# docs/references/signals/), read on the page. Its general signals of two flags are a table
# of four hundred cells (Nos. 1 to 400), the number the cell's, his words given as
# `original`; its signals of one flag a series of twenty of their own, numbered here 401 to
# 420 (the flag's number and four hundred) so that one book holds both; the universal flag
# alone, the annulment, 421 (the number made). The meanings are his, in English. His
# *Corrección a las señales de táctica* (Cádiz, 1799) gives two hundred tactical signals by
# the five pendants over or under one flag (the orders of sailing and battle, 72's) beside
# "the four hundred signals of two flags" of the régimen book; whether the books of 1797 to
# 1805 kept the 1781 cells is asked of the owner's shelf (book.yaml). The entries from 422
# are meanings the game's orders want and the book lacks, marked `made: true`.

entries:
