# FreeSail: the Spanish convoy's signals (spec M7 §3; package 76;
# docs/design/Design-Signals.md).
# The form is data/signals/britain/convoy.yaml's (the numerary's fields). Mazarredo's
# *Instrucciones y señales* (Cádiz 1781, the third edition; docs/references/signals/) gives a
# convoy no book of its own: its general signals carry the orders to the commander of a convoy
# (Nos. 376 to 381: to manoeuvre in sight of the squadron on the side away from the enemy, to
# leave for the rendezvous, to go on to its destination, to bear up for the port it sailed
# from or the first port to leeward), and its day signals at anchor call the commanders of the
# convoy's divisions, their aides and the masters of its vessels (Nos. 48 to 50 of that
# table). So the convoy here reads the squadron's own cells, each entry's number and meaning
# his and its source saying which; that a Spanish convoy at sea was signalled by those cells is
# the builder's reading of the book, not a page. Four meanings the game's orders want and the
# book lacks are marked `made: true`, numbered as the numerary's.

source: "Mazarredo 1781: the general signals of two flags, the orders to the commander of a convoy (Nos. 376 to 381), and the day signals at anchor calling the convoy's masters (Nos. 48 to 50); the masters' reading of the squadron's cells the builder's"
made: false

