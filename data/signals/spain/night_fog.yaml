# FreeSail: the Spanish night and fog signals (spec M7 §3, §5; package 76;
# docs/design/Design-Signals.md). The form is data/signals/britain/night_fog.yaml's (`show`
# what is shown by night, `fire` what is fired in fog, `does` as the numerary's). Read on the
# page of Mazarredo's *Instrucciones y señales* (Cádiz 1781, the third edition by royal order;
# docs/references/signals/), the night and fog signals. Lanterns and guns are one: two
# lanterns are worth two guns. The form is the day's numerary one: lanterns in one place, or
# guns in one time, are the signals of one flag; lanterns high and lanterns low in two places,
# or guns in two times a full minute apart, the signals of two flags, the first time's guns
# for the high lanterns and the second's for the low. Six at most to a whole signal, five in
# one place or time, so a table of nineteen (the single lantern left out, which marks the
# general and the moment of a manoeuvre). Under sail three chapters of the nineteen, each
# told apart: the first by the lanterns alone, and common to night and fog, even fog by day;
# the second by a rocket fired, or the stern lanterns lit, before the signal; the third by
# the stern lanterns left lit, or a rocket, after it. At anchor two chapters, the first told
# as the first under sail; its articles the game's orders want are given here, each saying
# so. In fog only the first chapter is made, by the guns; a rocket is not seen. Every cell
# and meaning is his, in English; none is made.

source: "Mazarredo, Instrucciones y señales para el régimen y maniobras de la esquadra, Cádiz 1781 (the third edition, Madrid): the night and fog signals, the night signals under sail (three chapters) and at anchor"

