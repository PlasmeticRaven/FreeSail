# FreeSail: the form of the British private signals (spec M7 §2; package 71, read against the
# Regulations by package 76; docs/design/Design-Signals.md). The recognition challenge and its
# reply, issued under seal and changed by the month. The Regulations and Instructions of 1806
# (docs/references/admiralty/, the 1808 printing) give their custody: a captain superseded
# delivers to his successor "all Signal Books and Instructions relating to them; all secret
# Signals, Rendezvous, &c. of which he is not to take, nor suffer to be taken, any copy", and a
# captain wrecked is "to preserve all secret Orders, Signals and Instructions or, if necessary,
# to destroy them, to prevent their falling into improper hands"; the Regulations print no
# table and no form of one. The period's letters and orders quote the form (from memory):
# "the private signal for the day ... a blue flag at the main topmast head, answered by a red
# at the fore"; by night lights and false fires. The actual tables were secret and are
# lost: the game's are MADE under the seed in this form (`freesail/world/signals.py` `private_table`: the world's seed, the
# nation, the year and the month seed the draw, so that two ships of one nation in one world
# hold the same table and a replay has it again). A captured table (74's prize) is the same
# draw for the captor, good until the month turns.
#
# Each `{slot}` is drawn from the pool of that name; `changes` says when the table turns.

source: "the form of the Admiralty's private signals as the period's orders quote them (from memory); their custody the Regulations and Instructions of 1806 (Captain, on being superseded and on shipwreck); the tables made under the seed"
made: true
changes: monthly
day:
  challenge: "a {flag} at the {place}"
  reply: "a {flag} at the {place}, with the ensign at the {ensign_place}"
  pools:
    flag: ["blue flag", "red flag", "white flag", "yellow flag", "blue and yellow flag", "red and white flag", "blue pendant", "red pendant", "white pendant", "Dutch jack", "union jack", "chequered flag"]
    place: ["main topmast head", "fore topmast head", "mizen peak", "fore yardarm", "main yardarm", "ensign staff", "mizen topmast head"]
    ensign_place: ["mizen peak", "ensign staff", "main topmast head"]
night:
  challenge: "{n} lights {arrangement} at the {place}"
  reply: "{n} lights {arrangement} at the {place}, and a false fire"
  pools:
    n: ["one", "two", "three"]
    arrangement: ["horizontal", "one over the other", "in a triangle"]
    place: ["mizen peak", "ensign staff", "main topmast head", "fore topmast head"]
# the ships that carry the table (judgement on the Regulations' custody: the King's ships
# and the hired armed vessels in the Navy's service; a merchantman, a packet, a privateer
# and a fisherman never had it)
carried_by: [kings-ship, cruiser, commodore]
answer_wait_s: 300   # the challenger waits five minutes for the reply before he reads none (judgement)
