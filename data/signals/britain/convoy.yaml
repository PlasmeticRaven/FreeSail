# FreeSail: the British instructions to merchantmen under convoy (spec M7 §3; package 71;
# docs/design/Design-Signals.md). The Admiralty's *Signals and Instructions for Ships under
# Convoy*, a short book of its own given to the masters, who never saw the fleet's book:
# the meanings from memory of its form (make sail, shorten sail, tack, wear, close round the
# commodore, the enemy in sight, anchor, the convoy to disperse, a ship to come within hail,
# the lights by night), the numbers and hoists MADE. A merchantman under a commodore's orders
# reads this book and no other; the commodore's ship reads both. Package 76 builds it out.
#
# The form is the numerary's (number, meaning, also, does, in_succession, qualifiers,
# source, made); the hoists are flags over a pendant by the convoy book's custom.

