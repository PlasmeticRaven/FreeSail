# FreeSail: the British signal flags drawn (package 102, step 2; docs/design/Design-Signals.md,
# "The signal flags drawn"). Every flag a hoist of the British books can hold, by the name the
# hoist holds it (`freesail/world/flags.py`, `hoist_flags`), each with its words, its drawing in
# colours.yaml's form (x along the fly from the hoist, y down from the head; a `poly`, a
# `shape`), the years it flew by that drawing (`dates`: a flag drawn otherwise in another year
# is another row of the same name; a year outside every row takes the nearest), and whether it
# was drawn from a page image (`mark: plate`) or is the builder's own (`made`), with its source.
# The numerals are four dated sets: Howe's of 1790, his flags in the 'new arrangement' of 1793
# (the 1796 book's leaf 31), the 1799 book's and the Admiralty's change of 1803 (Trafalgar's),
# all read from Perrin's Plate XIII in colour (docs/references/signals/pages/); after 1810 not
# found (the 1804-1810 set answers). Popham's leaf 13 has no figures: the telegraph flag is
# Perrin's words, its halves judgement. The flags are 2:3 as the plate draws them. A private
# table's plain flags are drawn in data/signals/basic/flags.yaml, read after this file.

nation: britain
sources:
  - "Perrin, British Flags, Cambridge 1922, Plate XIII (in colour) and pp. 168 to 181"
  - "the Admiralty's Signal-Book for the Ships of War, 1796, leaves 28, 29 and 31"
  - "Popham, Telegraphic Signals, 1803, leaf 13 (no figures)"
  - "Fisher, A Display of the Naval Flags of all Nations, Liverpool [1820], plate 8"
