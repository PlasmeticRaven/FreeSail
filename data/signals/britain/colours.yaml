# FreeSail: the British flags of command and identity (spec M7 §1; package 76, the owner's
# addition of 2026-11-07; docs/design/Design-Signals.md, "As built out", which gives the shape).
# The authority is Perrin's *British Flags* (Cambridge, 1922; the author the Admiralty's
# librarian; out of copyright; docs/references/signals/), with Babron's description of the
# flags of England (1817) and the 1820 display's plates for the colours. In 1805 a King's
# ship wore the ensign and the pendant of her admiral's squadron, red, white or blue, the jack
# at the bowsprit; a private ship not under an admiral's flag the red (the senior squadron's;
# judgement for the game, which gives a ship no admiral's squadron yet); a merchantman the red
# ensign; a privateer the red ensign and the red jack with the Union in its canton. The Union
# in the canton is that of 1 January 1801. Where each flew: at sea the ensign at the peak and
# at anchor at the staff (Babron: "toujours au-dessus de la poupe, soit à la gaule d'enseigne ou
# à la corne"), the pendant at the main; in action the ensigns doubled and the jack at the
# fore, as Roosevelt's account of the *Constitution* and the *Java* (1812; the period's
# practice) has it, a second ensign at the main topgallant masthead. The drawings are the
# builder's from the blazons in those words, x along the fly from the hoist and y down from
# the head; the proportions judgement where no page gives them.

nation: britain
sources:
  - "Perrin, British Flags, their early history, and their development at sea, Cambridge 1922 (the ensigns, the union flags and jacks, the pendants of command, the admirals' flags, the privateer's jack)"
  - "Babron, Précis des pratiques de l'art naval, Brest 1817 (the description of the flags of England; where the ensign flies)"
  - "Fisher, A Display of the Naval Flags of all Nations, Liverpool [1820] (the plates, for the colours)"
  - "Roosevelt, The Naval War of 1812, New York 1882 (the flags flown in action by the Constitution and the Java)"
