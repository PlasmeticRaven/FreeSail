# FreeSail: the British signal books' declaration (spec M7 §3; package 71, built out by
# package 76; docs/design/Design-Signals.md). Read by freesail/world/signals.py (`load_books`),
# which reads the five books beside this file in the one shape every nation's root has. A
# nation names its root in data/nations.yaml (`signals: {root: britain, system: well-built}`).
#
# The sources, each laid under docs/references/ and read on the page (the research pass is in
# docs/dev/TuningNotes.md, "Package 76"): the Admiralty's *Signal Book for the Ships of War* of
# 1799 is not online, so the day book's numbers are the 1799 book's where Jackson's *Logs of
# the Great Sea Fights* recorded the hoist at Copenhagen and Trafalgar, and the builder's own,
# marked, elsewhere, the meanings the 1796 edition's; the night book is the 1799 night book
# number for number; the fog book the 1796 book's; the dictionary Popham's of 1803 as printed;
# the convoy book's form the 1796 book's convoy signals and Millan's of 1748 (the period's own
# convoy book not found); the private signals' custody the Regulations of 1806. The flags below
# are the 1796 book's (leaf 31: the numeral flags 1 to 9 and the cypher 0, the substitute, the
# pendant that adds a hundred, the flag of truce) and Popham's (leaf 13: the preparative, the
# finishing flag, the affirmative, the numerical pendant; the cypher hoisted singly annuls the
# last signal). The private tables themselves were secret and are lost: the game's are drawn
# under the seed from the form in private.yaml (made).

nation: britain
system: well-built           # a book built from the nation's own sources, with a dictionary
sources:
  - "the Admiralty's Signal Book for the Ships of War, 1799: the numbers as hoisted at Copenhagen (1801) and Trafalgar (1805), Jackson, Logs of the Great Sea Fights vol. II, 1900"
  - "the Admiralty's Signal-Book for the Ships of War, Day and Fog, 1796 (the meanings, the flags, the fog signals)"
  - "the Admiralty's Night Signals and Instructions for the Conduct of Ships of War, 1799 (the night book)"
  - "Popham, Telegraphic Signals; or Marine Vocabulary, 1803 (the dictionary and the alphabet)"
  - "Howe's Explanatory Instructions of 1799, as Corbett prints them in Fighting Instructions 1530-1816, 1905 (what the signals ask a captain to do)"
  - "Signals for the Royal Navy and Ships under Convoy, Millan, 1748 (the convoy book's form)"
  - "Regulations and Instructions relating to His Majesty's Service at Sea, 1806 (the secret signals' custody)"
flags:
  numerals: 10               # the numeral flags 1 to 9 and the cypher 0 (the 1796 book, leaf 31)
  substitute: true           # the substitute, repeating the figure of the flag above it (the 1796 book, leaf 31)
  hundred_pendant: true      # the pendant that adds a hundred to the flags it flies with (the 1796 book, leaf 31)
  preparative: true          # the preparative (Popham 1803, leaf 13; Howe's instructions of 1799, art. III)
  telegraph: true            # Popham's telegraph flag over the numerals (1803)
  answering_pennant: true    # the answering pendant (Popham 1803, leaf 13: "private ships may either answer with this pendant, or the affirmative")
  annul: true                # the cypher hoisted singly annuls the last signal (Popham 1803, leaf 13)
  truce: true                # the flag of truce (the 1796 book, leaf 31)
hoist_s: 60                  # a hoist bent and run up: a minute (Popham's own reckoning of a minute or more a hoist; judgement for the figure)
read_s: 60                   # the minute to find it in the book at the other end (judgement)
read_nm: 2.0                 # the flags made out by eye at the colours' distance (freesail/world/ships.py COLOURS_MADE_OUT_NM; the numeral flags of 1799 the size of an ensign, judgement)
glass_factor: 1.5            # the glass aloft reaches further by this (ships.GLASS_FACTOR)
flies_s: 1800                # a numerary signal left flying at most a glass before it is hauled down of itself (judgement)
