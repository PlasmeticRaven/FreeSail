# FreeSail: the British numerary signal book, the day signals (spec M7 §3; package 71;
# docs/design/Design-Signals.md). Howe's 1790 book and the Admiralty's Signal Book for the
# Ships of War of 1799, from memory: the meanings are the books' (the orders by which the
# squadrons and convoys of 1805 were worked); the numbers are the 1799 book's where the
# builder remembers them with confidence (1, 13, 16, 63, 72, 76: Trafalgar's own signals)
# and the builder's own where not, each such entry marked `made: true`. Package 76 builds
# the book out against the printed edition and corrects the numbers.
#
# Each entry: `number` the hoist; `meaning` the words the log writes beside it and the
# words `make the signal <meaning>` matches (`also` more words for the same); `does` what a
# rules captain under the sender's orders does on reading it (docs/design/Design-Signals.md:
# `{order: <an order of the dialect>}` with `{compass}`, `{number}` or `{place}` filled from
# the qualifiers, `{state: <a state of his machine>}`, `{news: true}` logged and raised as
# an event, `{answer: <word>}` an answer to a signal, `{closer: true}` the engaging range
# halved, `{release: true}` the ship let go from the sender's orders); `in_succession:
# true` the ships under orders performing it one after another, the leader first;
# `qualifiers` what the hoist takes after it (compass, number, ship, place); `source`.

entries:
