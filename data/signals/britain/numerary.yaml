# FreeSail: the British numerary signal book, the day signals (spec M7 §3; package 71, built
# out by package 76; docs/design/Design-Signals.md). The Admiralty's *Signal Book for the
# Ships of War* of 1799, the book Copenhagen and Trafalgar were fought under. Its printed
# copies are not online (Corbett, *Signals and Instructions 1776-1794*, 1908, App. F Nos. 124
# to 127, places them in the Royal United Service Institution, the Admiralty Library, the
# Record Office and the British Museum), so **the numbers are the 1799 book's where the logs
# recorded the hoist**: Jackson's *Logs of the Great Sea Fights* vol. II (1900; filed under
# docs/references/jackson/), whose editor glossed each number from the book, gives 13, 14,
# 16, 39, 50, 58, 62, 63, 66, 72, 76, 82, 84, 88, 99, 101, 102, 108, 109, 131, 180, 186, 200,
# 213, 239, 240, 241, 251, 307, 312, 314, 318, 344 and 370 (No. 19 there is the night book's,
# in night_fog.yaml). Every other entry's number is the builder's own and marked `made:
# true`. Where the meaning is the Admiralty's 1796 *Signal-Book for the Ships of War, Day
# and Fog* (docs/references/signals/; its numbers are Howe's before 1799 and not the 1799
# book's: Corbett, *Fighting Instructions*, 1905, p. 254, "though the numbers were changed,
# the alterations were of no great importance"), its 1796 number is cited; the rest are
# meanings in the period's form not traced to a page, the builder's. No. 1, "enemy in
# sight", is No. 1 in the 1796 book too, but no page of 1799 gives it: it stays marked. Where package 76
# found a made number to be the 1799 book's for another signal, the made entry moved to a
# number of its own above 150, its source saying where it stood before.
#
# Each entry: `number` the hoist; `meaning` the words the log writes beside it and the
# words `make the signal <meaning>` matches (`also` more words for the same); `does` what a
# rules captain under the sender's orders does on reading it (docs/design/Design-Signals.md:
# `{order: <an order of the dialect>}` with `{compass}`, `{number}` or `{place}` filled from
# the qualifiers, `{state: <a state of his machine>}`, `{news: true}` logged and raised as
# an event, `{answer: <word>}` an answer to a signal, `{closer: true}` the engaging range
# halved, `{release: true}` the ship let go from the sender's orders); `in_succession:
# true` the ships under orders performing it one after another, the leader first;
# `qualifiers` what the hoist takes after it (compass, number, ship, place); `source`.

