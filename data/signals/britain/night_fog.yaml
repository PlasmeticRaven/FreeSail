# the fog signals a ship keeps of herself, by the custom and the Regulations (from memory;
# the figures judgement): at anchor the bell rung at intervals, under way a gun at intervals
# when in company, else muskets or the drum; `keep the fog signals` begins them, the lookout
# of another ship hears them within the mile (the bell) or three (the gun)
keeping:
  at_anchor: {do: "ring the bell", every_s: 120, source: "the custom at anchor in a fog (Falconer, Luce 1884 ch. XXXII on fog signals under the older usage; the two minutes judgement)"}
  under_way: {do: "fire a gun", every_s: 1800, source: "the Regulations' gun every half hour for a fleet in a fog (from memory; judgement)"}
  under_way_alone: {do: "beat the drum", every_s: 300, source: "a ship alone beats the drum or fires muskets rather than powder by the gun (the custom; judgement)"}
