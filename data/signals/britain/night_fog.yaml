# FreeSail: the British night and fog signals (spec M7 §3, §5; package 71, built out by
# package 76; docs/design/Design-Signals.md).
#
# THE NIGHT BOOK is the Admiralty's *Night Signals and Instructions for the Conduct of Ships of
# War* of 1799, number for number (docs/references/signals/, read on the page images of its
# table, leaves 24 to 36): seventy signals, each made by guns, lights and a rocket or false
# fire in the columns the book prints, the lights shewn abreast or one over the other as its
# figures draw them. In the presence of an enemy the book makes some of them by lights alone,
# in the figures of leaves 38 and 39 (Nos. 8, 20, 22, 30, 31, 34, 40, 42, 47 and the rest);
# the game makes every night signal by its guns, lights and fires. The game's own words for a
# signal (`also`) are added beside the book's meaning, which is the page's.
#
# THE FOG BOOK is the fog signals of the Admiralty's *Signal-Book for the Ships of War, Day and
# Fog*, 1796 (leaves 75 and 76), Nos. 1 to 18: guns slow and quick, drums and bells. The 1799
# fog book was not found (the night book of 1799 has no fog section; asked of the owner's
# shelf); the gun counts are written by hand into the printed blanks of the copy scanned, and
# are taken as written. The answers are by horns, conchs, drums or bells according to the
# tack, or muskets.
#
# Entries marked `made: true` are meanings the game's orders want and neither book has as a
# signal (a night or fog signal to tack in succession, to discontinue the action, the private
# signal by night): kept in the period's form with no number, the builder's own.
#
# `show` is what is shown, burnt or fired by night, `fire` what is fired or sounded in fog;
# `does` as the numerary's.

source: "Night Signals and Instructions for the Conduct of Ships of War, 1799 (the night book); the Signal-Book for the Ships of War, Day and Fog, 1796, its fog signals (the fog book); the Regulations and Instructions 1806 for the bell at anchor and the lights of ships in company (from memory)"

