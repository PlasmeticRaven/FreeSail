# FreeSail: the British telegraphic dictionary (spec M7 §3; package 71;
# docs/design/Design-Signals.md). Sir Home Popham's *Telegraphic Signals or Marine
# Vocabulary* (1800; the 1803 edition in use at Trafalgar), from memory: with the telegraph
# flag over the numerals the hoist is a word of the dictionary, numbered in alphabetical
# order, and a word the book lacks is spelt letter by letter from the alphabet (1 to 25, J
# wanting and V before U). The eight numbers known by heart from the twelve hoists of 21
# October 1805 are the book's (do 220, England 253, every 261, expects 269, his 370, man
# 471, that 863, will 958; 'duty' was spelt D U T Y, 4 21 19 24); every other number here is
# MADE between them in the book's alphabetical order, and the vocabulary is a few hundred
# words chosen for what a squadron, a chase and a convoy say, out of Popham's three
# thousand. Package 76 builds it out against the printed edition. Written by the
# generator in the package's scratch (the numbers' spread), kept as data.

