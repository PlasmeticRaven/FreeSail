# FreeSail: the British telegraphic dictionary (spec M7 §3; package 71, built out by package
# 76; docs/design/Design-Signals.md). Sir Home Popham's *Telegraphic Signals; or Marine
# Vocabulary*, London, 1803 (docs/references/signals/, the New York Public Library's copy on
# the Internet Archive): the edition of the Trafalgar year. With the telegraph flag over the
# numerals the hoist is a word of the dictionary; a word the book lacks is spelt letter by
# letter from the table of figures, letters and flags (leaf 13: 1 to 25, I and J one figure
# at 9, V at 20 before U at 21; 10 the cipher, which hoisted singly annuls the last signal,
# 11 the substitute). The words are numbered from 26 ("Able") in the book's first part (26 to
# 999, the original edition's) and its second (1000 to 1999); each is written here as the
# book prints it, the head and its endings ("Expect-ed-ing-ation"), and the loader reads every
# form the endings make (`signals.word_forms`). The third part (the sentences and the names
# of places, 2000 and up) is not here: the engine spells a sentence word by word.
#
# The words were read from the page images twice over (the Archive's OCR and a fresh one of
# each leaf, column by column) and each kept only where its head is an English word and its
# first letter is the one the book's margin index gives its number ("A 26 to 90 ... Z 996 to
# 998"): 1444 words of the two parts. Left out: 158 numbers whose reading failed
# those checks, and the numbers the book left blank for the owner's own words (this copy's
# are written in by hand and not taken). The eight words of 21 October 1805 are the book's:
# England 253, expects 269, that 863, every 261, man 471, will 958, do 220, his 370; "duty"
# was spelt, 4 21 19 24.

