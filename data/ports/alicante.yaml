# FreeSail: Alicante as a port (package 101, beside the Catalan coast's block), on package
# 35's machinery; the marks are the features file's
# (data/charts/features/mediterranean-west.yaml, at its end: Alicante lies in the
# Mediterranean west's region and has no harbour patch, the tool adding none to a built
# region without rebuilding its level-2 tiles).
#
# Sources. Tofino 1787, Derrotero del Mediterraneo, pp. 93 to 98: the bay, more properly a
# road, its capes leaving the regular anchorage open from ENE to S by SW, but the holding
# good, weed and sand, and no ground swell, so that one rides well with the winds of the
# second and third quadrants and much better with the opposite, the mountains sheltering;
# moor NE and SW about a mile from the land in 12 to 6 brazas, even to 2 or 3 brazas S by
# SE or SSE of the castle of Santa Barbara, the gate of the mole open; the castle in
# latitude 38 20 41 by five meridian altitudes; the Isla Plana or New Tabarca, peopled in
# 1768 by Genoese ransomed from Algiers, and the shoal a mile east of it that the old charts
# put in the channel. Purdy 1826, p. 21: the pier admits small craft only, large vessels
# anchoring without in about 7 fathoms; the fourth commercial city of Spain; the exports
# soap, wine, wool, fruit, salt, barilla, kermes, aniseed. Norie 1831, p. 24. Michelot 1709,
# OCR l. 1853 to 1885: the castle's white walls seen from afar; a bit of mole for landing
# only; the land refuses the wind.
#
# The datum: UNVERIFIED (Heather's 'Bay of Alicant' of 1814 is read and not transcribed, CC
# BY-NC-SA); the chart's depths are EMODnet's, the modern port the grid's land. No gauge:
# Alicante is neither in TICON nor in REDMAR's station list (INT_3.pdf). The world's tide
# here is the Mediterranean west's gauges' blend.
#
# The stance: Spain's (the nations table), hostile to a King's ship from 12 December 1804
# (James 1837, vol. 3, p. 200); never taken by the French (FROM MEMORY), so undated. The
# nations table's wars are one year's picture (see barcelona.yaml's head). Prices FROM
# MEMORY or JUDGEMENT, in sterling.

id: alicante
name: Alicante
nation: spain
source: "Tofino 1787 pp. 93-98; Purdy 1826 p. 21; Norie 1831 p. 24; Michelot 1709 OCR l. 1853-1885"
datum: unverified   # no period sheet read with its datum; the modern port is the grid's

outer_road:
  feature: alicante-road
  name: the road of Alicante
  lat_deg: 38.3290
  lon_deg: -0.4750
  depth_fathoms: 8
anchorage:
  feature: alicante-road
  name: the road of Alicante
  lat_deg: 38.3290
  lon_deg: -0.4750
mooring:
  feature: alicante-road
  name: off the mole of Alicante
  lat_deg: 38.3290
  lon_deg: -0.4750
  depth_fathoms: 8
  bottom: weed and sand
shore:
  feature: santa-barbara-castle
  name: the mole of Alicante
  lat_deg: 38.3450
  lon_deg: -0.4830

pilot:
  station: alicante-road
  cruising_nm: 3                 # judgement
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: the pilots' falucho of Alicante
    under: a lateen sail and oars
    note: "judgement"
  names: [Pastor, Soler, Ivorra, Carratala, Pomares, Llorca, Ripoll]   # judgement
  skill: 0.85
  fee_pounds: 2                  # judgement; unverified
  cast: starboard
  course_out_deg: 160            # out to the south-south-east (judgement)
  words:
    channel: "The road is open water between Cape de la Huerta and Cape Santa Pola, twenty brazas midway. Do not take a great ship inside the Isla Plana; the shoal is a mile east of it, not in the channel as the old charts have it."
    marks: "The castle of Santa Barbara on its white bare hill over the city, seen far off by its walls; Cape de la Huerta low to the east; Cape Santa Pola high and flat to the south, the Isla Plana beyond it."
    anchorage: "Moor north-east and south-west about a mile from the land in eight brazas, weed and sand, the castle bearing north by west and the gate of the mole open. Open from east-north-east round to south, but the holding is good and there is no ground swell."
    tide: "No tide to speak of."

tide:
  establishment: Cartagena
  enter_on: flood
  leave_on: ebb

market:
  currency: pounds
  goods:
    - {good: barilla, price: 10, origin: spain, note: "exported (Purdy 1826, p. 21; Norie 1831, p. 24); the price JUDGEMENT, cheap against Barcelona's"}
    - {good: wine, price: 22, origin: spain, note: "exported (Purdy 1826, p. 21); JUDGEMENT"}
    - {good: soap, price: 40, origin: spain, note: "exported (Purdy 1826, p. 21); JUDGEMENT"}
    - {good: salt, price: 7, origin: spain, note: "exported (Purdy 1826, p. 21), loaded at Santa Pola and La Mata (Michelot 1715, OCR l. 1403 to 1409); JUDGEMENT"}
    - {good: raisins, price: 32, origin: spain, note: "fruit exported (Purdy 1826, p. 21); the kind FROM MEMORY"}
    - {good: aniseed, price: 50, origin: spain, note: "exported (Purdy 1826, p. 21); JUDGEMENT"}
    - {good: wool, price: 60, origin: spain, note: "exported (Purdy 1826, p. 21); JUDGEMENT"}
    - {good: wheat, price: 30, origin: null, note: "JUDGEMENT"}
    - {good: salt fish, price: 30, origin: null, note: "JUDGEMENT"}
    - {good: biscuit, price: 30, origin: spain, note: "JUDGEMENT"}
    - {good: olive oil, price: 42, origin: spain, note: "JUDGEMENT"}

dockyard:
  kind: chandlers
  items:
    - {item: topmast, hours: 18, pounds: 52, note: "judgement"}
    - {item: cordage, hours: 3, pounds_per_fathom: 0.06, note: "judgement"}
    - {item: water, hours_per_ton: 0.2, pounds_per_ton: 0.1, note: "judgement"}
    - {item: provisions, hours_per_day: 0.05, pounds_per_man_day: 0.05, note: "judgement"}

crew_pool:
  # judgement: the Matricula de Mar takes the coast's seamen for the King of Spain's ships
  able: {hands: 2, pounds: 2, delay_h: 24}
  ordinary: {hands: 5, pounds: 1.5, delay_h: 24}
  landsman: {hands: 10, pounds: 1, delay_h: 12}

closed_to: []
