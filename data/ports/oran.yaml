# FreeSail: Oran with Mers-el-Kebir as a port (spec M6 §26; package 79c, the Mediterranean
# west's block), on package 35's machinery; the marks are the features file's
# (data/charts/features/mediterranean-west.yaml).
#
# Sources. Tofiño 1787, Derrotero del Mediterráneo, 'Punta de Mazalquivir', 'Castillo de
# Santa Cruz', pp. 147 to 148 (surveyed while Oran was Spain's): S 66° E five miles from
# Cape Falcón the point of Mers-el-Kebir and the castle of Almansa with its lantern at the
# end; south of the point the harbour of that name, good for every kind of vessel, moored
# NW and SE with the backing anchor that way in 20 to 16 brazas, sand and weed, for ships of
# the line, in less or with a hawser ashore for xebecs; the south-west wind, the
# 'Polvorista', blows very hard down the valley, so that the anchors must be backed, for
# they drag; the castle of Santa Cruz on its hill, the town at its foot, a level mountain
# (the Meseta) west of it for its knowledge, and Mount San Agustín inland to the east; in
# fine weather a ship may anchor off Oran to land her cargo at the little beach of the
# Blanquillo. Purdy 1826, p. 323 ('Marsa Kibbeer'); Bérard 1837, pp. 172 to 174.
#
# The datum: UNVERIFIED. No period sheet is patched at Oran in this package (Roux's plate 48
# read and not transcribed, CC BY-NC-SA); the chart's depths are EMODnet's at the lowest
# astronomical tide, the modern ports of Oran and Mers-el-Kebir in the grid.
#
# The stance. Oran and Mers-el-Kebir were Spain's until 1792 and are the regency of
# Algiers' in 1805 (the nations table, `algiers`; the Bey of the West at Oran under the Dey,
# FROM MEMORY): at peace with Britain, neutral to a King's ship, as to every flag the table
# has. The regency's corsairs are noted here and not modelled (the brief). Prices FROM
# MEMORY or JUDGEMENT, sterling at the exchange.

id: oran
name: Oran
nation: algiers
source: "Tofiño 1787 pp. 147-148 (Mers-el-Kebir's harbour, the Polvorista, Santa Cruz, the Blanquillo); Purdy 1826 p. 323; Bérard 1837 pp. 172-174"
datum: unverified

