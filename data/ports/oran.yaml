    under: a lateen sail and oars
    note: "judgement"
  names: [Hamet, Ali, Mustafa, Hassan, Ibrahim, Yusuf, Omar, Salah]   # judgement
  skill: 0.8
  fee_pounds: 1                  # judgement; unverified
  cast: starboard
  course_out_deg: 45             # out of the bay to the north-east (judgement)
  words:
    channel: "The point of Mers-el-Kebir lies five miles east-south-east of Cape Falcón, the castle on it with its lantern at the end; round it and the harbour opens to the southward, good for every kind of vessel."
    marks: "The castle of Mers-el-Kebir on its point; the castle of Santa Cruz on its hill over Oran with the town at its foot; the level mountain west of it, and Mount San Agustín inland to the east."
    anchorage: "A ship of the line moors north-west and south-east in twenty to sixteen brazas, sand and weed, south of the point; back your anchors, for the south-wester they call the Polvorista blows very hard down the valley and they drag. In fine weather you may lie off Oran to land at the Blanquillo."
    tide: "There is no tide; inshore from Oran the current runs to the westward toward the Strait."

