# FreeSail: Marsa Scirocco (Marsaxlokk) as a port (package 105, Sicily and Malta's block), on package 35's
# machinery; the marks are the features file's (data/charts/features/sicily.yaml, the harbour patch marsaxlokk).
# Step 2 of the package.
#
# Sources. Purdy 1826, p. 166: a very safe harbour except in southerly winds, which seldom blow home; good holding in 5 to 15 fathoms, the north-east side the safest; ships of the line outside in 20 to 22 fathoms; the Benhisa reef a mile S S E 1/2 E by compass from Benhisa tower, 3 to 9 fathoms, the passage inside it unsafe; St Lucian's castle N by W 1/2 W by compass the leading mark. Norie 1831, p. 146. Lamberti 1844, p. 197.
#
# The holder, dated (decision 66): the Order of St John's to 12 June 1798, France's to the
# blockade's beginning (12 October 1798), when the country outside Valletta's walls was in
# arms against the French, and the King's after (James 1837, vol. 2, pp. 170, 211 to 213
# and 445); the holder outside the walls during the blockade JUDGEMENT. No yard: the
# merchants' stores and Valletta's yard at hand. Prices FROM MEMORY or JUDGEMENT, in
# sterling; Malta's trade (Purdy 1826, pp. 159 to 160) with the small place's own.

id: marsaxlokk
name: Marsa Scirocco
nation:
  - {nation: order-of-st-john, until: 1798-06-11, source: "the Order of St John's from 1530 (Purdy 1826, p. 157)"}
  - {nation: france, since: 1798-06-12, until: 1798-10-11, source: "the islands surrendered to the French on 12 June 1798 (James 1837, vol. 2, p. 170)"}
  - {nation: britain, since: 1798-10-12, source: "the country outside Valletta's walls in arms against the French and the blockade effective from 12 October 1798 (James 1837, vol. 2, pp. 211 to 213; Nicolas 1845, vol. 1, p. 12); the island the King's after the capitulation of 5 September 1800 (vol. 2, p. 445); the holder outside the walls during the blockade JUDGEMENT (the Maltese in arms under Neapolitan colours, with Ball's British and the Portuguese)"}
source: "Purdy 1826 p. 166; Norie 1831 p. 146; Lamberti 1844 p. 197; James 1837 vol. 2 pp. 170, 211-213, 445"
datum: unverified   # no period sheet read with its datum; the modern shore is the grid's

outer_road:
  feature: marsaxlokk
  name: the bay of Marsa Scirocco
  lat_deg: 35.8322
  lon_deg: 14.5539
  depth_fathoms: 9
anchorage:
  feature: marsaxlokk
  name: Marsa Scirocco, the north-east side
  lat_deg: 35.8322
  lon_deg: 14.5539
mooring:
  feature: marsaxlokk
  name: Marsa Scirocco, the north-east side
  lat_deg: 35.8322
  lon_deg: 14.5539
  depth_fathoms: 9
  bottom: good holding ground
shore:
  name: the landing at Marsa Scirocco
  lat_deg: 35.8410
  lon_deg: 14.5440

pilot:
  station: marsaxlokk
  cruising_nm: 2
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: a fishing boat of Marsa Scirocco
    under: oars and a lateen sail
    note: "judgement"
  names: [Michele Zammit, Paolo Farrugia, Antonio Grech, Lorenzo Vella]   # judgement
  skill: 0.8
  fee_pounds: 1.5                  # judgement; unverified
  cast: starboard
  course_out_deg: 150            # judgement
  words:
    channel: "Keep outside the Benhisa reef, three fathoms on it a mile off the point: the passage inside is not safe. Bring St Lucian's castle north by west half west by compass and run in."
    marks: "St Lucian's castle at the head of the bay; the tower on Benhisa point to the south; Delimara point on the north side."
    anchorage: "Five to fifteen fathoms of good holding ground, the north-east side the safest; a ship of the line lies outside the shoal in twenty fathoms. Only a southerly blowing home troubles the bay."
    tide: "No tide to speak of; the current outside sets to the southward and eastward."

tide:
  establishment: Valletta
  enter_on: flood
  leave_on: ebb

market:
  currency: pounds
  goods:
    - {good: cotton, price: 40.0, origin: null, note: "Malta's chief export (Purdy 1826, pp. 159 to 160); the price JUDGEMENT, cheap"}
    - {good: oranges, price: 8.0, origin: null, note: "oranges and lemons exported (Purdy 1826, p. 160); the price JUDGEMENT"}
    - {good: stone, price: 3.5, origin: null, note: "Maltese stone exported (Purdy 1826, p. 160); the price JUDGEMENT"}
    - {good: honey, price: 40.0, origin: null, note: "honey exported (Purdy 1826, p. 160); the price JUDGEMENT"}
    - {good: wheat, price: 23.0, origin: naples, note: "Malta grows corn for a third of its people and buys the rest, from Sicily (Purdy 1826, p. 159; Smyth 1854, p. 33: the corn lasts five months); the price JUDGEMENT, dear"}
    - {good: wine, price: 30.0, origin: naples, note: "imported (Purdy 1826, p. 159); the price JUDGEMENT"}
    - {good: olive oil, price: 52.0, origin: naples, note: "imported (Purdy 1826, p. 159); the price JUDGEMENT, dear"}
    - {good: brandy, price: 60.0, origin: null, note: "imported (Purdy 1826, p. 159); the price JUDGEMENT"}
    - {good: timber, price: 26.0, origin: naples, note: "wood dear, all of it from Sicily (Purdy 1826, p. 165); the price JUDGEMENT"}
    - {good: fresh beef, price: 18.0, origin: null, note: "beef 4d. a pound in 1821 (Smyth 1854, p. 104); Gozo fattens cattle for Malta (Purdy 1826, p. 162); the price JUDGEMENT"}
    - {good: fresh fish, price: 5.0, origin: null, note: "fish abundant and cheap (Purdy 1826, p. 158); the price JUDGEMENT"}
    - {good: biscuit, price: 24.0, origin: null, note: "flour 2 1/2d. a pound in 1821 (Smyth 1854, p. 104); the price JUDGEMENT"}
    - {good: vegetables, price: 4.0, origin: null, note: "JUDGEMENT"}

dockyard:
  kind: chandlers
  items:
    - {item: topmast, hours: 30, pounds: 70, note: "a spar from the merchants' stores, the wood all from Sicily (Purdy 1826, p. 165); judgement"}
    - {item: cordage, hours: 4, pounds_per_fathom: 0.08, note: "judgement"}
    - {item: water, hours_per_ton: 0.15, pounds_per_ton: 0.1, note: "water in any quantity, filled in the boats by hose from pipes at the wharf (Purdy 1826, p. 165; Norie 1831, p. 144); judgement"}
    - {item: provisions, hours_per_day: 0.05, pounds_per_man_day: 0.05, note: "judgement"}

crew_pool:
