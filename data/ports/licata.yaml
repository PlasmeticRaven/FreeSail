pilot:
  station: licata-road
  cruising_nm: 2
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: a boat of Alicata
    under: oars and a lateen sail
    note: "judgement"
  names: [Angelo Cammilleri, Rosario Licata, Giuseppe Peritore, Vincenzo Incorvaia]   # judgement
  skill: 0.75
  fee_pounds: 1.5                  # judgement; unverified
  cast: starboard
  course_out_deg: 200            # judgement
  words:
    channel: "Stand in by the lead, bringing the flagstaff of the sea castle well east of the Fonducello hillock. The Salso has a bar of nearly a mile before its mouth with a heavy surf in southerly winds; the bank off Point Tenda has seven fathoms and slight overfalls."
    marks: "Alicata under its hill, the old Ecnomus; the sea castle with its flagstaff and the upper castle; the round white tower of Palu on the brow of the hill to the west."
    anchorage: "About a mile south-west of the town in seven to twelve fathoms, eight and a half of mud the berth; buoy the cables in light winds. In winter the road is open to every wind from east round south to west."
    tide: "No tide to reckon on: the currents of this coast rise a foot or two with the wind, a north-wester setting them strongly to the south-east."

tide:
