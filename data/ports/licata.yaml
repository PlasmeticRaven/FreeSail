# FreeSail: Alicata as a port (package 105, Sicily and Malta's block), on package 35's
# machinery; the marks are the features file's (data/charts/features/sicily.yaml, the
# harbour patch licata). Step 3 of the package.
#
# Sources. Smyth 1824, pp. 199 to 200 and App. p. xxi: nearly eleven thousand people, a considerable caricatore for grain and sulphur, two tolerable forts and decayed walls; no port, nowhere on the south-east coast is the want of one felt more (his plan of a mole on the two reefs offered at Palermo); vessels anchor about a mile S W of the town in seven to twelve fathoms of good clay, exposed in winter to all winds from east to west round southerly; the berth eight and a half fathoms of mud a mile off (Purdy 1826, p. 155); the flagstaff of the sea castle well east of the Fonducello hillock coming in; cables buoyed in light winds; Port Nicolo for small craft; the Salso's bar. Lamberti 1844, p. 194: grain loaded.
#
# The holder: the King of the Two Sicilies' (`naples`) throughout, the court at Palermo from
# December 1798 to 1799 and again from January 1806 (James 1837, vol. 2, p. 214; vol. 4, p.
# 122), when the mainland was French and Sicily the Bourbons' (the lead's ruling of
# 2026-11-12: Sicily's ports under `naples` without rows). NOTE: the nations table's wars
# carry no dates and read Naples at peace with France every year (data/nations.yaml), so
# nothing here depends on Bourbon Sicily's wars after 1806.
#
# No source on file names a pilot here: the boat and its people JUDGEMENT.
# Prices FROM MEMORY or JUDGEMENT, in sterling.

id: licata
name: Alicata
nation: naples
source: "Smyth 1824 pp. 199-200, App. p. xxi; Purdy 1826 pp. 154-155; Norie 1831 p. 131"
datum: unverified   # no period sheet read with its datum; the modern shore is the grid's

