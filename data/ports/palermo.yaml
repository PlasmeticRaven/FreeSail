# FreeSail: Palermo as a port (package 105, Sicily and Malta's block), on package 35's
# machinery; the marks are the features file's (data/charts/features/sicily.yaml, the
# harbour patch palermo). Step 3 of the package.
#
# Sources. Smyth 1824, pp. 66 to 96 and App. pp. iv to v: the gulf five miles deep and clear of danger, the squalls off Mondello; the mole of nearly a quarter of a mile from the arsenal into nine and ten fathoms, its light very defective (p. 70); the road off the mole and the city in sixteen to twenty-five fathoms, nineteen of stiff clay half a mile off the best, moored with an open hawse to the north-east, a ship parting in a north-easter lost on the reef under the citadel; inside the mole the inner port the arsenal's, with its naval stores and the prisons of the galley slaves, the centre rocky and shallow; the Cala for small craft and vessels of two hundred tons in summer, the pratique office on its east side; water at the quay by hoses into the boats; provisions of every kind; the lazaretto at Acqua Santa under Mount Pellegrino (p. 71); nearly a hundred and eighty thousand people (p. 73). Purdy 1826, pp. 129 to 131; Norie 1831, pp. 121 to 122: the trade not extensive, silk and satin for Malta, wine, oil and tunny out, every luxury in. Lamberti 1844, p. 186 (after the period): weed and mud in five and six braccia at the mole's entrance.
#
# The holder: the King of the Two Sicilies' (`naples`) throughout, the court at Palermo from
# December 1798 to 1799 and again from January 1806 (James 1837, vol. 2, p. 214; vol. 4, p.
# 122), when the mainland was French and Sicily the Bourbons' (the lead's ruling of
# 2026-11-12: Sicily's ports under `naples` without rows). NOTE: the nations table's wars
# carry no dates and read Naples at peace with France every year (data/nations.yaml), so
# nothing here depends on Bourbon Sicily's wars after 1806.
#
# Decision 68 (the lead's note of 2026-11-12): Smyth 1824, App. p. v, has the arsenal's inner
# port with "prisons for the galley slaves" (Purdy 1826, p. 131; Norie 1831, p. 122), and
# says at Girgenti (p. 203) that these are convicts condemned to hard labour, called galley
# slaves from their former chaining as rowers in the galleys. The marks' words say so. No
# good or scenario is built on it.
#
# No source on file names a pilot here: the boat and its people JUDGEMENT.
# Prices FROM MEMORY or JUDGEMENT, in sterling.

