pilot:
  station: palermo-road
  cruising_nm: 2
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: a boat of the Cala
    under: oars and a lateen sail
    note: "judgement"
  names: [Giuseppe Lo Cascio, Salvatore Amato, Francesco Lo Verde, Antonino Cusimano, Pietro Mangano]   # judgement
  skill: 0.75
  fee_pounds: 1.5                  # judgement; unverified
  cast: starboard
  course_out_deg: 40            # judgement
  words:
    channel: "The gulf is five miles deep and clear of danger; mind the squalls between Cape di Gallo and Mount Pellegrino, and the tunny nets, strong enough to stop a ship under sail. Brush the mole-head going in."
    marks: "Mount Pellegrino over the mole; the light and battery on the mole-head; the city's domes along the Conca d'Oro, Monreale above it. The inner port is the arsenal's, with its naval stores and the prisons of the convicts they call galley slaves, who were once chained to the galleys' oars."
    anchorage: "In the road, nineteen fathoms of stiff clay half a mile off the city: moor small bower to the north-west and best to the south-south-east with an open hawse to the north-east, for a ship parting in a north-easter goes on the reef under the citadel. Within the mole, the best bower to the south-west and the stern hauled close to the pier; the middle is rocky and shoal."
    tide: "Hardly any tide: the water sets eastward along the coast, and rises and falls with the weather more than the moon, seldom twenty inches."

