# FreeSail: Saffi, or Asfee (package 106b, Morocco's Atlantic coast), on package 35's
# machinery; the marks are the features file's (data/charts/features/morocco-sallee.yaml).
#
# Sources. Purdy 1825, p. 154: the antient town in lat 32 20 between two hills; the road
# safe in summer, but in winter with the wind south or south-west vessels are frequently obliged
# to make off to sea; the bay nearly three leagues wide; the summer road with the North point and
# its low tower a little north of N.N.E. and the high castle S.E. by E. or S.E., in 16 to 18
# fathoms, fine grey sand; within in 15 fathoms; in winter anchor farther out in 20 or 22
# fathoms; you may boldly run into the summer roads by night with the castle E. by S. or East;
# from the northward keep well west of Cape Cantin for its rocks; the country abounds in corn,
# two falls of rain a year enough to ripen it. Jackson 1809, l. 4634 to 4692: once a place of
# considerable trade, particularly in corn; its people inimical to Europeans, till lately
# Christians found it an unpleasant residence; the Portuguese quitted it in 1641; vessels he has
# known run to sea several times in a month while loading; l. 3728: 12,000 people.
#
# The datum: UNVERIFIED (no period plan read). Dated rows (decision 67, package 105's form;
# decision 69): the market's corn shipped abroad until Soliman's accession and cheap at home
# after his prohibition of the export of grain (Jackson 1809, l. 4524 to 4533: the land lying
# fallow, corn so cheap after 1800 that husbandmen let their crops stand; the day FROM MEMORY,
# UNVERIFIED), as Mazagan's. Prices FROM MEMORY or JUDGEMENT, in sterling.

id: safi
name: Saffi
nation: morocco
source: "Purdy 1825, p. 154; Jackson 1809, l. 4634 to 4692"
datum: unverified

outer_road:
  feature: safi-road
  name: the summer road of Saffi
  lat_deg: 32.3039
  lon_deg: -9.2746
  depth_fathoms: 16
anchorage:
  feature: safi-road
  name: the summer road of Saffi
  lat_deg: 32.3039
  lon_deg: -9.2746
mooring:
  name: the inner road
  lat_deg: 32.3011
  lon_deg: -9.2582
  depth_fathoms: 5
  bottom: fine grey sand
  deep_draught_ft: 18    # JUDGEMENT: the inner road, closer in than Purdy's 15 fathoms (the grid's 10 m)
shore:
  feature: safi
  name: the beach under the castle
  lat_deg: 32.2990
  lon_deg: -9.2410

pilot:
  station: safi-road
  cruising_nm: 2                 # judgement
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: a boat of the beach
    under: oars
    note: "judgement"
  names: [Hamet, Ali, Mohammed, Abdallah, Yusuf, Kasem, Larbi, Tahar]   # judgement
  skill: 0.8
  fee_pounds: 1                  # judgement; unverified
  cast: starboard                # judgement
  course_out_deg: 290            # out to the west-north-west, judgement
  words:
    channel: "Coming from the northward keep well to the westward of Cape Cantin for the rocks about it; the bay is open, and you may run boldly into the summer road by night with the castle east by south or east."
    marks: "The town between its two hills, the high castle over it; the low tower on the North point of the bay; the land north of the bay high and uneven, south of it a level plain."
    anchorage: "In summer anchor with the North point a little north of north-north-east and the castle south-east by east, sixteen to eighteen fathoms, fine grey sand. In winter lie out in twenty or twenty-two fathoms, and put to sea when it blows from the south or south-west."
    tide: "No tide to speak of in the road; the current runs south-south-west along the coast."

tide:
  enter_on: flood

market:
  - market:
      currency: pounds
      goods:
        - {good: wheat, price: 11, origin: morocco, note: "Purdy 1825 p. 154 and Jackson 1809 l. 4686 to 4692: the country abounds in corn; a place of considerable trade in it; the price, with the shippers' demand, JUDGEMENT"}
        - {good: barley, price: 5, origin: morocco, note: "JUDGEMENT"}
        - {good: wax, price: 70, origin: morocco, note: "JUDGEMENT"}
        - {good: wool, price: 17, origin: morocco, note: "JUDGEMENT"}
        - {good: hides, price: 19, origin: morocco, note: "JUDGEMENT"}
        - {good: almonds, price: 20, origin: morocco, note: "JUDGEMENT"}
        - {good: olive oil, price: 30, origin: morocco, note: "JUDGEMENT"}
        - {good: cattle, price: 7, origin: morocco, note: "JUDGEMENT"}
        - {good: linen, price: 88, origin: null, note: "imported; JUDGEMENT"}
        - {good: woollens, price: 86, origin: britain, note: "imported; JUDGEMENT"}
        - {good: iron, price: 33, origin: null, note: "imported; JUDGEMENT"}
        - {good: cotton, price: 60, origin: morocco, note: "JUDGEMENT: Rabat's cotton (Jackson 1809, l. 4415 to 4418) brought down the coast"}
    until: 1792-02-29
    source: "Jackson 1809, l. 4686 to 4692: a place of considerable trade, particularly in corn; the end of the row the accession of Soliman, FROM MEMORY"
  - market:
      currency: pounds
      goods:
        - {good: wheat, price: 6, origin: morocco, note: "Jackson 1809, l. 4524 to 4533: the export of grain prohibited since the present Emperor's accession, the land lying fallow, and after the famine of 1800 corn so cheap that husbandmen let their crops stand; the price JUDGEMENT"}
        - {good: barley, price: 8, origin: morocco, note: "JUDGEMENT"}
        - {good: wax, price: 70, origin: morocco, note: "JUDGEMENT"}
        - {good: wool, price: 17, origin: morocco, note: "JUDGEMENT"}
        - {good: hides, price: 19, origin: morocco, note: "JUDGEMENT"}
        - {good: almonds, price: 20, origin: morocco, note: "JUDGEMENT"}
        - {good: olive oil, price: 30, origin: morocco, note: "JUDGEMENT"}
        - {good: cattle, price: 7, origin: morocco, note: "JUDGEMENT"}
        - {good: linen, price: 88, origin: null, note: "imported; JUDGEMENT"}
        - {good: woollens, price: 86, origin: britain, note: "imported; JUDGEMENT"}
        - {good: iron, price: 33, origin: null, note: "imported; JUDGEMENT"}
        - {good: cotton, price: 60, origin: morocco, note: "JUDGEMENT: Rabat's cotton (Jackson 1809, l. 4415 to 4418) brought down the coast"}
    since: 1792-03-01
    source: "Jackson 1809, l. 4524 to 4527: the export of grain prohibited since the present Emperor's accession; the day FROM MEMORY"

dockyard:
  kind: chandlers
  items:
    - {item: topmast, hours: 24, pounds: 50, note: "JUDGEMENT: no naval stores named"}
    - {item: yard, hours: 16, pounds: 30}
    - {item: cordage, hours: 3, pounds_per_fathom: 0.1}
    - {item: water, hours_per_ton: 0.6, pounds_per_ton: 0.5}
    - {item: provisions, hours_per_day: 0.06, pounds_per_man_day: 0.05}

crew_pool:
  able: {hands: 1, pounds: 2, delay_h: 36}
  ordinary: {hands: 2, pounds: 1.5, delay_h: 24}
  landsman: {hands: 3, pounds: 1, delay_h: 12}

closed_to: []

# The tracks (package 40's form; packages 101 and 104's lesson: a coast of capes wants every
# port's way out to a lane): the coast bulges seaward at Cape Cantin, and a straight line from
# the northern ports to this one crosses it; out by the road to the common mark off Cape Cantin
# (32 36 N 9 36 W, JUDGEMENT, ten miles west of the cape and its ledge), and in by the same way
# reversed, each leg checked clear of the shore by a cable with `Chart.line_shore` as the
# business's guard reads it; the least depth at datum along each leg in docs/dev/TuningNotes.md.
tracks:
  to_sea: [safi-road, 32 36.0 N 9 36.0 W]
  from_sea: [32 36.0 N 9 36.0 W, safi-road]
  in: [safi-road]
