# FreeSail: Bizerta as a port (package 104, the coast of Tunis's region, the harbour patch bizerta),
# on package 35's machinery; the marks are the features file's (data/charts/features/tunis-coast.yaml).
#
# Sources. Purdy 1826, p. 332: the bay between Capes Bianco and Zibeeb four miles deep, the town on
# its south-west side, anchorage at a distance from the shore in 5, 6 and 7 fathoms; the port good,
# and here the Tunisian galleys are laid up. Norie 1831, pp. 351 to 352: formerly one of the best
# ports of Tunis, now seldom frequented but by small vessels; the town a mile round, defended by
# castles and batteries; grain principally shipped and exported here; the lake of great depth
# within a very narrow entrance over a bar; fresh water from the rivulet at the bottom of the bay.
# Derrotero 1849, p. 266: open to the NE, an excellent shelter from the NNW round by W to S; anchor
# east of the Bastion of the Marina in 9 or 10 brazas of fine sand and weed a long mile off; water at
# the town's fountains by the canal. Smyth 1854, p. 93: the Venice of Barbary, two lakes, the inner
# fresh, the fisheries farmed at a high price. No text read calls Bizerta a corsair port (the
# brief's memory); the galleys laid up are the Bey's (Purdy).
#
# The datum: UNVERIFIED; the canal and lake as the modern French arsenal dredged them are the grid's.
#
# The stance. The regency of Tunis's, the Bey's (the nations table, `tunis`), neutral to a King's ship as to every flag the table has; the Bey's ships and corsairs noted and not modelled. Prices FROM MEMORY or JUDGEMENT, sterling at the exchange, each good's note naming its source where a text names the trade.

