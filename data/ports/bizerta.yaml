    anchorage: "Anchor a long mile east of the Marina bastion in eight fathoms of fine sand and weed; it is sheltered from the westward and open to the north-east. Water from the fountains by the canal's mouth."
    tide: "A little tide, a foot or so, with the winds and the lakes."

