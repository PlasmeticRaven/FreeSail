  items:
    - {item: topmast, hours: 14, pounds: 48, note: "a spar from the store-houses, if one is to be had: judgement"}
    - {item: topgallant_mast, hours: 6, pounds: 14}
    - {item: yard, hours: 9, pounds: 29}
    - {item: cordage, hours: 2, pounds_per_fathom: 0.07}
    - {item: water, hours_per_ton: 0.3, pounds_per_ton: 0.2, note: "White 1835, p. 135: water not to be obtained in any quantity even for a small vessel's crew; judgement"}
    - {item: provisions, hours_per_day: 0.08, pounds_per_man_day: 0.07, note: "refreshments scarce (White): judgement"}

crew_pool:
