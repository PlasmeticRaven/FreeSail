  goods:
    - {good: brandy, price: 112, origin: france, note: "French brandy in bond for the run; judgement"}
    - {good: geneva, price: 76, origin: batavian-republic, note: "for the run; judgement"}
    - {good: tea, price: 182, origin: null, note: "for the run; judgement"}
    - {good: tobacco, price: 66, origin: null, note: "for the run; judgement"}
    - {good: wine, price: 46, origin: france, note: "judgement"}
    - {good: salt, price: 14, origin: null, note: "judgement"}
    - {good: fresh fish, price: 10, origin: britain, note: "the island's fishermen; judgement"}
    - {good: salt beef, price: 62, origin: britain, note: "dear on a small island; from memory"}
    - {good: canvas, price: 64, origin: britain, note: "from memory"}
    - {good: hemp, price: 74, origin: null, note: "from memory"}

dockyard:
