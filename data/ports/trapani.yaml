pilot:
  station: trapani-harbour
  cruising_nm: 2
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: a boat of the Trapanese pilots
    under: oars and a lateen sail
    note: "judgement"
  names: [Vito Messina, Alberto Burgarella, Giacomo Mazzara, Nicolò Ingrassia, Michele Pace]   # judgement
  skill: 0.85
  fee_pounds: 1.5                  # judgement; unverified
  cast: starboard
  course_out_deg: 240            # judgement
  words:
    channel: "From the north keep the Colombara light on with the hill south of Paceco to clear the Porcelli, which rise from eight fathoms to nothing; from the south give the Mal Consiglio a short mile for the Bullata's nine feet. The Colombara may be hugged at three-quarters of a cable."
    marks: "Mount St Julian with its town on the summit; the tops of Trapani's houses like a fleet under sail; the Colombara's light-house battery in the harbour's mouth and Sigia tower on the point."
    anchorage: "Ships of draught bring up near the Colombara in eight to ten fathoms of patchy mud, moored south-south-east and north-north-west; small ships lie at the quay above the pratique office with a fast under the walls and an anchor on the mud."
    tide: "High water at nine hours thirty-five minutes at full and change, the springs nearly two feet; it sets north-east and south-west, with counter-tides over the broken ground in fresh breezes."

