# FreeSail: Trapani as a port (package 105, Sicily and Malta's block), on package 35's
# machinery; the marks are the features file's (data/charts/features/sicily.yaml, the
# harbour patch trapani). Step 3 of the package.
#
# Sources. Smyth 1824, pp. 236 to 247 and App. pp. xxvi to xxix: the town of twenty-five thousand, the best artisans and sailors of the island, one of the most respectable places of arms (pp. 239 to 240); the harbour damaged by the earthquake of 1542, small; the marina's tolerable mole with the pratique office (p. 241); vessels of two or three hundred tons at the quay with a fast under the walls, ships of greater draught near the Colombara in eight to ten fathoms of patchy mud, moored S S E and N N W (App. p. xxvi); the best berth opposite the light-house, the Colombara hugged at three-quarters of a cable; the quarantine often an obstacle to a pilot (App. p. xxvii); high water at 9h 35m with a spring rise of nearly two feet, the set N E and S W, counter-tides in fresh breezes (App. p. xxvi); the Porcelli, the Formiche's shoals, the Bullata of nine feet off the Mal Consiglio; salt (a hundred thousand cantars a year, much to Marseilles, p. 237) and coral (p. 25) its trade. Norie 1831, p. 126: salt, soda, coral and alabaster exported. Lamberti 1844, p. 190: the road open to the S S W and S W.
#
# The holder: the King of the Two Sicilies' (`naples`) throughout, the court at Palermo from
# December 1798 to 1799 and again from January 1806 (James 1837, vol. 2, p. 214; vol. 4, p.
# 122), when the mainland was French and Sicily the Bourbons' (the lead's ruling of
# 2026-11-12: Sicily's ports under `naples` without rows). NOTE: the nations table's wars
# carry no dates and read Naples at peace with France every year (data/nations.yaml), so
# nothing here depends on Bourbon Sicily's wars after 1806.
# Prices FROM MEMORY or JUDGEMENT, in sterling.

id: trapani
name: Trapani
nation: naples
source: "Smyth 1824 pp. 236-247, App. pp. xxvi-xxix; Purdy 1826 pp. 145-149; Norie 1831 pp. 123-127"
datum: unverified   # no period sheet read with its datum; the modern shore is the grid's

