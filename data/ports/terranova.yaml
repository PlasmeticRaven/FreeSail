# FreeSail: Terranova as a port (package 105, Sicily and Malta's block), on package 35's
# machinery; the marks are the features file's (data/charts/features/sicily.yaml, the
# harbour patch terranova). Step 3 of the package.
#
# Sources. Smyth 1824, pp. 196 to 198 and App. p. xx: about nine thousand people, a brisk trade in sulphur, corn, wine and coarse cloth, the produce of Caltagirone brought down for embarkation (pp. 197 to 198); the Geloan fields celebrated for corn (p. 196); the anchorage about a mile from the town in seven to eleven fathoms of sand and mud, very much exposed, the south-wester sending in a great sea and no room to get under way when it blows fresh; small craft at the caricatore under the Torre dell'Insegna; banks off the Dissuteri. Lamberti 1844, p. 194: a good anchorage in eight and ten braccia, grain loaded.
#
# The holder: the King of the Two Sicilies' (`naples`) throughout, the court at Palermo from
# December 1798 to 1799 and again from January 1806 (James 1837, vol. 2, p. 214; vol. 4, p.
# 122), when the mainland was French and Sicily the Bourbons' (the lead's ruling of
# 2026-11-12: Sicily's ports under `naples` without rows). NOTE: the nations table's wars
# carry no dates and read Naples at peace with France every year (data/nations.yaml), so
# nothing here depends on Bourbon Sicily's wars after 1806.
#
# No source on file names a pilot here: the boat and its people JUDGEMENT.
# Prices FROM MEMORY or JUDGEMENT, in sterling.

id: terranova
name: Terranova
nation: naples
source: "Smyth 1824 pp. 196-198, App. p. xx; Purdy 1826 p. 155; Norie 1831 pp. 131-132"
datum: unverified   # no period sheet read with its datum; the modern shore is the grid's

