  vessel:
    kind: a boat
    name: a boat of the caricatore
    under: oars and a lateen sail
    note: "judgement"
  names: [Salvatore Iozzia, Emanuele Nicosia, Giuseppe Morello, Crocifisso Di Dio]   # judgement
  skill: 0.75
  fee_pounds: 1.5                  # judgement; unverified
  cast: starboard
  course_out_deg: 190            # judgement
  words:
    channel: "The coast is low and clean; several small banks lie off the mouth of the Dissuteri. Watch every change of wind here."
    marks: "Terranova on its tabled hill between two rivulets; the lone Doric column on the shore; the Torre dell'Insegna by the caricatore; Falconara's square tower to the west."
    anchorage: "About a mile from the town in seven to eleven fathoms of sand and mud, very much exposed: a south-wester sends in a great sea, and when it blows fresh there is not room to get under way."
    tide: "No tide to reckon on: the currents of this coast rise a foot or two with the wind, a north-wester setting them strongly to the south-east."

