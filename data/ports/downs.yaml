  name: the Downs
  lat_deg: 51.2200
  lon_deg: 1.4400
  depth_fathoms: 8
anchorage:
  feature: small-downs
  name: the Small Downs
  lat_deg: 51.2650
  lon_deg: 1.4150
  depth_fathoms: 4
mooring:
  name: off Deal beach
  lat_deg: 51.2230     # close in off the town within Deal bank (judgement)
  lon_deg: 1.4110
  depth_fathoms: 3
  bottom: chalk and sand
  deep_draught_ft: 14  # judgement: within Deal bank's eighteen feet only small craft lie; a ship lies in the Downs
shore:
  name: the beach at Deal
  lat_deg: 51.2230
  lon_deg: 1.4040

pilot:
  station: the-downs
  cruising_nm: 10                 # judgement: the Deal pilots and boatmen came off as far as the South Sand Head and the Gull Stream
  comes_off_by_night: true        # the Deal boatmen came off in any weather (judgement from their fame)
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: a Deal lugger
    under: lugsails
    note: "the Deal boatmen's luggers and galleys off the beach (judgement)"
  names: [Erridge, Roberts, Atkins, Bushell, Finnis, Mockett, Pritchard, Adams, Baker, Hoile]   # Deal names: judgement
  skill: 0.92
  fee_pounds: 4                   # judgement; unverified
  cast: starboard                 # from the Downs the head paying off to the southward, for the South Foreland (judgement)
  course_out_deg: 200             # S S W out of the Downs past the South Sand Head for the Strait
  words:
    channel: "From the westward round the South Foreland half a mile off in fourteen to twelve fathoms, and when the light-houses bear west haul up north-east into the Downs. From the northward come in through the Gull Stream between the Brake and the Goodwin, keeping no nearer the Brake than seven fathoms nor the Goodwin than ten or eleven; the Goodwin is steep-to and swallows a ship whole."
    marks: "Deal Castle, Walmer Castle to the southward and Sandown to the northward stand on the beach; Upper Deal mill and church behind the town. The South Foreland's two lights in one, west by north, lead clear of the South Sand Head by night; by day Upper Deal mill open to the southward of Walmer Castle."
    anchorage: "Anchor with Upper Deal mill on Deal Castle, west by south, and the South Foreland upper light on Old Stairs Point, in eight or nine fathoms on chalk; moor with the best bower to the south-west and the small bower to the north-east. Smaller vessels lie in the Small Downs north of Sandown, better sheltered. The Goodwin breaks the sea from the east, but a south-westerly gale makes the Downs a hard road to ride in."
    tide: "It is high water at Deal about eleven at full and change, and the tide rises fifteen feet at springs. The stream in the Downs runs to the north-eastward until four hours' ebb and then south-westward until three and a half hours' flood. Unmoor for Spithead at half flood and weigh at high water."

tide:
  establishment: the Downs
  enter_on: flood
  leave_on: ebb

