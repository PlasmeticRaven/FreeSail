# FreeSail: the Downs and Deal as a port (package 79b, the Channel's east block; on package
# 35's machinery). The roads and the marks are features/channel-east.yaml's (the harbour
# patch downs). Deal has no harbour: ships lie in the Downs and the Deal boatmen bring off
# everything, pilots, stores, water, letters and people, in their luggers and galleys.
#
# Sources. White 1835, 'Coast of England', pp. 53 to 54 and 58: round the South Foreland
# half a mile off in 14 to 12 fathoms; anchor with Upper Deal Mill on Deal Castle W by S
# and the South Foreland upper light on the south side of Old Stairs Point, 7 or 8 fathoms;
# moor with the best bower to the southward; to the eastward of Deal Sand's red buoy; high
# water at Deal XI. 15 at full and change, the stream to the north-east till four hours'
# ebb. Moore 1799 and Norie 1805, the catechisms (Moore pp. 298 to 299, Norie pp. 299 to
# 301: the best anchoring Upper Deal church or mill and the castle in one in 8 to 10
# fathoms; moor with the best bower to the south-west and the small to the north-east;
# working out of the Downs, the Goodwin steep-to in 10 or 11 fathoms; the South Foreland's
# lights in one clear the South Sand Head; parting in a south-westerly gale, through the
# Gull Stream). Norie 1805, Table XLI, p. 249: Deal and the Downs 11h 0m, 15 feet. Imray
# 1874, 'Margate Roads to South Foreland', pp. 8 to 9: the anchorage between Walmer and
# Sandown castles eastward of Deal bank, a chalky bottom; the Small Downs for vessels of
# less than 15 feet; Deal bank 18 feet; ships supplied with fresh water from Deal.
#
# The datum: no period sheet of the Downs read (the brief's Hurd sheets not found from this
# machine): `datum: unverified`. Prices FROM MEMORY and JUDGEMENT; the boatmen's charges
# were notorious and are judgement too.

id: downs
name: the Downs
nation: britain
source: "White 1835, 'Coast of England', pp. 53-54, 58; Moore 1799 pp. 298-299; Norie 1805 pp. 299-301 and Table XLI p. 249; Imray 1874 pp. 8-9"
datum: unverified   # no period sheet of the Downs read

