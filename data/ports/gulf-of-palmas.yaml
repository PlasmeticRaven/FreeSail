# FreeSail: the Gulf of Palmas as a port (package 104, beside the coast of Tunis's block, in the
# Tyrrhenian's region; no patch), on package 35's machinery; the marks are the Tyrrhenian's features
# file's (data/charts/features/tyrrhenian.yaml).
#
# Sources. Smyth 1828, pp. 318 to 321: a spacious bay offering safe and commodious anchorage for
# fleets in the violent SW, W and NW gales of winter, much esteemed by Lord Nelson for those
# qualities and for the facility of supplies; of remarkably easy access, capital anchorage all over
# it, especially in seven or eight fathoms on the western side; the country affords provisions and
# refreshments for any number of ships; p. 54: Truguet's eleven sail sheltered here in December
# 1792. Purdy 1826, p. 84, and Norie 1831, p. 63: open to the winds from SW by W to S by E, room for
# a whole fleet in 18 to 4 fathoms, muddy ground holding well. Derrotero 1849, pp. 140 to 141, and
# Lamberti 1844, p. 333: off Sant'Antioco the anchors drag; better holding on the Sardinian side.
# James 1837, vol. 3, pp. 338 to 340: Nelson's fleet here in March 1805, its victuallers lying in the
# gulf, and on 1 April removed to Pula for water. **A watering place in the gulf** (the brief) is in
# no text read: the yard's water is carried as provisions are, judgement, said so.
#
# The datum: UNVERIFIED; the Tyrrhenian's tiles, no patch.
#
# The stance. The King of Sardinia's, neutral to a King's ship. Prices FROM MEMORY or JUDGEMENT.

