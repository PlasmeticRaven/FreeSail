  lon_deg: 14.4000

pilot:
  station: st-pauls-bay
  cruising_nm: 2
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: a fishing boat of St Paul's Bay
    under: oars and a lateen sail
    note: "judgement"
  names: [Salvatore Borg, Michele Zammit, Paolo Farrugia, Antonio Grech]   # judgement
  skill: 0.8
  fee_pounds: 1.5                  # judgement; unverified
  cast: starboard
  course_out_deg: 60            # judgement
  words:
    channel: "Enter between Salmonetta and Kaura point, a mile and more wide; keep a quarter of a mile off Salmonetta's south side, where there is foul ground."
    marks: "Salmonetta, the low islet off the western point, with St Paul's tower over it; the little harbour on the starboard hand going in."
    anchorage: "Abreast the little harbour on the starboard hand in ten to six fathoms of soft mud and clay. Open to the east and north-east, but the anchors will never start while the cables hold."
    tide: "No tide to speak of."

tide:
  establishment: Valletta
  enter_on: flood
  leave_on: ebb

market:
