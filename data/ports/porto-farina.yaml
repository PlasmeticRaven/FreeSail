# FreeSail: Porto Farina as a port (package 104, the coast of Tunis's region, the harbour patch
# porto-farina), on package 35's machinery; the marks are the features file's
# (data/charts/features/tunis-coast.yaml).
#
# Sources. Purdy 1826, p. 333: three or four miles within Cape Farina to the south-west, before which
# is a roadstead nearly as safe and commodious as that of Tunis. Norie 1831, p. 351: a large but
# shallow inlet that will not admit large vessels; the Medjerdah falls into the sea here. Derrotero
# 1849, p. 267: vast and sheltered from every wind but of very little depth, a frigate laid up in it
# in 1826; large ships anchor outside east of the fort on the left-hand point in 5 or 6 brazas of
# fine sand a long mile off the beach; p. 269: its water the best of the bay. Smyth 1854, p. 93:
# fast filling up with the floods and alluvia of the Majerdah; p. 457: Port Farina, the arsenal (his
# survey of about 1822). The brief's "the Bey's arsenal" stands in name only: "arsenal" in Smyth's
# table, a frigate laid up in 1826; no text before says the Bey's navy lay here.
#
# The datum: UNVERIFIED; the lagoon has silted to a foot or three (the Admiralty 1913, p. 435), the
# grid's, and the road's mooring stands at the nearest water of its depth.
#
# The stance. The regency of Tunis's, the Bey's (the nations table, `tunis`), neutral to a King's ship as to every flag the table has; the Bey's ships and corsairs noted and not modelled. Prices FROM MEMORY or JUDGEMENT, sterling at the exchange, each good's note naming its source where a text names the trade.

id: porto-farina
name: Porto Farina
nation: tunis
source: "Purdy 1826 p. 333; Norie 1831 p. 351; Derrotero 1849 pp. 267, 269; Smyth 1854 pp. 93, 457"
datum: unverified   # no period sheet read with its datum; the modern shore is the grid's

outer_road:
