  name: the road of Porto Farina
  lat_deg: 37.1524
  lon_deg: 10.2469
  depth_fathoms: 5
anchorage:
  feature: porto-farina-road
  name: the road of Porto Farina
  lat_deg: 37.1524
  lon_deg: 10.2469
mooring:
  feature: porto-farina-road
  name: east of the fort on the left-hand point, a long mile off
  lat_deg: 37.1524
  lon_deg: 10.2469
  depth_fathoms: 5
  bottom: fine sand
shore:
  feature: porto-farina
  name: the arsenal of Porto Farina
  lat_deg: 37.1700
  lon_deg: 10.1900

pilot:
  station: porto-farina-road
  cruising_nm: 2                 # judgement
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: the arsenal's boat of Porto Farina
    under: a lateen sail and oars
    note: "judgement"
  names: [Mahmud, Ali, Hassan, Yusuf, Mustafa, Salah, Hamuda, Ahmed]   # judgement
  skill: 0.75
  fee_pounds: 2                  # judgement; unverified
  cast: starboard
  course_out_deg: 90            # judgement
  words:
    channel: "The lagoon will not take a large ship; the channel inside Plana is halved by reefs and is for a fair wind only."
    marks: "Cape Farina with its marabout; the low black isle of Plana off it; the fort on the left-hand point of the lagoon."
    anchorage: "Anchor outside east of the fort in five fathoms of fine sand, a long mile off the beach; it is nearly as safe as the road of Tunis. The best water of the bay is here."
    tide: "No tide to speak of; the river's floods silt the lagoon."

tide:
