    - {good: brandy, price: 95, origin: spain, note: "from memory"}
    - {good: cattle, price: 30, origin: spain, note: "the Lances' pasture; judgement"}
    - {good: salt, price: 10, origin: spain, note: "judgement"}
    - {good: salt beef, price: 70, origin: null, note: "from memory"}
    - {good: oranges, price: 7, origin: spain, note: "judgement"}
    - {good: charcoal, price: 6, origin: spain, note: "the cork-oak woods of the sierras; judgement"}
    - {good: timber, price: 6, origin: spain, note: "judgement"}
    - {good: canvas, price: 52, origin: spain, note: "from memory, as Algeciras's"}

