  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: a boat of the wine establishment
    under: oars and a lateen sail
    note: "judgement"
  names: [Giuseppe Pipitone, Vincenzo Genna, Antonino Bonomo, Pietro Lombardo]   # judgement
  skill: 0.75
  fee_pounds: 1.5                  # judgement; unverified
  cast: starboard
  course_out_deg: 230            # judgement
  words:
    channel: "The rocks run more than a mile off the land on every side, and the shoals off Cape Boeo trend to the south-east nearly awash: ships of size keep two miles off. For the mole, keep the centre of the Augustine convent a little open of Mount St Julian."
    marks: "Cape Boeo, low, with the chapel of St John on its point; the town's walls; the English wine establishment and its small mole a mile to the south; Mount St Julian far to the north."
    anchorage: "Two miles south-west of the city in eight and a half fathoms of mud, St Catharine's Castle on Favignana north-north-west and the wine establishment east by north. Between the mole and the beach only seven to fourteen feet."
    tide: "An uncertain tide along these shores of three quarters of a mile to a mile and a half an hour by the winds, rising ten to twenty inches."

