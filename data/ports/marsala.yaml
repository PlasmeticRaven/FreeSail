# FreeSail: Marsala as a port (package 105, Sicily and Malta's block), on package 35's
# machinery; the marks are the features file's (data/charts/features/sicily.yaml, the
# harbour patch marsala). Step 3 of the package.
#
# Sources. Smyth 1824, pp. 227 to 236 and App. p. xxvi: twenty-one thousand people trading in excellent wine, fruit and barilla, the town without ordnance or bomb-proof stores (p. 232); the old port, a creek of twelve or fourteen feet, filled with stones about 1570 by John of Austria's order against the Turks (p. 233); Mr Woodhouse's mole raised from the sunken stones before his establishment south of the town (p. 234), seven to fourteen feet between it and the beach; his new ballio of 1815 (p. 229); ships of size two miles S W of the city in eleven to eight fathoms, eight and a half of mud the berth, the rocks more than a mile off the land; the shoals trending S E from Cape Boeo nearly awash; an uncertain tide of three quarters to a mile and a half an hour by the winds, rising ten to twenty inches (pp. 227 to 228). Purdy 1826, p. 150: the English Wine Establishment a mile south of the city.
#
# The holder: the King of the Two Sicilies' (`naples`) throughout, the court at Palermo from
# December 1798 to 1799 and again from January 1806 (James 1837, vol. 2, p. 214; vol. 4, p.
# 122), when the mainland was French and Sicily the Bourbons' (the lead's ruling of
# 2026-11-12: Sicily's ports under `naples` without rows). NOTE: the nations table's wars
# carry no dates and read Naples at peace with France every year (data/nations.yaml), so
# nothing here depends on Bourbon Sicily's wars after 1806.
#
# No source on file names a pilot here: the boat and its people JUDGEMENT.
# Prices FROM MEMORY or JUDGEMENT, in sterling.

id: marsala
