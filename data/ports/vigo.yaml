# FreeSail: Vigo as a port (spec M6 §26; package 39c, the Biscay south and Galicia
# block), on package 35's machinery; the marks are the features file's
# (data/charts/features/biscay-south.yaml). Bayona's road and castle are marks of this
# port's water and no port of their own (the Derrotero: "para entrar en este Puerto de
# Bayona es indispensable tener Práctico").
#
# Sources. Tofiño 1789, Derrotero de las costas de España en el Océano Atlántico, 'Islas
# Cíes ó Bayonas' and 'Ría de Vigo', pp. 60 to 72: the Isles of Bayona across the mouth,
# the Porta between them a third of a cable wide; the Biduido, three and a half brazas
# half a league north of the isles; entering by the north passage keep south of the Isle
# Onza one to three miles, steer east till Our Lady of the Alba hides by the Point of
# Subrido and Monte Ferro opens east of the Point of the Caballo, then for the Points of
# the Hombre and Subrido a cable off, and up mid-ria; never close Subrido with the Caballo
# till the church of Cangas opens, for the Borneyra; by the south passage bring Cape Mar
# on with the hermitage of Our Lady of la Guía; the regular anchorage before the town in
# eight to fourteen brazas mud, moored NNW and SSE, well sheltered by the isles; the tides
# at full and change at three in the afternoon, rising thirteen to fourteen feet; ships
# bound north wait east of the isles in twelve brazas sand (p. 63).
#
# The datum: UNVERIFIED. No period plan of Vigo was found in the Atlas's copy read (the
# Derrotero's 'Plano del puerto de Vigo' is not among its sheets); the chart's depths are
# EMODnet's at LAT, the modern quays standing before the old shore.
#
# The stance. Vigo is Spanish: hostile to a King's ship in June 1805, open to a neutral
# (data/nations.yaml). Prices FROM MEMORY or JUDGEMENT; sterling at the exchange.

id: vigo
name: Vigo
nation: spain
source: "Tofiño 1789, Derrotero, pp. 60-72 (the Isles of Cíes or Bayona, the ria of Vigo, its entrances by the north and south passages, the road and the tides)"
datum: unverified

outer_road:
