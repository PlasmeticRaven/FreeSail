  name: the mole of Vigo
  lat_deg: 42.2389
  lon_deg: -8.7238

pilot:
  station: cies-road
  cruising_nm: 6                 # judgement: the ria's pilots met ships between the isles and Cape del Hombre
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: the pilots' launch of Vigo
    under: a lugsail and oars
    note: "a Galician lancha (judgement)"
  names: [Pereira, Alonso, Lorenzo, Comesaña, Davila, Freire, Iglesias, Carballo]   # Galician names: judgement
  skill: 0.9
  fee_pounds: 4                  # judgement, in sterling for the one account; unverified
  cast: larboard                 # from the road the head paying off to the westward down the ria (judgement)
  course_out_deg: 260            # out down the ria for the north passage
  words:
    channel: "By the north passage keep south of the Isle Onza one to three miles for the Biduido, and steer east till Our Lady of the Alba hides by the Point of Subrido and Monte Ferro opens east of the Point of the Caballo; then for the Points of the Hombre and Subrido a cable off, and up the middle of the ria. Never close Subrido with the Caballo till the church of Cangas opens, for the Borneyra; and in eight brazas go no nearer either shore. By the south passage bring Cape Mar on with the hermitage of la Guía."
    marks: "The Isles of Bayona across the mouth; Cape del Hombre and its watch-tower; Our Lady of the Alba on her sharp hill south of the ria; Cape Mar, sand-coloured; the church of Cangas; the castle of Castro above the town."
    anchorage: "Before the town in eight to fourteen brazas mud, moored NNW and SSE, the best anchor to the NNW; well sheltered by the isles from the westerly and south-westerly sea."
    tide: "The tides at full and change come at three in the afternoon and rise thirteen or fourteen feet."

