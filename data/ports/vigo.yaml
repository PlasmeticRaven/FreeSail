  name: the road under the Isles of Bayona
  lat_deg: 42.2240
  lon_deg: -8.8920
anchorage:
  feature: vigo-road
  name: the road of Vigo
  lat_deg: 42.2440
  lon_deg: -8.7350
mooring:
  feature: vigo-road
  name: the road of Vigo, moored NNW and SSE
  lat_deg: 42.2440
  lon_deg: -8.7350
shore:
