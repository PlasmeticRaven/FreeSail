  words:
    channel: "The bay of Bougie lies within Cape Carbon, which is steep-to and may be rounded close; the currents about the cape are strong and uncertain, and in a calm they set a ship toward it."
    marks: "Mount Goureya over the town like a sugar loaf with a marabout on its summit; the castle on its hill commanding the town and the road; Cape Carbon pierced through by a great cave."
    anchorage: "Anchor south of the cape before the marabout in seven fathoms of soft mud, moored north and south; it is sheltered from the west and north, but an easterly sends in a swell. Weigh your anchors every week, for they bury themselves."
    tide: "There is next to no tide; the water rises and falls with the wind and the glass."

