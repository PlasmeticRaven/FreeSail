# FreeSail: Bougie as a port (package 104, the Sardinian sea's region, the harbour patch bougie), on
# package 35's machinery; the marks are the features file's (data/charts/features/sardinian-sea.yaml).
#
# Sources. Tofino 1787, p. 155: anchor south of Cape Bugia before a marabout in 6 to 8 brazas of soft
# mud, moored north and south; weigh every eight days, for the anchors bury themselves; better
# sheltered from the winds of the third and fourth quadrants than from the first and second; the
# town by a river down which the ship timber comes for Algiers. Purdy 1826, p. 327: the timber used
# in ship-building at Algier brought from the interior here; anchorage in 8 and 10 fathoms. Norie
# 1831, p. 355: fortified, a castle on a hill commanding town and road; oil, wax and many articles of
# the interior exported; north and north-easterly winds occasion a heavy swell. Berard 1837, pp. 105
# to 108 (the survey of the 1830s): the cove of Sidi Yahia the one safe winter berth; the town's
# road no shelter at all in winter; the only point between Algiers and Bona where a damaged ship
# finds safety. Purdy 1840, p. xxxv (Campbell, 1835): oil, soap, dried figs, and above all
# carpenters' wood. No text read calls Bougie a corsair port (the brief's memory; the sources win).
#
# The datum: UNVERIFIED. No period sheet is patched; the chart is EMODnet's at the lowest
# astronomical tide, the modern port of Bejaia in the grid where 1805 had an open road.
#
# The stance. The regency of Algiers' (the nations table, `algiers`), neutral to a King's ship as to every flag the table has. Its corsairs noted and not modelled. Prices FROM MEMORY or JUDGEMENT, sterling at the exchange, each good's note naming its source where a text names the trade. Decision 67: what is true of the port only for some years is said with its years; the French conquest of the 1830s, after the range, is said and not written as a row. The French took the town in 1833 (Purdy 1840, p. xxxv, its last siege).

