    channel: "The island is safe on all sides but the north, where Walker's rocks carry nine feet a mile and a quarter off the land; ships pass close because the shores are bold, so mind them. In a scirocco shift round to the Cala Giaconi."
    marks: "The island like two small islands from afar, with its three summits; the Falconara's fort and prison on its hill above the cove; the tower of three guns on the cove's west side; the Spalmadora tower at the west point."
    anchorage: "In the cove of Santa Maria, a tenth of a mile wide, five fathoms of sand in the middle, secure in all winds but the scirocco; room for the trading feluccas."
