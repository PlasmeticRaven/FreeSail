# FreeSail: Ustica as a port (package 105, Sicily and Malta's block), on package 35's
# machinery; the marks are the features file's (data/charts/features/tyrrhenian.yaml, Ustica's section, the
# harbour patch none: on tyrrhenian's level-2 tiles). Step 3 of the package.
#
# Sources. Smyth 1824, pp. 279 to 281 and App. p. xxxiii: forty miles north by west of Palermo; the town settled only in 1761 above the sandy beach at the head of the cove of Santa Maria, large enough for the trading feluccas, secure in all winds but the scirocco, when vessels shift round to the Cala Giaconi; the Falconara with its fort and prison, garrisoned by a company of invalids and a few militia; seventeen hundred people besides the garrison and the prisoners; no springs, rain-water in cisterns; charcoal and wood from Cefalù and Palermo, a weekly packet to Palermo; coral and fish on the banks (p. 280); its soda the finest in Europe (p. 15); a grotto a retreat for the fishermen on the approach of Barbary cruisers (p. 281); the north shoal of a fathom and a half a mile and a quarter off. Purdy 1826, pp. 117 to 118: the cove a tenth of a mile wide with five fathoms in the middle; Walker's Rocks of nine feet; an excellent mark for ships bound to Palermo. Ustica lies in `tyrrhenian`'s bounds and features (the brief: a port in tyrrhenian's features alone); its tide is that region's (the eleven's level while tyrrhenian's gauges have none, a known finding of package 111's audit).
#
# The holder: the King of the Two Sicilies' (`naples`) throughout, the court at Palermo from
# December 1798 to 1799 and again from January 1806 (James 1837, vol. 2, p. 214; vol. 4, p.
# 122), when the mainland was French and Sicily the Bourbons' (the lead's ruling of
# 2026-11-12: Sicily's ports under `naples` without rows). NOTE: the nations table's wars
# carry no dates and read Naples at peace with France every year (data/nations.yaml), so
# nothing here depends on Bourbon Sicily's wars after 1806.
#
# No source on file names a pilot here: the boat and its people JUDGEMENT.
# Prices FROM MEMORY or JUDGEMENT, in sterling.

