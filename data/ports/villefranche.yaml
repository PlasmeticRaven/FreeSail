    - {good: salt, price: 10, origin: france, note: "judgement"}
    - {good: salt fish, price: 34, origin: france, note: "brought in; anchovies and tunny, the coast's; judgement"}
    - {good: biscuit, price: 22, origin: france, note: "judgement"}
    - {good: salt beef, price: 75, origin: null, note: "dear in the Mediterranean; judgement"}
    - {good: canvas, price: 46, origin: france, note: "judgement"}
    - {good: timber, price: 10, origin: france, note: "brought in; judgement"}
    - {good: oranges, price: 4.2, origin: france, note: "the place's own; the season's; judgement"}
    - {good: lemons, price: 4.2, origin: france, note: "the place's own; judgement"}
    - {good: figs, price: 18, origin: france, note: "judgement"}

