# FreeSail: Mogador, or Suera (Essaouira), the Emperor's port of the European trade (package
# 106b, Morocco's Atlantic coast), on package 35's machinery; the marks are the features file's
# (data/charts/features/morocco-mogador.yaml).
#
# Sources. Jackson 1809, l. 4722 to 4926: built by the Emperor Sidi Mohammed ben Abdallah in 1760,
# its proper name Saweera; to draw the merchants he gave them ground to build on and let them ship
# produce free of duty; the only port of the empire with a regular and uninterrupted commerce with
# Europe, every person in it supported directly or indirectly by it; the island south of the town
# about two miles round, the passage within it where ships anchor in ten or twelve feet at ebb,
# ships of war and of great burden lying about a mile and a half west of the Long Battery; a
# winter seldom passes without ships driven ashore by the south-west winds in the Liali (l. 4922
# to 4926: 20 December to 30 January old style; Purdy's 8 December to 18 January). Purdy 1825, pp.
# 155 to 156: the north passage between the town and the island, close by the rocks in five
# fathoms; the best anchorage under the island; going out along the bank on the south side, soon 4
# then 10 fathoms; the tide at full and change at 4h, rising 10 to 12 feet (OCR doubtful), the
# current scarcely perceptible; Paddock (1800): a tenth taken of every cargo landed, spirits and
# wine at a particular duty, the export duties paid at the gate; and, Purdy's own, the export of
# horses forbidden, mules, asses and horned cattle allowed at a duty, and the population computed
# at 10,000. Jackson ch. XI (l. 9341 to 10366), from the custom-house books: the exports of 1804
# (almonds, gum Barbary and gum of Soudan, bees' wax, goat skins, olive oil, cow and calf skins,
# wool, ostrich feathers, elephants' teeth, dates) worth 127,679 pounds in Europe; the imports
# (cloths, linens, iron, loaf sugar, tea, alum, copperas, Dutch knives, spices, Mexico dollars);
# l. 10388 to 10413: the trade falling into the hands of a few Jews, subjects of the Emperor, the
# French houses withdrawn for the British cruisers, the Americans' trade impeded in 1804 and 1805
# by a dispute with the Emperor and now resumed.
#
# What the sources say of captivity and slavery here, plainly (decision 68): Mogador was where
# the crews wrecked on the desert coast to the south were brought when they were ransomed from
# the Arabs who held them as slaves, the ransom paid through the British consul and the
# merchants, often after one to five years (Jackson 1809, l. 10897 to 11178: of some two hundred
# English seamen wrecked between 1790 and 1806, eighty redeemed; a hundred and fifty dollars
# would buy each man's freedom if a fund were deposited at Mogodor for it; the present Emperor
# gives them up to the consul without requiring an embassy and presents); and the caravans that brought the gum and the gold of Soudan to the port's
# trade also brought enslaved Africans bought at Timbuctoo, sold in the markets of Fas and
# Marocco (l. 11543 to 11650). People are no cargo of this market, and no scenario is built on it.
#
# The datum: UNVERIFIED (no period plan read: Sidney Smith's survey of the bay, which Purdy
# names, not found). The grid smooths both passages into the harbour within the island (the
# north one's least water 0.0 m and the south one's 0.5 m at the datum, where Purdy has five
# fathoms close by the rocks): the harbour is the features file's mark, and the port's spots
# are in the road, where Purdy and Jackson put ships of war and of burden (a finding). Dated rows (decision 67, package 105's form): the port from its founding in
# 1760 (the year Jackson's, the day JUDGEMENT); before it no row, there being no port. Prices
# FROM MEMORY or JUDGEMENT, in sterling, the exports cheap and the imports dear against
# Gibraltar's and the Canaries' markets.

id: mogador
name: Mogador
nation: morocco
source: "Jackson 1809, l. 4722 to 4926 and ch. XI; Purdy 1825, pp. 155 to 156"
datum: unverified

outer_road:
  feature: mogador-road
  name: the road of Mogador
  lat_deg: 31.5150
  lon_deg: -9.8000
  depth_fathoms: 18
anchorage:
  feature: mogador-road
  name: the road of Mogador
  lat_deg: 31.5150
  lon_deg: -9.8000
mooring:
  name: in the road, nearer the Long Battery
  lat_deg: 31.5130
  lon_deg: -9.7890
  depth_fathoms: 9
  bottom: sand
  deep_draught_ft: 20    # JUDGEMENT: the grid's 17.7 m; the harbour within the island is not
                         # reached in the grid (the head's finding)
shore:
  feature: mogador
  name: the landing by the sea gate
  lat_deg: 31.5110
  lon_deg: -9.7700

pilot:
  - pilot:
      station: mogador-road
      cruising_nm: 3                 # judgement
      comes_off_by_night: false
      cutter: data/ships/cutter.yaml
      vessel:
        kind: a boat
        name: a boat of the port
        under: oars
        note: "judgement"
      names: [Hamet, Ali, Mohammed, Abdallah, Yusuf, Kasem, Larbi, Tahar]   # judgement
      skill: 0.85
      fee_pounds: 1                  # judgement; unverified
      cast: starboard                # judgement
      course_out_deg: 280            # out by the north passage, judgement
      words:
        channel: "Coming from the northward, run in between the island and the great ledge of rocks off the town, close by the rocks, where you have five fathoms. Go out by the south side along the bank from the main, and you are soon in four and then ten fathoms."
        marks: "The white town on its spit of sand with the Long Battery along its sea face; the island south-west of it; far inland the Atlas, seen from the sea in clear weather."
        anchorage: "Small vessels lie under the island, twelve feet in places at low water, good ground. Ships of war and of great burden anchor a mile and a half west of the Long Battery. In the Liali, from December into January, the south-westerly gales drive ships ashore here: be ready."
        tide: "High water at full and change about four o'clock, rising ten to twelve feet; the current is scarcely felt in the bay, but runs hard to the southward off Cape Sem."
    since: 1760-01-01
    source: "Jackson 1809, l. 4722 to 4726: built in 1760; the day JUDGEMENT"

tide:
  establishment: Mogador
  enter_on: flood
  leave_on: ebb

