      currency: pounds
      goods:
        - {good: almonds, price: 18, origin: morocco, note: "Jackson 1809, l. 9667: 321,917 lb of sweet almonds exported in 1804; JUDGEMENT"}
        - {good: wax, price: 68, origin: morocco, note: "Jackson 1809, ch. XI: bees' wax among the exports of 1804; JUDGEMENT"}
        - {good: hides, price: 18, origin: morocco, note: "Jackson 1809, ch. XI: goat skins 12,726 dozen and cow and calf skins 120,483 lb in 1804; JUDGEMENT"}
        - {good: olive oil, price: 29, origin: morocco, note: "Jackson 1809, ch. XI: 57,236 lb in 1804; JUDGEMENT"}
        - {good: wool, price: 17, origin: morocco, note: "Jackson 1809, ch. XI; JUDGEMENT"}
        - {good: gum, price: 45, origin: morocco, note: "Jackson 1809, ch. XI: gum Barbary 362,606 lb in 1804, and gum of Soudan by the caravans; JUDGEMENT"}
        - {good: dates, price: 14, origin: morocco, note: "Jackson 1809, ch. XI: Tafilelt dates; JUDGEMENT"}
        - {good: cattle, price: 8, origin: morocco, note: "Purdy 1825 p. 155: mules, asses and horned cattle permitted to be exported after a duty; JUDGEMENT"}
        - {good: woollens, price: 90, origin: britain, note: "Jackson 1809, ch. XI: cloths among the imports; JUDGEMENT"}
        - {good: linen, price: 92, origin: null, note: "Jackson 1809, ch. XI: linens, plattilias and creas; JUDGEMENT"}
        - {good: iron, price: 34, origin: null, note: "Jackson 1809, l. 9455: 10,661 bars in 1804; JUDGEMENT"}
        - {good: sugar, price: 100, origin: null, note: "Jackson 1809, ch. XI: loaf sugar 56,219 lb in 1804; JUDGEMENT"}
        - {good: tea, price: 260, origin: britain, note: "Jackson 1809, ch. XI: tea among the imports; JUDGEMENT"}
        - {good: salt fish, price: 20, origin: morocco, note: "JUDGEMENT: nothing grows at the town in sufficient quantity to supply the inhabitants (Purdy 1825 p. 155) and Agadeer's fish is dried for the interior"}
    since: 1760-01-01
    source: "Jackson 1809, l. 4716 to 4920 and ch. XI: the port's trade from its founding in 1760; the figures of 1804; the day JUDGEMENT"

