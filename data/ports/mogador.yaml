        - {item: yard, hours: 16, pounds: 32}
        - {item: cordage, hours: 3, pounds_per_fathom: 0.09}
        - {item: water, hours_per_ton: 0.8, pounds_per_ton: 0.7, note: "Purdy 1825 p. 155: the water brought from the river a mile and a half off; JUDGEMENT"}
        - {item: provisions, hours_per_day: 0.06, pounds_per_man_day: 0.05}
