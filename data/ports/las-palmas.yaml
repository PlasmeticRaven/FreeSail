# FreeSail: Palmas of the Grand Canary and the road of La Luz (package 106a), on package
# 35's machinery; the marks are the features file's (data/charts/features/canaries.yaml).
#
# Sources. Purdy 1825, p. 214 (Glas): the Isleta, the peninsula at the north-east end, on its
# isthmus two miles long; on the Isleta's west side a bay open to the north-west swell, where
# small barks lie behind a ledge of rocks and the natives repair them; on the other side the
# spacious sandy bay called Puerto de Luz, or Puerto de las Isletas, a good road for shipping
# of any burthen with all winds but the south-east, which seldom blows hard; the landing in
# the very bight, where a boat may lie broadside to the shore; a league along shore southward
# the city of Palmas, the capital, off which ships discharging anchor within half a mile in
# good weather, though it is no good road; the island the granary of the Canaries, two
# wheat harvests a year in some districts. Norie 1805, Table XL: Palmas 28 8 N, the N.E.
# point 28 13 N; Table XLI p. 248: "Canary Island", high water 3h on the full and change.
#
# The datum: UNVERIFIED (no plan read; EMODnet's depths on the level-3 patch, which hold the
# modern port's works over La Luz: the port is the grid's, as Dover's and the Havre's are).
# FOR SOME YEARS ONLY: nothing read. Prices FROM MEMORY or JUDGEMENT, in sterling.
# The holder, dated (79a's form, `nation:`, one row: Spain's through the whole range; decision
# 67): Spanish from the conquest to the end of the range and after. Hostile to a King's ship by
# the nations table's war of December 1804; NOTE (as data/ports/barcelona.yaml's): the table's
# wars carry no dates (`Nations.at_war` reads none), so from 1808, when Spain became Britain's
# ally, the islands still read as at war with Britain: the owner's finding (decision 66), not
# mended here, and no truth depends on a war's day. What is true of the port only for some
# years is written in its own words, with its years, in the head above: none of it is a
# key that package 105's dated rows (`state`, `closed_to`, `market` and the rest) can carry, so
# no row waits (the chart session, 2026-11-13).

nation:
  - {nation: spain, source: "the King of Spain's through the range: Spanish since the conquest (Purdy 1825, p. 210: by the treaty between Ferdinand of Castile and Alphonso of Portugal the islands to belong to Spain); at war with Britain from 12 December 1804 (James 1837, vol. 3, p. 200, as data/ports/barcelona.yaml cites it)"}
id: las-palmas
name: Las Palmas
source: "Purdy 1825, p. 214 (Glas); Norie 1805, Tables XL and XLI"
datum: unverified

outer_road:
  feature: puerto-de-la-luz
  name: Puerto de la Luz
  lat_deg: 28.1450
  lon_deg: -15.4150
  depth_fathoms: 10
anchorage:
  feature: puerto-de-la-luz
  name: Puerto de la Luz
  lat_deg: 28.1450
  lon_deg: -15.4150
mooring:
  name: the road off the city of Palmas, in fine weather
  lat_deg: 28.1000
  lon_deg: -15.4050
  bottom: sand
  deep_draught_ft: 20    # judgement
shore:
  name: the landing in the bight of La Luz
  lat_deg: 28.1420
  lon_deg: -15.4250

pilot:
  station: puerto-de-la-luz
  cruising_nm: 2                 # judgement
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: a shore boat of La Luz
    under: oars
    note: "judgement: no pilot is named in the sources; the boats of the landing"
  names: [Suárez, Santana, Ramírez, Rodríguez, Hernández, Medina, Sosa, Quintana]   # judgement
  skill: 0.8
  fee_pounds: 1                  # judgement; unverified
  cast: starboard                # judgement
  course_out_deg: 90             # out of the bay to the east (judgement)
  words:
    channel: "Come round the Isleta, the high land on its low neck at the north-east end, and stand into the great sandy bay on its south side: it is clean and deep."
    marks: "The steep rocks or islets at the bay's entrance toward the north-east give it its name; the city of Palmas lies a league along the shore to the southward."
    anchorage: "Anchor in the bay of La Luz in any depth that suits on sand: a good road for any ship with every wind but the south-east, and that seldom hard. Off the city itself you may lie half a mile out to discharge in fine weather, but it is no road to trust."
    tide: "High water about three on the full and change; the tide rises some six or seven feet. Land your boats in the very bight of the bay: she may lie broadside to the beach without danger."

tide:
  establishment: Canary Island
  enter_on: flood
  leave_on: ebb

market:
  currency: pounds
  goods:
    - {good: wheat, price: 10, origin: spain, note: "Purdy 1825 p. 214: the granary of the Canarian archipelago, two wheat harvests a year in some districts; JUDGEMENT"}
    - {good: barley, price: 8, origin: spain, note: "JUDGEMENT"}
    - {good: salt fish, price: 18, origin: spain, note: "the islands' fishery on the coast of Barbary, its barks from Canaria (Glas 1764, FROM MEMORY, unverified); JUDGEMENT, cheap here"}
    - {good: wine, price: 60, origin: spain, note: "JUDGEMENT: Canaria's wine less than Tenerife's"}
    - {good: brandy, price: 38, origin: spain, note: "JUDGEMENT"}
    - {good: fresh beef, price: 34, origin: spain, note: "JUDGEMENT"}
    - {good: vegetables, price: 15, origin: spain, note: "JUDGEMENT"}
    - {good: oranges, price: 13, origin: spain, note: "JUDGEMENT"}
    - {good: sugar, price: 55, origin: spain, note: "the island's old sugar (FROM MEMORY), JUDGEMENT"}
    - {good: canvas, price: 72, origin: britain, note: "imported; FROM MEMORY"}
    - {good: cordage, price: 82, origin: britain, note: "imported; FROM MEMORY"}
    - {good: timber, price: 11, origin: spain, note: "JUDGEMENT"}

dockyard:
  kind: chandlers
  items:
    - {item: topmast, hours: 18, pounds: 48, note: "JUDGEMENT"}
    - {item: yard, hours: 12, pounds: 30}
    - {item: cordage, hours: 2, pounds_per_fathom: 0.08}
    - {item: water, hours_per_ton: 0.4, pounds_per_ton: 0.25, note: "JUDGEMENT"}
    - {item: provisions, hours_per_day: 0.06, pounds_per_man_day: 0.07}

crew_pool:
  able: {hands: 2, pounds: 2, delay_h: 24}
  ordinary: {hands: 3, pounds: 1.5, delay_h: 24}
  landsman: {hands: 5, pounds: 1, delay_h: 12}

closed_to: []

# The tracks (package 40's form; package 101's lesson: the islands stand between the ports, and
# the business's far-detail guard refuses a straight line across the land): out by the road's
# offing to the common mark in open water north of Tenerife (28 51 N 16 24 W, JUDGEMENT), each
# leg checked clear of the shore by a cable with `Chart.line_shore` as the guard reads it, and in
# by the same way reversed. The marks between are JUDGEMENT.
tracks:
  to_sea: [puerto-de-la-luz, 28 08.7 N 15 23.4 W, 28 13.2 N 15 24.0 W, 28 51.0 N 16 24.0 W]
  from_sea: [28 13.2 N 15 24.0 W, 28 08.7 N 15 23.4 W, puerto-de-la-luz]
  in: [puerto-de-la-luz]
