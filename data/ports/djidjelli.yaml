# FreeSail: Djidjelli as a port (package 104, the Sardinian sea's region, the harbour patch djidjelli),
# on package 35's machinery; the marks are the features file's (data/charts/features/sardinian-sea.yaml).
#
# Sources. Berard 1837, pp. 113 to 115 (the survey of the 1830s): the port like Tripoli's of Barbary,
# smaller and less safe, for the fine season only (May to October); anchor south of the highest
# islet of the entry about a cable off in 10 to 12 brasses on sand and gravel; the rocks set up a
# surge and rolling stones that chafe the cables; a building slip west of the town, nine coasters
# on the stocks, the oak of the country famous; held by France from 23 July to 30 October 1664; its
# people in a manner independent. Norie 1831, p. 355: a village with a small port before it where
# vessels drawing little water may find anchorage between the islets and the shore. Derrotero 1849,
# p. 256: the same as Berard's. No text read calls Djidjelli a corsair harbour (the brief's memory)
# and none names a good of its trade but its boats and timber.
#
# The datum: UNVERIFIED. The modern port of Jijel's works are in the grid where 1805 had the reef.
#
# The stance. The regency of Algiers' (the nations table, `algiers`), neutral to a King's ship as to every flag the table has. Its corsairs noted and not modelled. Prices FROM MEMORY or JUDGEMENT, sterling at the exchange, each good's note naming its source where a text names the trade. Decision 67: what is true of the port only for some years is said with its years; the French conquest of the 1830s, after the range, is said and not written as a row.

