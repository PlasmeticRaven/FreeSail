  course_out_deg: 190            # judgement
  words:
    channel: "The coast is clean to the lead: Cape St Marco's shelf may be approached by it, and Cape Bianco's reef runs a mile and a half to the south. No harbour; boats and flat vessels are beached."
    marks: "Sciacca up its slope behind its wall, the castle of Luna at the east angle, Mount Calogero behind; Cape St Marco, forked and reddish, with its square tower and battery."
    anchorage: "About a mile off the town in seven to twelve fathoms, eight of mud the best, the castle north; a summer road only, open to every wind from south-east round to west."
    tide: "No tide to reckon on: the currents of this coast rise a foot or two with the wind, a north-wester setting them strongly to the south-east."

