# FreeSail: Sciacca as a port (package 105, Sicily and Malta's block), on package 35's
# machinery; the marks are the features file's (data/charts/features/sicily.yaml, the
# harbour patch sciacca). Step 3 of the package.
#
# Sources. Smyth 1824, pp. 216 to 217 and App. pp. xxiii to xxiv: one of the principal caricatori of the south coast, with grain pits, exporting corn, fruit, anchovies, sulphur and barilla; eleven thousand people; the bandits of the hills behind put down by the British troops (pp. 216 to 217); ships ride a mile off in summer in seven to twelve fathoms of sand and clay, exposed to every wind from S E round southerly to W, the road used only in the fine months; the berth eight fathoms of mud a mile off, the castle north; Cape St Marco a reddish forked point with its tower battery, its shelf of rocks to be approached by the lead; Cape Bianco's reef a mile and a half to the south. Lamberti 1844, p. 193: grain loaded, a secca four miles off.
#
# The holder: the King of the Two Sicilies' (`naples`) throughout, the court at Palermo from
# December 1798 to 1799 and again from January 1806 (James 1837, vol. 2, p. 214; vol. 4, p.
# 122), when the mainland was French and Sicily the Bourbons' (the lead's ruling of
# 2026-11-12: Sicily's ports under `naples` without rows). NOTE: the nations table's wars
# carry no dates and read Naples at peace with France every year (data/nations.yaml), so
# nothing here depends on Bourbon Sicily's wars after 1806.
#
# No source on file names a pilot here: the boat and its people JUDGEMENT.
# Prices FROM MEMORY or JUDGEMENT, in sterling.

