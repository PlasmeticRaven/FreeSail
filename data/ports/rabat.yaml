# FreeSail: Sallee and Rabat, the two towns at the mouth of the Bu Regreg (package 106b,
# Morocco's Atlantic coast), on package 35's machinery; the marks are the features file's
# (data/charts/features/morocco-sallee.yaml).
#
# Sources. Jackson 1809, l. 4305 to 4449 (Purdy 1825, p. 153, quotes him): the bar so filled
# that a vessel of 150 tons struck three times on it and one of 100 tons scarcely enters without
# danger; the road dangerous for shipping, vessels safe out of the river near Rabat from April
# to September inclusive and not secure the rest of the year, the wind blowing from the south;
# the best anchorage between the mosque of Rabat and the Tower of Hassan; many anchors lost in
# the road; Sallee walled, with a battery of 24 guns commanding the river's entrance; docks for
# ship-building at Sallee and at Rabat, where the hulls of two of the Emperor's sloops of war
# were nearly finished when he was last there, and the sloops (which his subjects call frigates)
# laid up in the river for the winter (l. 621 to 623, 4418 to 4420); European factories
# established at different times in Rabat and as often quitted or abandoned on some new order of
# the Emperor's (l. 4330 to 4333); cotton of excellent quality, a manufactory of cotton cloth at
# Rabat (l. 4415 to 4418); Sallee 18,000 people, Rabat 25,000 (l. 3679 to 3681).
#
# What the sources say of captivity and slavery here, plainly (decision 68): Sallee's vessels
# were formerly fitted out "for the purpose of capturing the defenceless merchant ships of
# Europe" (Jackson 1809, l. 4349 to 4351), and the subterranean apartment under the town where
# the Europeans so taken were formerly confined, "a miserable dungeon, though spacious", is
# still shown (l. 4323 to 4326); the town and walls of Rabat were built by Spaniards enslaved by
# the Sultan El Monsor in the twelfth century (l. 4369 to 4370); by the river stand the ruins of
# the town Muley Ismael built for his black troops, the Abeed Seedy Bukaree (l. 4321 to 4322),
# men he had bought or taken as slaves (that clause FROM MEMORY). These are the town's
# history in 1805, not its trade: no cargo of the market is a person, and no scenario is built on it.
#
# The datum: UNVERIFIED (no period plan read). The grid closes the river: its mouth reads one
# to two metres and the river within is land (a finding); the port is its road. No dated row:
# the Europeans' coming and going is said in the pilot's words, no source giving its years.
# Prices FROM MEMORY or JUDGEMENT, in sterling.

id: rabat
name: Sallee and Rabat
nation: morocco
source: "Jackson 1809, l. 4305 to 4449 (Purdy 1825, p. 153)"
datum: unverified

outer_road:
  feature: rabat-road
  name: the road of Sallee
  lat_deg: 34.0450
  lon_deg: -6.8600
  depth_fathoms: 14
anchorage:
  feature: rabat-road
  name: the road of Sallee
  lat_deg: 34.0450
  lon_deg: -6.8600
mooring:
  name: out of the river near Rabat
  lat_deg: 34.0400
  lon_deg: -6.8500
  depth_fathoms: 5
  bottom: sand
  deep_draught_ft: 12    # JUDGEMENT: the bar scarcely admits 100 tons; larger ships lie here
shore:
  feature: rabat
  name: the landing under the old castle of Rabat
  lat_deg: 34.0320
  lon_deg: -6.8360

pilot:
  station: rabat-road
  cruising_nm: 2                 # judgement
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: a boat of the river
    under: oars
    note: "judgement"
  names: [Hamet, Ali, Mohammed, Abdallah, Yusuf, Kasem, Larbi, Tahar]   # judgement
  skill: 0.8
  fee_pounds: 1                  # judgement; unverified
  cast: starboard                # judgement
  course_out_deg: 300            # out to the west-north-west, judgement
  words:
    channel: "The bar is filling: a vessel of a hundred tons scarcely enters without danger, and one of a hundred and fifty has struck three times on it going in. Larger ships do not try it."
    marks: "The Tower of Hassan, a hundred and eighty feet of hewn stone, seen six or seven leagues off; Sallee's walls on the north bank and its battery of twenty-four guns over the river's mouth, Rabat's old castle on the south."
    anchorage: "Lie out of the river near Rabat, between the mosque and the Tower of Hassan, from April to September; the rest of the year the southerly wind makes the road unsafe. Many anchors have been lost here: look to your cables and buoys."
    tide: "Cross the bar at high water only, with the flood."

tide:
  establishment: Coast of Marocco
  enter_on: flood
  leave_on: ebb

