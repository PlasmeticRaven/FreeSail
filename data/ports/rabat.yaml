# The tracks (package 40's form; packages 101 and 104's lesson): a straight line from the road to
# the common mark off Cape Cantin (32 36 N 9 36 W, the southern ports' lane) cuts the land by Dar
# el Beida; out by the road to an offing twenty miles west-south-west (33 54 N 7 54 W, JUDGEMENT)
# and in the same way, each leg checked clear of the shore by a cable with `Chart.line_shore`.
tracks:
  to_sea: [rabat-road, 33 54.0 N 7 54.0 W]
  from_sea: [33 54.0 N 7 54.0 W, rabat-road]
  in: [rabat-road]
