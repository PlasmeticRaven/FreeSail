      words:
        channel: "From the Faro keep over to the Sicilian side, where the beaches are steep-to and the stream lets a ship glide along them; give the rocks under the Torre di Cavallo a wide berth, for the current sets onto them. The mouth of the harbour is open to the north-west, between the Braccio and the Marina."
        marks: "The Faro's light on the point; the Braccio, the low sandy sickle, with Fort Salvatore at its point and the light within its little fort; the citadel on its root; the Marina's long front of palaces."
        anchorage: "Run in off the Marina and anchor in thirty fathoms with a stern-fast to the quay, or moor in twenty with a hawser to the stone posts. The north-east quarter is foul with two Spanish ships of the line sunk there. For a short stay lie off San Francesco di Paola."
        tide: "High water at full and change at eight hours ten minutes in the harbour. In the Faro the stream runs six hours north and six south, two to five miles an hour, with a slack of a quarter to a whole hour between, and counter-sets along each shore."
