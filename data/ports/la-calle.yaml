  course_out_deg: 330            # judgement
  words:
    channel: "The cove is narrow, its west point strewn with rocks, the east point cleaner; it takes boats and small craft only, with ten feet in the middle."
    marks: "The old fortified mill on the hillock west of the entry; the magazines along the peninsula; Cape Rosa low and reddish to the westward."
    anchorage: "A ship anchors outside under Cape Gros in nine fathoms of sand, sheltered from the south and open to the sea; leave it at the first sign of a blow from the north-west. In the cove small craft moor four ways to the quays."
    tide: "No tide to speak of; close in off La Calle the current sets west."

