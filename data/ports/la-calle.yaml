# FreeSail: La Calle as a port (package 104, the coast of Tunis's region, the harbour patch la-calle),
# on package 35's machinery; the marks are the features file's (data/charts/features/tunis-coast.yaml).
#
# Sources. Berard 1837, pp. 139 to 141: the old establishment of the Compagnie d'Afrique, a cove of
# 200 toises sheltered from the N and NE by a peninsula on which all the magazines were built, open
# to the NW (in fresh north-westers the coral boats haul ashore); 20 feet at the entrance and 10 or
# 11 in the middle on sand; burnt in 1827 at the declaration of war between Algiers and France; the
# stream four miles east long the limit of the two regencies (so that La Calle is Algiers', the
# nation here; Norie 1831, p. 353, and Smyth 1854, p. 90, put the march at La Calle itself). Purdy
# 1826, p. 327, and Norie 1831, p. 354: the Bastion of France and La Cala both abandoned and in
# ruins. Derrotero 1849, pp. 261 to 262: the cove and the outer road under Cape Gros in 15 to 17
# brazas of sand. **No text read puts La Calle in British hands** (the brief's "from about 1807";
# Norie's cession to the British African Company is Bona's): not written. The coral of the coast is
# the place's trade (Berard p. 138; Norie p. 354).
#
# The datum: UNVERIFIED; the modern port of El Kala in the grid.
#
# The stance. The regency of Algiers' (the nations table, `algiers`), neutral to a King's ship as to every flag the table has. Its corsairs noted and not modelled. Prices FROM MEMORY or JUDGEMENT, sterling at the exchange, each good's note naming its source where a text names the trade. Decision 67: what is true of the port only for some years is said with its years; the French conquest of the 1830s, after the range, is said and not written as a row. Decision 67: the concession's years (the Company's from the seventeenth century, its post burnt in 1827) are said here; who held the concession in 1805 is not read, and no row is written.

