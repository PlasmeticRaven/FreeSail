  skill: 0.75
  fee_pounds: 1.5                  # judgement; unverified
  cast: starboard
  course_out_deg: 315            # judgement
  words:
    channel: "The island may be approached everywhere by the lead. The harbour among the rocks between Points Leonardo and Santa Croce has a passage of fifty fathoms wide and two and a half deep, for the island's small craft only. A rock of five fathoms lies a mile and a quarter south-west of Point Nica, dangerous only in a heavy sea."
    marks: "The castle with its square keep over the town's cove, the prison fort of the island, where its convicts and exiles are held; two-gun batteries on Points St Leonard and Santa Croce. The corsair Dragut once sacked the castle and carried a thousand of the island's people into slavery."
    anchorage: "Large ships anchor with the castle south-east about two miles in eighteen fathoms of sand; further in the ground is rocky and foul. A north-wester sends a ground swell into the harbour. Send for pratique to the cove at Point St Leonardo."
    tide: "No tide; the current between Sicily and Barbary runs east in settled weather."

