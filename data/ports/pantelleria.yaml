# FreeSail: Pantellaria as a port (package 105, Sicily and Malta's block), on package 35's
# machinery; the marks are the features file's (data/charts/features/sicily.yaml, the
# harbour patch pantellaria). Step 3 of the package.
#
# Sources. Smyth 1824, pp. 281 to 283 and App. pp. xxxiii to xxxiv: about four thousand six hundred souls, the most natives, the rest fugitives from the laws of Sicily or criminals under sentence (pp. 282 to 283); the castle a large weak work with a square keep of ten or twelve old guns, the Prison Fort of the tables (p. 283; p. xl); a party of veterans under a military commandant; raisins, wine, oil, cotton, orchilla and a little alum exported, corn for three months only; the harbour of Points Leonardo and Santa Croce for the island's small vessels, a passage fifty fathoms wide and two and a half deep among the rocks, a N W gale sending in a ground swell; large ships off it with the castle S E about two miles in eighteen fathoms of sand, foul further in, the chain best; pratique at the cove of Point St Leonardo; water and refreshments not in great plenty; the rock of five fathoms off Point Nica. Smyth 1854, p. 32: a place of exile for state delinquents.
#
# The holder: the King of the Two Sicilies' (`naples`) throughout, the court at Palermo from
# December 1798 to 1799 and again from January 1806 (James 1837, vol. 2, p. 214; vol. 4, p.
# 122), when the mainland was French and Sicily the Bourbons' (the lead's ruling of
# 2026-11-12: Sicily's ports under `naples` without rows). NOTE: the nations table's wars
# carry no dates and read Naples at peace with France every year (data/nations.yaml), so
# nothing here depends on Bourbon Sicily's wars after 1806.
#
# Decision 68: Smyth 1824, p. 281, has the corsair Dragut descending on the island, sacking the
# castle and carrying "a thousand of the inhabitants into slavery", in a year printed 1583
# (Dragut died in 1565: the year as printed is doubtful, and the words give none); and the
# island's convicts and exiles (pp. 282 to 283; Smyth 1854, p. 32). The marks' words say
# so. No good or scenario is built on it.
#
# No source on file names a pilot here: the boat and its people JUDGEMENT.
# Prices FROM MEMORY or JUDGEMENT, in sterling.

