    - {good: biscuit, price: 22, origin: sardinia, note: "judgement"}
    - {good: salt beef, price: 75, origin: null, note: "dear in the Mediterranean; judgement"}
    - {good: canvas, price: 60, origin: sardinia, note: "brought in; judgement"}
    - {good: timber, price: 10, origin: sardinia, note: "brought in; judgement"}
    - {good: wheat, price: 18, origin: sardinia, note: "the place's own; the quarter's price in sterling; judgement"}
    - {good: cheese, price: 24, origin: sardinia, note: "the place's own; judgement"}
    - {good: cattle, price: 9, origin: sardinia, note: "the head; judgement"}
    - {good: fresh beef, price: 30, origin: sardinia, note: "judgement"}

