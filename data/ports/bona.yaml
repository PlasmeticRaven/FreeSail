    anchorage: "In winter lie under the Fort Genois in fourteen fathoms of mud and sand, the fort bearing north-north-east, two cables and a half off the shore: it is the safest berth, though a fresh easterly sends in a heavy swell. In summer the Cassarin before the town, five fathoms of sand over mud; a north-easter in winter drives ships ashore there."
