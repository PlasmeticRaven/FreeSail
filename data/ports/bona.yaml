# FreeSail: Bona as a port (package 104, the Sardinian sea's region, the harbour patch bona), on
# package 35's machinery; the marks are the features file's (data/charts/features/sardinian-sea.yaml).
#
# Sources. Norie 1831, p. 354: a considerable sea-port, the town of jujubes, near the ruins of Hippo,
# a place of great trade from its communication with Constantina; its exports wool, bees-wax,
# bullocks-hides and corn, with the very profitable trade of the coral fishery adjacent; the old
# harbours east of the town and under its walls nearly choked up; Port Genovese, 15 to 7 fathoms
# under a small fort, quite exposed to the NE and easterly winds; "the French intercourse having
# ceased, it was in 180[6 or 8] ceded to the British African Company; but we believe no benefit was
# ever derived from the possession" (the year's last figure lost in the OCR, "ISOS"; the page
# image would settle it); and since, the French again by conquest. Purdy 1826, p. 327: corn, wool,
# hides and wax; the French formerly had an establishment here. Berard 1837, pp. 130 to 136: four
# anchorages; the Marseille insurers knew only the Fort Genois's for winter (15 September to 15 May)
# and the Cassarin for summer; a good watering place in the ravine at the south end of the
# beach; the north-easterly gale of 24 and 25 January 1835 that wrecked eleven ships; the old
# Compagnie d'Afrique always kept one of its principal agents here. The brief's "bullocks for the
# fleet" is in no text read (the hides are); "the coral fishery's base" holds in part (the richest
# coral off Cape Rosa, Berard p. 138). Lamberti 1844, p. 228; Derrotero 1849, pp. 259 to 260.
#
# The datum: UNVERIFIED; the modern port of Annaba is the grid's land where the Cassarin lay, and the
# mooring stands at the nearest water of its depth.
#
# The stance. The regency of Algiers' (the nations table, `algiers`), neutral to a King's ship as to every flag the table has. Its corsairs noted and not modelled. Prices FROM MEMORY or JUDGEMENT, sterling at the exchange, each good's note naming its source where a text names the trade. Decision 67: what is true of the port only for some years is said with its years; the French conquest of the 1830s, after the range, is said and not written as a row. The cession to the British African Company (Norie: 1806 or 1808) is of the trade, not of the town, and the year is unread: noted here, no dated row until the year is read.

