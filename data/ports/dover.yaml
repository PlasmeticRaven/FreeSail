# FreeSail: Dover as a port (package 79b, the Channel's east block; on package 35's
# machinery). The road and the marks are features/channel-east.yaml's (the harbour patch
# dover).
#
# Sources. Imray 1874, 'South Foreland to Beachy Head', pp. 11 to 12: a good tidal harbour,
# the outlet facing the S E, the piers about 140 feet apart, the entrance very narrow and
# with westerly gales the sea breaking across it; the outer harbour dries an hour before
# low water, 17 feet at high water springs; enter about 1 1/2 hours before or 2 after high
# water, always with a pilot; with north-easterly winds Dover bay much frequented, the
# anchorage abreast the town, the holding ground not good. White 1835, 'Coast of England',
# p. 52: the West Bay of Dungeness is certainly preferable to Dover Road. Moore 1799,
# 'Tides', p. 143: at Dover the tide from the Channel runs northward 7 1/2 hours. Norie
# 1805, Table XLI, p. 249: Dover 11h 6m (the minutes' figure faint), 14 feet. Faden 1793,
# p. 10: from Calais to Dover W N W 7 leagues; the packets' passage.
#
# The shoreline of 1805: Dover without the Admiralty harbour, whose pier was begun in 1847
# and its breakwaters long after. EMODnet's grid has no breakwater at its sixteenth of a
# minute; what it has of the modern works is the reclaimed land of the Western Docks at the
# foot of the Western Heights and a harbour dredged within the walls, two to ten metres
# where the bay of 1805 shoaled to the beach: no period sheet was read for a patch, so the
# bay is the grid's and the port says `datum: unverified`.
#
# The packet station to Calais is closed by the war; Dover is a garrison and a port of
# small craft, its pilots the Cinque Ports' (the Fellowship of Dover pilots). Prices FROM
# MEMORY and JUDGEMENT.

id: dover
name: Dover
nation: britain
source: "Imray 1874, 'South Foreland to Beachy Head', pp. 11-12; White 1835, 'Coast of England', p. 52; Moore 1799, 'Tides', p. 143; Norie 1805, Table XLI, p. 249; Faden 1793, p. 10"
datum: unverified   # no period sheet of the bay read; the grid's harbour is the modern dredged one

outer_road:
  feature: dover-road
  name: Dover road
  lat_deg: 51.1145
  lon_deg: 1.3200
  depth_fathoms: 8
anchorage:
  feature: dover-road
  name: Dover road
  lat_deg: 51.1145
  lon_deg: 1.3200
  depth_fathoms: 8
mooring:
  name: Dover harbour
  lat_deg: 51.1205     # the harbour within the piers (judgement)
  lon_deg: 1.3170
  depth_fathoms: -0.5  # dries an hour before low water (Imray)
  bottom: shingle and sand
  deep_draught_ft: 12  # judgement: seventeen feet at high water springs in the entrance
shore:
  name: the pier at Dover
  lat_deg: 51.1220
  lon_deg: 1.3160

pilot:
  station: dover-road
  cruising_nm: 8                  # judgement: the Cinque Ports' pilots off Dover and the South Foreland
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  names: [Iron, Pascall, Kennett, Hammond, Stokes, Rigden, Baker, Gambrill]   # Kentish names: judgement
  skill: 0.9
  fee_pounds: 4                   # judgement; unverified
  cast: starboard                 # the head paying off to the eastward from the road, for the South Foreland (judgement)
  course_out_deg: 160             # S by E out of Dover bay into the Strait
  words:
    channel: "The harbour's mouth faces the south-east between two piers a hundred and forty feet apart; it is very narrow, and with westerly gales the sea breaks across it. Enter an hour and a half before or two hours after high water, and always with a pilot."
    marks: "Dover Castle on its height east of the town is seen far off across the Strait; Shakespeare Cliff stands west of the town and the South Foreland's two lights three miles to the east-north-east."
    anchorage: "With north-easterly winds anchor in Dover bay abreast the town, eight fathoms on chalk and sand; the holding is poor and the road open from south-west round to south-east: leave it when the wind comes in. The West Bay of Dungeness is the better road against a north-easterly."
    tide: "It is high water at Dover about eleven at full and change, and the tide rises fourteen or fifteen feet at springs; the harbour dries an hour before low water. The tide from the Channel runs northward seven hours and a half."

