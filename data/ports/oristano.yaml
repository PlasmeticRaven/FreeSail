# FreeSail: Oristano's road as a port (package 104, beside the coast of Tunis's block, in the
# Tyrrhenian's region; no patch), on package 35's machinery; the marks are the Tyrrhenian's features
# file's (data/charts/features/tyrrhenian.yaml).
#
# Sources. Smyth 1828, pp. 293 to 298: the extensive bay of Oristano between San Marco and La Frasca,
# excellent anchorage during all the shore winds, but the westerlies blow full in with a great sea
# and surf; two or three vessels may lie securely in six or seven fathoms by rounding San Marco and
# bringing up east of the two towers; three shoals off the Tirsi; with the difficulty of wood and of
# water in summer, its unhealthiness and exposure to westerly winds, on the whole a bad anchorage;
# cattle and refreshments in any quantity, embarked at the Torre Grande; the city a busy and
# commercial place of 4,500 people, reckoned wealthy, its air deadly in summer; the Torre Grande a
# well constructed tower redoubt with magazines, where the produce of the plain and the coarse
# pottery are embarked; p. 113: the salterns 4,000 salms; p. 114: linseed in the greatest
# abundance. Purdy 1826, p. 84: the largest and best bay of the west coast but open to westerly
# winds, a commodious rendezvous for a fleet. Norie 1831, p. 62: not always to be recommended.
# Derrotero 1849, pp. 138 to 139: the Rada east of Cape Frasca in ten brazas, excellent holding of
# ooze, capable of the most numerous squadron. Lamberti 1844, pp. 330 to 332: wine loaded at Marceddi
# from Terralba. The corn of the brief's memory is in no period text read (grain only in the
# Admiralty 1913): JUDGEMENT in its note.
#
# The datum: UNVERIFIED; the Tyrrhenian's tiles, no patch.
#
# The stance. The King of Sardinia's, neutral to a King's ship. Prices FROM MEMORY or JUDGEMENT.

id: oristano
