  course_out_deg: 270            # judgement
  words:
    channel: "The bay lies between Cape San Marco and Cape Frasca, five miles apart, with reefs off each point and three shoals off the mouth of the Tirsi."
    marks: "Cape San Marco and its tower; Cape Frasca; the Torre Grande on the beach; Monte Arcuentu inland; the belfry of the city on its plain."
    anchorage: "Anchor east of Cape Frasca in seven fathoms of ooze, very good holding, room for a squadron; with a southerly lie inside La Frasca, with the shore winds anywhere. The westerlies blow full in with a great sea: it is no winter berth."
    tide: "No tide to speak of."

