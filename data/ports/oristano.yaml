source: "Smyth 1828 pp. 113-114, 293-298; Purdy 1826 p. 84; Norie 1831 p. 62; Derrotero 1849 pp. 138-139; Lamberti 1844 pp. 330-332"
datum: unverified   # no period sheet read with its datum; the modern shore is the grid's

