  vessel:
    kind: a boat
    name: a boat of the caricatore
    under: oars and a lateen sail
    note: "judgement"
  names: [Calogero Sciortino, Gerlando Lauricella, Alfonso Vella, Giuseppe Sferrazza]   # judgement
  skill: 0.75
  fee_pounds: 1.5                  # judgement; unverified
  cast: starboard
  course_out_deg: 200            # judgement
  words:
    channel: "The bank three miles south of the river carries three and a half fathoms on its head: clear it by the mole tower on with the upper light-house. Off the river di Naro a rock of four feet lies a mile and a quarter out. Carry sail till the moment of anchoring."
    marks: "Girgenti high on its ridge, every house seen; the temples on the slope below; the mole with its battery and light-house, the prison tower and the corn magazines of the caricatore. The convicts called galley slaves, two or three hundred of them, labour here at clearing the harbour of sand; they were once chained to the galleys' oars."
    anchorage: "Between the bank and the mole-head in seven to ten fathoms of clean sand and clay, nine fathoms of stiff clay a mile and a quarter off the mole steps for a south-wester. Inside the mole two and a half to three fathoms, shoaling with the southerly winds' sand; send a hawser to the mole-head post. The first ship to load is filled before another is begun."
    tide: "No tide to reckon on: the currents of this coast rise a foot or two with the wind, a north-wester setting them strongly to the south-east."

