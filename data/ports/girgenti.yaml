# FreeSail: the Mole of Girgenti as a port (package 105, Sicily and Malta's block), on package 35's
# machinery; the marks are the features file's (data/charts/features/sicily.yaml, the
# harbour patch girgenti). Step 3 of the package.
#
# Sources. Smyth 1824, pp. 201 to 205 and App. pp. xxi to xxiii: the caricatore of about a hundred houses with its corn magazines and a prison, seven hundred people besides two or three hundred galley-slaves kept to clear the harbour of the sand the southerly winds send in (p. 203); the mole built by Charles III in 1756 with the temple of Jupiter Olympius's stone; tolerable defence against Barbary cruisers; two lights, at the mole-head and on the cliff, useless (p. 204); the royal grain pits; between the bank and the mole-head excellent anchorage for ships of every description in seven to ten fathoms of sand and clay, open from W N W round southerly to S E, nine fathoms of stiff clay a mile and a quarter from the mole steps for a south-wester; inside the mole two and a half and three fathoms shoaling to nine feet, the port small and generally crowded, a hawser to the mole-head post; the first ship loading must be filled before another (App. p. xxiii); the bank three miles south of the river in three and a half to five fathoms (Purdy 1826, p. 153: Melville shoal); the rock of four feet off the river di Naro (Norie 1831, p. 130: Peril Rock). The city on its hill, fifteen thousand people.
#
# The holder: the King of the Two Sicilies' (`naples`) throughout, the court at Palermo from
# December 1798 to 1799 and again from January 1806 (James 1837, vol. 2, p. 214; vol. 4, p.
# 122), when the mainland was French and Sicily the Bourbons' (the lead's ruling of
# 2026-11-12: Sicily's ports under `naples` without rows). NOTE: the nations table's wars
# carry no dates and read Naples at peace with France every year (data/nations.yaml), so
# nothing here depends on Bourbon Sicily's wars after 1806.
#
# Decision 68: Smyth 1824, p. 203, has two or three hundred convicts at the Mole, condemned to
# hard labour and called galley slaves "from their formerly having been chained as rowers in
# the galleys", kept to clear the harbour (Purdy 1826, p. 153; Norie 1831, p. 130). The marks'
# words say so. No good or scenario is built on it.
#
# No source on file names a pilot here: the boat and its people JUDGEMENT.
# Prices FROM MEMORY or JUDGEMENT, in sterling.

