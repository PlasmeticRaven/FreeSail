# FreeSail: Stora as a port (package 104, the Sardinian sea's region, the harbour patch stora), on
# package 35's machinery; the marks are the features file's (data/charts/features/sardinian-sea.yaml).
#
# Sources. Berard 1837, pp. 122 to 125 (the survey of the 1830s): the port of Stora a small cove where
# brigs and even corvettes might lie sheltered in winter, moored four ways close in, 9 and 10
# brasses in the middle; the old ruin by the beach the Moors call the magazines, where the corn,
# the hides and the wax the Arabs of the interior would sell to the Europeans or send to Algiers
# were long gathered; the Company's ships came of old to load corn, lying in 5 or 6 brasses and
# watering in the ravine by the magazines; the Moors call it the safest of the regency; Rusicada
# the port nearest Constantine, its river passing Constantine sixteen hours' march off. Purdy
# 1826, p. 327: the little town of Storo half-way between Kollo and Cape Ferro. Derrotero 1849, pp.
# 257 to 259: open to the NE, an excellent shelter from the NNW and W round to the S; water, wood
# and game, the natives hostile. Smyth 1854, pp. 94 to 95: among the principal loading-places of
# the eastern coast. "The anchorage for Constantine" (the brief) by Berard's inference (the sources
# give the road to Constantine, not the phrase).
#
# The datum: UNVERIFIED; Philippeville's and Skikda's works in the grid.
#
# The stance. The regency of Algiers' (the nations table, `algiers`), neutral to a King's ship as to every flag the table has. Its corsairs noted and not modelled. Prices FROM MEMORY or JUDGEMENT, sterling at the exchange, each good's note naming its source where a text names the trade. Decision 67: what is true of the port only for some years is said with its years; the French conquest of the 1830s, after the range, is said and not written as a row.

