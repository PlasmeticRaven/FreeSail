pilot:
  station: lipari-anchorage
  cruising_nm: 2
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: a boat of Lipari
    under: oars and a lateen sail
    note: "judgement"
  names: [Bartolo Famularo, Giovanni Natoli, Angelo Cincotta, Domenico Russo]   # judgement
  skill: 0.8
  fee_pounds: 1.5                  # judgement; unverified
  cast: starboard
  course_out_deg: 90            # judgement
  words:
    channel: "The water is very deep, thirty to fifty fathoms close in, except a lava reef of three fathoms off the beach of the northern bay. West of the island the Bentinck shoal has two and a half fathoms on a pinnacle; the channel to Vulcano is a mile broad and safe, with a ripple in some winds."
    marks: "The castle on its rock of black volcanic glass between the town's two bays, built after Barbarossa plundered the town in 1544 and carried off great numbers of its people as captives; Monte Rosso and Cape Capistello; the white pumice mountain of Campo Bianco to the north; Vulcano smoking to the south."
    anchorage: "Between the lava reef and the castle in twelve to fourteen fathoms, a stern-fast to the shore; room for sixteen or seventeen vessels. The anchorage is open to every wind but that over the island; large ships go to the northern bay under the Scala di Canneto, where the south-easter is inconvenient."
    tide: "No tide to speak of; a set and a ripple in the channel to Vulcano with some winds."

