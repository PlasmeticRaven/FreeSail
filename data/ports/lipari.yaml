# FreeSail: Lipari as a port (package 105, Sicily and Malta's block), on package 35's
# machinery; the marks are the features file's (data/charts/features/sicily.yaml, the
# harbour patch lipari). Step 3 of the package.
#
# Sources. Smyth 1824, pp. 249 to 268 and App. pp. xxxi to xxxii: nearly twelve thousand people, the seat of the islands' government (p. 261); the castle on a huge mass of volcanic glass with a garrison of invalid veterans, the greater part built by Charles V after Barbarossa had plundered the town in 1544 and carried off such numbers of captives that they bred a disease in his fleet (p. 264); the pratique office on the marina; the islanders excellent sailors, exposed to the corsairs' visits (p. 250); wine, currants, bitumen, pumice, sulphur, coral and fish exported, the malmsey known over Europe (pp. 250, 266); water scarce, cisterns (p. 249); the water thirty to fifty fathoms close in, a lava reef of three fathoms off the northern bay's beach, sixteen or seventeen vessels between it and the castle in twelve to fourteen fathoms with stern-fasts ashore, the island's craft off the pratique office mole, large ships under the Scala di Canneto where the S E wind is inconvenient (App. pp. xxxi to xxxii); the Bentinck shoal of two and a half fathoms west of the island; the channel to Vulcano a mile broad and safe. Purdy 1826, p. 120: the anchorage exposed to every wind but that over the island. The anchorage lies on tyrrhenian's tile (the seam rule), the town in the harbour patch.
#
# The holder: the King of the Two Sicilies' (`naples`) throughout, the court at Palermo from
# December 1798 to 1799 and again from January 1806 (James 1837, vol. 2, p. 214; vol. 4, p.
# 122), when the mainland was French and Sicily the Bourbons' (the lead's ruling of
# 2026-11-12: Sicily's ports under `naples` without rows). NOTE: the nations table's wars
# carry no dates and read Naples at peace with France every year (data/nations.yaml), so
# nothing here depends on Bourbon Sicily's wars after 1806.
#
# Decision 68: Smyth 1824, p. 264, has Barbarossa carrying off "such numbers of captives" from
# Lipari in 1544. The marks' words say so. No good or scenario is built on it.
#
# No source on file names a pilot here: the boat and its people JUDGEMENT.
# Prices FROM MEMORY or JUDGEMENT, in sterling.

id: lipari
name: Lipari
nation: naples
source: "Smyth 1824 pp. 249-268, App. pp. xxxi-xxxii; Purdy 1826 p. 120"
datum: unverified   # no period sheet read with its datum; the modern shore is the grid's

