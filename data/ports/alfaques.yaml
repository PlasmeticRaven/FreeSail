# FreeSail: the Alfaques and the port of San Carlos as a port (package 101, the Catalan
# coast's block), a small file on package 35's machinery; the marks are the features file's
# (data/charts/features/catalan-coast.yaml, the harbour patch alfaques, which keeps the
# eleven gauges' raise over the Ebro's delta: tools/build_charts.py's recipe).
#
# Sources. Tofino 1787, Derrotero del Mediterraneo, pp. 115 to 119: La Rapita or San Carlos
# in latitude 40 36 30; the haven 3 to 4 brazas in general, all mud, mooring NW and SE, for
# frigates and xebecs at most; a great ship from the east wind SSE of the Codonol tower in 6
# or 6 1/2 brazas mud; the NW winds, the Maestrales, the most harmful, the loose mud letting
# the anchors drag; no fresh water nor wood but La Rapita's brackish well; much salt, ships
# always employed in that traffic; a canal lately opened from Amposta to San Carlos (Smyth
# 1854, p. 9: begun in 1792, abortive). Purdy 1826, pp. 25 to 26: 3 and 3 1/2 fathoms, mud
# everywhere; the winds blowing in from S S E to S S W. Michelot 1715, OCR l. 2259.
#
# The period's shore. The chart's tiles are the modern grid's, the delta as it is now: it
# has grown since Tofino drew it (the Admiralty 1913: Buda island increasing every year,
# the Banya advancing seaward, the Fangar point threatening to close its port), and its
# mouths have changed. No period plan is read with its datum (Heather's 'Le Sofa Bay' of
# 1814 is read and not transcribed, CC BY-NC-SA; Tofino's 'Carta esferica desde Cabo
# Oropesa a Cabo de Creux' of 1786 is too small a scale): `datum: unverified`.
#
# The tide. The block's gauge, Barcelona's; no gauge on this coast.
#
# The stance: Spain's (the nations table), hostile to a King's ship from 12 December 1804
# (James 1837, vol. 3, p. 200), undated here (Tortosa's fall to the French in January 1811
# FROM MEMORY; whether they held San Carlos not read). The nations table's wars are one
# year's picture (see barcelona.yaml's head). Prices JUDGEMENT, in sterling.

id: alfaques
name: the Alfaques
nation: spain
source: "Tofino 1787 pp. 115-119; Purdy 1826 pp. 25-26; Michelot 1715 OCR l. 2259"
datum: unverified   # no period sheet read with its datum; the modern delta is the grid's

outer_road:
  feature: alfaques-outer-road
  name: the road within Point de la Bana
  lat_deg: 40.6054
  lon_deg: 0.6962
  depth_fathoms: 6
anchorage:
  feature: alfaques-haven
  name: the haven of the Alfaques
  lat_deg: 40.6150
  lon_deg: 0.6500
mooring:
  feature: alfaques-haven
  name: the haven of the Alfaques
  lat_deg: 40.6150
  lon_deg: 0.6500
  depth_fathoms: 3
  bottom: soft mud
shore:
  feature: la-rapita
  name: La Rapita
  lat_deg: 40.6180
  lon_deg: 0.5930

pilot:
  station: alfaques-outer-road
  cruising_nm: 2                 # judgement: the fishermen's boats
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: a fishing boat of La Rapita
    under: a lateen sail and oars
    note: "judgement"
  names: [Forcadell, Navarro, Arasa, Fabregat, Curto, Subirats]   # judgement
  skill: 0.8
  fee_pounds: 1                  # judgement; unverified
  cast: starboard
  course_out_deg: 160            # out past the sandy point to the south-south-east (judgement)
  words:
    channel: "Steer for the tower of San Juan and keep off the point of the Palma Marina, which runs out shoal near three quarters of a mile; the lead is your best guide, the land is so low."
    marks: "The Sierras of Montsia behind La Rapita, their summit the mark by night; the long low point of the Bana on the south; the towers of Codonol and San Juan within."
    anchorage: "Three or four fathoms of soft mud all over the haven, mooring north-west and south-east; a great ship from the easterlies lies in six fathoms abreast of the point of Decain. The north-westers come down hard and the anchors drag."
    tide: "No tide; the water rises and falls with the winds. Off the Ebro the current sets onto the mouths with a sea wind."

tide:
  establishment: Barcelona
  enter_on: flood
  leave_on: ebb

market:
  currency: pounds
  goods:
    - {good: salt, price: 6, origin: spain, note: "much salt, vessels always employed in this traffic (Tofino 1787, p. 116; Purdy 1826, p. 25); the price JUDGEMENT, cheap against Barcelona's"}
    - {good: rice, price: 20, origin: spain, note: "JUDGEMENT; the delta's rice FROM MEMORY, no period text naming it"}
    - {good: wheat, price: 28, origin: spain, note: "JUDGEMENT"}
    - {good: salt fish, price: 26, origin: spain, note: "the fishermen of La Rapita; JUDGEMENT"}
    - {good: wine, price: 20, origin: spain, note: "JUDGEMENT"}
    - {good: olive oil, price: 40, origin: spain, note: "JUDGEMENT"}
    - {good: timber, price: 12, origin: spain, note: "JUDGEMENT; floated down the Ebro (the Admiralty 1913, modern)"}
    - {good: biscuit, price: 32, origin: spain, note: "JUDGEMENT"}
    - {good: brandy, price: 70, origin: spain, note: "JUDGEMENT"}
    - {good: fresh beef, price: 26, origin: spain, note: "JUDGEMENT"}

dockyard:
  kind: chandlers
  items:
    - {item: topmast, hours: 24, pounds: 55, note: "a spar from the Ebro's rafts; judgement"}
    - {item: cordage, hours: 4, pounds_per_fathom: 0.07, note: "judgement"}
    - {item: water, hours_per_ton: 0.4, pounds_per_ton: 0.2, note: "La Rapita's brackish well, the only water of the haven (Tofino 1787, p. 118); judgement"}
    - {item: provisions, hours_per_day: 0.08, pounds_per_man_day: 0.06, note: "judgement"}

crew_pool:
  # judgement: a few fishermen of La Rapita
  able: {hands: 1, pounds: 2, delay_h: 24}
  ordinary: {hands: 2, pounds: 1.5, delay_h: 24}
  landsman: {hands: 4, pounds: 1, delay_h: 12}

closed_to: []

tracks:
  # out of the haven by its south-west mouth between the Bana's sand and the main
  # (Tofino 1787, p. 116: steer for the tower of San Juan going in), the grid's channel
  to_sea: [alfaques-outer-road, 40 35.7 N 0 36.3 E, 40 34.8 N 0 34.7 E, 40 30 N 0 37 E]
  from_sea: [40 30 N 0 37 E, 40 34.8 N 0 34.7 E, 40 35.7 N 0 36.3 E, alfaques-outer-road]
  in: [alfaques-outer-road]
