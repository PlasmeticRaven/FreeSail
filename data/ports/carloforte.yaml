# FreeSail: Carloforte on San Pietro as a port (package 104, beside the coast of Tunis's block, in the
# Tyrrhenian's region; no patch), on package 35's machinery; the marks are the Tyrrhenian's features
# file's (data/charts/features/tyrrhenian.yaml).
#
# Sources. Smyth 1828, pp. 306 to 311 (his survey of 1823 to 1824): San Pietro with the coast of
# Sant'Antioco forms a spacious harbour, secure in every wind; enter by the southern channel and
# anchor in six or seven fathoms between Sant'Antioco and Carloforte, where he rode out two very
# severe north-westers in perfectly smooth water; from the north borrow on Piana to avoid the Secca
# de' Marmi; water at the wells between Spalmatore point and the Vittorio tower; first settled by
# the refugees of Tabarka in 1737 (not 1738); the town and castle named Carloforte; the Vittorio
# redoubt of eight guns on the parapet and four in casemates, its light column not hitherto used;
# in 1798 upwards of 2,000 Moors from six Tunisian vessels landed at Malfatano and drove 850 men,
# women and children into slavery, ransomed only in 1805; after 1805 a town wall; 2,830 people in
# 1824 busied with their salterns, vineyards and fisheries of tunnies, anchovies, sardines and
# coral, the salterns 16 or 17,000 salms a year. Purdy 1826, p. 84: a good road east of the island,
# well sheltered from westerly winds, 4 to 6 fathoms. Norie 1831, p. 63: the Carlo fort and a little
# battery defending the road. Derrotero 1849, p. 140: open only to the south. **The *Vanguard*'s
# refit here in May 1798** (the brief) is in no text read (Smyth 1854, p. 242, has her dismasting
# in the gulf of Lyons on 22 May 1798 and no port): FROM MEMORY, written in no row.
#
# The datum: UNVERIFIED; the Tyrrhenian's tiles, no patch (the region is built).
#
# The stance. The King of Sardinia's (the nations table, `sardinia`), neutral to a King's ship;
# decision 67: the French holding of 1793 written as dated rows. Prices FROM MEMORY or JUDGEMENT,
# sterling at the exchange.

