  name: the landing under the castle
  lat_deg: 36.9620
  lon_deg: 8.7560

pilot:
  station: tabarka-road
  cruising_nm: 2                 # judgement
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: the castle's boat of Tabarka
    under: a lateen sail and oars
    note: "judgement"
  names: [Mahmud, Ali, Hassan, Yusuf, Mustafa, Salah, Hamuda, Ahmed]   # judgement
  skill: 0.75
  fee_pounds: 2                  # judgement; unverified
  cast: starboard
  course_out_deg: 30            # judgement
  words:
    channel: "Never try the channel inside the island: its bottom is a bar of rocks, and a ledge from the main always shows breakers in a northerly."
    marks: "The barren island crowned with the Genoese castle and its four or five towers, near joined to the main by its bank of sand; the corn magazines on the main."
    anchorage: "Anchor east of the island half a mile off, the main seen past the sentry box of its south point, in eight fathoms of fine sand and weed: very good holding, good in a westerly, open to the north. Fire a gun and a pilot comes off."
    tide: "No tide to speak of; two miles off the set is slow to the north-north-west."

