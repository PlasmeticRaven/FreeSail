# FreeSail: Tabarka as a port (package 104, the coast of Tunis's region, the harbour patch tabarka), on
# package 35's machinery; the marks are the features file's (data/charts/features/tunis-coast.yaml).
#
# Sources. Purdy 1826, p. 331: the island a mile and a half round, a castle with several towers and
# corn magazines on its north end, built by the Genoese; formerly frequented by vessels from Spain
# and Tuscany for corn, since by the coral boats, about 150 a year of ten men each in the ten years
# before 1811, mostly of Sicily and Naples, each paying for leave; the roads east and west of the
# island for small vessels of 10 or 12 feet, north-east of it good sand in 6 or 7 fathoms. Norie 1831,
# pp. 352 to 353: ships of 18 or 20 feet outside in 8 or 9 fathoms, sheltered in westerlies but not
# in northerly; fire a gun and a pilot comes off. Berard 1837, pp. 141 to 143: a sterile rock
# crowned with fortifications, the Lomellini of Genoa's for several centuries, its colony 1,500
# persons; given up by treachery to the Bey in 1738 (the brief's 1741 falls to it); the ruined mole
# with 14 or 15 feet within, where ships came to load corn. Derrotero 1849, pp. 262 to 263: anchor
# east of the island in 9 or 10 brazas of fine sand and weed, very good holding, open to the north.
#
# The datum: UNVERIFIED; the modern port of Tabarka in the grid.
#
# The stance. The regency of Tunis's, the Bey's (the nations table, `tunis`), neutral to a King's ship as to every flag the table has; the Bey's ships and corsairs noted and not modelled. Prices FROM MEMORY or JUDGEMENT, sterling at the exchange, each good's note naming its source where a text names the trade. Decision 67: the nation dated from the Bey's taking of the island (1738), the Lomellini's before.

id: tabarka
name: Tabarka
nation:
  - {nation: tunis, since: 1738-01-01, source: "the Bey of Tunis's since the island was given up to him by treachery in 1738 (Berard 1837, p. 142), the Lomellini of Genoa's for several centuries before; the day JUDGEMENT, the year Berard's"}
source: "Purdy 1826 p. 331; Norie 1831 pp. 352-353; Berard 1837 pp. 141-143; Derrotero 1849 pp. 262-263"
datum: unverified   # no period sheet read with its datum; the modern shore is the grid's

