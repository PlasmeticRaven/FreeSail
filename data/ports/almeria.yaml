# FreeSail: Almería as a port (spec M6 §26; package 79c, the Mediterranean west's block), on
# package 35's machinery; the marks are the features file's
# (data/charts/features/mediterranean-west.yaml).
#
# Sources. Tofiño 1787, Derrotero del Mediterráneo, 'Fondeadero y Ciudad de Almería', pp. 47
# to 48: the road from the Point of Torrejón (a fort of two guns) to the Point of the River,
# two miles; the city at the bottom of a bay a little more than three quarters of a mile
# deep; ships wanting shelter from the east wind moor SSW of the bastion of the Santísima
# Trinidad, the city's east angle, in 10 to 15 brazas sand three quarters of a mile from
# the beach; frigates, xebecs and lesser craft more commodiously SW and WSW of the bastion
# in 8 to 10 brazas, the smaller in 5 or 6 off the guards' house, where they may make fast
# to the shore; all the road strewn with the ballast stones of the ships that come to load,
# which chafe the cables; water easily got at the city's fountains, good and plentiful.
# Purdy 1826, pp. 14 to 15.
#
# The datum: UNVERIFIED. No period sheet is patched at Almería in this package (Roux's plate
# 4 and Heather's plan by Michelot are read and not transcribed, CC BY-NC-SA); the chart's
# depths are EMODnet's at the lowest astronomical tide, the modern port's moles in the grid.
#
# The stance. Almería is Spain's: hostile to a King's ship from December 1804, open to a
# neutral. Prices FROM MEMORY or JUDGEMENT, sterling at the exchange.

id: almeria
name: Almería
nation: spain
source: "Tofiño 1787 pp. 47-48 (the road of Almería, the bastion of the Santísima Trinidad, the ballast stones, the water); Purdy 1826 pp. 14-15"
datum: unverified

outer_road:
  name: the bay of Almería off the Point of Torrejón
  lat_deg: 36.8100
  lon_deg: -2.4750
anchorage:
  feature: almeria-road
  name: Almería road
  lat_deg: 36.8250
  lon_deg: -2.4620
mooring:
  feature: almeria-road
  name: south-west of the bastion of the Santísima Trinidad
  lat_deg: 36.8250
  lon_deg: -2.4620
  depth_fathoms: 8
  bottom: sand strewn with ballast stones
  deep_draught_ft: 20    # judgement: eight to ten brazas for a frigate
shore:
  feature: almeria
  name: the beach before the city of Almería
  lat_deg: 36.8390
  lon_deg: -2.4640

pilot:
