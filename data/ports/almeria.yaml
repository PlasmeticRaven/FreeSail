  cruising_nm: 3                 # judgement
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: a falucho of Almería
    under: a lateen sail and oars
    note: "judgement"
  names: [Martínez, Góngora, Sánchez, Cara, Fernández, Ibáñez, Moya, Salmerón]   # judgement
  skill: 0.8
  fee_pounds: 1.5                # judgement; unverified
  cast: starboard
  course_out_deg: 180            # out to the south (judgement)
  words:
    channel: "The road is open from the Point of Torrejón to the Point of the River, two miles; there is no danger in it but the ballast stones, and the coast eastward of the river is foul with stones and has no anchorage."
    marks: "The city at the bottom of its bay under the Alcazaba, the bastion of the Santísima Trinidad at its east angle, the fort on the Point of Torrejón."
    anchorage: "A frigate moors south-west of the bastion of the Santísima Trinidad in eight to ten brazas, sand; for shelter from the east wind, south-south-west of it in ten to fifteen, three quarters of a mile off. Mind the ballast stones the ships have thrown over, which chafe the cables. Good water at the city's fountains."
    tide: "There is next to no tide; the current runs to the eastward along the coast."

