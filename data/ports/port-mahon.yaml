# FreeSail: Port Mahon as a port (spec M6 §26; package 79c, the Balearics), on package 35's
# machinery; the marks are the features file's (data/charts/features/balearics.yaml).
#
# Sources. Tofiño 1787, Derrotero del Mediterráneo, 'Entrada en el Puerto de Mahon', pp. 211
# to 213: with a fair wind steer up the middle of the mouth till past the Point of Philipet,
# leaving it to starboard and to port the point where stood the famous castle of St Philip,
# among whose ruins some low batteries remain; past them a ship may close either shore,
# five brazas close to and twelve and eighteen in the middle; the south shore preferred,
# passing between it and the island of the Lazareto; at Cala Pedrera a ship of the line or a
# frigate must close the south shore, passing between it and the Isla del Rey (where the
# hospital is) and the islet Redonda, or between those two, for the north channel of five
# brazas is narrow and wants much practice; east-north-east of the Isla del Rey a flat of 24
# feet on which ships anchored on its south side with southerly winds have touched with
# their sterns; then on within half a cable of either shore to abreast of the island of the
# masting sheers and the arsenal's island joined to it by a bridge, and anchor south of it
# in 7 or 8 brazas, good ground, moored NE and SW. With scant winds mind the ledges off the
# Mola, off Philipet and off St Philip's point, which break with any sea, and Es Redó under
# the castle; or anchor among them or without in 20 to 30 brazas, good ground, where there
# is much sea with a hard northerly. On Cape Mola a signal tower, its signals repeated from
# another over the arsenal. Vargas Ponce 1787, pp. 113 to 117, and Grasset 1807 (the
# lazaretto; the hospital of the Isla del Rey, the English building of 1711 and its
# successor); Purdy 1826, pp. 42 to 44.
#
# The yard and the hospital island. The arsenal of Mahon (the masting sheers and the
# careening wharves the British built in their years here, 1708 to 1756, 1763 to 1782 and
# 1798 to 1802, FROM MEMORY) is the King of Spain's in 1805: a yard. The Isla del Rey's
# hospital is noted and not modelled. Port Mahon was given back to Spain by the Peace of
# Amiens (1802); Nelson's fleet did not use it in 1803 to 1805 (FROM MEMORY).
#
# The datum: UNVERIFIED. No period sheet is patched at Mahon in this package (Tofiño's plan
# 'El Puerto de Mahon y su costa' and Roux's plate 10, read and not transcribed, CC BY-NC-SA;
# the harbour's marks are placed by hand on the tiles by Tofiño's plan of the entry, the
# features file says how). The chart's depths are EMODnet's at the lowest astronomical tide.
#
# The stance. Port Mahon is Spain's in 1805: hostile to a King's ship from December 1804,
# open to a neutral. Prices FROM MEMORY or JUDGEMENT, sterling at the exchange.

id: port-mahon
name: Port Mahon
nation: spain
source: "Tofiño 1787 pp. 211-213 (the entry, the passages, the flat of 24 feet, the anchorage by the arsenal, the ledges, the outer anchorage); Vargas Ponce 1787 pp. 113-117; Grasset 1807; Purdy 1826 pp. 42-44"
datum: unverified

