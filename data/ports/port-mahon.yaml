  name: the quay below Mahon
  lat_deg: 39.8885
  lon_deg: 4.2650

pilot:
  station: mahon-outer-road
  cruising_nm: 4                 # judgement
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: a llaüt of Mahon
    under: a lateen sail and oars
    note: "judgement"
  names: [Pons, Orfila, Mercadal, Seguí, Carreras, Taltavull, Febrer, Sintes]   # Minorcan names: judgement
  skill: 0.9
  fee_pounds: 2                  # judgement; unverified
  cast: starboard
  course_out_deg: 120            # out by the mouth to the south-east (judgement)
  words:
    channel: "With a fair wind steer up the middle of the mouth till past the Point of Philipet, leaving it to starboard and to port the ruins of St Philip; then keep the south shore, passing between it and the Lazareto's island, and at Cala Pedrera close the south shore to pass between it and the Isla del Rey with its hospital and the islet Redonda; the north channel is narrow and wants practice. With a scant wind mind the ledges off the Mola, off Philipet and off St Philip's point, which break with any sea, and Es Redó under the castle."
    marks: "Mount Toro over the island; Cape Mola with its signal tower on the north-east of the mouth; Philipet's point and the ruins of St Philip on either hand; Georgetown on the south shore; the Isla del Rey's hospital; the town of Mahon at the head of the harbour."
    anchorage: "Go on within half a cable of either shore to abreast of the arsenal's island and anchor south of it in seven or eight brazas, good ground, moored north-east and south-west. Do not anchor on the south side of the flat east-north-east of the Isla del Rey, with twenty-four feet on it, with a southerly wind: ships have touched with their sterns."
    tide: "There is no regular tide here; the sea rises a foot or two with the gales, and the current outside follows the wind."

