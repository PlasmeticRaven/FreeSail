  name: south of the arsenal's island, moored north-east and south-west
  lat_deg: 39.8905
  lon_deg: 4.2720
  depth_fathoms: 7
  bottom: good holding ground
  deep_draught_ft: 22    # judgement: seven or eight brazas
shore:
