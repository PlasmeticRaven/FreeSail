# FreeSail: Syracuse as a port (package 105, Sicily and Malta's block), on package 35's
# machinery; the marks are the features file's (data/charts/features/sicily.yaml, the
# harbour patch syracuse). Step 2 of the package.
#
# Sources. Smyth 1824, pp. xv to xvi and 162 to 170: the Plemmyrium shoals a third of the way across the entrance, 3 1/4 fathoms the least, the two columns of Jupiter Olympius in one the leading mark; the best anchorage between the town and the salt-works in 5 to 9 fathoms, black mud; south-westerly winds the most violent, easterly and south-easterly the most swell; a sunken vessel 320 yards east of the landing; the town wholly on Ortygia; salt, wine, oil and fish its only trade; Nelson's fleet refitted here in five days in 1798. Purdy 1826, pp. 142 to 144: the entrance half a mile wide under Maniace castle and its light; water from the aqueduct and the Anapus; beef cheap; about 13,000 people.
#
# The holder: the King of the Two Sicilies' (`naples`) throughout, the court at Palermo from
# December 1798 to 1799 and again from January 1806 (James 1837, vol. 2, p. 214; vol. 4, p.
# 122), when the mainland was French and Sicily the Bourbons' (the lead's ruling of
# 2026-11-12: Sicily's ports under `naples` without rows). NOTE: the nations table's wars
# carry no dates and read Naples at peace with France every year (data/nations.yaml), so
# nothing here depends on Bourbon Sicily's wars after 1806.
# Prices FROM MEMORY or JUDGEMENT, in sterling.

id: syracuse
name: Syracuse
nation: naples
source: "Smyth 1824 pp. xv-xvi, 162-170; Purdy 1826 pp. 142-144"
datum: unverified   # no period sheet read with its datum; the modern shore is the grid's

outer_road:
  name: off the mouth of the Great Harbour
  lat_deg: 37.0500
  lon_deg: 15.3100
  depth_fathoms: 20
anchorage:
  feature: syracuse-harbour
  name: the Great Harbour of Syracuse
  lat_deg: 37.0494
  lon_deg: 15.2859
mooring:
  feature: syracuse-harbour
  name: the Great Harbour, off the salt-works
  lat_deg: 37.0494
  lon_deg: 15.2859
  depth_fathoms: 7
  bottom: black mud
shore:
  feature: syracuse
  name: the landing at Syracuse
  lat_deg: 37.0620
  lon_deg: 15.2930

pilot:
  station: syracuse-harbour
  cruising_nm: 2
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: a boat of Syracuse
    under: oars and a lateen sail
    note: "judgement"
  names: [Giuseppe Bonanno, Gaetano Arena, Francesco Cannizzaro, Antonino Lombardo, Vincenzo Rizzo]   # judgement
  skill: 0.8
  fee_pounds: 1.5                  # judgement; unverified
  cast: starboard
  course_out_deg: 110            # judgement
  words:
    channel: "The mouth is half a mile wide under the castle of Maniace. The Plemmyrium shoal runs a third of the way across from the south point: bring the two columns of Jupiter Olympius in one and run in in nine to fifteen fathoms."
    marks: "The castle of Maniace and its light on the point of Ortygia; the town walled on its island; the two columns of Jupiter Olympius across the harbour."
    anchorage: "Between the town and the salt-works in five to nine fathoms of black mud; the winter mooring in six and a half, clay. The south-westerlies blow hardest, the easterlies send in the most swell; a sunken vessel lies 320 yards east of the landing."
    tide: "No tide to speak of."

tide:
  establishment: Syracuse
  enter_on: flood
  leave_on: ebb

market:
  currency: pounds
  goods:
    - {good: wheat, price: 12.0, origin: naples, note: "Sicily's corn (Smyth 1824, pp. 135 and 160 to 163; Purdy 1826, p. 137); the price JUDGEMENT"}
    - {good: wine, price: 12.5, origin: naples, note: "the island's wine exported (Smyth 1824; Purdy 1826, p. 137); the price JUDGEMENT"}
    - {good: olive oil, price: 38.0, origin: naples, note: "oil exported (Smyth 1824; Purdy 1826, p. 137); the price JUDGEMENT"}
    - {good: salt, price: 2.5, origin: naples, note: "the salt-works (Smyth 1824, pp. xv, 160); the price JUDGEMENT"}
    - {good: silk, price: 345.0, origin: naples, note: "silk exported (Smyth 1824, pp. 102, 135; Purdy 1826, p. 137); the price JUDGEMENT"}
    - {good: oranges, price: 6.0, origin: naples, note: "the island's fruit (Purdy 1826, p. 137); the price JUDGEMENT"}
    - {good: lemons, price: 7.0, origin: naples, note: "JUDGEMENT"}
    - {good: cotton, price: 55.0, origin: britain, note: "foreign cottons the chief import at Messina (Purdy 1826, p. 137); the price JUDGEMENT"}
    - {good: salt fish, price: 22.0, origin: naples, note: "the tunny fisheries (Smyth 1824, pp. viii, 102); the price JUDGEMENT"}
    - {good: fresh beef, price: 9.5, origin: naples, note: "JUDGEMENT; beef cheap at Syracuse (Purdy 1826, p. 144)"}
    - {good: vegetables, price: 3.0, origin: naples, note: "JUDGEMENT"}
    - {good: canvas, price: 4.0, origin: britain, note: "JUDGEMENT"}
    - {good: timber, price: 16.0, origin: naples, note: "JUDGEMENT"}
    - {good: fresh fish, price: 4, origin: naples, note: "fish among its only trade (Smyth 1824, p. 163); the price JUDGEMENT"}

dockyard:
  kind: chandlers
  items:
    - {item: topmast, hours: 24, pounds: 60, note: "a spar from the merchants' stores; Nelson's fleet refitted here in five days in 1798 (Smyth 1824, p. 163); judgement"}
    - {item: cordage, hours: 6, pounds_per_fathom: 0.07, note: "judgement"}
    - {item: water, hours_per_ton: 0.25, pounds_per_ton: 0.1, note: "water from the aqueduct and the Anapus (Purdy 1826, p. 144); judgement"}
    - {item: provisions, hours_per_day: 0.05, pounds_per_man_day: 0.04, note: "judgement"}

crew_pool:
  # judgement
  able: {hands: 2, pounds: 2, delay_h: 24}
  ordinary: {hands: 2, pounds: 1.5, delay_h: 24}
  landsman: {hands: 3, pounds: 1, delay_h: 24}

closed_to: []

# The tracks redrawn by the chart session's tracks step (package 111's ruling 1): each leg's
# least depth at the grid's datum by the chart's own reader (`Chart.least_depth_along`, every
# half cell of the finest level under the leg and every 2 m again under 8 m), the way the
# grid's deepest from the anchorage to open water (a search on a 10 m lattice), every leg
# clear of the land by the game's guard. The old way ran due east over the grid's shoal off Ortygia's south-west
# (0.5 m): out through the middle third of the mouth, the Plemmyrium shoal's third to the south
# left on the starboard hand going out (Smyth). Least: the harbour to 37 02.82 N 15 17.43 E 6.1 m;
# on to 37 02.87 N 15 18.00 E 5.0 m (the grid's ridge across the harbour); on to 37 03 N
# 15 18 30 E 18.3 m; on to 37 03 N 15 22 E 46.5 m. The way in from the sea ends off the mouth
# and the inner track goes on by the same marks, the outer road (off the mouth) to the first of
# them 18.3 m (old: in from the sea to the harbour, and the business's way in went back out to
# the outer road and straight in again over the shoal).
tracks:
  to_sea: [syracuse-harbour, 37 02.82 N 15 17.43 E, 37 02.87 N 15 18.00 E, 37 03 N 15 18 30 E, 37 03 N 15 22 E]
  from_sea: [37 03 N 15 22 E, 37 03 N 15 18 30 E]
  in: [37 02.87 N 15 18.00 E, 37 02.82 N 15 17.43 E, syracuse-harbour]
