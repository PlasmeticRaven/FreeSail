    under: oars and a lateen sail
    note: "judgement"
  names: [Salvatore Russo, Giuseppe Bonanno, Gaetano Arena, Francesco Cannizzaro]   # judgement
  skill: 0.75
  fee_pounds: 1.5                  # judgement; unverified
  cast: starboard
  course_out_deg: 150            # judgement
  words:
    channel: "Pass three quarters of a mile south of the light on its reef, fourteen to seventeen fathoms, and mind the Hybla shoal, three fathoms and a quarter on hard rock in the middle of the entrance."
    marks: "The Torre d'Avalos and its poor light; the forts Garcia and Vittoria at the north-west end of the town; Magnisi and its martello tower to the south."
    anchorage: "Abreast the town in eight to eleven fathoms of stiff clay; moor north and south. The winter's westerlies come off the land; easterly and southerly gales send in a swell."
    tide: "No tide to speak of."

