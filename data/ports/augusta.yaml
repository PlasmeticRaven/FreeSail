# FreeSail: Augusta as a port (package 105, Sicily and Malta's block), on package 35's
# machinery; the marks are the features file's (data/charts/features/sicily.yaml, the
# harbour patch augusta). Step 2 of the package.
#
# Sources. Smyth 1824, pp. xiv to xv and 160 to 162: the ledge 180 yards south of Grossa Longa; pass three quarters of a mile south of the light, which stands on the reef where H.M.S. Electra was lost in 1808, the channel 14 to 17 fathoms; the Hybla shoal of 3 1/4 to 5 fathoms on hard rock; anchor abreast the town in 8 to 11 fathoms, moor north and south in 10 of stiff clay; the westerly winds off the land trouble ships in winter, easterly and southerly gales send in a swell; the forts Garcia and Vittoria, the Torre d'Avalos with a miserable light; about 8,000 people, exporting salt, oil, honey and wine. Purdy 1826, p. 141: the Hybla shoal in the middle of the entrance.
#
# The holder: the King of the Two Sicilies' (`naples`) throughout, the court at Palermo from
# December 1798 to 1799 and again from January 1806 (James 1837, vol. 2, p. 214; vol. 4, p.
# 122), when the mainland was French and Sicily the Bourbons' (the lead's ruling of
# 2026-11-12: Sicily's ports under `naples` without rows). NOTE: the nations table's wars
# carry no dates and read Naples at peace with France every year (data/nations.yaml), so
# nothing here depends on Bourbon Sicily's wars after 1806.
# Prices FROM MEMORY or JUDGEMENT, in sterling.

id: augusta
name: Augusta
nation: naples
source: "Smyth 1824 pp. xiv-xv, 160-162; Purdy 1826 p. 141"
datum: unverified   # no period sheet read with its datum; the modern shore is the grid's

