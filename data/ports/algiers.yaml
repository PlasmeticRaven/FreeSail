  words:
    channel: "The bay lies between the Point Pescado and Cape Matifu, ten miles and a half; the mole and its lantern are two miles and a half south-east of the Point Pescado. A little north of the lantern is a shoal awash."
    marks: "The city white on its hill like a topsail, the mole and the lantern with its three tiers of guns, the Emperor's castle above the city; Cape Matifu low, with a table hill near its end that seems an island from five or six leagues."
    anchorage: "Anchor anywhere in the bay in what water you will, but look to your cables: though the ground is mostly sand there are patches of gravel, loose stones and lost anchors. With the wind from east round by north to north-west there is much sea: leave the anchorage if it comes on with an ill look, unless you lie near Cape Matifu, where with an easterly there is good shelter. The mole is for small craft only."
    tide: "There is next to no tide; the sea rises and falls with the wind and the glass."

