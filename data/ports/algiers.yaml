# FreeSail: Algiers as a port (spec M6 §26; package 79c, the Balearics' region with the
# Barbary coast to Cape Matifu), on package 35's machinery; the marks are the features
# file's (data/charts/features/balearics.yaml).
#
# Sources. Tofiño 1787, Derrotero del Mediterráneo, 'Muelle y Linterna de Argel', 'Castillo
# del Emperador', 'Cabo Matifús', pp. 152 to 153: two miles and a half SE of the Point
# Pescado the mole and lantern of Algiers, the mole fortified with batteries in two tiers and
# the lantern with three; the city rising from the mole up the side of a hill, white, like a
# topsail seen from the offing; the Emperor's castle above it; the mole a basin of little
# water, not enough for great frigates, for small xebecs and lesser craft, some forty of
# them, not commodiously; a little north of the lantern a shoal awash; Cape Matifu, low with
# a table hill, the bay's east point; in all the bay a ship may anchor in what water she
# will, minding her cables, for though the ground is mostly sand there are patches of
# gravel, loose stones and lost anchors; the winds from east round by north to north-west
# send in much sea, so that it is best to leave the anchorage when they come on with an ill
# look, unless anchored near Cape Matifu, where with an easterly there is good shelter.
# Michelot 1709 and 1715 (the lantern lit every night); Purdy 1826, pp. 324 to 327 (the
# easterlies of May to September, the westerlies and the 'La-betch' after); Bérard 1837,
# pp. 93 to 95 (the French works after 1830, not 1805's).
#
# The datum: UNVERIFIED. No period sheet is patched at Algiers in this package (Roux's plate
# 50 and Heather's bay of Algiers, read and not transcribed, CC BY-NC-SA); the chart's
# depths are EMODnet's at the lowest astronomical tide, the French port of the nineteenth
# century and the modern one in the grid where 1805 had the Dey's small mole.
#
# The stance. Algiers is the Dey's, the regency of Algiers' (the nations table, `algiers`):
# at peace with Britain by treaty, its differences settled by the fleet's visits (James vol.
# 3, pp. 235, 333 to 334), neutral to a King's ship as to every flag the table has. The
# regency's corsairs, the Dey's cruisers and the reis's, are noted here and not modelled
# (the brief). Prices FROM MEMORY or JUDGEMENT, sterling at the exchange.

