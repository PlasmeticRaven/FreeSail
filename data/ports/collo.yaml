# FreeSail: Collo as a port (package 104, the Sardinian sea's region, the harbour patch collo), on
# package 35's machinery; the marks are the features file's (data/charts/features/sardinian-sea.yaml).
#
# Sources. Berard 1837, pp. 118 to 121 (the survey of the 1830s): the bay sheltered from the NW round
# to the W, small craft before the town from almost every wind, a bottom of very good holding,
# anchor in 14 and 15 brasses of mud with the mosque NNW; the north-easters send in a heavy swell;
# the people Moors living by the coasting trade, the Kabyles of the mountains resisting every Bey;
# provisions to be had only by night; p. 119: the Compagnie d'Afrique had a post here from 1604 to
# 1685, for the inland trade and the coral; p. 120: timber the Dey sent for to the yards of Algiers.
# Purdy 1826, p. 327, and Norie 1831, p. 355: the French formerly had an establishment for the coral
# fishery. The brief's "a post of the Compagnie d'Afrique, hides and wax" holds for 1604 to 1685
# only, and its hides and wax are Stora's (the sources win). Derrotero 1849, p. 257; Lamberti 1844,
# p. 228.
#
# The datum: UNVERIFIED; the modern port in the grid.
#
# The stance. The regency of Algiers' (the nations table, `algiers`), neutral to a King's ship as to every flag the table has. Its corsairs noted and not modelled. Prices FROM MEMORY or JUDGEMENT, sterling at the exchange, each good's note naming its source where a text names the trade. Decision 67: what is true of the port only for some years is said with its years; the French conquest of the 1830s, after the range, is said and not written as a row.

id: collo
