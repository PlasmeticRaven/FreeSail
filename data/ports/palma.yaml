    - {good: almonds, price: 40, origin: spain, note: "judgement"}
    - {good: wine, price: 26, origin: spain, note: "judgement"}
    - {good: brandy, price: 85, origin: spain, note: "judgement"}
    - {good: oranges, price: 6, origin: spain, note: "the oranges of Sóller; judgement"}
    - {good: carobs, price: 8, origin: spain, note: "judgement"}
    - {good: salt, price: 11, origin: spain, note: "judgement"}
    - {good: fresh beef, price: 26, origin: spain, note: "judgement"}
    - {good: biscuit, price: 31, origin: spain, note: "judgement"}
    - {good: vegetables, price: 3, origin: spain, note: "judgement"}

