# FreeSail: Favignana as a port (package 105, Sicily and Malta's block), on package 35's
# machinery; the marks are the features file's (data/charts/features/sicily.yaml, the
# harbour patch trapani). Step 3 of the package.
#
# Sources. Smyth 1824, pp. 244 to 247 and App. pp. xxvi to xxviii: between Favignana and Levanso an eligible rendezvous for a fleet, twenty-one fathoms of mud off the gravelly bottom; good berths in Cala Rossa in seven to twenty fathoms, any wind serving to come or go, where Emo's Venetian squadron lay about 1784 and before it the Russian fleet, with vegetables, fruit and water; the small port with its tonnara; St Catharine's Castle on the summit, impregnable but by famine, its telegraph to Maritimo (p. 246); two thousand three hundred people besides the garrison and three or four hundred convicts; the tunny and anchovy fisheries, stone, sheep, goats and poultry the Pallavicini marquesses' revenue; the bank of St Catharine in the track from Malta round the islands (App. p. xxviii). Purdy 1826, p. 146: the port open to the north, six to two fathoms. Maritimo (pp. 244 to 245): its castle on a steep rock, forty invalids, often a state prison.
#
# The holder: the King of the Two Sicilies' (`naples`) throughout, the court at Palermo from
# December 1798 to 1799 and again from January 1806 (James 1837, vol. 2, p. 214; vol. 4, p.
# 122), when the mainland was French and Sicily the Bourbons' (the lead's ruling of
# 2026-11-12: Sicily's ports under `naples` without rows). NOTE: the nations table's wars
# carry no dates and read Naples at peace with France every year (data/nations.yaml), so
# nothing here depends on Bourbon Sicily's wars after 1806.
#
# Decision 68: Smyth 1824, p. 246, has three or four hundred convicts on the island, and in the
# dry ditch of Fort San Giacomo by the port "a gang of the most infamous wretches the
# tribunals of Sicily can condemn" (Purdy 1826, p. 146); and Maritimo's castle often a
# state prison (p. 245). The marks' words say so plainly, in the world's words. No good or
# scenario is built on it.
#
# No source on file names a pilot here: the boat and its people JUDGEMENT.
# Prices FROM MEMORY or JUDGEMENT, in sterling.

