    kind: a boat
    name: a tonnara boat of Favignana
    under: oars and a lateen sail
    note: "judgement"
  names: [Giovanni Rallo, Salvatore Campo, Gaspare Torrente, Francesco Ferro]   # judgement
  skill: 0.75
  fee_pounds: 1                  # judgement; unverified
  cast: starboard
  course_out_deg: 20            # judgement
  words:
    channel: "Between the Formiche and Favignana there are shoals of two and two and a half fathoms; by night or in thick weather take the clear passage between Levanso and Maritimo. Pass half a mile off Cala Rossa to clear the Borrone shoals; the east and west ends of the island are low and hard to see on a dark night."
    marks: "St Catharine's Castle on the island's summit, an excellent sea-mark, with its telegraph to Maritimo; Fort San Giacomo by the little port, in whose dry rock ditch the island's convicts are confined, three or four hundred of them; Levanso's sugar-loaf to the north."
    anchorage: "In the road between Favignana and Levanso, twenty-one fathoms of mud, room for a fleet; or in Cala Rossa in seven to twenty fathoms, where any wind serves to come or go, and vegetables, fruit and water are to be had."
    tide: "A tide of a foot or two, setting north-east and south-west about the islands, as at Trapani."

