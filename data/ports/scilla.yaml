# FreeSail: Scilla as a port (package 105, Sicily and Malta's block), on package 35's
# machinery; the marks are the features file's (data/charts/features/sicily.yaml, the
# harbour patch faro). Step 2 of the package.
#
# Sources. Smyth 1824, pp. 107 to 108: Scylla a common rock of bold approach, a castle on its top and a sandy bay each side; in 1783 a wave carried off more than 2,000 people from the south beach; lightning often strikes the castle. Purdy 1826, p. 115: the town in nine rows of houses; its only danger wind and current opposed. Smyth 1854, p. 442: anchorage in the bay, with caution for the currents; p. 250: the castle nearly destroyed by lightning in the spring of 1815.
#
# NOTE: the nations table's wars
# carry no dates and read Naples at peace with France every year (data/nations.yaml), so
# nothing here depends on Bourbon Sicily's wars after 1806.
#
# The holder, dated (the lead's ruling of 2026-11-12: the mainland's ports by dated rows to
# `france` for the French occupation; Joseph's and Murat's kingdom has no nation of its own
# in the table yet, and France's is its nearest stance, hostile to a King's ship). James
# 1837, vol. 4, p. 122: Joseph entered Naples on 15 February 1806, and "before the end of
# March" the French had garrisons in Scylla and the whole kingdom but Gaeta and Civitella.
# The end of the French kingdom in May 1815 is FROM MEMORY (the convention of Casalanza,
# 20 May 1815, not read).
# The castle, dated: the French garrison of March 1806; after Maida "the garrison of Scylla"
# was British by the end of July 1806 (James 1837, vol. 4, p. 125: by the end of July the
# whole British army withdrawn from Calabria except the garrison of Scylla; the day it was
# taken not given, the row from 1 August JUDGEMENT), which with Messina gave the entire
# command of the strait (p. 126); evacuated on 17 February 1808, not more than 200 of the
# garrison British (James 1837, vol. 4, p. 294).
# Prices FROM MEMORY or JUDGEMENT, in sterling.

id: scilla
name: Scilla
nation:
  - {nation: naples, until: 1806-03-30, source: "the King of the Two Sicilies' (James 1837, vol. 4, p. 122)"}
  - {nation: france, since: 1806-03-31, until: 1806-07-31, source: "a French garrison in Scylla before the end of March 1806 (James 1837, vol. 4, p. 122)"}
  - {nation: britain, since: 1806-08-01, until: 1808-02-17, source: "the British garrison of Scylla after Maida (James 1837, vol. 4, pp. 125 to 126; the first day JUDGEMENT) to the evacuation of 17 February 1808 (James 1837, vol. 4, p. 294)"}
  - {nation: france, since: 1808-02-18, until: 1815-05-20, source: "the French after the evacuation (James 1837, vol. 4, p. 294); the end FROM MEMORY"}
  - {nation: naples, since: 1815-05-21, source: "the King's again (FROM MEMORY)"}
source: "Smyth 1824 pp. 107-108; Purdy 1826 p. 115; Smyth 1854 pp. 250, 442; James 1837 vol. 4 pp. 122-126, 294"
datum: unverified   # no period sheet read with its datum; the modern shore is the grid's

