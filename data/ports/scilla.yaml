  cruising_nm: 2
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: a sword-fish boat of Scilla
    under: oars
    note: "judgement"
  names: [Rocco Bellantoni, Antonio Ruggiero, Giuseppe Bova, Nicola Fondacaro]   # judgement
  skill: 0.75
  fee_pounds: 1.5                  # judgement; unverified
  cast: starboard
  course_out_deg: 315            # judgement
  words:
    channel: "The rock is bold and may be closed; the only danger is the wind against the stream. Keep off the Torre di Cavallo to the south-west, where the current sets onto the rocks."
    marks: "The rock of Scylla with its castle on the top; the town in its rows of houses up the hill; the Faro's light across the strait."
    anchorage: "In the bay west of the rock for a short stay, minding the stream."
    tide: "The Faro's stream runs past the rock, north and south by turns, and the eddies of the shore against it."

tide:
  establishment: the Faro
  enter_on: flood
  leave_on: ebb

