  feature: scilla-anchorage
  name: the bay of Scilla
  lat_deg: 38.2535
  lon_deg: 15.7100
mooring:
  feature: scilla-anchorage
  name: the bay of Scilla
  lat_deg: 38.2535
  lon_deg: 15.7100
  depth_fathoms: 12
