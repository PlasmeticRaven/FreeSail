# FreeSail: Palamos as a port (package 101, beside the Catalan coast's block), on package
# 35's machinery; the marks are the features file's (data/charts/features/gulf-of-lion.yaml,
# at its end: Palamos lies in the Gulf of Lion's region, east of 3 E, and has no harbour
# patch, the tool adding none to a built region without rebuilding its level-2 tiles).
#
# Sources. Tofino 1787, Derrotero del Mediterraneo, pp. 130 to 133: the Windmill Point in
# latitude 41 51 10; the town's piece of mole running 170 varas to the W, forming with the
# north beach a little port 300 varas long, 22 or 23 feet close to the mole's end, for few
# vessels and none above frigates, with moderate weather; great ships E and W with the mole
# in 8 brazas, better in 10 brazas NE and SW with its head, the windmill bearing ESE; the
# rock W 41 S of the windmill half a mile with 11 feet; the only shelter from the ESE and S
# winds on the coast of Catalonia as far as the gulf of Rosas; the W and SW send their sea
# into the mole, and the NW, off the land, has broken vessels from their moorings against
# it; the Hormigas a mile E of the Punta de Castell, a passage inside them in need. Purdy
# 1826, p. 30 ('cannot be recommended to a stranger'); Michelot 1709, OCR l. 3806 to 3875;
# Smyth 1854, p. 333 (a Spanish line-of-battle ship lost on the rock in 1796).
#
# The datum: UNVERIFIED (Bellin's 'Plan de Palamos' and Heather's 'Port Palamos' are read
# and not transcribed, CC BY-NC-SA); the chart's depths are EMODnet's, the modern harbour's
# works the grid's. No gauge on this coast.
#
# The stance: Spain's (the nations table), hostile to a King's ship from 12 December 1804
# (James 1837, vol. 3, p. 200), undated here (the brief names no French holding of it; none
# read). The nations table's wars are one year's picture (see barcelona.yaml's head).
# Prices JUDGEMENT, in sterling.

id: palamos
name: Palamos
nation: spain
source: "Tofino 1787 pp. 130-133; Purdy 1826 p. 30; Michelot 1709 OCR l. 3806-3875; Smyth 1854 p. 333"
datum: unverified   # no period sheet read with its datum

outer_road:
  feature: palamos-road
  name: the road of Palamos
  lat_deg: 41.8420
  lon_deg: 3.1230
  depth_fathoms: 10
anchorage:
  feature: palamos-road
  name: the road of Palamos
  lat_deg: 41.8420
  lon_deg: 3.1230
mooring:
  feature: palamos-port
  name: within Palamos mole
  lat_deg: 41.8458
  lon_deg: 3.1260
  depth_fathoms: 3
  bottom: grass and mud
  deep_draught_ft: 20    # Tofino: 22 or 23 feet close to the mole's end
shore:
  feature: palamos
  name: the mole of Palamos
  lat_deg: 41.8470
  lon_deg: 3.1290

pilot:
  station: palamos-road
  cruising_nm: 2                 # judgement
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: a fishing boat of Palamos
    under: a lateen sail and oars
    note: "judgement"
  names: [Pi, Ribas, Callis, Bosch, Rigau, Llach]   # judgement
  skill: 0.8
  fee_pounds: 1                  # judgement; unverified
  cast: starboard
  course_out_deg: 200            # out to the south-south-west (judgement)
  words:
    channel: "Coming from the east give the Windmill Point a cable's berth, or stand west till the mole's end is on with the westernmost houses of the town. Mind the rock half a mile south-west of the windmill, eleven feet on it and deep water all round."
    marks: "The windmill, half ruined, on its point south of the town; Cape Gros beside it; the Hormigas, low rocks the sea washes, to the east; Cape San Sebastian and its chapel beyond."
    anchorage: "Within the mole in three or four fathoms close to its head, for a frigate at most and in moderate weather; a great ship in the road in ten brazas with the mole's head north-east and the windmill east-south-east. Moor strongly to the north-west: that wind off the land has driven ships onto the mole."
    tide: "No tide to speak of; the current sets to the south-west along the coast."

tide:
  establishment: Barcelona
  enter_on: flood
  leave_on: ebb

market:
  currency: pounds
  goods:
    - {good: salt fish, price: 18, origin: spain, note: "the anchovy and sardine boats of this coast, their fires at night (Purdy 1826, p. 29); the price JUDGEMENT, cheap against Barcelona's"}
    - {good: cork, price: 22, origin: spain, note: "JUDGEMENT; the coast's cork FROM MEMORY, no text on file naming it here"}
    - {good: wine, price: 20, origin: spain, note: "JUDGEMENT"}
    - {good: olive oil, price: 42, origin: spain, note: "JUDGEMENT"}
    - {good: wheat, price: 30, origin: spain, note: "JUDGEMENT"}
    - {good: salt, price: 11, origin: spain, note: "JUDGEMENT"}
    - {good: biscuit, price: 32, origin: spain, note: "JUDGEMENT"}
    - {good: brandy, price: 70, origin: spain, note: "JUDGEMENT"}
    - {good: fresh beef, price: 24, origin: spain, note: "JUDGEMENT"}
    - {good: timber, price: 12, origin: spain, note: "JUDGEMENT"}

dockyard:
  kind: chandlers
  items:
    - {item: topmast, hours: 24, pounds: 55, note: "judgement"}
    - {item: cordage, hours: 4, pounds_per_fathom: 0.07, note: "judgement"}
    - {item: water, hours_per_ton: 0.25, pounds_per_ton: 0.1, note: "judgement"}
    - {item: provisions, hours_per_day: 0.06, pounds_per_man_day: 0.05, note: "judgement"}

crew_pool:
  # judgement: the fishermen of the coast
  able: {hands: 1, pounds: 2, delay_h: 24}
  ordinary: {hands: 3, pounds: 1.5, delay_h: 24}
  landsman: {hands: 5, pounds: 1, delay_h: 12}

closed_to: []
