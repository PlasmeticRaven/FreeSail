# FreeSail: the Maddalena and Agincourt Sound as a port (package 79d, the Gulf of Lion's
# block; the same form as dunkirk.yaml, on package 35's machinery). The sound, the road and
# the marks are features/gulf-of-lion.yaml's (the harbour patch agincourt-sound).
#
# Sources. James 1837, vol. 3, pp. 177 to 178: on 31 October 1803 Nelson's squadron
# anchored without an accident in Agincourt Sound under the Sardinian shore, after seven
# days' struggle with gales and currents and a rocky and most intricate passage, 'a noble
# harbour formed by an indented bay ... defended to the northward by the small islands of
# St. Estevan, Spargiotou, Magdalena, and Cibrera', which Captain Ryves of the Agincourt
# had surveyed in 1802. Purdy 1826, pp. 88 to 90: Ryves's and Mr Atkinson's directions;
# hauling round Point Liche in 15 or 16 fathoms, land-locked; the anchoring-ground extremely
# good; the north-wester blows with great violence; the water rises and falls about three
# feet; the watering at the two rocks. Smyth 1828, pp. 247 to 248: the town's anchorage and
# the Cala Gavetta; the berth to be preferred at the Mezzo Schifo near the Pararau, good
# for watering, wood cut close by. Derrotero 1849, pp. 150 to 155.
#
# The stance. The King of Sardinia's, at peace with Britain and France: neutral to a King's
# ship and to an American, open to his own; the British fleet's watering and refreshment in
# 1803 to 1805. No period sheet read: `datum: unverified`. Prices JUDGEMENT, in sterling.

id: maddalena
name: the Maddalena
nation: sardinia
source: "James 1837 vol. 3 pp. 177-178; Purdy 1826 pp. 88-90; Smyth 1828 pp. 247-248; Derrotero 1849 pp. 150-155"
datum: unverified   # no period sheet read; no published level read

