pilot:
  station: maddalena-road
  cruising_nm: 5                 # judgement
  comes_off_by_night: false
  cutter: data/ships/cutter.yaml
  vessel:
    kind: a boat
    name: the Maddalena boat
    under: a lateen sail and oars
    note: "judgement: the felucca and the gozzo of the coast"
  names: [Ornano, Millelire, Zonza, Culiolo, Bargone, Susini, Ferracciolo, Volpe]   # the Maddalena's Corsican and Sardinian names: judgement
  skill: 0.85
  fee_pounds: 2                  # judgement, in sterling; unverified
  cast: starboard                 # judgement
  course_out_deg: 270            # out by the western passage between the islands and the Sardinian shore
  words:
    channel: "From the west, come in between the Barelino isles and Spargi and the Sardinian shore, leaving Spargiotto and the Paganetto rocks on the hand they lie, and haul round Point Liche in fifteen or sixteen fathoms into the sound. From the east, beware the Monks and the reef the Excellent struck in 1804, and come in by Biche island's channel only with a fair wind."
    marks: "The Magdalena's high rocky island and its village on the Cala Gavetta; St Estevan and its fort; Caprera to the east; the Bear rock on Capo d'Orso over the Sardinian shore; Monte Limbara far inland."
    anchorage: "In Agincourt Sound the ship lies land-locked in twelve fathoms, the anchoring-ground extremely good; the berth to be preferred is at the Mezzo Schifo, south-west of the town, handy for watering at the Pararau and wood cut close by. The north-wester comes down off the hills with great violence: veer cable."
    tide: "The water rises and falls about three feet, more with the wind than with the moon; the current round Point Liche runs nearly two miles and a half an hour."

