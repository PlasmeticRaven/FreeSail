# FreeSail: St. Sebastian of Gomera and its bay (package 106a), on package 35's machinery;
# the marks are the features file's.
#
# Sources. Purdy 1825, p. 219 (Glas): the principal town close by the shore at the bottom of a
# bay on the east side, the shipping land-locked from all winds but the S.E.; anchor at a
# convenient distance in 15 to 7 fathoms and moor with a large scope, the land wind often
# blowing hard enough to blow a ship out of the bay; the sea so smooth that boats land on the
# beach; on the north side a cove where a ship may haul close to the cliff and heave down or
# repair; plenty of good water from wells, and a rivulet in winter; an old round tower on the
# south side of the rivulet's mouth, a chapel and a battery of a few guns on the cliff north of
# the cove; stand close in with the north point, for the land wind is scanty, and better come
# in on the sea breeze about noon; the best berth with the main street open, a cable off the
# beach; the north point like Rame Head from a league north (Glas). Norie 1805, Table XL: St.
# Sebastian 28 5 40 N.
#
# The datum: UNVERIFIED (no plan read; EMODnet on the level-3 patch). FOR SOME YEARS ONLY:
# nothing read. Prices FROM MEMORY or JUDGEMENT, in sterling.
# Slavery (decision 68): the Count of Gomera, lord of this island and of Hierro, kept about a
# thousand enslaved Africans on his sugar lands at Adeje on Tenerife, over against Gomera, in
# the 1760s (Glas 1764, OCR l. 10373 to 10381, and p. 353, OCR l. 14740). Whether any
# laboured on Gomera itself the source does not say. Said here with its years and its
# source; no person is a cargo of this port's market or of the business, and no scenario is
# built on it.
# The holder, dated (79a's form, `nation:`, one row: Spain's through the whole range; decision
# 67): Spanish from the conquest to the end of the range and after. Hostile to a King's ship by
# the nations table's war of December 1804; NOTE (as data/ports/barcelona.yaml's): the table's
# wars carry no dates (`Nations.at_war` reads none), so from 1808, when Spain became Britain's
# ally, the islands still read as at war with Britain: the owner's finding (decision 66), not
# mended here, and no truth depends on a war's day. What is true of the port only for some
# years is written in its own words, with its years, in the head above: none of it is a
# key that package 105's dated rows (`state`, `closed_to`, `market` and the rest) can carry, so
# no row waits (the chart session, 2026-11-13).

nation:
  - {nation: spain, source: "the King of Spain's through the range: Spanish since the conquest (Purdy 1825, p. 210: by the treaty between Ferdinand of Castile and Alphonso of Portugal the islands to belong to Spain); at war with Britain from 12 December 1804 (James 1837, vol. 3, p. 200, as data/ports/barcelona.yaml cites it)"}
