  words:
    channel: "Stand close in with the north point of the bay, for the land wind is commonly too scanty to fetch the berth; better come in with the sea breeze, which begins about noon."
    marks: "The north point, which from a league north of it looks like Rame Head; the town at the bottom of the bay, the old round tower by the rivulet's mouth, the chapel and battery on the cliff over the cove."
    anchorage: "Anchor a cable's length off the beach where you can see straight along the main street, in seven to fifteen fathoms, and moor at once with a long scope: the land wind blows hard out of the valley and the eddies come round in the bay."
    tide: "The tide rises six feet or so at springs, high water about three on the full and change; the bay is so smooth the boats land on the beach."

