    - {good: biscuit, price: 22, origin: naples, note: "judgement"}
    - {good: salt beef, price: 75, origin: null, note: "dear in the Mediterranean; judgement"}
    - {good: canvas, price: 46, origin: naples, note: "judgement"}
    - {good: hemp, price: 52, origin: null, note: "brought in; judgement"}
    - {good: timber, price: 10, origin: naples, note: "brought in; judgement"}
