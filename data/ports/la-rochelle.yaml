    - {good: wine, price: 30, origin: france, season: {12: 1.1}, note: "the wines of Aunis; from memory"}
    - {good: salt, price: 9, origin: france, note: "the salt of Ré and Oleron at the source; from memory"}
    - {good: canvas, price: 42, origin: france, note: "from memory"}
    - {good: hemp, price: 55, origin: null, note: "from memory"}
    - {good: timber, price: 6, origin: france, note: "from memory"}
    - {good: coal, price: 6, origin: britain, note: "from memory"}
    - {good: sugar, price: 78, origin: null, note: "the old West India trade of La Rochelle, scarce in the war (judgement)"}
    - {good: salt beef, price: 70, origin: france, note: "from memory"}
    - {good: tin, price: 180, origin: britain, note: "from memory, as Brest's"}

