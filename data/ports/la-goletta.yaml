# FreeSail: the Goletta and the road of Tunis as a port (package 104, the coast of Tunis's region, the
# harbour patch la-goletta), on package 35's machinery; the marks are the features file's
# (data/charts/features/tunis-coast.yaml).
#
# Sources. Purdy 1826, pp. 328 to 331 (from Macgill's Account of Tunis, 1811) and p. 334 (W. Smith's
# directions, about 1817): the Goletta defended by two forts of considerable strength built by the
# Spaniards under Charles V; a small port formed through a canal of stone with 15 feet at all times,
# a due of three Spanish dollars a day to enter, so that few do; vessels loading lie off in 5 to 7
# fathoms, good ground, served by lighters; the best anchorage in 5 to 6 fathoms, soft muddy bottom,
# Cape Carthage NNE 1/2 E or NE by N and the Goletta castle between NW by W and W; exposed to the NE
# winds but they do not blow home, the most sea from NE to ESE; moor east and west; a fleet might
# remain in the most tempestuous weather; fresh water from a reservoir within the entrance; the
# city six miles west behind the lake, above 100,000 people; its exports grain of different kinds,
# oil, wool, hides, wax and soap, the wheat excellent but its export at times prohibited; its
# imports French woollens, British muslins, linens, coffee, sugar, alum, tin, lead, iron and wine;
# the English by treaty at three per cent ad valorem. Smyth 1854, pp. 92 to 93: patches of hard
# clay that breaks short, not a winter station for heavy ships. Derrotero 1849, pp. 268 to 269: the
# worst winds of the second quadrant; the Goletta's water worse than Porto Farina's. **The consuls**
# (the brief) are in no text read: not written.
#
# The datum: UNVERIFIED; the modern canal and port of La Goulette in the grid.
#
# The stance. The regency of Tunis's, the Bey's (the nations table, `tunis`), neutral to a King's ship as to every flag the table has; the Bey's ships and corsairs noted and not modelled. Prices FROM MEMORY or JUDGEMENT, sterling at the exchange, each good's note naming its source where a text names the trade.

