  words:
    channel: "From Cape Bon steer for Zembra, which may be passed a mile off on any side, then for Cape Carthage; there is no sounding with the hand-lead until abreast of it, and rocks above and under water lie off the low coast from the cape to the Goletta."
    marks: "Cape Carthage high above the ruins; the Goletta's square fort and its batteries on the canal; the city white beyond the lake."
    anchorage: "Anchor in five fathoms of soft mud with Cape Carthage north-north-east and the Goletta castle west, out of reach of the forts' guns; moor east and west. The north-easters do not blow home, but there are patches of hard clay that break short: look to your anchors in winter."
    tide: "The water rises and falls near three feet with the winds, not the moon."

