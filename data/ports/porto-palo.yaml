# FreeSail: Porto Paolo, Cape Passaro's anchorage as a port (package 105, Sicily and Malta's block), on package 35's
# machinery; the marks are the features file's (data/charts/features/sicily.yaml, the
# harbour patch passaro). Step 3 of the package.
#
# Sources. Smyth 1824, pp. 180 to 186 and App. pp. xvii to xix: Porto Paolo a convenient place for coasters in all winds but the south, good sandy bottom mixed with mud, five to three fathoms inside and seven to ten at its entrance, a dozen vessels seen riding out a brisk northerly gale (App. p. xix); between Passaro and Avola good shelter for ships bearing up from a westerly gale in the channel of Malta, nine to thirty fathoms (App. p. xvii); the redoubt on Passaro island for twelve guns with seventy-five men, which wants a light-house (p. 181); the reef off the low cape, where an English line of battle ship grounded a few years before; the coast south of Marzamemi nearly deserted for dread of the Barbary cruisers (p. 180); the tonnare of Marzamemi and Passaro, salt from the lake, water from two wells below Pachino. Lamberti 1844, p. 195: ships forced to bear up in the Malta channel lie well under Cape Passaro.
#
# The holder: the King of the Two Sicilies' (`naples`) throughout, the court at Palermo from
# December 1798 to 1799 and again from January 1806 (James 1837, vol. 2, p. 214; vol. 4, p.
# 122), when the mainland was French and Sicily the Bourbons' (the lead's ruling of
# 2026-11-12: Sicily's ports under `naples` without rows). NOTE: the nations table's wars
# carry no dates and read Naples at peace with France every year (data/nations.yaml), so
# nothing here depends on Bourbon Sicily's wars after 1806.
#
# No source on file names a pilot here: the boat and its people JUDGEMENT.
# Prices FROM MEMORY or JUDGEMENT, in sterling.

