  vessel:
    kind: a boat
    name: a tonnara boat of Passaro
    under: oars and a lateen sail
    note: "judgement"
  names: [Corrado Tiralongo, Sebastiano Spataro, Paolo Caruso, Giuseppe Rizza]   # judgement
  skill: 0.75
  fee_pounds: 1.5                  # judgement; unverified
  cast: starboard
  course_out_deg: 90            # judgement
  words:
    channel: "Do not take Cape Passaro and Passaro island for one: hauling west after passing the redoubt by night, a ship may be on the reef off the low cape before she sees the land, as an English line of battle ship was a few years ago. Off Point Formiche five black rocks and a reef run nearly a mile out; clear the tunny nets moored from the tower to the tonnara in the season."
    marks: "The tower-redoubt on Passaro island, like a vessel under sail from the north; the church and windmill of Pachino over all this coast; Marzamemi's tower and tonnara to the north."
    anchorage: "In Porto Paolo, sandy mud in three to five fathoms inside and seven to ten at the entrance, sheltered in all winds but the south. In a westerly gale in the channel of Malta, bear up and anchor north of Passaro by the lead in nine to thirty fathoms."
    tide: "No tide; in settled weather the current runs east between Sicily and Barbary at half a mile to a mile an hour."

