  # package 101: the Catalan coast, the region `catalan-coast`'s bounds (no box held it:
  # `mediterranean-west` ends at 40.5 N and `gulf-of-lion` begins at 3.0 E, so `box_at` gave
  # the nearest, one or the other by the mile). Its check rows are Barcelona's printed table
  # (the Admiralty's Mediterranean Pilot, vol. I, 1913, appendix III, p. 726, the page image
  # under docs/references/pilots/pages/, package 101's cut; eleven years' winds, the
  # "Observaciones Meteorologicas de Provincias"), every month's columns checked against the
  # printed totals: the days of wind from each of the eight points, each half-point's days
  # split between its two quarters, scaled to nine tenths for the days the model leaves with
  # no prevailing quarter (79c's rule). Barcelona's table differs from the Gulf's box
  # (Marseille's) by 16 to 37 points of a quarter in every month (the westerlies of the
  # winter, the summer's southerlies and easterlies, the coast's sea breeze, where Marseille
  # has the mistral), beyond the fit's noise (five points): so a box of the block's own and
  # not the Gulf's widened, the comparison in docs/dev/TuningNotes.md. The generator's
  # figures JUDGEMENT, fitted by simulated months (the check tool's run with this box the
  # default, a scratch search outside the repository, from the Mediterranean west's rows),
  # every month within five points of the table's westerly and easterly shares; the gale
  # days the table's halved for the strong-gale days and trebled for the strong-breeze days
  # (79c's rule), which the fit does not reach in winter (a finding). One year's picture:
  # the observations of about 1880 to 1912, not the period's.
  catalan-coast:
    title: "the coast of Catalonia, the Alfaques to Tossa, with the summer's southerly and the winter's westerly"
    bounds: {south: 40.56, north: 41.9, west: 0.3, east: 3.0}
    provisional: true
    source: "Barcelona's table (the Admiralty's Mediterranean Pilot vol. I, 1913, Appendix III, p. 726) for the quarters, the gales and the glass; the generator's figures judgement fitted to them by simulated months; package 101"
    months:
      1:
        name: January
        note: "judgement: the generator's figures fitted by simulated months (a scratch search, then 400 months at seed 11, within five points of the check row's westerly and easterly shares) to the check row, which is Barcelona's table (the Mediterranean Pilot vol. I, 1913, Appendix III, p. 726, about 1880 to 1912): N 2, NE 4, E 3, SE 1, S 2, SW 5, W 10, NW 4, the calm column blank, a half-point's days split between its quarters and the shares scaled to nine tenths; the gales 0.8 days a month (the strong-gale days half, the strong-breeze days three times, JUDGEMENT), the fogs 4.0; the glass Barcelona's mean of 30.07 inches"
        background_hpa: 1018
        gradient: {"hpa_per_100km": 0.129, "high_toward_deg": 220}
        lows_per_month: 6
        track_bearing_deg: {"mean": 99, "spread": 30}
