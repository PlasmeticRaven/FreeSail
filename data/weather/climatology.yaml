  # regions `gulf-of-lion` and `ligurian-sea` together (40.56 to 44.5 N, 3 to 11 E), the
  # Gulf's one box as the brief has it. Before it the Mediterranean took the nearest Atlantic
  # box (`box_at`). Each row's check is a printed table's: Marseille's days of wind by the
  # eight points and calm (the Admiralty's Mediterranean Pilot, vol. II, 1916, appendix
  # III, p. 462, page image docs/references/pilots/pages/), its glass the background.
