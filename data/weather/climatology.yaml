  # package 79c: the Mediterranean west, over both of the block's regions (`mediterranean-west`
  # and `balearics`). No box covered the Mediterranean, and `box_at` gave its water the nearest
  # Atlantic box's (Portugal's), which is wrong (the Levanter and the Poniente, the Alboran's
  # easterlies, the Balearics' winter northerlies). The check rows are a printed table's (the
  # Admiralty's, read from the page images under docs/references/pilots/pages/), the
  # generator's figures judgement fitted to them; PROVISIONAL as every box beyond the Channel.
