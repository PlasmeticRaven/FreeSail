# FreeSail: the monthly climatology the weather systems are seeded from (spec M5 §2; the
# study docs/design/WeatherSystems.md §1 and §5). Package 30's first pass; the boxes
# beyond the Channel package 38's (spec M6 §26).
#
# THE BOXES (package 38). A scenario's weather is seeded from the box she starts in
# (`boxes`, each with its `bounds`), and as she sails the next system drawn comes from the
# box she is in at the drawing; the systems in play are kept across an edge, since a low
# is a centre in the plane and not the box's, so the field blends by itself over a
# transit's length, and the background pressure and the mean gradient move from the box
# she left to the box she is in over `weather.BOX_BLEND_H` hours (a stated simple rule in
# place of W §5's, which gives none). A position in no box takes the nearest; a scenario
# with no position takes `default_box`. The Channel's box is package 30's table under its
# own name, every figure as it was, and nothing a scenario in the Channel draws comes from
# any other box: the recorded passages replay to their digests (tests/test_known_truths.py).
# The three boxes beyond it (Biscay; the Portuguese coast with its summer northerlies, the
# Portuguese trades; the sea off Madeira with the north-east trade) are PROVISIONAL
# throughout and JUDGEMENT in every row (each row's `note` says what it rests on), from
# the same kinds of source as the Channel's: the pilot charts' monthly roses by
# five-degree square (S3, NOT READ from here) and the Admiralty's ocean passages, as
# remembered, to be replaced by the printed tables when the owner has them and by the
# CLIWOC extraction (W §1.5) if the first pass proves wrong. Their `check` rows are what
# a thousand months should give and have not been run against them
# (tools/climatology_check.py runs the default box).
#
# THE CHANNEL'S ROWS, as package 30 wrote them. Every row is PROVISIONAL (spec M5 §33
# item 1): the direction shares are the study's own
# averaging of the Channel indices of Mellado-Cano et al. (S1, verified, CC-BY-4.0; the
# 1750 to 1854 row for west and east, the 1795 to 1815 row for south and north, which
# the longer row does not give) and the Ushant gust-day counts are Meteo-France's normals
# (S4, verified); everything else is a judgement set so that the check passes, to be
# replaced by the Channel Pilot's climatic tables when the owner has a printed copy (S2)
# and by the CLIWOC extraction (W §1.5) if the first pass proves wrong. The number of lows
# a month is the study's guess ("perhaps six to eight a month in winter and three to four
# in summer", unverified). A low's speeds are the shipping forecast's classes (S9, 15 to 35
# knots); central pressures "from 1000 hPa down to 950" (W §1.3). The track is the storm
# track over the box, nearer the box in winter and north of it in summer (W §1). The high's
# bearing is the season's: the Scandinavian high to the north and north-east in winter and
# spring (the Channel easterly), the Azores ridge to the south-west in summer.
#
# Fields per month: background_hpa (the glass's mean; W §2b "about 1015, seasonal", a
# judgement by month), gradient (the mean gradient the box sits on between the Azores high
# and the Icelandic low, hPa per 100 km and the bearing toward high pressure: about 1 hPa
# per 100 km in winter toward the south, which is the climatological westerly of W §1.1
# itself, and half that in summer with the ridge to the south-west; a judgement from the
# mean sea-level pressure charts, unverified against a table), lows_per_month, track_bearing_deg (the direction a low moves, mean
# and spread), closest_approach_km (the track's distance from the box's centre, positive to
# the north, mean and spread), speed_kn, central_hpa (mean, spread, floor), radius_km,
# life_h, high (probability that one sits within reach; its bearing from the box; its
# distance; its anomaly; its radius; its life), check (the direction shares in per cent, and
# Ushant's days a month with a gust of 31 and of 54 knots or more; the boxes beyond the
# Channel name no station and say gust31_days and gust54_days).
provisional: true
source: docs/design/WeatherSystems.md sections 1.1, 1.2, 1.3, 5 (2026-09-29)
