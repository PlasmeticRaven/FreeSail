  # package 106a: the Canaries' sea and the ocean carried south (25.2 to 30 N, from 22.13 W
  # to the African coast), so that Madeira's box no longer answers south of 30 N by the
  # nearest-box rule; after Madeira's, which keeps 30 N where the two meet. The north-east
  # trade as the period gives it: "from the 28th degree of north latitude to the Line ...
  # the trade-winds, which blow from the N.N.E. to East during the whole year ... liable to
  # many exceptions near the coasts and islands"; "though the Canary Islands lie within the
  # tract of the trade-winds, yet westerly and south-westerly winds sometimes prevail there,
  # which may continue for eight days successively" (the Oriental Navigator 1801, 'Of the
  # winds', OCR l. 2088 to 2108); westerly and south-westerly winds "common in the months of
  # January and February", with a heavy swell (Purdy 1825, p. 210); the winds that "mostly
  # prevail from North and N.N.E." at El Rio (Purdy p. 213). PROVISIONAL and JUDGEMENT in
  # every figure (each row's `note`), the check rows what a thousand months should give,
  # not run. NOT CARRIED, said for the lead: the calms and the south-westerly eddies to
  # leeward of the high islands (Purdy p. 214: when the north-east blows hard on the north
  # side of Canaria's mountains "it is either quite calm on the other side, or a gentle
  # breeze blows upon it from the S.W."; p. 213: the Bocayna's calm under Lanzarote's hill;
  # p. 215: the calms under the Peak at Santa Cruz): the weather's form is synoptic systems
  # over a box and has no field shaped by an island's height.
