  # package 104: the Sardinian sea's box, its region's bounds, the Mediterranean west's rows
  # (the YAML alias: the same rows, the Admiralty's tables of Algiers, Oran, Palma, Port Mahon,
  # Cartagena and Gibraltar their check). No table of the Admiralty's Appendix III lies in the
  # block (none for Bougie, Philippeville, Bona or the open sea; Port Mahon's wind columns
  # blank); the coast from Algiers to Bona has the Barbary easterlies of summer and the
  # westerlies of winter alike (Berard 1837, pp. 66 to 69; the Admiralty 1913, pp. 46 to 47),
  # so the Mediterranean west's box answers the Sardinian sea, said here as its own box so
  # that the nearest box's diagonals between the Mediterranean west's, the Tyrrhenian's and
  # the coast of Tunis's no longer answer there. A later package with a table read for the
  # Algerian coast east of Algiers fits its own rows.
  sardinian-sea:
    title: "the Sardinian sea and Barbary from Bougie to Bona, with the Mediterranean west's rows"
    bounds: {south: 36.29334, north: 40.56, west: 4.5, east: 8.0}
    provisional: true
    source: "the Mediterranean west's box's rows (the Admiralty's Mediterranean Pilot vol. I, 1913, Appendix III, the tables of the Mediterranean west), JUDGEMENT that they answer the Sardinian sea and the Algerian coast to Bona (Berard 1837, pp. 66 to 69); package 104"
    months: *mediterranean-west-months
  # package 104: the coast of Tunis's box, its region's bounds, its check rows Bizerta's table
  # (the Admiralty's Mediterranean Pilot vol. I, 1913, Appendix III, p. 731, the PDF's page
  # 904, cut at 200 dpi under docs/references/pilots/pages/; nineteen years' observations,
  # the "Annales du Bureau Central Meteorologique de France"), each month's eight points read
  # from the page and summed against the printed totals (all nine columns agree); its gales
  # and fogs columns blank, the gust days the Mediterranean west's (JUDGEMENT). Bizerta's
  # differs from every neighbouring box by 8 to 39 points a month (the notes, package 104),
  # beyond the fit's noise. The generator's figures fitted by a scratch search outside the
  # repository from the Mediterranean west's rows (400 trials of 60 and 120 months a month,
  # then 400 months at seed 11): every month within four points of the westerly and easterly
  # shares, the north and south within five and a third. Tunis's own table (p. 732, cut
  # beside it) is the city's behind its lake and is not the box's check.
