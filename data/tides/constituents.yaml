  # THE GAUGES OF PORTUGAL AND CADIZ, READ AND HELD (package 39d). TICON's file read
  # 2026-10-10 by coordinates over the block (36.3 to 42.1 N, 10.1 to 5.9 W; the zip at
  # store.pangaea.de, SHA-256 7055f8ed...6514, the same file): five records, Cascais, Lagos,
  # Huelva (Mazagón), Bonanza (the Guadalquivir's mouth) and Cadiz. It has NO gauge at
  # Leixões, Oporto, Lisbon or Setúbal (the brief's "unverified until read": these it has
  # not). Each named by Puertos del Estado's REDMAR list (Huelva 3329, Bonanza 3333,
  # INT_3, read 2026-10-10) or by its coordinates (Cascais, Lagos, Cadiz).
  #
  # The mean levels above the chart's datum: Huelva 1.96 m and Bonanza 1.54, REDMAR's
  # reports GLOB_2_3_3329 and _3333 (the mean sea level less the lowest astronomical tide,
  # 203 less 7 and 173 less 19 cm above the gauge's zero), VERIFIED; Cascais and Lagos
  # 2.0, the Instituto Hidrográfico's Zero Hidrográfico 2.0 m below the Cascais vertical
  # datum offshore (EPSG 10393's record, read 2026-10-10), the datum's surface taken for
  # the mean level and the ZH for the chart's datum: JUDGEMENT; Cadiz unverified (no
  # published level read; Huelva's 1.96 would stand for it, the two tides agreeing to a
  # centimetre and a degree).
  #
  # HELD, NOT BLENDED, as the Channel east's and Biscay north's are. These lie beyond the
  # 400 miles' reach of every Channel position, so blending them would not move a recorded
  # passage's digest by the reach (the nearest, Cascais, is some 610 miles from Le
  # Conquet); but the far rule does not keep them to their own water either: blended, a
  # position of Biscay south would take them with the Biscay gauges, and the block that
  # blends a gauge decides for all. The lead's decision with the other blocks' (the
  # engine wants a gauge's own reach); until then the world's tide over the block is Le
  # Conquet's alone (the nearest of the eleven, `TideState.far`), M2 2.02 m at 110.7
  # degrees against these 0.92 to 1.04 m at 57 to 64: an hour and three-quarters late
  # and twice the range (docs/dev/TuningNotes.md, package 39d).
  - id: cascais
