# The interpolation's power: the inverse square of the distance, judgement (a weighted
# mean that follows the nearest gauge close to it and blends between the shores in
# mid-Channel; the north Cornish coast, whose tide is the Bristol Channel's, lies outside
# the game's play and gets the south coast's gauges, which is wrong there by half an hour
# and a third of the range, and is said so here).
#
# THE TABLE OVER A LARGER SEA (package 38; spec M6 §26). The blocks of the voyage to
# Madeira add gauges here as they are built (from TICON's file, which holds the Iberian
# and the Madeiran gauges by their coordinates: which of Vigo, Leixões, Cascais, Lagos,
# Cadiz, Tarifa and Funchal it has is UNVERIFIED here and read when a block is built;
# each with its record, its mean level above the chart's datum from a stated source and
# its three constituents), in the same form as the eleven
# below, whose figures do not move. The interpolation is honest about distance: only the
# gauges within `reach_nm` of a position are blended, and a position beyond the reach of
# every gauge takes the nearest alone, which the world marks (`TideState.far`) and the
# master's words say ("the nearest place in the master's table, two hundred miles off");
# no blend across a coast. The reach, 400 miles, is more than the farthest point of the
# Channel's region lies from Dover (about 370), so that every position of the Channel
# blends the eleven as package 34 pinned it; judgement otherwise.
interpolation:
  power: 2
  reach_nm: 400

# THE CHANNEL EAST'S GAUGES (package 39a), READ AND HELD. TICON.txt was read again
# (the zip at doi.pangaea.de, fetched 2026-10-09, SHA-256 7055f8ed…6514, 1,621,262 bytes),
# the block's water searched by coordinates (48.4 to 51 N, 3.8 to 0.7 W): the file has
# Weymouth, St Helier, Saint-Malo and Cherbourg, which are four of the eleven above and
# whose figures it gives again to the centimetre and the degree (verified), and two more,
# Bournemouth and Portsmouth, below. It has no gauge at St Peter Port, Dartmouth or
# Portland (the brief's "which it has is unverified until read": these it has not).
# The two are HELD, read by nothing: every position of the Channel blends every gauge
# within `reach_nm`, so a twelfth gauge, however far, moves the tide at every Channel
# position by a little, and the recorded passages' digests with it (the eleven "do not
# move", the brief). Blending them is the lead's decision with a re-measure of the
# passages, or a reach of a gauge's own (a rule the tide lacks; docs/dev/TuningNotes.md).
# Their mean levels above the chart's datum are UNVERIFIED (no source read for them).
