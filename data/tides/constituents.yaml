# The interpolation's power: the inverse square of the distance, judgement (a weighted
# mean that follows the nearest gauge close to it and blends between the shores in
# mid-Channel; the north Cornish coast, whose tide is the Bristol Channel's, lies outside
# the game's play and gets the south coast's gauges, which is wrong there by half an hour
# and a third of the range, and is said so here).
interpolation:
  power: 2
