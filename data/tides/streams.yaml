    source: "visitmyharbour, Carrick Roads, as T §1 quotes it: 1.5 to 2 knots in the lower reaches, 3 in the upper; the flood from low water to high is judgement (an estuary)"
    book:
      set: N by E
      spring_kn: 1.5
      neap_kn: 0.75
      strongest_h: -3.0
      judgement: [set, rates, hour]
      source: "JUDGEMENT throughout: the world's figures rounded (no period statement in hand for the Road's stream)"
