# FreeSail: the captain's tide, the establishment tables of his epitome (spec M5 §16; the
# study docs/design/Tides1805.md §2 and §5 point 2; package 34).
#
# "The time of high water at full and change", the hour of high water on the day of new
# or full moon, by port: what a captain of 1805 had in his epitome, and all he had. The
# master works the day's high water from it by Moore's rule (Moore 1799, the catechism:
# "I multiply the moon's age by 48, and divide the product by 60, the quotient will be the
# hours, and the remainder the minutes when she is on the meridian past noon ... being
# added to the time of high water on the change and full days, at any place, will ...
# give the time of high water there"), the moon's age from his almanac. It is wrong by up
# to an hour, as Bowditch 1802 admits ("will sometimes differ an hour from the truth,
# owing to the neglect of the disturbing force of the sun"), and by more when the table is
# an old one. The world's tide (data/tides/constituents.yaml) is computed, and never read
# by the master; the difference is the play.
#
# Two tables, a better and a poorer (T §5: "a poorer ship has a poorer table"), chosen by
# the scenario (`epitome:`) or, by default, by the ship: a ship of war carries Norie's,
# the rest Moore's.
#
# `norie`: the hours and minutes of Dessiou's Plymouth tide tables and Sailing Directions
# and of Daussy in the Connaissance des Temps for 1834, as Whewell 1833 quotes them
# ("Essay towards a first approximation to a map of cotidal lines", Phil. Trans.; the
# study read it at darwin-online 1833_Whewell_A839, T §2), standing for Norie's Table XLI
# of 1803, whose Channel rows the study found illegible in the OCR (UNVERIFIED as
# Norie's own figures: T §6; they are the period's figures as the study has them). The
# spring rise, where the table gives one, in feet: Fowey's "Tides rise 15 feet at
# springs. Neaps 7 or 8" from Mackenzie junior's plan of 1774 (RMG G223:2/42, read from
# the image, Charts.md) stands for Falmouth and Plymouth (judgement: the same coast);
# the French ports' from the RAM's modern mean springs (T §1), judgement for a period
# table.
#
# THE RISE FOR EVERY PLACE (package 37j). The master reduces a cast of the lead to his
# chart's datum by his own tide (`freesail/world/reckoning.py`, `_tide_allowance_m`): the
# rise at springs of the nearest place in his table, two-thirds of it at the quarters, and
# the hour from high water. Package 34 gave the rise only where a period figure was in
# hand and took a flat three metres elsewhere, so a merchant with Moore's table (which
# gives none) took three metres off every cast whatever the tide: in game 10, at St
# Mary's near high water of a seventeen-foot tide, the cast read nearly a fathom more than
# his chart at his own right position and was laid down a mile off. Every place now has a
# rise. Where the period's table gives none (`rise_judgement: true`) it is the world's
# spring range at the place (the constants' M2 and S2, twice their sum) rounded to the
# foot, as the directions' rates in streams.yaml are the world's rounded: JUDGEMENT, the
# statement a master's sailing directions would have made ("the tide rises fifteen feet
# at springs") and not a figure read from a period page.
#
# `moore`: Moore's New Practical Navigator (1799), the table by the moon's bearing at high
# water, a point of the compass to every 45 minutes ("S. by W." 12h 45m, "S.S.W." 1h 30m,
# ... "W." 6h 00m), in the manner of the seventeenth-century pilots; the study could pin
# Brest with the 3h 45m places, Ushant and Scilly at 4h 30m, Plymouth, Ramhead and Torbay
# at 6h, and not Falmouth ("the OCR does not let me pin Falmouth's group with confidence",
# T §2). The poorer table therefore has no Falmouth: the master takes the nearest place it
# names and says so.

