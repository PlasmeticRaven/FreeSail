      # establishment by the tide's rule (data/tides/constituents.yaml, TICON's M2), the
      # nearest held gauge's where the place has none (Cartagena by Almería's, Oran by
      # Melilla's, Algiers by Palma's): JUDGEMENT, said in each note; the world's own hour
      # over the block was a far gauge's (Le Conquet's or Saint-Malo's) while they were
