# Moore's rule of 48 minutes a day: the moon's southing comes later each day by this
# (Moore 1799, the catechism; Bowditch 1802 uses 49). The true mean is 50 minutes and
# 28 seconds (24 h 50 m 28 s of lunar day), which is part of the hour the rule is out by.
minutes_per_day_of_age: 48
