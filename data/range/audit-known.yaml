# The range's audit: the findings known and owned (package 103a, `tools/audit_range.py`).
#
# Every finding of the audit's first full sweep (the trunk at 504a250, 1792 to 1825), each by
# its key with what it is, the years it bites (of the days the sweep samples), its basis,
# whose it is, its reason in a line, and the full sweep's count as its ceiling (`most`).
# `sweep: full` marks a finding only the full sweep makes (more whole worlds, more days).
# `tests/test_range_audit.py` passes on these and fails on any finding not listed, on a
# listed one the sweep no longer makes, on a count above its ceiling and, in the slow tier,
# on years that are not the list's: a mend takes its entry out; new data comes in clean or
# adds its findings here with their reasons. This list is findings owned, never a way round
# a failure.
#
# The owners are three. "a data fault for milestone 7c": the data lacks a date, a row or a
# form, and the data work mends it. "an engine fault": the code reads a date it should not,
# or does not read one it should; listed and reported, not mended by the audit. "a judgement
# to be read against a source": the finding rests on `data/range/reference.yaml`, a table
# written FROM MEMORY and read by nothing in the game (`basis: reference`); these are a kind
# of their own, counted apart, and the mechanical findings stand whole without them.
#
# Generated once from the run; the reasons written by kind. A reason is the audit's
# JUDGEMENT of the cause, not a source's.

