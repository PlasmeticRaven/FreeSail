# spanish: a Spanish ship's company (package 90, N1; docs/design/Design-Ship-Diana.md §17.1
#   question 6: the people of the corvette, the xebec, the three-decker and the tartane, by
#   their files' `names: spanish`). Spain's row in data/nations.yaml keeps `names: english`.
#   From Spain's statistics office, its tables as served on 2026-11-20: Instituto Nacional
#   de Estadística, "Frecuencias de apellidos" (the surnames borne by 100 or more as a first
#   surname; the annual population census at 1 January 2025) and "Nombres más frecuentes por
#   fecha de nacimiento" (the Padrón continuo at 1 January 2022):
#   - the surnames: the table's first 250 by rank, in its order, less the two of a modern
#     immigration (Singh, Chen) and the four of more than one word (de la Fuente, de la
#     Cruz, del Río, de la Torre): 244;
#   - the given names: the men born before 1930, the nation's fifty and each province of
#     birth's twenty (its sheets 1 and 3, those born abroad left out), in that order; one
#     name to a man (José María and the other compounds left out); the Catalan forms in
#     their Castilian (Josep, Joan, Jaume, Pere, Miquel, Jordi, Francesc, Joaquim, Lluís and
#     Antoni as José, Juan, Jaime, Pedro, Miguel, Jorge, Francisco, Joaquín, Luis and
#     Antonio); less Jesús, Javier alone, Alfredo, Daniel, David, Eduardo, Emilio, Julio and
#     Ricardo: 68.
#   JUDGEMENT throughout, the table being of today: the commonest Spanish surnames are
#   patronymics settled long before 1800, so their rank now stands for the period's; the men
#   born before 1930 are the table's nearest to the period, and the nine names left out are
#   taken for the fashions of the century after (the table does not say so). The nation's
#   table and not the coasts' alone, since a Spanish company held soldiers and landsmen
#   besides its seamen (the regulation of 1788's columns: docs/design/VesselReferences-2026-
#   11-Spanish.md §15). Written in the Academy's spelling (the table prints capitals with no
#   accents), one surname to a man as the other lists have it (a Spanish record often gave
#   two), and in full: the muster's abbreviations (freesail/crew/muster.py) are English and
#   reach none of these.
