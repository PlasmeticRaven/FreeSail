# Names for the muster, 1795 to 1815. Read by freesail/crew/muster.py; a ship file's
# `crew.names` says which list its company is drawn from.
#
# english: a King's ship's company. Parish-register given names of the later eighteenth
#   century (the common dozen recur, as they did: William, John, Thomas, James), with the
#   West Country well represented among the surnames (Penrose, Pengelly, Tozer), and a
#   share of Welsh (Rees, Pugh, Llewellyn), Scots (Macleod, Munro, Angus) and Irish
#   (Donovan, Brennan, Cornelius) as a frigate's books show them.
# american: a Baltimore privateer's crew. Chesapeake and New England names, with the
#   Dutch and German families of Maryland and Pennsylvania (Hendrick, Conrad, Stryker,
#   Shriver, Koontz), the Old Testament given names of the period, and the surnames some
#   free black seamen of the Chesapeake and New England carried (Cuffee, Fortune).
#
# A muster book abbreviates the common given names ("Wm.", "Jno.", "Thos."); the muster
# does so by the table in freesail/crew/muster.py, the same way every time.

