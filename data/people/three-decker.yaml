# FreeSail: the wardroom of the three-decker Purísima Concepción (spec M6 §2; package 40; package 90,
# her builder, docs/design/Design-Ship-PurisimaConcepcion.md §6). Her company as people: every
# station holder of data/ships/three-decker.yaml, with their rank, their station aboard, their place
# when nothing calls them elsewhere, and a character outline (a few traits, a line of history and a
# station brief), as data, in the form of data/people/seventy-four.yaml. Read by
# freesail/world/people.py, which gives each person their outline and binds the harness's stations
# to a person by role, and by tools/ships/concepcion.py, which draws the posts and the people below
# into the ship file's `crew.posts` and `crew.people`.
#
# The posts (Con-D §6.1, JUDGEMENT on the split) are of a navío of 112's commissioned officers by
# the regulation of 1 January 1788 (Winfield et al. 2023, p. 1446 and following: VesselReferences-
# 2026-11-Spanish.md §15): her brigadier commanding, the captain; the capitán de navío, her second
# in command; the capitán de fragata, the first lieutenant, who has the ship's working; the four
# tenientes de navío and the four tenientes de fragata, the second to the ninth lieutenants; and the
# chiefs of her major and sea officers: the first and second pilots as the master and the second
# master, the boatswain, the gunner, the carpenter, the purser, the surgeon and the chaplain; with
# the sailmaker and the master-at-arms, posts in the 74's file. Their words are the game's English,
# as for every ship: the brigadier who commanded her is "the captain" (Con-D §6.1). The eight
# alféreces stand in her stations. The people drawn are two pilot's mates, a guardiamarina as the
# captain's messenger, and the captain, the lieutenant and a sergeant of her soldiers.
#
# The officers by deck at quarters (Con-D §6.4), after the 74's and the 1795 deck plan's cabins (the
# admiral's on the toldilla, the captain's and the lieutenants' on the alcázar: PB_0050 via Winfield
# p. 409): the captain, the second captain and the master on the quarterdeck; two lieutenants a gun
# deck, the senior at the after guns and the junior at the foremost; the forecastle under the
# boatswain; the poop's musketry under the captain of her soldiers. No engine reads an officer at
# the guns, so they stand in the briefs alone. The flag and its party are a scenario's `people:`,
# not her file's (Con-D §6.5).
#
# The names are the muster's, drawn under the seed from the spanish list of data/crew/names.yaml
# (package 90, N1). Her flag officers and captains (Córdova, Lángara, Mazarredo, Morales de los
# Ríos: VesselReferences-2026-11-Spanish.md §4) are a scenario's to name by `people:`; her file
# names none. The outlines are judgement, plain types in the period's words, and name no one.
#
# The form of an entry is the frigate-36's file's (role, post, drawn, messenger, rank, station,
# place, traits, history, brief, note).

ship: data/ships/three-decker.yaml

# The harness's stations (spec M4 §11; M6 §3) bound to a person by role, as the 74's: the second
# and third lieutenants keep the watches the officer of the watch's stations name, two watches by
# the bill (Con-D §6.2).
stations:
  captain: captain
  officer of the watch: first lieutenant
  master: master
  second officer: {kind: officer of the watch, holder: second lieutenant}
  third officer: {kind: officer of the watch, holder: third lieutenant}

wardroom:
  - role: captain
    post: true
    rank: brigadier, commanding
    station: the command
    place: quarterdeck
    traits: [grave, unhurried, holds the line's station to the cable]
    history: "Out of the Guardias Marinas at Cádiz; a 74's captain in the last war."
    brief: >-
      The ship, her people and her orders are theirs: her station in the line or on the flag's
      errands, the standing orders, and the answer for the whole; at quarters on the quarterdeck.
  - role: second captain
    post: true
    rank: capitán de navío, her second in command
    station: the second in command
    place: quarterdeck
    traits: [exact, a driver of the officers, keeps the ship's books of orders]
    history: "A frigate's captain before this appointment as the ship's second."
    brief: >-
      The segundo comandante: the ship's order and discipline under the captain, the officers'
      duties and the bills; the command if the captain falls; at quarters on the quarterdeck.
  - role: first lieutenant
    post: true
    rank: capitán de fragata
    station: the first lieutenant's
    place: quarterdeck
    traits: [steady, loud on deck, knows every hand's station]
    history: "Twelve years a sea officer, three of them in the squadron at Cartagena."
    brief: >-
      The ship's working under the captain and the second: the watch bill, the stations, the sail
      evolutions, and the deck in their watch by the bill.
  - role: second lieutenant
    post: true
    rank: teniente de navío
    station: the second lieutenant's
    place: quarterdeck
    traits: [cool, a good seaman, sparing with the hands]
    history: "A teniente de navío of the frigates; their first ship of the line."
    brief: >-
      A watch of their own by the bill, the deck in it under the captain's night orders; at
      quarters the lower deck's after guns.
  - role: third lieutenant
    post: true
    rank: teniente de navío
    station: the third lieutenant's
    place: quarterdeck
    traits: [eager, quick at a fix, apt to carry sail]
    history: "Made teniente de navío after the siege of Gibraltar."
    brief: >-
      The other watch by the bill; at quarters the middle deck's after guns.
  - role: fourth lieutenant
    post: true
    rank: teniente de navío
    station: the fourth lieutenant's
    place: quarterdeck
    traits: [careful, slow to anger, a good hand with the guns' crews]
    history: "Ten years in the service, the last four in ships of the line."
    brief: >-
      At quarters the upper deck's after guns; the boats at anchor.
  - role: fifth lieutenant
    post: true
    rank: teniente de navío
    station: the fifth lieutenant's
    place: quarterdeck
    traits: [precise, keeps the signal book, a fine hand at a chart]
    history: "Of the navy's school of navigation; a pilot's eye."
    brief: >-
      The signals under the captain; at quarters with the signals on the poop.
  - role: sixth lieutenant
    post: true
    rank: teniente de fragata
    station: the sixth lieutenant's
    place: quarterdeck
    traits: [young, keen, much at the guns' drill]
    history: "Made teniente de fragata out of the alféreces two years since."
    brief: >-
      At quarters the lower deck's foremost guns.
  - role: seventh lieutenant
    post: true
    rank: teniente de fragata
    station: the seventh lieutenant's
    place: quarterdeck
    traits: [cheerful, a strong voice, popular with the hands]
    history: "A teniente de fragata of the gunboats at Algeciras."
    brief: >-
      At quarters the middle deck's foremost guns.
  - role: eighth lieutenant
    post: true
    rank: teniente de fragata
    station: the eighth lieutenant's
    place: quarterdeck
    traits: [quiet, exact, keeps a journal]
    history: "Two years a teniente de fragata, their first three-decker."
    brief: >-
      At quarters the upper deck's foremost guns.
  - role: ninth lieutenant
    post: true
    rank: teniente de fragata
    station: the ninth lieutenant's
    place: quarterdeck
    traits: [new to the rank, anxious to do well, everywhere at once]
    history: "Lately an alférez de navío of this ship."
    brief: >-
      At quarters the quarterdeck's and the forecastle's guns under the first lieutenant.
  - role: master
    post: true
    rank: primer piloto
    station: the navigation
    place: quarterdeck
    traits: [dry, exact with the log board, trusts the lead over the chart]
    history: "Twenty-five years at sea in the King's ships and the Indies' convoys."
    brief: >-
      The reckoning, the sights, the lead and the chart: they work the account, warn the captain
      of the dangers and shape the course the captain orders; at quarters on the quarterdeck.
  - role: second master
    post: true
    rank: segundo piloto
    station: the second pilot's
    place: quarterdeck
    traits: [careful, quick at figures, a good hand with the glass]
    history: "A pilot of the coasting trade before the King's service."
    brief: >-
      The first pilot's second: the log, the hold's stowage for her trim, and the con under the
      first pilot.
  - role: boatswain
    post: true
    rank: contramaestre
    station: the rigging and the boats
    place: deck
    traits: [loud, knows every rope by its feel, hard on idlers]
    history: "A topman of the Ferrol squadron, rated contramaestre after the last peace."
    brief: >-
      The rigging, the cables, the anchors, the boats and the hands at their stations: they pipe
      the evolutions and see the gear overhauled; at quarters the forecastle.
  - role: gunner
    post: true
    rank: condestable
    station: the guns and the magazine
    place: deck
    traits: [quiet, methodical, keeps the magazine dry]
    history: "Of the navy's artillery corps; a gunner's mate at Cartagena before their warrant."
    brief: >-
      The guns, the carriages, the powder and the shot; the quarters and the drill of the
      artillery are theirs; at quarters the magazine and the filling of cartridges.
  - role: carpenter
    post: true
    rank: maestro carpintero
    station: the hull and the spars
    place: deck
    traits: [patient, a hand for a fished spar, sounds the well without being told]
    history: "Out of the arsenal at Ferrol, where she was built."
    brief: >-
      The hull, the masts, the yards and the pumps: they sound the well, fish a sprung spar and
      report a leak to the captain; at quarters the wings with their crew.
  - role: purser
    post: true
    rank: contador
    station: the stores and the books
    place: gunroom
    traits: [careful with a peso, slow to issue, keeps good books]
    history: "A clerk of the department at Cádiz before their appointment."
    brief: >-
      The provisions, the slops and the ship's books: the stores demanded and issued and the
      accounts kept.
  - role: surgeon
    post: true
    rank: primer cirujano
    station: the sick berth
    place: gunroom
    traits: [plain-spoken, reads at night, reports the sick list every morning]
    history: "Of the navy's college of surgery at Cádiz; three ships before this one."
    brief: >-
      The sick and the hurt and the sick berth: the sick list to the captain each morning; at
      quarters the cockpit.
  - role: chaplain
    post: true
    rank: capellán
    station: the ship's prayers
    place: gunroom
    traits: [mild, a reader of sermons, good with the boys]
    history: "A priest of the diocese of Mondoñedo before their appointment."
    brief: >-
      Mass on the Sunday and the feasts, the burials, and the boys' catechism; at quarters in the
      cockpit with the surgeon.
  - role: sailmaker
    post: true
    rank: maestro velero
    station: the sail room
    place: sail_room
    traits: [neat, slow, proud of their seams]
    history: "A sailmaker of the arsenal before they went to sea."
    brief: >-
      The sails, bent and unbent, their repair and the sail room's account.
  - role: master-at-arms
    post: true
    rank: sargento de brigadas
    station: the discipline
    place: deck
    traits: [upright, a soldier's bearing, misses nothing]
    history: "A sergeant of the navy's infantry before being rated to the ship."
    brief: >-
      The ship's police: the rounds, the lights out, the small arms and the prisoners.
  - role: master's mate
    drawn: {station: forecastle, rating: able}
    rank: pilotín
    station: the pilot's assistant
    place: quarterdeck
    traits: [handy, keen on the sights, aims at a pilot's place]
    history: "An able seaman of the forecastle, a pilotín this commission."
    brief: >-
      Assists the pilots in the observations and the reckoning, and keeps a watch by the bill.
    note: >-
      A pilot's mate, of the regulation's junior pilots, an able seaman of the forecastle: the
      master's mate's role in the game's English (judgement).
  - role: master's mate
    drawn: {station: forecastle, rating: able}
    rank: pilotín
    station: the pilot's assistant
    place: quarterdeck
    traits: [older, steady, a good hand with the lead]
    history: "Fifteen years before the mast and two as a pilotín."
    brief: >-
      As the first pilot's mate's; the log board in the night watches.
  - role: midshipman
    drawn: {station: afterguard, rating: landsman}
    messenger: true
    rank: guardiamarina
    station: the captain's messenger
    place: quarterdeck
    traits: [quick, fifteen, everywhere at once]
    history: "A year out of the company of the Guardias Marinas at Ferrol."
    brief: >-
      Carries the captain's word about the ship (pass the word for, send for), keeps a watch by
      the bill and learns the reckoning from the pilots; at quarters the signals on the poop.
    note: A guardiamarina as the captain's messenger, one of the boys of the afterguard.
  # the captain, the lieutenant and a sergeant of her soldiers, drawn from the 225 (the regulation
  # of 1788's 168 infantry and 57 infantry-artillery for her rate: Con-D §6.1), so that the
  # muster's 225 stand as they are; their roles the game's English for the marines' officers
  - role: captain of marines
    drawn: {station: marines, rating: marine}
    rank: captain of the navy's infantry
    station: the soldiers
    place: quarterdeck
    traits: [formal, a soldier first, careful of the company's credit]
    history: "Of the Real Armada's infantry; a company's captain in the ships of the line."
    brief: >-
      Commands her soldiers: the sentries, the guard and the drill at the musket and the great
      gun; at quarters on the quarterdeck, the soldiers on the poop and the gangways under their
      officers, the fire by volley within musket shot, and the guard on the prisoners.
    note: The captain of her soldiers, drawn from the 225.
  - role: lieutenant of marines
    drawn: {station: marines, rating: marine}
    rank: officer of the navy's infantry
    station: the soldiers
    place: quarterdeck
    traits: [upright, exact at the drill, a little apart from the sea officers]
    history: "Of the Real Armada's infantry; two commissions in the frigates."
    brief: >-
      Under the captain of the soldiers: the sentries at the cabin door, the spirit room and the
      gangway, the drill in the forenoon; at quarters the soldiers on the poop.
    note: The lieutenant of her soldiers, drawn from the 225.
  - role: sergeant of marines
    drawn: {station: marines, rating: marine}
    rank: sergeant of the navy's infantry
    station: the soldiers
    place: deck
    traits: [a loud voice, the pike, twenty years' service]
    history: "A private of the navy's infantry in the last war; a sergeant since."
    brief: >-
      Posts the sentries, takes the drill and the muster of the soldiers and leads the file on a
      boarding.
    note: A sergeant of her soldiers, drawn from the 225.
