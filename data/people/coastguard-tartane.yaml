# FreeSail: the afterguard of the guarda-costa tartane San Pedro (spec M6 §2; package 40;
# package 90, the tartane's builder, docs/design/Design-Ship-Tartane.md §6.3, §6.4). Her station
# holders as people: the master, who commands her (her commander), and a mate, with a boy to
# carry the word, the cutter's form for a King's small craft (data/people/cutter.yaml). Each with
# their rank, their station aboard, their place when nothing calls them elsewhere, and a
# character outline, as data, in the form of data/people/frigate-36.yaml. Read by
# freesail/world/people.py and by tools/ships/tartane.py, which draws the posts and the people
# below into the ship file's `crew.posts` and `crew.people`.
#
# The outlines are judgement, bred in the Spanish coastguard of the Mediterranean, the
# Treasury's service (the navy's from 1802 to April 1805: Winfield et al. 2023, pp. 168-169, by
# VesselReferences-2026-11-Spanish.md §10), and name no one: the names are the muster's, drawn
# under the seed from the spanish list (package 90's N1). A scenario names her people by
# `people:`.

ship: data/ships/coastguard-tartane.yaml

# The harness's stations bound to a person by role: the officer of the watch is the mate (spec
# M5 §29), and so is the master's station (spec M6 §11; package 41), as the cutter's: she
# carries no master beside the one who commands her.
stations:
  captain: master
  officer of the watch: mate
  master: mate

wardroom:
  - role: master
    post: true
    rank: master
    station: the command
    place: quarterdeck
    traits: [vigilant, a smuggler's cunning turned the other way, sparing of powder]
    history: "Bred in the coasting trade of Valencia; in the coastguard's service six years."
    brief: >-
      The guarda-costa, her people and her orders: the station kept, every sail spoken, the
      smuggler chased and the merchant defended. Works his own reckoning.
  - role: mate
    post: true
    rank: mate
    station: the mate's
    place: quarterdeck
    traits: [steady, a good hand at the guns, careful of the great yard]
    history: "A fisherman of Alicante before the service; mate of this tartane two years."
    brief: >-
      The deck in his watch under the master's standing orders, the sails, the guns' gear and
      the great yard's change; reports every sail and every shift of wind, and takes the deck
      when the master gives it.
  - role: boy
    drawn: {station: afterguard, rating: landsman}
    messenger: true
    rank: boy
    station: the master's messenger
    place: quarterdeck
    traits: [small, quick, proud of the service]
    history: "Shipped at Cartagena; this cruise his first."
    brief: >-
      Carries the master's word about the vessel (pass the word for, send for).
    note: A boy as the messenger (judgement), as the cutter's.
