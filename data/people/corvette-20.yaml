# FreeSail: the wardroom of the corvette Diana (spec M6 §2; package 40; package 90, her builder,
# docs/design/Design-Ship-Diana.md §6). Her company as people: every station holder of
# data/ships/corvette-20.yaml, with their rank, their station aboard, their place when nothing
# calls them elsewhere, and a character outline (a few traits, a line of history and a station
# brief), as data, in the form of data/people/frigate-36.yaml. Read by freesail/world/people.py,
# which gives each person their outline and binds the harness's stations to a person by role, and
# by tools/ships/diana.py, which draws the posts and the people below into the ship file's
# `crew.posts` and `crew.people`.
#
# The posts are her design's ten (Dia-D §6.1): the commissioned officers of a corvette of 18 to 22
# guns by the regulation of 1 January 1788, a teniente de navío commanding, a teniente de fragata
# and the alféreces (Winfield et al. 2023, p. 1446 and following: VesselReferences-2026-11-
# Spanish.md §15), here the captain and two lieutenants; the pilot, her master; and the standing
# and warrant officers, the boatswain, the gunner, the carpenter, the purser, the surgeon and the
# sailmaker. Their words are the game's English, as for every ship: the teniente de navío who
# commanded her is "the captain" (Dia-D §6.1). The people drawn are a pilot's mate, a
# guardiamarina as the captain's messenger, and the officer and sergeant of her soldiers.
#
# The names are the muster's, drawn under the seed from the spanish list of data/crew/names.yaml
# (package 90, N1). Her captain of 1809-1810 was the teniente de navío José de Julián (her plan) and
# of 1807 the Danish captain-lieutenant C. N. Meyer (Roos 1957); a scenario names them by
# `people:` (a role and a name), and her file names none. The outlines are judgement, plain types
# in the period's words, and name no one.
#
# The form of an entry is the frigate-36's file's (role, post, drawn, messenger, rank, station,
# place, traits, history, brief, note).

ship: data/ships/corvette-20.yaml

# The harness's stations (spec M4 §11; M6 §3) bound to a person by role: the captain commands,
# the first lieutenant has the deck, the pilot keeps the reckoning, and the second lieutenant
# keeps the other watch (package 45c), two watches by the bill (Dia-D §6.2).
stations:
  captain: captain
  officer of the watch: first lieutenant
  master: master
  second officer: {kind: officer of the watch, holder: second lieutenant}

wardroom:
  - role: captain
    post: true
    rank: teniente de navío, commanding
    station: the command
    place: quarterdeck
    traits: [exact, sparing of words, knows the coast of Murcia by heart]
    history: "Out of the Guardias Marinas at Cartagena; a frigate's lieutenant before this command."
    brief: >-
      The ship, her people and her orders are theirs: the course and the standing orders, the
      pilot taken or declined, the port's business and the answer for the whole.
  - role: first lieutenant
    post: true
    rank: teniente de fragata
    station: the first lieutenant's
    place: quarterdeck
    traits: [steady, a driver of the hands, keeps the watch bill close]
    history: "Ten years a sea officer, two of them in the gunboats off Cádiz."
    brief: >-
      The ship's working and her people under the captain: the watch bill, the stations, the
      sail evolutions, and the deck in their watch by the bill.
  - role: second lieutenant
    post: true
    rank: alférez de navío
    station: the second lieutenant's
    place: quarterdeck
    traits: [eager, a good hand at a fix, apt to carry sail]
    history: "Made alférez two years ago; their first ship as a commissioned officer."
    brief: >-
      A watch of their own by the bill, the deck in it under the captain's night orders, every
      strange sail and every shift of wind reported.
  - role: master
    post: true
    rank: pilot
    station: the navigation
    place: quarterdeck
    traits: [dry, exact with the log board, trusts the lead over the chart]
    history: "Twenty years at sea in the King's ships and the coasters of the Levant."
    brief: >-
      The reckoning, the sights, the lead and the chart: they work the account, warn the captain
      of the dangers and shape the course the captain orders.
  - role: boatswain
    post: true
    rank: warrant officer
    station: the rigging and the boats
    place: deck
    traits: [loud, knows every rope by its feel, hard on idlers]
    history: "A topman of the Mediterranean squadron, rated boatswain after the last peace."
    brief: >-
      The rigging, the cables, the anchors, the boats and the hands at their stations: they pipe
      the evolutions and see the gear overhauled.
  - role: gunner
    post: true
    rank: warrant officer
    station: the guns and the magazine
    place: deck
    traits: [quiet, methodical, keeps the magazine dry]
    history: "Of the navy's artillery; a gunner's mate at Cartagena before their warrant."
    brief: >-
      The guns, the carriages, the powder and the shot; the quarters and the drill are theirs.
  - role: carpenter
    post: true
    rank: warrant officer
    station: the hull and the spars
    place: deck
    traits: [patient, a hand for a fished spar, sounds the well without being told]
    history: "Out of the arsenal at Cartagena; knew this hull from her Danish fitting."
    brief: >-
      The hull, the masts, the yards and the pumps: they sound the well, fish a sprung spar and
      report a leak to the captain.
  - role: purser
    post: true
    rank: warrant officer
    station: the stores and the books
    place: gunroom
    traits: [careful with a peso, slow to issue, keeps good books]
    history: "A clerk of the department at Cartagena before their appointment."
    brief: >-
      The provisions, the slops and the ship's books: the stores demanded and issued and the
      accounts kept.
  - role: surgeon
    post: true
    rank: warrant officer
    station: the sick berth
    place: gunroom
    traits: [plain-spoken, reads at night, reports the sick list every morning]
    history: "Of the navy's college of surgery at Cádiz; two ships before this one."
    brief: >-
      The sick and the hurt and the sick berth: the sick list to the captain each morning.
  - role: sailmaker
    post: true
    rank: warrant officer
    station: the sail room
    place: sail_room
    traits: [neat, slow, proud of their seams]
    history: "A sailmaker of the arsenal before they went to sea."
    brief: >-
      The sails, bent and unbent, their repair and the sail room's account.
  - role: master's mate
    drawn: {station: forecastle, rating: able}
    rank: pilot's mate
    station: the pilot's assistant
    place: quarterdeck
    traits: [handy, keen on the sights, aims at a pilot's place]
    history: "An able seaman of the forecastle rated mate to the pilot this commission."
    brief: >-
      Assists the pilot in the observations and the reckoning, and keeps a watch by the bill.
    note: >-
      A pilot's mate, an able seaman of the forecastle, the master's mate's role in the game's
      English (judgement).
  - role: midshipman
    drawn: {station: afterguard, rating: landsman}
    messenger: true
    rank: guardiamarina
    station: the captain's messenger
    place: quarterdeck
    traits: [quick, fifteen, everywhere at once]
    history: "A year out of the company of the Guardias Marinas at Cartagena."
    brief: >-
      Carries the captain's word about the ship (pass the word for, send for), keeps a watch by
      the bill and learns the reckoning from the pilot.
    note: A guardiamarina as the captain's messenger, one of the boys of the afterguard.
  # the officer and the sergeant of her soldiers, drawn from the fifty (the regulation of 1788's
  # forty infantry and ten infantry-artillery for her rate: Dia-D §6.1), so that the muster's
  # fifty stand as they are; their roles the game's English for the marines' officer and sergeant
  - role: lieutenant of marines
    drawn: {station: marines, rating: marine}
    rank: officer of the navy's infantry
    station: the soldiers
    place: quarterdeck
    traits: [upright, exact at the drill, a little apart from the sea officers]
    history: "Of the Real Armada's infantry; two commissions in the frigates."
    brief: >-
      Commands the soldiers: the sentries and the guard, the drill at the musket and the great
      gun, and at quarters the poop, the fire by volley within musket shot and the boarders'
      backbone.
    note: The officer of her soldiers, drawn from the fifty.
  - role: sergeant of marines
    drawn: {station: marines, rating: marine}
    rank: sergeant of the navy's infantry
    station: the soldiers
    place: deck
    traits: [a loud voice, the pike, twenty years' service]
    history: "A private of the navy's infantry in the last war; a sergeant since."
    brief: >-
      Posts the sentries, takes the drill and the muster of the soldiers and leads the file on a
      boarding.
    note: The sergeant of her soldiers, drawn from the fifty.
