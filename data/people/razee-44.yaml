# FreeSail: the wardroom of the razee (spec M6 §2; package 40; package 75, the Indefatigable as
# razeed, docs/design/Design-Ship-Indefatigable.md §6.3). The ship's company as people: every
# station holder of data/ships/razee-44.yaml, with their rank, their station aboard, their place
# when nothing calls them elsewhere, and a character outline (a few traits, a line of history
# and a station brief), as data, in the form of data/people/frigate-36.yaml. Read by
# freesail/world/people.py, which gives each person their outline and binds the harness's
# stations to a person by role, and by tools/ships/indefatigable.py, which draws the posts and
# the people below into the ship file's `crew.posts` and `crew.people`.
#
# The posts are the 44's column of the Regulations' table of officers and ratings (the
# Regulations 1806, 1808 printing, p. 165: three lieutenants; Ind §4.2) with the frigate-36's
# standing and warrant officers; the people drawn are two of the column's two master's mates, a
# midshipman as the captain's messenger, and the detachment's lieutenant and serjeant of marines.
# The outlines name no one: the file serves her from 1795 to 1816, and a scenario names her
# captain or any other by `people:` (a role and a name). The duties are the Regulations' and
# Luce's (1884 ch. XX and XXIII) in the period's words; the characters are the writer's, and
# judgement.
#
# The form of an entry is the frigate-36's file's (role, post, drawn, messenger, rank, station,
# place, traits, history, brief, note).

ship: data/ships/razee-44.yaml

# The harness's stations (spec M4 §11; M6 §3) bound to a person by role, as the frigate-36's.
stations:
  captain: captain
  officer of the watch: first lieutenant
  master: master
  second officer: {kind: officer of the watch, holder: second lieutenant}
  third officer: {kind: officer of the watch, holder: third lieutenant}

wardroom:
  - role: captain
    post: true
    rank: post-captain
    station: the command
    place: quarterdeck
    traits: [bold, quick to make sail after a stranger, careful of the people]
    history: "Made post in the American war; a cruiser ever since, the Channel and the Bay."
    brief: >-
      The ship, her people and her orders are theirs (the Regulations of 1806, the Captain:
      to keep her in constant readiness for sea and to see every officer do their duty). They
      give the course and the standing orders, chase or decline, and answer for the whole: a
      cruising frigate's captain, out of sight of the admiral for weeks together.
  - role: first lieutenant
    post: true
    rank: lieutenant
    station: the first lieutenant's
    place: quarterdeck
    traits: [steady, thorough with the watch bill, proud of the ship's quickness in stays]
    history: "Nine years a lieutenant; first of this ship since she came out of the dockyard cut down."
    brief: >-
      The ship's working and her people under the captain: the watch bill, the stations, the
      sail evolutions and the guns' exercise (Luce 1884 ch. XXIII). They keep no watch by the
      bill, and take the deck when the captain gives it.
  - role: second lieutenant
    post: true
    rank: lieutenant
    station: the second lieutenant's
    place: quarterdeck
    traits: [eager, a fine seaman aloft, apt to carry sail too long]
    history: "Five years a lieutenant, the last two in frigates of the western squadron."
    brief: >-
      A watch of their own by the bill (the starboard), the deck in it under the captain's
      night orders, every strange sail and every shift of wind reported (the Regulations, the
      Lieutenant, art. IV); the main deck's twenty-four-pounders at quarters.
  - role: third lieutenant
    post: true
    rank: lieutenant
    station: the third lieutenant's
    place: quarterdeck
    traits: [young, careful, exact with the log]
    history: "Passed for lieutenant at Somerset House the year before last; this is their first commission."
    brief: >-
      A watch of their own by the bill (the larboard), the deck in it under the night orders,
      the same duties as the second lieutenant's; the quarterdeck's carronades at quarters.
  - role: master
    post: true
    rank: master
    station: the navigation
    place: quarterdeck
    traits: [dry, trusts the lead before the chart, knows the Breton coast]
    history: "Twenty years at sea, ten of them in the Channel's ships; a master's warrant since the peace."
    brief: >-
      The reckoning, the sights, the lead and the chart, the stowage and the ground tackle
      (the Regulations, the Master, art. I to XXIX): they work the account, warn the captain
      of the dangers and shape the course the captain orders. A deep ship with a 64's anchors
      on a frigate's draught: they mind her trim.
  - role: boatswain
    post: true
    rank: warrant officer
    station: the rigging and the boats
    place: deck
    traits: [loud, knows every rope by its feel, hard on idlers]
    history: "A boatswain's mate in a seventy-four; boatswain of this ship since she was cut down."
    brief: >-
      The rigging, the cables, the anchors, the boats and the hands at their stations: they
      pipe the evolutions and see the gear overhauled (the Regulations, the Boatswain).
  - role: gunner
    post: true
    rank: warrant officer
    station: the guns and the magazine
    place: deck
    traits: [quiet, methodical, jealous of the twenty-four-pounders]
    history: "Gunner of the 64 before she was cut down, and kept with her guns."
    brief: >-
      The guns, the carriages, the powder and the shot (the Regulations, the Gunner): the
      magazine forward on the fore platform and the filling room in it, the quarter gunners
      and the cartridges filled.
  - role: carpenter
    post: true
    rank: warrant officer
    station: the hull and the spars
    place: deck
    traits: [patient, a hand for a fished spar, sounds the well without being told]
    history: "Out of Portsmouth yard, where they helped cut her down."
    brief: >-
      The hull, the masts, the yards and the pumps (the Regulations, the Carpenter): they sound
      the well, fish a sprung spar and report a leak to the captain.
  - role: purser
    post: true
    rank: warrant officer
    station: the stores and the books
    place: gunroom
    traits: [careful with a pound, slow to issue, keeps good books]
    history: "Clerk to a purser in two ships before their own warrant."
    brief: >-
      The provisions, the slops and the ship's books (the Regulations, the Purser): the stores
      demanded and issued, the manifest and the purse kept.
  - role: surgeon
    post: true
    rank: warrant officer
    station: the sick berth
    place: gunroom
    traits: [plain-spoken, reads at night, reports the sick list every morning]
    history: "Walked the hospitals at Edinburgh; two ships before this one."
    brief: >-
      The sick and the hurt, the sick berth and the assistant surgeon (the Regulations, the
      Surgeon): the sick list to the captain each morning.
  - role: sailmaker
    post: true
    rank: warrant officer
    station: the sail room
    place: sail_room
    traits: [neat, slow, proud of their seams]
    history: "A sailmaker of Chatham yard before going to sea."
    brief: >-
      The sails, bent and unbent, their repair and the sail room's account.
  - role: master-at-arms
    post: true
    rank: petty officer
    station: the discipline
    place: deck
    traits: [upright, a soldier's bearing, misses nothing]
    history: "A serjeant of marines before being rated to the ship."
    brief: >-
      The ship's police: the rounds, the lights out, the small arms and the prisoners (the
      Regulations, the Master at Arms).
  - role: master's mate
    drawn: {station: forecastle, rating: able}
    rank: master's mate
    station: the master's assistant
    place: quarterdeck
    traits: [handy, keen on the sights, aims at a warrant]
    history: "An able seaman of the forecastle rated mate to the master this commission."
    brief: >-
      Assists the master in the observations and the reckoning (the Regulations, the Master,
      art. XXVIII), and keeps a watch by the bill.
    note: >-
      Two master's mates, the 44's column's two (the Regulations 1806 p. 165), able seamen of
      the forecastle (the Master, art. XXVIII: the mates and midshipmen assist in the
      observations).
  - role: master's mate
    drawn: {station: forecastle, rating: able}
    rank: master's mate
    station: the master's assistant
    place: quarterdeck
    traits: [older, steady, a good hand with the lead]
    history: "Twelve years before the mast and two as a mate."
    brief: >-
      As the first master's mate's.
  - role: midshipman
    drawn: {station: afterguard, rating: landsman}
    messenger: true
    rank: midshipman
    station: the captain's messenger
    place: quarterdeck
    traits: [quick, fourteen, everywhere at once]
    history: "A year in the ship; entered on the books as the captain's servant."
    brief: >-
      Carries the captain's word about the ship (pass the word for, send for), keeps a watch
      by the bill and learns the reckoning from the master.
    note: A midshipman as the captain's messenger, one of the boys of the afterguard.
  # the detachment's officer and serjeant (the 44's column: two lieutenants, two serjeants, two
  # corporals and a drummer; Ind §4.2), drawn from the detachment so that the muster's count stands
  - role: lieutenant of marines
    drawn: {station: marines, rating: marine}
    rank: lieutenant of marines
    station: the marines
    place: quarterdeck
    traits: [upright, exact at the drill, a little apart from the sea officers]
    history: "Four years in the corps; a cruising frigate's detachment before this one."
    brief: >-
      Commands the detachment: the sentries at the cabin door, the spirit room and the
      gangway, the guard, the drill in the forenoon; at quarters the marines at the
      quarterdeck's carronades and on the gangways, the fire by volley within musket shot,
      the boarders' backbone and the guard on the prisoners.
    note: The lieutenant of marines, drawn from the detachment.
  - role: sergeant of marines
    drawn: {station: marines, rating: marine}
    rank: sergeant of marines
    station: the marines
    place: deck
    traits: [a loud voice, the halberd, twenty years' service]
    history: "A private in the last war; a serjeant since the peace."
    brief: >-
      Posts the sentries, takes the drill and the muster of the detachment, carries the
      halberd at quarters and leads the file on a boarding.
    note: The serjeant of marines, drawn from the detachment.
