# FreeSail: the wardroom of the sixty-four (spec M6 §2; package 40; package 75, the Indefatigable
# as built, docs/design/Design-Ship-Indefatigable.md §6.3). The ship's company as people: every
# station holder of data/ships/sixty-four.yaml, with their rank, their station aboard, their
# place when nothing calls them elsewhere, and a character outline (a few traits, a line of
# history and a station brief), as data, in the form of data/people/frigate-36.yaml. Read by
# freesail/world/people.py, which gives each person their outline and binds the harness's
# stations to a person by role, and by tools/ships/indefatigable.py, which draws the posts and
# the people below into the ship file's `crew.posts` and `crew.people`.
#
# The posts are the 64's column of the Regulations' table of officers and ratings (the
# Regulations 1806, 1808 printing, p. 165: five lieutenants; Ind §4.2) with the frigate-36's
# standing and warrant officers; the people drawn are the column's three master's mates, a
# midshipman as the captain's messenger, and the detachment's captain, lieutenant and serjeant
# of marines. She was never in commission as a 64, so the outlines are those of a 64 of her
# class; they name no one, and a scenario names any of them by `people:` (a role and a name).
# The duties are the Regulations' and Luce's (1884 ch. XX and XXIII) in the period's words; the
# characters are the writer's, and judgement.
#
# The form of an entry is the frigate-36's file's (role, post, drawn, messenger, rank, station,
# place, traits, history, brief, note).

ship: data/ships/sixty-four.yaml

# The harness's stations (spec M4 §11; M6 §3) bound to a person by role, as the frigate-36's:
# the second and third lieutenants keep the watches the officer of the watch's stations name.
stations:
  captain: captain
  officer of the watch: first lieutenant
  master: master
  second officer: {kind: officer of the watch, holder: second lieutenant}
  third officer: {kind: officer of the watch, holder: third lieutenant}

wardroom:
  - role: captain
    post: true
    rank: post-captain
    station: the command
    place: quarterdeck
    traits: [grave, exact in the line, sparing of words]
    history: "Made post in the American war; a ship of the line in the Channel fleet since."
    brief: >-
      The ship, her people and her orders are theirs (the Regulations of 1806, the Captain:
      to keep her in constant readiness for sea and to see every officer do their duty). They
      keep her station in the line or on the admiral's errands, give the standing orders and
      answer for the whole.
  - role: first lieutenant
    post: true
    rank: lieutenant
    station: the first lieutenant's
    place: quarterdeck
    traits: [steady, a driver of the hands, a stickler for the watch bill]
    history: "Twelve years a lieutenant; first of this ship since she commissioned."
    brief: >-
      The ship's working and her people under the captain: the watch bill, the stations, the
      sail evolutions and the quarterdeck in their watch (Luce 1884 ch. XXIII). They keep no
      watch by the bill, and take the deck when the captain gives it.
  - role: second lieutenant
    post: true
    rank: lieutenant
    station: the second lieutenant's
    place: quarterdeck
    traits: [eager, a good hand at a fix, apt to carry sail]
    history: "Six years a lieutenant, two of them in the West Indies."
    brief: >-
      A watch of their own by the bill (the starboard), the deck in it under the captain's
      night orders, every strange sail and every shift of wind reported (the Regulations, the
      Lieutenant, art. IV); the lower deck's twenty-four-pounders at quarters.
  - role: third lieutenant
    post: true
    rank: lieutenant
    station: the third lieutenant's
    place: quarterdeck
    traits: [careful, slow to shorten sail, good with the people]
    history: "Four years a lieutenant, from a frigate's quarterdeck."
    brief: >-
      A watch of their own by the bill (the larboard), the deck in it under the night orders,
      the same duties as the second lieutenant's; the upper deck's eighteen-pounders at
      quarters.
  - role: fourth lieutenant
    post: true
    rank: lieutenant
    station: the fourth lieutenant's
    place: quarterdeck
    traits: [young, quick with the signals, keen]
    history: "Made lieutenant two years since, from a flagship's midshipmen's berth."
    brief: >-
      The signals, and a watch in turn when the captain has the watches kept in three; the
      lower deck's after guns at quarters.
  - role: fifth lieutenant
    post: true
    rank: lieutenant
    station: the fifth lieutenant's
    place: quarterdeck
    traits: [new to the rank, anxious to please, a good hand in a boat]
    history: "Passed for lieutenant at Somerset House last year; this is their first commission."
    brief: >-
      The boats and the boarders; the forecastle and the quarterdeck's nine-pounders at
      quarters, under the first lieutenant.
  - role: master
    post: true
    rank: master
    station: the navigation
    place: quarterdeck
    traits: [dry, exact with the log board, trusts the lead over the chart]
    history: "Twenty years at sea; master's mate in a seventy-four before their warrant."
    brief: >-
      The reckoning, the sights, the lead and the chart, the stowage and the ground tackle
      (the Regulations, the Master, art. I to XXIX): they work the account, warn the captain
      of the dangers and shape the course the captain orders.
  - role: boatswain
    post: true
    rank: warrant officer
    station: the rigging and the boats
    place: deck
    traits: [loud, knows every rope by its feel, hard on idlers]
    history: "Twenty years in ships of the line, the last ten as a warrant officer."
    brief: >-
      The rigging, the cables, the anchors, the boats and the hands at their stations: they
      pipe the evolutions and see the gear overhauled (the Regulations, the Boatswain).
  - role: gunner
    post: true
    rank: warrant officer
    station: the guns and the magazine
    place: deck
    traits: [quiet, methodical, keeps the magazine dry]
    history: "Gunner's mate in a ninety-gun ship; their warrant since."
    brief: >-
      The guns, the carriages, the powder and the shot (the Regulations, the Gunner): two
      tiers of guns and the forecastle's and quarterdeck's, the quarter gunners and the
      cartridges filled.
  - role: carpenter
    post: true
    rank: warrant officer
    station: the hull and the spars
    place: deck
    traits: [patient, a hand for a fished spar, sounds the well without being told]
    history: "Out of the yard at Plymouth; carpenter of a frigate before this ship."
    brief: >-
      The hull, the masts, the yards and the pumps (the Regulations, the Carpenter): they sound
      the well, fish a sprung spar and report a leak to the captain.
  - role: purser
    post: true
    rank: warrant officer
    station: the stores and the books
    place: gunroom
    traits: [careful with a pound, slow to issue, keeps good books]
    history: "Clerk to a purser in two ships before their own warrant."
    brief: >-
      The provisions, the slops and the ship's books (the Regulations, the Purser): the stores
      demanded and issued, the manifest and the purse kept.
  - role: surgeon
    post: true
    rank: warrant officer
    station: the sick berth
    place: gunroom
    traits: [plain-spoken, reads at night, reports the sick list every morning]
    history: "Walked the hospitals in London; three ships before this one."
    brief: >-
      The sick and the hurt, the sick berth and the assistant surgeons (the Regulations, the
      Surgeon): the sick list to the captain each morning.
  - role: sailmaker
    post: true
    rank: warrant officer
    station: the sail room
    place: sail_room
    traits: [neat, slow, proud of their seams]
    history: "A sailmaker of Portsmouth yard before going to sea."
    brief: >-
      The sails, bent and unbent, their repair and the sail room's account.
  - role: master-at-arms
    post: true
    rank: petty officer
    station: the discipline
    place: deck
    traits: [upright, a soldier's bearing, misses nothing]
    history: "A serjeant of marines before being rated to the ship."
    brief: >-
      The ship's police: the rounds, the lights out, the small arms and the prisoners (the
      Regulations, the Master at Arms).
  - role: master's mate
    drawn: {station: forecastle, rating: able}
    rank: master's mate
    station: the master's assistant
    place: quarterdeck
    traits: [handy, keen on the sights, aims at a warrant]
    history: "An able seaman of the forecastle rated mate to the master this commission."
    brief: >-
      Assists the master in the observations and the reckoning (the Regulations, the Master,
      art. XXVIII), and keeps a watch by the bill.
    note: >-
      Three master's mates, the 64's column's three (the Regulations 1806 p. 165), able seamen
      of the forecastle (the Master, art. XXVIII: the mates and midshipmen assist in the
      observations).
  - role: master's mate
    drawn: {station: forecastle, rating: able}
    rank: master's mate
    station: the master's assistant
    place: quarterdeck
    traits: [older, steady, a good hand with the lead]
    history: "Twelve years before the mast and two as a mate."
    brief: >-
      As the first master's mate's.
  - role: master's mate
    drawn: {station: forecastle, rating: able}
    rank: master's mate
    station: the master's assistant
    place: quarterdeck
    traits: [young for it, quick at figures, a little vain of their quadrant]
    history: "Came to sea as a captain's servant; a midshipman five years before their rating."
    brief: >-
      As the first master's mate's; the log board in the night watches.
  - role: midshipman
    drawn: {station: afterguard, rating: landsman}
    messenger: true
    rank: midshipman
    station: the captain's messenger
    place: quarterdeck
    traits: [quick, fifteen, everywhere at once]
    history: "Two years in the ship; their father a lieutenant on half pay."
    brief: >-
      Carries the captain's word about the ship (pass the word for, send for), keeps a watch
      by the bill and learns the reckoning from the master.
    note: A midshipman as the captain's messenger, one of the boys of the afterguard.
  # the detachment's officers and serjeant (the 64's column: a captain, two lieutenants, two
  # serjeants, two corporals and a drummer; Ind §4.2), drawn from the eighty-four so that the
  # muster's count stands
  - role: captain of marines
    drawn: {station: marines, rating: marine}
    rank: captain of marines
    station: the marines
    place: quarterdeck
    traits: [formal, a soldier first, careful of the detachment's credit]
    history: "Twelve years in the corps, the last four afloat in ships of the line."
    brief: >-
      Commands the detachment: its sentries, its guard and its drill; at quarters the marines
      on the poop and the gangways under their officers, the fire by volley within musket shot,
      and the guard on the prisoners.
    note: The captain of marines, drawn from the detachment (one of the eighty-four).
  - role: lieutenant of marines
    drawn: {station: marines, rating: marine}
    rank: lieutenant of marines
    station: the marines
    place: quarterdeck
    traits: [upright, exact at the drill, a little apart from the sea officers]
    history: "Four years in the corps; a frigate's detachment before this one."
    brief: >-
      Under the captain of marines: the sentries at the cabin door, the spirit room and the
      gangway, the drill in the forenoon; at quarters the forecastle's file and the boarders'
      backbone.
    note: The lieutenant of marines, drawn from the detachment.
  - role: sergeant of marines
    drawn: {station: marines, rating: marine}
    rank: sergeant of marines
    station: the marines
    place: deck
    traits: [a loud voice, the halberd, twenty years' service]
    history: "A private in the last war; a serjeant since the peace."
    brief: >-
      Posts the sentries, takes the drill and the muster of the detachment, carries the
      halberd at quarters and leads the file on a boarding.
    note: The serjeant of marines, drawn from the detachment.
