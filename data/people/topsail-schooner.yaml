# FreeSail: the afterguard of the topsail schooner (spec M6 §2; package 40): the master,
# who is her captain in trade, the mate and the boatswain, with a boy to carry the word.
# The form and the reading are frigate-36.yaml's (see its head); the names are the
# muster's, drawn under the seed from the american list. The outlines are judgement: a
# Baltimore schooner's people, in the period's words where the sources give them.

ship: data/ships/topsail-schooner.yaml

# The harness's stations bound to a person by his role: in a vessel whose master commands
# the officer of the watch is the mate (spec M5 §29).
stations:
  captain: master
  officer of the watch: mate
  # the master's station is the mate's too (spec M6 §11; package 41): the schooner's
  # master commands her, and her mate keeps the reckoning in his place
  master: mate

wardroom:
  - role: master
    post: true
    rank: master and part owner
    station: the command
    place: quarterdeck
    traits: [close, a trader before a sailor, knows every price in the Channel]
    history: "Out of Baltimore; three voyages to the Channel ports under the American colours."
    brief: >-
      The vessel, her cargo and her people are his: the course and the standing orders, the
      pilot taken or declined, the market and the purse. He works the reckoning himself when
      the mate has the deck, and can work a lunar.
  - role: mate
    post: true
    rank: mate
    station: the mate's
    place: quarterdeck
    traits: [tough, a driver, no scholar but a seaman]
    history: "Before the mast in the West India trade; mate of this schooner two years."
    brief: >-
      The deck in his watch under the master's standing orders, the hands at their work,
      the sails and the gear; he reports every sail and every shift of wind, and takes the
      deck when the master gives it.
  - role: boatswain
    post: true
    rank: boatswain
    station: the rigging and the boat
    place: deck
    traits: [handy, cheerful, hard on a landsman]
    history: "A Chesapeake waterman before he went deep-sea."
    brief: >-
      The rigging, the cable, the anchors and the boat; the hands at the halyards and the
      sheets.
  - role: boy
    drawn: {station: afterguard, rating: landsman}
    messenger: true
    rank: boy
    station: the master's messenger
    place: quarterdeck
    traits: [small, willing, learning his letters from the master]
    history: "Shipped at Baltimore this voyage."
    brief: >-
      Carries the master's word about the vessel (pass the word for, send for).
    note: A boy as the messenger (judgement).
