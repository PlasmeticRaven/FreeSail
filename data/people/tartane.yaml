# FreeSail: the afterguard of the tartane Saint-Pierre (spec M6 §2; package 40; package 90, the
# tartane's builder, docs/design/Design-Ship-Tartane.md §6.4). Her station holders as people:
# the master (patron), who commands her, and the mate (second), with a boy to carry the word,
# the bilander's form (data/people/bilander.yaml) for a coasting trader of 100 tonneaux and ten
# hands. Each with their rank, their station aboard, their place when nothing calls them
# elsewhere, and a character outline (a few traits, a line of history and a station brief), as
# data, in the form of data/people/frigate-36.yaml. Read by freesail/world/people.py, which gives
# each person their outline and binds the harness's stations to a person by role, and by
# tools/ships/tartane.py, which draws the posts and the people below into the ship file's
# `crew.posts` and `crew.people`.
#
# The outlines are judgement, bred in the coasting trade of the Gulf of Lion and the coast of
# Provence that the tartanes sailed (Research-Tartane-2026-11.md §5), and name no one: the names
# are the muster's, drawn under the seed from the list her ship file names (`crew.names`, the
# spanish list: package 90's N1). A scenario names her people by `people:` (a role and a name).
#
# The form of an entry is the frigate-36's file's (role, post, drawn, messenger, rank, station,
# place, traits, history, brief, note).

ship: data/ships/tartane.yaml

# The harness's stations bound to a person by role: in a vessel whose master commands, the
# officer of the watch is the mate (spec M5 §29), and so is the master's station, as the
# bilander's and the smack's (a trader carries no master beside the one who commands her).
stations:
  captain: master
  officer of the watch: mate
  master: mate

wardroom:
  - role: master
    post: true
    # heads the larboard watch and hauls with it on deck where its whole number is under the
    # work's want (package 75, the lead's ruling 11 of 2026-11-13, the owner's word): a
    # merchantman's master and mate each head a watch; the sides JUDGEMENT, the bilander's
    watch: larboard
    rank: master
    station: the command
    place: quarterdeck
    traits: [weather-wise, close with the freight money, knows every cove from Agde to Toulon]
    history: "Bred to the coasting trade out of Marseilles; patron of this tartane five years."
    brief: >-
      The vessel, her cargo and her people under her owners' instructions: the course and the
      standing orders, the anchorage taken or passed, the freights and the market. Works the
      reckoning when the mate has the deck.
  - role: mate
    post: true
    # heads the starboard watch and hauls with it on deck where its whole number is under the
    # work's want (package 75, the lead's ruling 11 of 2026-11-13, the owner's word); the side
    # JUDGEMENT, the bilander's
    watch: starboard
    rank: mate
    station: the mate's
    place: quarterdeck
    traits: [patient, strong in the arm, quick to shift the great yard]
    history: "Before the mast in the Rhône's coasting trade; second of this tartane three years."
    brief: >-
      The deck in the mate's watch under the master's standing orders, the hands at their work,
      the great yard's change and the cargo stowed; reports every sail and every shift of wind,
      and takes the deck when the master gives it.
  - role: boy
    drawn: {station: afterguard, rating: ordinary}
    messenger: true
    rank: boy
    station: the master's messenger
    place: quarterdeck
    traits: [small, nimble aloft, homesick]
    history: "The patron's nephew, shipped at Marseilles; this voyage his second."
    brief: >-
      Carries the master's word about the vessel (pass the word for, send for).
    note: The mousse as the messenger (judgement, Tar-D §6.1), rated ordinary as the design rates him.
