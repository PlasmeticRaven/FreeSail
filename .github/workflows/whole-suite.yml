name: whole suite

# The whole suite, spread over several machines so that a merge is gated in twenty
# minutes or so instead of seventy on the build machine (the lead, 2026-10-28, on the
# owner's question of why a suite should take so long). Run by hand from the Actions tab
# or dispatched by the lead at a merge; never on a push, since the account's Actions
# minutes are finite (the note at the head of ci.yml). What it runs:
#   - the slow tier without the pace tests, in N shards (tests/conftest.py's
#     FREESAIL_SHARD: a stable split by xdist group, so a module-scoped day or passage
#     stays whole on one machine), each shard on all its runner's cores;
#   - the pace tests alone and last, on one runner, serial, as the release does, their
#     result informative and not gating (the floors are the build machine's);
#   - the browser plans, in a job of their own with a browser installed (from run 81; before
#     it every test that wants a browser skipped here);
#   - the lint once.
# Linux by default (the recorded passages are pinned on Linux); Windows as well when
# asked, for the owner's platform (package 69 has the five cross-platform pins).
# The Linux runner is pinned to ubuntu-24.04 (the lead, 2026-11-05): the floating image
# moved to 26.04 between runs 29 and 30 and nine recorded passages moved with it (a
# last-place difference in the system's libm: docs/dev/TuningNotes.md, "The hail as typed
# and as answered: the nine passages that moved in the cloud"); the pins are the 24.04
# machine's, and the image moves only when the lead moves it and re-measures.

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Also run the shards on Windows"
        type: boolean
        default: false

concurrency:
  group: whole-suite-${{ github.ref }}
  cancel-in-progress: true

env:
  SHARDS: "6"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,server]"
      - run: |
          python -m ruff check .
          python -m ruff format --check .

  slow:
    name: slow tier, shard ${{ matrix.shard }} of 6 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.windows && fromJSON('["ubuntu-24.04", "windows-latest"]') || fromJSON('["ubuntu-24.04"]') }}
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      FREESAIL_SHARD: ${{ matrix.shard }}/6
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,server]"
      - name: The slow tier, this shard, without the pace tests
        run: python -m pytest -n auto --dist loadgroup --slow -m "not pace" -rfE -p no:cacheprovider

  browser:
    # The browser plans (the lead, 2026-11-13). The runners have Playwright the package and
    # no browser, so every test that wants one skipped here in every run up to 77, and a
    # plan broken by a merge (the letter's, at package 109's step 1) passed unseen: run 77
    # was green on a tree where that plan failed. This job installs Chromium and plays the
    # plans, which judge the game's words and not its pixels; it fails if a plan is skipped.
    # The pictures' test and the truths that read pixels stay the build machines' (their
    # pins are the pre-installed browser's).
    name: the browser plans
    runs-on: ubuntu-24.04
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,server]"
      - run: python -m playwright install --with-deps chromium
      - name: The browser plans, none skipped
        run: |
          python -m pytest --slow -m "not pace" -rfEs -p no:cacheprovider tests/test_browser_probe.py | tee browser.txt
          if grep -q "SKIPPED" browser.txt; then echo "a browser plan was skipped"; exit 1; fi

  pace:
    # informative, not gating: the floors are the build machine's (truth 51), and a shared
    # cloud runner gives 480 to 520 where the build machine gives 580; the first run here
    # failed the gate day's floor by three ticks a second
    name: pace tests, alone, informative (${{ matrix.os }})
    needs: slow
    if: always()
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.windows && fromJSON('["ubuntu-24.04", "windows-latest"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,server]"
      - name: The pace tests, serial
        run: python -m pytest --slow -m pace -rfE -p no:cacheprovider
