name: checks

# The checks on every push of code. Kept cheap on purpose (2026-09-28: the first form
# of this file ran the whole suite twice, on two Pythons, on every push, documentation
# included, and used up the account's free Actions minutes in a day):
#   - a push that changes only documentation runs nothing;
#   - one Python (3.11, the owner's);
#   - the fast tier only (package 32c: `pytest` alone leaves out the tests marked slow,
#     the days sailed and replayed and the long truths; tests/conftest.py says which);
#     the whole suite, `--slow`, runs in the gate release workflow and at a package's end;
#   - on Linux and on Windows, the owner's platform, with UTF-8 as the owner runs it;
#   - the suite on all the runner's cores (pytest-xdist), each module-scoped fixture on
#     one worker (`--dist loadgroup`);
#   - a newer push to the same branch cancels the run of the older one, both jobs.
# The gate release workflow runs the whole suite on the gate commit.

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
      - ".mcp.json"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
      - ".mcp.json"

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fast tier (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        # bash on both: Git for Windows' bash is on the Windows runner. `python` there is
        # setup-python's 3.11 (the `py` launcher is not on the runner's path).
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,server]"
      - name: Lint (once, on Linux)
        if: runner.os == 'Linux'
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: The fast tier
        run: python -m pytest -n auto --dist loadgroup
