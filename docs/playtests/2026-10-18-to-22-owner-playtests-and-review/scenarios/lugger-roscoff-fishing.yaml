# FreeSail: a chasse-marée out of Roscoff (the owner's ask of 2026-10-17, for testing the
# lugger of package 43b). The three-masted lugger on the Éclair's lines, French, lying in the
# road of the Isle of Bas on a June morning with Roscoff's price list aboard and the coast
# of Léon to windward or to leeward as the day gives it; the world's business about her, the
# British cruisers off Ushant and the Lizard among it, so that a chasse-marée's day is what
# it was: the coasting trade under the land and a sharp eye to seaward. Her dipping lugs are
# dipped in the tack and the wear and by `dip the foresail` alone (primer, chapter 2). Given
# to either driver with --scenario:
#     py -m freesail.ui.server --scenario data/scenarios/lugger-roscoff.yaml
#     py -m freesail.ui.console --scenario data/scenarios/lugger-roscoff.yaml

name: A fishing chasse-marée in Roscoff
seed: 7
start: 1805-06-10T05:00
position: {lat_deg: 48.7356, lon_deg: -4.0160}   # the road of the Isle of Bas (Bellin; the port file's anchorage)
region: channel-west
nation: france
ship:
  file: data/ships/lugger.yaml
  heading_deg: 270
  glass: true
  instrument: octant
wind:
  gustiness: 0.3
  variability: 0.3

people:
  - {role: master, skill: 0.8}    # a Breton master who knows his coast

papers:
  chart: {year: 1804}
  epitome: moore
  almanac: 1805
  price_lists: [roscoff]

cargo:
  purse_pounds: 60

ports:
  - alderney
  - algeciras
  - angra
  - cadiz
  - ceuta
  - corunna
  - dartmouth
  - ferrol
  - funchal
  - gibraltar
  - horta
  - lagos
  - la-rochelle
  - le-palais
  - lisbon
  - lorient
  - morlaix
  - oporto
  - paimboeuf
  - ponta-delgada
  - porto-santo
  - rochefort
  - royan
  - santander
  - setubal
  - st-helier
  - st-malo
  - st-peter-port
  - tangier
  - tarifa
  - torbay
  - vigo
  - weymouth
  - falmouth
  - plymouth
  - brest
  - roscoff
  - st-marys

# The world's business (spec M6 §19; package 43b): the Channel's trade, fishermen and
# cruisers drawn under the seed, the British cruisers hostile to her flag.
business: on

# The crewed promotion's budget: how many ships beside hers are fully crewed at once, and
# within how many miles.
crewed: {cap: 6, range_nm: 5}

weather:
  climatology: true

orders:
  - let go the best bower
  - take a fix

# Who holds the stations: player (your seat), model (a model's door), rules (the game's
# own).
stations:
  captain: player
  officer: model
  master: model
  director: model

# The director above the game (spec M7b §4): the player's brief, a starter's name, a file or
# the brief itself, with its limits.
director:
  brief:
    name: A Nice Day for Fishing
    tone: >-
      A fishing chasse-marée is anchored in Roscoff, the purse low, the captain preparing to
      find good grounds to fish and get his haul. The day is quiet, a nice day for fishing.
    challenge: Nothing much, at least at first. What a fisherman might experience on the day itself.
    limits:
      wind_max_kn: 60
      enemy_heaviest: frigate-36
      nobody_dies: true
      the_war_as_it_is: true
      the_chart_as_it_is: true
    cadence: glass
    budget: {samples_a_day: 9999, acts_a_day: 9999}
