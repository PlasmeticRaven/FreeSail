[project]
name = "freesail"
version = "0.0.1"
description = "A ticked, text-first sailing simulation of a late-age-of-sail vessel of any rig."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
# The tests exercise both doors of the harness, so `dev` brings `agents` with it.
# The pictures' test (tests/test_pictures.py, package 45) drives the pre-installed Chromium through
# Playwright and decodes the PNGs with Pillow; it skips cleanly where either is missing. Never
# `playwright install` on the build machine: the browser is at PLAYWRIGHT_BROWSERS_PATH.
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "ruff==0.15.8", "freesail[agents]", "playwright>=1.49", "pillow>=10"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# The two doors of the agent harness (docs/agents/Harness.md): the Python MCP SDK for the
# MCP server (its version 2, where the server class is MCPServer, once FastMCP), and httpx
# for the local runner (and for the server's tests); and gguf, llama.cpp's reader of a
# model file's header (ReaderField.contents is in 0.16 and not in 0.10), for
# tools/context_budget.py (package 28d); the Anthropic SDK for the API door (package 42;
# its 1.x, streaming with the final message taken whole, and the thinking-binding
# controls) and keyring, through which the door reads its key from the platform's
# credential store.
agents = ["mcp>=2.2,<3", "httpx>=0.27", "gguf>=0.16", "anthropic>=1.13,<2", "keyring>=25"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["freesail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--dist loadgroup`: under `-n`, the tests that share a module-scoped fixture (a day, a
# passage, a sweep) go whole to one worker, so each is built once a run; without `-n` it
# does nothing. The groups and the two tiers are set in tests/conftest.py (package 32c).
addopts = "-q --dist loadgroup"
markers = [
    "slow: sails a day or replays one, or runs long; left out unless --slow (tests/conftest.py)",
    "pace: measures ticks a second against the build machine's floor; meant to run alone, after the rest, not beside a worker's day (tests/conftest.py; the release workflow runs them so)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
