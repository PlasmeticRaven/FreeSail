<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeSail · the library</title>
<link rel="stylesheet" href="/client/style.css">
</head>
<body class="library-window">
<!-- The library in a window of its own (package 33d): the same pane as the main page's,
     popped out so that it does not crowd the log. -->
<section id="library-panel" class="panel"></section>
<script src="/client/library.js"></script>
<script>
  (function () {
    "use strict";
    var pane = new window.LibraryPane(document.getElementById("library-panel"), { popped: true });
    pane.openHash(location.hash);
    window.addEventListener("hashchange", function () {
      pane.openHash(location.hash);
    });
  })();
</script>
</body>
</html>
